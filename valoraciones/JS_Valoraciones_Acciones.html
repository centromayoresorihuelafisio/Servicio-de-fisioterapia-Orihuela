      // valoraciones/JS_Valoraciones_Acciones.html - Valoraciones: deshacer, avisos, nueva valoracion, busqueda, tema y arranque
      // Se incluye dentro del unico <script> de valoraciones/Web_Vista, en este orden: JS_Valoraciones_Base, ui/JS_Modal_Deshacer, JS_Valoraciones_Acciones.
      // Sin scriptlets: include() no los evalua.

      // Deshacer (ui/JS_Modal_Deshacer): devuelve true si se restauró; si falla, el botón sigue disponible para reintentar.
      var deshacerValoraciones = Deshacer.crear({
        boton: document.getElementById('btnDeshacer'),
        toast: document.getElementById('toastDeshacer'),
        alDeshacer: function(snapshot) {
          ocupado(1);
          return llamar('restaurarValoracionWeb', [snapshot])
            .then(function(res) {
              ocupado(-1);
              if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return false; }
              cargar();
              return true;
            }, function(err) {
              ocupado(-1);
              mostrarAviso('Error al deshacer: ' + err);
              return false;
            });
        }
      });

      // ---------- Avisos ligeros (toasts): avisoFlotante de ui/JS_Modal_Deshacer, con el criterio de error de esta pestaña ----------
      // El mostrarAviso global (ui/JS_Secciones) va a este mientras Valoraciones es la sección activa.
      Secciones.registrar('valoraciones', {
        mostrarAviso: function(mensaje) { return avisoFlotante(mensaje, /^error|no se pudo|no se pudieron|bloqueado/i); }
      });

      // ---------- Nueva Valoración (formulario en la ficha lateral) ----------
      // El formulario (valoraciones/Panel_Valoracion) se monta dentro de la ficha, con el usuario seleccionado si lo hay.
      async function abrirFormularioValoracion() {
        var clave = pacienteSeleccionado || '';
        if (formularioActivo && formularioNombre === clave) return;   // ya está abierto para este usuario
        if (!(await descartarFormularioSiProcede())) return;
        var p = clave ? pacienteActual() : null, nombre = p ? p.nombre : '', el = document.getElementById('ficha');
        formularioActivo = true; formularioNombre = clave; controladorForm = null;
        document.body.classList.add('con-ficha');
        el.classList.add('abierta');
        el.setAttribute('aria-hidden', 'false');
        el.innerHTML = '<div class="ficha-form-cab"><button type="button" data-form="volver" title="' + (nombre ? 'Volver a la ficha (Esc)' : 'Cerrar (Esc)') + '"><span class="material-symbols-outlined">' + (nombre ? 'arrow_back' : 'close') + '</span></button><div class="ficha-form-tit"></div></div><div class="ficha-form-cuerpo"></div>';
        el.querySelector('.ficha-form-tit').textContent = 'Nueva valoración' + (nombre ? ' · ' + nombre : '');
        controladorForm = PanelValoracion.abrir(el.querySelector('.ficha-form-cuerpo'), {
          idPaciente: p ? p.idPaciente : '',
          paciente: nombre,
          dni: p && p.dni ? p.dni : '',
          telefono: p && p.telefono ? String(p.telefono) : '',
          onGuardado: function() {
            mostrarAviso('Valoración guardada');
            if (formularioActivo) { formularioActivo = false; controladorForm = null; renderFicha(); }
            cargar();
          },
          onCancelar: function() { volverDeFormulario(); }
        });
      }
      async function volverDeFormulario() {
        if (!formularioActivo) return;
        if (!(await descartarFormularioSiProcede())) return;
        formularioActivo = false; controladorForm = null;
        renderFicha();
      }
      document.getElementById('btnNuevaValoracion').addEventListener('click', abrirFormularioValoracion);
      document.getElementById('ficha').addEventListener('click', function(e) {
        if (e.target.closest('[data-form="volver"]')) volverDeFormulario();
      });

      // Si otra ventana actualiza un usuario (las páginas sueltas ?page=… avisan por localStorage al guardar) o
      // guarda una valoración desde el panel lateral (Agenda, Usuarios…), la tabla se recarga.
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado' || e.key === 'valoracionesActualizadas') cargar();
      });

      // ---------- Búsqueda ----------
      var temporizadorBusqueda = null;
      document.getElementById('inputBusqueda').addEventListener('input', function() {
        clearTimeout(temporizadorBusqueda);
        temporizadorBusqueda = setTimeout(render, 150);
      });

      // Esc vacía la búsqueda. Devuelve true si había texto.
      function limpiarBusqueda() {
        var inp = document.getElementById('inputBusqueda');
        clearTimeout(temporizadorBusqueda);
        if (!inp.value) return false;
        inp.value = '';
        render();
        return true;
      }
      // Con el cursor en la búsqueda: Esc la vacía y suelta el foco, sin cerrar el detalle que haya detrás.
      document.getElementById('inputBusqueda').addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.stopPropagation();
        limpiarBusqueda();
        this.blur();
      });

      // ---------- Tema: automático / oscuro / claro (común: ui/JS_Secciones) ----------
      Tema.conectar(document.getElementById('btnTema'));

      pintarGuardado();
      cargar();
