      // usuarios/JS_Usuarios_Base.html - Usuarios: datos, filtros, tabla, seleccion multiple y teclado
      // Se incluye dentro del unico <script> de principal/Principal_Vista, tras ui/JS_Modal_Deshacer y dentro del bloque de la sección
      // ((function() { … })(), fase 2 de la sección 20 de CONTEXTO.md), en este orden: JS_Usuarios_Base, JS_Usuarios_Ficha, JS_Usuarios_Acciones.
      // Sin scriptlets: include() no los evalua (la direccion de la app llega en URL_BASE_WEB, definida en la pagina).

      // Clases de <body> de esta sección (con-ficha, compacto…): solo se ven mientras es la activa (ui/JS_Secciones).
      var cuerpoSeccion = Secciones.cuerpo('usuarios');
      var TODOS = [];
      var HEADERS = [];
      var filtroEstados = []; // varios estados a la vez, o [NO_ALTA] (atajo «Todos menos alta»)
      var COL_HISTORIA = null;
      var pacienteSeleccionado = null; // { _fila, Nombre, ... } o null
      var filtroGravedad = null, filtroSinHC = false, filtroSinTel = false, filtroSinCitas = false;
      // Aviso «sin citas» (usuarios/Sin_Citas.gs, sección 23 de CONTEXTO.md): { idPaciente: { dias, desde, porInicio } } y el umbral.
      var SIN_CITAS = {}, SIN_CITAS_DIAS = 14;
      var filtroTipo = null, filtroPatologia = null, filtroZona = null; // zona (Columna, Hombro…) o una patología, nunca las dos
      var seleccionMultiple = new Set();
      var ordenCampo = null, ordenDir = 1; // 1 = asc, -1 = desc
      var ultimosFiltrados = [], filaActivaFila = null;

      // ---------- Carga de datos ----------
      // La primera carga es lo principal de la pestaña: al terminar (bien o mal) arrancan las precargas (ui/JS_Carga_Compartida).
      // Cada tabla que llega se guarda también para la próxima vez que se abra Usuarios en esta pestaña del navegador
      // (MemoriaPestanas, clave "tablaUsuarios"): al volver se pinta al momento (pintarGuardada) y se pide igualmente al servidor.
      function cargar(alReanclar) {
        llamar('obtenerBaseDatosCompletaWeb')
          .then(function(res) {
            OrdenCarga.principalLista();
            if (res.error) { mostrarError(res.error); return; }
            var t = Date.now();
            MemoriaPestanas.guardarLuego('tablaUsuarios', function() { return { d: res, t: t }; });
            aplicarTabla(res);
            if (typeof alReanclar === 'function') alReanclar();
            construirMenusFiltro();
            render();
            renderFicha();
          }, function(err) { OrdenCarga.principalLista(); mostrarError(err); });
      }
      function aplicarTabla(res) {
        HEADERS = res.headers || [];
        TODOS = res.pacientes || [];
        SIN_CITAS = res.sinCitas || {};
        if (res.sinCitasDias) SIN_CITAS_DIAS = res.sinCitasDias;
        COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });
        reanclarSeleccion();
      }
      function pintarGuardada() {
        var copia = MemoriaPestanas.leer('tablaUsuarios');
        if (!copia || !copia.datos || !copia.datos.pacientes) return;
        aplicarTabla(copia.datos);
        construirMenusFiltro();
        render();
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio"><span class="material-symbols-outlined" style="display:block;font-size:28px;margin-bottom:.4rem;color:var(--md-error)">error</span>No se pudo cargar la base de datos.<br>' + esc(err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      // ---------- Filtros y orden (botones solo con icono; lo que hacen y lo elegido van en su «title») ----------
      // VACIO = «Sin rellenar» (Gravedad, Derivación, Patología) y «Sin estado»; NO_ALTA = atajo «Todos menos alta» de Estado.
      var VACIO = '__vacio__', NO_ALTA = '__noAlta__', ZONA_OTRAS = 'Otras';
      var FILTROS_DEF = [
        { id: 'estado', etq: 'Estado', icono: 'label' },
        { id: 'gravedad', etq: 'Gravedad', icono: 'priority_high' },
        { id: 'pendientes', etq: 'Pendientes', icono: 'pending_actions' },
        { id: 'tipo', etq: 'Derivación', icono: 'alt_route' },
        { id: 'patologia', etq: 'Patología o zona', icono: 'medical_services' }
      ];
      // Formas de ordenar (botón «Ordenar» y cabeceras de la tabla). 'inicial' = sentido del primer clic; 'dir' = cómo se dice cada sentido.
      var ORDENES = [
        { id: 'prioridad', texto: 'Prioridad', icono: 'trending_up', inicial: -1, dir: { '1': 'De menor a mayor', '-1': 'De mayor a menor' } },
        { id: 'nombre', texto: 'Nombre', icono: 'sort_by_alpha', inicial: 1, dir: { '1': 'De la A a la Z', '-1': 'De la Z a la A' } },
        { id: 'edad', texto: 'Edad', icono: 'cake', inicial: 1, dir: { '1': 'De menor a mayor', '-1': 'De mayor a menor' } },
        { id: 'gravedad', texto: 'Gravedad', icono: 'priority_high', inicial: -1, dir: { '1': 'De leve a grave', '-1': 'De grave a leve' } },
        { id: 'estado', texto: 'Estado', icono: 'label', inicial: 1, dir: { '1': 'En el orden de la lista', '-1': 'En orden inverso' } },
        { id: 'inscripcion', texto: 'Inscripción', icono: 'event', inicial: 1, dir: { '1': 'Las más antiguas primero', '-1': 'Las más recientes primero' } }
      ];
      function ordenDef(id) { return ORDENES.filter(function(o) { return o.id === id; })[0] || null; }

      // Patologías individuales: cada campo puede traer varias separadas por , ; / | · + o salto de línea.
      var SEP_PAT = /\s*(?:[,;\/|·+]|\r?\n)\s*/;
      function patologiasDe(p) {
        var out = [], vistos = {};
        ['Patología 1', 'Patología 2'].forEach(function(campo) {
          dato(p, campo).split(SEP_PAT).forEach(function(s) {
            s = s.replace(/[.\s]+$/, '').trim();
            var k = normalizar(s);
            if (!k || vistos[k]) return;
            vistos[k] = true; out.push(s);
          });
        });
        return out;
      }
      // Zona de cada patología según la lista oficial (PATOLOGIAS_LISTA, core/Patologias.gs); lo escrito a mano va a «Otras».
      var PAT_OFICIAL = null;
      function patOficial() {
        if (!PAT_OFICIAL) {
          PAT_OFICIAL = { mapa: {}, zonas: [] };
          (typeof PATOLOGIAS_LISTA !== 'undefined' ? PATOLOGIAS_LISTA : []).forEach(function(x) {
            PAT_OFICIAL.mapa[normalizar(x.nombre)] = x;
            if (PAT_OFICIAL.zonas.indexOf(x.grupo) === -1) PAT_OFICIAL.zonas.push(x.grupo);
          });
          if (PAT_OFICIAL.zonas.indexOf(ZONA_OTRAS) === -1) PAT_OFICIAL.zonas.push(ZONA_OTRAS);   // la lista oficial ya puede traer su propio «Otras»
        }
        return PAT_OFICIAL;
      }
      function zonaDe(nombre) { var o = patOficial().mapa[normalizar(nombre)]; return o ? o.grupo : ZONA_OTRAS; }
      function zonasDe(p) { var out = []; patologiasDe(p).forEach(function(s) { var z = zonaDe(s); if (out.indexOf(z) === -1) out.push(z); }); return out; }

      function sinHC(p) { return !esUrl(COL_HISTORIA ? p[COL_HISTORIA] : ''); }
      function sinTelefono(p) { return !(dato(p, 'Teléfono 1') || dato(p, 'Teléfono 2')); }
      function sinCitas(p) { var id = p && p['ID paciente'] ? String(p['ID paciente']).trim() : ''; return id ? SIN_CITAS[id] || null : null; }
      function fechaSinCitas(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
      // Etiqueta ámbar junto al nombre: episodio abierto y SIN_CITAS_DIAS días o más sin citas, sin ninguna más adelante.
      function insigniaSinCitas(p) {
        var s = sinCitas(p);
        if (!s) return '';
        var t = s.porInicio ? 'Episodio abierto desde el ' + fechaSinCitas(s.desde) + ' y sin citas desde entonces'
          : 'Episodio abierto: la última cita fue el ' + fechaSinCitas(s.desde) + ' y no tiene ninguna más adelante';
        return '<span class="md-insignia md-insignia--aviso" title="' + esc(t + '. Dale una cita o el alta.') + '">Sin citas ' + s.dias + ' días</span>';
      }

      function estadoDe(p) { return (p['Estado'] || '').toString().trim(); }
      function tipoDe(p) { return normalizar(textoEstado(dato(p, 'Tipo de Ingreso'))); }
      function esAlta(e) { return claseParaEstado(e) === 'alta'; }
      // Estados que hay ahora en la tabla (VACIO si alguien no tiene ninguno).
      function estadosPresentes() {
        var out = [];
        TODOS.forEach(function(p) { var e = estadoDe(p) || VACIO; if (out.indexOf(e) === -1) out.push(e); });
        return out.sort(function(a, b) { return a === VACIO ? 1 : b === VACIO ? -1 : a.localeCompare(b, 'es'); });
      }
      function pasaEstado(p) {
        if (!filtroEstados.length) return true;
        var e = estadoDe(p);
        return filtroEstados[0] === NO_ALTA ? !esAlta(e) : filtroEstados.indexOf(e || VACIO) !== -1;
      }
      function pasaGravedad(p) {
        if (!filtroGravedad) return true;
        return filtroGravedad === VACIO ? !dato(p, 'Gravedad') : claseGravedad(dato(p, 'Gravedad')) === filtroGravedad;
      }
      function pasaTipo(p) {
        if (!filtroTipo) return true;
        var t = tipoDe(p);
        return filtroTipo === VACIO ? !t : t === normalizar(filtroTipo);
      }
      function pasaPatologia(p) {
        if (filtroZona) return zonasDe(p).indexOf(filtroZona) !== -1;
        if (!filtroPatologia) return true;
        var pats = patologiasDe(p);
        return filtroPatologia === VACIO ? !pats.length : pats.map(normalizar).indexOf(normalizar(filtroPatologia)) !== -1;
      }

      // 'excluir' permite calcular los contadores de un menú ignorando su propio filtro (conteo por facetas).
      function pasaFiltros(p, terminoNorm, excluir) {
        if (excluir !== 'estado' && !pasaEstado(p)) return false;
        if (excluir !== 'gravedad' && !pasaGravedad(p)) return false;
        if (excluir !== 'sinHC' && filtroSinHC && !sinHC(p)) return false;
        if (excluir !== 'sinTel' && filtroSinTel && !sinTelefono(p)) return false;
        if (excluir !== 'sinCitas' && filtroSinCitas && !sinCitas(p)) return false;
        if (excluir !== 'tipo' && !pasaTipo(p)) return false;
        if (excluir !== 'patologia' && !pasaPatologia(p)) return false;
        if (!terminoNorm) return true;
        // Los teléfonos se guardan solo con dígitos ("612345678") pero se ven como "612 34 56 78": si lo escrito parece un número,
        // se compara por dígitos para que se pueda buscar tal como se ve en pantalla.
        var dTerm = terminoNorm.replace(/\D/g, '');
        if (dTerm.length >= 3 && /^[\d\s+.\-]+$/.test(terminoNorm) &&
            ['Teléfono 1', 'Teléfono 2'].some(function(h) { return Telefono.clave(dato(p, h)).indexOf(dTerm) !== -1; })) return true;
        return HEADERS.some(function(h) { return normalizar(p[h]).indexOf(terminoNorm) !== -1; });
      }

      function cuentasFiltros() {
        var term = normalizar(document.getElementById('inputBusqueda').value);
        var base = function(ex) { return TODOS.filter(function(p) { return pasaFiltros(p, term, ex); }); };
        var c = { estado: {}, noAlta: 0, gravedad: { leve: 0, moderado: 0, grave: 0 }, tipo: {}, patologia: {}, zona: {}, vacio: { gravedad: 0, tipo: 0, patologia: 0 }, tot: {} };
        var b = base('estado'); c.tot.estado = b.length;
        b.forEach(function(p) { var e = estadoDe(p) || VACIO; c.estado[e] = (c.estado[e] || 0) + 1; if (!esAlta(estadoDe(p))) c.noAlta++; });
        b = base('gravedad'); c.tot.gravedad = b.length;
        b.forEach(function(p) { var v = dato(p, 'Gravedad'), g = claseGravedad(v); if (!v) c.vacio.gravedad++; else if (g) c.gravedad[g]++; });
        b = base('tipo'); c.tot.tipo = b.length;
        b.forEach(function(p) {
          var tx = textoEstado(dato(p, 'Tipo de Ingreso')), k = normalizar(tx);
          if (!k) { c.vacio.tipo++; return; }
          c.tipo[k] = c.tipo[k] || { texto: tx, n: 0 }; c.tipo[k].n++;
        });
        b = base('patologia'); c.tot.patologia = b.length;
        b.forEach(function(p) {
          var pats = patologiasDe(p);
          if (!pats.length) { c.vacio.patologia++; return; }
          pats.forEach(function(s) { var k = normalizar(s); c.patologia[k] = c.patologia[k] || { texto: s, n: 0, zona: zonaDe(s) }; c.patologia[k].n++; });
          zonasDe(p).forEach(function(z) { c.zona[z] = (c.zona[z] || 0) + 1; });
        });
        c.sinHC = base('sinHC').filter(sinHC).length;
        c.sinTel = base('sinTel').filter(sinTelefono).length;
        c.sinCitas = base('sinCitas').filter(sinCitas).length;
        return c;
      }

      // Estado admite varios a la vez: marcar uno estando en «Todos menos alta» parte de esa misma lista.
      function alternarEstado(e) {
        var pres = estadosPresentes();
        var lista = filtroEstados[0] === NO_ALTA ? pres.filter(function(x) { return x === VACIO || !esAlta(x); }) : filtroEstados.slice();
        var i = lista.indexOf(e);
        if (i === -1) lista.push(e); else lista.splice(i, 1);
        filtroEstados = pres.every(function(x) { return lista.indexOf(x) !== -1; }) ? [] : lista;
      }
      function nombreEstado(e) { return e === VACIO ? 'Sin estado' : textoEstado(e); }

      function itemsFiltro(id) {
        var c = cuentasFiltros(), it = [];
        var fin = function() { construirMenusFiltro(); render(); };
        var sinRellenar = function(n, marcado, fn) { return { icono: 'remove', texto: 'Sin rellenar', titulo: 'Usuarios sin este dato', n: n, marcado: marcado, fn: fn }; };
        if (id === 'estado') {
          var modo = filtroEstados[0] === NO_ALTA;
          it.push({ punto: '', texto: 'Todos', n: c.tot.estado, marcado: !filtroEstados.length, fn: function() { filtroEstados = []; fin(); } });
          it.push({ icono: 'person_check', texto: 'Todos menos alta', n: c.noAlta, marcado: modo, fn: function() { filtroEstados = modo ? [] : [NO_ALTA]; fin(); } });
          it.push({ sep: true });
          var claves = Object.keys(c.estado);
          if (!modo) filtroEstados.forEach(function(e) { if (claves.indexOf(e) === -1) { c.estado[e] = 0; claves.push(e); } });
          claves.sort(function(a, b) { return a === VACIO ? 1 : b === VACIO ? -1 : a.localeCompare(b, 'es'); }).forEach(function(e) {
            var marcado = modo ? (e === VACIO || !esAlta(e)) : filtroEstados.indexOf(e) !== -1;
            it.push({ punto: e === VACIO ? '' : claseParaEstado(e), texto: nombreEstado(e), titulo: 'Marca o desmarca: puedes elegir varios', n: c.estado[e], marcado: marcado,
              fn: function() { alternarEstado(e); fin(); abrirMenuFiltro('estado'); } });
          });
        } else if (id === 'gravedad') {
          var col = { leve: 'activo', moderado: 'espera', grave: 'contactara' };
          it.push({ punto: '', texto: 'Todas', n: c.tot.gravedad, marcado: !filtroGravedad, fn: function() { filtroGravedad = null; fin(); } });
          ['leve', 'moderado', 'grave'].forEach(function(g) {
            it.push({ punto: col[g], texto: g.charAt(0).toUpperCase() + g.slice(1), n: c.gravedad[g], marcado: filtroGravedad === g, fn: function() { filtroGravedad = g; fin(); } });
          });
          it.push({ sep: true }, sinRellenar(c.vacio.gravedad, filtroGravedad === VACIO, function() { filtroGravedad = VACIO; fin(); }));
        } else if (id === 'pendientes') {
          var alternar = function(fn) { return function() { fn(); fin(); abrirMenuFiltro('pendientes'); }; };
          it.push({ cabecera: 'Faltan datos' });
          it.push({ icono: 'folder_off', texto: 'Sin Historia Clínica', n: c.sinHC, marcado: filtroSinHC, fn: alternar(function() { filtroSinHC = !filtroSinHC; }) });
          it.push({ icono: 'phone_disabled', texto: 'Sin teléfono', n: c.sinTel, marcado: filtroSinTel, fn: alternar(function() { filtroSinTel = !filtroSinTel; }) });
          it.push({ sep: true }, { cabecera: 'Seguimiento' });
          it.push({ icono: 'event_busy', texto: 'Sin citas (' + SIN_CITAS_DIAS + ' días o más)', titulo: 'Episodio abierto y ' + SIN_CITAS_DIAS + ' días o más sin citas, sin ninguna más adelante',
            n: c.sinCitas, marcado: filtroSinCitas, fn: alternar(function() { filtroSinCitas = !filtroSinCitas; }) });
        } else if (id === 'tipo') {
          var actual = filtroTipo && filtroTipo !== VACIO ? normalizar(filtroTipo) : '';
          if (actual && !c.tipo[actual]) c.tipo[actual] = { texto: filtroTipo, n: 0 };
          it.push({ texto: 'Todas', n: c.tot.tipo, marcado: !filtroTipo, fn: function() { filtroTipo = null; fin(); } });
          Object.keys(c.tipo).sort(function(a, b) { return c.tipo[a].texto.localeCompare(c.tipo[b].texto, 'es'); }).forEach(function(k) {
            it.push({ texto: c.tipo[k].texto, n: c.tipo[k].n, marcado: actual === k, fn: function() { filtroTipo = c.tipo[k].texto; fin(); } });
          });
          it.push({ sep: true }, sinRellenar(c.vacio.tipo, filtroTipo === VACIO, function() { filtroTipo = VACIO; fin(); }));
        } else if (id === 'patologia') {
          // Agrupadas por zona: la fila de la zona elige la zona entera; debajo, sus patologías. Lo que no está en la lista oficial, en «Otras».
          var selPat = filtroPatologia && filtroPatologia !== VACIO ? normalizar(filtroPatologia) : '';
          if (selPat && !c.patologia[selPat]) c.patologia[selPat] = { texto: filtroPatologia, n: 0, zona: zonaDe(filtroPatologia) };
          if (filtroZona && !c.zona[filtroZona]) c.zona[filtroZona] = 0;
          var ponerPat = function(v) { filtroPatologia = v; filtroZona = null; fin(); };
          it.push({ texto: 'Todas', n: c.tot.patologia, marcado: !filtroPatologia && !filtroZona, fn: function() { ponerPat(null); } });
          it.push(sinRellenar(c.vacio.patologia, filtroPatologia === VACIO, function() { ponerPat(VACIO); }));
          patOficial().zonas.forEach(function(z) {
            var pats = Object.keys(c.patologia).filter(function(k) { return c.patologia[k].zona === z; });
            if (!pats.length && c.zona[z] === undefined) return;
            it.push({ sep: true });
            it.push({ icono: 'select_all', texto: z, titulo: 'Toda la zona: ' + z, fuerte: true, n: c.zona[z] || 0, marcado: filtroZona === z,
              fn: function() { filtroZona = z; filtroPatologia = null; fin(); } });
            pats.sort(function(a, b) { return c.patologia[a].texto.localeCompare(c.patologia[b].texto, 'es'); }).forEach(function(k) {
              var o = patOficial().mapa[k];
              it.push({ texto: c.patologia[k].texto, titulo: c.patologia[k].texto + (o && o.codigo ? ' · CIE-10 ' + o.codigo : ''), sangria: true,
                n: c.patologia[k].n, marcado: selPat === k, fn: function() { ponerPat(c.patologia[k].texto); } });
            });
          });
        } else if (id === 'orden') {
          it.push({ icono: 'table_rows', texto: 'Orden de la hoja', marcado: !ordenCampo, fn: function() { ordenCampo = null; ordenDir = 1; fin(); } });
          it.push({ sep: true }, { cabecera: 'Ordenar por' });
          ORDENES.forEach(function(o) {
            it.push({ icono: o.icono, texto: o.texto, marcado: ordenCampo === o.id, fn: function() { if (ordenCampo !== o.id) { ordenCampo = o.id; ordenDir = o.inicial; } fin(); } });
          });
          var od = ordenDef(ordenCampo);
          if (od) {
            it.push({ sep: true }, { cabecera: 'Sentido' });
            [od.inicial, -od.inicial].forEach(function(d) {
              it.push({ icono: d === 1 ? 'arrow_upward' : 'arrow_downward', texto: od.dir[String(d)], marcado: ordenDir === d, fn: function() { ordenDir = d; fin(); } });
            });
          }
        }
        return it;
      }

      function abrirMenuFiltro(id) {
        var btn = document.querySelector('#filtrosMenus [data-filtro="' + id + '"]');
        if (btn) abrirMenu(itemsFiltro(id), btn, true);
      }

      function quitarFiltros() {
        filtroEstados = []; filtroGravedad = null; filtroTipo = null; filtroPatologia = null; filtroZona = null;
        filtroSinHC = false; filtroSinTel = false; filtroSinCitas = false;
      }

      // Lo elegido en cada filtro, en palabras (va en el «title» del botón); '' = sin filtro.
      function valoresFiltros() {
        var lista = function(v) { return v.length > 2 ? v.slice(0, 2).join(', ') + ' y ' + (v.length - 2) + ' más' : v.join(', '); };
        return {
          estado: filtroEstados[0] === NO_ALTA ? 'Todos menos alta' : lista(filtroEstados.map(nombreEstado)),
          gravedad: filtroGravedad === VACIO ? 'Sin rellenar' : filtroGravedad ? filtroGravedad.charAt(0).toUpperCase() + filtroGravedad.slice(1) : '',
          pendientes: [filtroSinHC && 'Sin Historia Clínica', filtroSinTel && 'Sin teléfono', filtroSinCitas && 'Sin citas'].filter(Boolean).join(', '),
          tipo: filtroTipo === VACIO ? 'Sin rellenar' : filtroTipo || '',
          patologia: filtroZona ? 'Zona ' + filtroZona : filtroPatologia === VACIO ? 'Sin rellenar' : filtroPatologia || ''
        };
      }

      function botonFiltro(id, icono, titulo, on) {
        return '<button type="button" class="filtro-menu' + (on ? ' on' : '') + '" data-filtro="' + id + '" title="' + esc(titulo) + '" aria-label="' + esc(titulo) +
          '" aria-haspopup="menu" aria-expanded="false"><span class="material-symbols-outlined" aria-hidden="true">' + icono + '</span></button>';
      }

      function construirMenusFiltro() {
        var cont = document.getElementById('filtrosMenus');
        // Lo elegido que ya no existe en la tabla se suelta (p. ej. tras cambiar el último usuario de ese estado).
        if (filtroEstados.length && filtroEstados[0] !== NO_ALTA) {
          var pres = estadosPresentes();
          filtroEstados = filtroEstados.filter(function(e) { return pres.indexOf(e) !== -1; });
        }
        if (filtroTipo && filtroTipo !== VACIO && !TODOS.some(function(p) { return tipoDe(p) === normalizar(filtroTipo); })) filtroTipo = null;
        if (filtroPatologia && filtroPatologia !== VACIO && !TODOS.some(function(p) { return patologiasDe(p).map(normalizar).indexOf(normalizar(filtroPatologia)) !== -1; })) filtroPatologia = null;
        if (filtroZona && !TODOS.some(function(p) { return zonasDe(p).indexOf(filtroZona) !== -1; })) filtroZona = null;
        var val = valoresFiltros();
        var hay = FILTROS_DEF.some(function(f) { return val[f.id]; });
        var od = ordenDef(ordenCampo);
        cont.innerHTML = botonFiltro('orden', 'swap_vert', od ? 'Ordenado por ' + od.texto.toLowerCase() + ': ' + od.dir[String(ordenDir)].toLowerCase() : 'Ordenar la lista', !!od) +
          '<span class="filtros-sep" aria-hidden="true"></span>' +
          FILTROS_DEF.map(function(f) {
            var v = val[f.id];
            return botonFiltro(f.id, f.icono, v ? f.etq + ': ' + v : 'Filtrar por ' + f.etq.toLowerCase(), !!v);
          }).join('') +
          (hay ? '<button type="button" class="filtro-limpiar" data-filtro="limpiar" title="Quitar filtros" aria-label="Quitar filtros"><span class="material-symbols-outlined" aria-hidden="true">filter_alt_off</span></button>' : '');
      }

      document.getElementById('filtrosMenus').addEventListener('click', function(e) {
        var b = e.target.closest('[data-filtro]');
        if (!b) return;
        if (b.dataset.filtro === 'limpiar') { quitarFiltros(); construirMenusFiltro(); render(); return; }
        abrirMenuFiltro(b.dataset.filtro);
      });

      // ---------- Recordar filtros y orden durante la sesión ----------
      var CLAVE_VISTA = 'bdVista';
      function guardarVista() {
        try {
          sessionStorage.setItem(CLAVE_VISTA, JSON.stringify({ q: document.getElementById('inputBusqueda').value, e: filtroEstados, g: filtroGravedad,
            hc: filtroSinHC, tl: filtroSinTel, sc: filtroSinCitas, t: filtroTipo, p: filtroPatologia, z: filtroZona, oc: ordenCampo, od: ordenDir }));
        } catch (err) { /* sin almacenamiento */ }
      }
      function restaurarVista() {
        try {
          var v = JSON.parse(sessionStorage.getItem(CLAVE_VISTA) || 'null');
          if (!v) return;
          document.getElementById('inputBusqueda').value = v.q || '';
          // 'e' era un solo estado (texto) antes de poder elegir varios.
          filtroEstados = Array.isArray(v.e) ? v.e.filter(Boolean) : v.e ? [v.e] : [];
          filtroGravedad = v.g === 'urgente' ? 'grave' : (v.g || null); filtroSinHC = !!v.hc; filtroSinTel = !!v.tl; filtroSinCitas = !!v.sc;
          filtroTipo = v.t || null; filtroPatologia = v.p || null; filtroZona = v.z || null;
          if (v.oc && ordenDef(v.oc)) { ordenCampo = v.oc; ordenDir = v.od === -1 ? -1 : 1; }
        } catch (err) { /* sin almacenamiento */ }
      }

      function claseParaEstado(estado) {
        var e = normalizar(estado);
        if (e.indexOf('activo') !== -1) return 'activo';
        if (e.indexOf('espera') !== -1) return 'espera';
        if (e.indexOf('contactar') !== -1) return 'contactara';
        if (e.indexOf('alta') !== -1) return 'alta';
        if (e.indexOf('responde') !== -1) return 'no-responde';
        return '';
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }

      // ================= Tabla de dos líneas, ficha lateral y estado en línea =================
      var fichaAbierta = false, CACHE_HDR = {};

      function esc(t) { return (t === null || t === undefined ? '' : String(t)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
      function hdr(nombre) {
        if (!(nombre in CACHE_HDR)) { var n = normalizar(nombre); CACHE_HDR[nombre] = HEADERS.find(function(h) { return normalizar(h) === n; }) || null; }
        return CACHE_HDR[nombre];
      }
      function dato(p, nombre) { var h = hdr(nombre); if (!h) return ''; var v = p[h]; return (v === null || v === undefined) ? '' : String(v).trim(); }
      function textoEstado(e) { var s = String(e || ''); return s.replace(/^[^\p{L}\p{N}]+/u, '').trim() || s; }
      function edadTxt(p) { var e = dato(p, 'Edad'); return /^\d+$/.test(e) ? e + ' años' : e; }
      function claseGravedad(v) { var n = normalizar(v); return n.indexOf('leve') !== -1 ? 'leve' : n.indexOf('moderad') !== -1 ? 'moderado' : (n.indexOf('grave') !== -1 || n.indexOf('urgent') !== -1) ? 'grave' : ''; }
      // Chip de gravedad pulsable (menú para cambiarla, como el de estado).
      function chipGravedad(v, fila) {
        return '<button type="button" class="chip-g gravedad-btn ' + claseGravedad(v) + '" data-gravedad-fila="' + fila + '" aria-haspopup="menu" title="Cambiar gravedad">' +
          esc(textoEstado(v)) + '<span class="material-symbols-outlined">expand_more</span></button>';
      }
      // Chip de tipo de ingreso (aquí solo se muestra; se cambia desde el chip de la ficha o en Editar). Con borde y sin color,
      // para no competir con la gravedad. Icono y texto corto de FichaUsuario.ingresoDatos (ui/JS_Ficha, fuente única).
      function chipTipoIngreso(v) {
        var d = FichaUsuario.ingresoDatos(v);
        return '<span class="md-insignia md-insignia--borde" title="Tipo de ingreso: ' + esc(d.completo) + '">' +
          (d.icono ? '<span class="material-symbols-outlined" aria-hidden="true">' + d.icono + '</span>' : '') + esc(d.corto) + '</span>';
      }

      function formatearTel(t) { return Telefono.formato(t); }   // regla única: ui/JS_Telefono.html

      // avatarHtml(nombre, extra): común, en ui/JS_Secciones.

      // Columna A: puntuación de prioridad que escribe "Ordenar Usuarios" (ordenarPacientes,
      // en usuarios/BaseDatos.gs). Se localiza por posición (primera columna), no por nombre,
      // para no depender de cómo esté titulada esa columna en tu hoja.
      function colPrioridad() { return HEADERS.length ? HEADERS[0] : null; }
      function prioridadNum(p) {
        var h = colPrioridad();
        if (!h) return null;
        var n = parseFloat(p[h]);
        return isNaN(n) ? null : n;
      }
      function prioridadTxt(p) { var n = prioridadNum(p); return n === null ? '—' : n.toFixed(2); }

      function badgeEstado(p) {
        var e = dato(p, 'Estado');
        return '<button type="button" class="badge estado-btn ' + claseParaEstado(e) + '" data-estado-fila="' + p._fila + '" title="Cambiar estado">' +
          (e ? esc(textoEstado(e)) : 'Sin estado') + '<span class="material-symbols-outlined">expand_more</span></button>';
      }

      // SVG_WHATSAPP (icono de WhatsApp): común, en ui/JS_Secciones.

      function contenidoIcono(icono) { return icono === 'whatsapp' ? SVG_WHATSAPP : '<span class="material-symbols-outlined">' + icono + '</span>'; }

      function btnFila(acc, p, icono, titulo, extra, atributos) {
        return '<button type="button" class="btn-fila ' + (extra || '') + (icono === 'whatsapp' ? ' btn-whatsapp' : '') + '" data-acc="' + acc + '" data-fila="' + p._fila + '" title="' + esc(titulo) + '"' + (atributos || '') + '>' + contenidoIcono(icono) + '</button>';
      }

      function resalta(txt, termino) {
        var s = esc(txt || '');
        if (!termino) return s;
        try {
          var re = new RegExp('(' + termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
          return s.replace(re, '<mark>$1</mark>');
        } catch (err) { return s; }
      }

      function htmlFila(p, termino) {
        var t1 = dato(p, 'Teléfono 1'), t2 = dato(p, 'Teléfono 2'), grav = dato(p, 'Gravedad'), tipo = dato(p, 'Tipo de Ingreso');
        var pats = patologiasDe(p).join(' · ');
        var tieneHC = esUrl(COL_HISTORIA ? p[COL_HISTORIA] : '');
        var habitual = formatoNombreVisible(dato(p, 'Nombre habitual'));   // «Mari Carmen» (la hoja sigue en mayúsculas)
        var sel = pacienteSeleccionado && pacienteSeleccionado._fila === p._fila;
        var enLote = seleccionMultiple.has(p._fila);
        var tel = function(t, cls) { return t ? '<span class="' + cls + ' copiable" data-copiar="' + esc(Telefono.digitos(t) || t) + '" data-etiqueta="Teléfono" title="Copiar">' + resalta(formatearTel(t), termino) + '</span>' : ''; };
        return '<tr data-fila="' + p._fila + '" class="' + (sel ? 'seleccionada ' : '') + (enLote ? 'seleccion-multiple' : '') + '">' +
          '<td class="col-check"><input type="checkbox" class="chk-fila" data-fila="' + p._fila + '"' + (enLote ? ' checked' : '') + '></td>' +
          '<td class="col-usuario"><div class="celda-u">' + avatarHtml(p['Nombre']) + '<div class="doble"><div class="u-linea"><div class="u-nombre"' + (habitual ? ' title="' + esc(p['Nombre'] + ' (' + habitual + ')') + '"' : '') + '>' + resalta(p['Nombre'], termino) + '</div>' + insigniaSinCitas(p) + '</div><div class="u-sub">' +
            (habitual ? '<span title="Nombre habitual (cómo le gusta que le llamen)">(' + resalta(habitual, termino) + ')</span>' + (dato(p, 'DNI') || edadTxt(p) ? ' · ' : '') : '') +
            (resalta([dato(p, 'DNI'), edadTxt(p)].filter(Boolean).join(' · '), termino) || (habitual ? '' : '—')) + '</div></div></div></td>' +
          '<td data-label="Contacto" class="col-contacto"><div class="doble">' + (tel(t1, '') || '<span class="vacio">—</span>') + (t2 ? '<div class="c-sub">' + tel(t2, '') + '</div>' : '') + '</div></td>' +
          '<td data-label="Clínico" class="col-clinico"><div class="doble"><div class="cl-pat" title="' + esc(pats) + '">' + (pats ? resalta(pats, termino) : '<span class="vacio">—</span>') + '</div><div class="c-sub">' +
            (grav ? chipGravedad(grav, p._fila) : '') + (tipo ? chipTipoIngreso(tipo) : '') + '</div></div></td>' +
          '<td data-label="Estado" class="col-estado">' + badgeEstado(p) + '</td>' +
          '<td data-label="Prioridad" class="celda-prioridad">' + esc(prioridadTxt(p)) + '</td>' +
          '<td data-label="Inscripción">' + (dato(p, 'Fecha inscripción') ? esc(dato(p, 'Fecha inscripción')) : '<span class="vacio">—</span>') + '</td>' +
          '<td class="acciones-fila"><span class="acc-pill">' +
            btnFila('hc', p, 'description', tieneHC ? 'Abrir Historia Clínica' : 'Sin Historia Clínica · clic para crearla', tieneHC ? 'con-hc' : 'sin-hc') +
            btnFila('whatsapp', p, 'whatsapp', 'Abrir WhatsApp') + btnFila('cita', p, 'event', 'Nueva cita') + btnFila('editar', p, 'edit', 'Editar') +
            btnFila('valoracion', p, 'assignment', 'Valoración') + btnFila('alta', p, 'how_to_reg', 'Dar de alta') +
            btnFila('eliminar', p, 'delete', 'Eliminar usuario', 'peligro', ' data-rol="administrador"') +   // eliminar es solo del administrador (decisión 2 de 17.8)
          '</span></td></tr>';
      }

      function render() {
        var termino = document.getElementById('inputBusqueda').value.trim();
        var terminoNorm = normalizar(termino);
        guardarVista();
        var filtrados = TODOS.filter(function(p) { return pasaFiltros(p, terminoNorm); });
        filtrados = ordenarFiltrados(filtrados);
        ultimosFiltrados = filtrados;
        document.getElementById('contador').textContent = filtrados.length + ' de ' + TODOS.length;
        var cont = document.getElementById('tablaWrap'), scroll = cont.scrollTop;

        if (TODOS.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">group_off</span>' +
            'Todavía no hay usuarios registrados.<button title="Añadir un usuario nuevo" type="button" class="btn-toolbar primario" id="btnVacioNuevo"><span class="material-symbols-outlined">person_add</span> Añadir usuario</button></div>';
          document.getElementById('btnVacioNuevo').addEventListener('click', function() { document.getElementById('btnNuevoPaciente').click(); });
          return;
        }
        if (filtrados.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">search_off</span>' +
            'No se encontró ningún usuario con ese criterio.<button title="Quitar filtros y búsqueda" type="button" class="btn-toolbar" id="btnVacioLimpiar">Quitar filtros</button></div>';
          document.getElementById('btnVacioLimpiar').addEventListener('click', function() {
            document.getElementById('inputBusqueda').value = '';
            quitarFiltros();
            construirMenusFiltro(); render();
          });
          return;
        }
        cont.innerHTML = '<table><thead><tr>' +
          '<th class="col-check"><input type="checkbox" class="chk-todo" title="Seleccionar todos los visibles"' + (todosVisiblesSeleccionados(filtrados) ? ' checked' : '') + '></th>' +
          thCol('nombre', 'Usuario', 'col-usuario') + '<th>Contacto</th><th>Clínico</th>' + thCol('estado', 'Estado') + thCol('prioridad', 'Prioridad') + thCol('inscripcion', 'Inscripción') + '<th class="col-acciones"></th></tr></thead><tbody>' +
          filtrados.map(function(p) { return htmlFila(p, termino); }).join('') + '</tbody></table>';
        cont.scrollTop = scroll;
        marcarFilaActiva();
      }

      function thCol(campo, texto, clase) {
        var dir = ordenCampo === campo ? (ordenDir === 1 ? 'orden-asc' : 'orden-desc') : '';
        return '<th class="ordenable ' + (clase || '') + ' ' + dir + '" data-orden="' + campo + '">' + texto + '<span class="material-symbols-outlined">arrow_upward</span></th>';
      }

      function parseFechaEs(s) {
        var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || '');
        return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : -Infinity;
      }

      function ordenarFiltrados(lista) {
        if (!ordenCampo) return lista;
        var estados = estadosDisponibles(), pesoG = { leve: 1, moderado: 2, grave: 3 };
        // Cada clave devuelve null cuando falta el dato: esos usuarios van siempre al final, sea cual sea el sentido.
        var claves = { nombre: function(p) { return normalizar(p['Nombre']) || null; },
          estado: function(p) { var i = estados.indexOf(dato(p, 'Estado')); return i === -1 ? null : i; },
          prioridad: function(p) { return prioridadNum(p); },
          edad: function(p) { var e = dato(p, 'Edad'); return /^\d+$/.test(e) ? Number(e) : null; },
          gravedad: function(p) { return pesoG[claseGravedad(dato(p, 'Gravedad'))] || null; },
          inscripcion: function(p) { var t = parseFechaEs(dato(p, 'Fecha inscripción')); return t === -Infinity ? null : t; } };
        var clave = claves[ordenCampo];
        if (!clave) return lista;
        return lista.slice().sort(function(a, b) {
          var x = clave(a), y = clave(b);
          if (x === null || y === null) return x === y ? 0 : x === null ? 1 : -1;
          return (x < y ? -1 : x > y ? 1 : 0) * ordenDir;
        });
      }

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var th = e.target.closest('th.ordenable');
        if (!th) return;
        // Ciclo: sentido inicial → inverso → sin orden (vuelve al orden de la hoja). El sentido inicial de cada campo está en ORDENES.
        var campo = th.dataset.orden, od = ordenDef(campo), inicial = od ? od.inicial : 1;
        if (ordenCampo !== campo) { ordenCampo = campo; ordenDir = inicial; }
        else if (ordenDir === inicial) ordenDir = -inicial;
        else { ordenCampo = null; ordenDir = 1; }
        construirMenusFiltro(); render();
      });

      function refrescarVista() { construirMenusFiltro(); render(); renderFicha(); }

      // Tras recargar (p. ej. después de ordenar) las filas cambian de número: se vuelve a localizar la selección por nombre y DNI.
      function reanclarSeleccion() {
        CACHE_HDR = {};
        if (!pacienteSeleccionado) return;
        var n = pacienteSeleccionado['Nombre'], d = pacienteSeleccionado['DNI'] || '';
        pacienteSeleccionado = TODOS.find(function(p) { return p['Nombre'] === n && (p['DNI'] || '') === d; }) || null;
        if (!pacienteSeleccionado) fichaAbierta = false;
      }

      // ---------- Selección múltiple (checkboxes + acciones en lote) ----------
      function todosVisiblesSeleccionados(lista) { return lista.length > 0 && lista.every(function(p) { return seleccionMultiple.has(p._fila); }); }

      function actualizarBarraLote() {
        var n = seleccionMultiple.size, barra = document.getElementById('barraLote');
        cuerpoSeccion.classList.toggle('seleccion-activa', n > 0);
        barra.classList.toggle('visible', n > 0);
        document.getElementById('bloteN').textContent = n;
      }

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var chk = e.target.closest('.chk-fila, .chk-todo');
        if (!chk) return;
        e.stopPropagation();
        if (chk.classList.contains('chk-todo')) {
          if (todosVisiblesSeleccionados(ultimosFiltrados)) ultimosFiltrados.forEach(function(p) { seleccionMultiple.delete(p._fila); });
          else ultimosFiltrados.forEach(function(p) { seleccionMultiple.add(p._fila); });
        } else {
          var f = Number(chk.dataset.fila);
          if (chk.checked) seleccionMultiple.add(f); else seleccionMultiple.delete(f);
        }
        render();
        actualizarBarraLote();
      });

      document.getElementById('bloteCancelar').addEventListener('click', function() { seleccionMultiple.clear(); render(); actualizarBarraLote(); });

      document.getElementById('bloteEstado').addEventListener('click', function(e) {
        abrirMenu(estadosDisponibles().map(function(est) {
          return { punto: claseParaEstado(est), texto: textoEstado(est), fn: function() { cambiarEstadoLote(est); } };
        }), e.currentTarget);
      });

      function cambiarEstadoLote(valor) {
        if (claseParaEstado(valor) === 'alta') { mostrarAviso('Da de alta a cada usuario por separado desde su ficha: el alta actualiza también fechas e Historia Clínica.'); return; }
        var filas = Array.from(seleccionMultiple), hEst = hdr('Estado') || 'Estado';
        var antes = {};
        filas.forEach(function(f) { var p = TODOS.find(function(x) { return x._fila === f; }); if (p) { antes[f] = p[hEst]; p[hEst] = valor; } });
        render();
        llamar('cambiarEstadoLoteWeb', [filas.map(idDeFila), valor])
          .then(function(res) {
            if (!res || !res.success) {
              filas.forEach(function(f) { var p = TODOS.find(function(x) { return x._fila === f; }); if (p && f in antes) p[hEst] = antes[f]; });
              render();
              mostrarAviso((res && res.message) || 'No se pudo cambiar el estado.');
              return;
            }
            mostrarAviso('Estado cambiado a ' + textoEstado(valor) + ' en ' + filas.length + (filas.length === 1 ? ' usuario.' : ' usuarios.'));
            if (res.ordenado) cargar();   // el servidor reordenó la hoja: se recarga para ver el orden nuevo (la selección y la ficha se reanclan por ID)
          }, function(err) { cargar(); mostrarAviso('Error al cambiar el estado: ' + err); });
      }

      document.getElementById('bloteEliminar').addEventListener('click', async function() {
        var filas = Array.from(seleccionMultiple);
        if (!filas.length) return;
        var confirmado = await mostrarConfirm('¿Eliminar a ' + filas.length + (filas.length === 1 ? ' usuario? Se borrará toda su ficha.' : ' usuarios? Se borrará toda su ficha de cada uno.'));
        if (!confirmado) return;
        // Copia de cada ficha ANTES de borrar, en orden de fila, para poder deshacer.
        var copias = filas.map(function(f) { return TODOS.find(function(x) { return x._fila === f; }); })
          .filter(Boolean).map(function(p) { return Object.assign({}, p); })
          .sort(function(a, b) { return a._fila - b._fila; });
        llamar('eliminarPacientesLoteWeb', [copias.map(idPaciente)])
          .then(function(res) {
            seleccionMultiple.clear();
            actualizarBarraLote();
            cargar();
            if (res && res.success && copias.length) deshacerUsuarios.mostrar(copias, (res.message) || (copias.length + (copias.length === 1 ? ' usuario eliminado.' : ' usuarios eliminados.')));
            else mostrarAviso((res && res.message) || (res && res.success ? 'Usuarios eliminados.' : 'No se pudo eliminar.'));
          }, function(err) { cargar(); mostrarAviso('Error al eliminar: ' + err); });
      });

      // ---------- Navegación por teclado ----------
      function marcarFilaActiva() {
        document.querySelectorAll('tbody tr').forEach(function(tr) { tr.classList.toggle('fila-activa', Number(tr.dataset.fila) === filaActivaFila); });
      }
      function moverFilaActiva(delta) {
        if (!ultimosFiltrados.length) return;
        var idx = ultimosFiltrados.findIndex(function(p) { return p._fila === filaActivaFila; });
        idx = Math.min(ultimosFiltrados.length - 1, Math.max(0, idx + delta));
        filaActivaFila = ultimosFiltrados[idx]._fila;
        marcarFilaActiva();
        var el = document.querySelector('tr[data-fila="' + filaActivaFila + '"]');
        if (el) el.scrollIntoView({ block: 'nearest' });
      }
      document.addEventListener('keydown', function(e) {
        if (Secciones.activa() !== 'usuarios') return;        // atajos solo con Usuarios a la vista
        if (document.querySelector('dialog[open]')) return;   // el diálogo gestiona su teclado
        if (menuItems) { tecladoMenu(e); return; }
        var enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
        if (e.key === '/' && !enCampo) { e.preventDefault(); document.getElementById('inputBusqueda').focus(); return; }
        if (enCampo) return;
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moverFilaActiva(e.key === 'ArrowDown' ? 1 : -1); }
        else if (e.key === 'Enter' && filaActivaFila !== null) { alternarFicha(filaActivaFila); }
      });

      // ---------- Atajos de teclado (ayuda) ----------
      document.getElementById('btnAtajos').addEventListener('click', function(e) {
        var d = document.createElement('div'); d.className = 'menu-atajos';
        d.innerHTML = '<dl>' +
          '<dt><kbd>/</kbd></dt><dd>Buscar</dd>' +
          '<dt><kbd>&uarr;</kbd> <kbd>&darr;</kbd></dt><dd>Moverse por la lista</dd>' +
