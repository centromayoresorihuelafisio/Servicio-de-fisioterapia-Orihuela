    <script>
        // Logica para mostrar el valor del slider
        function updateSliderValue(sliderId, valueSpanId) {
            const slider = document.getElementById(sliderId);
            const valueSpan = document.getElementById(valueSpanId);
            if (slider && valueSpan) {
                const getDisplayValue = (value) => value === '-1' ? '—' : value;
                valueSpan.textContent = getDisplayValue(slider.value);
                slider.addEventListener('input', () => {
                    valueSpan.textContent = getDisplayValue(slider.value);
                });
            }
        }
        
        const analgesicosDescriptions = [
            "Sin registrar", "Ninguno", "Ocasional (menos de 1 vez por semana)", 
            "Semanal (1–2 veces por semana)", "Habitual (casi todos los días)", 
            "Diario (1 vez al día)", "Varios al día"
        ];

        function updateSliderAndDescription(sliderId, valueSpanId, descriptionSpanId) {
            const slider = document.getElementById(sliderId);
            const valueSpan = document.getElementById(valueSpanId);
            const descriptionSpan = document.getElementById(descriptionSpanId);
            if (slider && valueSpan && descriptionSpan) {
                const updateDisplay = () => {
                    const sliderValue = parseInt(slider.value, 10);
                    const descIndex = sliderValue + 1; 
                    const displayValue = sliderValue === -1 ? '—' : sliderValue.toString();
                    valueSpan.textContent = displayValue;
                    descriptionSpan.textContent = analgesicosDescriptions[descIndex];
                };
                updateDisplay();
                slider.addEventListener('input', updateDisplay);
            }
        }

        window.addEventListener('load', () => {
            updateSliderValue('pegDolor', 'pegDolorValue');
            updateSliderValue('pegActividad', 'pegActividadValue');
            updateSliderValue('pegVida', 'pegVidaValue');
            updateSliderValue('columnaLevantarse', 'columnaLevantarseValue');
            updateSliderValue('columnaAgacharse', 'columnaAgacharseValue');
            updateSliderValue('msVestirse', 'msVestirseValue');
            updateSliderValue('msAlcanzar', 'msAlcanzarValue');
            updateSliderValue('miCaminar', 'miCaminarValue');
            updateSliderValue('miEscaleras', 'miEscalerasValue');
            updateSliderValue('miSilla', 'miSillaValue');
            updateSliderAndDescription('analgesicos', 'analgesicosValue', 'analgesicosDescription');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const collapsibleHeaders = document.querySelectorAll('.collapsible-header');
            collapsibleHeaders.forEach(header => {
                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const content = header.nextElementSibling;
                    if (content && content.classList.contains('collapsible-content')) {
                        const isOpen = content.classList.toggle('open');
                        header.classList.toggle('open', isOpen);
                    }
                });
            });
        });

        function handleFormSubmit(formObject) {
            event.preventDefault();
            const form = document.getElementById('valoracionForm');
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            for (const key in data) {
                const value = data[key];
                if (key === 'nombre') continue;
                if (value === "-1") {
                    data[key] = ""; 
                } else {
                    data[key] = parseFloat(value);
                }
            }

            const submitButton = document.getElementById('submitButton');
            const messageBox = document.getElementById('messageBox');
            submitButton.disabled = true;
            submitButton.textContent = 'Guardando...';
            submitButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            submitButton.classList.add('bg-gray-400', 'cursor-not-allowed');
            messageBox.style.display = 'none';

            if (typeof google === 'undefined' || typeof google.script === 'undefined' || typeof google.script.run === 'undefined') {
                messageBox.textContent = "Error: La API de Apps Script no está disponible.";
                messageBox.classList.add('bg-red-200', 'text-red-800');
                messageBox.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Guardar Valoración';
                submitButton.classList.remove('bg-gray-400', 'cursor-not-allowed');
                submitButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
                return;
            }

            google.script.run
                .withSuccessHandler(result => {
                    messageBox.textContent = result;
                    messageBox.classList.add('bg-green-200', 'text-green-800');
                    messageBox.style.display = 'block';
                    form.reset();
                    submitButton.disabled = false;
                    submitButton.textContent = 'Guardar Valoración';
                    submitButton.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    submitButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    document.querySelectorAll('input[type="range"]').forEach(slider => {
                      const valueSpan = document.getElementById(slider.id + 'Value');
                      if(valueSpan) valueSpan.textContent = '—';
                    });
                    const analgesicosDescription = document.getElementById('analgesicosDescription');
                    if(analgesicosDescription) analgesicosDescription.textContent = analgesicosDescriptions[0];
                })
                .withFailureHandler(error => {
                    messageBox.textContent = "Error: " + error.message;
                    messageBox.classList.add('bg-red-200', 'text-red-800');
                    messageBox.style.display = 'block';
                    submitButton.disabled = false;
                    submitButton.textContent = 'Guardar Valoración';
                    submitButton.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    submitButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
                })
                .procesarValoracion(data);
        }
    </script>
