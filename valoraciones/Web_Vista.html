    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,300..700,0..1&display=swap" rel="stylesheet">

  <body>
    <?!= incluirAcceso_('valoraciones'); ?>

    <header class="top">
      <!-- Cabecera comun: titulo · buscador · espacio · Deshacer · tema · accion principal (ui/CSS_Global .cabecera-fila) -->
      <div class="cabecera-fila">
        <h1 class="cabecera-titulo"><span class="material-symbols-outlined">monitoring</span> Valoraciones <span class="contador" id="contador"></span></h1>
        <div class="buscador">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="inputBusqueda" placeholder="Buscar por usuario…  ( / )">
        </div>
        <span class="cabecera-espacio"></span>
        <button class="btn-toolbar deshacer" id="btnDeshacer" title="Deshacer la última eliminación">
          <span class="material-symbols-outlined">undo</span> Deshacer
        </button>
        <button type="button" class="btn-toolbar btn-nav" id="btnTema" title="Cambiar tema"></button>
        <button title="Registrar una valoración nueva" class="btn-toolbar primario" id="btnNuevaValoracion">
          <span class="material-symbols-outlined">assignment</span> Nueva valoración
        </button>
      </div>
    </header>

    <div class="tabla-wrap" id="tablaWrap">
      <div class="skeleton-fila"><div class="md-esqueleto" style="width:36px;height:36px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:.4rem"><div class="md-esqueleto" style="height:11px;width:34%"></div><div class="md-esqueleto" style="height:11px;width:20%"></div></div></div>
      <div class="skeleton-fila"><div class="md-esqueleto" style="width:36px;height:36px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:.4rem"><div class="md-esqueleto" style="height:11px;width:28%"></div><div class="md-esqueleto" style="height:11px;width:16%"></div></div></div>
      <div class="skeleton-fila"><div class="md-esqueleto" style="width:36px;height:36px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:.4rem"><div class="md-esqueleto" style="height:11px;width:40%"></div><div class="md-esqueleto" style="height:11px;width:22%"></div></div></div>
    </div>

    <aside class="ficha" id="ficha" aria-hidden="true"></aside>
    <div class="barra-progreso"></div>

    <?!= include_('ui/Modal_Deshacer'); ?>
    <?!= include_('ui/JS_Telefono'); ?>
    <?!= include_('ui/JS_Selector_Fecha'); ?>
    <?!= include_('ui/JS_Carga_Compartida'); ?>

    <!-- Modal de edición de una valoración guardada (fecha incluida). -->
    <div class="modal-overlay" id="modalEditarOverlay">
      <div class="modal-box modal-box-ancho">
        <h3 class="modal-titulo">Editar valoración</h3>
        <div class="form-grid">
          <label>Fecha
            <input type="date" id="editFecha">
          </label>
          <label>Tipo
            <select id="editTipo">
              <option value="Inicial">Inicial</option>
              <option value="Seguimiento">Seguimiento</option>
              <option value="Final">Final</option>
            </select>
          </label>
          <label>Teléfono
            <input type="text" id="editTelefono">
          </label>
          <label>Analgésicos (0-5)
            <input type="number" id="editAnalgesicos" min="0" max="5" step="1">
          </label>
          <label>PEG Dolor (0-10)
            <input type="number" id="editPegDolor" min="0" max="10" step="0.1">
          </label>
          <label>PEG Actividad (0-10)
            <input type="number" id="editPegActividad" min="0" max="10" step="0.1">
          </label>
          <label>PEG Vida (0-10)
            <input type="number" id="editPegVida" min="0" max="10" step="0.1">
          </label>
          <label>Función Global (0-10)
            <input type="number" id="editFuncionGlobal" min="0" max="10" step="0.1">
          </label>
          <label>Columna (0-10)
            <input type="number" id="editMediaColumna" min="0" max="10" step="0.1">
          </label>
          <label>Miembro Superior (0-10)
            <input type="number" id="editMediaMS" min="0" max="10" step="0.1">
          </label>
          <label>Miembro Inferior (0-10)
            <input type="number" id="editMediaMI" min="0" max="10" step="0.1">
          </label>
          <label class="campo-ancho">Notas
            <textarea id="editNotas" rows="2"></textarea>
          </label>
        </div>
        <div class="modal-botones">
          <button title="Cerrar sin guardar" class="md-btn md-btn--text" id="btnCancelarEdicion">Cancelar</button>
          <button title="Guardar los cambios de la valoración" class="md-btn md-btn--tonal" id="btnGuardarEdicion">Guardar cambios</button>
        </div>
      </div>
    </div>
