        google.script.run
          .withSuccessHandler(function(res) {
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; }
            ocultarDeshacer();
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) {
            procesandoDeshacer = false;
            mostrarAviso('Error al deshacer: ' + err);
          })
          .restaurarCitasWeb(snapshot);
      }

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);
      document.getElementById('btnDeshacer').addEventListener('click', ejecutarDeshacer);

      // ---------- Selección múltiple (el clic añade o quita de la selección) ----------
      var BOTONES_UNA_SOLA = ['btnValoracion'].map(function(id) { return document.getElementById(id); });
      var BOTONES_UNA_O_MAS = ['btnWhatsapp', 'btnMenuCopiar', 'btnCopiarCita', 'btnCopiarCita2', 'btnEliminarCitas'].map(function(id) { return document.getElementById(id); });

      function citasSeleccionadas() {
        return CITAS.filter(function(c) { return filasSeleccionadas.has(c._fila) && !c._hueco; });
      }

      function alternarSeleccionFila(cita) {
        if (filasSeleccionadas.has(cita._fila)) filasSeleccionadas.delete(cita._fila);
        else filasSeleccionadas.add(cita._fila);
        render();
        actualizarBotonesSeleccion();
      }

      function quitarSeleccion() {
        filasSeleccionadas.clear();
        render();
        actualizarBotonesSeleccion();
      }

      function actualizarBotonesSeleccion() {
        var n = citasSeleccionadas().length;
        if (n === 0) document.getElementById('menuCopiarWrap').classList.remove('abierto');
        BOTONES_UNA_SOLA.forEach(function(btn) {
          btn.disabled = (n !== 1);
          btn.style.display = (n === 1) ? '' : 'none';
        });
        BOTONES_UNA_O_MAS.forEach(function(btn) { btn.disabled = (n === 0); });

        var contador = document.getElementById('contadorSeleccion');
        contador.textContent = n > 0 ? (n + (n === 1 ? ' cita seleccionada' : ' citas seleccionadas')) : '';

        document.getElementById('cabecera').classList.toggle('con-seleccion', n > 0);
        document.getElementById('barraSeleccion').classList.toggle('visible', n > 0);
      }

      document.getElementById('btnQuitarSeleccion').addEventListener('click', quitarSeleccion);

      function alternarPlegado(fechaISO) {
        var nuevo = !diaPlegado(fechaISO);
        plegadoManual[fechaISO] = nuevo;
        if (nuevo) {
          CITAS.forEach(function(c) { if (c._fechaISO === fechaISO) filasSeleccionadas.delete(c._fila); });
          actualizarBotonesSeleccion();
        }
        render();
      }

      function alternarFiltroDiaSinAsis(fechaISO) {
        if (filtroDiaSinAsis === fechaISO) {
          filtroDiaSinAsis = null;
          filtrosActivos.delete('sinAsistencia');
        } else {
          filtroDiaSinAsis = fechaISO;
          filtrosActivos.add('sinAsistencia');
          plegadoManual[fechaISO] = false;   // que el día quede abierto al quitar el filtro
        }
        render();
      }

      function limpiarFiltros() {
        filtroDiaSinAsis = null;
        filtrosActivos.clear();
        document.getElementById('inputBusqueda').value = '';
        render();
      }

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var t = e.target;
        if (t.closest('.editando')) return; // no seleccionar mientras se edita

        // Asistencia con un clic (icono ✓ / ✕ / aviso)
        var btnAsis = t.closest('[data-asis]');
        if (btnAsis) {
          var contenedor = btnAsis.closest('[data-fila]');
          if (contenedor) guardarAsistencia(contenedor.dataset.fila, btnAsis.classList.contains('activo') ? '' : btnAsis.dataset.asis);
          return;
        }

        // Chip «N sin registrar» del resumen del día: filtra las citas sin asistencia de ese día (otro clic lo quita)
        var btnPend = t.closest('[data-sin-asis]');
        if (btnPend) { alternarFiltroDiaSinAsis(btnPend.dataset.sinAsis); return; }

        // Sesión: − / + (aparecen al pasar el ratón por el número). Se atiende aquí para que no abra la edición en línea ni seleccione la fila.
        var btnSes = t.closest('[data-ses]');
        if (btnSes) {
          var ctlSes = btnSes.closest('.ses-ctl');
          if (ctlSes && !btnSes.disabled) cambiarSesion(ctlSes.dataset.fila, parseInt(btnSes.dataset.ses, 10));
          return;
        }

        // Nombre / avatar: ficha del usuario en el panel lateral
        var fu = t.closest('[data-ficha-fila]');
        if (fu) { abrirFichaUsuario(fu.dataset.fichaFila); return; }

        // Recordatorios: chip (editar), "+" del día (nuevo para esa fecha)
        var rcChip = t.closest('[data-rec-id]');
        if (rcChip) { abrirRecordatorios({ editarId: rcChip.dataset.recId }); return; }
        var rcNuevo = t.closest('[data-rec-nuevo]');
        if (rcNuevo) { abrirRecordatorios({ fecha: rcNuevo.dataset.recNuevo }); return; }

        // Acciones rápidas de la fila / tarjeta
        var btnFila = t.closest('.btn-fila');
        if (btnFila) {
          var f = btnFila.dataset.fila, acc = btnFila.dataset.accion;
          if (acc === 'hc') abrirHCFila(f);
          else if (acc === 'borrar') manejarBorrarFila(f);
          else if (acc === 'whatsapp') abrirWhatsappFila(f);
          else if (acc === 'alta') manejarAltaFila(f);
          else if (acc === 'copiar1' || acc === 'copiar2') {
            var cp = citaPorFila(f);
            if (cp) {
              if (!filasSeleccionadas.has(cp._fila)) { filasSeleccionadas.clear(); filasSeleccionadas.add(cp._fila); }   // si ya hay selección que la incluye, se copia toda
              manejarCopiarSeleccionadas(acc === 'copiar2', false);
            }
          }
          else if (acc === 'cita') { var cc = citaPorFila(f); if (cc) abrirCitaPanel(cc['Usuario'], cc['_idPaciente']); }
          else if (acc === 'valoracion') {
            var ci = CITAS.find(function(c) { return c._fila == f; });
            if (ci) abrirValoracionCita(ci['_idPaciente'], ci['Usuario']);
          }
          return;
        }

        // Botones de los estados vacíos
        var vacio = t.closest('[data-vacio]');
        if (vacio) {
          if (vacio.dataset.vacio === 'limpiar') limpiarFiltros();
          else if (vacio.dataset.vacio === 'huecos') { mostrarHuecos = true; actualizarBotonHuecos(); render(); }
          else if (vacio.dataset.vacio === 'reintentar') cargar(semanaActual);
          return;
        }

        var editable = t.closest('.editable');
        if (editable) { activarEdicion(editable); return; }

        var banda = t.closest('tr.fila-dia');
        if (banda) { alternarPlegado(banda.dataset.dia); return; }

        if (t.closest('a')) return; // los enlaces (Historia clínica) no seleccionan la cita

        var fil = t.closest('tr[data-fila], .tarjeta[data-fila], .cal-cita[data-fila]');
        if (fil) {
          var cita = CITAS.find(function(c) { return c._fila == fil.dataset.fila; });
          if (cita && !cita._hueco) alternarSeleccionFila(cita);
        }
      });

      // ---------- Panel lateral de Valoración (sustituye a la ventana emergente) ----------
      // Igual que en Usuarios: el formulario vive en el panel (valoraciones/Panel_Valoracion) y devuelve un
      // controlador con haCambiado(). El panel trabaja con el nombre del usuario, no con la fila ni con la semana
      // mostrada, así que seguir navegando por la agenda (o el refresco automático) no lo afecta.
      var panelAbierto = false, panelClave = '', controladorPanel = null, timerLimpiarPanel = null;

      function panelHaCambiado() {
        return !!(panelAbierto && controladorPanel && controladorPanel.haCambiado && controladorPanel.haCambiado());
      }
      // Antes de cualquier acción que destruiría el formulario (cerrar, abrir otro…): si hay cambios sin
      // guardar pregunta; si se acepta, el formulario queda descartado.
      async function descartarPanelSiProcede() {
        if (!panelHaCambiado()) return true;
        if (!(await mostrarConfirm('Hay cambios sin guardar en el formulario. ¿Quieres descartarlos?'))) return false;
        try { if (controladorPanel && controladorPanel.cerrar) controladorPanel.cerrar(); } catch (e) { /* no crítico */ }
        panelAbierto = false; controladorPanel = null;
        return true;
      }
      function ocultarPanel() {
        var el = document.getElementById('ficha');
        try { if (controladorPanel && controladorPanel.cerrar) controladorPanel.cerrar(); } catch (e) { /* no crítico */ }   // la historia clínica vuelca lo pendiente
        panelAbierto = false; panelClave = ''; controladorPanel = null;
        document.body.classList.remove('con-ficha', 'ficha-ancha', 'ficha-hc');
        el.classList.remove('abierta');
        el.setAttribute('aria-hidden', 'true');
        // El contenido se vacía cuando termina de deslizarse, para que no se vea un panel en blanco al salir.
        if (timerLimpiarPanel) clearTimeout(timerLimpiarPanel);
        timerLimpiarPanel = setTimeout(function() { if (!panelAbierto) el.innerHTML = ''; }, 220);
        actualizarBotonRec();
      }
      async function cerrarPanel(forzar) {
        if (!panelAbierto) return;
        if (forzar !== true && !(await descartarPanelSiProcede())) return;
        ocultarPanel();
      }

      // Abre un formulario en el panel lateral. `clave` identifica el contenido (no se reabre si ya está);
      // `montar(contenedor)` devuelve el controlador { haCambiado, alEscape, ... } del módulo.
      // `opciones.sinCabecera`: sin la barra de título con el botón de cerrar (la ficha de usuario trae la suya).
      async function abrirPanelLateral(clave, titulo, ancho, montar, opciones) {
        if (panelAbierto && panelClave === clave) return false;
        if (!(await descartarPanelSiProcede())) return false;
        var el = document.getElementById('ficha');
        if (timerLimpiarPanel) { clearTimeout(timerLimpiarPanel); timerLimpiarPanel = null; }
        panelAbierto = true; panelClave = clave; controladorPanel = null;
        document.body.classList.add('con-ficha');
        document.body.classList.toggle('ficha-ancha', ancho === true);
        document.body.classList.toggle('ficha-hc', ancho === 'hc');
        el.classList.add('abierta');
        el.setAttribute('aria-hidden', 'false');
        var sinCabecera = !!(opciones && opciones.sinCabecera);
        el.innerHTML = (sinCabecera ? '' : '<div class="ficha-form-cab"><div class="ficha-form-tit"></div><button type="button" data-panel="cerrar" title="Cerrar (Esc)" aria-label="Cerrar"><span class="material-symbols-outlined">close</span></button></div>') + '<div class="ficha-form-cuerpo"></div>';
        if (!sinCabecera) el.querySelector('.ficha-form-tit').textContent = titulo;
        controladorPanel = montar(el.querySelector('.ficha-form-cuerpo'));
        actualizarBotonRec();
        return true;
      }

      // ---------- Valoración, Dar cita y WhatsApp (barra de selección y acciones por fila) ----------
      // El panel de valoraciones trabaja con el ID paciente del usuario (nunca con el nombre ni el DNI), no con la fila ni con la
      // semana mostrada, así que seguir navegando por la agenda (o el refresco automático) no lo afecta. El nombre solo se muestra.
      function abrirValoracionCita(idPaciente, nombre) {
        idPaciente = String(idPaciente || '').trim();
        nombre = (nombre || '').trim();
        if (!idPaciente) { mostrarAviso('Esa cita no tiene usuario asignado.'); return; }
        var cita = CITAS.find(function(c) { return c['_idPaciente'] === idPaciente && c['Teléfono']; });
        var ficha = fichaDeMemoria(nombre);                                   // DNI y teléfono de la Maestra, si las fichas ya están cargadas
        var dniUsuario = ficha ? String(FichaUsuario.valor(ficha.paciente, ficha.headers, 'DNI') || '').trim() : '';
        var telUsuario = cita ? String(cita['Teléfono']) : (ficha ? String(FichaUsuario.valor(ficha.paciente, ficha.headers, 'Teléfono 1') || '') : '');
        var clave = 'valoracion:' + idPaciente;
        // Sin valoraciones previas abre directamente el formulario de Nueva valoración; con valoraciones, su panel
        // (evolución, historial, añadir / editar / eliminar). Lo decide valoraciones/Panel_Valoraciones.
        return abrirPanelLateral(clave, 'Valoraciones · ' + nombre, false, function(cont) {
          return PanelValoraciones.abrir(cont, Object.assign({
            idPaciente: idPaciente,
            paciente: nombre,
            dni: dniUsuario,
            telefono: telUsuario,
            onGuardado: function() { mostrarAviso('Valoración guardada'); if (panelClave === clave) cerrarPanel(true); },
            onCancelar: function() { if (panelClave === clave) cerrarPanel(); }
          }, ValoracionesCache.opcionesPanel(idPaciente)));   // valoraciones ya precargadas: el panel se abre al instante
        });
      }

      function abrirCitaPanel(nombre, idPaciente) {
        nombre = (nombre || '').trim();
        idPaciente = String(idPaciente || '').trim();
        if (!nombre) { mostrarAviso('Esa cita no tiene usuario asignado.'); return; }
        var clave = 'cita:' + (idPaciente || nombre);
        return abrirPanelLateral(clave, 'Dar cita · ' + nombre, true, function(cont) {
          return PanelCita.abrir(cont, {
            idPaciente: idPaciente,
            paciente: nombre,
            alDisponibilidad: function() { cargar(semanaActual, true); },   // se aplicó una disponibilidad desde el formulario: los huecos de la semana cambian
            onGuardado: function(msj) {
              mostrarAviso(typeof msj === 'string' && msj ? msj : 'Cita registrada');
              if (panelClave === clave) cerrarPanel(true);
              cargar(semanaActual, true);
            },
            onCancelar: function() { if (panelClave === clave) cerrarPanel(); }
          });
        });
      }

      // Disponibilidad: abrir o cerrar horas de la agenda (agenda/Panel_Disponibilidad + agenda/Disponibilidad.gs). Al aplicar se recarga la semana.
      function abrirDisponibilidad() {
        var clave = 'disponibilidad';
        return abrirPanelLateral(clave, 'Disponibilidad', false, function(cont) {
          return PanelDisponibilidad.abrir(cont, {
            semana: semanaActual,
            hoy: hoyISO,
            obtener: function(desde, hasta) {
              return new Promise(function(ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(ko).obtenerDisponibilidadWeb(desde, hasta); });
            },
            aplicar: function(datos) {
              return new Promise(function(ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(ko).aplicarDisponibilidadWeb(datos); });
            },
            onAplicado: function(res) {
              mostrarAviso((res && res.mensaje) || 'Disponibilidad actualizada');
              if (panelClave === clave) cerrarPanel(true);
              cargar(semanaActual, true);
            },
            onCancelar: function() { if (panelClave === clave) cerrarPanel(); }
          });
        });
      }
      document.getElementById('btnDisponibilidad').addEventListener('click', abrirDisponibilidad);

      document.getElementById('ficha').addEventListener('click', function(e) {
        if (e.target.closest('[data-panel="cerrar"]')) cerrarPanel();
      });

      // Esc con el panel abierto lo cierra (con confirmación si hay cambios). Va en fase de captura para que no
      // llegue además al Esc general de la página (que quitaría la selección de citas). Se aparta si hay un diálogo
      // abierto, el menú Copiar desplegado, un arrastre en curso o la edición en línea / el buscador con el foco.
      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape' || !panelAbierto || arrastre) return;
        var modal = document.getElementById('modalOverlay');
        if (modal && modal.classList.contains('visible')) return;
        if (document.querySelector('.menu-wrap.abierto, .fu-menu')) return;
        var activo = document.activeElement;
        if (activo && activo.closest && activo.closest('.editando, .buscador')) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (controladorPanel && controladorPanel.alEscape && controladorPanel.alEscape()) return;   // el formulario gestiona su propio Esc
        cerrarPanel();
      }, true);

      // Un solo usuario (botón de la fila, tarjeta lateral o barra de selección): ventana con el mensaje para revisarlo.
      function abrirWhatsappFila(fila) {
        var c = CITAS.find(function(x) { return x._fila == fila; });
        WhatsappDialogo.abrir('datosWhatsappLoteAgendaWeb', [fila], c ? c['Usuario'] : '');
      }

      // Dar de alta al usuario de la cita (mismo proceso que el botón Alta de Usuarios).
      async function manejarAltaFila(fila) {
        var cita = CITAS.find(function(c) { return c._fila == fila; });
        var nombre = cita ? (cita['Usuario'] || '') : '';
        if (!nombre) { mostrarAviso('Esa fila no tiene usuario asignado.'); return; }
        var confirmado = await mostrarConfirm('¿Dar de alta a ' + nombre + '?');
        if (!confirmado) return;

        google.script.run
          .withSuccessHandler(function(res) { mostrarAviso(res.message); if (window.HCCache) HCCache.cambioDeUsuario(); })
          .withFailureHandler(function(err) { mostrarAviso('Error al dar de alta: ' + err); })
          .darDeAltaPacienteParaAgendaWeb(fila);
      }

      document.getElementById('btnValoracion').addEventListener('click', function() {
        var sel = citasSeleccionadas();
        if (sel.length === 1) abrirValoracionCita(sel[0]['_idPaciente'], sel[0]['Usuario']);
      });

      function filasWhatsappSeleccion() { return citasSeleccionadas().map(function(c) { return c._fila; }); }
      document.getElementById('btnWhatsapp').addEventListener('click', function() {
        var sel = citasSeleccionadas();
        if (sel.length) WhatsappDialogo.abrir('datosWhatsappLoteAgendaWeb', filasWhatsappSeleccion(), sel.length === 1 ? sel[0]['Usuario'] : '');
      });
      // Al pasar el ratón por un botón de WhatsApp se piden ya los datos: al hacer clic el diálogo sale con el mensaje listo.
      document.addEventListener('pointerover', function(e) {
        var b = e.target.closest ? e.target.closest('.btn-whatsapp, #btnWhatsapp') : null;
        if (!b || b.disabled) return;
        var filas = (b.id === 'btnWhatsapp') ? filasWhatsappSeleccion() : [/^\d+$/.test(b.dataset.fila) ? Number(b.dataset.fila) : b.dataset.fila];   // hoja vieja: número; tabla nueva: ID de cita
        WhatsappDialogo.precargar('datosWhatsappLoteAgendaWeb', filas);
      });

      // ---------- Copiar Siguiente Cita / ×2 ----------
      async function manejarCopiarSeleccionadas(doble, forzar) {
        var sel = citasSeleccionadas();
        if (sel.length === 0) return;
        var items = sel.map(function(c) { return { fila: c._fila, doble: doble }; });

        google.script.run
          .withSuccessHandler(async function(res) {
            if (res.ocupado && !forzar) {
              var confirmado = await mostrarConfirm(res.message);
              if (confirmado) manejarCopiarSeleccionadas(doble, true);
              return;
            }
            if (!res.success) { mostrarAviso(res.message || 'No se pudo copiar.'); return; }
            mostrarAviso(res.message);
            quitarSeleccion();
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .copiarVariasCitasWeb(items, !!forzar);
      }

      document.getElementById('btnCopiarCita').addEventListener('click', function() { manejarCopiarSeleccionadas(false, false); });
      document.getElementById('btnCopiarCita2').addEventListener('click', function() { manejarCopiarSeleccionadas(true, false); });

      // ---------- Copiar Semana (mié/jue doble, vie simple → semana siguiente) ----------
      function diaSemanaDeCita(c) {
        var partes = c._fechaISO.split('-').map(Number);
        return new Date(partes[0], partes[1] - 1, partes[2]).getDay();
      }

      async function manejarCopiarSemana(forzar) {
        var items = CITAS
          .filter(function(c) {
            if (c._hueco) return false;
            var dia = diaSemanaDeCita(c);
            return dia === 3 || dia === 4 || dia === 5;
          })
          .map(function(c) {
            var dia = diaSemanaDeCita(c);
            return { fila: c._fila, doble: (dia === 3 || dia === 4) };
          });

        if (items.length === 0) {
          mostrarAviso('No hay citas de miércoles, jueves o viernes en esta semana para copiar.');
          return;
        }

        google.script.run
          .withSuccessHandler(async function(res) {
            if (res.ocupado && !forzar) {
              var confirmado = await mostrarConfirm(res.message);
              if (confirmado) manejarCopiarSemana(true);
              return;
            }
            if (!res.success) { mostrarAviso(res.message || 'No se pudo copiar la semana.'); return; }
            mostrarAviso(res.message);
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .copiarVariasCitasWeb(items, !!forzar);
      }

      document.getElementById('btnCopiarSemana').addEventListener('click', function() { manejarCopiarSemana(false); });

      // ---------- Navegación de semana ----------
      function hoyISO() { return formatoISO(new Date()); }

      function formatoISO(d) {
        var m = (d.getMonth() + 1).toString().padStart(2, '0');
        var day = d.getDate().toString().padStart(2, '0');
        return d.getFullYear() + '-' + m + '-' + day;
      }

      function moverSemana(dias) {
        if (!semanaActual) return;
        var partes = semanaActual.split('-').map(Number);
        var d = new Date(partes[0], partes[1] - 1, partes[2]);
        d.setDate(d.getDate() + dias);
        fijarVista('semana');
        cargar(formatoISO(d));
      }

      document.getElementById('btnSemanaAnterior').addEventListener('click', function() { moverSemana(-7); });
      document.getElementById('btnSemanaSiguiente').addEventListener('click', function() { moverSemana(7); });

      // "Hoy": en la vista de tarjetas las refresca; en la tabla, si el día ya
      // está en la semana cargada solo se desplaza hasta él, y si no, carga la actual.
      document.getElementById('btnHoy').addEventListener('click', function() {
        if (vista === 'hoy') { cambiarVista('hoy'); return; }
        var hoy = hoyISO();
        if (CITAS.some(function(c) { return c._fechaISO === hoy; })) scrollAHoy();
        else cargar(hoy);
      });

      document.getElementById('inputSemana').addEventListener('change', function(e) {
        if (e.target.value) { fijarVista('semana'); cargar(e.target.value); }
      });

      SelectorFecha.enlazar(document.getElementById('inputSemana'), { borrar: false, marcas: marcasDia });   // calendario moderno en lugar del nativo
      document.getElementById('inputBusqueda').addEventListener('input', render);

      document.getElementById('btnHuecos').addEventListener('click', function() {
        mostrarHuecos = !mostrarHuecos;
        actualizarBotonHuecos();
        render();
      });

      function actualizarBotonHuecos() {
        var btn = document.getElementById('btnHuecos');
        btn.title = mostrarHuecos ? 'Ocultar huecos libres' : 'Mostrar huecos libres';
        btn.setAttribute('aria-pressed', mostrarHuecos ? 'true' : 'false');
        btn.classList.toggle('activo', mostrarHuecos);
      }

      // ---------- Vista Semana / Hoy ----------
      function fijarVista(v) {
        vista = v;
        document.getElementById('btnVistaSemana').classList.toggle('activo', v === 'semana');

      var arrastre = null;          // arrastre en curso: { fila, id, x, y, destino, ghost, raf }

      function posicionarGhost() {

      function bucleArrastre() {

        var arriba = r.top + (th ? th.offsetHeight : 0) + 60, abajo = r.bottom - 60, v = 0;

      function marcarDestino() {

      // Actualiza la pantalla al instante y confirma con el servidor; si falla, revierte.
      function elFila(f) {

      // Intercambia en memoria los datos de dos citas ocupadas.

      // Mover a un hueco libre, o intercambiar si el destino está ocupado.

      function moverCitaUI(filaO, filaD, esDeshacer) {

      // ---------- Avisos ligeros (toasts): sustituyen al modal salvo textos largos o multilínea ----------

      // ---------- Animaciones: desplazamiento al mover, destello y salida al eliminar ----------
      var pendienteFLIP = [], estadoHuecoPrevio = {};
      function marcarSaliendo(f) { var e = elFila(f); if (e) e.classList.add('saliendo-fila'); }

      // ---------- Vista Cuadrícula (calendario semanal) ----------
      function htmlCuadricula(filtradas) {

      // ---------- Auto-refresh: sondeo barato de versión (CacheService) y recarga

      // ---------- Recordatorios (agenda/Recordatorios.gs + agenda/Panel_Recordatorios) ----------
      var REC_ICONOS = { 'Llamar': ['call', 'llamar'], 'Reunión': ['groups', 'reunion'], 'Evento': ['event', 'evento'], 'Nota': ['sticky_note_2', 'nota'], 'Festivo': ['flag', 'festivo'] };

      function recPendientesDia(iso) {
        return RECORDATORIOS.filter(function(r) { return !r.hecho && r.fecha === iso && r.tipo !== 'Festivo'; })
          .sort(function(a, b) { return a.hora < b.hora ? -1 : (a.hora > b.hora ? 1 : 0); });
      }
      // Festivos: marcan el día (no son tareas): nunca cuentan como pendientes ni atrasados.
      function festivosDia(iso) { return RECORDATORIOS.filter(function(r) { return r.tipo === 'Festivo' && r.fecha === iso; }); }
      function nombreFestivo(r) {
        var t = String(r.texto || '');

      }
      function htmlFestivoDia(iso) {

        RECORDATORIOS.forEach(function(r) {

      function recTitulo(r) { return r.tipo + (r.hora ? ' · ' + r.hora : '') + ' — ' + r.texto; }

      // Etiquetas de color en la banda del día (tabla y vista Hoy) + botón "+" para añadir uno a ese día.

      // ---------- Ficha de usuario (panel lateral) ----------
      // Cabecera, secciones y etiquetas: ui/JS_Ficha (FichaUsuario), el mismo componente que la ficha de Usuarios.
      // Aquí solo está lo propio de la Agenda: cargar las fichas en memoria, qué acciones se ofrecen y qué hacen.

      // Fichas en memoria: se cargan TODAS de una vez en segundo plano (cargarFichas) y el panel se abre desde
      // aquí, sin llamar al servidor. Se refrescan solas (ver más abajo), así que no hace falta caché por nombre.
      var FICHAS = { t: 0, headers: [], porNombre: null, cargando: false };
      var fichaAbierta = null;   // { clave, nombre, caja, html } de la ficha que está en el panel lateral

      // Misma normalización que normalizarNombreFicha_ (agenda/Ficha_Usuario.gs): mayúsculas, sin tildes, espacios simples.
      function claveFicha(n) {
        return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
      }
      function fichaDeMemoria(nombre) {
        var p = FICHAS.porNombre && FICHAS.porNombre[claveFicha(nombre)];
        return p ? { success: true, headers: FICHAS.headers, paciente: p } : null;
      }
      function htmlFichaUsuario(res, nombre) {
        var hs = res.headers || [];
        return FichaUsuario.html(res.paciente, hs, {
          nombre: nombre,
          // «Valoración» (formulario) si el usuario no tiene ninguna; «Valoraciones» (su panel) si ya tiene
          acciones: ['whatsapp', 'hc', 'cita', ValoracionesCache.accion(res.paciente['ID paciente'])],
          // "Otros datos" no repite la columna de prioridad (la primera) ni la Historia clínica, igual que Usuarios
          excluir: [hs[0]].concat(hs.filter(function(h) { return String(h).toLowerCase().indexOf('historia') !== -1; }))
        });
      }
      // Al terminar la precarga de valoraciones (o cambiar), el botón de la ficha abierta puede pasar de «Valoración» a «Valoraciones».
      ValoracionesCache.alCambiar(function() { repintarFichaAbierta(); });
      function repintarFichaAbierta() {
        if (!fichaAbierta || !panelAbierto || panelClave !== fichaAbierta.clave) return;
        var res = fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var html = htmlFichaUsuario(res, fichaAbierta.nombre);
        if (html === fichaAbierta.html) return;            // sin cambios: no se toca el DOM
        fichaAbierta.html = html;
        FichaUsuario.pintar(fichaAbierta.caja, html);
      }
      // Carga (o recarga) todas las fichas. Si falla, se conserva lo que ya hubiera en memoria.
      // Sin lista de columnas: la ficha muestra también "Otros datos", así que se piden todas.
      function cargarFichas() {
        if (FICHAS.cargando) return;
        FICHAS.cargando = true;
        google.script.run
          .withSuccessHandler(function(res) {
            FICHAS.cargando = false;
            if (!res || !res.success) return;
            FICHAS.headers = res.headers || [];
            FICHAS.porNombre = res.fichas || {};
            FICHAS.t = Date.now();

            if (res.usuarios) { var primera = !USUARIOS_HUECO; USUARIOS_HUECO = SelectorUsuario.preparar(res.usuarios); if (primera) SelectorUsuario.refrescar(); }

          })

          })

      // ---------- Estado del usuario desde la ficha (chip pulsable, como en Usuarios) ----------
      function menuEstadoFicha(ancla) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var hEst = FichaUsuario.cabecera(res.headers, 'Estado') || 'Estado';
        var actual = FichaUsuario.norm(res.paciente[hEst]);
        var existentes = Object.keys(FICHAS.porNombre).map(function(k) { return FICHAS.porNombre[k][hEst]; });
        FichaUsuario.menuEstado(ancla, FichaUsuario.estadosDisponibles(existentes).map(function(e) {
          return { punto: FichaUsuario.claseEstado(e), texto: FichaUsuario.textoEstado(e), marcado: FichaUsuario.norm(e) === actual, fn: function() { cambiarEstadoFicha(e); } };
        }));
      }
      function cambiarEstadoFicha(valor) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var p = res.paciente, hEst = FichaUsuario.cabecera(res.headers, 'Estado') || 'Estado', antes = p[hEst];
        if (FichaUsuario.norm(antes) === FichaUsuario.norm(valor)) return;
        if (FichaUsuario.claseEstado(valor) === 'alta') { altaDesdeFicha(fichaAbierta.nombre); return; }   // el alta tiene su propio flujo (fechas e HC)
        if (!p['ID paciente']) { mostrarAviso('No se pudo cambiar el estado: vuelve a abrir la ficha e inténtalo de nuevo.'); cargarFichas(); return; }
        p[hEst] = valor;
        repintarFichaAbierta();
        function revertir(msg) { p[hEst] = antes; repintarFichaAbierta(); mostrarAviso(msg); }
        google.script.run
          .withSuccessHandler(function(r) {
            if (!r || !r.success) { revertir((r && r.message) || 'No se pudo cambiar el estado.'); cargarFichas(); return; }
            mostrarAviso('Estado cambiado a ' + FichaUsuario.textoEstado(valor) + '.');

            try { localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: true, ts: Date.now() })); } catch (err) { /* sin almacenamiento: no es crítico */ }
            if (window.HCCache) HCCache.cambioDeUsuario();   // un usuario nuevo en Activo entra en la precarga de HC
            if (r.ordenado) cargarFichas();   // el servidor reordenó la Maestra: las fichas en memoria (y el orden de sus listas) se refrescan
          })
          .withFailureHandler(function(err) { revertir('Error al cambiar el estado: ' + err); })
          .cambiarEstadoPacienteWeb(p['ID paciente'], valor);
      }
      // Alta desde la ficha: usa la cita del usuario en la semana mostrada (mismo proceso que el botón Alta de la fila).
      function altaDesdeFicha(nombre) {
        var cita = CITAS.find(function(x) { return !x._hueco && x['Usuario'] === nombre; });
        if (!cita) { mostrarAviso('Este usuario ya no tiene citas en la semana mostrada: da el alta desde Usuarios.'); return; }
        manejarAltaFila(cita._fila);
      }

      function abrirFichaUsuario(fila) {
        var cita = citaPorFila(fila), nombre = cita ? String(cita['Usuario'] || '').trim() : '';

          var caja = cont;

          function pintar(res) { fichaAbierta.idPaciente = String((res.paciente && res.paciente['ID paciente']) || ''); fichaAbierta.html = htmlFichaUsuario(res, nombre); FichaUsuario.pintar(caja, fichaAbierta.html); }
          function error(msg) { fichaAbierta.html = ''; FichaUsuario.pintar(caja, FichaUsuario.mensaje(nombre, msg)); }

              .withSuccessHandler(function(res) {
                if (panelClave !== clave) return;

              })
              .withFailureHandler(function(err) { if (panelClave === clave) error('Error al cargar la ficha: ' + err); })
              .obtenerFichaUsuarioWeb(nombre);

              cerrar: function() { cerrarPanel(); },

                else if (a === 'valoracion') abrirValoracionCita(fichaAbierta ? fichaAbierta.idPaciente : '', nombre);
                else if (!citaAct) mostrarAviso('Este usuario ya no tiene citas en la semana mostrada.');

      // Ediciones hechas directamente en la hoja (no avisan por localStorage): se recogen al volver a la pestaña

      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && FICHAS.porNombre && Date.now() - FICHAS.t > 60000) cargarFichas();
      });
      setInterval(function() { if (!document.hidden) cargarFichas(); }, 5 * 60 * 1000);

      // ---------- Panel de resumen (columna derecha) ----------
      var resumenVisible = true, resumenMes = null, resumenSemana = null;
      try { resumenVisible = localStorage.getItem('agendaResumen') !== '0'; } catch (err) { /* sin almacenamiento */ }

      function aplicarResumen() {
        document.body.classList.toggle('con-resumen', !!resumenVisible && vista !== 'cuadricula');
        var b = document.getElementById('btnResumen');
        b.classList.toggle('activo', !!resumenVisible);
        b.title = resumenVisible ? 'Ocultar panel de resumen' : 'Mostrar panel de resumen';
      }
      document.getElementById('btnResumen').addEventListener('click', function() {
        resumenVisible = !resumenVisible;
        try { localStorage.setItem('agendaResumen', resumenVisible ? '1' : '0'); } catch (err) { /* sin almacenamiento */ }
        aplicarResumen();
        renderResumen();
      });

      function diaMesCorto(iso) { return iso.slice(8) + '/' + iso.slice(5, 7); }

      function htmlMiniCal() {
        var base = resumenMes || hoyISO().slice(0, 8) + '01';
        var p = base.split('-').map(Number), y = p[0], m = p[1] - 1;
        var offset = (new Date(y, m, 1).getDay() + 6) % 7;
        var hoy = hoyISO(), ini = semanaActual || '', fin = semanaActual ? sumarDiasISO(semanaActual, 6) : '';
        var html = '<section class="rs-card"><div class="rs-mes"><button type="button" class="rs-nav" data-rs-mes="-1" title="Mes anterior"><span class="material-symbols-outlined">chevron_left</span></button>' +
          '<b>' + MESES_ES[m] + ' ' + y + '</b><button type="button" class="rs-nav" data-rs-mes="1" title="Mes siguiente"><span class="material-symbols-outlined">chevron_right</span></button></div><div class="rs-cal">';
        ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach(function(d) { html += '<span class="rs-dow">' + d + '</span>'; });
        for (var i = 0; i < 42; i++) {
          var dt = new Date(y, m, 1 - offset + i), iso = formatoISO(dt);
          var mk = marcasDia(iso), cls = 'rs-d' + (dt.getMonth() !== m ? ' fuera' : '') + (iso === hoy ? ' hoy' : '') + (mk.festivo ? ' festivo' : '');
          if (ini && iso >= ini && iso <= fin) cls += ' sem' + (iso === ini ? ' sem-ini' : '') + (iso === fin ? ' sem-fin' : '');
          html += '<button type="button" class="' + cls + '" title="' + escapar('Ir al día ' + dt.getDate() + (mk.texto ? ' — ' + mk.texto : '')) + '" data-rs-dia="' + iso + '"><span>' + dt.getDate() + '</span>' +
            (mk.tipos.length ? '<i class="rs-pts">' + mk.tipos.map(function(t) { return '<b class="rs-pt rs-pt-' + t + '"></b>'; }).join('') + '</i>' : '') + '</button>';
        }
        return html + '</div></section>';
      }

      function htmlResumenHoy(hoy, ahora) {
        var delDia = CITAS.filter(function(c) { return c._fechaISO === hoy && !c._hueco; });
        if (!delDia.length) return '';
        var enCurso = delDia.filter(function(c) { return estadoTemporal(c['Hora'] || '', ahora) === 'en-curso'; })[0];
        var prox = filaProxima(hoy, ahora);
        function fila(etq, c) {
          return '<div class="rs-ahora" data-ficha-fila="' + c._fila + '" title="Ver ficha"><span class="rs-etq">' + etq + '</span><span class="rs-h">' + escapar(c['Hora']) + '</span>' +
            '<span class="rs-n">' + avatarHtml(c['Usuario']) + '<span class="nombre-u">' + escapar(c['Usuario']) + '</span></span></div>';
        }
        var cuerpo = (enCurso ? fila('Ahora', enCurso) : '') + (prox ? fila('Próxima', prox) : '');
        return '<section class="rs-card"><h3 class="rs-tit">Hoy</h3>' + (cuerpo || '<div class="rs-vacio">Jornada terminada.</div>') + '</section>';
      }

      function htmlSinRegistrar(hoy, ahora) {
        var pend = CITAS.filter(function(c) {
          if (c._hueco || !vacioTxt(c['Asistencia'])) return false;
          return c._fechaISO < hoy || (c._fechaISO === hoy && estadoTemporal(c['Hora'] || '', ahora) === 'pasada');
        });
        if (!pend.length) return '';
        var filas = pend.slice(0, 6).map(function(c) {
          var dt = c._fechaISO.split('-');
          var dia = DIAS_ES[new Date(+dt[0], +dt[1] - 1, +dt[2]).getDay()].slice(0, 3);
          return '<div class="rs-pend" data-fila="' + c._fila + '"><button type="button" class="rs-pn" data-ficha-fila="' + c._fila + '" title="Ver ficha">' +
            '<span class="rs-pd">' + dia + ' ' + escapar(c['Hora']) + '</span>' + escapar(c['Usuario']) + '</button>' + htmlAsistenciaBotones('', false) + '</div>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Sin registrar <span>' + pend.length + '</span></h3>' + filas +
          (pend.length > 6 ? '<div class="rs-vacio">y ' + (pend.length - 6) + ' más…</div>' : '') + '</section>';
      }

      function htmlResumenRec(hoy) {
        var lista = RECORDATORIOS.filter(function(r) { return !r.hecho && r.tipo !== 'Festivo' && r.fecha && r.fecha <= hoy; })
          .sort(function(a, b) { var x = a.fecha + (a.hora || ''), y = b.fecha + (b.hora || ''); return x < y ? -1 : (x > y ? 1 : 0); });
        var filas = lista.slice(0, 5).map(function(r) {
          var t = recInfo(r.tipo), atras = r.fecha < hoy;
          return '<button type="button" class="rs-rec rc-t-' + t[1] + (atras ? ' atrasado' : '') + '" data-rec-id="' + escapar(r.id) + '" title="' + escapar(recTitulo(r)) + '">' +
            '<span class="material-symbols-outlined">' + t[0] + '</span><span class="rs-rec-txt">' + escapar(r.texto) + '</span>' +
            '<span class="rs-rec-f">' + (atras ? diaMesCorto(r.fecha) : (r.hora ? escapar(r.hora) : 'Hoy')) + '</span></button>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Recordatorios <button type="button" class="rs-mas" data-rs-rec-nuevo title="Añadir recordatorio"><span class="material-symbols-outlined">add</span></button></h3>' +
          (filas || '<div class="rs-vacio">Nada pendiente para hoy.</div>') +
          (lista.length > 5 ? '<button type="button" class="rs-link" title="Ver todos los recordatorios pendientes" data-rs-rec-todos>Ver los ' + lista.length + ' pendientes</button>' : '') + '</section>';
      }

      function htmlFestivosResumen(hoy) {
        var fest = RECORDATORIOS.filter(function(r) { return r.tipo === 'Festivo' && r.fecha && r.fecha >= hoy; })
          .sort(function(a, b) { return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0); }).slice(0, 4);
        if (!fest.length) return '';
        var filas = fest.map(function(r) {
          return '<button type="button" class="rs-rec rc-t-festivo" data-rec-id="' + escapar(r.id) + '" title="' + escapar(nombreFestivo(r)) + '"><span class="material-symbols-outlined">flag</span>' +
            '<span class="rs-rec-txt">' + escapar(nombreFestivo(r)) + '</span><span class="rs-rec-f">' + (r.fecha === hoy ? 'Hoy' : diaMesCorto(r.fecha)) + '</span></button>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Festivos</h3>' + filas + '</section>';
      }

      function htmlResumenSemana() {
        var citas = 0, libres = 0, reg = 0;
        CITAS.forEach(function(c) { if (c._hueco) libres++; else { citas++; if (!vacioTxt(c['Asistencia'])) reg++; } });
        if (!citas && !libres) return '';
        return '<section class="rs-card"><h3 class="rs-tit">Esta semana</h3><div class="rs-cifras"><div><b>' + citas + '</b><span>Citas</span></div>' +
          '<div><b>' + libres + '</b><span>Libres</span></div><div><b>' + (citas ? Math.round(reg * 100 / citas) : 0) + '%</b><span>Registradas</span></div></div></section>';
      }

      function renderResumen() {
        var el = document.getElementById('resumen');
        if (!el || !resumenVisible) return;
        if (resumenSemana !== semanaActual) {
          resumenSemana = semanaActual;
          if (semanaActual) resumenMes = sumarDiasISO(semanaActual, 2).slice(0, 8) + '01';
        }
        var hoy = hoyISO(), ahora = ahoraHHmm();
        el.innerHTML = htmlMiniCal() + htmlResumenHoy(hoy, ahora) + htmlSinRegistrar(hoy, ahora) + htmlResumenRec(hoy) + htmlFestivosResumen(hoy) + htmlResumenSemana();
      }

      document.getElementById('resumen').addEventListener('click', function(e) {
        var t = e.target, c;
        if ((c = t.closest('[data-asis]'))) {
          var cont = c.closest('[data-fila]');
          if (cont) guardarAsistencia(cont.dataset.fila, c.dataset.asis);
          return;
        }
        if ((c = t.closest('[data-ficha-fila]'))) { abrirFichaUsuario(c.dataset.fichaFila); return; }
        if ((c = t.closest('[data-rs-mes]'))) {
          var p = (resumenMes || hoyISO().slice(0, 8) + '01').split('-').map(Number);
          resumenMes = formatoISO(new Date(p[0], p[1] - 1 + Number(c.dataset.rsMes), 1));
          renderResumen();
          return;
        }
        if ((c = t.closest('[data-rs-dia]'))) {
          var iso = c.dataset.rsDia, wrap = document.getElementById('tablaWrap');
          var enSemana = semanaActual && iso >= semanaActual && iso <= sumarDiasISO(semanaActual, 6);
          if (enSemana) {
            fijarVista('semana'); render();
            var banda = wrap.querySelector('tr.fila-dia[data-dia="' + iso + '"]');
            if (banda) { plegadoManual[iso] = false; render(); banda = wrap.querySelector('tr.fila-dia[data-dia="' + iso + '"]'); wrap.scrollTop = Math.max(0, banda.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop); }
          } else { fijarVista('semana'); cargar(iso); }
          return;
        }
        if ((c = t.closest('[data-rec-id]'))) { abrirRecordatorios({ editarId: c.dataset.recId }); return; }
        if (t.closest('[data-rs-rec-nuevo]')) { abrirRecordatorios({ fecha: hoyISO() }); return; }
        if (t.closest('[data-rs-rec-todos]')) { abrirRecordatorios(); return; }
      });
      setInterval(renderResumen, 60000);   // «Ahora / Próxima» avanza con el reloj

      document.getElementById('btnImprimir').addEventListener('click', function() { window.print(); });
      window.addEventListener('beforeprint', function() {
        imprimiendo = true;
        var etq = vista === 'hoy' ? 'Hoy' : document.getElementById('etiquetaSemana').textContent;
        document.getElementById('cabImpresion').innerHTML = '<b>Agenda · ' + escapar(etq) + '</b><span>Impreso el ' + new Date().toLocaleDateString('es-ES') + '</span>';
        render();
      });
      window.addEventListener('afterprint', function() { imprimiendo = false; render(); });
      document.body.appendChild(document.getElementById('barraSeleccion'));   // píldora flotante fuera de la cabecera
      actualizarBotonHuecos();
      aplicarResumen();
      cargar();
      cargarRecordatorios();
      cargarFichas();   // en segundo plano: cuando llegue, abrir una ficha ya no necesita al servidor
    </script>
  </body>
</html>
