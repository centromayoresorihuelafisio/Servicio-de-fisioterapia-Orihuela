!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alternativas de Evaluación M3</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;8..144,400;8..144,500;8..144,600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --md-primary: #2b5c75;
      --md-on-primary: #ffffff;
      --md-primary-container: #e0f1fc;
      --md-on-primary-container: #001e2c;
      --md-surface: #ffffff;
      --md-surface-1: #f8fafb;
      --md-surface-2: #f1f4f7;
      --md-outline: #71787d;
      --md-outline-variant: #c1c7ce;
      --md-text: #191c1e;
      --md-shape-small: 12px;
      --md-shape-medium: 16px;
      --md-shape-full: 100px;
      --md-t-short: 180ms cubic-bezier(.3,0,0,1);
    }

    body {
      font-family: 'Roboto Flex', sans-serif;
      background: var(--md-surface-1);
      color: var(--md-text);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      max-width: 600px;
      margin: 0 auto;
    }

    .component-label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 12px;
      display: block;
      color: var(--md-primary);
    }

    /* 1. SEGMENTED BUTTONS GRID */
    .segmented-group {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      background: var(--md-surface-2);
      padding: 4px;
      border-radius: var(--md-shape-medium);
      border: 1px solid var(--md-outline-variant);
    }

    .segment {
      appearance: none;
      margin: 0;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--md-shape-medium);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: var(--md-t-short);
      border: 1px solid transparent;
      position: relative;
    }

    .segment::before {
      content: attr(data-value);
    }

    .segment:checked {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-color: var(--md-primary);
    }

    .segment:hover:not(:checked) {
      background: rgba(43, 92, 117, 0.08);
    }

    /* 2. CHOICE CHIPS GRID */
    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-chip {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 16px;
      border: 1px solid var(--md-outline);
      border-radius: 8px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: var(--md-t-short);
    }

    .choice-chip input { display: none; }

    .choice-chip:has(input:checked) {
      background: var(--md-primary-container);
      border-color: var(--md-primary);
      color: var(--md-on-primary-container);
    }

    /* 3. EXPOSED DROPDOWN (SIMULATED MD3) */
    .md-select-container {
      position: relative;
      max-width: 200px;
    }

    .md-select {
      width: 100%;
      height: 56px;
      border: 1.5px solid var(--md-outline);
      border-radius: var(--md-shape-small);
      padding: 0 16px;
      font-size: 1rem;
      background: var(--md-surface);
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .segmented-group { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <div>
    <span class="component-label">Segmented Buttons (Grid)</span>
    <div class="segmented-group">
      <input type="radio" name="seg" class="segment" data-value="0">
      <input type="radio" name="seg" class="segment" data-value="1">
      <input type="radio" name="seg" class="segment" data-value="2">
      <input type="radio" name="seg" class="segment" data-value="3">
      <input type="radio" name="seg" class="segment" data-value="4">
      <input type="radio" name="seg" class="segment" data-value="5">
      <input type="radio" name="seg" class="segment" data-value="6">
      <input type="radio" name="seg" class="segment" data-value="7">
      <input type="radio" name="seg" class="segment" data-value="8">
      <input type="radio" name="seg" class="segment" data-value="9">
      <input type="radio" name="seg" class="segment" data-value="10">
    </div>
  </div>

  <div>
    <span class="component-label">Choice Chips (Evaluación visual)</span>
    <div class="chips-grid">
      <label class="choice-chip"><input type="radio" name="chip">0 - Ninguno</label>
      <label class="choice-chip"><input type="radio" name="chip">1</label>
      <label class="choice-chip"><input type="radio" name="chip">2</label>
      <label class="choice-chip"><input type="radio" name="chip">3</label>
      <label class="choice-chip"><input type="radio" name="chip">4</label>
      <label class="choice-chip"><input type="radio" name="chip">5 - Moderado</label>
      <label class="choice-chip"><input type="radio" name="chip">6</label>
      <label class="choice-chip"><input type="radio" name="chip">7</label>
      <label class="choice-chip"><input type="radio" name="chip">8</label>
      <label class="choice-chip"><input type="radio" name="chip">9</label>
      <label class="choice-chip"><input type="radio" name="chip">10 - Extremo</label>
    </div>
  </div>

  <div>
    <span class="component-label">Exposed Dropdown (Espacio reducido)</span>
    <div class="md-select-container">
      <select class="md-select">
        <option value="" disabled selected>Seleccione valor</option>
        <option>0 - Sin dolor</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5 - Moderado</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10 - Máximo</option>
      </select>
    </div>
  </div>

</body>
</html>
