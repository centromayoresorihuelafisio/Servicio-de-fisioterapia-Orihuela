      // usuarios/JS_Usuarios_Acciones.html - Usuarios: avisos, barra de herramientas, eliminar, alta, Historia Clinica, WhatsApp, tema y arranque
      // Se incluye dentro del unico <script> de usuarios/BaseDatos_Vista, tras ui/JS_Modal_Deshacer y dentro del bloque de la sección
      // ((function() { … })(), fase 2 de la sección 20 de CONTEXTO.md), en este orden: JS_Usuarios_Base, JS_Usuarios_Ficha, JS_Usuarios_Acciones.
      // Sin scriptlets: include() no los evalua (la direccion de la app llega en URL_BASE_WEB, definida en la pagina).


      // ---------- Avisos ligeros (toasts): avisoFlotante de ui/JS_Modal_Deshacer, con el criterio de error de esta pestaña ----------
      // Dentro del bloque de la sección, mostrarAviso es este; el global (ui/JS_Secciones) va a este mientras Usuarios es la activa.
      function mostrarAviso(mensaje) { return avisoFlotante(mensaje, /^error|no se pudo|no se pudieron|bloqueado/i); }
      Secciones.registrar('usuarios', { mostrarAviso: mostrarAviso });

      // Barra de progreso superior mientras algún botón (oculto o no) muestra "procesando"
      new MutationObserver(function() {
        var ocupado = Array.prototype.some.call(document.querySelectorAll('.barra-herramientas button'), function(b) { return b.innerHTML.indexOf('progress_activity') !== -1; });
        cuerpoSeccion.classList.toggle('ocupado', ocupado);
      }).observe(document.querySelector('.barra-herramientas'), { childList: true, subtree: true });

      // Esc: cierra primero el menú y después la ficha
      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape' || Secciones.activa() !== 'usuarios') return;
        if (document.querySelector('dialog[open]')) return;
        if (menuItems) { var ancla = menuAncla; cerrarMenu(); if (ancla && document.contains(ancla) && ancla.focus) ancla.focus(); return; }
        if (formularioActivo) {
          if (document.querySelector('.modal-overlay.visible')) return;
          // primero lo que el formulario tenga abierto (desplegables, lista de usuarios, horas elegidas…)
          if (controladorForm && controladorForm.alEscape && controladorForm.alEscape()) return;
          volverDeFormulario();
          return;
        }
        if (document.querySelector('.modal-overlay.visible')) return;
        if (fichaAbierta) cerrarFicha();
        else limpiarBusqueda();   // nada más que cerrar: Esc vacía la búsqueda
      });

      // Si otra pestaña actualiza un usuario (las páginas sueltas ?page=… avisan por localStorage al guardar),
      // la tabla se recarga. Los formularios de esta página ya no usan ventanas emergentes.
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado') cargar();
      });

      // ---------- Barra de herramientas ----------
      // Nuevo usuario: formulario en el panel lateral (usuarios/Panel_Nuevo), como Valoración o Editar.
      document.getElementById('btnNuevoPaciente').addEventListener('click', abrirPanelNuevo);

      document.getElementById('btnOrdenar').addEventListener('click', function() {
        var btn = document.getElementById('btnOrdenar');
        var icono = btn.querySelector('.material-symbols-outlined');
        btn.disabled = true;
        icono.textContent = 'progress_activity';
        icono.classList.add('girando');
        llamar('ordenarPacientes')
          .then(function() {
            btn.disabled = false;
            icono.textContent = 'sort';
            icono.classList.remove('girando');
            cargar();
          }, function(err) {
            btn.disabled = false;
            icono.textContent = 'sort';
            icono.classList.remove('girando');
            mostrarAviso('Error al ordenar: ' + err);
          });
      });

      // ---------- Eliminar usuario ----------
      async function eliminarUsuarioSeleccionado() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Eliminar a ' + pacienteSeleccionado['Nombre'] + '? Se borrará toda su ficha.');
        if (!confirmado) return;

        // Foto completa de la ficha ANTES de borrarla, para poder deshacer.
        var snapshot = Object.assign({}, pacienteSeleccionado);

        llamar('eliminarPacienteWeb', [idPaciente(snapshot)])
          .then(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudo eliminar el usuario.'); return; }
            quitarSeleccion();
            cargar();
            deshacerUsuarios.mostrar(snapshot, 'Usuario eliminado.');
          }, function(err) {
            mostrarAviso('Error al eliminar: ' + err);
          });
      }

      // Deshacer (ui/JS_Modal_Deshacer): devuelve true si se restauró; si falla, el botón sigue disponible para reintentar.
      var deshacerUsuarios = Deshacer.crear({
        boton: document.getElementById('btnDeshacer'),
        toast: document.getElementById('toastDeshacer'),
        alDeshacer: function(snapshot) {
          if (Array.isArray(snapshot)) return restaurarEnCadena(snapshot, 0); // eliminación en lote
          return llamar('restaurarPacienteWeb', [snapshot])
            .then(function(res) {
              if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return false; }
              cargar();
              return true;
            }, function(err) {
              mostrarAviso('Error al deshacer: ' + err);
              return false;
            });
        }
      });

      // Restaura una lista de fichas de una en una (en orden de fila); si una falla, devuelve las pendientes para reintentar.
      function restaurarEnCadena(lista, i) {
        if (i >= lista.length) {
          cargar();
          mostrarAviso(lista.length + (lista.length === 1 ? ' usuario restaurado.' : ' usuarios restaurados.'));
          return Promise.resolve(true);
        }
        function fallo(msg) { cargar(); mostrarAviso(msg); return lista.slice(i); }
        return llamar('restaurarPacienteWeb', [lista[i]])
          .then(function(res) {
            if (!res || !res.success) return fallo((res && res.message) || 'No se pudieron restaurar todos los usuarios.');
            return restaurarEnCadena(lista, i + 1);
          }, function(err) { return fallo('Error al deshacer: ' + err); });
      }

      // ---------- Dar de alta ----------
      async function darDeAltaSeleccionado() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Dar de alta a ' + pacienteSeleccionado['Nombre'] + '?');
        if (!confirmado) return;

        llamar('darDeAltaPacienteWeb', [idPaciente(pacienteSeleccionado)])
          .then(function(res) {
            mostrarAviso(res.message);
            if (window.HCCache) HCCache.cambioDeUsuario();   // el alta cambia el episodio de la HC
            quitarSeleccion();
            cargar();
          }, function(err) {
            mostrarAviso('Error al dar de alta: ' + err);
          });
      }

      // ---------- Generar Historia Clínica ----------
      function crearHcSeleccionado() {
        if (!pacienteSeleccionado) return;

        llamar('generarHistoriaClinicaWeb', [idPaciente(pacienteSeleccionado)])
          .then(function(res) {
            mostrarAviso(res.message);
            if (res.success) cargar();
          }, function(err) {
            mostrarAviso('Error al generar la historia clínica: ' + err);
          });
      }

      // ---------- WhatsApp ----------
      // Un solo usuario: ventana con el mensaje predefinido para revisarlo y elegir WhatsApp Web o la app de escritorio.
      function whatsappSeleccionado() {
        if (!pacienteSeleccionado) return;
        WhatsappDialogo.abrir('datosWhatsappMaestraWeb', [idPaciente(pacienteSeleccionado)], pacienteSeleccionado['Nombre']);
      }
      // Al pasar el ratón por el botón de WhatsApp de una fila se piden ya los datos: al hacer clic el diálogo sale con el mensaje listo.
      document.addEventListener('pointerover', function(e) {
        var btn = e.target.closest ? e.target.closest('.btn-whatsapp') : null;
        var idWa = btn && btn.dataset.fila ? idDeFila(Number(btn.dataset.fila)) : '';
        if (idWa) WhatsappDialogo.precargar('datosWhatsappMaestraWeb', [idWa]);
      });

      // ---------- Editar, Cita y Valoración: formularios en el panel lateral ----------
      // (editar, cita y valoración: accionPaciente llama directamente a abrirFormularioPanel)

      var temporizadorBusqueda = null;
      document.getElementById('inputBusqueda').addEventListener('input', function() {
        clearTimeout(temporizadorBusqueda);
        temporizadorBusqueda = setTimeout(render, 150);
      });

      // Esc vacía la búsqueda (render la repinta y guarda la vista). Devuelve true si había texto.
      function limpiarBusqueda() {
        var inp = document.getElementById('inputBusqueda');
        clearTimeout(temporizadorBusqueda);
        if (!inp.value) return false;
        inp.value = '';
        render();
        return true;
      }
      // Con el cursor en la búsqueda: Esc la vacía y suelta el foco, sin cerrar la ficha que haya detrás.
      document.getElementById('inputBusqueda').addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.stopPropagation();
        limpiarBusqueda();
        this.blur();
      });

      Tema.conectar(document.getElementById('btnTema'));   // tema común: ui/JS_Secciones

      restaurarVista();
      pintarGuardada();
      // En la página de Usuarios y Agenda, si se abre en la Agenda, la tabla se pide después de lo principal de la Agenda.
      if (Secciones.activa() === 'usuarios') cargar(); else OrdenCarga.despues(function() { cargar(); }, 300);
