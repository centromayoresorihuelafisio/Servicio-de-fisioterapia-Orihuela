      // dashboard/JS_Estadisticas_Graficos.html - Estadisticas: graficos, evolucion clinica, flujo de estados, exportar, controles, tema y arranque
      // Se incluye dentro del unico <script> de dashboard/Web_Vista, en este orden: JS_Estadisticas_Resumen, JS_Estadisticas_Graficos.
      // Sin scriptlets: include() no los evalua.
      // ---------- Gráficos ----------
      // La nota de cada gráfica se guarda en su <p class="nota"> (oculto; la exportación a PNG la lee) y se muestra en el ⓘ del título de la tarjeta.
      function nota(id, texto) {
        var p = $(id), t = p.closest('.tarjeta'), cab = t && t.querySelector('header');
        p.textContent = texto;
        if (!cab) return;
        var w = cab._info;
        if (!texto) { if (w) w.hidden = true; return; }
        if (w) { rellenarInfo(w, [texto]); w.hidden = false; return; }
        var h2 = cab.querySelector('h2'), tit = document.createElement('div');
        tit.className = 'tit';
        cab.insertBefore(tit, h2);
        tit.appendChild(h2);
        cab._info = crearInfo(tit, [texto], { rotulo: 'Cómo se calcula esta gráfica' });
      }
      function tramosGrafico(id, tramos, nombre, descripcion) {
        Graficos.montar($(id), 'barras', {
          etiquetas: tramos.map(function (t) { return t.etiqueta; }), series: [{ nombre: nombre, valores: tramos.map(function (t) { return t.n; }), clase: 0 }],
          formato: num, alto: 190, anchoEtiqueta: 46, descripcion: descripcion
        });
      }

      function pintarGraficos(r) {
        var oc = r.citas.ocupacion, fa = r.citas.faltas, re = r.citas.reincidentes, p = r.pacientes;
        var seriesOc = function (filas) {
          return [{ nombre: 'Reservada (todas las citas)', clase: 0, valores: filas.map(function (f) { return f.pctReservada; }) },
                  { nombre: 'Efectiva (solo asistidas)', clase: 1, valores: filas.map(function (f) { return f.pctEfectiva; }) }];
        };
        var leyOc = function (id) { Graficos.leyenda($(id), [{ nombre: 'Reservada (todas las citas)', clase: 0 }, { nombre: 'Efectiva (solo asistidas)', clase: 1 }]); };
        var notaOc = oc.total.huecos + ' huecos abiertos y ' + oc.total.reservadas + ' citas reservadas en el periodo (hasta hoy)';

        leyOc('leySemana');
        Graficos.montar($('gSemana'), 'lineas', {
          etiquetas: oc.porSemana.map(function (s) { return s.semana.slice(8, 10) + '/' + s.semana.slice(5, 7); }),
          titulos: oc.porSemana.map(function (s) { return 'Semana del ' + fechaES(s.semana); }),
          series: seriesOc(oc.porSemana), formato: pc, max: 100, descripcion: 'Ocupación semanal en porcentaje'
        });
        nota('nSemana', notaOc + '. Las semanas sin huecos abiertos (festivos, cerradas) no se dibujan.');

        leyOc('leyDia');
        Graficos.montar($('gDia'), 'barras', {
          etiquetas: oc.porDiaSemana.map(function (d) { return d.etiqueta.slice(0, 3); }), titulos: oc.porDiaSemana.map(function (d) { return d.etiqueta; }),
          series: seriesOc(oc.porDiaSemana), formato: pc, max: 100, alto: 200, anchoEtiqueta: 34, descripcion: 'Ocupación por día de la semana'
        });
        nota('nDia', notaOc);

        leyOc('leyFranja');
        Graficos.montar($('gFranja'), 'barras', {
          etiquetas: oc.porFranja.map(function (f) { return f.hora; }), series: seriesOc(oc.porFranja), formato: pc, max: 100, alto: 200,
          anchoEtiqueta: 40, descripcion: 'Ocupación por franja horaria'
        });
        nota('nFranja', notaOc);

        Graficos.montar($('gAsistencia'), 'barrasH', {
          items: [{ etiqueta: 'Asistido', valor: fa.asistido, clase: 1 }, { etiqueta: 'No asistido', valor: fa.noAsistido, clase: 4 },
                  { etiqueta: 'Justificada', valor: fa.justificada, clase: 3 }, { etiqueta: 'Sin registrar (ya pasadas)', valor: fa.sinRegistrar, clase: 2 },
                  { etiqueta: 'Pendiente (futuras)', valor: fa.pendiente, clase: 5 }],
          formato: num, descripcion: 'Número de citas por estado de asistencia'
        });
        nota('nAsistencia', 'El % de faltas se calcula con las ' + fa.n + ' citas con asistencia registrada (Asistido + No asistido + Justificada); «Sin registrar» y «Pendiente» quedan fuera.');

        var cuerpo = $('cuerpoReinc');
        limpiar(cuerpo);
        if (!re.lista.length) {
          var vacia = hijo(cuerpo, 'tr'), td = hijo(vacia, 'td', null, 'Ningún usuario con ' + re.umbral + ' faltas o más en el periodo.'); td.colSpan = 3;
        }
        re.lista.forEach(function (u) {
          var tr = hijo(cuerpo, 'tr');
          hijo(tr, 'td', null, u.nombre || '(usuario eliminado)');
          hijo(tr, 'td', 'num', String(u.noAsistidas));
          hijo(tr, 'td', 'num', String(u.registradas));
        });
        nota('nReinc', re.total + ' de ' + plural(re.usuariosConRegistro, 'usuario', 'usuarios') + ' con citas registradas' + (re.total > re.lista.length ? ' · se muestran los ' + re.lista.length + ' con más faltas' : ''));

        var meses = p.porMes.meses;
        Graficos.leyenda($('leyMes'), [{ nombre: 'Inscripciones', clase: 0 }, { nombre: 'Altas', clase: 1 }]);
        Graficos.montar($('gMes'), 'barras', {
          etiquetas: meses.map(function (m, i) { var k = +m.mes.slice(5, 7); return MESES[k - 1] + (i === 0 || k === 1 ? ' ' + m.mes.slice(2, 4) : ''); }),
          titulos: meses.map(function (m) { return mesLargo(m.mes); }),
          series: [{ nombre: 'Inscripciones', clase: 0, valores: meses.map(function (m) { return m.inscripciones; }) },
                   { nombre: 'Altas', clase: 1, valores: meses.map(function (m) { return m.altas; }) }],
          atenuar: meses.map(function (m) { return m.futuro; }), formato: num, alto: 200, anchoEtiqueta: 44, descripcion: 'Inscripciones y altas por mes'
        });
        nota('nMes', plural(p.porMes.inscripciones, 'inscripción', 'inscripciones') + ' y ' + plural(p.porMes.altas, 'alta', 'altas') + ' en el periodo · '
          + p.porMes.sinFechaInscripcion + ' usuarios sin fecha de inscripción no se cuentan en las inscripciones. Los meses futuros salen atenuados.');

        var te = p.tiempoEspera, le = p.listaEspera, du = p.duracion, se = p.sesiones;
        tramosGrafico('gEsperaIngreso', te.tramos, 'Usuarios', 'Usuarios por días de espera hasta su primer ingreso');
        nota('nEsperaIngreso', 'n = ' + te.n + ' (media ' + dias(te.dias.media) + ', mediana ' + dias(te.dias.mediana) + '). Excluidos: ' + te.sinInscripcion + ' sin fecha de inscripción, ' + te.incoherentes + ' con fechas incoherentes.');
        tramosGrafico('gEsperaHoy', le.tramos, 'Usuarios', 'Usuarios en lista de espera por días esperando');
        nota('nEsperaHoy', le.total + ' en lista de espera; n = ' + le.n + ' con fecha de inscripción (media ' + dias(le.dias.media) + ', máximo ' + dias(le.dias.max) + ').');
        tramosGrafico('gDuracion', du.tramos, 'Episodios', 'Episodios cerrados por duración del tratamiento');
        nota('nDuracion', 'n = ' + du.n + ' de ' + plural(du.altasEnPeriodo, 'alta', 'altas') + ' (media ' + dias(du.dias.media) + ', mediana ' + dias(du.dias.mediana) + '). Episodios abiertos hoy: ' + du.abiertos + ' (no entran).');
        tramosGrafico('gSesiones', se.tramos, 'Episodios', 'Episodios por número de sesiones asistidas');
        nota('nSesiones', 'n = ' + se.n + ' episodios cerrados iniciados desde el ' + fechaES(se.desde) + ' (media ' + num(se.porEpisodio.media) + ', mediana ' + num(se.porEpisodio.mediana) + '). Se cuentan citas «Asistido» entre el ingreso y el alta.');

        var dc = r.citas.diagnostico, dp = p.diagnostico;
        $('pie').textContent = 'Citas en el periodo: ' + dc.citasEnPeriodo + ' · citas sin ID de usuario (no cuentan): ' + dc.citasSinId + ' · festivos marcados: ' + dc.festivos
          + ' · episodios de HC sin usuario: ' + dp.episodiosSinPaciente;
      }

      // ---------- Evolución clínica ----------
      var ANALG_NIVELES = ['Ninguno', 'Ocasional (< 1 vez/semana)', 'Semanal (1–2 veces/semana)', 'Habitual (casi todos los días)', 'Diario (1 vez al día)', 'Varios al día'];
      var ANALG_CORTO = ['Ninguno', 'Ocasional', 'Semanal', 'Habitual', 'Diario', 'Varios/día'];

      function pintarClinica(r) {
        var e = r.clinica.evolucion, g = e.global, d = e.dolor, f = e.funcion, a = e.analgesicos, dg = r.clinica.diagnostico;
        prepararEvolucion(e);
        limpiar($('kpisClinica'));
        resumen('detClinica', pct(g.pctMejoran) + ' mejoran · dolor ' + firmado(d.cambio.media, ' pts') + ' · función ' + firmado(f.cambio.media, ' pts'));
        var k = function () { kpiEn.apply(null, ['kpisClinica'].concat([].slice.call(arguments))); };
        var detalle = function (v) { return v.mejoran + ' mejoran · ' + v.igual + ' igual · ' + v.empeoran + ' empeoran'; };
        k('Usuarios que mejoran', pct(g.pctMejoran), g.mejoran + ' de ' + g.n + ' · el dolor baja o la función sube',
          'Calculado con ' + plural(g.n, 'usuario', 'usuarios') + ' con 2 o más valoraciones',
          avisos([e.sinComparar ? plural(e.sinComparar, 'usuario con una sola fecha', 'usuarios con una sola fecha') + ' (no se compara)' : '', g.sinDato ? g.sinDato + ' sin dolor ni función en la primera o la última' : '']));
        k('Dolor (PEG)', firmado(d.cambio.media, ' pts'), d.n ? 'Escala 0–10, menos es mejor' : '',
          'n = ' + d.n + (d.n ? ' · ' + detalle(d) : ''), d.sinDato ? d.sinDato + ' sin dolor en la primera o la última' : '');
        k('Función global', firmado(f.cambio.media, ' pts'), f.n ? 'Escala 0–10, más es mejor' : '',
          'n = ' + f.n + (f.n ? ' · ' + detalle(f) : ''), f.sinDato ? f.sinDato + ' sin función en la primera o la última' : '');
        k('Reducen analgésicos', pct(a.n ? Math.round(a.mejoran / a.n * 1000) / 10 : null), a.n ? a.mejoran + ' reducen · ' + a.igual + ' igual · ' + a.empeoran + ' aumentan' : '',
          'n = ' + a.n + ' usuarios con analgésicos registrados en la primera y la última', a.sinDato ? a.sinDato + ' sin analgésicos registrados en la primera o la última' : '');

        var pareja = [{ nombre: 'Primera valoración', clase: 5 }, { nombre: 'Última valoración', clase: 0 }];
        Graficos.leyenda($('leyClinEscala'), pareja);
        Graficos.montar($('gClinEscala'), 'barras', {
          etiquetas: ['Dolor (PEG)', 'Función global'], titulos: ['Dolor (PEG, 0–10; menos es mejor)', 'Función global (0–10; más es mejor)'],
          series: [{ nombre: pareja[0].nombre, clase: 5, valores: [d.primera, f.primera] }, { nombre: pareja[1].nombre, clase: 0, valores: [d.ultima, f.ultima] }],
          formato: num, max: 10, alto: 200, anchoEtiqueta: 90, descripcion: 'Media de dolor y de función global en la primera y la última valoración'
        });
        nota('nClinEscala', 'Medias de ' + plural(d.n, 'usuario', 'usuarios') + ' en dolor y de ' + f.n + ' en función (los que tienen valor en la primera y en la última). Entre la primera y la última pasan ' + dias(e.diasEntre.mediana) + ' de mediana.');

        Graficos.leyenda($('leyClinAnalg'), pareja);
        Graficos.montar($('gClinAnalg'), 'barras', {
          etiquetas: ANALG_CORTO, titulos: ANALG_NIVELES,
          series: [{ nombre: pareja[0].nombre, clase: 5, valores: a.niveles.map(function (x) { return x.primera; }) }, { nombre: pareja[1].nombre, clase: 0, valores: a.niveles.map(function (x) { return x.ultima; }) }],
          formato: num, alto: 200, anchoEtiqueta: 62, descripcion: 'Usuarios por nivel de consumo de analgésicos en la primera y la última valoración'
        });
        nota('nClinAnalg', 'Usuarios por nivel de consumo; n = ' + a.n + '. «Sin registrar» no se dibuja: ' + a.sinDato + ' usuarios sin dato en la primera o la última.');

        Graficos.leyenda($('leyClinCambio'), [{ nombre: 'Dolor', clase: 0 }, { nombre: 'Función global', clase: 1 }, { nombre: 'Analgésicos (mejoran = reducen)', clase: 3 }]);
        Graficos.montar($('gClinCambio'), 'barras', {
          etiquetas: ['Mejoran', 'Sin cambio', 'Empeoran'],
          series: [{ nombre: 'Dolor', clase: 0, valores: [d.mejoran, d.igual, d.empeoran] }, { nombre: 'Función global', clase: 1, valores: [f.mejoran, f.igual, f.empeoran] },
                   { nombre: 'Analgésicos', clase: 3, valores: [a.mejoran, a.igual, a.empeoran] }],
          formato: num, alto: 200, anchoEtiqueta: 70, descripcion: 'Usuarios que mejoran, siguen igual o empeoran en dolor, función y analgésicos'
        });
        nota('nClinCambio', 'Dolor: mejora si baja. Función: mejora si sube. Analgésicos: «mejoran» = reducen el consumo (no entra en la mejora global). Mejora global (dolor baja o función sube): ' + g.mejoran + ' de ' + g.n + '.');
        $('pie').textContent += ' · valoraciones leídas: ' + dg.valoraciones + ' · filas sin ID de usuario (no cuentan): ' + dg.filasSinId + ' · filas sin fecha válida: ' + dg.filasSinFecha;
      }

      // ---------- Flujo de estados ----------
      var CLASE_ESTADO = { activo: 1, espera: 3, contactara: 2, noresponde: 4, alta: 0 };

      function pintarEstados(r) {
        var f = r.estados.flujo, d = f.datos, dg = r.estados.diagnostico, h = f.estadoActual;
        var itemEstado = function (clase) { return f.estadoActual.items.filter(function (x) { return x.clase === clase; })[0]; };
        var tiempo = function (clase) { return f.tiempoEnEstado.filter(function (x) { return x.clase === clase; })[0]; };
        var sinDatos = !d.cambiosReales;
        limpiar($('kpisFlujo'));
        resumen('detEstados', plural(itemEstado('activo').n, 'activo', 'activos') + ' · ' + num(itemEstado('espera').n) + ' en espera · ' + plural(f.transiciones.total, 'cambio', 'cambios'));
        var k = function () { kpiEn.apply(null, ['kpisFlujo'].concat([].slice.call(arguments))); };
        k('Activos hoy', num(itemEstado('activo').n), 'De ' + plural(h.total, 'usuario', 'usuarios') + ' con estado', 'Estado actual en la Maestra', h.sinEstado ? plural(h.sinEstado, 'usuario sin estado', 'usuarios sin estado') : '');
        k('En espera hoy', num(itemEstado('espera').n), 'Contactará: ' + itemEstado('contactara').n + ' · No responde: ' + itemEstado('noresponde').n, 'Estado actual en la Maestra', '');
        k('Cambios de estado', num(f.transiciones.total), sinDatos ? 'Aún sin cambios registrados' : 'Entre estados distintos, en el periodo',
          'Registro real desde el ' + (d.desde ? fechaES(d.desde) : '—'), avisos([d.cambiosEnPeriodo - f.transiciones.total > 0 ? plural(d.cambiosEnPeriodo - f.transiciones.total, 'cambio', 'cambios') + ' sin estado anterior (altas de usuarios nuevos)' : '']));
        var ta = tiempo('activo');
        k('Tiempo en Activo', dias(ta.dias.media), 'Mediana: ' + dias(ta.dias.mediana), 'Calculado con ' + plural(ta.n, 'estancia cerrada', 'estancias cerradas'),
          ta.n < 5 ? 'Pocos datos todavía: se afinará con las semanas' : '');

        Graficos.montar($('gFlujoHoy'), 'barrasH', {
          items: f.estadoActual.items.map(function (x) { return { etiqueta: x.etiqueta, valor: x.n, clase: CLASE_ESTADO[x.clase] }; }),
          formato: num, descripcion: 'Número de usuarios en cada estado hoy'
        });
        nota('nFlujoHoy', plural(h.total, 'usuario', 'usuarios') + ' con estado' + (h.otros ? ' · ' + h.otros + ' con un estado no reconocido' : '') + '. Es la foto de hoy: no depende del periodo.');

        Graficos.montar($('gFlujoTiempo'), 'barrasH', {
          items: f.tiempoEnEstado.filter(function (t) { return t.n > 0; }).map(function (t) { return { etiqueta: t.etiqueta + ' (n=' + t.n + ')', valor: t.dias.media, clase: CLASE_ESTADO[t.clase] }; }),
          formato: num, vacio: 'Todavía no hay estancias cerradas: hace falta que un usuario entre en un estado y salga de él con el historial ya activo.',
          descripcion: 'Días de media que los usuarios pasan en cada estado'
        });
        nota('nFlujoTiempo', 'Solo estancias cerradas por dos cambios registrados que acaban en el periodo. No se miden ' + plural(d.estanciasAbiertas, 'estancia abierta', 'estancias abiertas')
          + (d.estanciasIncoherentes ? ' ni ' + plural(d.estanciasIncoherentes, 'estancia con registros que no encajan', 'estancias con registros que no encajan') : '') + '.');

        var meses = f.entradasPorMes.meses;
        var serie = function (c) { return { nombre: dashEtiqueta(c), clase: CLASE_ESTADO[c], valores: meses.map(function (m) { return m[c]; }) }; };
        var orden = ['activo', 'espera', 'contactara', 'noresponde', 'alta'];
        Graficos.leyenda($('leyFlujoMes'), orden.map(function (c) { return { nombre: dashEtiqueta(c), clase: CLASE_ESTADO[c] }; }));
        Graficos.montar($('gFlujoMes'), 'barras', {
          etiquetas: meses.map(function (m, i) { var q = +m.mes.slice(5, 7); return MESES[q - 1] + (i === 0 || q === 1 ? ' ' + m.mes.slice(2, 4) : ''); }),
          titulos: meses.map(function (m) { return mesLargo(m.mes); }),
          series: orden.map(serie), atenuar: meses.map(function (m) { return m.futuro; }), formato: num, alto: 200, anchoEtiqueta: 44,
          descripcion: 'Usuarios que entran en cada estado, por mes'
        });
        nota('nFlujoMes', plural(f.entradasPorMes.total, 'entrada', 'entradas') + ' en el periodo, contadas por el estado al que entra el usuario (incluye los usuarios nuevos). Los meses futuros salen atenuados.');

        var cuerpo = $('cuerpoFlujo');
        limpiar(cuerpo);
        if (!f.transiciones.lista.length) {
          var vacia = hijo(cuerpo, 'tr'), td = hijo(vacia, 'td', null, sinDatos ? 'Todavía no hay cambios de estado registrados.' : 'Ningún cambio de estado en el periodo.'); td.colSpan = 3;
        }
        f.transiciones.lista.forEach(function (t) {
          var tr = hijo(cuerpo, 'tr');
          hijo(tr, 'td', null, t.deEtiqueta); hijo(tr, 'td', null, t.aEtiqueta); hijo(tr, 'td', 'num', String(t.n));
        });
        nota('nFlujo', f.transiciones.total + ' cambios en total' + (f.transiciones.distintas > f.transiciones.lista.length ? ' · se muestran los ' + f.transiciones.lista.length + ' más frecuentes' : '')
          + ' · filas del historial leídas: ' + dg.filasEstado + (dg.filasSinId || dg.filasSinFecha ? ' (sin ID: ' + dg.filasSinId + ', sin fecha válida: ' + dg.filasSinFecha + ')' : ''));
      }
      function dashEtiqueta(c) { return { activo: 'Activo', espera: 'En espera', contactara: 'Contactará', noresponde: 'No responde', alta: 'Alta' }[c]; }

      // ---------- Diagnósticos ----------
      function pintarDiagnosticos(r) {
        var d = r.diagnosticos, filas = d.patologias, conUsuarios = filas.filter(function (x) { return x.usuarios > 0; });
        var zonaTop = d.zonas.slice().sort(function (a, b) { return b.n - a.n; })[0];
        limpiar($('kpisDiag'));
        resumen('detDiagnosticos', plural(d.usuarios, 'usuario', 'usuarios') + ' · ' + plural(conUsuarios.length, 'patología', 'patologías') + (zonaTop && zonaTop.n ? ' · más: ' + zonaTop.zona : ''));
        var k = function () { kpiEn.apply(null, ['kpisDiag'].concat([].slice.call(arguments))); };
        k('Usuarios con ingreso', num(d.usuarios), 'En el periodo', 'Usuarios con algún episodio cuyo ingreso cae en el periodo',
          avisos([d.sinDiagnostico ? plural(d.sinDiagnostico, 'usuario sin patología', 'usuarios sin patología') : '', d.noReconocidos ? plural(d.noReconocidos, 'usuario con una patología fuera de la lista', 'usuarios con una patología fuera de la lista') : '']));
        k('Patología más frecuente', conUsuarios.length ? conUsuarios[0].nombre : '—', conUsuarios.length ? conUsuarios[0].codigo + ' · ' + plural(conUsuarios[0].usuarios, 'usuario', 'usuarios') : '',
          'Entre las ' + conUsuarios.length + ' patologías con usuarios en el periodo', '');
        k('Zona más frecuente', zonaTop && zonaTop.n ? zonaTop.zona : '—', zonaTop && zonaTop.n ? plural(zonaTop.n, 'usuario', 'usuarios') : '', 'Cada usuario cuenta una vez por zona', '');

        Graficos.montar($('gDiagPatologia'), 'barrasH', {
          items: conUsuarios.map(function (x) { return { etiqueta: x.nombre + ' · ' + x.codigo, valor: x.usuarios, clase: 0 }; }),
          formato: num, vacio: 'Ningún usuario con ingreso en el periodo tiene patología.', descripcion: 'Usuarios por patología, de más a menos'
        });
        nota('nDiagPatologia', 'Usuarios con ingreso en el periodo, por patología (código CIE-10). Un usuario con dos patologías cuenta en las dos. Pasa el ratón por una barra para ver el nombre completo.');

        Graficos.montar($('gDiagZona'), 'barrasH', {
          items: d.zonas.map(function (x) { return { etiqueta: x.zona, valor: x.n, clase: 1 }; }),
          formato: num, vacio: 'Ningún usuario con ingreso en el periodo tiene patología.', descripcion: 'Usuarios por zona'
        });
        nota('nDiagZona', 'Cada usuario cuenta una vez en cada zona en la que tenga alguna patología.');

        var cuerpo = $('cuerpoDiag');
        limpiar(cuerpo);
        if (!filas.length) { var vacia = hijo(cuerpo, 'tr'), td = hijo(vacia, 'td', null, 'Sin datos de patologías en el periodo.'); td.colSpan = 6; }

        var sel = $('selMes'), actual = sel.value, tope = r.hoy.slice(0, 7) < r.curso.desde.slice(0, 7) ? r.curso.desde.slice(0, 7) : r.hoy.slice(0, 7);

      function actualizarVisibilidad() {

      function mostrarAviso(texto) { $('textoAviso').textContent = texto; $('aviso').hidden = !texto; }

      function cargar(forzar) {

        cargando(true);
        google.script.run

            datos = r;
            var claves = JSON.stringify(r.opciones);
            if (!mesesListos) poblarMeses(r);
            if (claves !== opcionesVistas) {
              opcionesVistas = claves;
              poblarFiltro($('fTipo'), r.opciones.tipos, 'Tipo de ingreso: todos');
              poblarFiltro($('fZona'), r.opciones.zonas, 'Zona: todas');

            pintarClinica(r);

            pintarDiagnosticos(r);
            botonesPng();
            animar = false;

          .withFailureHandler(function (e) {

            quitarEsqueletos();

      // ---------- Tema: automático / oscuro / claro (compartido con las otras pestañas) ----------
      var TEMAS = ['auto', 'oscuro', 'claro'], ICONOS_TEMA = { auto: 'contrast', oscuro: 'dark_mode', claro: 'light_mode' };
      function aplicarTema(t, guardar) {
        if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);

        hijo(b, 'span', 'material-symbols-outlined', ICONOS_TEMA[t]);

        try { t = localStorage.getItem('temaApp') || 'auto'; } catch (err) { /* sin almacenamiento */ }
