<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Semanal</title>
  
  <!-- Tailwind CSS para utilidades ágiles (Layout) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts & Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Material Design 3 / Paleta Azul Acero Unificada ── */
    :root {
      --bg:              #f8f9fa;   /* Fondo neutro claro */
      --surface:         #ffffff;
      --surface-2:       #f1f3f4;
      --border:          #dadce0;
      --border-focus:    #2b5c75;
      
      --text-1:          #202124;   /* Negro Workspace */
      --text-2:          #5f6368;   /* Gris medio */
      --text-3:          #80868b;   /* Gris claro */
      
      --accent:          #2b5c75;   /* Azul Acero Desaturado */
      --accent-light:    #e0f1fc;
      --accent-dark:     #1d3f52;
      --md-primary-container: #c9e4f5;

      /* Turnos de Citas Armonizados en Pastel */
      --morning-bg:      #e8f0fe;   /* Azul pastel */
      --morning-border:  #1a73e8;
      --morning-text:    #1557b0;
      
      --afternoon-bg:    #e6f4ea;   /* Verde pastel */
      --afternoon-border:#137333;
      --afternoon-text:  #137333;

      --radius:          8px;
      --radius-lg:       12px;
      --radius-pill:     50px;
      
      --shadow:          0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
      --shadow-focus:    0 0 0 3px rgba(43,92,117,.15);
      --font:            'Google Sans', 'Segoe UI', Arial, sans-serif;
      --mono:            'Roboto Mono', monospace;
      --transition:      150ms cubic-bezier(.2,0,0,1);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      padding: 2.5rem 1.25rem 4rem;
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Base para iconos Material Symbols */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      line-height: 1;
      display: inline-block;
    }

    /* ── Top App Bar (Workspace style) ── */
    .page-header {
      max-width: 1080px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeDown .3s ease both;
    }
    .logo-mark {
      width: 44px; height: 44px;
      background: var(--accent-light);
      border-radius: var(--radius-lg);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: var(--accent);
    }
    .page-header-text h1 {
      font-size: 18px;
      font-weight: 400;
      color: var(--text-1);
      line-height: 1.2;
    }
    .page-header-text p {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* ── Controls ── */
    .controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text-2);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform var(--transition);
      white-space: nowrap;
    }
    .btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }
    .btn:active { transform: scale(0.98); }

    .btn-nav {
      width: 38px; height: 38px;
      padding: 0;
      border-radius: 50%;
    }

    /* Botón Hoy - Tonal suave estilo MD3 */
    .btn-primary {
      background: var(--md-primary-container);
      color: var(--accent-dark);
      border-color: transparent;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #badef3;
      color: var(--accent-dark);
    }

    input[type="date"] {
      height: 38px;
      padding: 0 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--text-2);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input[type="date"]:focus { border-color: var(--border-focus); box-shadow: var(--shadow-focus); }

    /* ── Week label pill ── */
    .week-label-bar {
      max-width: 1080px;
      margin: 0 auto 1.25rem;
      animation: fadeUp .3s .05s ease both;
    }
    .week-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent-dark);
      border-radius: var(--radius-pill);
      padding: 6px 16px 6px 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1;
      user-select: none;
    }

    /* ── Card elevated ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
      animation: fadeUp .3s .1s ease both;
    }

    /* ── Agenda grid ── */
    .agenda-wrapper {
      padding: 1.5rem;
    }

    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    /* ── Day column ── */
    .day-column {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 180px;
    }

    .day-header {
      text-align: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .day-header .day-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-1);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .day-header .day-date {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .day-header.is-today .day-name { color: var(--accent); }
    .day-header.is-today .day-date { color: var(--accent); }
    .day-header.is-today {
      position: relative;
    }
    .day-header.is-today::after {
      content: 'hoy';
      display: inline-flex;
      align-items: center;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent-dark);
      background: var(--accent-light);
      border-radius: var(--radius-pill);
      padding: 1px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ── Event cards (Harmonized Pastel) ── */
    .event-card {
      border-radius: var(--radius);
      padding: 10px;
      border: 1.5px solid transparent;
      transition: transform var(--transition), box-shadow var(--transition);
      cursor: default;
    }
    .event-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    .event-card.morning-appointment {
      background: var(--morning-bg);
      border-color: var(--morning-border);
      border-left: 3px solid var(--morning-border);
    }
    .event-card.afternoon-appointment {
      background: var(--afternoon-bg);
      border-color: var(--afternoon-border);
      border-left: 3px solid var(--afternoon-border);
    }

    .event-time {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 3px;
    }
    .morning-appointment  .event-time { color: var(--morning-text); }
    .afternoon-appointment .event-time { color: var(--afternoon-text); }

    .event-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .event-meta {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.4;
    }
    .event-meta span { display: block; }

    .no-events {
      font-size: 11px;
      color: var(--text-3);
      text-align: center;
      font-style: italic;
      padding: 12px 0;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface-2);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-2);
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(248,249,250,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }
    .loading-overlay.hidden { display: none; }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      font-family: var(--mono);
    }

    /* ── Animations ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon { animation: spin 1s linear infinite; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      body { padding: 1.25rem .75rem 3rem; }
      .agenda-grid { grid-template-columns: repeat(3, 1fr); }
      .controls { margin-left: 0; width: 100%; }
    }
    @media (max-width: 520px) {
      body { padding: 0 0 3rem; }
      .card { border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
      .page-header { padding: 1rem .875rem .5rem; }
      .agenda-wrapper { padding: .875rem; }
      .agenda-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 360px) {
      .agenda-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="page-header">
    <div class="logo-mark">
      <span class="material-symbols-outlined text-[24px]">calendar_month</span>
    </div>
    <div class="page-header-text">
      <h1>Agenda Semanal</h1>
      <p>Visualización de citas por semana</p>
    </div>

    <div class="controls">
      <button class="btn btn-nav" onclick="changeWeek(-1)" title="Semana anterior">
        <span class="material-symbols-outlined text-[18px]">chevron_left</span>
      </button>
      <button class="btn btn-primary" onclick="goToToday()">Hoy</button>
      <button class="btn btn-nav" onclick="changeWeek(1)"  title="Semana siguiente">
        <span class="material-symbols-outlined text-[18px]">chevron_right</span>
      </button>
      <input type="date" id="weekPicker" onchange="selectWeek()" title="Ir a semana">
    </div>
  </header>

  <!-- Week label -->
  <div class="week-label-bar">
    <span class="week-label">
      <span class="material-symbols-outlined text-[16px]">event_note</span>
      <span id="weekDisplay">Cargando...</span>
    </span>
  </div>

  <!-- Card -->
  <div class="card">
    
    <!-- Título de Sección con Pill Pastel y Divisor Estilo Formulario -->
    <div class="section-label flex items-center gap-3 px-6 pt-5">
      <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#e0f1fc] text-[#1d4a61] font-semibold text-xs uppercase tracking-wider">
        <span class="material-symbols-outlined text-[16px]">schedule</span>
        Citas de la semana
      </span>
      <div class="section-divider flex-1 h-[1px] bg-[--border]"></div>
    </div>

    <div class="agenda-wrapper">
      <div class="agenda-grid" id="agendaGrid"></div>
    </div>
    
    <div class="legend">
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--morning-bg);border:1px solid var(--morning-border);"></span>
        Turno mañana
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--afternoon-bg);border:1px solid var(--afternoon-border);"></span>
        Turno tarde
      </div>
    </div>
  </div>

  <!-- Loading Overlay con Spinner de Material Symbols -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <span class="material-symbols-outlined spin-icon text-[36px] text-[--accent]">progress_activity</span>
    <div class="loading-text">Cargando agenda…</div>
  </div>

  <script>
    const DAY_NAMES   = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    const MONTH_NAMES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];

    let currentMonday      = new Date();
    const weekPicker       = document.getElementById('weekPicker');
    const agendaGrid       = document.getElementById('agendaGrid');
    const weekDisplay      = document.getElementById('weekDisplay');
    const loadingOverlay   = document.getElementById('loadingOverlay');

    function formatDate(date) {
      const d = new Date(date);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      d.setDate(d.getDate() - day + (day === 0 ? -6 : 1));
      return d;
    }

    function isToday(date) {
      const t = new Date();
      return date.getDate() === t.getDate() && date.getMonth() === t.getMonth() && date.getFullYear() === t.getFullYear();
    }

    document.addEventListener('DOMContentLoaded', () => {
      currentMonday = getMonday(new Date());
      weekPicker.valueAsDate = currentMonday;
      loadAgendaForWeek(currentMonday);
    });

    function loadAgendaForWeek(mondayDate) {
      showLoading();
      if (typeof google !== 'undefined') {
        google.script.run
          .withSuccessHandler(renderAgenda)
          .withFailureHandler(showError)
          .getWeekData(mondayDate.getTime());
      }
    }

    function renderAgenda(data) {
      hideLoading();
      agendaGrid.innerHTML = '';

      // Week label
      const weekEnd = new Date(currentMonday);
      weekEnd.setDate(currentMonday.getDate() + 4);
      weekDisplay.textContent =
        `${currentMonday.getDate()} – ${weekEnd.getDate()} de ${MONTH_NAMES[currentMonday.getMonth()]} de ${currentMonday.getFullYear()}`;

      // Build day buckets
      const days = {};
      for (let i = 0; i < 5; i++) {
        const d = new Date(currentMonday);
        d.setDate(currentMonday.getDate() + i);
        days[formatDate(d)] = [];
      }
      data.forEach(ev => { if (days[ev.Fecha]) days[ev.Fecha].push(ev); });

      // Render columns
      for (let i = 0; i < 5; i++) {
        const date   = new Date(currentMonday);
        date.setDate(currentMonday.getDate() + i);
        const key    = formatDate(date);
        const events = (days[key] || []).sort((a,b) => {
          const [ha,ma] = a.Hora.split(':').map(Number);
          const [hb,mb] = b.Hora.split(':').map(Number);
          return (ha*60+ma) - (hb*60+mb);
        });

        const col = document.createElement('div');
        col.className = 'day-column';

        // Header
        const hdr = document.createElement('div');
        hdr.className = 'day-header' + (isToday(date) ? ' is-today' : '');
        const shortDate = `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}`;
        hdr.innerHTML = `<div class="day-name">${DAY_NAMES[date.getDay()]}</div><div class="day-date">${shortDate}</div>`;
        col.appendChild(hdr);

        if (!events.length) {
          const empty = document.createElement('div');
          empty.className = 'no-events';
          empty.textContent = 'Sin citas';
          col.appendChild(empty);
        } else {
          events.forEach(ev => {
            const card = document.createElement('div');
            card.className = 'event-card';
            const [h] = ev.Hora.split(':').map(Number);
            if (h >= 8 && h < 14) card.classList.add('morning-appointment');
            else if (h >= 16)     card.classList.add('afternoon-appointment');

            let html = `<div class="event-time">${ev.Hora}</div><div class="event-name">${ev.Usuario}</div>`;
            const meta = [];
            if (ev.Teléfono) meta.push(`<span>📞 ${ev.Teléfono}</span>`);
            if (ev.Sesión)   meta.push(`<span>Ses. ${ev.Sesión}</span>`);
            if (ev.Notas)    meta.push(`<span>💬 ${ev.Notas}</span>`);
            if (meta.length) html += `<div class="event-meta">${meta.join('')}</div>`;

            card.innerHTML = html;
            col.appendChild(card);
          });
        }
        agendaGrid.appendChild(col);
      }
    }

    function changeWeek(delta) {
      currentMonday.setDate(currentMonday.getDate() + delta * 7);
      weekPicker.valueAsDate = currentMonday;
      loadAgendaForWeek(currentMonday);
    }

    function goToToday() {
      currentMonday = getMonday(new Date());
      weekPicker.valueAsDate = currentMonday;
      loadAgendaForWeek(currentMonday);
    }

    function selectWeek() {
      if (weekPicker.valueAsDate) {
        currentMonday = getMonday(weekPicker.valueAsDate);
        loadAgendaForWeek(currentMonday);
      }
    }

    function showLoading() { loadingOverlay.classList.remove('hidden'); }
    function hideLoading()  { loadingOverlay.classList.add('hidden'); }
    function showError(err) {
      hideLoading();
      console.error('Error:', err);
      agendaGrid.innerHTML = `<p style="color:var(--text-3);grid-column:1/-1;padding:1rem;text-align:center;">Error al cargar la agenda: ${err.message||err}</p>`;
    }
  </script>
</body>
</html>
