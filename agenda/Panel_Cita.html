<!--
  agenda/Panel_Cita.html
  Formulario de Cita como módulo del panel lateral de Usuarios.
  Se incluye desde usuarios/BaseDatos_Vista con <?!= include('agenda/Panel_Cita'); ?>
  API: PanelCita.abrir(contenedor, { idPaciente, paciente, onGuardado, onCancelar, alDisponibilidad })
    · idPaciente identifica al usuario (es lo que se envía al guardar); `paciente` (nombre) solo se usa para elegirlo si no llega el ID
      y hay un único usuario con ese nombre.
    · alDisponibilidad(res) → se llama cuando se aplica una disponibilidad desde el formulario (botón de la cabecera de «Agenda semanal»,
      solo visible si la página incluye el módulo PanelDisponibilidad). El formulario ya ha vuelto a pedir los huecos por su cuenta; la
      página solo necesita refrescar lo suyo (la Agenda recarga la semana).
  Devuelve { haCambiado(), alEscape() }:
    · haCambiado() → true si hay horas elegidas, notas/sesión escritas, se ha cambiado el usuario o hay cambios de
                     disponibilidad sin aplicar en la hoja abierta.
    · alEscape()   → cierra la hoja de Disponibilidad si está abierta o, si no, la lista de autocompletado o, si no, limpia las
                     horas seleccionadas (como el Esc del formulario original); devuelve true si lo ha gestionado.
  Origen: la antigua página completa `citas` (agenda/Cita_Vista.html), ya retirada.
  Funciones de servidor: obtenerUsuariosParaCitaWeb (lista de usuarios con ID, también homónimos), obtenerSemanasYHuecos y
  guardarCitasMultiples (agenda/Cita.gs), que recibe `idPaciente`. CSS acotado a .pc solo para la disposición; colores, esquinas, sombras
  y tiempos salen de ui/CSS_Global (campos .md-campo, botones .md-btn; el foco con teclado lo da la regla global).
  Requiere ui/JS_Formato_Nombre en la página (sanitizeName).
  A menos de 480 px de ancho los días se abrevian (LUN, MAR…) para que quepan las cinco columnas; con el panel
  ancho (BaseDatos_Vista lo ensancha a 520 px en pantallas grandes) se ven completos y los botones de hora crecen.
  Semana inicial: la que contiene el día de hoy; si hoy no está en ninguna (fin de semana o hueco en la hoja),
  la siguiente semana con fechas por delante; si tampoco hay, la que indique el servidor.
-->
<style>
.pc {
  display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative;
  font-family: var(--font); font-size: var(--fs-md); color: var(--md-on-surface); background: var(--md-surface);
  container-type: inline-size;
}
.pc .dn-l { display: none; }
@container (min-width: 480px) {
  .pc .dn-s { display: none; }
  .pc .dn-l { display: inline; }
  .pc .calendar-grid { gap: .5rem; }
  .pc .day-column { padding: .75rem .4rem; }
  .pc .day-label .day-name { font-size: var(--fs-xs); }
  .pc .day-label .day-date { font-size: var(--fs-2xs); }
  .pc .hour-button { font-size: var(--fs-sm); padding: .6rem 0; }
}
.pc .ms { font-family: 'Material Symbols Outlined'; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; user-select: none; flex-shrink: 0; color: var(--md-on-surface-med); }
.pc .ms-sm { font-size: 16px; }
.pc .md-btn .ms { font-size: 18px; color: inherit; }
.pc .md-btn--icon .ms { font-size: 20px; }
.pc .pc-msg .pc-msg-ic { color: inherit; vertical-align: -5px; margin-right: .45rem; }
.pc .pc-scroll { flex: 1; min-height: 0; overflow: auto; }

/* ── Secciones ── */
.pc .card-section { padding: 1.1rem 1.25rem 1.3rem; border-bottom: 1px solid var(--md-outline); }
.pc .card-section:last-child { border-bottom: none; }
.pc .section-label { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.1rem; }
.pc .section-pill { display: inline-flex; align-items: center; gap: .375rem; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary-dark); background: var(--md-primary-light); padding: .35rem .875rem .35rem .75rem; border-radius: var(--md-shape-full); }
.pc .section-pill .ms { font-size: 15px; color: var(--md-primary); }
.pc .section-divider { flex: 1; height: 1px; background: var(--md-outline); }
.pc .fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }

/* ── Campo de texto: .md-campo de CSS_Global; aqui solo lo propio del panel ── */
.pc .md-campo__etiqueta { max-width: calc(100% - 58px); overflow: hidden; text-overflow: ellipsis; }
.pc .md-campo:has(.md-campo__control:disabled) { --md-campo-fondo: var(--md-surface-variant); }   /* usuario mientras se carga la lista */
.pc .md-campo__control:disabled { cursor: not-allowed; }

/* ── Autocompletado ── */
.pc .ac-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: var(--z-popover); background: var(--md-surface); border-radius: var(--md-shape-md); box-shadow: var(--md-elev-2);
  max-height: 220px; overflow-y: auto; display: none; border: 1px solid var(--md-outline);
}
.pc .ac-menu.open { display: block; }
.pc .ac-item { padding: .7rem 1rem; cursor: pointer; font-size: var(--fs-md); color: var(--md-on-surface); display: flex; align-items: center; gap: .6rem; transition: background-color var(--dur-1) var(--ease); }
.pc .ac-item:hover { background: var(--md-primary-light); }
.pc .ac-txt { display: flex; flex-direction: column; min-width: 0; }
.pc .ac-sub { font-size: var(--fs-xs); color: var(--md-on-surface-med); }

/* ── Semana ── */
.pc .week-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; gap: .5rem; }
.pc .week-label { font-size: var(--fs-md); font-weight: 500; color: var(--md-on-surface); text-align: center; }
.pc .calendar-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4rem; }
.pc .day-column { background: var(--md-bg); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); padding: .7rem .3rem; display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
.pc .day-label { text-align: center; margin-bottom: .2rem; padding-bottom: .55rem; border-bottom: 1px solid var(--md-outline); }
.pc .day-label .day-name { font-size: var(--fs-2xs); font-weight: 600; color: var(--md-on-surface); text-transform: uppercase; letter-spacing: .02em; }
.pc .day-label .day-date { font-size: var(--fs-2xs); color: var(--md-on-surface-med); margin-top: .15rem; }
/* Hora: pasar el raton = capa del color del texto al 8 % (sin oscurecer ni sombra) */
.pc .hour-button {
  width: 100%; padding: .55rem 0; border: 1.5px solid transparent; border-radius: var(--md-shape-sm); cursor: pointer; font-family: var(--font); font-size: var(--fs-xs); font-weight: 500;
  text-align: center; line-height: 1.2; color: var(--md-on-surface);
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.pc .turno-manana { background-color: var(--md-primary-light); }
.pc .turno-tarde { background-color: var(--md-surface-variant); }
.pc .hour-button:hover { background-image: linear-gradient(color-mix(in srgb, currentColor 8%, transparent), color-mix(in srgb, currentColor 8%, transparent)); }
.pc .hour-button.selected { background-color: var(--md-primary-container); color: var(--md-primary-dark); border-color: var(--md-primary); font-weight: 600; }
.pc .slot-empty { font-size: var(--fs-2xs); color: var(--md-on-surface-med); text-align: center; padding: .6rem 0; font-style: italic; }
.pc .legend-container { display: flex; gap: 1rem; margin-top: 1.1rem; flex-wrap: wrap; }
.pc .legend-item { display: flex; align-items: center; gap: .4rem; font-size: var(--fs-xs); color: var(--md-on-surface-med); font-weight: 500; }
.pc .legend-color { width: 14px; height: 14px; border-radius: var(--md-shape-xs); }
.pc .pc-hint { margin-top: .9rem; font-size: var(--fs-xs); color: var(--md-on-surface-med); line-height: 1.5; }
.pc .pc-hint kbd { background: var(--md-surface-variant); padding: .1rem .35rem; border-radius: var(--md-shape-xs); border: 1px solid var(--md-outline); font-family: inherit; }
.pc .pc-vacio { color: var(--md-on-surface-med); text-align: center; grid-column: 1 / -1; padding: 1.5rem 0; }

/* ── Disponibilidad dentro del formulario: botón de la cabecera y hoja interna con flecha de volver ── */
.pc .pc-disp { width: 32px; height: 32px; flex: none; }
.pc .pc-disp .ms { font-size: 18px; }
.pc .pc-hoja { position: absolute; inset: 0; z-index: var(--z-panel); display: flex; flex-direction: column; background: var(--md-surface); }
.pc .pc-hoja[hidden] { display: none; }
.pc .pc-hoja-cab { flex: none; display: flex; align-items: center; gap: .6rem; padding: .55rem .9rem; border-bottom: 1px solid var(--md-outline); }
.pc .pc-hoja-cab strong { font-size: var(--fs-field); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .pc-hoja-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pc .pc-hoja-cuerpo > * { flex: 1 1 auto; min-height: 0; }

/* ── Mensajes (fijos encima del pie) ── */
.pc .pc-msg { flex: none; display: none; padding: .7rem 1.25rem; font-size: var(--fs-sm); font-weight: 500; }
.pc .pc-msg.success { display: block; background: var(--md-success-bg); color: var(--md-success); }
.pc .pc-msg.error { display: block; background: var(--md-error-bg); color: var(--md-error); }

/* ── Pie fijo (los botones son .md-btn de CSS_Global) ── */
.pc .panel-pie { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: .7rem 1rem; border-top: 1px solid var(--md-outline); background: var(--md-surface); }
.pc .spinner { animation: md-spin .8s linear infinite; }
</style>

<template id="tplPanelCita"><div class="pc">
  <div class="pc-scroll">

    <div class="card-section">
      <div class="section-label"><span class="section-pill"><span class="ms ms-sm">person_search</span>Datos del usuario</span><div class="section-divider"></div></div>

      <div class="md-campo md-campo--icono pc-f-paciente">
        <span class="ms md-campo__icono">person</span>
        <input type="text" id="pc-nombre" class="md-campo__control pc-nombre" placeholder=" " disabled autocomplete="off">
        <label class="md-campo__etiqueta" for="pc-nombre">Usuario</label>
        <div class="ac-menu pc-ac"></div>
      </div>

      <div class="fila-2">
        <div class="md-campo md-campo--icono pc-f-telefono">
          <span class="ms md-campo__icono">call</span>

          <label class="md-campo__etiqueta" for="pc-tel">Teléfono</label>
        </div>
        <div class="md-campo md-campo--icono pc-f-sesion">
          <span class="ms md-campo__icono">tag</span>
          <input type="text" id="pc-sesion" class="md-campo__control pc-sesion" placeholder=" ">
          <label class="md-campo__etiqueta" for="pc-sesion">Sesión</label>
        </div>
      </div>

      <div class="md-campo md-campo--icono pc-f-notas" style="margin-top:1rem">
        <span class="ms md-campo__icono">notes</span>
        <textarea id="pc-notas" class="md-campo__control pc-notas" rows="2" placeholder=" "></textarea>
        <label class="md-campo__etiqueta" for="pc-notas">Notas clínicas o información relevante…</label>
      </div>
    </div>

    <div class="card-section">
      <div class="section-label"><span class="section-pill"><span class="ms ms-sm">calendar_month</span>Agenda semanal</span><div class="section-divider"></div><button type="button" class="md-btn md-btn--icon pc-disp" hidden title="Disponibilidad: abrir o cerrar horas de la agenda" aria-label="Disponibilidad de la agenda"><span class="ms">event_busy</span></button></div>

      <div class="week-nav">
        <button type="button" class="md-btn md-btn--icon pc-prev" disabled aria-label="Semana anterior" title="Semana anterior"><span class="ms">chevron_left</span></button>
        <div class="week-label pc-semana">Cargando agenda…</div>
        <button type="button" class="md-btn md-btn--icon pc-next" disabled aria-label="Semana siguiente" title="Semana siguiente"><span class="ms">chevron_right</span></button>
      </div>

      <div class="calendar-grid pc-grid"></div>

      <div class="legend-container">
        <span class="legend-item"><span class="legend-color" style="background:var(--md-primary-light);border:1px solid var(--md-outline)"></span>Mañana</span>
        <span class="legend-item"><span class="legend-color" style="background:var(--md-surface-variant);border:1px solid var(--md-outline)"></span>Tarde</span>
        <span class="legend-item"><span class="legend-color" style="background:var(--md-primary-container);border:1.5px solid var(--md-primary)"></span>Seleccionado</span>
      </div>
      <p class="pc-hint">Pulsa <kbd>Esc</kbd> para limpiar la selección de horas.</p>
    </div>

  </div>

  <div class="pc-msg" role="status" aria-live="polite"></div>

  <div class="panel-pie">
    <button title="Cerrar sin registrar" type="button" class="md-btn md-btn--text pc-cancelar">Cancelar</button>
    <button title="Registrar las citas seleccionadas" type="button" class="md-btn md-btn--tonal pc-guardar" disabled>
      <span class="ms pc-btn-icon">save</span><span class="pc-btn-texto">Registrar citas</span>
    </button>
  </div>

  <div class="pc-hoja" hidden>
    <div class="pc-hoja-cab">
      <button type="button" class="md-btn md-btn--icon pc-hoja-volver" title="Volver al formulario (Esc)" aria-label="Volver al formulario"><span class="ms">arrow_back</span></button>
      <strong>Disponibilidad</strong>
    </div>
    <div class="pc-hoja-cuerpo"></div>
  </div>
</div></template>

<script>
window.PanelCita = {
  abrir: function (host, opts) {
    opts = opts || {};
    host.innerHTML = '';
    host.appendChild(document.getElementById('tplPanelCita').content.cloneNode(true));
    var pc = host.querySelector('.pc');
    function q(sel) { return pc.querySelector(sel); }

    var calendarGrid = q('.pc-grid'), currentWeekLabel = q('.pc-semana');
    var btnGuardar = q('.pc-guardar'), btnText = q('.pc-btn-texto'), btnIcon = q('.pc-btn-icon');
    var msgBox = q('.pc-msg'), prevBtn = q('.pc-prev'), nextBtn = q('.pc-next');
    var numSesionInput = q('.pc-sesion'), notasTextarea = q('.pc-notas'), telefonoUsuarioInput = q('.pc-tel');
    var nombreUsuarioInput = q('.pc-nombre'), autocompleteList = q('.pc-ac');
    var btnDisp = q('.pc-disp'), hojaDisp = q('.pc-hoja'), hojaDispCuerpo = q('.pc-hoja-cuerpo');
    var dispHost = null, dispSub = null;   // hoja de Disponibilidad abierta (si la hay) y su controlador

    // Usuario ya elegido desde Usuarios. Vacío si no se pasa ninguno.
    var PACIENTE_PRESELECCIONADO = opts.paciente || '';
    var ID_PRESELECCIONADO = opts.idPaciente || '';

    var semanasData = [], currentWeekIndex = 0, selectedHuecos = [];
    var currentUserId = '', currentUserName = '', currentUserPhone = '';   // el usuario elegido va por ID paciente; el nombre solo se muestra
    var allPatientsList = [];   // [{ id, nombre, dni, tel1, tel2, estado }] en el orden de la Maestra (incluye homónimos)
    var inicial = { id: '', nombre: '', tel: '' };   // para saber si se ha cambiado de usuario / teléfono
    var timerMsg = null;

    var EXCLUDED_TIMES = ["", "", "", "", "00:30"];
    var DIA_ORDEN = { Lunes: 1, Martes: 2, 'Miércoles': 3, Jueves: 4, Viernes: 5 };

    /* ── Campos (la etiqueta flotante la resuelve el CSS de .md-campo) ── */
    pc.querySelectorAll('.md-campo__control').forEach(function (el) {
      el.addEventListener('focus', function () { el.closest('.md-campo').classList.remove('md-campo--error'); });
    });
    function setFieldValue(inputEl, value) { inputEl.value = value; }

    /* ── Mensajes ── */
    // `icono`: nombre de un Material Symbol; sin él, un error lleva «error» y un acierto no lleva ninguno.
    function mostrarFeedback(message, isSuccess, icono) {
      if (icono === undefined) icono = isSuccess ? '' : 'error';
      msgBox.innerHTML = (icono ? '<span class="ms pc-msg-ic">' + icono + '</span>' : '') + message;
      msgBox.className = 'pc-msg ' + (isSuccess ? 'success' : 'error');
      if (timerMsg) clearTimeout(timerMsg);
      if (isSuccess) timerMsg = setTimeout(function () { msgBox.className = 'pc-msg'; }, 6000);
    }

    /* ── Guardando… ── */
    function toggleLoading(isLoading) {
      btnGuardar.disabled = isLoading;
      if (isLoading) {
        btnIcon.textContent = 'autorenew'; btnIcon.classList.add('spinner');
        btnText.textContent = 'Guardando cita…';
      } else {
        btnIcon.textContent = 'save'; btnIcon.classList.remove('spinner');
        updateSaveButtonState();
      }
    }

    /* ── Calendario ── */
    // Semana que se muestra al abrir. No nos fiamos solo del índice del servidor: ese índice es 0 cuando hoy no
    // tiene cabecera de día en la hoja (sábado, domingo, festivo sin fila) y entonces se abriría la primera semana
    // de la hoja, que puede ser una semana pasada. Aquí: la semana cuyo rango de fechas contiene hoy; si no hay,
    // la primera con fechas posteriores a hoy; y solo si tampoco hay, el índice del servidor.
    function indiceSemanaInicial(semanas, indiceServidor) {
      var hoy = new Date(), n = hoy.getFullYear() * 10000 + (hoy.getMonth() + 1) * 100 + hoy.getDate();
      function num(k) { var p = k.split('/'); return (+p[2]) * 10000 + (+p[1]) * 100 + (+p[0]); }
      var primeraFutura = -1;
      for (var i = 0; i < semanas.length; i++) {
        var ks = semanas[i] && semanas[i].dias ? Object.keys(semanas[i].dias).map(num) : [];
        if (!ks.length) continue;
        var min = Math.min.apply(null, ks), max = Math.max.apply(null, ks);
        if (n >= min && n <= max) return i;
        if (primeraFutura < 0 && min > n) primeraFutura = i;
      }
      return primeraFutura >= 0 ? primeraFutura : (indiceServidor || 0);
    }
    function sortDaysByDate(dias) {
      return Object.keys(dias).sort(function (a, b) {
        var pa = a.split('/'), pb = b.split('/');
        return new Date(pa[2], pa[1] - 1, pa[0]) - new Date(pb[2], pb[1] - 1, pb[0]);
      });
    }
    function filterAndSortDays(diasData) {
      var sorted = sortDaysByDate(diasData), map = {};
      sorted.forEach(function (key) {
        var d = diasData[key], name = d.label.split(' ')[0].trim();
        if (DIA_ORDEN[name] && !map[name]) {
          d.huecos = d.huecos.filter(function (h) { return EXCLUDED_TIMES.indexOf(h.hora) === -1; });
          map[name] = d;
        }
      });
      return Object.keys(map).map(function (k) { return map[k]; })
        .sort(function (a, b) { return DIA_ORDEN[a.label.split(' ')[0]] - DIA_ORDEN[b.label.split(' ')[0]]; });
    }
    function getTurnoClass(hora) {
      var p = hora.split(':').map(Number), t = p[0] * 60 + p[1];
      if (t >= 480 && t <= 840) return 'turno-manana';
      if (t >= 850) return 'turno-tarde';
      return '';
    }
    function renderWeek() {
      if (!semanasData.length) {
        calendarGrid.innerHTML = '<p class="pc-vacio">No hay semanas disponibles.</p>';
        currentWeekLabel.textContent = 'Sin datos';
        return;
      }
      currentWeekIndex = Math.max(0, Math.min(currentWeekIndex, semanasData.length - 1));
      var week = semanasData[currentWeekIndex];
      if (week.error) { currentWeekLabel.textContent = 'Error'; calendarGrid.innerHTML = '<p class="pc-vacio" style="color:var(--md-error)">' + week.error + '</p>'; return; }
      currentWeekLabel.textContent = week.label;
      calendarGrid.innerHTML = '';
      filterAndSortDays(week.dias).forEach(function (dayData) {
        var col = document.createElement('div');
        col.className = 'day-column';
        var partes = dayData.label.split(' '), dayName = partes[0], fullDate = partes[1];
        var f = fullDate.split('/');
        var shortDate = f[0] + '/' + f[1] + '/' + f[2].slice(-2);
        var lbl = document.createElement('div');
        lbl.className = 'day-label';
        lbl.innerHTML = '<div class="day-name" title="' + dayName + '"><span class="dn-s">' + dayName.slice(0, 3) + '</span><span class="dn-l">' + dayName + '</span></div><div class="day-date">' + shortDate + '</div>';
        col.appendChild(lbl);
        if (!dayData.huecos.length) {
          var empty = document.createElement('p');
          empty.className = 'slot-empty';
          empty.textContent = 'Completo';
          col.appendChild(empty);
        } else {
          dayData.huecos.forEach(function (hueco) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'hour-button ' + getTurnoClass(hueco.hora);
            btn.textContent = hueco.hora;
            btn.setAttribute('data-value', hueco.value);
            btn.onclick = selectHueco;
            if (selectedHuecos.indexOf(hueco.value) !== -1) btn.classList.add('selected');
            col.appendChild(btn);
          });
        }
        calendarGrid.appendChild(col);
      });
      prevBtn.disabled = currentWeekIndex === 0;
      nextBtn.disabled = currentWeekIndex === semanasData.length - 1;
      updateSaveButtonState();
    }
    function changeWeek(delta) {
      var n = currentWeekIndex + delta;
      if (n >= 0 && n < semanasData.length) { currentWeekIndex = n; renderWeek(); }
    }
    function selectHueco(e) {
      e.currentTarget.classList.toggle('selected');
      selectedHuecos = Array.prototype.map.call(pc.querySelectorAll('.hour-button.selected'), function (b) { return b.getAttribute('data-value'); });
      updateSaveButtonState();
    }
    function deselectHueco() {
      if (!selectedHuecos.length) return false;
      pc.querySelectorAll('.hour-button.selected').forEach(function (b) { b.classList.remove('selected'); });
      selectedHuecos = [];
      updateSaveButtonState();
      mostrarFeedback('Selección de horas cancelada.', false);
      return true;
    }
    function updateSaveButtonState() {
      var valid = !!currentUserId;
      btnGuardar.disabled = !selectedHuecos.length || !valid;
      var c = selectedHuecos.length;
      btnText.textContent = c > 1 ? 'Registrar ' + c + ' citas' : c === 1 ? 'Registrar 1 cita' : 'Registrar citas';
    }

    /* ── Autocompletado ── */
    function stripAccents(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function cerrarAutocompletado() {
      var estabaAbierto = autocompleteList.classList.contains('open');
      autocompleteList.classList.remove('open');
      autocompleteList.innerHTML = '';
      return estabaAbierto;
    }
    function renderPatientSelect(usuarios, elegido) {
      allPatientsList = usuarios;
      nombreUsuarioInput.disabled = false;
      if (elegido) {
        setFieldValue(nombreUsuarioInput, elegido.nombre);
        currentUserId = elegido.id;
        currentUserName = elegido.nombre;
      }
      updateSaveButtonState();
    }
    nombreUsuarioInput.addEventListener('input', function () {
      sanitizeName(this);
      var val = stripAccents(this.value.toLowerCase());
      autocompleteList.innerHTML = '';
      currentUserId = '';
      currentUserName = '';
      if (!val) { autocompleteList.classList.remove('open'); updateSaveButtonState(); return; }
      var filtered = allPatientsList.filter(function (u) { return stripAccents(u.nombre.toLowerCase()).indexOf(val) !== -1; });
      autocompleteList.classList.toggle('open', filtered.length > 0);
      filtered.forEach(function (u) {
        var name = u.nombre;
        var item = document.createElement('div');
        item.className = 'ac-item';
        // Teléfono y DNI bajo el nombre: así se distinguen dos usuarios que se llaman igual.
        item.innerHTML = '<span class="ms ms-sm">person</span> <span class="ac-txt"><span class="ac-nom"></span><span class="ac-sub"></span></span>';
        item.querySelector('.ac-nom').textContent = name;
        var sub = [Telefono.formato(u.tel1 || u.tel2), u.dni].filter(Boolean).join(' · ');
        var elSub = item.querySelector('.ac-sub');
        if (sub) elSub.textContent = sub; else elSub.remove();
        item.addEventListener('click', function () {
          setFieldValue(nombreUsuarioInput, name);
          currentUserId = u.id;
          currentUserName = name;
          currentUserPhone = u.tel1 || '';
          setFieldValue(telefonoUsuarioInput, Telefono.formato(currentUserPhone));
          setFieldValue(numSesionInput, '');
          setFieldValue(notasTextarea, '');
          q('.pc-f-paciente').classList.remove('md-campo--error');
          mostrarFeedback('Usuario asignado: <strong></strong>', true);
          msgBox.querySelector('strong').textContent = name;
          cerrarAutocompletado();
          updateSaveButtonState();
        });
        autocompleteList.appendChild(item);
      });
      updateSaveButtonState();
    });
    pc.addEventListener('click', function (e) { if (e.target !== nombreUsuarioInput) cerrarAutocompletado(); });

    /* ── Carga de datos ── */
    function loadPatientData() {
      setFieldValue(nombreUsuarioInput, '');
      nombreUsuarioInput.disabled = true;
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.success || !res.usuarios) {
            nombreUsuarioInput.disabled = false;
            mostrarFeedback('Error al cargar usuarios: ' + ((res && res.message) || 'sin datos'), false);
            return;
          }
          var usuarios = res.usuarios, elegido = null;
          // Usuario de la ficha: por ID. Sin ID, solo si hay un único usuario con ese nombre (con homónimos no se adivina cuál es).
          if (ID_PRESELECCIONADO) {
            elegido = usuarios.filter(function (u) { return u.id === ID_PRESELECCIONADO; })[0] || null;
          } else if (PACIENTE_PRESELECCIONADO) {
            var iguales = usuarios.filter(function (u) { return u.nombre === PACIENTE_PRESELECCIONADO; });
            elegido = iguales.length === 1 ? iguales[0] : null;
          }
          renderPatientSelect(usuarios, elegido);
          if (elegido) {
            currentUserPhone = elegido.tel1 || '';
            setFieldValue(telefonoUsuarioInput, Telefono.formato(currentUserPhone));
            mostrarFeedback('Cita para: <strong></strong>', true, 'person');
            msgBox.querySelector('strong').textContent = elegido.nombre;
          } else {
            currentUserId = '';
            currentUserName = '';
            mostrarFeedback(ID_PRESELECCIONADO || PACIENTE_PRESELECCIONADO
              ? 'No se pudo identificar al usuario de la ficha (¿tiene ID paciente?). Elige uno de la lista.'
              : 'Selecciona un usuario para registrar su cita.', false);
          }
          inicial = { id: currentUserId, nombre: currentUserName, tel: telefonoUsuarioInput.value.trim() };
          updateSaveButtonState();
        })
        .withFailureHandler(function (err) {
          nombreUsuarioInput.disabled = false;
          mostrarFeedback('Error al cargar usuarios: ' + (err && err.message ? err.message : err), false);
        })
        .obtenerUsuariosParaCitaWeb();
    }
    function loadInitialData() {
      loadPatientData();
      currentWeekLabel.textContent = 'Cargando agenda…';
      toggleLoading(true);
      google.script.run
        .withSuccessHandler(function (res) {
          toggleLoading(false);
          semanasData = res.semanas;
          if (semanasData && semanasData.length) { currentWeekIndex = indiceSemanaInicial(semanasData, res.index); renderWeek(); }
        })
        .withFailureHandler(function (err) {
          toggleLoading(false);
          mostrarFeedback('Error al obtener la agenda de turnos: ' + (err && err.message ? err.message : err), false);
        })
        .obtenerSemanasYHuecos();
    }

    /* ── Disponibilidad (hoja interna) ── */
    // Lunes ("yyyy-MM-dd") de una semana de `semanasData`: la primera de sus fechas ("dd/MM/yyyy"), ordenadas. '' si no hay fechas.
    function lunesDeSemana(week) {
      if (!week || !week.dias) return '';
      var isos = Object.keys(week.dias).map(function (k) { var p = k.split('/'); return p[2] + '-' + p[1] + '-' + p[0]; }).sort();
      return isos[0] || '';
    }
    function confirmarDescartar(texto) {
      return typeof window.mostrarConfirm === 'function' ? window.mostrarConfirm(texto) : Promise.resolve(window.confirm(texto));
    }
    function desmontarDisponibilidad() {
      try { if (dispSub && dispSub.cerrar) dispSub.cerrar(); } catch (e) { /* no crítico */ }
      dispSub = null;
      if (dispHost) { dispHost.remove(); dispHost = null; }   // fuera del documento: un panel que aún cargaba ya no se monta
      hojaDisp.hidden = true;
    }
    // Cierra la hoja. Si hay cambios sin aplicar pregunta antes (salvo forzar === true). Devuelve una promesa con true si se cerró.
    function cerrarDisponibilidad(forzar) {
      if (!dispHost) return Promise.resolve(true);
      var anfitrion = dispHost;
      var antes = (forzar !== true && dispSub && dispSub.haCambiado && dispSub.haCambiado())
        ? confirmarDescartar('Hay cambios de disponibilidad sin aplicar. ¿Quieres descartarlos?') : Promise.resolve(true);
      return antes.then(function (ok) {
        if (!ok) return false;
        if (dispHost !== anfitrion) return true;   // otro cierre se adelantó
        desmontarDisponibilidad();
        if (!btnDisp.hidden) btnDisp.focus();
        return true;
      });
    }
    function abrirDisponibilidad() {
      if (dispHost || !window.PanelDisponibilidad) return;
      var host = document.createElement('div');
      host.style.cssText = 'display:flex;flex-direction:column;min-height:0;height:100%';
      hojaDispCuerpo.innerHTML = '';
      hojaDispCuerpo.appendChild(host);
      hojaDisp.hidden = false;
      dispHost = host;
      try {
        dispSub = window.PanelDisponibilidad.abrir(host, {
          semana: lunesDeSemana(semanasData[currentWeekIndex]),   // la semana que se está viendo en el formulario
          obtener: function (desde, hasta) {
            return new Promise(function (ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(ko).obtenerDisponibilidadWeb(desde, hasta); });
          },
          aplicar: function (datos) {
            return new Promise(function (ok, ko) { google.script.run.withSuccessHandler(ok).withFailureHandler(ko).aplicarDisponibilidadWeb(datos); });
          },
          onAplicado: alAplicarDisponibilidad,
          onCancelar: function () { cerrarDisponibilidad(); }
        });
      } catch (e) {
        desmontarDisponibilidad();
        mostrarFeedback('No se pudo abrir Disponibilidad: ' + (e && e.message ? e.message : e), false);
        return;
      }
      q('.pc-hoja-volver').focus();
    }
    // Se aplicó una disponibilidad: se cierra la hoja, se vuelven a pedir los huecos y se avisa a la página.
    function alAplicarDisponibilidad(res) {
      cerrarDisponibilidad(true).then(recargarHuecos);
      if (opts.alDisponibilidad) { try { opts.alDisponibilidad(res); } catch (e) { /* no crítico */ } }
    }
    // Vuelve a pedir semanas y huecos conservando usuario, notas, sesión y la semana que se veía; de la selección quita las horas que
    // hayan quedado cerradas (con aviso).
    function recargarHuecos() {
      var lunesAntes = lunesDeSemana(semanasData[currentWeekIndex]);
      btnGuardar.disabled = true;
      currentWeekLabel.textContent = 'Actualizando agenda…';
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.semanas) {
            renderWeek();
            mostrarFeedback('Disponibilidad actualizada, pero no se pudo recargar la agenda. Cierra y vuelve a abrir el formulario.', false);
            return;
          }
          semanasData = res.semanas;
          var idx = -1;
          for (var i = 0; i < semanasData.length; i++) { if (lunesAntes && lunesDeSemana(semanasData[i]) === lunesAntes) { idx = i; break; } }
          currentWeekIndex = idx >= 0 ? idx : indiceSemanaInicial(semanasData, res.index);
          var libres = {};
          semanasData.forEach(function (w) {
            if (w && w.dias) Object.keys(w.dias).forEach(function (k) { w.dias[k].huecos.forEach(function (h) { libres[h.value] = true; }); });
          });
          var antes = selectedHuecos.length;
          selectedHuecos = selectedHuecos.filter(function (v) { return libres[v]; });
          var quitadas = antes - selectedHuecos.length;
          renderWeek();   // pinta con la selección ya filtrada y recalcula el botón de guardar
          mostrarFeedback('Disponibilidad actualizada.' + (quitadas
            ? ' Se ' + (quitadas === 1 ? 'quitó 1 hora' : 'quitaron ' + quitadas + ' horas') + ' de la selección: ya no ' + (quitadas === 1 ? 'está disponible' : 'están disponibles') + '.' : ''),
            true, quitadas ? 'warning' : 'check_circle');
        })
        .withFailureHandler(function (err) {
          renderWeek();
          mostrarFeedback('Disponibilidad actualizada, pero no se pudo recargar la agenda: ' + (err && err.message ? err.message : err), false);
        })
        .obtenerSemanasYHuecos();
    }
    btnDisp.hidden = !window.PanelDisponibilidad;   // el botón solo existe si la página anfitriona incluye el módulo
    btnDisp.addEventListener('click', abrirDisponibilidad);
    q('.pc-hoja-volver').addEventListener('click', function () { cerrarDisponibilidad(); });

    /* ── Guardar ── */
    function enviarCita() {
      if (!currentUserId) {
        q('.pc-f-paciente').classList.add('md-campo--error');
        mostrarFeedback('Selecciona un usuario válido desde la lista autocompletable.', false);
        return;
      }
      toggleLoading(true);
      google.script.run
        .withSuccessHandler(function (res) {
          toggleLoading(false);
          mostrarFeedback(res.message, res.success, res.success ? (/no se pudieron guardar/.test(res.message) ? 'warning' : 'check_circle') : 'error');
          if (res.success) {
            setFieldValue(numSesionInput, '');
            setFieldValue(notasTextarea, '');
            selectedHuecos = [];
            inicial = { id: currentUserId, nombre: currentUserName, tel: telefonoUsuarioInput.value.trim() }; // ya guardado: cerrar no debe pedir confirmación
            btnGuardar.disabled = true;
            setTimeout(function () { if (opts.onGuardado) opts.onGuardado(); }, 1200);
          } else {
            loadInitialData();   // colisión u otro fallo: refrescamos la agenda
          }
        })
        .withFailureHandler(function (err) {
          toggleLoading(false);
          mostrarFeedback('Error al registrar la cita: ' + (err && err.message ? err.message : err), false);
        })
        .guardarCitasMultiples({
          idPaciente:      currentUserId,
          nombreUsuario:   currentUserName,   // solo de referencia: el servidor localiza al usuario por idPaciente
          telefonoUsuario: telefonoUsuarioInput.value.trim(),
          huecosJson:      selectedHuecos,
          numSesion:       numSesionInput.value.trim(),
          notas:           notasTextarea.value.trim()
        });
    }

    prevBtn.addEventListener('click', function () { changeWeek(-1); });
    nextBtn.addEventListener('click', function () { changeWeek(1); });
    btnGuardar.addEventListener('click', enviarCita);
    q('.pc-cancelar').addEventListener('click', function () { if (opts.onCancelar) opts.onCancelar(); });

    loadInitialData();

    return {
      haCambiado: function () {
        return (dispSub && dispSub.haCambiado ? !!dispSub.haCambiado() : false) ||
               selectedHuecos.length > 0 ||
               numSesionInput.value.trim() !== '' ||
               notasTextarea.value.trim() !== '' ||
               currentUserId !== inicial.id ||
               currentUserName !== inicial.nombre ||
               telefonoUsuarioInput.value.trim() !== inicial.tel;
      },
      alEscape: function () {
        if (dispHost) { cerrarDisponibilidad(); return true; }   // Esc cierra primero la hoja de Disponibilidad
        if (cerrarAutocompletado()) return true;
        return deselectHueco();
      }
    };
  }
};
</script>
