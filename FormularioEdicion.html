<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente</title>
    
    <!-- Tailwind CSS para utilidades ágiles (Layout de secciones) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Material Design 3 / Nueva Paleta Azul Acero ── */
      :root {
        --md-primary:          #2b5c75;   /* Azul Acero Desaturado */
        --md-primary-dark:     #1d3f52;
        --md-primary-light:    #e0f1fc;
        --md-primary-container:#c9e4f5;
        --md-on-primary:       #ffffff;
        
        --md-success:          #137333;
        --md-success-bg:       #e6f4ea;
        --md-error:            #c5221f;
        --md-warning:          #f29900;
        --md-warning-bg:       #fef7e0;

        --md-bg:               #f8f9fa;   /* Google's neutral bg */
        --md-surface:          #ffffff;
        --md-surface-variant:  #f1f3f4;
        --md-outline:          #dadce0;
        --md-outline-focus:    #2b5c75;

        --md-on-surface:       #202124;   /* Google's near-black */
        --md-on-surface-med:   #5f6368;   /* Google's medium grey */
        --md-on-surface-low:   #80868b;   /* Google's light grey */

        --md-header-bg:        #ffffff;
        --md-header-border:    #e0e0e0;

        --radius-sm:    4px;
        --radius-md:    8px;
        --radius-lg:    12px;
        --radius-pill:  50px;

        /* MD3 elevation via box-shadow */
        --elev-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        --elev-2: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
        --elev-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);

        --font:   'Google Sans', 'Segoe UI', Arial, sans-serif;
        --mono:   'Roboto Mono', monospace;
        --transition: 150ms cubic-bezier(.2,0,0,1);
      }

      body {
        font-family: var(--font);
        background: var(--md-bg);
        min-height: 100vh;
        padding: 0 0 5rem;
        color: var(--md-on-surface);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      /* Base para iconos Material Symbols */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        line-height: 1;
        display: inline-block;
      }

      /* ── Top App Bar ── */
      .page-header {
        background: var(--md-header-bg);
        border-bottom: 1px solid var(--md-header-border);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 1px 3px rgba(60,64,67,.08);
        animation: fadeDown .3s ease both;
        max-width: 100%;
        margin: 0;
      }
      .logo-mark {
        width: 36px; height: 36px;
        display: grid; place-items: center;
        flex-shrink: 0;
        color: var(--md-primary);
      }
      .page-header h1 {
        font-size: 18px;
        font-weight: 400;
        color: var(--md-on-surface);
        line-height: 1;
        white-space: nowrap;
      }
      .page-header p {
        font-size: 13px;
        color: var(--md-on-surface-low);
        margin-top: 2px;
      }
      .badge-date {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--md-on-surface-low);
        background: var(--md-surface-variant);
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        letter-spacing: .01em;
      }

      /* ── Content wrapper ── */
      .content-wrap {
        max-width: 880px;
        margin: 24px auto 0;
        padding: 0 16px;
        animation: fadeUp .3s .05s ease both;
      }

      /* ── Card (Material "Surface" elevated) ── */
      .card {
        background: var(--md-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--elev-1);
        overflow: visible;
      }
      .card-section {
        padding: 20px 24px 24px;
        border-bottom: 1px solid var(--md-outline);
      }
      .card-section:last-child { border-bottom: none; }

      /* ── Grid ── */
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .span-2  { grid-column: span 2; }

      @media (max-width: 600px) {
        .grid-2 { grid-template-columns: 1fr; }
        .span-2 { grid-column: span 1; }
        .card-section { padding: 16px; }
        .page-header { padding: 0 16px; }
        .page-header h1 { font-size: 16px; }
        .badge-date { display: none; }
        .content-wrap { margin-top: 16px; }
      }

      /* ══════════════════════════════════════
         MD3 Outlined Field — floating label
         ══════════════════════════════════════ */

      .field {
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .field-inner {
        position: relative;
        display: flex;
        align-items: center;
      }

      .field-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        color: var(--md-on-surface-low);
        transition: color var(--transition);
        z-index: 1;
      }

      label.field-label {
        position: absolute;
        left: 44px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        font-weight: 400;
        color: var(--md-on-surface-low);
        pointer-events: none;
        background: var(--md-surface);
        padding: 0 5px;
        transition:
          top 180ms cubic-bezier(.2,0,0,1),
          font-size 180ms cubic-bezier(.2,0,0,1),
          color 180ms cubic-bezier(.2,0,0,1),
          transform 180ms cubic-bezier(.2,0,0,1);
        z-index: 1;
        line-height: 1;
        white-space: nowrap;
        letter-spacing: .005em;
      }

      label.field-label.floated,
      .field-inner:focus-within label.field-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med);
        letter-spacing: .03em;
      }

      .field-inner:focus-within label.field-label { color: var(--md-primary) !important; }
      .field-inner:focus-within .field-icon { color: var(--md-primary); }

      .readonly-badge {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--md-on-surface-low);
        background: var(--md-surface-variant);
        padding: 1px 6px;
        border-radius: var(--radius-pill);
        margin-left: 4px;
        vertical-align: middle;
      }

      /* ── Input base ── */
      input[type="text"],
      input[type="date"],
      select {
        width: 100%;
        height: 52px;
        padding: 14px 14px 0 44px;
        border: 1.5px solid var(--md-outline);
        border-radius: var(--radius-lg);
        background: var(--md-surface);
        color: var(--md-on-surface);
        font-family: var(--font);
        font-size: 15px;
        transition: border-color var(--transition), background-color var(--transition);
        appearance: none;
        -webkit-appearance: none;
        outline: none;
      }
      input[type="text"]::placeholder,
      input[type="date"]::placeholder { opacity: 0; }

      input[type="date"]:not(:focus):not(.has-value) { color: transparent; }
      input[type="date"]:focus,
      input[type="date"].has-value { color: var(--md-on-surface); }

      input[type="text"]:hover,
      input[type="date"]:hover,
      select:hover {
        border-color: var(--md-on-surface-med);
        background-color: var(--md-bg);
      }
      input[type="text"]:focus,
      input[type="date"]:focus,
      select:focus {
        border-color: var(--md-primary);
        border-width: 2px;
        background-color: var(--md-surface);
        padding: 14px 13px 0 43px;
      }

      input:disabled {
        background: var(--md-surface-variant);
        color: var(--md-on-surface-med);
        cursor: default;
        border-color: var(--md-outline);
        font-family: var(--mono);
        font-size: 13px;
        padding-top: 14px;
      }
      .field-inner:has(input:disabled) label.field-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-low);
        letter-spacing: .03em;
        background: var(--md-surface-variant);
      }

      select { padding-top: 14px; padding-bottom: 0; padding-right: 36px; cursor: pointer; }
      select ~ label.field-label {
        top: 0; font-size: 11px; font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med); letter-spacing: .03em;
      }
      select:focus ~ label.field-label { color: var(--md-primary) !important; }

      /* ══════════════════════════════════════
         Multiselect / Dropdowns MD3
         ══════════════════════════════════════ */
      .multiselect { position: relative; }

      .ms-toggle {
        width: 100%;
        min-height: 52px;
        padding: 14px 44px 0 44px;
        border: 1.5px solid var(--md-outline);
        border-radius: var(--radius-lg);
        background: var(--md-surface);
        cursor: pointer;
        display: flex;
        align-items: center;
        position: relative;
        font-family: var(--font);
        font-size: 15px;
        color: var(--md-on-surface);
        transition: border-color var(--transition), background-color var(--transition);
        user-select: none;
      }
      .ms-toggle:hover { border-color: var(--md-on-surface-med); background-color: var(--md-bg); }
      .ms-toggle.open {
        border-color: var(--md-primary);
        border-width: 2px;
        padding: 14px 43px 0 43px;
        background-color: var(--md-surface);
      }

      .ms-leading {
        position: absolute;
        left: 14px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center;
        color: var(--md-on-surface-low);
        pointer-events: none;
        transition: color var(--transition);
      }
      .ms-toggle.open .ms-leading { color: var(--md-primary); }

      .ms-float-label {
        position: absolute;
        left: 44px; top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        font-weight: 400;
        color: var(--md-on-surface-low);
        background: var(--md-surface);
        padding: 0 5px;
        pointer-events: none;
        z-index: 1;
        line-height: 1;
        white-space: nowrap;
        transition:
          top 180ms cubic-bezier(.2,0,0,1),
          font-size 180ms cubic-bezier(.2,0,0,1),
          color 180ms cubic-bezier(.2,0,0,1),
          transform 180ms cubic-bezier(.2,0,0,1);
      }
      .ms-toggle.open .ms-float-label,
      .ms-toggle.has-value .ms-float-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med);
        letter-spacing: .03em;
      }
      .ms-toggle.open .ms-float-label { color: var(--md-primary); }

      .ms-display {
        flex: 1;
        font-size: 15px;
        color: var(--md-on-surface);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }
      .ms-toggle:not(.has-value) .ms-display { opacity: 0; pointer-events: none; }

      .ms-arrow {
        position: absolute;
        right: 12px; top: 50%; transform: translateY(-50%);
        color: var(--md-on-surface-low);
        transition: transform 200ms ease, color var(--transition);
        flex-shrink: 0;
      }
      .ms-toggle.open .ms-arrow { transform: translateY(-50%) rotate(180deg); color: var(--md-primary); }

      .ms-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0; right: 0;
        z-index: 50;
        background: var(--md-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--elev-3);
        max-height: 240px;
        overflow-y: auto;
        overflow-x: hidden; /* Evitar desbordes en corners radius */
        display: none;
        animation: popIn 220ms cubic-bezier(.34,1.56,.64,1) both;
      }
      .ms-menu.open { display: block; }
      @keyframes popIn {
        from { opacity: 0; transform: scaleY(.88) translateY(-6px); transform-origin: top; }
        to   { opacity: 1; transform: scaleY(1) translateY(0); }
      }

      .ms-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        cursor: pointer;
        font-size: 14px;
        color: var(--md-on-surface);
        transition: background var(--transition);
      }
      .ms-item:hover { background: var(--md-primary-light); }
      .ms-item:has(input:checked),
      .ms-item.ms-selected { background: var(--md-primary-container); font-weight: 500; }
      .ms-item input[type="checkbox"] {
        width: 16px; height: 16px; min-width: 16px;
        accent-color: var(--md-primary);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0; border: none; background: none;
      }

      /* ── Action bar ── */
      .action-bar {
        max-width: 880px;
        margin: 20px auto 0;
        padding: 0 16px;
        display: flex;
        gap: 12px;
        animation: fadeUp .3s .1s ease both;
      }

      .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 24px;
        height: 40px;
        border: none;
        border-radius: var(--radius-pill);
        font-family: var(--font);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: .01em;
        transition: background var(--transition), box-shadow var(--transition);
        position: relative;
        overflow: hidden;
      }
      .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0;
        transition: opacity .15s;
      }
      .btn:active::after { opacity: .1; }

      .btn-ghost {
        background: transparent;
        color: var(--md-primary);
        border: 1px solid var(--md-outline);
      }
      .btn-ghost:hover {
        background: var(--md-primary-light);
        border-color: var(--md-primary);
      }

      /* Botón Revisar Cambios - Estilo Tonal Suave */
      .btn-primary {
        background: var(--md-primary-container);
        color: var(--md-primary-dark);
        font-weight: 600;
      }
      .btn-primary:hover {
        background: #badef3;
      }

      /* Botón Confirmar y Guardar - Estilo Tonal Suave Verde */
      .btn-success {
        background: var(--md-success-bg);
        color: var(--md-success);
        font-weight: 600;
      }
      .btn-success:hover {
        background: #d2ebd9;
      }
      
      .btn-success:disabled,
      .btn-primary:disabled {
        background: rgba(32,33,36,.12);
        color: rgba(32,33,36,.38);
        cursor: not-allowed;
        box-shadow: none;
      }

      /* ── Preview overlay ── */
      #previewOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(248,249,250,0.85); /* Ligero ajuste para backdrop */
        backdrop-filter: blur(4px);
        z-index: 200;
        overflow-y: auto;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px 60px;
      }
      #previewOverlay.visible { display: flex; }
      body.overlay-open { overflow: hidden; }

      .preview-card {
        background: var(--md-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--elev-3);
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: scaleIn .2s ease both;
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(.96); }
        to   { opacity: 1; transform: scale(1); }
      }

      .preview-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px;
      }
      .preview-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--md-outline);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-header .icon-wrap {
        width: 40px; height: 40px;
        background: var(--md-primary-light);
        border-radius: 50%;
        display: grid; place-items: center;
        color: var(--md-primary);
        flex-shrink: 0;
      }
      .preview-header h2 {
        font-size: 18px;
        font-weight: 500;
        color: var(--md-on-surface);
      }
      .preview-header p {
        font-size: 13px;
        color: var(--md-on-surface-med);
        margin-top: 2px;
      }
      .preview-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--md-outline);
        font-size: 14px;
      }
      .preview-row:last-child { border-bottom: none; }
      .preview-key {
        font-size: 12px;
        font-weight: 500;
        color: var(--md-on-surface-med);
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 140px;
      }
      .preview-val { color: var(--md-on-surface); text-align: right; font-size: 14px; }
      .preview-val.empty { color: var(--md-on-surface-low); font-style: italic; }
      .preview-actions {
        padding: 12px 24px 20px;
        border-top: 1px solid var(--md-outline);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .preview-actions .btn { flex: none; }

      .preview-row.changed {
        background: #fef7e0;
        margin: 0 -24px;
        padding-left: 24px;
        padding-right: 24px;
      }
      .preview-row.changed .preview-val { color: #b05e00; font-weight: 500; }
      .changed-badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: #b05e00;
        background: #fce8b2;
        border-radius: var(--radius-pill);
        padding: 1px 6px;
        margin-left: 6px;
        vertical-align: middle;
      }

      /* ── Spinner ── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin-icon { animation: spin 1s linear infinite; }

      /* ── Animations ── */
      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="page-header">
      <div class="logo-mark">
        <span class="material-symbols-outlined text-[24px]">edit_document</span>
      </div>
      <div>
        <h1>Editar Datos del Paciente</h1>
        <p>Modifica los campos y revisa los cambios antes de guardar</p>
      </div>
      <div class="badge-date" id="badgeDate"></div>
    </header>

    <div class="content-wrap">

    <!-- Form -->
    <div class="card">
      <form id="editForm">

        <?
          var opcionesEstado    = ["🟢 Activo ", "🟡 En espera", "🕐 Contactará", "🚫 No responde", "✔️ Alta"];
          var opcionesGravedad  = ["🟢 Leve", "🟠 Moderado", "🔴 Urgente"];
          var opcionesIngreso   = ["📄 Volante", "🔁 Derivación propia", "🕰️ Antiguo paciente"];
          var opcionesPatologia = ["MS","MI","Dolor Crónico","Cervicalgia","Dorsalgia","Lumbalgia","Omalgia","Coxalgia","Gonalgia","Tendinopatía","Fascitis Plantar","Traumatismo","Caída","Fractura","Luxación","Esguince","Prótesis Hombro","Prótesis Rodilla","Estabilidad","Debilidad Muscular","Limitación Funcional","Alteración Marcha","Hernia Discal","Radiculopatía MS","Radiculopatía MI","Estenosis Medular","Parkinson","Esclerosis","Ictus","Linfedema","Cardiopatía","Enfermedad Respiratoria","Cáncer","Otro"];

          // Section groupings
          var SECTIONS = [
            { name: "Datos Personales",       fields: ["Nombre","DNI","Fecha nacimiento","Fecha inscripción"] },
            { name: "Estado y Clasificación", fields: ["Estado","Gravedad","Tipo de Ingreso"] },
            { name: "Contacto",               fields: ["Teléfono 1","Teléfono 2"] },
            { name: "Diagnóstico",            fields: ["Patología 1","Patología 2"] },
            { name: "Observaciones",          fields: ["Observaciones"] },
          ];

          // header → index map
          var headerMap = {};
          for (var idx = 0; idx < headers.length; idx++) {
            headerMap[headers[idx]] = idx;
          }

          var assignedSet = {};
          SECTIONS.forEach(function(s){ s.fields.forEach(function(f){ assignedSet[f] = true; }); });
          var otherHeaders = headers.filter(function(h){ return !assignedSet[h]; });

          // Material Symbols para campos
          function iconFor(h) {
            var hl = h.toLowerCase();
            if (hl.indexOf("nombre") !== -1)  return 'person';
            if (hl.indexOf("fecha")  !== -1)  return 'calendar_today';
            if (hl.indexOf("tel")    !== -1)  return 'call';
            if (hl.indexOf("patolog")!== -1)  return 'monitor_heart';
            if (hl.indexOf("observ") !== -1)  return 'edit_note';
            if (hl.indexOf("gravedad") !== -1) return 'emergency';
            if (hl.indexOf("estado") !== -1) return 'fact_check';
            if (hl.indexOf("ingreso") !== -1) return 'login';
            return 'horizontal_rule';
          }

          // Material Symbols para secciones
          function sectionIconFor(name) {
            var nl = name.toLowerCase();
            if (nl.indexOf("personal")  !== -1) return 'account_circle';
            if (nl.indexOf("estado")    !== -1 || nl.indexOf("clasif") !== -1) return 'analytics';
            if (nl.indexOf("contacto")  !== -1) return 'contact_page';
            if (nl.indexOf("diagn")     !== -1) return 'medical_information';
            if (nl.indexOf("observ")    !== -1) return 'note_alt';
            return 'folder_open';
          }

          // Render one section
          function renderSection(sectionName, fieldList) {
            var fieldsToRender = fieldList.filter(function(f){ return headerMap[f] !== undefined; });
            if (!fieldsToRender.length) return;
            var sIcon = sectionIconFor(sectionName);
        ?>
        <div class="card-section">
          
          <!-- Título de Sección con Pill Pastel y Texto que Destaca -->
          <div class="section-label flex items-center gap-3 mb-5">
            <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#e0f1fc] text-[#1d4a61] font-semibold text-xs uppercase tracking-wider">
              <span class="material-symbols-outlined text-[16px]"><?= sIcon ?></span>
              <?= sectionName ?>
            </span>
            <div class="section-divider flex-1 h-[1px] bg-[--md-outline]"></div>
          </div>

          <div class="grid-2">
            <?
              fieldsToRender.forEach(function(h) {
                var i          = headerMap[h];
                var val        = rowData[i] || "";
                var isReadOnly = (i === 0 || h.toLowerCase().indexOf("historia") !== -1);
                var isDate     = (h.toLowerCase().indexOf("fecha") !== -1 || h.toLowerCase().indexOf("visita") !== -1 || h.toLowerCase().indexOf("nacimiento") !== -1);
                var isFullWidth= (h.toLowerCase().indexOf("observaciones") !== -1 || h.toLowerCase().indexOf("historia") !== -1);
                var idSuffix   = h.replace(/\s/g,"");
                var selVals    = (h.indexOf("Patología") !== -1) ? val.toString().split(",").map(function(s){ return s.trim(); }) : [];
                var icon       = iconFor(h);
            ?>
            <div class="<?= isFullWidth ? 'span-2' : '' ?>">
              <div class="field">

                <? if (h === "Estado") { ?>
                  <div class="multiselect" id="ms_<?= idSuffix ?>">
                    <div class="ms-toggle has-value" id="toggle<?= idSuffix ?>"
                         onclick="toggleSingle('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">
                        <span class="material-symbols-outlined text-[18px]"><?= icon ?></span>
                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>"><?= val || opcionesEstado[0] ?></span>
                      <span class="material-symbols-outlined ms-arrow text-[20px]">expand_more</span>
                    </div>
                    <input type="hidden" name="<?= h ?>" id="val<?= idSuffix ?>" value="<?= val || opcionesEstado[0] ?>">
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesEstado.forEach(function(opt){ ?>
                        <div class="ms-item<?= val === opt ? ' ms-selected' : '' ?>"
                             onclick="selectSingle('<?= idSuffix ?>','<?= opt.replace(/'/g,"\\'") ?>')">
                          <?= opt ?>
                        </div>
                      <? }); ?>
                    </div>
                  </div>

                <? } else if (h === "Gravedad") { ?>
                  <div class="multiselect" id="ms_<?= idSuffix ?>">
                    <div class="ms-toggle has-value" id="toggle<?= idSuffix ?>"
                         onclick="toggleSingle('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">
                        <span class="material-symbols-outlined text-[18px]"><?= icon ?></span>
                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>"><?= val || opcionesGravedad[0] ?></span>
                      <span class="material-symbols-outlined ms-arrow text-[20px]">expand_more</span>
                    </div>
                    <input type="hidden" name="<?= h ?>" id="val<?= idSuffix ?>" value="<?= val || opcionesGravedad[0] ?>">
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesGravedad.forEach(function(opt){ ?>
                        <div class="ms-item<?= val === opt ? ' ms-selected' : '' ?>"
                             onclick="selectSingle('<?= idSuffix ?>','<?= opt.replace(/'/g,"\\'") ?>')">
                          <?= opt ?>
                        </div>
                      <? }); ?>
                    </div>
                  </div>

                <? } else if (h.indexOf("Ingreso") !== -1) { ?>
                  <div class="multiselect" id="ms_<?= idSuffix ?>">
                    <div class="ms-toggle has-value" id="toggle<?= idSuffix ?>"
                         onclick="toggleSingle('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">
                        <span class="material-symbols-outlined text-[18px]"><?= icon ?></span>
                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>"><?= val || opcionesIngreso[0] ?></span>
                      <span class="material-symbols-outlined ms-arrow text-[20px]">expand_more</span>
                    </div>
                    <input type="hidden" name="<?= h ?>" id="val<?= idSuffix ?>" value="<?= val || opcionesIngreso[0] ?>">
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesIngreso.forEach(function(opt){ ?>
                        <div class="ms-item<?= val === opt ? ' ms-selected' : '' ?>"
                             onclick="selectSingle('<?= idSuffix ?>','<?= opt.replace(/'/g,"\\'") ?>')">
                          <?= opt ?>
                        </div>
                      <? }); ?>
                    </div>
                  </div>

                <? } else if (h.indexOf("Patología") !== -1) { ?>
                  <div class="multiselect">
                    <div class="ms-toggle <?= selVals.length > 0 ? 'has-value' : '' ?>"
                         id="toggle<?= idSuffix ?>"
                         onclick="toggleMs('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">
                        <span class="material-symbols-outlined text-[18px]"><?= icon ?></span>
                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>">— Selecciona —</span>
                      <span class="material-symbols-outlined ms-arrow text-[20px]">expand_more</span>
                    </div>
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesPatologia.forEach(function(opt){ ?>
                        <label class="ms-item">
                          <input type="checkbox" name="<?= h ?>" value="<?= opt ?>"
                                 <?= selVals.indexOf(opt) !== -1 ? "checked" : "" ?>
                                 onchange="updateMsLabel('<?= idSuffix ?>','<?= h ?>')">
                          <?= opt ?>
                        </label>
                      <? }); ?>
                    </div>
                  </div>

                <? } else { ?>
                  <div class="field-inner">
                    <div class="field-icon">
                      <span class="material-symbols-outlined text-[18px]"><?= icon ?></span>
                    </div>
                    <input type="<?= isDate ? 'date' : 'text' ?>"
                           id="field_<?= idSuffix ?>"
                           name="<?= h ?>"
                           value="<?= val ?>"
                           placeholder=" "
                           <?= isReadOnly ? "disabled" : "" ?>>
                    <label class="field-label"
                           for="field_<?= idSuffix ?>">
                      <?= h ?>
                      <? if (isReadOnly) { ?><span class="readonly-badge">Solo lectura</span><? } ?>
                    </label>
                  </div>
                <? } ?>

              </div>
            </div>
            <? }); ?>
          </div>
        </div>
        <?
          } // end renderSection
        ?>

        <?
          // Render each known section
          SECTIONS.forEach(function(s){ renderSection(s.name, s.fields); });

          // Render remaining fields
          if (otherHeaders.length) {
            renderSection("Otros datos", otherHeaders);
          }
        ?>

      </form>
    </div><!-- /card -->

    <!-- Action bar -->
    <div class="action-bar">
      <button type="button" class="btn btn-ghost" onclick="cerrarFormulario()">
        <span class="material-symbols-outlined text-[18px]">close</span>
        Cerrar
      </button>
      <button type="button" class="btn btn-primary" onclick="mostrarResumen()">
        <span class="material-symbols-outlined text-[18px]">visibility</span>
        Revisar Cambios
      </button>
    </div>

    </div><!-- /content-wrap -->

    <!-- Preview overlay -->
    <div id="previewOverlay">
      <div class="preview-card">
        <div class="preview-header">
          <div class="icon-wrap">
            <span class="material-symbols-outlined text-[22px]">rule_folder</span>
          </div>
          <div>
            <h2>Confirmar Cambios</h2>
            <p>Revisa los datos antes de guardar. Esta acción no se puede deshacer.</p>
          </div>
        </div>
        <div class="preview-body" id="resumenContent"></div>
        <div class="preview-actions">
          <button type="button" class="btn btn-ghost" onclick="ocultarResumen()">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            Volver a editar
          </button>
          <button type="button" class="btn btn-success" id="btnConfirmar" onclick="confirmarEnvio()">
            <span class="material-symbols-outlined text-[18px]">check_circle</span>
            Confirmar y Guardar
          </button>
        </div>
      </div>
    </div>

    <script>
      var rowIdx = <?= rowIdx ?>;
      var esWebApp = <?= esWebApp ? 'true' : 'false' ?>;
      var enVentanaEmergente = <?= enVentanaEmergente ? 'true' : 'false' ?>;

      // Tres contextos posibles en los que puede vivir este formulario:
      // 1. Modal de Sheets (menú 🧍 → Editar)              → cerrar el diálogo.
      // 2. Web App como página independiente (pestaña)      → volver a la tabla.
      // 3. Web App en ventana emergente (window.open desde
      //    la tabla de la Web App)                          → avisar a la
      //    ventana que la abrió y cerrarse a sí misma con window.close().
      // NOTA: las URLs de Apps Script Web App no se pueden embeber en un
      // <iframe> (Google lo bloquea), así que la opción 3 usa una ventana
      // real (window.open), nunca un iframe.
      function cerrarFormulario(guardado) {
        if (enVentanaEmergente) {
          if (window.opener) {
            window.opener.postMessage({ tipo: 'cerrarEdicionPaciente', guardado: !!guardado }, '*');
          }
          window.close();
        } else if (esWebApp) {
          window.top.location.href = '<?= baseUrl ?>?page=baseDatos';
        } else {
          google.script.host.close();
        }
      }

      function syncFloated(inp) {
        var label = inp.parentElement.querySelector('label.field-label');
        var hasVal = inp.value && inp.value.trim() !== '';
        if (label) {
          if (hasVal) label.classList.add('floated');
          else label.classList.remove('floated');
        }
        if (inp.type === 'date') {
          if (hasVal) inp.classList.add('has-value');
          else inp.classList.remove('has-value');
        }
      }

      document.querySelectorAll('.field-inner input[type="text"], .field-inner input[type="date"]').forEach(function(inp) {
        syncFloated(inp);
        inp.addEventListener('input',  function() { syncFloated(inp); });
        inp.addEventListener('change', function() { syncFloated(inp); });
      });

      document.getElementById('badgeDate').textContent =
        new Date().toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

      function formatPhone(val) {
        var d = val.replace(/\D/g, '').slice(0, 9);
        var f = d.slice(0, 3);
        if (d.length > 3) f += ' ' + d.slice(3, 5);
        if (d.length > 5) f += ' ' + d.slice(5, 7);
        if (d.length > 7) f += ' ' + d.slice(7, 9);
        return f;
      }
      document.querySelectorAll('input[name="Teléfono 1"], input[name="Teléfono 2"]').forEach(function(inp) {
        inp.value = formatPhone(inp.value);
        inp.addEventListener('input', function() { inp.value = formatPhone(inp.value); });
      });

      <? headers.forEach(function(h) {
           if (h.indexOf("Patología") !== -1) {
             var s = h.replace(/\s/g, '');
      ?>
      updateMsLabel('<?= s ?>', '<?= h ?>');
      <? } }); ?>

      function toggleMs(menuId, toggleEl) {
        var menu   = document.getElementById(menuId);
        var isOpen = menu.classList.contains('open');
        document.querySelectorAll('.ms-menu.open').forEach(function(m) {
          m.classList.remove('open');
          m.previousElementSibling.classList.remove('open');
        });
        if (!isOpen) {
          menu.classList.add('open');
          toggleEl.classList.add('open');
        }
      }

      function toggleSingle(menuId, toggleEl) {
        var menu   = document.getElementById(menuId);
        var isOpen = menu.classList.contains('open');
        document.querySelectorAll('.ms-menu.open').forEach(function(m) {
          m.classList.remove('open');
          m.previousElementSibling.classList.remove('open');
        });
        if (!isOpen) {
          menu.classList.add('open');
          toggleEl.classList.add('open');
        }
      }

      function selectSingle(suffix, value) {
        var hiddenInput = document.getElementById('val' + suffix);
        if (hiddenInput) hiddenInput.value = value;
        var label = document.getElementById('label' + suffix);
        if (label) label.textContent = value;
        var menu = document.getElementById('menu' + suffix);
        if (menu) {
          menu.querySelectorAll('.ms-item').forEach(function(item) {
            item.classList.toggle('ms-selected', item.textContent.trim() === value.trim());
          });
          menu.classList.remove('open');
        }
        var toggle = document.getElementById('toggle' + suffix);
        if (toggle) { toggle.classList.remove('open'); toggle.classList.add('has-value'); }
      }

      function updateMsLabel(suffix, name) {
        var checked = document.querySelectorAll('input[name="' + name + '"]:checked');
        var label   = document.getElementById('label' + suffix);
        var toggle  = document.getElementById('toggle' + suffix);
        var values  = Array.from(checked).map(function(cb){ return cb.value; });
        label.textContent = values.length ? values.join(', ') : '— Selecciona —';
        toggle.classList.toggle('has-value', values.length > 0);
      }

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.multiselect')) {
          document.querySelectorAll('.ms-menu.open').forEach(function(m) {
            m.classList.remove('open');
            m.previousElementSibling.classList.remove('open');
          });
        }
      });

      var originalData = {};
      window.addEventListener('load', function() {
        originalData = recogerDatos();
      });

      function recogerDatos() {
        var form = document.getElementById('editForm');
        var data = {};
        var fd   = new FormData(form);

        var names = [];
        fd.forEach(function(val, key) { if (names.indexOf(key) === -1) names.push(key); });

        names.forEach(function(name) {
          var values = fd.getAll(name);
          data[name] = values.join(', ');
        });

        form.querySelectorAll('input:disabled').forEach(function(el) {
          if (el.name) data[el.name] = el.value;
        });

        return data;
      }

      function displayVal(val) {
        if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
          return val.split('-').reverse().join('/');
        }
        return val;
      }

      function mostrarResumen() {
        var data = recogerDatos();
        var html = '';
        var changedCount = 0;

        for (var key in data) {
          if (key === 'Nº') continue;
          var val     = displayVal(data[key]);
          var origVal = displayVal(originalData[key] || '');
          var changed = val !== origVal;
          if (changed) changedCount++;

          html += '<div class="preview-row' + (changed ? ' changed' : '') + '">' +
                    '<span class="preview-key">' + key +
                      (changed ? '<span class="changed-badge">modificado</span>' : '') +
                    '</span>' +
                    '<span class="preview-val' + (!val ? ' empty' : '') + '">' + (val || '—') + '</span>' +
                  '</div>';
        }

        var subtitle = document.querySelector('.preview-header p');
        if (subtitle) {
          subtitle.textContent = changedCount > 0
            ? changedCount + ' campo' + (changedCount > 1 ? 's' : '') + ' modificado' + (changedCount > 1 ? 's' : '') + '. Revisa antes de guardar.'
            : 'No se detectaron cambios respecto a los valores originales.';
        }

        document.getElementById('resumenContent').innerHTML = html;
        document.getElementById('previewOverlay').classList.add('visible');
        document.body.classList.add('overlay-open');
      }

      function ocultarResumen() {
        document.getElementById('previewOverlay').classList.remove('visible');
        document.body.classList.remove('overlay-open');
      }

      function confirmarEnvio() {
        var data = recogerDatos();
        var btn  = document.getElementById('btnConfirmar');
        // Renderizando el icono de carga de Material Symbols (con animación rotativa CSS)
        btn.innerHTML = '<span class="material-symbols-outlined spin-icon text-[18px]">progress_activity</span> Guardando…';
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function() { cerrarFormulario(true); })
          .withFailureHandler(function(err) {
            alert('Error al guardar: ' + err);
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Confirmar y Guardar';
            btn.disabled = false;
          })
          .actualizarPaciente(data, rowIdx);
      }
    </script>
  </body>
</html>
