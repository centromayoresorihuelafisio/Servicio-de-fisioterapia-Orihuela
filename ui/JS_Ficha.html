<!--
  ui/JS_Ficha.html - LOGICA de la FICHA DE USUARIO (panel lateral), compartida por Usuarios
  y la Agenda (principal/Principal_Vista). Estilos: ui/CSS_Ficha.

  Se incluye con include('ui/JS_Ficha') con "!" (fuera de cualquier bloque de script), ANTES del script
  principal de la pagina, igual que ui/JS_Formato_Nombre.

  UNICA fuente de secciones, etiquetas y orden de campos: la lista SECCIONES de este archivo. Para
  renombrar una etiqueta o mover un campo basta con tocarla aqui.

  La pagina debe tener (se usan en el momento de pintar, no al cargar):
    avatarHtml(nombre)        avatar con iniciales (común: ui/JS_Secciones; sin él, la cabecera va sin avatar, como en la HC)
    mostrarAviso(texto)       aviso ligero (común: ui/JS_Secciones; opcional: sin él, la copia no avisa)
    SVG_WHATSAPP              icono de WhatsApp (opcional)

  Uso:
    FichaUsuario.pintar(contenedor, FichaUsuario.html(usuario, cabeceras, opciones));
    contenedor.addEventListener('click', function(e) { FichaUsuario.alClic(e, { cerrar, estado, gravedad, ingreso, accion, guardarCampo }); });
  opciones: { nombre, acciones, pie, extraCabecera, excluir, editable }  (ver FichaUsuario.html)

  Edición directa (opciones.editable = true): los campos marcados `editable` en SECCIONES (Teléfono 1, Teléfono 2,
  Observaciones y Nombre habitual) llevan un lápiz, y los vacíos un «Añadir …». Al pulsarlo, el campo pasa a ser un cuadro
  de texto con Guardar y Cancelar (Intro guarda en el teléfono y el nombre habitual, Ctrl+Intro en las observaciones; Esc
  cancela). El nombre habitual se escribe con la regla del nombre (ui/JS_Formato_Nombre, si la página lo incluye). Al guardar se llama a
  h.guardarCampo(cabecera, valor): la página cambia el dato en memoria, repinta y llama al servidor
  (cambiarDatoFichaPacienteWeb); si falla, vuelve a abrir el cuadro con lo escrito con FichaUsuario.editar(...).
  Mientras hay un cuadro abierto, pintar() no repinta la ficha de ese mismo usuario (no se pierde lo escrito); con otro
  usuario, el cuadro se descarta. FichaUsuario.hayEdicion(contenedor) dice si hay texto sin guardar.
-->
<script>
var FichaUsuario = (function() {
  // Estados que se ofrecen siempre en el menu (se anaden los demas que existan en la hoja).
  var ESTADOS_BASE = ESTADOS_PACIENTE.LISTA_EDICION.slice();

  // Secciones de la ficha, en orden. Cada campo: col = cabecera real de la hoja, etq = etiqueta que se muestra,
  // tipo = como se pinta (tel, copia, gravedad, ingreso, limpio, largo; sin tipo = texto normal).
  var SECCIONES = [
    { titulo: 'Contacto', icono: 'call', vacio: 'Sin teléfono', campos: [
      { col: 'Teléfono 1', tipo: 'tel', editable: true },
      { col: 'Teléfono 2', tipo: 'tel', nota: 'secundario', editable: true, anadirAlPasar: true }   // su «Añadir» solo al pasar el ratón por Contacto
    ] },
    { titulo: 'Datos personales', icono: 'badge', campos: [
      { col: 'Nombre habitual', etq: 'Nombre habitual', tipo: 'nombre', editable: true, anadirAlPasar: true },   // su «Añadir» solo al pasar el ratón
      { col: 'DNI', etq: 'DNI', tipo: 'copia' },
      { col: 'Fecha nacimiento', etq: 'Nacimiento' },
      { col: 'Fecha inscripción', etq: 'Inscripción' }
    ] },
    { titulo: 'Clínico', icono: 'stethoscope', campos: [
      { col: 'Gravedad', etq: 'Gravedad', tipo: 'gravedad' },
      { col: 'Tipo de Ingreso', etq: 'Ingreso', tipo: 'ingreso' },
      { col: 'Patología 1', etq: 'Principal' },
      { col: 'Patología 2', etq: 'Secundaria' }
    ] },
    { titulo: 'Observaciones', icono: 'notes', campos: [
      { col: 'Observaciones', tipo: 'largo', editable: true }
    ] }
  ];

  // Acciones rapidas (mismo nombre e icono en las dos paginas). Cada pagina elige cuales muestra.
  var ACCIONES = {
    whatsapp:   { icono: 'whatsapp',    texto: 'WhatsApp',   titulo: 'Abrir WhatsApp con este usuario' },
    hc:         { icono: 'description', texto: 'Historia',   titulo: 'Abrir la historia clínica' },
    editar:     { icono: 'edit',        texto: 'Editar',     titulo: 'Editar los datos del usuario' },
    cita:       { icono: 'event',       texto: 'Cita',       titulo: 'Registrar una cita al usuario' },
    valoracion: { icono: 'assignment',  texto: 'Valoración', titulo: 'Valoraciones del usuario (o nueva valoración si aún no tiene)' }
  };

  // Columnas que la cabecera ya muestra: no se repiten en "Otros datos".
  var CABECERA_USADAS = ['Nombre', 'Estado', 'Edad'];

  // ---------- Utilidades ----------
  function esc(t) {
    return (t === null || t === undefined ? '' : String(t)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function norm(t) {
    return String(t === null || t === undefined ? '' : t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  }
  function icono(n) { return '<span class="material-symbols-outlined">' + n + '</span>'; }
  function iconoAccion(n) { return (n === 'whatsapp' && typeof SVG_WHATSAPP !== 'undefined') ? SVG_WHATSAPP : icono(n === 'whatsapp' ? 'chat' : n); }

  // Cabecera real de la hoja que corresponde a un nombre (sin mayusculas ni tildes). '' si no existe.
  function cabecera(headers, nombre) {
    var n = norm(nombre);
    for (var i = 0; i < headers.length; i++) if (norm(headers[i]) === n) return headers[i];
    return '';
  }
  function valor(p, headers, nombre) {
    var h = cabecera(headers, nombre);
    if (!h) return '';
    var v = p[h];
    return (v === null || v === undefined) ? '' : String(v).trim();
  }

  function claseEstado(e) {
    var n = norm(e);
    if (n.indexOf('activo') !== -1) return 'activo';
    if (n.indexOf('espera') !== -1) return 'espera';
    if (n.indexOf('contactar') !== -1) return 'contactara';
    if (n.indexOf('alta') !== -1) return 'alta';
    if (n.indexOf('responde') !== -1) return 'no-responde';
    return '';
  }
  // Quita el emoji inicial ("🟢 Activo" -> "Activo").
  function textoEstado(e) { var s = String(e || ''); return s.replace(/^[^\p{L}\p{N}]+/u, '').trim() || s; }
  function claseGravedad(v) {
    var n = norm(v);
    return n.indexOf('leve') !== -1 ? 'leve' : n.indexOf('moderad') !== -1 ? 'moderado' : (n.indexOf('grave') !== -1 || n.indexOf('urgent') !== -1) ? 'grave' : '';
  }
  // Estados del menu: los de ESTADOS_BASE (con el texto que ya use la hoja) y despues los que no encajen en ninguno.
  // Menu de gravedad (chip pulsable de la ficha, la tabla de Usuarios y la Historia clinica): las de GRAVEDAD_PACIENTE.LISTA,
  // con el punto del mismo color que su chip. elegir(valor) se llama al pulsar una.
  var PUNTO_GRAVEDAD = { leve: 'activo', moderado: 'espera', grave: 'contactara' };
  function gravedadesMenu(actual, elegir) {
    var cls = claseGravedad(actual);
    return GRAVEDAD_PACIENTE.LISTA.map(function(g) {
      return { punto: PUNTO_GRAVEDAD[claseGravedad(g)], texto: g, titulo: 'Cambiar gravedad a ' + g, marcado: !!cls && claseGravedad(g) === cls, fn: function() { elegir(g); } };
    });
  }

  // Tipo de ingreso: icono y texto corto del chip (lista de Usuarios y ficha). FUENTE ÚNICA en el navegador. Reconoce también
  // el nombre guardado antes del 13-nov-2026 («Antiguo paciente») y celdas con emoji. Un valor desconocido sale tal cual, sin icono.
  function ingresoDatos(v) {
    var tx = textoEstado(v), n = norm(tx);
    if (!tx) return { valor: '', icono: '', corto: '', completo: '' };
    if (n.indexOf('volante') !== -1) return { valor: TIPOS_INGRESO.VOLANTE, icono: 'receipt_long', corto: 'Volante', completo: TIPOS_INGRESO.VOLANTE };
    if (n.indexOf('derivacion') !== -1) return { valor: TIPOS_INGRESO.DERIVACION_PROPIA, icono: 'person', corto: 'Propia', completo: TIPOS_INGRESO.DERIVACION_PROPIA };
    if (n.indexOf('antiguo') !== -1) return { valor: TIPOS_INGRESO.ANTIGUO, icono: 'history', corto: 'Antiguo', completo: TIPOS_INGRESO.ANTIGUO };
    return { valor: tx, icono: '', corto: tx, completo: tx };
  }
  // Menu del tipo de ingreso (chip de la ficha): los de TIPOS_INGRESO.LISTA con su icono y, si tiene uno, «Quitar tipo de
  // ingreso» al final. elegir(valor) se llama al pulsar uno; elegir('') = quitarlo.
  function ingresosMenu(actual, elegir) {
    var act = ingresoDatos(actual).valor;
    var items = TIPOS_INGRESO.LISTA.map(function(t) {
      var d = ingresoDatos(t);
      return { icono: d.icono, texto: t, titulo: 'Cambiar tipo de ingreso a ' + t, marcado: act === t, fn: function() { elegir(t); } };
    });
    if (act) items.push({ icono: 'close', texto: 'Quitar tipo de ingreso', titulo: 'Dejar sin tipo de ingreso', separado: true, fn: function() { elegir(''); } });
    return items;
  }

  // `existentes` = valores de la columna Estado de la hoja.
  function estadosDisponibles(existentes) {
    var porClase = {}, extra = [];
    ESTADOS_BASE.forEach(function(e) { porClase[claseEstado(e)] = e; });
    (existentes || []).forEach(function(v) {
      var e = String(v === null || v === undefined ? '' : v).trim();
      if (!e) return;
      var c = claseEstado(e);
      if (c) porClase[c] = e; else if (extra.indexOf(e) === -1) extra.push(e);
    });
    return ['activo', 'espera', 'contactara', 'no-responde', 'alta'].map(function(c) { return porClase[c]; }).filter(Boolean).concat(extra);
  }

  // 612345678 -> "612 34 56 78". Regla única: ui/JS_Telefono.html (la página debe incluirlo antes que este archivo).
  function formatearTel(t) { return Telefono.formato(t); }

  function avisar(m) { if (typeof mostrarAviso === 'function') mostrarAviso(m); }
  function copiar(texto, etq) {
    function ok() { avisar((etq || 'Texto') + ' copiado'); }
    function respaldo() {
      var ta = document.createElement('textarea'), hecho = false;
      ta.value = texto; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta); ta.select();
      try { hecho = document.execCommand('copy'); } catch (e) { hecho = false; }
      document.body.removeChild(ta);
      if (hecho) ok(); else avisar('No se pudo copiar.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, respaldo); else respaldo();
  }

  // ---------- Marcado ----------
  function htmlCopia(v, etq, texto) {
    return '<button type="button" class="fu-copia" data-fu="copiar" data-valor="' + esc(v) + '" data-etq="' + esc(etq) + '" title="Copiar">' + esc(texto) + icono('content_copy') + '</button>';
  }

  // Lápiz (campo con dato) o «Añadir …» (campo vacío) de la edición directa.
  function htmlLapiz(c) {
    var t = 'Cambiar ' + Telefono.etiqueta(c.col).toLowerCase();
    return '<button type="button" class="fu-lapiz" data-fu="editar" title="' + esc(t) + '" aria-label="' + esc(t) + '">' + icono('edit') + '</button>';
  }
  // Los dos teléfonos dicen «Añadir teléfono» (decisión del dueño, 5-nov-2026: ya se entiende que el segundo es el secundario).
  function htmlAnadir(c) {
    var que = c.tipo === 'tel' ? 'teléfono' : Telefono.etiqueta(c.col).toLowerCase();
    return '<button type="button" class="fu-anadir' + (c.anadirAlPasar ? ' fu-anadir--al-pasar' : '') + '" data-fu="editar">' + icono('add') + 'Añadir ' + esc(que) + '</button>';
  }
  // Envoltorio de un campo editable: guarda la cabecera y el valor para abrir el cuadro de edición.
  function htmlEditable(c, v, dentro) {
    return '<div class="fu-editable" data-col="' + esc(c.col) + '" data-valor="' + esc(v) + '">' + dentro + '</div>';
  }

  function htmlCampo(c, v, editable) {
    if (c.tipo === 'tel') {
      if (!v) return htmlAnadir(c);
      return '<div class="fu-tel">' + icono('call') + htmlCopia(Telefono.digitos(v) || v, 'Teléfono', formatearTel(v)) + (c.nota ? '<span class="fu-nota">' + esc(c.nota) + '</span>' : '') + (editable ? htmlLapiz(c) : '') + '</div>';
    }
    if (c.tipo === 'nombre') {
      if (!v) return htmlAnadir(c);
      return '<div class="fu-campo fu-campo--nombre"><span class="fu-etq">' + esc(c.etq) + '</span><span class="fu-val">' + esc(v) + '</span>' + (editable ? htmlLapiz(c) : '') + '</div>';
    }
    if (c.tipo === 'largo') {
      if (!v) return htmlAnadir(c);
      return '<div class="fu-campo largo"><span class="fu-val">' + esc(v) + '</span>' + (editable ? htmlLapiz(c) : '') + '</div>';
    }
    var cont;
    if (c.tipo === 'copia') cont = htmlCopia(v, c.etq, v);
    else if (c.tipo === 'gravedad') cont = '<button type="button" class="fu-chip ' + claseGravedad(v) + '" data-fu="gravedad" aria-haspopup="menu" title="Cambiar gravedad">' + (v ? esc(textoEstado(v)) : 'Sin gravedad') + icono('expand_more') + '</button>';
    else if (c.tipo === 'ingreso') {
      var d = ingresoDatos(v);
      cont = '<button type="button" class="fu-chip fu-chip--borde" data-fu="ingreso" aria-haspopup="menu" title="' + esc(d.completo ? 'Tipo de ingreso: ' + d.completo + ' · clic para cambiarlo' : 'Poner tipo de ingreso') + '">' +
        (d.icono ? '<span class="material-symbols-outlined fu-chip__ico" aria-hidden="true">' + d.icono + '</span>' : '') + esc(d.corto || 'Sin tipo') + icono('expand_more') + '</button>';
    }
    else cont = '<span class="fu-val">' + esc(c.tipo === 'limpio' ? textoEstado(v) : v) + '</span>';
    return '<div class="fu-campo"><span class="fu-etq">' + esc(c.etq) + '</span>' + cont + '</div>';
  }

  function htmlLabel(titulo, ic) {
    return '<div class="fu-label"><span class="fu-pill">' + icono(ic) + esc(titulo) + '</span><span class="fu-linea"></span></div>';
  }

  function htmlCabecera(p, headers, o) {
    var edad = valor(p, headers, 'Edad'), est = valor(p, headers, 'Estado');
    if (/^\d+$/.test(edad)) edad += ' años';
    return '<div class="fu-cab">' + (typeof avatarHtml === 'function' ? avatarHtml(o.nombre) : '') +
      '<div class="fu-tit"><div class="fu-nombre">' + esc(o.nombre) + '</div><div class="fu-meta">' +
        (edad ? '<span>' + esc(edad) + '</span>' : '') +
        '<button type="button" class="fu-chip ' + claseEstado(est) + '" data-fu="estado" aria-haspopup="menu" title="Cambiar estado">' + (est ? esc(textoEstado(est)) : 'Sin estado') + icono('expand_more') + '</button>' +
        (o.extraCabecera || '') + '</div></div>' +
      '<button type="button" class="fu-cerrar" data-fu="cerrar" title="Cerrar (Esc)" aria-label="Cerrar">' + icono('close') + '</button></div>';
  }

  function htmlAcciones(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="fu-acciones">' + lista.map(function(a) {
      var d = typeof a === 'string' ? { id: a } : a, base = ACCIONES[d.id] || {};
      return '<button type="button" class="fu-acc" data-fu="accion" title="' + esc(d.titulo || base.titulo || d.texto || base.texto || d.id) + '" data-acc="' + esc(d.id) + '">' + iconoAccion(d.icono || base.icono || 'help') + esc(d.texto || base.texto || d.id) + '</button>';
    }).join('') + '</div>';
  }

  function htmlPie(lista) {
    if (!lista || !lista.length) return '';
    return '<div class="fu-pie">' + lista.map(function(b) {
      // Botones del sistema (.md-btn de ui/CSS_Global): acción normal con contorno; la que borra, en rojo suave sin borde.
      return '<button type="button" class="fu-boton md-btn ' + (b.peligro ? 'md-btn--danger peligro' : 'md-btn--outline') + '" data-fu="accion" title="' + esc(b.titulo || b.texto) + '" data-acc="' + esc(b.id) + '">' + icono(b.icono) + esc(b.texto) + '</button>';
    }).join('') + '</div>';
  }

  // Ficha completa. p = fila del usuario, headers = cabeceras de la hoja.
  //   o.nombre         nombre del usuario (por defecto, la columna Nombre)
  //   o.acciones       acciones rapidas: ids de ACCIONES o { id, texto, icono, titulo } para cambiar el texto o la descripcion de una
  //   o.pie            botones propios de la pagina: [{ id, icono, texto, titulo, peligro }] (opcional; titulo = descripcion al pasar el raton)
  //   o.extraCabecera  HTML extra junto al estado (opcional)
  //   o.excluir        cabeceras que no deben salir en "Otros datos" (opcional)
  function html(p, headers, o) {
    o = o || {}; headers = headers || [];
    if (!o.nombre) o.nombre = valor(p, headers, 'Nombre');
    var usados = {};
    CABECERA_USADAS.forEach(function(n) { usados[norm(n)] = true; });
    (o.excluir || []).forEach(function(h) { if (h) usados[norm(h)] = true; });

    var cuerpo = SECCIONES.map(function(s) {
      var campos = s.campos.map(function(c) {
        usados[norm(c.col)] = true;
        var v = valor(p, headers, c.col), editable = !!(o.editable && c.editable && cabecera(headers, c.col));
        if (editable) return htmlEditable(c, v, htmlCampo(c, v, true));   // sale siempre: si está vacío, con «Añadir …»
        return (v || c.tipo === 'gravedad' || c.tipo === 'ingreso') ? htmlCampo(c, v) : '';   // gravedad e ingreso salen siempre, para poder ponerlos desde el chip
      }).join('');
      if (!campos) {
        if (!s.vacio) return '';                                   // sin datos: la seccion no sale
        campos = '<div class="fu-vacio">' + esc(s.vacio) + '</div>';
      }
      return '<section class="fu-sec">' + htmlLabel(s.titulo, s.icono) + campos + '</section>';
    }).join('');

    // Cualquier otra columna de la hoja, con su nombre tal cual, plegada y al final.
    var otros = headers.filter(function(h) {
      if (!h || usados[norm(h)]) return false;
      var v = p[h];
      return v !== null && v !== undefined && String(v).trim() !== '';
    }).map(function(h) {
      return '<div class="fu-campo"><span class="fu-etq">' + esc(h) + '</span><span class="fu-val">' + esc(String(p[h]).trim()) + '</span></div>';
    }).join('');
    if (otros) {
      cuerpo += '<details class="fu-otros"><summary><span class="fu-pill">' + icono('more_horiz') + 'Otros datos</span><span class="fu-linea"></span>' +
        '<span class="material-symbols-outlined fu-chev">expand_more</span></summary><div class="fu-campos">' + otros + '</div></details>';
    }

    return '<div class="fu" data-fu-id="' + esc(valor(p, headers, 'ID paciente')) + '">' + htmlCabecera(p, headers, o) + htmlAcciones(o.acciones) + '<div class="fu-cuerpo">' + cuerpo + '</div>' + htmlPie(o.pie) + '</div>';
  }

  // Cabecera + un mensaje (cargando, error): el panel siempre tiene el boton de cerrar.
  function mensaje(nombre, texto) {
    return '<div class="fu">' + (typeof avatarHtml === 'function' ? '<div class="fu-cab">' + avatarHtml(nombre) + '<div class="fu-tit"><div class="fu-nombre">' + esc(nombre) + '</div></div>' +
      '<button type="button" class="fu-cerrar" data-fu="cerrar" title="Cerrar (Esc)" aria-label="Cerrar">' + icono('close') + '</button></div>' : '') +
      '<p class="fu-aviso">' + esc(texto) + '</p></div>';
  }

  // Pinta la ficha en el contenedor sin perder el scroll ni el estado de "Otros datos" (se vuelve a pintar a
  // menudo: cambio de estado, recarga de datos...).
  function pintar(contenedor, htmlFicha) {
    if (edicion && edicion.cont === contenedor && contenedor.contains(edicion.wrap)) {
      var m = /data-fu-id="([^"]*)"/.exec(htmlFicha), raiz = contenedor.querySelector('.fu');
      if (m && raiz && m[1] === raiz.getAttribute('data-fu-id')) { edicion.pendiente = htmlFicha; return; }   // mismo usuario: se repinta al cerrar el cuadro
    }
    if (edicion && edicion.cont === contenedor) edicion = null;   // otro usuario (o el cuadro ya no está): se descarta
    var cuerpo = contenedor.querySelector('.fu-cuerpo'), scroll = cuerpo ? cuerpo.scrollTop : 0;
    var det = contenedor.querySelector('.fu-otros'), abierto = !!(det && det.open);
    contenedor.innerHTML = htmlFicha;
    cuerpo = contenedor.querySelector('.fu-cuerpo');
    if (cuerpo && scroll) cuerpo.scrollTop = scroll;
    if (abierto) { det = contenedor.querySelector('.fu-otros'); if (det) det.open = true; }
  }

  // Un solo manejador de clics para la ficha. La copia la resuelve el componente; el resto lo decide la pagina:
  //   h.cerrar()   h.estado(botonChip)   h.gravedad(botonChip)   h.ingreso(botonChip)   h.accion(id)
  // Devuelve true si el clic era de la ficha.
  function alClic(e, h) {
    var t = e.target, c = t && t.closest ? t.closest('[data-fu]') : null;
    if (!c) return false;
    var a = c.getAttribute('data-fu');
    if (a === 'copiar') copiar(c.getAttribute('data-valor'), c.getAttribute('data-etq'));
    else if (a === 'cerrar') { if (h && h.cerrar) h.cerrar(); }
    else if (a === 'estado') { if (h && h.estado) h.estado(c); }
    else if (a === 'gravedad') { if (h && h.gravedad) h.gravedad(c); }
    else if (a === 'ingreso') { if (h && h.ingreso) h.ingreso(c); }
    else if (a === 'accion') { if (h && h.accion) h.accion(c.getAttribute('data-acc')); }
    else if (a === 'editar') {
      var w = c.closest('.fu-editable');
      if (w && h && h.guardarCampo) abrirEdicion(w, w.getAttribute('data-col'), w.getAttribute('data-valor'), h.guardarCampo);
    }
    else if (a === 'edicion-guardar') guardarEdicion();
    else if (a === 'edicion-cancelar') cancelarEdicion();
    else return false;
    return true;
  }

  // ---------- Edición directa de un campo (teléfonos, observaciones y nombre habitual) ----------
  // edicion = { cont, wrap, col, original, html, guardar, control, pendiente }: un solo cuadro abierto a la vez.
  var edicion = null;
  // Qué cuadro lleva cada campo: 'largo' (observaciones), 'nombre' (nombre habitual) o 'tel' (teléfonos).
  function tipoEdicion(col) { var n = norm(col); return n === 'observaciones' ? 'largo' : n === 'nombre habitual' ? 'nombre' : 'tel'; }
  // Regla del nombre al escribir y al guardar (ui/JS_Formato_Nombre); sin ese archivo en la página, solo mayúsculas (el servidor aplica la regla igualmente).
  function nombreFinal(v) { return typeof formatoNombreFinal === 'function' ? formatoNombreFinal(v) : String(v || '').toUpperCase().trim(); }
  function editableDe(contenedor, col) {
    var ws = contenedor.querySelectorAll('.fu-editable');
    for (var i = 0; i < ws.length; i++) if (ws[i].getAttribute('data-col') === col) return ws[i];
    return null;
  }
  function htmlEdicion(col, texto) {
    var tipo = tipoEdicion(col), largo = tipo === 'largo', id = 'fu-edicion-campo';
    var ctl = largo
      ? '<textarea class="md-campo__control" id="' + id + '" rows="4" maxlength="5000" placeholder=" ">' + esc(texto) + '</textarea>'
      : tipo === 'nombre'
        ? '<input class="md-campo__control" id="' + id + '" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder=" " value="' + esc(texto) + '">'
        : '<input class="md-campo__control" id="' + id + '" type="tel" inputmode="tel" autocomplete="off" placeholder=" " value="' + esc(texto) + '">';
    var ayuda = largo ? 'Ctrl+Intro guarda · Esc cancela' : tipo === 'nombre' ? 'Cómo le gusta que le llamen · Intro guarda · Esc cancela' : 'Intro guarda · Esc cancela';
    return '<div class="fu-edicion">' +
      '<div class="md-campo md-campo--icono"><span class="material-symbols-outlined md-campo__icono">' + (largo ? 'notes' : tipo === 'nombre' ? 'person' : 'call') + '</span>' + ctl +
        '<label class="md-campo__etiqueta" for="' + id + '">' + esc(Telefono.etiqueta(col)) + '</label>' +
        '<p class="md-campo__ayuda">' + ayuda + '</p></div>' +
      '<div class="fu-edicion-botones">' +
        '<button type="button" class="md-btn md-btn--text" data-fu="edicion-cancelar">Cancelar</button>' +
        '<button type="button" class="md-btn md-btn--tonal" data-fu="edicion-guardar">' + icono('check') + 'Guardar</button>' +
      '</div></div>';
  }
  // Valor para guardar o comparar: el teléfono en su forma de guardado; las observaciones, sin espacios al final; el nombre habitual, con la regla del nombre.
  function limpioEdicion(col, v) {
    var tipo = tipoEdicion(col);
    return tipo === 'largo' ? String(v || '').trim() : tipo === 'nombre' ? nombreFinal(v) : Telefono.normalizar(v);
  }
  function abrirEdicion(wrap, col, texto, guardar) {
    if (edicion) cancelarEdicion();
    var raiz = wrap.closest('.fu'), cont = raiz ? raiz.parentNode : wrap.parentNode, tipo = tipoEdicion(col), tel = tipo === 'tel', unaLinea = tipo !== 'largo';
    edicion = { cont: cont, wrap: wrap, col: col, original: wrap.getAttribute('data-valor') || '', html: wrap.innerHTML, guardar: guardar, pendiente: null };
    wrap.innerHTML = htmlEdicion(col, tel ? formatearTel(texto) : (texto || ''));
    var ctl = edicion.control = wrap.querySelector('.md-campo__control');
    if (tel) ctl.addEventListener('input', function() { Telefono.escribiendo(ctl); });
    if (tipo === 'nombre') ctl.addEventListener('input', function(e) {
      if (e.isComposing) return;
      if (typeof sanitizeName === 'function') sanitizeName(ctl); else ctl.value = ctl.value.toUpperCase();
    });
    ctl.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelarEdicion(); }
      else if (e.key === 'Enter' && !e.isComposing && (unaLinea || e.ctrlKey || e.metaKey)) { e.preventDefault(); e.stopPropagation(); guardarEdicion(); }
    });
    ctl.focus({ preventScroll: true });
    wrap.scrollIntoView({ block: 'nearest' });
    var n = ctl.value.length;
    try { ctl.setSelectionRange(n, n); } catch (err) { /* este tipo de campo no admite cursor */ }
  }
  function hayEdicion(contenedor) {
    if (!edicion || (contenedor && edicion.cont !== contenedor) || !edicion.cont.contains(edicion.wrap)) return false;
    return limpioEdicion(edicion.col, edicion.control.value) !== limpioEdicion(edicion.col, edicion.original);
  }
  function cancelarEdicion() {
    var ed = edicion;
    if (!ed) return;
    edicion = null;
    if (ed.pendiente) pintar(ed.cont, ed.pendiente);              // llegaron datos nuevos mientras se escribía
    else if (ed.cont.contains(ed.wrap)) ed.wrap.innerHTML = ed.html;
    var w = editableDe(ed.cont, ed.col), b = w && w.querySelector('[data-fu="editar"]');
    if (b) b.focus({ preventScroll: true });
  }
  function guardarEdicion() {
    var ed = edicion;
    if (!ed) return;
    if (!hayEdicion(ed.cont)) { cancelarEdicion(); return; }      // sin cambios: solo se cierra
    var nuevo = limpioEdicion(ed.col, ed.control.value);
    edicion = null;                                                // la página repinta la ficha con el dato nuevo
    if (ed.pendiente) pintar(ed.cont, ed.pendiente);
    ed.guardar(ed.col, nuevo);
  }
  // Vuelve a abrir el cuadro de un campo con un texto (la página lo usa si el servidor no pudo guardar).
  function editar(contenedor, col, texto, guardar) {
    var w = editableDe(contenedor, col);
    if (w) abrirEdicion(w, col, texto, guardar);
  }

  // ---------- Menu flotante de estado (y de gravedad) ----------
  // items: [{ punto, texto, titulo, marcado, fn }] (titulo opcional: por defecto "Cambiar estado a ..."). Con `icono`, el item
  // lleva ese icono en lugar del punto; con `separado`, una raya encima (para «Quitar …»). Se cierra con clic fuera, Esc, Tab, scroll o al cambiar el tamano.
  var menuActual = null;
  function cerrarMenu(devolverFoco) {
    if (!menuActual) return;
    var m = menuActual; menuActual = null;
    document.removeEventListener('mousedown', m.fuera, true);
    document.removeEventListener('keydown', m.tecla);
    window.removeEventListener('resize', m.cerrar);
    document.removeEventListener('scroll', m.cerrar, true);
    if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
    if (m.ancla) { m.ancla.setAttribute('aria-expanded', 'false'); if (devolverFoco && m.ancla.focus) m.ancla.focus({ preventScroll: true }); }
  }
  function menuEstado(ancla, items) {
    cerrarMenu();
    var el = document.createElement('div');
    el.className = 'fu-menu'; el.setAttribute('role', 'menu');
    el.innerHTML = items.map(function(it, i) {
      return '<button type="button" role="menuitemradio" aria-checked="' + (it.marcado ? 'true' : 'false') + '" class="fu-menu-item' + (it.separado ? ' fu-menu-item--separado' : '') + '" title="' + esc(it.titulo || ('Cambiar estado a ' + it.texto)) + '" data-i="' + i + '">' +
        (it.icono ? '<span class="material-symbols-outlined fu-menu-ico" aria-hidden="true">' + esc(it.icono) + '</span>' : '<span class="fu-punto ' + esc(it.punto || '') + '"></span>') +
        '<span>' + esc(it.texto) + '</span>' + (it.marcado ? icono('check') : '') + '</button>';
    }).join('');
    document.body.appendChild(el);
    var r = ancla.getBoundingClientRect(), w = el.offsetWidth, hgt = el.offsetHeight;
    var x = Math.min(Math.max(8, r.left), window.innerWidth - w - 8), y = r.bottom + 4;
    if (y + hgt > window.innerHeight - 8) y = Math.max(8, r.top - hgt - 4);
    el.style.left = x + 'px'; el.style.top = y + 'px';

    var botones = function() { return Array.prototype.slice.call(el.querySelectorAll('.fu-menu-item')); };
    var m = {
      el: el, ancla: ancla,
      cerrar: function() { cerrarMenu(false); },
      fuera: function(e) { if (!el.contains(e.target)) cerrarMenu(false); },
      tecla: function(e) {
        var b = botones(), i = b.indexOf(document.activeElement);
        if (e.key === 'Escape') { e.preventDefault(); cerrarMenu(true); }
        else if (e.key === 'Tab') cerrarMenu(false);
        else if (e.key === 'ArrowDown') { e.preventDefault(); b[(i + 1) % b.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); b[(i <= 0 ? b.length : i) - 1].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); b[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); b[b.length - 1].focus(); }
      }
    };
    el.addEventListener('click', function(e) {
      var b = e.target.closest('.fu-menu-item');
      if (!b) return;
      var it = items[Number(b.getAttribute('data-i'))];
      cerrarMenu(true);
      if (it && it.fn) it.fn();
    });
    menuActual = m;
    ancla.setAttribute('aria-expanded', 'true');
    document.addEventListener('mousedown', m.fuera, true);
    document.addEventListener('keydown', m.tecla);
    window.addEventListener('resize', m.cerrar);
    document.addEventListener('scroll', m.cerrar, true);
    var primero = el.querySelector('[aria-checked="true"]') || el.querySelector('.fu-menu-item');
    if (primero) primero.focus({ preventScroll: true });
  }

  return {
    html: html, mensaje: mensaje, pintar: pintar, alClic: alClic, menuEstado: menuEstado, cerrarMenu: cerrarMenu,
    estadosDisponibles: estadosDisponibles, claseEstado: claseEstado, textoEstado: textoEstado,
    gravedadesMenu: gravedadesMenu, claseGravedad: claseGravedad, ingresosMenu: ingresosMenu, ingresoDatos: ingresoDatos,
    cabecera: cabecera, valor: valor, norm: norm, formatearTel: formatearTel, copiar: copiar,
    editar: editar, hayEdicion: hayEdicion, cancelarEdicion: cancelarEdicion
  };
})();
</script>
