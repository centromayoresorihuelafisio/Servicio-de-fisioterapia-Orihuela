<!--
  historia/Panel_Huerfana.html
  "Buscar Historia Clínica huérfana" como módulo del panel lateral de la Base de Datos Web.
  Se incluye desde usuarios/BaseDatos_Vista con <?!= include('historia/Panel_Huerfana'); ?>
  API: PanelHuerfana.abrir(contenedor, { fila, nombre, onGuardado, onCancelar })
  Devuelve { haCambiado(), alEscape() }:
    · haCambiado() → siempre false: elegir un candidato no es introducir datos, no hace falta confirmar al salir.
    · alEscape()   → false (no tiene nada propio que cerrar; Esc vuelve a la ficha).
  onGuardado(mensaje) recibe el texto que devuelve el servidor ("Historia clínica vinculada y archivo renombrado a …").
  Origen: historia/Buscar_Huerfana_Web.html (que se mantiene tal cual para la ruta ?page=huerfanaHC).
  Usa las mismas funciones de servidor: obtenerCandidatosHistoriaClinica(fila) y
  vincularHistoriaClinicaHuerfana(fila, fileId) (historia/Buscar_Huerfana.gs). CSS acotado a .ph y basado en
  los tokens de la página (--md-*, respeta el tema oscuro).
  Mejoras sobre el original: los nombres de archivo se escapan antes de pintarse, la lista se maneja con teclado
  (flechas + Intro/Espacio), el porcentaje de coincidencia se ve como barra, y si el paciente de la fila ya no
  coincide con el de la tabla (la hoja se reordenó) avisa en vez de vincular a otra persona.
-->
<style>
.ph { display: flex; flex-direction: column; height: 100%; min-height: 0; font-family: var(--font); font-size: 14px; color: var(--md-on-surface); background: var(--md-surface); }
.ph .ms { font-family: 'Material Symbols Outlined'; font-weight: 400; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; user-select: none; flex-shrink: 0; color: var(--md-on-surface-med); }
.ph .ph-scroll { flex: 1; min-height: 0; overflow: auto; padding: 1.1rem 1.25rem 1.3rem; }
.ph .ph-estado { padding: 2.25rem 1rem; text-align: center; color: var(--md-on-surface-med); font-size: .85rem; line-height: 1.5; white-space: pre-line; }
.ph .ph-estado .ms { display: block; margin: 0 auto .6rem; font-size: 28px; }
.ph .ph-estado.error { color: var(--md-error); } .ph .ph-estado.error .ms { color: var(--md-error); }
.ph .spinner { animation: ph-spin .8s linear infinite; }
@keyframes ph-spin { to { transform: rotate(360deg); } }

.ph .paciente { display: flex; align-items: center; gap: .75rem; padding: .8rem .95rem; border: 1px solid var(--md-outline); border-radius: 12px; background: var(--md-bg); margin-bottom: 1rem; }
.ph .paciente .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--md-primary-light); display: grid; place-items: center; }
.ph .paciente .ico .ms { color: var(--md-primary); }
.ph .paciente .nom { font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; }
.ph .paciente .dni { font-size: .78rem; color: var(--md-on-surface-med); margin-top: 2px; }
.ph .aviso { display: flex; gap: .6rem; align-items: flex-start; padding: .7rem .85rem; margin-bottom: 1rem; border-radius: 12px; background: var(--md-warning-bg); color: var(--md-on-surface); font-size: .8rem; line-height: 1.45; }
.ph .aviso .ms { color: #b05e00; font-size: 20px; margin-top: 1px; }
.ph .titulo-lista { display: flex; align-items: center; gap: .6rem; margin: 0 0 .7rem; }
.ph .titulo-lista span.pill { display: inline-flex; align-items: center; gap: .375rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary-dark); background: var(--md-primary-light); padding: .35rem .875rem .35rem .75rem; border-radius: 999px; }
.ph .titulo-lista .pill .ms { font-size: 15px; color: var(--md-primary); }
.ph .titulo-lista .linea { flex: 1; height: 1px; background: var(--md-outline); }

.ph .candidato { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; font-family: inherit; color: inherit; padding: .75rem .9rem; margin-bottom: .55rem; background: var(--md-surface); border: 1.5px solid var(--md-outline); border-radius: 12px; cursor: pointer; transition: border-color 160ms, background 160ms; }
.ph .candidato:hover { background: var(--md-surface-variant); }
.ph .candidato:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.ph .candidato[aria-checked="true"] { border-color: var(--md-primary); background: var(--md-primary-light); }
.ph .candidato .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--md-outline); flex-shrink: 0; position: relative; transition: border-color 160ms; }
.ph .candidato[aria-checked="true"] .radio { border-color: var(--md-primary); }
.ph .candidato[aria-checked="true"] .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--md-primary); }
.ph .candidato .info { flex: 1; min-width: 0; }
.ph .candidato .archivo { font-weight: 500; font-size: .86rem; overflow-wrap: anywhere; line-height: 1.3; }
.ph .candidato .barra { display: flex; align-items: center; gap: .5rem; margin-top: .45rem; font-size: .72rem; color: var(--md-on-surface-med); }
.ph .candidato .barra .pista { flex: 1; height: 5px; border-radius: 999px; background: var(--md-surface-variant); overflow: hidden; }
.ph .candidato .barra .pista i { display: block; height: 100%; background: var(--md-primary); border-radius: inherit; }
.ph .candidato .barra b { font-weight: 600; color: var(--md-on-surface); min-width: 2.4em; text-align: right; }

.ph .ph-msg { flex: none; display: none; padding: .7rem 1.25rem; font-size: .8125rem; font-weight: 500; }
.ph .ph-msg.error { display: block; background: var(--md-error-bg); color: var(--md-error); }
.ph .ph-msg.ok { display: block; background: var(--md-success-bg); color: var(--md-success); }
.ph .panel-pie { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: .5rem; padding: .7rem 1rem; border-top: 1px solid var(--md-outline); background: var(--md-surface); }
.ph .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.3rem; height: 40px; border-radius: 999px; font-family: var(--font); font-size: .875rem; font-weight: 600; cursor: pointer; border: none; transition: filter 150ms, background 150ms; }
.ph .btn .ms { font-size: 18px; color: inherit; }
.ph .btn-primary { background: var(--md-primary-container); color: var(--md-primary-dark); }
.ph .btn-primary:hover:not(:disabled) { filter: brightness(.97); }
.ph .btn-ghost { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); font-weight: 500; }
.ph .btn-ghost:hover:not(:disabled) { background: var(--md-primary-light); }
.ph .btn:disabled { background: rgba(128,134,139,.2); color: var(--md-on-surface-low); cursor: not-allowed; border-color: transparent; }
.ph .btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
</style>

<template id="tplPanelHuerfana"><div class="ph">
  <div class="ph-scroll"><div class="ph-contenido"></div></div>
  <div class="ph-msg" role="alert"></div>
  <div class="panel-pie">
    <button type="button" class="btn btn-ghost ph-cancelar">Cancelar</button>
    <button type="button" class="btn btn-primary ph-vincular" disabled><span class="ms">link</span>Vincular seleccionada</button>
  </div>
</div></template>

<script>
window.PanelHuerfana = {
  abrir: function (host, opts) {
    opts = opts || {};
    host.innerHTML = '';
    host.appendChild(document.getElementById('tplPanelHuerfana').content.cloneNode(true));
    var ph = host.querySelector('.ph');
    function q(sel) { return ph.querySelector(sel); }
    var contenido = q('.ph-contenido'), msg = q('.ph-msg'), btnVincular = q('.ph-vincular'), btnCancelar = q('.ph-cancelar');
    var fileId = null, vinculando = false, cerrado = false;

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function norm(x) { return String(x || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
    function mostrarMsg(texto, tipo) { msg.textContent = texto; msg.className = 'ph-msg ' + tipo; }
    function ocultarMsg() { msg.className = 'ph-msg'; msg.textContent = ''; }
    function estado(icono, texto, esError, conReintento) {
      contenido.innerHTML = '<div class="ph-estado' + (esError ? ' error' : '') + '"><span class="ms' + (icono === 'progress_activity' ? ' spinner' : '') + '">' + icono + '</span>' + esc(texto) +
        (conReintento ? '<div style="margin-top:.9rem"><button type="button" class="btn btn-ghost ph-reintentar">Reintentar</button></div>' : '') + '</div>';
      var r = contenido.querySelector('.ph-reintentar');
      if (r) r.addEventListener('click', cargar);
    }

    function seleccionar(btn) {
      if (vinculando) return;
      ph.querySelectorAll('.candidato').forEach(function (c) { c.setAttribute('aria-checked', c === btn ? 'true' : 'false'); c.tabIndex = c === btn ? 0 : -1; });
      fileId = btn.getAttribute('data-fileid');
      btnVincular.disabled = false;
      ocultarMsg();
    }

    function pintar(resp) {
      if (!resp || !resp.success) { estado('error', (resp && resp.message) || 'No se pudieron buscar los candidatos.', true, true); return; }
      // Seguridad: si la hoja se reordenó desde que se cargó la tabla, la fila ya no es de este paciente.
      if (opts.nombre && norm(resp.nombre) !== norm(opts.nombre)) {
        estado('error', 'Los datos han cambiado de posición desde que cargaste la tabla.\n\nCierra este panel y recarga la Base de Datos.', true, false);
        return;
      }
      var html = '<div class="paciente"><div class="ico"><span class="ms">person</span></div><div><div class="nom">' + esc(resp.nombre) + '</div>' +
                 '<div class="dni">' + (resp.dni ? 'DNI: ' + esc(resp.dni) : 'Sin DNI') + '</div></div></div>';
      if (resp.yaEnlazada) {
        html += '<div class="aviso"><span class="ms">warning</span><div>Esta fila ya tiene una historia clínica enlazada. Si vinculas otra, se sustituirá el enlace actual.</div></div>';
      }
      var cands = resp.candidatos || [];
      if (!cands.length) {
        html += '<div class="ph-estado"><span class="ms">search_off</span>No se encontraron archivos con nombre parecido en la carpeta.</div>';
        contenido.innerHTML = html;
        return;
      }
      html += '<div class="titulo-lista"><span class="pill"><span class="ms">description</span>' + cands.length + (cands.length === 1 ? ' candidato' : ' candidatos') + '</span><div class="linea"></div></div>' +
              '<div role="radiogroup" aria-label="Archivos candidatos">';
      cands.forEach(function (c, i) {
        var pct = Math.max(0, Math.min(100, Math.round(c.score * 100)));
        html += '<button type="button" class="candidato" role="radio" aria-checked="false" tabindex="' + (i === 0 ? '0' : '-1') + '" data-fileid="' + esc(c.fileId) + '">' +
                  '<span class="radio"></span><span class="info"><span class="archivo">' + esc(c.fileName) + '</span>' +
                  '<span class="barra"><span class="pista"><i style="width:' + pct + '%"></i></span><b>' + pct + '%</b></span></span></button>';
      });
      html += '</div>';
      contenido.innerHTML = html;
    }

    // Selección con clic y con teclado (flechas mueven el foco y seleccionan, como un grupo de radio)
    contenido.addEventListener('click', function (e) {
      var c = e.target.closest('.candidato'); if (c) seleccionar(c);
    });
    contenido.addEventListener('keydown', function (e) {
      var c = e.target.closest('.candidato'); if (!c) return;
      var lista = Array.prototype.slice.call(ph.querySelectorAll('.candidato')), i = lista.indexOf(c), d = 0;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') d = 1; else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') d = -1; else return;
      e.preventDefault();
      var n = lista[(i + d + lista.length) % lista.length];
      n.focus(); seleccionar(n);
    });

    function cargar() {
      fileId = null; btnVincular.disabled = true; ocultarMsg();
      estado('progress_activity', 'Buscando candidatos…', false, false);
      google.script.run
        .withSuccessHandler(function (r) { if (!cerrado) pintar(r); })
        .withFailureHandler(function (err) { if (!cerrado) estado('error', 'Error: ' + (err && err.message ? err.message : err), true, true); })
        .obtenerCandidatosHistoriaClinica(opts.fila);
    }

    function ponerBoton(si) {
      btnVincular.disabled = si || !fileId; btnCancelar.disabled = si;
      btnVincular.innerHTML = si ? '<span class="ms spinner">refresh</span>Vinculando…' : '<span class="ms">link</span>Vincular seleccionada';
    }
    btnVincular.addEventListener('click', function () {
      if (!fileId || vinculando) return;
      vinculando = true; ponerBoton(true); ocultarMsg();
      google.script.run
        .withSuccessHandler(function (resp) {
          vinculando = false;
          if (resp && resp.success) {
            cerrado = true;
            mostrarMsg(resp.message || 'Historia clínica vinculada.', 'ok');
            btnVincular.disabled = true; btnCancelar.disabled = true;
            btnVincular.innerHTML = '<span class="ms">check_circle</span>Vinculada';
            setTimeout(function () { if (opts.onGuardado) opts.onGuardado(resp.message || ''); }, 700);
          } else {
            ponerBoton(false);
            mostrarMsg('Error: ' + ((resp && resp.message) || 'No se pudo vincular.'), 'error');
          }
        })
        .withFailureHandler(function (err) {
          vinculando = false; ponerBoton(false);
          mostrarMsg('Error: ' + (err && err.message ? err.message : err), 'error');
        })
        .vincularHistoriaClinicaHuerfana(opts.fila, fileId);
    });
    btnCancelar.addEventListener('click', function () { if (opts.onCancelar) opts.onCancelar(); });

    cargar();

    return {
      haCambiado: function () { return false; },
      alEscape: function () { return false; }
    };
  }
};
</script>
