<?!= incluirAcceso_('pruebaAcceso'); ?>
<h1>Prueba de acceso</h1>
<div class="pa-botones">
  <button type="button" class="md-btn md-btn--outline" id="pa-sesion">Comprobar sesión</button>
  <button type="button" class="md-btn md-btn--outline" id="pa-inventada">Acción inventada</button>
  <button type="button" class="md-btn md-btn--outline" id="pa-sintoken">Llamada sin sesión</button>
  <button type="button" class="md-btn md-btn--outline" id="pa-propietario">¿Soy el propietario?</button>
  <button type="button" class="md-btn md-btn--outline" id="pa-ventana">Abrir en otra ventana</button>
  <button type="button" class="md-btn md-btn--danger" id="pa-cerrar">Cerrar sesión</button>
</div>
<p id="pa-resultado" role="status"></p>
<script>
  (function () {
    var salida = document.getElementById('pa-resultado');
    function mostrar(v) { salida.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2); }
    function probar(accion) {
      mostrar('Esperando…');
      llamar(accion).then(mostrar, function (err) { mostrar('Rechazada: ' + err.message); });
    }
    function al(id, fn) { document.getElementById(id).addEventListener('click', fn); }
    al('pa-sesion', function () { probar('comprobarSesion'); });
    al('pa-inventada', function () { probar('accionInventada'); });
    al('pa-propietario', function () { probar('diagnosticoAcceso'); });
    al('pa-sintoken', function () {
      mostrar('Esperando…');
      google.script.run.withSuccessHandler(mostrar).withFailureHandler(function (err) { mostrar(err.message); }).api('', 'comprobarSesion', []);
    });
    al('pa-ventana', function () { window.open(<?!= JSON.stringify(baseUrl) ?> + '?page=pruebaAcceso', '_blank', 'noopener'); });
    al('pa-cerrar', function () { Acceso.cerrarSesion(); });
  })();
</script>
</body>
</html>
