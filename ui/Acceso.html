<!--
  ui/Acceso.html
  Portero común de todas las páginas (CONTEXTO.md, 17.5): login, cambio de contraseña temporal y llamar(accion, datos).
  Lo pone incluirAcceso_ (core/WebApp.gs) justo después de abrir body, fuera de cualquier script: el cierre opaco ya está
  pintado antes de que cargue el resto de la página y solo se retira si hay un token guardado. Si la sesión caduca, sale
  encima de la pantalla sin recargarla, para no perder lo escrito, y las llamadas pendientes siguen solas al entrar.
  Fase 3 (17.10): con el rol que devuelve el servidor marca <html data-rol-acceso> (ui/CSS_Global oculta lo de
  data-rol="administrador"), maneja el menú de sesión y «Ver como usuario» de ui/Pestanas y, si la página pide más rol,
  vuelve a Usuarios con un aviso. Es comodidad: la seguridad está en api(), que nunca toma el rol del navegador.
-->
<style>
  .acceso-cierre {
    position: fixed; inset: 0; z-index: var(--z-max); display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--md-bg); color: var(--md-on-surface); font-family: var(--font);
  }
  .acceso-cierre[hidden], .acceso-tarjeta[hidden] { display: none; }
  .acceso-tarjeta {
    display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; width: 100%; max-width: 360px; padding: 32px;
    background: var(--md-surface); border-radius: var(--md-shape-xl); box-shadow: var(--md-elev-2);
  }
  .acceso-tarjeta h1 { margin: 0; font-size: var(--fs-h); font-weight: 500; }
  .acceso-tarjeta p { margin: 0; font-size: var(--fs-md); color: var(--md-on-surface-med); }
  .acceso-tarjeta .acceso-error { color: var(--md-error); min-height: 1.3em; }
  @media print { .acceso-cierre { display: none; } }
</style>
<div class="acceso-cierre" id="acceso-cierre" role="dialog" aria-modal="true" aria-label="Acceso a la aplicación">
  <form class="acceso-tarjeta" id="acceso-login" autocomplete="on">
    <h1>Fisioterapia Orihuela</h1>
    <p>Escribe tu usuario y tu contraseña.</p>
    <div class="md-campo md-campo--icono">
      <span class="material-symbols-outlined md-campo__icono" aria-hidden="true">person</span>
      <input class="md-campo__control" id="acceso-usuario" placeholder=" " autocomplete="username" maxlength="60">
      <label class="md-campo__etiqueta" for="acceso-usuario">Usuario</label>
    </div>
    <div class="md-campo md-campo--icono">
      <span class="material-symbols-outlined md-campo__icono" aria-hidden="true">lock</span>
      <input class="md-campo__control" id="acceso-password" type="password" placeholder=" " autocomplete="current-password">
      <label class="md-campo__etiqueta" for="acceso-password">Contraseña</label>
    </div>
    <p class="acceso-error" id="acceso-login-error" role="alert"></p>
    <button class="md-btn md-btn--tonal" type="submit">Entrar</button>
  </form>
  <form class="acceso-tarjeta" id="acceso-cambio" hidden>
    <h1>Cambia la contraseña</h1>
    <p>Debes elegir una contraseña o un PIN nuevo antes de seguir.</p>
    <div class="md-campo">
      <input class="md-campo__control" id="acceso-actual" type="password" placeholder=" " autocomplete="current-password">
      <label class="md-campo__etiqueta" for="acceso-actual">Contraseña actual</label>
    </div>
    <div class="md-campo">
      <input class="md-campo__control" id="acceso-nueva" type="password" placeholder=" " autocomplete="new-password">
      <label class="md-campo__etiqueta" for="acceso-nueva">Contraseña nueva</label>
    </div>
    <div class="md-campo">
      <input class="md-campo__control" id="acceso-repite" type="password" placeholder=" " autocomplete="new-password">
      <label class="md-campo__etiqueta" for="acceso-repite">Repite la contraseña nueva</label>
    </div>
    <p class="acceso-error" id="acceso-cambio-error" role="alert"></p>
    <button class="md-btn md-btn--tonal" type="submit">Guardar y entrar</button>
  </form>
  <div class="acceso-tarjeta" id="acceso-denegada" hidden>
    <h1>Página solo para el administrador</h1>
    <p>Con tu usuario no puedes abrir esta página. Te llevamos a Usuarios.</p>
    <a class="md-btn md-btn--tonal" href="<?= baseUrl ?>?page=baseDatos" target="_top">Ir a Usuarios</a>
  </div>
  <div class="acceso-tarjeta" id="acceso-cerrada" hidden>
    <h1>Aplicación cerrada</h1>
    <p id="acceso-cerrada-texto"></p>
    <button class="md-btn md-btn--tonal" type="button" id="acceso-cerrada-reintentar">Volver a intentarlo</button>
  </div>
</div>
<script>
  (function () {
    var CLAVE = 'tokenAcceso';
    var CLAVE_PERFIL = 'perfilAcceso';   // último perfil conocido, solo para pintar la barra sin esperar al servidor
    var CLAVE_AVISO = 'avisoAcceso';     // aviso que se enseña al llegar a Usuarios desde una página no permitida
    var URL_USUARIOS = <?!= JSON.stringify(baseUrl + '?page=baseDatos') ?>;
    var ROL_PAGINA = <?!= JSON.stringify(rolPagina) ?>;
    var NIVEL = { usuario: 1, administrador: 2 };
    var perfil = null;                   // { usuario, nombre, rol, rolReal, verComo }; rol = el que se aplica
    var cierre = document.getElementById('acceso-cierre');
    var formLogin = document.getElementById('acceso-login');
    var formCambio = document.getElementById('acceso-cambio');
    var tokenMemoria = '';
    var esperando = false;   // true mientras el cierre está puesto: las llamadas nuevas esperan en la cola
    var pantallaPedida = '';
    var cola = [];
    var desactivados = [];

    function leerToken() {
      try { return localStorage.getItem(CLAVE) || tokenMemoria; } catch (err) { return tokenMemoria; }
    }
    function guardarToken(t) {
      if (t !== leerToken()) vaciarMemoriaPestanas();
      tokenMemoria = t;
      try { if (t) localStorage.setItem(CLAVE, t); else localStorage.removeItem(CLAVE); } catch (err) { /* sin almacenamiento */ }
    }
    // Al salir o entrar con otra sesión se borra lo que las pestañas guardaron de la anterior (ui/JS_Carga_Compartida).
    function vaciarMemoriaPestanas() {
      try {
        for (var i = sessionStorage.length - 1; i >= 0; i--) {
          var k = sessionStorage.key(i);
          if (k && k.indexOf('memoria:') === 0) sessionStorage.removeItem(k);
        }
      } catch (err) { /* sin almacenamiento */ }
    }
    function $(id) { return document.getElementById(id); }
    function leerAlmacen(clave) {
      try { return localStorage.getItem(clave); } catch (err) { return null; }
    }
    function guardarAlmacen(clave, valor) {
      try { if (valor) localStorage.setItem(clave, valor); else localStorage.removeItem(clave); } catch (err) { /* sin almacenamiento */ }
    }

    /** Aviso breve abajo, con las piezas comunes .toasts y .toast-aviso. */
    function avisar(texto) {
      var caja = document.createElement('div');
      caja.className = 'toasts';
      var t = document.createElement('div');
      t.className = 'toast-aviso';
      t.setAttribute('role', 'status');
      t.textContent = texto;
      caja.appendChild(t);
      document.body.appendChild(caja);
      setTimeout(function () { t.classList.add('saliendo'); setTimeout(function () { caja.remove(); }, 400); }, 6000);
    }

    // ---------- Rol y menú de sesión ----------
    function puede(rol) { return !!perfil && (NIVEL[perfil.rol] || 0) >= (NIVEL[rol] || 99); }

    /** Pinta el menú de sesión de ui/Pestanas (si la página lo tiene) con el perfil actual. */
    function pintarSesion() {
      if (!$('sesionBoton')) return;
      $('sesionNombre').textContent = perfil ? (perfil.nombre || perfil.usuario) : 'Sesión';
      $('sesionQuien').textContent = perfil ? perfil.usuario + ' · ' + perfil.rolReal : '';
      $('sesionVerUsuario').hidden = !perfil || perfil.rolReal !== 'administrador' || perfil.verComo;
      $('sesionVerComo').hidden = !perfil || !perfil.verComo;
    }

    /** Página no permitida: tapa la pantalla con el aviso y vuelve a Usuarios (si el navegador no deja, queda el botón). */
    function volverAUsuarios() {
      esperando = true;   // las llamadas de esta página ya no deben salir
      pantallaPedida = 'denegada';
      cierre.hidden = false;
      formLogin.hidden = true;
      formCambio.hidden = true;
      $('acceso-denegada').hidden = false;
      aislarPagina();
      guardarAlmacen(CLAVE_AVISO, 'Esa página es solo para el administrador: has vuelto a Usuarios.');
      try { window.top.location.href = URL_USUARIOS; } catch (err) { /* queda el botón «Ir a Usuarios» */ }
    }

    /**
     * Aplica un perfil. delServidor = recién confirmado por el servidor: solo entonces se decide si la página se puede ver.
     * Avisa a la pantalla con el evento 'acceso:rol' para que repinte lo que dibuja ella (p. ej. los botones de eliminar).
     */
    function aplicarPerfil(p, delServidor) {
      var antes = perfil ? perfil.rol : '';
      perfil = p ? { usuario: p.usuario, nombre: p.nombre, rol: p.rol, rolReal: p.rolReal || p.rol, verComo: !!p.verComo } : null;
      guardarAlmacen(CLAVE_PERFIL, perfil ? JSON.stringify(perfil) : '');
      document.documentElement.setAttribute('data-rol-acceso', perfil ? perfil.rol : '');
      pintarSesion();
      if ((perfil ? perfil.rol : '') !== antes) document.dispatchEvent(new CustomEvent('acceso:rol', { detail: perfil }));
      if (delServidor && perfil && !puede(ROL_PAGINA)) volverAUsuarios();
    }

    function refrescarPerfil() {
      window.llamar('comprobarSesion').then(function (p) { aplicarPerfil(p, true); }, function () { /* si la sesión no vale, enviar ya ha pedido el login */ });
    }

    /** Plan de emergencia, nivel 3 (17.9): con la app cerrada, api() no atiende nada. Se tapa todo con el aviso. */
    function mostrarCerrada(texto) {
      esperando = true;
      pantallaPedida = 'cerrada';
      cierre.hidden = false;
      formLogin.hidden = true;
      formCambio.hidden = true;
      $('acceso-denegada').hidden = true;
      $('acceso-cerrada-texto').textContent = texto || 'La aplicación está cerrada por ahora.';
      $('acceso-cerrada').hidden = false;
      aislarPagina();
    }

    /**
     * Llamada directa al servidor, sin cola: la usan el login y lo que tiene que pasar con el cierre puesto.
     * En la app instalable (sección 20) no hay google.script.run: pwa/api.js da window.PWA.enviar, que va por fetch a
     * doPost y responde lo mismo que api().
     */
    function directa(accion, datos, alTerminar) {
      var avisarFin = function (r) {
        r = r || { ok: false, error: 'El servidor no ha respondido.' };
        if (r.codigo === 'CERRADA') { mostrarCerrada(r.error); return; }   // la llamada no sigue: la página queda tapada
        alTerminar(r);
      };
      if (window.PWA && window.PWA.enviar) {
        window.PWA.enviar(leerToken(), accion, datos).then(avisarFin, function (err) { avisarFin({ ok: false, error: err.message }); });
        return;
      }
      google.script.run
        .withSuccessHandler(avisarFin)
        .withFailureHandler(function (err) { avisarFin({ ok: false, error: err.message }); })
        .api(leerToken(), accion, datos);
    }

    function enviar(p) {
      if (esperando) { cola.push(p); return; }
      var tokenUsado = leerToken();
      directa(p.accion, p.datos, function (r) {
        if (r.ok) {
          // El servidor dice en cada respuesta el rol que aplica: si ha cambiado (otro rol, «Ver como»...), se repinta.
          if (r.rol && (!perfil || r.rol !== perfil.rol) && p.accion !== 'comprobarSesion' && p.accion !== 'verComo') refrescarPerfil();
          p.resolver(r.datos);
          return;
        }
        if (r.codigo === 'SESION') {
          if (leerToken() !== tokenUsado) { enviar(p); return; }   // respuesta tardía: ya se ha entrado de nuevo
          guardarToken(''); cola.push(p); pedir('login'); return;
        }
        if (r.codigo === 'CAMBIO_PASSWORD') { cola.push(p); pedir('cambio'); return; }
        var error = new Error(r.error);
        error.codigo = r.codigo;
        p.rechazar(error);
      });
    }

    /** Llama a una acción del servidor. Devuelve una Promise; datos es la lista de argumentos de la acción. */
    window.llamar = function (accion, datos) {
      return new Promise(function (resolver, rechazar) {
        enviar({ accion: accion, datos: datos || [], resolver: resolver, rechazar: rechazar });
      });
    };

    /**
     * Deja inerte lo que hay detrás del cierre, para que el tabulador no llegue a la página. La pantalla «Conectar la
     * app» de la app instalable (.pwa-conexion, pwa/api.js) va por encima del login y se respeta.
     */
    function aislarPagina() {
      Array.prototype.forEach.call(document.body.children, function (el) {
        if (el !== cierre && !el.inert && !el.classList.contains('pwa-conexion')) { el.inert = true; desactivados.push(el); }
      });
    }

    function pedir(pantalla) {
      esperando = true;
      if (pantallaPedida === 'denegada' || pantallaPedida === 'cerrada') return;  // va camino de Usuarios, o la app está cerrada
      if (pantalla === pantallaPedida) return;   // varias llamadas pueden caducar a la vez: el foco no debe saltar mientras se escribe
      pantallaPedida = pantalla;
      cierre.hidden = false;
      formLogin.hidden = pantalla !== 'login';
      formCambio.hidden = pantalla !== 'cambio';
      aislarPagina();
      $(pantalla === 'login' ? 'acceso-usuario' : 'acceso-actual').focus();
    }

    function soltar() {
      esperando = false;
      pantallaPedida = '';
      cierre.hidden = true;
      formLogin.reset();
      formCambio.reset();
      desactivados.forEach(function (el) { el.inert = false; });
      desactivados = [];
      var pendientes = cola;
      cola = [];
      pendientes.forEach(enviar);
    }

    function ocupado(form, si) {
      form.querySelector('button').setAttribute('aria-busy', si ? 'true' : 'false');
    }

    formLogin.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var aviso = $('acceso-login-error');
      aviso.textContent = '';
      ocupado(formLogin, true);
      directa('iniciarSesion', [$('acceso-usuario').value, $('acceso-password').value], function (r) {
        ocupado(formLogin, false);
        $('acceso-password').value = '';
        if (!r.ok) { aviso.textContent = r.error; $('acceso-password').focus(); return; }
        guardarToken(r.datos.token);
        aplicarPerfil(r.datos, true);
        if (pantallaPedida === 'denegada') return;   // esta página no es para su rol: ya va camino de Usuarios
        if (r.datos.debeCambiar) pedir('cambio'); else soltar();
      });
    });

    formCambio.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var aviso = $('acceso-cambio-error');
      aviso.textContent = '';
      if ($('acceso-nueva').value !== $('acceso-repite').value) { aviso.textContent = 'Las dos contraseñas nuevas no coinciden.'; return; }
      ocupado(formCambio, true);
      directa('cambiarPassword', [$('acceso-actual').value, $('acceso-nueva').value], function (r) {
        ocupado(formCambio, false);
        if (r.ok) { soltar(); return; }
        if (r.codigo === 'SESION') { guardarToken(''); pedir('login'); return; }
        aviso.textContent = r.error;
      });
    });

    // Los atajos de teclado de las páginas no deben reaccionar a lo que se escribe aquí.
    cierre.addEventListener('keydown', function (ev) { ev.stopPropagation(); });
    $('acceso-cerrada-reintentar').addEventListener('click', function () { window.location.reload(); });

    function cerrarSesion() {
      directa('cerrarSesion', [], function () { guardarToken(''); aplicarPerfil(null); pedir('login'); });
    }

    function verComo(rol) {
      window.llamar('verComo', [rol]).then(function (p) {
        aplicarPerfil(p, true);
        avisar(p.verComo ? 'Ahora ves la aplicación como la ve un usuario.' : 'Has vuelto a ver la aplicación como administrador.');
      }, function (err) { avisar(err.message); });
    }

    /** Lo que las pantallas pueden usar: Acceso.puede('administrador') para lo que dibujan ellas; Acceso.refrescar() vuelve a pedir el perfil (p. ej. tras cambiar el propio usuario). */
    window.Acceso = { cerrarSesion: cerrarSesion, puede: puede, refrescar: refrescarPerfil };

    // Menú de sesión de la barra de pestañas (ui/Pestanas); la página de la HC no tiene barra.
    document.addEventListener('DOMContentLoaded', function () {
      var aviso = leerAlmacen(CLAVE_AVISO);
      if (aviso) { guardarAlmacen(CLAVE_AVISO, ''); avisar(aviso); }
      var boton = $('sesionBoton');
      if (!boton) return;
      var lista = $('sesionLista');
      function abrir(si) {
        lista.hidden = !si;
        boton.setAttribute('aria-expanded', si ? 'true' : 'false');
        if (si) { var primero = lista.querySelector('button:not([hidden])'); if (primero) primero.focus(); }
      }
      boton.addEventListener('click', function () { abrir(lista.hidden); });
      lista.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { ev.stopPropagation(); abrir(false); boton.focus(); }
      });
      document.addEventListener('click', function (ev) { if (!lista.hidden && !ev.target.closest('.sesion-menu')) abrir(false); }, true);
      $('sesionSalir').addEventListener('click', function () { abrir(false); cerrarSesion(); });
      $('sesionVerUsuario').addEventListener('click', function () { abrir(false); verComo('usuario'); });
      $('sesionVolver').addEventListener('click', function () { verComo(''); });
      pintarSesion();
    });

    // Último perfil conocido: la barra se pinta ya; el servidor lo confirma o lo corrige en la primera llamada.
    try { aplicarPerfil(JSON.parse(leerAlmacen(CLAVE_PERFIL) || 'null')); } catch (err) { aplicarPerfil(null); }

    if (leerToken()) {
      cierre.hidden = true;
      refrescarPerfil();
    } else {
      esperando = true;
      document.addEventListener('DOMContentLoaded', function () { if (esperando) pedir('login'); });
    }
  })();
</script>
