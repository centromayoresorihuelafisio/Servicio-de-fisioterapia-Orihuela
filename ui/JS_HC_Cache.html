<!--
  ui/JS_HC_Cache.html - PRECARGA de las historias clínicas (HC) de los usuarios en estado ACTIVO y, justo después,
  de los usuarios EN ESPERA (segunda llamada, para que las activas lleguen antes), compartida por
  Usuarios y la Agenda (principal/Principal_Vista). Con ella, al pulsar "Historia" la ficha
  (historia/Panel_HC) se pinta al instante desde memoria, sin esperar al servidor.

  Se incluye con include('ui/JS_HC_Cache') con "!" (fuera de cualquier bloque de script), DESPUÉS de ui/JS_Valoraciones_Cache.
  Empieza a cargar sola cuando la pestaña tiene lo suyo (OrdenCarga, ui/JS_Carga_Compartida; obtenerHCsActivasWeb,
  historia/HC_Web.gs: una sola llamada que lee cada hoja una vez), para no competir con la carga de la propia página.
  Todo lo que tiene se guarda también para las demás pestañas (MemoriaPestanas, clave "hc"): al abrir la siguiente
  pestaña las HC están ya, cada una con su instante, y la lista se vuelve a leer por detrás.

  Cómo se mantiene al día:
    · Cada HC que se abre por el camino normal (usuario no activo, nuevo...) también se guarda aquí para la próxima vez.
    · Lo que se edita en la ficha (historia, tratamiento, episodios) se actualiza aquí al guardarse.
    · Si una entrada tiene más de FRESCO_MS, la ficha se abre igualmente al instante y se vuelve a pedir al servidor
      EN SEGUNDO PLANO para refrescar asistencia, valoraciones o cambios hechos desde otro sitio (lo decide Panel_HC).
    · Si guardas una valoración, las entradas se marcan como obsoletas (la asistencia/dolor se recalculan al abrir).
    · Al volver a la pestaña tras varios minutos, o si otra ventana cambia un usuario, se recarga todo en segundo plano.

  API:
    HCCache.obtener(id, idPaciente)   copia de la HC { ...respuesta de obtenerHCWeb, _obsoleta } o null si no está.
                                  Si hay `id` (ID HC) manda el id; si no, se busca por ID paciente.
    HCCache.guardar(resp)         guarda/actualiza una HC (respuesta de obtenerHCWeb, ya con los cambios locales).
    HCCache.invalidar(id)         borra una entrada (p. ej. si un guardado falló y ya no se sabe cómo está en la hoja).
    HCCache.recargar()            vuelve a leer todas las activas (y después las de espera) en segundo plano.
    HCCache.cambioDeUsuario()     avisar tras cambiar un estado o dar un alta: marca todo como obsoleto y recarga.
    HCCache.estado()              { entradas, cargada, cargando, cargandoEspera } (para depurar desde la consola).
-->
<script>
var HCCache = (function() {
  var RETRASO_PRECARGA = 1500;     // ms tras cargar la página antes de pedir las HC (sin ui/JS_Carga_Compartida)
  var FRESCO_MS = 60000;           // una entrada más vieja se abre igual, pero se refresca detrás
  var RECARGA_MS = 5 * 60000;      // al volver a la pestaña tras este tiempo se recarga todo
  var porId = {};                  // id HC -> { r: respuesta, t: instante en que se recibió/guardó }
  var idPorPaciente = {};          // ID paciente -> id HC (null si hubiera dos historias con el mismo ID paciente)
  var RETRASO_ESPERA = 1000;       // ms tras llegar las activas antes de pedir las de usuarios En espera
  var cargando = false, cargada = false, tUltimaCarga = 0, reintentado = false, cargandoEspera = false;
  var memoria = window.MemoriaPestanas || null;

  // Copia para la siguiente pestaña (se escribe un momento después; varios cambios seguidos, una sola vez).
  function recordar() {
    if (memoria) memoria.guardarLuego('hc', function() { return { d: { porId: porId, cargada: cargada, tUltimaCarga: tUltimaCarga }, t: tUltimaCarga || Date.now() }; });
  }

  function norm(x) { return String(x === null || x === undefined ? '' : x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase(); }
  function clonar(x) { return JSON.parse(JSON.stringify(x)); }

  function indexar(r, t) {
    if (!r || !r.success || !r.id) return;
    porId[r.id] = { r: clonar(r), t: t };
    var p = r.usuario && r.usuario.idPaciente;
    if (p) idPorPaciente[p] = (idPorPaciente[p] === undefined || idPorPaciente[p] === r.id) ? r.id : null;
  }

  function obtener(id, idPaciente) {
    var clave = id || null;
    if (!clave) clave = idPaciente ? idPorPaciente[idPaciente] : null;
    var e = clave ? porId[clave] : null;
    if (!e) return null;
    var c = clonar(e.r);
    c._obsoleta = (Date.now() - e.t) > FRESCO_MS;
    return c;
  }

  function guardar(r) { indexar(r, Date.now()); recordar(); }

  function invalidar(id) { if (id) { delete porId[id]; recordar(); } }

  function marcarObsoleto() { Object.keys(porId).forEach(function(k) { porId[k].t = 0; }); recordar(); }

  // Mete en la caché lo recibido. Lo que la ficha guardó mientras viajaba la respuesta es más nuevo: se respeta.
  function incorporar(res, inicio) {
    if (!res || !res.success || !res.items) return false;
    res.items.forEach(function(r) {
      var e = porId[r.id];
      if (e && e.t > inicio) return;
      indexar(r, Date.now());
    });
    return true;
  }

  function cargar() {
    if (cargando) return;
    if (document.hidden) { setTimeout(cargar, 4000); return; }     // pestaña en segundo plano: se espera
    cargando = true;
    var inicio = Date.now();
    llamar('obtenerHCsActivasWeb')
      .then(function(res) {
        cargando = false;
        if (!incorporar(res, inicio)) return;
        cargada = true; tUltimaCarga = Date.now();
        recordar();
        setTimeout(cargarEspera, RETRASO_ESPERA);   // después, las de usuarios En espera
      }, function() {
        cargando = false;
        if (!reintentado) { reintentado = true; setTimeout(cargar, 20000); }   // un único reintento; si no, se abrirá por el camino normal
      });
  }

  // Segunda tanda: usuarios En espera. Sin reintento: si falla, su ficha se abre por el camino normal.
  function cargarEspera() {
    if (cargandoEspera) return;
    if (document.hidden) { setTimeout(cargarEspera, 4000); return; }
    cargandoEspera = true;
    var inicio = Date.now();
    llamar('obtenerHCsActivasWeb', ['espera'])
      .then(function(res) {
        cargandoEspera = false;
        if (incorporar(res, inicio)) recordar();
      }, function() { cargandoEspera = false; });
  }

  // Al volver a la pestaña después de un rato, se refresca todo.
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && cargada && Date.now() - tUltimaCarga > RECARGA_MS) cargar();
  });
  // Otra ventana ha cambiado un usuario (estado, datos) o guardado valoraciones.
  window.addEventListener('storage', function(e) {
    if (e.key === 'pacienteActualizado') cargar();
    else if (e.key === 'valoracionesActualizadas') marcarObsoleto();
  });
  // Guardar o editar una valoración en esta ventana cambia los indicadores de la ficha.
  if (typeof ValoracionesCache !== 'undefined' && ValoracionesCache.alCambiar) ValoracionesCache.alCambiar(marcarObsoleto);

  // Se ha cambiado el estado de un usuario o dado un alta desde esta ventana: las HC se refrescan al abrirlas y se vuelve a leer la lista de activos.
  function cambioDeUsuario() { marcarObsoleto(); reintentado = false; cargar(); }

  // Lo que trajo otra pestaña se usa ya: cada HC conserva su instante, así que una vieja se abre igual y se refresca detrás.
  // Si otra pantalla cambió un usuario o una valoración después, todas se dan por viejas (se abren igual y se refrescan detrás).
  var copia = memoria && memoria.leer('hc');
  if (copia && copia.datos && copia.datos.porId) {
    var vieja = copia.despues('pacienteActualizado') || copia.despues('valoracionesActualizadas');
    Object.keys(copia.datos.porId).forEach(function(k) { var e = copia.datos.porId[k]; if (e && e.r) indexar(e.r, vieja ? 0 : (e.t || 0)); });
    cargada = !!copia.datos.cargada; tUltimaCarga = copia.datos.tUltimaCarga || 0;
  }

  // Precarga: después de lo principal de la pestaña (o unos segundos tras abrirse, sin ui/JS_Carga_Compartida).
  if (window.OrdenCarga) OrdenCarga.despues(cargar, 300);
  else {
    var programar = function() { setTimeout(cargar, RETRASO_PRECARGA); };
    if (document.readyState === 'complete') programar(); else window.addEventListener('load', programar);
  }

  return {
    obtener: obtener, guardar: guardar, invalidar: invalidar, recargar: cargar, cambioDeUsuario: cambioDeUsuario,
    estado: function() { return { entradas: Object.keys(porId).length, cargada: cargada, cargando: cargando, cargandoEspera: cargandoEspera }; }
  };
})();
</script>
