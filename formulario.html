<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>Registro de Pacientes</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6; /* Light gray background */
      padding: 1.25rem; /* p-5 */
    }
    form {
      background-color: #ffffff; /* bg-white */
      padding: 1.5rem; /* p-6 */
      border-radius: 0.75rem; /* rounded-xl */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-lg */
      display: grid;
      grid-template-columns: 1fr 1fr; /* Dos columnas para los campos */
      gap: 1rem; /* gap-4 */
      max-width: 700px; /* Para que no se estire demasiado en pantallas grandes */
      margin: 0 auto; /* Centrar el formulario */
    }
    .form-field {
      display: flex;
      flex-direction: column;
    }
    .form-field.full-width {
      grid-column: 1 / -1; /* Ocupa ambas columnas */
    }
    label {
      display: block;
      margin-bottom: 0.25rem; /* mb-1 */
      font-weight: 500; /* font-medium */
      color: #374151; /* text-gray-700 */
    }
    input[type="text"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.75rem; /* px-3 py-2 */
      border: 1px solid #d1d5db; /* border-gray-300 */
      border-radius: 0.375rem; /* rounded-md */
      box-sizing: border-box;
      margin-top: 0.25rem; /* mt-1 */
      font-size: 0.875rem; /* text-sm */
      color: #374151; /* text-gray-700 */
    }
    textarea {
      resize: vertical;
      min-height: 4rem; /* h-16 */
      grid-column: span 2; /* Observaciones ocupa ambas columnas */
    }
    /* Estilos para el nuevo messageBox */
    #messageBox {
      padding: 1rem;
      border-radius: 0.375rem;
      margin-top: 1rem;
      font-weight: 500;
      text-align: center;
      display: none; /* Oculto por defecto */
    }
    #messageBox.success {
      background-color: #d1fae5; /* green-100 */
      color: #065f46; /* green-800 */
      border: 1px solid #34d399; /* green-400 */
    }
    #messageBox.error {
      background-color: #fee2e2; /* red-100 */
      color: #991b1b; /* red-800 */
      border: 1px solid #ef4444; /* red-400 */
    }
    /* Estilos para las preguntas de gravedad */
    .gravedad-question {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .gravedad-question label {
      margin-bottom: 0;
    }
    .gravedad-question .radio-group {
      display: flex;
      gap: 1rem;
    }
    /* Estilos para el nuevo select múltiple */
    .multiselect-container {
      position: relative;
    }
    .multiselect-container .dropdown-toggle {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      cursor: pointer;
      background-color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .multiselect-container .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 10;
      border: 1px solid #d1d5db;
      background-color: #fff;
      border-radius: 0.375rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-height: 200px;
      overflow-y: auto;
      display: none; /* Oculto por defecto */
      margin-top: 0.25rem;
    }
    /* Clase para mostrar el menú */
    .multiselect-container .dropdown-menu.open {
      display: block;
    }
    .multiselect-container .dropdown-menu .item {
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .multiselect-container .dropdown-menu .item:hover {
      background-color: #f3f4f6;
    }
    .multiselect-container .dropdown-menu .item input[type="checkbox"] {
      margin-right: 0.5rem;
    }
    @media (max-width: 640px) { /* sm breakpoint en Tailwind */
      form {
        grid-template-columns: 1fr; /* Una sola columna en móviles */
      }
      textarea, button {
        grid-column: span 1; /* Ajuste para una columna */
      }
    }
  </style>
</head>
<body>

  <script>
    // Función para formatear el número de teléfono
    function formatPhoneNumber(input) {
      let value = input.value.replace(/\D/g, ''); // Eliminar todo lo que no sea dígito
      if (value.length > 9) {
        value = value.substring(0, 9); // Limitar a 9 dígitos para el formato español
      }

      // Aplicar formato XXX XX XX XX
      if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4');
      } else if (value.length > 4) {
        value = value.replace(/(\d{3})(\d{2})(\d{2})/, '$1 $2 $3');
      } else if (value.length > 2) {
        value = value.replace(/(\d{3})(\d{2})/, '$1 $2');
      }
      input.value = value;
    }

    // Función para limpiar acentos, signos y forzar mayúsculas en el Nombre
    function sanitizeNombre(input) {
      let value = input.value;
      
      // Convertir a mayúsculas
      value = value.toUpperCase();
      
      // Reemplazar acentos y diéresis comunes en español de forma manual para conservar la Ñ intacta
      value = value.replace(/[ÁÀÄÂ]/g, "A")
                   .replace(/[ÉÈËÊ]/g, "E")
                   .replace(/[ÍÌÏÎ]/g, "I")
                   .replace(/[ÓÒÖÔ]/g, "O")
                   .replace(/[ÚÙÜÛ]/g, "U")
                   .replace(/[ÝŸ]/g, "Y");
                   
      // Eliminar números, signos de puntuación y cualquier otro símbolo especial
      // Solo se permiten letras de la A a la Z, la Ñ española y espacios
      value = value.replace(/[^A-ZÑ ]/g, "");
      
      input.value = value;
    }

    // Código JavaScript para manejar la lógica de la evaluación de gravedad y los selects múltiples
    document.addEventListener('DOMContentLoaded', () => {
      // Formateo de teléfonos y fecha de inscripción
      const tel1Input = document.getElementById('telefono1');
      const tel2Input = document.getElementById('telefono2');
      if (tel1Input) tel1Input.addEventListener('input', () => formatPhoneNumber(tel1Input));
      if (tel2Input) tel2Input.addEventListener('input', () => formatPhoneNumber(tel2Input));

      // Asignación de formateo en tiempo real al Nombre
      const nombreInput = document.getElementById('nombre');
      if (nombreInput) {
        nombreInput.addEventListener('input', () => sanitizeNombre(nombreInput));
      }

      const fechaInscripcionInput = document.getElementById('fechaInscripcion');
      if (fechaInscripcionInput) {
        const hoy = new Date();
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');
        fechaInscripcionInput.value = `${yyyy}-${mm}-${dd}`;
      }
      
      const form = document.getElementById('formPaciente');
      const gravedadCalculadaDisplay = document.getElementById('gravedadCalculada');
      const gravedadQuestions = document.querySelectorAll('input[name^="gravedad_q"]');

      const SEVERITY_MAP = [
        { label: '🟢 Leve', minScore: 0, maxScore: 3, color: '#10B981' }, // emerald-500
        { label: '🟠 Moderado', minScore: 4, maxScore: 6, color: '#F97316' }, // orange-500
        { label: '🔴 Urgente', minScore: 7, maxScore: 9, color: '#EF4444' }  // red-500
      ];

      function updateCalculatedSeverity() {
        let totalScore = 0;
        let allAnswered = true;
        
        const questionGroups = document.querySelectorAll('.gravedad-question .radio-group');
        questionGroups.forEach(group => {
            const checkedRadio = group.querySelector('input:checked');
            if (!checkedRadio) {
                allAnswered = false;
            } else {
                totalScore += parseInt(checkedRadio.value, 10);
            }
        });

        if (allAnswered) {
          const matchedSeverity = SEVERITY_MAP.find(severity => 
            totalScore >= severity.minScore && totalScore <= severity.maxScore
          );
          
          if (matchedSeverity) {
            gravedadCalculadaDisplay.textContent = matchedSeverity.label;
            gravedadCalculadaDisplay.style.color = matchedSeverity.color;
          } else {
            gravedadCalculadaDisplay.textContent = 'Puntuación fuera de rango';
            gravedadCalculadaDisplay.style.color = '#4B5563'; // gray-600
          }
        } else {
          gravedadCalculadaDisplay.textContent = 'Completa la evaluación';
          gravedadCalculadaDisplay.style.color = '#4B5563'; // gray-600
        }
      }

      gravedadQuestions.forEach(input => {
        input.addEventListener('change', updateCalculatedSeverity);
      });
      
      updateCalculatedSeverity();

      // Lógica para los selects múltiples
      const multiselectToggles = document.querySelectorAll('.multiselect-container .dropdown-toggle');
      const multiselectMenus = document.querySelectorAll('.multiselect-container .dropdown-menu');
      
      multiselectToggles.forEach(toggle => {
          toggle.addEventListener('click', (e) => {
              e.stopPropagation();
              const menu = toggle.nextElementSibling;
              
              // Ocultar todos los otros menús antes de abrir el actual
              multiselectMenus.forEach(otherMenu => {
                  if (otherMenu !== menu) {
                      otherMenu.classList.remove('open');
                  }
              });

              // Alternar la visibilidad del menú actual
              menu.classList.toggle('open');
          });
      });

      multiselectMenus.forEach(menu => {
          const checkboxes = menu.querySelectorAll('input[type="checkbox"]');
          checkboxes.forEach(checkbox => {
              checkbox.addEventListener('change', () => {
                  const selectedLabels = Array.from(checkboxes)
                      .filter(cb => cb.checked)
                      .map(cb => cb.value);
                  const toggle = menu.previousElementSibling;
                  if (selectedLabels.length > 0) {
                      toggle.querySelector('span').textContent = selectedLabels.join(', ');
                  } else {
                      toggle.querySelector('span').textContent = toggle.dataset.placeholder;
                  }
              });
          });
      });

      // Cerrar los menús al hacer clic fuera
      document.addEventListener('click', (e) => {
          multiselectMenus.forEach(menu => {
              if (menu.classList.contains('open') && !menu.contains(e.target) && !menu.previousElementSibling.contains(e.target)) {
                  menu.classList.remove('open');
              }
          });
      });
    });
    
    /**
     * Envía los datos del formulario al script de Apps Script.
     * @param {Event} e El evento de envío del formulario.
     */
    function enviarFormulario(e) {
      e.preventDefault(); // Evita el envío predeterminado del formulario
      const form = document.getElementById('formPaciente');
      const submitButton = document.getElementById('submitButton');
      const messageBox = document.getElementById('messageBox');
      
      messageBox.textContent = '';
      messageBox.classList.remove('success', 'error');
      messageBox.style.display = 'none';
      
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      
      const gravedadCalculadaDisplay = document.getElementById('gravedadCalculada');
      const gravedadFinal = gravedadCalculadaDisplay.textContent.trim();
      
      if (gravedadFinal === "Completa la evaluación") {
          messageBox.textContent = 'Por favor, completa todas las preguntas de evaluación de gravedad.';
          messageBox.classList.add('error');
          messageBox.style.display = 'block';
          return;
      }

      // --- GESTIONAR LA SELECCIÓN MÚLTIPLE ---
      const formData = new FormData(form);
      const datos = {};
      
      for (const [key, value] of formData.entries()) {
          if (datos.hasOwnProperty(key)) {
              if (!Array.isArray(datos[key])) {
                  datos[key] = [datos[key]];
              }
              datos[key].push(value);
          } else {
              datos[key] = value;
          }
      }

      const gravedadKeys = ['gravedad_q1', 'gravedad_q2', 'gravedad_q3', 'gravedad_q4', 'gravedad_q5'];
      gravedadKeys.forEach(key => delete datos[key]);

      datos.Gravedad = gravedadFinal;
      
      console.log('Intentando enviar datos al servidor (objeto final):', datos);

      submitButton.disabled = true;
      submitButton.textContent = 'Guardando...';
      submitButton.classList.add('bg-gray-400', 'hover:bg-gray-400');
      submitButton.classList.remove('bg-green-600', 'hover:bg-green-700');

      if (typeof google !== 'undefined' && typeof google.script.run !== 'undefined') {
        google.script.run
          .withSuccessHandler(response => {
            messageBox.textContent = response.message;
            messageBox.style.display = 'block';

            if (response.success) {
              messageBox.classList.add('success');
              form.reset();
              const fechaInscripcionInput = document.getElementById('fechaInscripcion');
              if (fechaInscripcionInput) {
                const hoy = new Date();
                const yyyy = hoy.getFullYear();
                const mm = String(hoy.getMonth() + 1).padStart(2, '0');
                const dd = String(hoy.getDate()).padStart(2, '0');
                fechaInscripcionInput.value = `${yyyy}-${mm}-${dd}`;
              }
              setTimeout(function() {
                  google.script.host.close();
              }, 1000);
            } else {
              messageBox.classList.add('error');
            }
            
            submitButton.disabled = false;
            submitButton.textContent = 'Guardar Paciente';
            submitButton.classList.remove('bg-gray-400', 'hover:bg-gray-400');
            submitButton.classList.add('bg-green-600', 'hover:bg-green-700');
          })
          .withFailureHandler(err => {
            messageBox.textContent = 'Error al guardar el paciente: ' + err.message;
            messageBox.classList.add('error');
            messageBox.style.display = 'block';
            console.error('Error de google.script.run:', err);
            submitButton.disabled = false;
            submitButton.textContent = 'Guardar Paciente';
            submitButton.classList.remove('bg-gray-400', 'hover:bg-gray-400');
            submitButton.classList.add('bg-green-600', 'hover:bg-green-700');
          })
          .guardarPaciente(datos);
      } else {
        messageBox.textContent = "Error: La API de Apps Script (google.script.run) no está disponible. Asegúrate de que este formulario se abre desde tu hoja de cálculo de Google Sheets.";
        messageBox.classList.add('error');
        messageBox.style.display = 'block';
        console.error("google.script.run no está definido. Esto puede ocurrir si el HTML no se ejecuta en el entorno de Apps Script.");
        submitButton.disabled = false;
        submitButton.textContent = 'Guardar Paciente';
        submitButton.classList.remove('bg-gray-400', 'hover:bg-gray-400');
        submitButton.classList.add('bg-green-600', 'hover:bg-green-700');
      }
    }
  </script>
