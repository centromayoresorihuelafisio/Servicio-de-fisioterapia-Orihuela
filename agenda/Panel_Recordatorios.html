<!--
  agenda/Panel_Recordatorios.html
  Panel lateral de recordatorios de la Agenda Web: crear, editar, marcar como hecho y eliminar.
  Se incluye desde agenda/Web_Vista con <?!= include('agenda/Panel_Recordatorios'); ?>
  API: PanelRecordatorios.abrir(contenedor, { lista, hoy, nuevoFecha, editarId, confirmar, onActualizado, onCancelar })
    · lista          → recordatorios actuales [{ id, fecha, hora, tipo, texto, hecho }]
    · hoy()          → "yyyy-MM-dd" de hoy (la página ya tiene hoyISO)
    · nuevoFecha     → fecha con la que se abre el formulario ("yyyy-MM-dd", "" = sin fecha; por defecto hoy)
    · editarId       → abre directamente editando ese recordatorio
    · confirmar(msg) → promesa booleana para confirmar el borrado (mostrarConfirm de la página)
    · onActualizado(lista) → se llama tras cada cambio con la lista COMPLETA devuelta por el servidor
  Devuelve { haCambiado(), alEscape(), actualizar(lista), editar(id), nuevo(fecha) }.
  Servidor: agenda/Recordatorios.gs. Estilos acotados a .rcp; colores, esquinas y tiempos salen de ui/CSS_Global
  (botones .md-btn, campos .md-campo--compacto; el foco con teclado lo da la regla global).
  Las clases .rc-t-* (color por tipo) son globales: la página las usa también para las etiquetas de la agenda.
  --rc-c y --rc-bg no son una paleta propia: cada clase .rc-t-* las apunta al color de datos de su tipo (--md-data-*), y las
  etiquetas, puntos y chips del panel y de agenda/Web_Vista leen de ahí el color del tipo que tengan (decidido en V7).
-->
<style>
/* Color por tipo: lo usan el panel y las etiquetas de la agenda */
.rc-t-llamar  { --rc-c: var(--md-data-llamar);  --rc-bg: color-mix(in srgb, var(--md-data-llamar) 14%, transparent); }
.rc-t-reunion { --rc-c: var(--md-data-reunion); --rc-bg: color-mix(in srgb, var(--md-data-reunion) 15%, transparent); }
.rc-t-evento  { --rc-c: var(--md-data-evento);  --rc-bg: color-mix(in srgb, var(--md-data-evento) 15%, transparent); }
.rc-t-nota    { --rc-c: var(--md-data-nota);    --rc-bg: color-mix(in srgb, var(--md-data-nota) 20%, transparent); }
.rc-t-festivo { --rc-c: var(--md-data-festivo); --rc-bg: color-mix(in srgb, var(--md-data-festivo) 15%, transparent); }
.rcp-item.festivo .rcp-check { visibility: hidden; }

.rcp { display: flex; flex-direction: column; height: 100%; min-height: 0; font-family: var(--font); font-size: var(--fs-md); color: var(--md-on-surface); background: var(--md-surface); }
.rcp .material-symbols-outlined { font-size: 20px; }
.rcp-scroll { flex: 1; min-height: 0; overflow: auto; }

/* ── Formulario ── */
.rcp-form { display: flex; flex-direction: column; gap: .8rem; padding: 1rem 1.1rem 1.1rem; border-bottom: 1px solid var(--md-outline); }
.rcp-tipos { display: flex; flex-wrap: wrap; gap: .35rem; }
.rcp-tipo {
  display: inline-flex; align-items: center; gap: .3rem; box-sizing: border-box; height: 32px; padding: 0 .8rem 0 .55rem; border-radius: var(--md-shape-full); cursor: pointer;
  border: 1px solid var(--md-outline-strong); background: transparent; color: var(--md-on-surface-med);
  font-family: var(--font); font-size: var(--fs-sm); font-weight: 600;
  transition: background-color var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.rcp-tipo .material-symbols-outlined { font-size: 18px; color: var(--rc-c); }
.rcp-tipo:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
.rcp-tipo.activo { background: var(--rc-bg); border-color: var(--rc-c); color: var(--md-on-surface); }
.rcp-fila { display: grid; grid-template-columns: 1.3fr 1fr; gap: .75rem; }
.rcp-rapidas { display: flex; flex-wrap: wrap; gap: .35rem; }
.rcp-rapida {
  border: none; background: var(--md-surface-variant); color: var(--md-on-surface-med); border-radius: var(--md-shape-full); padding: .2rem .7rem;
  font-family: var(--font); font-size: var(--fs-xs); font-weight: 600; cursor: pointer;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.rcp-rapida:hover { background: var(--md-primary-light); color: var(--md-primary-dark); }
.rcp-acciones { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.rcp-msg { min-height: 1.1rem; font-size: var(--fs-xs); font-weight: 500; color: var(--md-success); }
.rcp-msg.error { color: var(--md-error); }

/* ── Listas ── */
.rcp-grupo-tit {
  display: flex; align-items: center; gap: .5rem; padding: .95rem 1.1rem .3rem;
  font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--md-on-surface-med);
}
.rcp-grupo-tit.atrasados { color: var(--md-error); }
.rcp-grupo-tit .n { background: var(--md-surface-variant); border-radius: var(--md-shape-full); padding: 0 .45rem; font-size: var(--fs-2xs); }
.rcp-item { display: flex; align-items: flex-start; gap: .35rem; padding: .4rem 1rem .4rem .55rem; border-left: 3px solid transparent; transition: background-color var(--dur-1) var(--ease); }
.rcp-item:hover { background: var(--md-surface-variant); }
.rcp-item.editando { background: var(--md-primary-light); border-left-color: var(--md-primary); }
.rcp-icono-btn {
  flex-shrink: 0; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; border-radius: 50%; color: var(--md-on-surface-low); cursor: pointer;
  transition: background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease), opacity var(--dur-1) var(--ease);
}
.rcp-icono-btn:hover { background: var(--md-primary-light); color: var(--md-primary-dark); }
.rcp-item.hecho .rcp-check { color: var(--md-success); }
.rcp-cuerpo { flex: 1; min-width: 0; padding-top: .25rem; cursor: pointer; }
.rcp-item-texto { font-size: var(--fs-md); line-height: 1.35; overflow-wrap: anywhere; }
.rcp-item.hecho .rcp-item-texto { color: var(--md-on-surface-low); text-decoration: line-through; }
.rcp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .25rem; font-size: var(--fs-xs); color: var(--md-on-surface-med); }
.rcp-item.atrasado .rcp-meta .cuando { color: var(--md-error); font-weight: 600; }
.rcp-tag { display: inline-flex; align-items: center; gap: .2rem; padding: 0 .55rem 0 .3rem; border-radius: var(--md-shape-full); background: var(--rc-bg); color: var(--md-on-surface); font-weight: 600; }
.rcp-tag .material-symbols-outlined { font-size: 14px; color: var(--rc-c); }
.rcp-borrar { opacity: 0; }
.rcp-item:hover .rcp-borrar, .rcp-borrar:focus-visible { opacity: 1; }
.rcp-borrar:hover { background: var(--md-error-bg); color: var(--md-error); }
@media (hover: none) { .rcp-borrar { opacity: 1; } }
.rcp-vacio { padding: 2.2rem 1.2rem; text-align: center; color: var(--md-on-surface-low); font-size: var(--fs-md); }
.rcp-hechos { margin-top: .4rem; border-top: 1px solid var(--md-outline); }
.rcp-hechos > summary { list-style: none; cursor: pointer; }
.rcp-hechos > summary::-webkit-details-marker { display: none; }
.rcp-hechos > summary .rcp-grupo-tit { padding-top: .8rem; }
</style>

<template id="tplPanelRecordatorios"><div class="rcp">
  <div class="rcp-scroll">
    <section class="rcp-form">
      <div class="rcp-tipos" role="group" aria-label="Tipo de recordatorio">
        <button title="Tipo: llamada" type="button" class="rcp-tipo rc-t-llamar"  data-tipo="Llamar"><span class="material-symbols-outlined">call</span>Llamar</button>
        <button title="Tipo: reunión" type="button" class="rcp-tipo rc-t-reunion" data-tipo="Reunión"><span class="material-symbols-outlined">groups</span>Reunión</button>
        <button title="Tipo: evento" type="button" class="rcp-tipo rc-t-evento"  data-tipo="Evento"><span class="material-symbols-outlined">event</span>Evento</button>
        <button title="Tipo: nota" type="button" class="rcp-tipo rc-t-nota"    data-tipo="Nota"><span class="material-symbols-outlined">sticky_note_2</span>Nota</button>
        <button title="Tipo: festivo" type="button" class="rcp-tipo rc-t-festivo" data-tipo="Festivo"><span class="material-symbols-outlined">flag</span>Festivo</button>
      </div>
      <div class="md-campo md-campo--compacto"><input type="text" class="md-campo__control rcp-texto" placeholder="¿Qué quieres recordar?" maxlength="200" autocomplete="off" aria-label="Texto del recordatorio"></div>
      <div class="rcp-fila">
        <label class="md-campo md-campo--compacto rcp-campo"><input type="date" class="md-campo__control rcp-fecha"><span class="md-campo__etiqueta">Fecha</span></label>
        <label class="md-campo md-campo--compacto rcp-campo"><input type="time" class="md-campo__control rcp-hora"><span class="md-campo__etiqueta">Hora (opcional)</span></label>
      </div>
      <div class="rcp-rapidas">
        <button title="Fecha: hoy" type="button" class="rcp-rapida" data-rapida="hoy">Hoy</button>
        <button title="Fecha: mañana" type="button" class="rcp-rapida" data-rapida="manana">Mañana</button>
        <button title="Fecha: dentro de una semana" type="button" class="rcp-rapida" data-rapida="semana">En una semana</button>
        <button title="Dejar sin fecha" type="button" class="rcp-rapida" data-rapida="sin">Sin fecha</button>
      </div>
      <div class="rcp-acciones">
        <button title="Dejar de editar este recordatorio" type="button" class="md-btn md-btn--text rcp-cancelar" hidden>Cancelar edición</button>
        <button title="Guardar el recordatorio" type="button" class="md-btn md-btn--tonal rcp-guardar"><span class="material-symbols-outlined">add</span><span class="rcp-guardar-txt">Añadir recordatorio</span></button>
      </div>
      <div class="rcp-msg" role="status" aria-live="polite"></div>
    </section>
    <div class="rcp-listas"></div>
  </div>
</div></template>

<script>
window.PanelRecordatorios = {
  TIPOS: {
    'Llamar':  { icono: 'call',          clase: 'llamar' },
    'Reunión': { icono: 'groups',        clase: 'reunion' },
    'Evento':  { icono: 'event',         clase: 'evento' },
    'Nota':    { icono: 'sticky_note_2', clase: 'nota' },
    'Festivo': { icono: 'flag',          clase: 'festivo' }
  },

  // "Hoy", "Mañana", "Ayer" o "Mié 7 oct". Vacío → "Sin fecha".
  etiquetaFecha: function (iso, hoy) {
    if (!iso) return 'Sin fecha';
    function d(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
    if (iso === hoy) return 'Hoy';
    var dif = hoy ? Math.round((d(iso) - d(hoy)) / 86400000) : null;
    if (dif === 1) return 'Mañana';
    if (dif === -1) return 'Ayer';
    var t = d(iso).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '').replace(',', '');
    return t.charAt(0).toUpperCase() + t.slice(1);
  },

  abrir: function (host, opts) {
    opts = opts || {};
    host.innerHTML = '';
    host.appendChild(document.getElementById('tplPanelRecordatorios').content.cloneNode(true));
    var rcp = host.querySelector('.rcp');
    function q(sel) { return rcp.querySelector(sel); }

    var TIPOS = window.PanelRecordatorios.TIPOS;
    var etiquetaFecha = window.PanelRecordatorios.etiquetaFecha;
    var lista = (opts.lista || []).slice();
    var tipoSel = 'Nota', editandoId = null, firmaInicial = '', timerMsg = null, hechosAbierto = false;

    var inTexto = q('.rcp-texto'), inFecha = q('.rcp-fecha'), inHora = q('.rcp-hora');
    var btnGuardar = q('.rcp-guardar'), txtGuardar = q('.rcp-guardar-txt'), btnCancelar = q('.rcp-cancelar');
    var msg = q('.rcp-msg'), cont = q('.rcp-listas');

    function hoy() { return opts.hoy ? opts.hoy() : ''; }
    function esc(t) {
      return (t === null || t === undefined ? '' : String(t)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function sumarDias(iso, n) {
      var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2] + n);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
    function firma() { return [inTexto.value.trim(), inFecha.value, inHora.value, tipoSel].join('|'); }

    function mostrarMsg(texto, error) {
      msg.textContent = texto || '';
      msg.classList.toggle('error', !!error);
      if (timerMsg) clearTimeout(timerMsg);
      if (texto && !error) timerMsg = setTimeout(function () { msg.textContent = ''; }, 3500);
    }

    function fijarTipo(t) {
      tipoSel = TIPOS[t] ? t : 'Nota';
      rcp.querySelectorAll('.rcp-tipo').forEach(function (b) { b.classList.toggle('activo', b.dataset.tipo === tipoSel); });
    }

    // Formulario en blanco (conserva el tipo elegido). `fecha` undefined → hoy; '' → sin fecha.
    function nuevo(fecha) {
      editandoId = null;
      inTexto.value = ''; inHora.value = '';
      inFecha.value = fecha === undefined ? hoy() : fecha;
      txtGuardar.textContent = 'Añadir recordatorio';
      btnGuardar.querySelector('.material-symbols-outlined').textContent = 'add';
      btnCancelar.hidden = true;
      firmaInicial = firma();
      renderListas();
      inTexto.focus();
    }

    function editar(id) {
      var r = lista.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      editandoId = id;
      fijarTipo(r.tipo);
      inTexto.value = r.texto; inFecha.value = r.fecha || ''; inHora.value = r.hora || '';
      txtGuardar.textContent = 'Guardar cambios';
      btnGuardar.querySelector('.material-symbols-outlined').textContent = 'check';
      btnCancelar.hidden = false;
      firmaInicial = firma();
      q('.rcp-scroll').scrollTop = 0;
      renderListas();
      inTexto.focus();
    }

    // ── Servidor ──
    function llamar(fn, args, alExito, alFallar) {
      btnGuardar.disabled = true;
      var run = google.script.run
        .withSuccessHandler(function (res) {
          btnGuardar.disabled = false;
          if (!res || !res.success) { if (alFallar) alFallar(); mostrarMsg((res && res.message) || 'No se pudo completar la acción.', true); return; }
          lista = res.recordatorios || [];
          renderListas();
          if (opts.onActualizado) opts.onActualizado(lista);
          if (alExito) alExito(res);
        })
        .withFailureHandler(function (err) {
          btnGuardar.disabled = false;
          if (alFallar) alFallar();
          mostrarMsg('Error: ' + (err && err.message ? err.message : err), true);
        });
      run[fn].apply(run, args);
    }

    function guardar() {
      var texto = inTexto.value.trim();
      if (!texto) { mostrarMsg('Escribe qué quieres recordar.', true); inTexto.focus(); return; }
      var eraEdicion = !!editandoId;
      llamar('guardarRecordatorioWeb', [{ id: editandoId || '', texto: texto, tipo: tipoSel, fecha: inFecha.value, hora: inHora.value }], function () {
        var fechaMantener = inFecha.value;
        nuevo(eraEdicion ? hoy() : fechaMantener);   // al añadir se conserva la fecha para encadenar varios
        mostrarMsg(eraEdicion ? 'Cambios guardados.' : 'Recordatorio añadido.', false);
      });
    }

    // El check responde al instante; si el servidor falla se deshace.
    function alternar(id) {
      var r = lista.filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      var nuevoValor = !r.hecho;
      r.hecho = nuevoValor;
      renderListas();
      llamar('alternarRecordatorioWeb', [id, nuevoValor], null, function () { r.hecho = !nuevoValor; renderListas(); });
    }

    async function borrar(id) {
      var ok = opts.confirmar ? await opts.confirmar('¿Eliminar este recordatorio?') : true;
      if (!ok) return;
      llamar('eliminarRecordatorioWeb', [id], function () { if (editandoId === id) nuevo(); else renderListas(); });
    }

    // ── Listas ──
    function cmp(a, b) {
      var fa = a.fecha || '9999-99-99', fb = b.fecha || '9999-99-99';
      if (fa !== fb) return fa < fb ? -1 : 1;
      return a.hora < b.hora ? -1 : (a.hora > b.hora ? 1 : 0);
    }

    function itemHtml(r, h, modo) {      // modo: 'hoy' (solo hora) | 'fecha' (fecha y hora) | 'sin' (nada)
      var t = TIPOS[r.tipo] || TIPOS.Nota, cuando = [];
      if (modo === 'fecha') cuando.push(etiquetaFecha(r.fecha, h));
      if (r.hora && modo !== 'sin') cuando.push(r.hora);
      var atrasado = !r.hecho && r.fecha && r.fecha < h;
      return '<div class="rcp-item' + (r.tipo === 'Festivo' ? ' festivo' : '') + (r.hecho ? ' hecho' : '') + (atrasado ? ' atrasado' : '') + (r.id === editandoId ? ' editando' : '') + '" data-id="' + esc(r.id) + '">' +
        '<button type="button" class="rcp-icono-btn rcp-check" data-act="hecho" title="' + (r.hecho ? 'Marcar como pendiente' : 'Marcar como hecho') + '">' +
          '<span class="material-symbols-outlined">' + (r.hecho ? 'check_circle' : 'radio_button_unchecked') + '</span></button>' +
        '<div class="rcp-cuerpo" data-act="editar" title="Editar">' +
          '<div class="rcp-item-texto">' + esc(r.texto) + '</div>' +
          '<div class="rcp-meta"><span class="rcp-tag rc-t-' + t.clase + '"><span class="material-symbols-outlined">' + t.icono + '</span>' + esc(r.tipo) + '</span>' +
            (cuando.length ? '<span class="cuando">' + esc(cuando.join(' · ')) + '</span>' : '') + '</div>' +
        '</div>' +
        '<button type="button" class="rcp-icono-btn rcp-borrar" data-act="borrar" title="Eliminar"><span class="material-symbols-outlined">delete</span></button>' +
      '</div>';
    }

    function grupoHtml(titulo, clase, items, h, modo) {
      if (!items.length) return '';
      return '<div class="rcp-grupo-tit ' + clase + '">' + titulo + '<span class="n">' + items.length + '</span></div>' +
        items.map(function (r) { return itemHtml(r, h, modo); }).join('');
    }

    function renderListas() {
      var h = hoy();
      var pend = lista.filter(function (r) { return !r.hecho && r.tipo !== 'Festivo'; }).sort(cmp);
      var festivos = lista.filter(function (r) { return r.tipo === 'Festivo' && (!r.fecha || r.fecha >= h); }).sort(cmp);
      var hechos = lista.filter(function (r) { return r.hecho && r.tipo !== 'Festivo'; }).sort(cmp).reverse().slice(0, 30);
      var html =
        grupoHtml('Atrasados', 'atrasados', pend.filter(function (r) { return r.fecha && r.fecha < h; }), h, 'fecha') +
        grupoHtml('Hoy', '', pend.filter(function (r) { return r.fecha === h; }), h, 'hoy') +
        grupoHtml('Próximos', '', pend.filter(function (r) { return r.fecha > h; }), h, 'fecha') +
        grupoHtml('Sin fecha', '', pend.filter(function (r) { return !r.fecha; }), h, 'sin') +
        grupoHtml('Festivos', '', festivos, h, 'fecha');
      if (!pend.length && !festivos.length) html += '<div class="rcp-vacio">No tienes recordatorios pendientes.</div>';
      if (hechos.length) {
        html += '<details class="rcp-hechos"' + (hechosAbierto ? ' open' : '') + '><summary><div class="rcp-grupo-tit">Hechos<span class="n">' + hechos.length + '</span></div></summary>' +
          hechos.map(function (r) { return itemHtml(r, h, 'fecha'); }).join('') + '</details>';
      }
      cont.innerHTML = html;
    }

    // ── Eventos ──
    rcp.querySelectorAll('.rcp-tipo').forEach(function (b) { b.addEventListener('click', function () { fijarTipo(b.dataset.tipo); inTexto.focus(); }); });
    rcp.querySelectorAll('.rcp-rapida').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.rapida;
        inFecha.value = k === 'hoy' ? hoy() : k === 'manana' ? sumarDias(hoy(), 1) : k === 'semana' ? sumarDias(hoy(), 7) : '';
        if (k === 'sin') inHora.value = '';
      });
    });
    inTexto.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); guardar(); } });
    btnGuardar.addEventListener('click', guardar);
    btnCancelar.addEventListener('click', function () { nuevo(); });
    cont.addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('rcp-hechos')) hechosAbierto = e.target.open; }, true);
    cont.addEventListener('click', function (e) {
      var it = e.target.closest('.rcp-item');
      if (!it) return;
      var id = it.dataset.id;
      if (e.target.closest('[data-act="hecho"]')) alternar(id);
      else if (e.target.closest('[data-act="borrar"]')) borrar(id);
      else if (e.target.closest('[data-act="editar"]')) editar(id);
    });

    fijarTipo('Nota');
    if (opts.editarId) editar(opts.editarId); else nuevo(opts.nuevoFecha);

    return {
      haCambiado: function () { return inTexto.value.trim() !== '' && firma() !== firmaInicial; },
      alEscape: function () { if (editandoId) { nuevo(); return true; } return false; },
      actualizar: function (l) {
        lista = (l || []).slice();
        if (editandoId && !lista.some(function (r) { return r.id === editandoId; })) nuevo(); else renderListas();
      },
      editar: editar,
      nuevo: nuevo
    };
  }
};
</script>
