      Pestaña Configuración (?page=configuracion), solo para el administrador (CONTEXTO.md, 17.10, fase 4).

    <script>
      <?!= include_('ui/JS_Modal_Deshacer'); ?>

      /** Lo común de las secciones de Configuración. */
      var Cf = (function () {
        function $(id) { return document.getElementById(id); }

        /** Crea un elemento con clase y texto (el texto nunca se interpreta como HTML). */
        function el(etiqueta, clase, texto) {
          var e = document.createElement(etiqueta);
          if (clase) e.className = clase;
          if (texto !== undefined && texto !== null) e.textContent = texto;
          return e;
        }

        function icono(nombre) {
          var s = el('span', 'material-symbols-outlined', nombre);
          s.setAttribute('aria-hidden', 'true');
          return s;
        }

        function boton(clase, nombreIcono, texto, ayuda) {
          var b = el('button', 'md-btn ' + clase);
          b.type = 'button';
          if (nombreIcono) b.appendChild(icono(nombreIcono));
          b.appendChild(document.createTextNode(texto));
          if (ayuda) b.title = ayuda;
          return b;
        }

        function insignia(tono, texto) { return el('span', 'md-insignia' + (tono ? ' md-insignia--' + tono : ''), texto); }

        /** Aviso breve abajo (.toasts / .toast-aviso de ui/CSS_Global), con su icono según el tono. */
        function avisar(texto, tono) {
          var caja = document.querySelector('.toasts');
          if (!caja) { caja = el('div', 'toasts'); document.body.appendChild(caja); }
          var t = el('div', 'toast-aviso' + (tono === 'error' ? ' error' : ''));
          t.setAttribute('role', tono === 'error' ? 'alert' : 'status');
          var tonoFinal = tono || tonoAviso_(texto);
          if (tonoFinal) t.appendChild(iconoAviso_(tonoFinal));
          t.appendChild(document.createTextNode(texto));
          caja.appendChild(t);
          setTimeout(function () { t.classList.add('saliendo'); setTimeout(function () { t.remove(); }, 400); }, tono === 'error' ? 8000 : 5000);
        }

        function fallo(err) { avisar(err && err.message ? err.message : String(err), 'error'); }

        /** Pone un botón en espera mientras dura la promesa. */
        function esperar(b, promesa) {
          if (b) b.setAttribute('aria-busy', 'true');
          return promesa.then(function (r) { if (b) b.removeAttribute('aria-busy'); return r; },
            function (err) { if (b) b.removeAttribute('aria-busy'); throw err; });
        }

        /** Una sección carga sus datos la primera vez que se abre (y al abrir la página si ya está abierta). */
        function alAbrir(idSeccion, cargar) {
          var d = $(idSeccion), cargada = false;
          function mirar() { if (d.open && !cargada) { cargada = true; cargar(); } }
          d.addEventListener('toggle', mirar);
          document.addEventListener('DOMContentLoaded', mirar);
        }

        return { $: $, el: el, icono: icono, boton: boton, insignia: insignia, avisar: avisar, fallo: fallo, esperar: esperar, alAbrir: alAbrir,
          confirmar: mostrarConfirm, mensaje: mostrarAviso };
      })();
    </script>
