<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,300..700,0..1&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button, input, select { font-family: inherit; line-height: inherit; }

      <?!= include('ui/CSS_Global'); ?>
      <?!= include('ui/CSS_Ficha'); ?>

      /* Paleta propia de la Agenda: tonos Material 3 desaturados. Los rellenos
         de fila/día/turno son tintes translúcidos (rgba) que se apilan sobre
         un fondo blanco opaco, así las columnas fijas no dejan ver lo que hay
         debajo al desplazarse. */
      :root {
        --ag-accent:          #0b57d0;   /* primario: enlaces, foco, casillas */
        --ag-accent-hover:    #0949b0;
        --ag-accent-dark:     #004a77;   /* texto sobre contenedor tonal */
        --ag-container:       #c2e7ff;   /* botón primario y pestaña activa */
        --ag-container-hover: #a8d9f9;
        --ag-accent-soft:     rgba(194,231,255,.55);

        --ag-page:          #f8fafd;
        --ag-surface:       #ffffff;
        --ag-line:          #e3e8ef;
        --ag-text:          #1f2430;
        --ag-text-med:      #586074;
        --ag-text-low:      #8a93a6;

        --ag-tinte-par:     rgba(0,74,119,.075);
        --ag-tinte-hover:   rgba(0,120,212,.12);
        --ag-tinte-sel:     rgba(0,120,212,.22);
        --ag-tinte-dia:     rgba(0,74,119,.09);
        --ag-tinte-hoy:     rgba(0,120,212,.20);
        --ag-tinte-manana:  rgba(0,74,119,.04);
        --ag-tinte-tarde:   rgba(200,140,0,.10);
        --ag-day-bg:        #e9eef3;

        --ag-ok-bar:    #4c9f6a;
        --ag-mal-bar:   #d9706a;
        --ag-aviso-bar: #e3ad45;

        --ag-error:         #b3261e;
        --ag-error-bg:      #fdecea;
        --ag-warning-bg:    #fff4d6;
        --ag-warning-border:#f0c14b;
        --ag-warning-text:  #6d5320;
        --ag-warning-hover: #fdecc0;
        --ag-toast-bg:      #323232;
        --ag-toast-action:  #8ab4f8;
        --ag-overlay:       rgba(32,33,36,.5);
        --ag-t:             150ms ease;
        --alto-thead:       36px;
      }

      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--ag-page);
        color: var(--ag-text);
        display: flex;
        flex-direction: column;
        font-size: 14px;
        line-height: 1.5;
      }

      .btn-toolbar:focus-visible, .btn-fila:focus-visible, .btn-asis:focus-visible, .seg:focus-visible, .chip-filtro:focus-visible, .menu-item:focus-visible,
      nav.tabs-cambio a.tab-cambio:focus-visible, td a.link-hc:focus-visible {
        outline: 2px solid var(--ag-accent); outline-offset: 2px;
      }
      .toast-deshacer button:focus-visible { outline: 2px solid var(--ag-toast-action); outline-offset: 2px; }
      .buscador:focus-within, .selector-semana:focus-within { box-shadow: 0 0 0 2px var(--ag-accent); }

      /* ---------- Cabecera ---------- */
      header.top {
        background: var(--ag-surface);
        border-bottom: 1px solid var(--ag-line);
        padding: .6rem 1rem;
        flex-shrink: 0;
      }
      .barra { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; min-height: 40px; }
      .espaciador { flex: 1; }
      .contador { font-size: .8rem; color: var(--ag-text-med); white-space: nowrap; }

      .barra-seleccion { display: none; background: var(--ag-accent-soft); border-radius: 12px; padding: .3rem .6rem; }
      header.top.con-seleccion .barra-principal { display: none; }
      header.top.con-seleccion .barra-seleccion { display: flex; }
      .contador-seleccion { font-size: .85rem; font-weight: 600; color: var(--ag-accent-dark); margin-right: .25rem; }
      .separador { width: 1px; height: 22px; background: rgba(0,0,0,.15); margin: 0 .25rem; }

      /* ---------- Botones ---------- */
      .btn-toolbar {
        display: inline-flex; align-items: center; gap: .35rem;
        background: var(--ag-surface); border: 1px solid #cfd6e4; color: var(--ag-text);
        border-radius: 999px; padding: .4rem .9rem; font-size: .82rem; font-weight: 500;
        cursor: pointer; transition: all var(--ag-t); font-family: var(--font);
      }
      .btn-toolbar:hover { background: #eef2f9; }
      .btn-toolbar.primario { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .btn-toolbar.primario:hover { background: var(--ag-container-hover); border-color: var(--ag-container-hover); }
      .btn-toolbar.peligro { color: var(--ag-error); }
      .btn-toolbar.peligro:hover { background: var(--ag-error-bg); border-color: var(--ag-error); }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      .btn-toolbar .material-symbols-outlined { font-size: 18px; }
      .btn-toolbar.btn-nav { padding: .4rem .55rem; }
      .btn-toolbar.activo { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .btn-toolbar.deshacer { display: none; background: var(--ag-warning-bg); border-color: var(--ag-warning-border); color: var(--ag-warning-text); }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar.deshacer:hover { background: var(--ag-warning-hover); }
      .spin-icon { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .grupo-nav { display: inline-flex; }
      .grupo-nav .btn-toolbar { border-radius: 0; margin-left: -1px; position: relative; }
      .grupo-nav .btn-toolbar:first-child { border-radius: 999px 0 0 999px; margin-left: 0; }
      .grupo-nav .btn-toolbar:last-child { border-radius: 0 999px 999px 0; }
      .grupo-nav .btn-toolbar:hover, .grupo-nav .btn-toolbar:focus-visible { z-index: 1; }

      .etiqueta-semana {
        font-size: .82rem; font-weight: 600; color: var(--ag-accent-dark); white-space: nowrap;
        text-transform: capitalize; background: var(--ag-accent-soft); border-radius: 999px; padding: .3rem .85rem;
      }
      .selector-semana {
        display: flex; align-items: center; gap: .3rem;
        background: #eef1f7; border-radius: 999px; padding: .3rem .75rem;
      }
      .selector-semana .material-symbols-outlined { color: var(--ag-text-low); font-size: 18px; }
      .selector-semana input { border: none; outline: none; background: transparent; font-family: var(--font); font-size: .82rem; color: var(--ag-text); }

      .buscador {
        display: flex; align-items: center; gap: .4rem;
        background: #eef1f7; border-radius: 999px; padding: .4rem .85rem; flex: 0 1 320px; min-width: 200px;
      }
      .buscador input { border: none; outline: none; flex: 1; min-width: 0; font-size: .85rem; font-family: var(--font); background: transparent; color: var(--ag-text); }
      .buscador input::placeholder { color: var(--ag-text-low); }
      .buscador .material-symbols-outlined { color: var(--ag-text-low); font-size: 18px; }

      /* ---------- Toast de deshacer ---------- */
      .toast-deshacer {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: var(--ag-toast-bg); color: #fff; padding: .65rem 1rem; border-radius: 10px;
        display: flex; align-items: center; gap: 1rem; font-size: .82rem;
        box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200;
        opacity: 0; pointer-events: none; transition: opacity 200ms ease;
      }
      .toast-deshacer.visible { opacity: 1; pointer-events: auto; }
      .toast-deshacer button {
        background: none; border: none; color: var(--ag-toast-action); font-weight: 700; font-size: .82rem;
        cursor: pointer; font-family: var(--font); padding: 0; letter-spacing: .02em;
      }
      .toast-deshacer button:hover { text-decoration: underline; }

      /* ---------- Tabla ---------- */
      .tabla-wrap { flex: 1; overflow: auto; background: var(--ag-surface); }
      table {
        border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1180px;
        table-layout: fixed; font-variant-numeric: tabular-nums;
      }
      thead th {
        position: sticky; top: 0; background: #eef2f7; color: var(--ag-text-med);
        font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; text-align: left;
        height: var(--alto-thead); padding: 0 .8rem; border-bottom: 2px solid var(--ag-line);
        white-space: nowrap; z-index: 2;
      }
      /* Columnas 1 (casilla + Hora) y 2 (Usuario) fijas a la izquierda */
      thead th:nth-child(1), tbody td:nth-child(1) {
        position: sticky; left: 0; width: 92px; min-width: 92px; max-width: 92px;
        background-color: #eef2f7; z-index: 3; box-shadow: 1px 0 0 var(--ag-line);
      }
      tbody td:nth-child(1) { background-color: var(--ag-surface); z-index: 1; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        position: sticky; left: 92px; width: 320px; min-width: 320px; max-width: 320px;
        background-color: #eef2f7; z-index: 3; box-shadow: 1px 0 0 var(--ag-line);
      }
      tbody td:nth-child(2) { background-color: var(--ag-surface); z-index: 1; font-weight: 600; }
      thead th:nth-child(3), tbody td:nth-child(3) { width: 116px; }
      thead th:nth-child(4), tbody td:nth-child(4) { width: 70px; }
      thead th:nth-child(5), tbody td:nth-child(5) { width: 136px; }
      thead th:nth-child(6), tbody td:nth-child(6) { width: 120px; }

      /* Relleno de fila = fondo blanco opaco + tinte translúcido (--fila-tinte,
         que se define por fila y por estado: alterna, hover, seleccionada). */
      tbody td {
        background-color: var(--ag-surface);
        background-image: linear-gradient(var(--fila-tinte, transparent), var(--fila-tinte, transparent));
        padding: .6rem .8rem; border-bottom: 1px solid var(--ag-line);
        white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
      }
      /* Columna de la papelera: sin relleno lateral ni recorte. Con el relleno
         normal el botón (26px) no cabía en la columna y aparecían los "…". */
      thead th:nth-child(8), tbody td:nth-child(8) {
        width: 116px; padding: 0 .5rem; text-align: right; white-space: nowrap; overflow: visible; text-overflow: clip;
      }
      td.hora { font-weight: 700; font-size: .92rem; }
      td.vacio { color: var(--ag-text-low); font-style: italic; }
      td a.link-hc { color: var(--ag-accent); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: .2rem; }
      td a.link-hc:hover { text-decoration: underline; }
      .ic-15 { font-size: 15px; }

      tbody tr.fila-par { --fila-tinte: var(--ag-tinte-par); }
      tbody tr.fila-cita { cursor: pointer; }
      tbody tr.fila-cita:not(.seleccionada):hover { --fila-tinte: var(--ag-tinte-hover); }
      tbody tr.seleccionada { --fila-tinte: var(--ag-tinte-sel); }

      /* Barra de color de asistencia en el borde izquierdo */
      tbody tr.asist-ok td:nth-child(1)    { box-shadow: inset 4px 0 0 var(--ag-ok-bar),    1px 0 0 var(--ag-line); }
      tbody tr.asist-mal td:nth-child(1)   { box-shadow: inset 4px 0 0 var(--ag-mal-bar),   1px 0 0 var(--ag-line); }
      tbody tr.asist-aviso td:nth-child(1) { box-shadow: inset 4px 0 0 var(--ag-aviso-bar), 1px 0 0 var(--ag-line); }

      /* Casilla de selección */
      .hora-celda { display: inline-flex; align-items: center; gap: .55rem; }
      .chk {
        width: 16px; height: 16px; flex-shrink: 0; position: relative;
        border: 1.5px solid var(--ag-text-low); border-radius: 4px;
        background: var(--ag-surface); transition: all var(--ag-t);
      }
      .chk.oculto { visibility: hidden; }
      tbody tr.fila-cita:hover .chk { border-color: var(--ag-accent); }
      tbody tr.seleccionada .chk { background: var(--ag-accent); border-color: var(--ag-accent); }
      tbody tr.seleccionada .chk::after {
        content: ''; position: absolute; left: 4px; top: 0; width: 4px; height: 8px;
        border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
      }

      /* Cabecera de día: banda tonal, fijada bajo el encabezado de columnas */
      tbody tr.fila-dia td {
        position: sticky !important; top: calc(var(--alto-thead) - 1px); left: 0; z-index: 2;
        width: auto !important; min-width: 0 !important; max-width: none !important;
        background-color: var(--ag-surface) !important;
        background-image: linear-gradient(var(--ag-tinte-dia), var(--ag-tinte-dia)) !important;
        color: var(--ag-text); font-weight: 700; font-size: .88rem; text-transform: capitalize;
        padding: .6rem .9rem; border-bottom: 1px solid var(--ag-line); white-space: normal; box-shadow: none !important;
      }
      tbody tr.fila-dia.hoy td {
        background-image: linear-gradient(var(--ag-tinte-hoy), var(--ag-tinte-hoy)) !important;
        color: var(--ag-accent-dark); box-shadow: inset 4px 0 0 var(--ag-accent) !important;
      }
      .dia-cab { display: flex; align-items: center; gap: .7rem; }
      .dia-hoy {
        background: rgba(255,255,255,.75); color: var(--ag-accent-dark); border-radius: 999px;
        padding: .05rem .65rem; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      }
      .dia-stats { margin-left: auto; font-size: .76rem; font-weight: 500; color: var(--ag-text-med); text-transform: none; }

      /* Etiqueta de turno */
      tbody tr.fila-turno td {
        position: static !important; width: auto !important; min-width: 0 !important; max-width: none !important;
        font-weight: 700; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
        padding: .3rem .9rem; border-bottom: 1px solid var(--ag-line); box-shadow: none !important;
      }
      tbody tr.fila-turno.manana td {
        background-image: linear-gradient(var(--ag-tinte-manana), var(--ag-tinte-manana)) !important; color: var(--ag-text-med);
      }
      tbody tr.fila-turno.tarde td {
        background-image: linear-gradient(var(--ag-tinte-tarde), var(--ag-tinte-tarde)) !important; color: var(--ag-warning-text);
      }

      /* Hueco libre */
      tbody tr.fila-hueco td { color: var(--ag-text-low); }
      td.hueco-libre { cursor: pointer; }
      .chip-asignar {
        display: inline-flex; align-items: center; gap: .1rem;
        border: 1px dashed var(--ag-accent); color: var(--ag-accent); border-radius: 999px;
        padding: .02rem .7rem .02rem .35rem; font-size: .74rem; font-weight: 600; font-style: normal;
        transition: all var(--ag-t);
      }
      .chip-asignar .material-symbols-outlined { font-size: 14px; }
      td.hueco-libre:hover .chip-asignar { background: var(--ag-accent); border-style: solid; color: #fff; }

      /* Chips de asistencia */
      .chip {
        display: inline-flex; align-items: center; gap: .35rem; max-width: 100%;
        padding: .15rem .7rem; border-radius: 999px;
        font-size: .76rem; font-weight: 600; font-style: normal; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
      .chip-ok { background: rgba(30,142,62,.15); color: #1b6a33; }
      .chip-mal { background: rgba(217,48,37,.13); color: #a52f29; }
      .chip-aviso { background: rgba(240,165,0,.20); color: #7a5200; }
      .chip-neutro { background: rgba(88,96,116,.14); color: #4a5265; }

      td.celda-notas { white-space: normal; max-width: none; }
      .notas-clamp {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; word-break: break-word; line-height: 1.35;
      }

      /* Edición en línea */
      td.editable { cursor: pointer; }
      td.editable:hover { --fila-tinte: var(--ag-tinte-hover); }
      td.editando, div.editando { padding: .25rem .4rem; overflow: visible; position: relative; }
      .estado-guardado {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        font-size: .8rem; font-weight: 700; pointer-events: none;
      }
      .estado-guardado.progreso { color: var(--ag-text-low); font-weight: 400; }
      .estado-guardado.ok { color: var(--ag-ok-bar); }
      .estado-guardado.fallo { color: var(--ag-mal-bar); }
      .estado-guardado .material-symbols-outlined { font-size: 16px; vertical-align: middle; }
      .input-celda {
        width: 100%; font-family: var(--font); font-size: .85rem; color: var(--ag-text);
        border: 1px solid var(--ag-accent); border-radius: 6px; padding: .25rem .4rem;
        background: var(--ag-surface); outline: none;
      }
      .estado-vacio { text-align: center; color: var(--ag-text-med); padding: 3rem 1rem; font-size: .9rem; }

      /* Esqueleto de carga */
      .esqueleto { background: var(--ag-surface); }
      .esq-dia { height: 36px; background: var(--ag-day-bg); }
      .esq-fila { display: flex; align-items: center; gap: 1.5rem; padding: .85rem 1rem; border-bottom: 1px solid var(--ag-line); }
      .esq-barra {
        display: block; height: 12px; border-radius: 6px;
        background: linear-gradient(90deg, #eef1f7 25%, #e0e5ee 50%, #eef1f7 75%);
        background-size: 200% 100%; animation: destello 1.3s linear infinite;
      }
      .esq-flex { flex: 1; }
      @keyframes destello { from { background-position: 200% 0; } to { background-position: -200% 0; } }

      /* ---------- Modal propio ---------- */
      .modal-overlay {
        display: none; position: fixed; inset: 0; background: var(--ag-overlay);
        align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
      }
      .modal-overlay.visible { display: flex; }
      .modal-box {
        background: var(--ag-surface); border-radius: 14px; padding: 1.25rem 1.5rem;
        max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.25);
      }
      .modal-mensaje { font-size: .88rem; color: var(--ag-text); white-space: pre-line; line-height: 1.45; margin-bottom: 1.15rem; }
      .modal-botones { display: flex; justify-content: flex-end; gap: .5rem; }

      /* Pestañas Agenda / Usuarios / Valoraciones (enlaces con recarga,
         porque las Web Apps de Apps Script no se pueden embeber en iframe) */
      nav.tabs-cambio {
        display: flex; gap: .25rem; flex-shrink: 0;
        background: var(--ag-page); padding: .5rem .75rem 0;
        border-bottom: 1px solid var(--ag-line);
      }
      nav.tabs-cambio a.tab-cambio {
        display: inline-flex; align-items: center; gap: .35rem;
        background: transparent; color: var(--ag-accent-dark); text-decoration: none;
        font-family: var(--font); font-weight: 600; font-size: .82rem;
        padding: .5rem 1rem; border-radius: 8px 8px 0 0; transition: all var(--ag-t);
      }
      nav.tabs-cambio a.tab-cambio:hover { background: rgba(0,74,119,.05); }
      nav.tabs-cambio a.tab-cambio.activo { background: var(--ag-container); color: var(--ag-accent-dark); cursor: default; }
      nav.tabs-cambio a.tab-cambio .material-symbols-outlined { font-size: 18px; }

      /* ===== Barra secundaria: vista, filtros rápidos, densidad ===== */
      .barra-filtros { margin-top: .5rem; min-height: 32px; }
      .segmentado { display: inline-flex; background: #eef1f7; border-radius: 999px; padding: 2px; }
      .seg {
        border: none; background: transparent; padding: .25rem .9rem; border-radius: 999px;
        font-size: .8rem; font-weight: 600; color: var(--ag-text-med); cursor: pointer;
        font-family: var(--font); transition: all var(--ag-t);
      }
      .seg.activo { background: var(--ag-container); color: var(--ag-accent-dark); }
      .chip-filtro {
        display: inline-flex; align-items: center; gap: .35rem; border: 1px solid #cfd6e4;
        background: var(--ag-surface); color: var(--ag-text-med); border-radius: 999px;
        padding: .22rem .75rem; font-size: .78rem; font-weight: 600; cursor: pointer;
        font-family: var(--font); transition: all var(--ag-t);
      }
      .chip-filtro:hover { background: #eef2f9; }
      .chip-filtro.activo { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .chip-filtro .cnt { font-size: .7rem; background: rgba(0,74,119,.09); border-radius: 999px; padding: 0 .4rem; }

      /* ===== Menú desplegable (Copiar) ===== */
      .menu-wrap { position: relative; display: inline-block; }
      .menu {
        display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 250px;
        background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: 14px;
        padding: .35rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 1500;
      }
      .menu-wrap.abierto .menu { display: block; }
      .menu-item {
        display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; background: transparent;
        border: none; border-radius: 10px; padding: .5rem .7rem; font-size: .84rem; color: var(--ag-text);
        cursor: pointer; font-family: var(--font);
      }
      .menu-item:hover:not(:disabled) { background: var(--ag-accent-soft); }
      .menu-item:disabled { opacity: .45; cursor: not-allowed; }
      .menu-item small { display: block; color: var(--ag-text-med); font-size: .72rem; }

      /* ===== Banda de día: plegable + progreso ===== */
      tbody tr.fila-dia { cursor: pointer; }
      .dia-chevron { font-size: 20px; margin-left: -.3rem; opacity: .7; }
      .prog { width: 72px; height: 6px; border-radius: 999px; background: rgba(0,74,119,.12); overflow: hidden; flex-shrink: 0; }
      .prog > span { display: block; height: 100%; background: var(--ag-ok-bar); border-radius: 999px; }

      .badge-sesion.s1 { box-shadow: inset 0 0 0 1.5px var(--ag-accent); } /* primera sesión: mismo gris + anillo azul fino */
      /* Sesión: al pasar el ratón por el número aparece un − / + (como los botones de asistencia). La vista normal y la de − / + ocupan
         la misma casilla de la rejilla: el ancho no cambia al pasar el ratón y no hay parpadeo. */
      .ses-ctl { display: inline-grid; align-items: center; justify-items: center; }

      .ses-num { min-width: 1.1ch; text-align: center; font-size: .8rem; font-weight: 700; color: var(--ag-text-med); font-variant-numeric: tabular-nums; }
      .btn-ses { width: 20px; height: 20px; padding: 0; border: none; border-radius: 50%; background: transparent; color: var(--ag-text-med); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all var(--ag-t); }
      .btn-ses .material-symbols-outlined { font-size: 18px; }
      .btn-ses:hover:not(:disabled) { background: rgba(0,74,119,.16); color: var(--ag-accent); }
      .btn-ses:disabled { opacity: .35; cursor: default; }
      .ses-ctl:hover .ses-paso, .ses-ctl:focus-within .ses-paso { visibility: visible; }
      .ses-ctl:hover .ses-vista, .ses-ctl:focus-within .ses-vista { visibility: hidden; }
      @media (hover: none) { .ses-paso { visibility: visible; } .ses-vista { visibility: hidden; } }
      .ic-nota { font-size: 16px; vertical-align: -3px; margin-right: .3rem; color: var(--ag-text-low); }
      .btn-fila {
        display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;

        transition: all var(--ag-t);

        --ag-ctl:#262b33;--ag-ctl-border:#3a404b;--ag-ctl-hover:#2c323b;--ag-th:#232830;--ag-pill:rgba(0,0,0,.28);--ag-drop:#1f2b3d;

        --ag-tinte-hoy:rgba(138,180,248,.22);--ag-tinte-manana:rgba(138,180,248,.035);--ag-tinte-tarde:rgba(240,190,80,.10);--ag-day-bg:#232830;
        --ag-ok-bar:#5bb37d;--ag-mal-bar:#e57f78;--ag-aviso-bar:#e8b95a;--ag-error:#f2b8b5;--ag-error-bg:#3b1f1e;
        --ag-warning-bg:#3a3120;--ag-warning-border:#6b5a2a;--ag-warning-text:#f0d894;--ag-warning-hover:#4a3f26;--ag-toast-bg:#2d3038;--ag-overlay:rgba(0,0,0,.6);
        --ag-ctl:#262b33;--ag-ctl-border:#3a404b;--ag-ctl-hover:#2c323b;--ag-th:#232830;--ag-pill:rgba(0,0,0,.28);--ag-drop:#1f2b3d;

      .btn-toolbar, .chip-filtro { border-color: var(--ag-ctl-border); }

      @keyframes entra-toast { from { opacity: 0; transform: translateY(8px); } }

      .avatar { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
        font-size: .68rem; font-weight: 700; letter-spacing: .02em; background: hsl(var(--h) 55% var(--av-bg)); color: hsl(var(--h) 45% var(--av-fg)); }
      .celda-usuario, .tj-nombre { display: flex; align-items: center; gap: .55rem; min-width: 0; }
      .nombre-u { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tj-nombre .nombre-u { white-space: normal; }
      body.compacto .avatar { width: 20px; height: 20px; font-size: .6rem; }

      .ocup { display: flex; width: 96px; height: 8px; border-radius: 999px; overflow: hidden; background: var(--ag-line); flex-shrink: 0; }
      .ocup > span { display: block; height: 100%; }
      .ocup .o-reg { background: var(--ag-ok-bar); } .ocup .o-cita { background: var(--ag-accent); }

      .ghost-dest { color: var(--ag-accent-dark); font-weight: 700; font-size: .78rem; border-left: 1px solid var(--ag-line); padding-left: .55rem; }
      .tabla-wrap.desplazado thead th:nth-child(2), .tabla-wrap.desplazado tbody tr:not(.fila-dia):not(.fila-turno):not(.fila-ahora) td:nth-child(2) { box-shadow: 8px 0 10px -8px rgba(0,0,0,.35); }
      tr.saliendo-fila td, .tarjeta.saliendo-fila, .cal-cita.saliendo-fila { opacity: 0; transition: opacity .25s; }
      .tarjeta.saliendo-fila { transform: scale(.97); }
      tr.recien td, .tarjeta.recien, .cal-cita.recien { animation: flash-mov 1.2s ease-out; }
      @keyframes flash-mov { from { box-shadow: inset 0 0 0 999px rgba(11,87,208,.28); } to { box-shadow: inset 0 0 0 999px rgba(11,87,208,0); } }

      .cal { display: grid; min-width: 760px; background: var(--ag-surface); }
      .cal-cab { position: sticky; top: 0; z-index: 4; background: var(--ag-th); border-bottom: 1px solid var(--ag-line); padding: .6rem; text-align: center;
        font-size: .78rem; font-weight: 700; text-transform: capitalize; color: var(--ag-text-med); }
      .cal-cab.hoy { background: var(--ag-container); color: var(--ag-accent-dark); }
      .cal-esq { left: 0; z-index: 5; }
      .cal-hora { position: sticky; left: 0; z-index: 3; background: var(--ag-surface); border-bottom: 1px solid var(--ag-line); padding: .5rem; text-align: right;
        font-size: .74rem; font-weight: 700; color: var(--ag-text-med); font-variant-numeric: tabular-nums; }
      .cal-celda { border-bottom: 1px solid var(--ag-line); border-left: 1px solid var(--ag-line); padding: 4px; min-height: 50px; display: flex; }
      .cal-celda.hoy { background-image: linear-gradient(var(--ag-tinte-hoy), var(--ag-tinte-hoy)); background-blend-mode: normal; }
      .cal-celda.vacia { background: repeating-linear-gradient(45deg, transparent 0 6px, var(--ag-tinte-manana) 6px 7px); }
      .cal-cita { flex: 1; min-width: 0; display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem; border-radius: 10px; border: 1px solid var(--ag-line);
        border-left: 4px solid var(--ag-line); background: var(--ag-surface); font-size: .8rem; font-weight: 600; cursor: pointer; transition: box-shadow var(--ag-t); }
      .cal-cita:hover { box-shadow: 0 2px 8px rgba(0,74,119,.18); }
      .cal-cita.asist-ok { border-left-color: var(--ag-ok-bar); } .cal-cita.asist-mal { border-left-color: var(--ag-mal-bar); } .cal-cita.asist-aviso { border-left-color: var(--ag-aviso-bar); }
      .cal-cita.en-curso { border-color: var(--ag-accent); box-shadow: 0 0 0 1px var(--ag-accent); }
      .cal-cita.proxima { border-color: var(--ag-container-hover); }
      .cal-cita.pasada { opacity: .6; }
      .cal-cita.seleccionada { background-image: linear-gradient(var(--ag-tinte-sel), var(--ag-tinte-sel)); }
      .cal-cita.atenuada { opacity: .25; }
      .cal-cita.arrastrando { opacity: .4; }
      .cal-hueco { flex: 1; display: flex; align-items: center; justify-content: center; border: 1px dashed transparent; border-radius: 10px; color: var(--ag-text-low); cursor: pointer; opacity: 0; transition: all var(--ag-t); }
      .cal-celda:hover .cal-hueco, body.arrastrando-cita .cal-hueco { opacity: 1; border-color: var(--ag-accent); color: var(--ag-accent); }
      body.arrastrando-cita .cal-hueco { background: var(--ag-drop); }
      .cal-hueco.destino-drop, .cal-cita.destino-drop { background: var(--ag-container) !important; box-shadow: 0 0 0 2px var(--ag-accent); }
      thead th.th-notas { width: auto; }
      thead th:last-child, tbody td.acciones-fila { width: 176px; padding: 0 .5rem; text-align: right; white-space: nowrap; overflow: visible; text-overflow: clip; }
      .btn-fila.con-hc { color: var(--ag-accent); }
      .btn-fila.sin-hc .material-symbols-outlined { opacity: .35; }

      /* ---------- Panel lateral (formulario de Valoración): misma estructura que la ficha de Usuarios ---------- */
      .ficha { position: fixed; top: 0; right: 0; bottom: 0; width: var(--ficha-w, 400px); max-width: 100%; z-index: 900; display: flex; flex-direction: column; background: var(--md-surface);
        border-left: 1px solid var(--md-outline); box-shadow: -6px 0 24px rgba(0,0,0,.08); transform: translateX(100%); visibility: hidden; transition: transform 160ms cubic-bezier(.2,0,0,1), visibility 0s 160ms; will-change: transform; }
      .ficha.abierta { transform: none; visibility: visible; transition-delay: 0s; }
      .ficha-form-cab { flex: none; display: flex; align-items: center; gap: .5rem; padding: .7rem .8rem .7rem 1.1rem; border-bottom: 1px solid var(--md-outline); }
      .ficha-form-cab button { border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; color: var(--md-on-surface-med); display: inline-flex; align-items: center; justify-content: center; }
      .ficha-form-cab button:hover { background: var(--md-surface-variant); }
      .ficha-form-cab button:focus-visible { outline: 2px solid var(--ag-accent); outline-offset: 2px; }
      .ficha-form-tit { flex: 1; min-width: 0; font-size: .95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ficha-form-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ficha-form-cuerpo > * { flex: 1 1 auto; min-height: 0; }
      @media (min-width: 900px) {
        /* El panel se desliza con transform y el contenido se ajusta al instante (sin animar el margen). */
        body.con-ficha:not(.ficha-hc) nav.tabs-cambio, body.con-ficha:not(.ficha-hc) header.top, body.con-ficha:not(.ficha-hc) .tabla-wrap { margin-right: var(--ficha-w, 400px); }
      }

      /* ===== Panel lateral ancho («Dar cita») ===== */
      @media (min-width: 1200px) { body.ficha-ancha { --ficha-w: 520px; } }
      /* Historia clínica: cajón muy ancho que se superpone a la agenda (no la desplaza) */
      body.ficha-hc { --ficha-w: min(1120px, 96vw); }
      body.ficha-hc .ficha { box-shadow: -10px 0 40px rgba(0,0,0,.18); }

      /* ===== Asistencia: siempre con botones (el activo queda resaltado) ===== */
      .asis-rapida { display: inline-flex; align-items: center; gap: .1rem; }
      .btn-asis { opacity: .5; }
      .btn-asis:hover, .btn-asis.activo { opacity: 1; }
      /* Estado activo = etiqueta con texto (los demás botones siguen siempre visibles) */
      .btn-asis.activo:not(.btn-asis-lg) {
        width: auto; padding: 0 .6rem 0 .3rem; border-radius: 999px; gap: .2rem;
        font-size: .76rem; font-weight: 600; font-family: var(--font); white-space: nowrap;
      }
      .btn-asis.activo:not(.btn-asis-lg) .material-symbols-outlined { font-size: 18px; }
      .btn-asis.activo.ok    { background: rgba(30,142,62,.18);  color: var(--chip-ok); }
      .btn-asis.activo.mal   { background: rgba(217,48,37,.15);  color: var(--chip-mal); }
      .btn-asis.activo.aviso { background: rgba(240,165,0,.24);  color: var(--chip-aviso); }
      .btn-asis.activo.neutro{ background: rgba(88,96,116,.18);  color: var(--chip-neutro); }
      .btn-asis.activo .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
      button.chip { border: none; cursor: pointer; font-family: var(--font); }
      thead th:nth-child(5), tbody td:nth-child(5) { width: 216px; }   /* Asistencia: etiqueta del estado + 3 botones */
      thead th:last-child, tbody td.acciones-fila { width: 200px; }

      /* ===== Cabecera aligerada ===== */
      .menu-der { left: auto; right: 0; }
      .btn-rec .badge-rec { min-width: 18px; height: 18px; padding: 0 .3rem; border-radius: 999px; background: var(--ag-accent); color: #fff; font-size: .68rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
      .btn-rec .badge-rec.atrasado { background: #d93025; }
      .btn-rec .badge-rec:empty { display: none; }
      .buscador { flex: 0 1 280px; min-width: 180px; }

      /* ===== Recordatorios en la agenda ===== */
      .rc-chips { display: inline-flex; align-items: center; gap: .3rem; min-width: 0; flex: 0 1 auto; overflow: hidden; }
      .rc-chip { display: inline-flex; align-items: center; gap: .2rem; max-width: 210px; border: none; cursor: pointer; padding: .05rem .55rem .05rem .3rem; border-radius: 999px;
        background: var(--rc-bg); color: var(--ag-text); font: 600 .72rem var(--font); text-transform: none; white-space: nowrap; flex-shrink: 0; }
      .rc-chip .material-symbols-outlined { font-size: 14px; color: var(--rc-c); }
      .rc-chip-txt { overflow: hidden; text-overflow: ellipsis; }
      .rc-chip:hover { filter: brightness(.94); }
      .rc-chips .rc-chip:last-child { flex-shrink: 1; }
      .rc-add { opacity: 0; width: 26px; height: 26px; }
      tr.fila-dia:hover .rc-add, .tj-cab:hover .rc-add, .cal-cab:hover .rc-add, .rc-add:focus-visible { opacity: 1; }
      @media (hover: none) { .rc-add { opacity: 1; } }
      .rc-puntos { display: inline-flex; align-items: center; gap: .25rem; margin-left: .4rem; vertical-align: middle; }
      .rc-punto { width: 10px; height: 10px; padding: 0; border: none; border-radius: 50%; background: var(--rc-c); cursor: pointer; }
      .cal-cab .rc-add { width: 22px; height: 22px; }

      /* ===== Vista Hoy: mañana y tarde lado a lado ===== */
      /* Tamaño por defecto = cómodo. ajustarHoy() solo lo encoge (tj-medio, y si aún no cabe tj-denso) cuando
         la vista desborda en alto; si sobra sitio, las tarjetas se quedan grandes. */
      .tj-turnos { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 1.5rem; padding: .4rem 1.25rem 1.5rem; --tj-min: 290px; }
      .tj-col { flex: var(--n, 1) 1 320px; min-width: 0; }
      .tj-turno-titulo { margin: 1rem 0 .65rem; }
      .tj-grid { grid-template-columns: repeat(auto-fill, minmax(var(--tj-min), 1fr)); gap: .85rem; }
      .tarjeta { position: relative; padding: .95rem 1.1rem 1rem; gap: .6rem; border-radius: 18px; }
      .tj-top { gap: .5rem; min-height: 34px; }
      .tj-hora { font-size: 1.4rem; }
      .tj-nombre { font-size: 1rem; }
      .tj-nombre .nombre-u { white-space: normal; }
      .tj-asis { min-height: 34px; }
      .tj-asis .asis-rapida { gap: .3rem; }
      .tj-tel { font-size: .82rem; color: var(--ag-text-med); white-space: nowrap; }
      .tj-notas { padding: .35rem .5rem; min-height: 2.3rem; font-size: .84rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: break-word; }
      .tj-notas.editando { overflow: visible; display: block; }
      .tj-acciones { position: absolute; top: .55rem; right: .6rem; z-index: 2; background: var(--ag-surface); border-radius: 999px; box-shadow: 0 1px 6px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity var(--ag-t); }
      .tarjeta:hover .tj-acciones, .tarjeta:focus-within .tj-acciones { opacity: 1; pointer-events: auto; }
      .tarjeta .btn-fila { width: 30px; height: 30px; opacity: 1; }
      @media (hover: none) { .tj-acciones { position: static; opacity: 1; pointer-events: auto; box-shadow: none; } }

      /* Nivel medio: cuando el cómodo no cabe en alto */
      .tj-medio .tj-turnos { --tj-min: 250px; padding-top: .2rem; padding-bottom: .8rem; }
      .tj-medio .tj-grid { gap: .6rem; }
      .tj-medio .tarjeta { padding: .6rem .8rem .65rem; gap: .35rem; border-radius: 15px; }
      .tj-medio .tj-top { min-height: 28px; }
      .tj-medio .tj-hora { font-size: 1.15rem; }
      .tj-medio .tj-nombre { font-size: .9rem; }
      .tj-medio .tj-nombre .nombre-u { white-space: nowrap; }
      .tj-medio .tj-asis { min-height: 28px; }
      .tj-medio .tj-asis .btn-asis { width: 28px; height: 28px; }
      .tj-medio .tj-asis .btn-asis .material-symbols-outlined { font-size: 21px; }
      .tj-medio .tj-notas { min-height: 1.7rem; padding: .15rem .4rem; font-size: .8rem; display: block; white-space: nowrap; text-overflow: ellipsis; }
      .tj-medio .tj-turno-titulo { margin: .6rem 0 .4rem; }
      .tj-medio .tarjeta .btn-fila { width: 26px; height: 26px; }

      /* Nivel denso: último recurso */
      .tj-denso .tj-turnos { --tj-min: 210px; padding-bottom: .4rem; }
      .tj-denso .tj-grid { gap: .45rem; }
      .tj-denso .tarjeta { padding: .38rem .6rem .42rem; gap: .15rem; border-radius: 13px; }
      .tj-denso .tj-top, .tj-denso .tj-asis { min-height: 24px; }
      .tj-denso .tj-hora { font-size: 1rem; }
      .tj-denso .tj-nombre { font-size: .84rem; }
      .tj-denso .tj-asis .btn-asis { width: 24px; height: 24px; }
      .tj-denso .tj-asis .btn-asis .material-symbols-outlined { font-size: 19px; }
      .tj-denso .tj-notas { min-height: 1.2rem; padding-top: 0; padding-bottom: 0; font-size: .76rem; }
      .tj-denso .tj-turno-titulo { margin: .35rem 0 .25rem; }
      /* ===== Línea de cita: sin cabeceras de hoja ===== */
      :root { --alto-thead: 1px; }
      .tabla-wrap table { min-width: 1180px; }
      tbody tr.fila-cita td { padding-top: .65rem; padding-bottom: .65rem; }
      .badge-sesion.etq { height: 22px; padding: 0 .65rem; font-size: .74rem; font-weight: 600; white-space: nowrap; }
      /* Asistencia: solo el chip del estado; las demás opciones aparecen al pasar el ratón */
      tbody tr.fila-cita .btn-asis:not(.activo) { display: none; }
      tbody tr.fila-cita:hover .btn-asis:not(.activo), tbody tr.fila-cita.seleccionada .btn-asis:not(.activo) { display: inline-flex; }
      @media (hover: none) { tbody tr.fila-cita .btn-asis:not(.activo) { display: inline-flex; } }
      /* Notas: icono (relleno si hay nota; el texto sale en el tooltip) */
      td.celda-notas { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; padding: 0 .6rem; }
      .ic-nota-btn { font-size: 20px; color: var(--ag-text-low); opacity: 0; transition: opacity var(--ag-t); vertical-align: middle; }
      tbody tr.fila-cita:hover .ic-nota-btn { opacity: .6; }
      td.celda-notas.con-nota .ic-nota-btn { color: var(--ag-accent); opacity: 1; font-variation-settings: 'FILL' 1; }
      td.celda-notas.editando .input-celda { position: static; transform: none; width: 100%; box-shadow: none; }
      /* ===== Pulido visual: filas limpias, jerarquía hora/paciente, huecos discretos ===== */
      tbody tr.fila-par { --fila-tinte: transparent; }
      tbody tr.fila-turno td, tbody tr.fila-turno.manana td, tbody tr.fila-turno.tarde td {
        background-image: none !important; border-bottom: none; padding: .9rem .9rem .25rem; font-size: .66rem; color: var(--ag-text-low);
      }
      td.hora { font-weight: 500; font-size: .88rem; color: var(--ag-text-med); }
      tbody td:nth-child(2) { font-weight: 500; }
      body:not(.compacto) .celda-usuario .avatar { width: 32px; height: 32px; font-size: .76rem; }
      body:not(.compacto) .celda-usuario { gap: .75rem; }
      tbody tr.asist-ok td:nth-child(1), tbody tr.asist-mal td:nth-child(1), tbody tr.asist-aviso td:nth-child(1) { box-shadow: 1px 0 0 var(--ag-line); }
      tbody tr.asist-ok td:nth-child(1)::before, tbody tr.asist-mal td:nth-child(1)::before, tbody tr.asist-aviso td:nth-child(1)::before {
        content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
      }
      tbody tr.asist-ok td:nth-child(1)::before    { background: var(--ag-ok-bar); }
      tbody tr.asist-mal td:nth-child(1)::before   { background: var(--ag-mal-bar); }
      tbody tr.asist-aviso td:nth-child(1)::before { background: var(--ag-aviso-bar); }
      tbody tr.fila-hueco td { padding-top: .35rem; padding-bottom: .35rem; }
      tbody tr.fila-hueco .chip-asignar { opacity: 0; border-color: transparent; transition: opacity var(--ag-t); }
      tbody tr.fila-hueco:hover .chip-asignar, body.arrastrando-cita tbody tr.fila-hueco .chip-asignar { opacity: 1; border-color: var(--ag-accent); }
      @media (hover: none) { tbody tr.fila-hueco .chip-asignar { opacity: 1; border-color: var(--ag-accent); } }
      /* Hora sin recorte (casilla + asa + hora) */
      tbody tr:not(.fila-dia):not(.fila-turno):not(.fila-ahora) td:nth-child(1) { width: 144px; min-width: 144px; max-width: 144px; }
      tbody tr:not(.fila-dia):not(.fila-turno):not(.fila-ahora) td:nth-child(2) { left: 144px; }

      /* Ficha de usuario (panel lateral) */
      .celda-usuario[data-ficha-fila], .tj-nombre[data-ficha-fila] { cursor: pointer; }
      .celda-usuario[data-ficha-fila]:hover .nombre-u, .tj-nombre[data-ficha-fila]:hover .nombre-u { text-decoration: underline; text-underline-offset: 3px; }
      /* ===== Barra de aplicación (pestañas) y barra superior ===== */
      body { font-variant-numeric: tabular-nums; }
      nav.tabs-cambio { background: var(--ag-surface); padding: .35rem .75rem; gap: .2rem; }
      nav.tabs-cambio a.tab-cambio { border-radius: 999px; padding: .35rem .95rem; }
      header.top { padding: .5rem 1rem; }
      .buscador { flex: 0 1 240px; min-width: 160px; }
      .btn-rec { position: relative; }
      .btn-rec .badge-rec { position: absolute; top: -6px; right: -6px; color: var(--ag-surface); }
      .btn-rec .badge-rec.atrasado { color: #fff; }
      .btn-nav.con-opcion { position: relative; }
      .btn-nav.con-opcion::after { content: ''; position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--ag-accent); }
      .menu { border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
      .menu-item.activo { background: var(--ag-accent-soft); color: var(--ag-accent-dark); }

      /* ===== Cabecera de día editorial ===== */
      tbody tr.fila-dia td, tbody tr.fila-dia.hoy td {
        background-image: none !important; box-shadow: none !important; color: var(--ag-text);
        padding: 1.1rem .9rem .55rem; border-bottom: 1px solid var(--ag-line); font-size: .88rem;
      }
      .dia-cab { gap: .75rem; }
      .dia-num { display: inline-flex; align-items: center; justify-content: center; width: 2.3rem; height: 2.3rem; border-radius: 50%; flex-shrink: 0;
        font-size: 1.3rem; font-weight: 500; }
      tbody tr.fila-dia.hoy .dia-num, .tj-cab .dia-num { background: var(--ag-accent); color: var(--ag-surface); font-size: 1.1rem; font-weight: 600; }
      .dia-txt { display: flex; flex-direction: column; line-height: 1.2; }
      .dia-txt b { font-size: .95rem; font-weight: 600; text-transform: capitalize; }
      .dia-txt small { font-size: .72rem; font-weight: 500; color: var(--ag-text-med); text-transform: capitalize; }
      .dia-hoy { background: var(--ag-accent-soft); }
      .dia-stats { background: none; padding: 0; color: var(--ag-text-low); font-size: .76rem; }

      /* ===== Tema oscuro: texto sobre el color de acento y líneas ===== */
      tbody td { border-bottom-color: color-mix(in srgb, var(--ag-line) 60%, transparent); }
      .ahora-linea span, .tag-t.ahora { color: var(--ag-surface); }
      tbody tr.seleccionada .chk::after { border-color: var(--ag-surface); }
      td.hueco-libre:hover .chip-asignar { color: var(--ag-surface); }
      /* ===== Notas con texto (Semana) ===== */
      .celda-notas .ic-nota-btn { margin-right: .45rem; }
      .nota-txt { font-size: .84rem; color: var(--ag-text-med); vertical-align: middle; }
      .nota-txt.vacia { color: var(--ag-text-low); font-style: italic; opacity: 0; transition: opacity var(--ag-t); }
      tbody tr.fila-cita:hover .nota-txt.vacia { opacity: .85; }

      /* ===== Vista Hoy alineada con Semana ===== */
      .tj-cab { background-image: none; color: var(--ag-text); padding: 1rem 1.25rem .6rem; font-weight: 400; font-size: .88rem; text-transform: none; }
      .tj-turno-titulo, .tj-turno-titulo.tarde { color: var(--ag-text-low); font-size: .66rem; }
      .tarjeta, .cal-cita { position: relative; border-left-width: 1px !important; }

      .ocup { width: 96px; height: 4px; opacity: 0; transition: opacity var(--ag-t); background: color-mix(in srgb, var(--ag-line) 60%, transparent); }

        color: var(--ag-warning-text); background: color-mix(in srgb, var(--ag-aviso-bar) 16%, transparent); transition: background var(--ag-t); }

      /* Pantalla táctil: no hay hover, así que queda solo la línea tenue (sin barra) */

    <script>
      // Hora ("HH:mm") a partir de la cual una cita es "de tarde".
      var HORA_CORTE_TARDE = '14:00';

      var filasSeleccionadas = new Set();

      // Columnas de Sheets que no se muestran (normalizadas: sin mayúsculas ni acentos).
      var COLUMNAS_OCULTAS = ['fecha', 'dia', 'id evento calendar', 'historia clinica', 'telefono'];

      var HEADERS = [];
      var HEADERS_VISIBLES = [];
      var CITAS = [];
      var COL_HISTORIA = null;
      var semanaActual = null; // lunes de la semana mostrada, "yyyy-MM-dd"
      var mostrarHuecos = false;
      var OPCIONES_ASISTENCIA = [];
      var vista = 'semana';            // 'semana' (tabla) | 'hoy' (tarjetas del día de hoy)
      var filtrosActivos = new Set();  // 'sinAsistencia' | 'sinHC' | 'conNotas'
      var filtroDiaSinAsis = null;     // fecha ISO si el filtro «sin asistencia» se limita a un solo día (chip del resumen del día)
      var RECORDATORIOS = [];            // recordatorios genéricos (agenda/Recordatorios.gs)
      var plegadoManual = {};          // fechaISO -> true/false: días plegados o desplegados a mano
      var DURACION_CITA_MIN = 30;      // para marcar "Ahora" y atenuar las citas ya terminadas

      // Color del chip según el texto de Asistencia. Se evalúa EN ORDEN y gana
      // la primera coincidencia: primero las negativas ("No asistió", "Falta"),
      // después "pendiente" (gris), después avisos (ámbar) y por último las
      // positivas (verde). Lo que no encaje sale en gris neutro.
      var ESTILOS_ASISTENCIA = [
        { clase: 'mal',    patron: /^no\b|^sin asist|falt|ausen|plant|no (vino|asist|acud|se present)/ },
        { clase: 'neutro', patron: /pendient|por confirmar|sin confirmar|sin registrar/ },
        { clase: 'aviso',  patron: /cancel|anul|aplaz|recuper|justific|retras/ },
        { clase: 'ok',     patron: /asist|vino|presente|realiz|acudi|^si$|^ok$/ }
      ];

      function estiloAsistencia(valor) {
        var v = normalizar(valor);
        if (!v) return '';
        for (var i = 0; i < ESTILOS_ASISTENCIA.length; i++) {
          if (ESTILOS_ASISTENCIA[i].patron.test(v)) return ESTILOS_ASISTENCIA[i].clase;
        }
        return 'neutro';
      }

      function htmlEsqueleto() {
        var nombres = [150, 190, 130, 170, 160];
        function barra(w, r) { return '<span class="esq-barra" style="width:' + w + 'px' + (r ? ';border-radius:' + r : '') + '"></span>'; }
        function dia() { return '<div class="esq-dia2"><span class="esq-barra esq-circ"></span><span class="esq-col">' + barra(80) + barra(54) + '</span><span class="esq-flex"></span>' + barra(190) + '</div>'; }
        function filas(n, o) {
          var h = '';
          for (var i = 0; i < n; i++) h += '<div class="esq-fila2">' + barra(46) + '<span class="esq-barra esq-circ sm"></span>' + barra(nombres[(i + o) % nombres.length]) +
            '<span class="esq-flex"></span>' + barra(76, '999px') + barra(98, '999px') + '</div>';
          return h;
        }
        return '<div class="esqueleto" aria-busy="true" aria-label="Cargando agenda">' + dia() + '<div class="esq-turno"></div>' + filas(5, 0) +
          dia() + '<div class="esq-turno"></div>' + filas(4, 2) + '</div>';
      }

      // ---------- Carga de datos ----------
      // `silencioso`: refrescos en segundo plano (sin esqueleto y SIN mover el
      // scroll). Una carga no silenciosa (primera carga, Hoy, flechas, selector
      // de fecha) deja la vista centrada en el día de hoy si está en la semana.
      function cargar(fechaISO, silencioso) {
        var irAHoy = !silencioso;
        if (!silencioso) {
          document.getElementById('tablaWrap').innerHTML = htmlEsqueleto();
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            HEADERS = res.headers || [];
            HEADERS_VISIBLES = HEADERS.filter(function(h) { return COLUMNAS_OCULTAS.indexOf(normalizar(h)) === -1; });
            CITAS = res.citas || [];
            OPCIONES_ASISTENCIA = res.opcionesAsistencia || [];
            COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });

            if (res.semana) {
              semanaActual = res.semana.lunes;
              document.getElementById('etiquetaSemana').textContent = res.semana.etiqueta;
              document.getElementById('inputSemana').value = res.semana.lunes;
            }
            render();
            if (irAHoy) scrollAHoy();
          })
          .withFailureHandler(mostrarError)
          .obtenerAgendaSemanaWeb(fechaISO || null);
      }

      // Coloca la cabecera del día de hoy justo bajo el encabezado de columnas,
      // para no tener que hacer scroll hacia abajo un viernes. Si hoy no está
      // en la semana mostrada, vuelve arriba.
      function scrollAHoy() {
        var wrap = document.getElementById('tablaWrap');
        var filaHoy = wrap.querySelector('tr.fila-dia.hoy');
        if (!filaHoy) { wrap.scrollTop = 0; return; }
        var thead = wrap.querySelector('thead');
        var alto = thead ? thead.offsetHeight : 0;
        var destino = filaHoy.getBoundingClientRect().top - wrap.getBoundingClientRect().top - alto + wrap.scrollTop;
        wrap.scrollTop = Math.max(0, destino);
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio"><span class="estado-icono-wrap error"><span class="material-symbols-outlined estado-icono">cloud_off</span></span>' +
          '<div class="estado-titulo">No se pudo cargar la agenda</div><div class="estado-texto">' + escapar(err && err.message ? err.message : err) + '</div>' +
          '<button title="Volver a cargar la agenda" type="button" class="btn-toolbar" data-vacio="reintentar"><span class="material-symbols-outlined">refresh</span> Reintentar</button></div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }

      // Escapado completo (& < > " '). Sirve tanto para texto como para
      // valores de atributo: antes solo se escapaba "<", y una comilla doble
      // en una nota cortaba el value="..." del campo de edición.
      function escapar(txt) {
        return (txt === null || txt === undefined ? '' : txt + '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      var CAMPOS_EDITABLES = ['Notas', 'Sesión'];

      // ---------- Utilidades de fecha/hora y estado ----------
      function vacioTxt(v) { return v === '' || v === null || v === undefined; }
      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function ahoraHHmm() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

      function finCita(hora) {
        var m = /^(\d{1,2}):(\d{2})$/.exec(hora || '');
        if (!m) return '';
        var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + DURACION_CITA_MIN;
        return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
      }

      // '' | 'pasada' (ya terminó) | 'en-curso'. Solo tiene sentido para citas de hoy.
      function estadoTemporal(hora, ahora) {
        var fin = finCita(hora);
        if (!fin) return '';
        if (fin <= ahora) return 'pasada';
        if (hora <= ahora) return 'en-curso';
        return '';
      }

      function filaProxima(hoy, ahora) {
        return CITAS.find(function(c) { return c._fechaISO === hoy && !c._hueco && (c['Hora'] || '') > ahora; }) || null;
      }

      function sumarDiasISO(iso, n) {
        var p = iso.split('-').map(Number);
        return formatoISO(new Date(p[0], p[1] - 1, p[2] + n));
      }

      function semanaContieneHoy() {
        if (!semanaActual) return false;
        var h = hoyISO();
        return h >= semanaActual && h <= sumarDiasISO(semanaActual, 6);
      }

      // Días pasados de la semana actual: plegados por defecto (en semanas
      // pasadas o futuras se muestra todo). Lo que el usuario pliega o
      // despliega a mano manda sobre el valor por defecto.
      var imprimiendo = false;   // al imprimir se despliegan todos los días
      function diaPlegado(fechaISO) {
        if (imprimiendo) return false;
        if (Object.prototype.hasOwnProperty.call(plegadoManual, fechaISO)) return plegadoManual[fechaISO];
        return semanaContieneHoy() && fechaISO < hoyISO();
      }

      function hayBusqueda() {
        return normalizar(document.getElementById('inputBusqueda').value) !== '' || filtrosActivos.size > 0;
      }

      function calcularTotalesDia() {
        var tot = {};
        CITAS.forEach(function(c) {
          var t = tot[c._fechaISO] || (tot[c._fechaISO] = { citas: 0, libres: 0, registradas: 0 });
          if (c._hueco) t.libres++;
          else { t.citas++; if (!vacioTxt(c['Asistencia'])) t.registradas++; }
        });
        return tot;
      }

      // ---------- Filtros rápidos ----------
      function cumpleFiltro(c, filtro) {
        if (c._hueco) return false;
        if (filtro === 'sinAsistencia') return c._fechaISO <= hoyISO() && vacioTxt(c['Asistencia']);
        if (filtro === 'sinHC') return !!COL_HISTORIA && vacioTxt(c[COL_HISTORIA]);
        if (filtro === 'conNotas') return !vacioTxt(c['Notas']);
        return true;
      }

      function pasaFiltrosRapidos(c) {
        if (filtroDiaSinAsis && c._fechaISO !== filtroDiaSinAsis) return false;
        var ok = true;
        filtrosActivos.forEach(function(f) { if (!cumpleFiltro(c, f)) ok = false; });
        return ok;
      }


      // ---------- Asistencia con un clic ----------
      // Cada botón busca en las opciones reales de tu desplegable la que
      // corresponde a su color (verde/rojo/ámbar), igual que los chips.
      function opcionAsistencia(clase) {
        var ops = OPCIONES_ASISTENCIA.filter(function(op) { return estiloAsistencia(op) === clase; });
        if (clase === 'aviso') {
          var just = ops.filter(function(op) { return /justific/.test(normalizar(op)); });
          if (just.length) return just[0];
        }
        if (clase === 'neutro') {
          // Lo no reconocido también cae en 'neutro': aquí solo vale una opción "Pendiente".
          var pend = ops.filter(function(op) { return /pendient/.test(normalizar(op)); });
          return pend[0] || '';
        }
        return ops[0] || '';
      }

      var ASIS_RAPIDA = [
        { clase: 'ok',     icono: 'check_circle' },
        { clase: 'mal',    icono: 'cancel' },
        { clase: 'aviso',  icono: 'event_busy' },
        { clase: 'neutro', icono: 'hourglass_empty' }
      ];

      function guardarSesion(fila) {

      // Resumen del día: en reposo, una línea tenue («12 citas · 4 libres»); color solo si hay asistencias por registrar

      function renderCelda(header, valor, fila, esHueco, tag) {

      function htmlTabla(filtradas) {

      // ---------- Vista "Hoy": tarjetas compactas ----------

      function htmlTarjetas(citas) {
