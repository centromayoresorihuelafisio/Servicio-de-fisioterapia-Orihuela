    <script>
      var BASE_URL = '<?= baseUrl ?>';
      var PACIENTES = [];
      var pacienteSeleccionado = null; // nombre (string) o null
      var metricaActual = 'funcionGlobal';
      var filaEnEdicion = null;

      // ---------- Carga de datos ----------
      function cargar() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            PACIENTES = res.pacientes || [];
            render();
            // Si había un paciente con el detalle abierto, lo refrescamos con
            // los datos nuevos (p.ej. tras guardar una valoración) en vez de
            // cerrarlo, para no perder el sitio.
            if (pacienteSeleccionado) mostrarDetalle(pacienteSeleccionado);
          })
          .withFailureHandler(mostrarError)
          .obtenerValoracionesWeb();
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio">⚠️ No se pudieron cargar las valoraciones.<br>' + (err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function escapar(txt) { return (txt + '').replace(/</g, '&lt;'); }

      // ---------- Píldoras de severidad ----------
      // OJO: la dirección del color depende del tipo de escala (confirmado
      // en Valoracion.html, funciones painClass/funcClass/analgesicos):
      // - PEG Dolor/Actividad/Vida: 0-10, ALTO = MALO (dolor/interferencia).
      // - Columna/M.Superior/M.Inferior/Función Global: 0-10, ALTO = BUENO
      //   (son escalas de capacidad funcional, al revés que el dolor).
      // - Analgésicos: 0-5, ALTO = MALO (más consumo).
      function claseSeveridadDolor(valor) {
        if (valor <= 3) return 'sev-ok';
        if (valor <= 6) return 'sev-medio';
        return 'sev-alto';
      }
      function claseSeveridadFuncion(valor) {
        if (valor <= 3) return 'sev-alto';
        if (valor <= 7) return 'sev-medio';
        return 'sev-ok';
      }
      function claseSeveridadAnalgesicos(valor) {
        if (valor <= 2) return 'sev-ok';
        if (valor === 3) return 'sev-medio';
        return 'sev-alto';
      }
      var TIPO_METRICA = {
        pegDolor: 'dolor', pegActividad: 'dolor', pegVida: 'dolor',
        mediaColumna: 'funcion', mediaMS: 'funcion', mediaMI: 'funcion', funcionGlobal: 'funcion',
        analgesicos: 'analg'
      };
      function claseSeveridad(valor, campo) {
        var tipo = TIPO_METRICA[campo] || 'dolor';
        if (tipo === 'funcion') return claseSeveridadFuncion(valor);
        if (tipo === 'analg') return claseSeveridadAnalgesicos(valor);
        return claseSeveridadDolor(valor);
      }
      function renderPill(valor, campo) {
        if (valor === null || valor === undefined) return '<span class="badge sev-vacio">—</span>';
        return '<span class="badge ' + claseSeveridad(valor, campo) + '">' + valor + '</span>';
      }

      function formatearFechaCorta(fechaISO) {
        if (!fechaISO) return '—';
        var partes = fechaISO.split('-'); // yyyy-MM-dd
        return partes[2] + '/' + partes[1] + '/' + partes[0].slice(2);
      }

      // ---------- Render tabla principal ----------
      function render() {
        var termino = normalizar(document.getElementById('inputBusqueda').value);
        var filtrados = PACIENTES.filter(function(p) { return !termino || normalizar(p.nombre).indexOf(termino) !== -1; });

        document.getElementById('contador').textContent = filtrados.length + ' de ' + PACIENTES.length;

        var cont = document.getElementById('tablaWrap');
        if (filtrados.length === 0) {
          cont.innerHTML = '<div class="estado-vacio">No se encontró ningún usuario con ese criterio.</div>';
          return;
        }

        var thead = '<thead><tr>' +
          '<th>Usuario</th><th>Última valoración</th><th>Tipo</th><th>PEG Dolor</th>' +
          '<th>PEG Actividad</th><th>PEG Vida</th><th>Columna</th><th>M. Superior</th><th>M. Inferior</th>' +
          '<th>Función Global</th><th>Analgésicos</th><th>Notas</th><th>Nº</th>' +
          '</tr></thead>';

        var tbody = '<tbody>' + filtrados.map(function(p) {
          var u = p.ultima;
          var sel = pacienteSeleccionado === p.nombre;
          return '<tr data-nombre="' + escapar(p.nombre) + '" class="' + (sel ? 'seleccionada' : '') + '">' +
            '<td class="nombre">' + escapar(p.nombre) + '</td>' +
            '<td>' + formatearFechaCorta(u.fecha) + '</td>' +
            '<td>' + (u.tipo ? escapar(u.tipo) : '<span class="vacio">—</span>') + '</td>' +
            '<td>' + renderPill(u.pegDolor, 'pegDolor') + '</td>' +
            '<td>' + renderPill(u.pegActividad, 'pegActividad') + '</td>' +
            '<td>' + renderPill(u.pegVida, 'pegVida') + '</td>' +
            '<td>' + renderPill(u.mediaColumna, 'mediaColumna') + '</td>' +
            '<td>' + renderPill(u.mediaMS, 'mediaMS') + '</td>' +
            '<td>' + renderPill(u.mediaMI, 'mediaMI') + '</td>' +
            '<td>' + renderPill(u.funcionGlobal, 'funcionGlobal') + '</td>' +
            '<td>' + renderPill(u.analgesicos, 'analgesicos') + '</td>' +
            '<td class="notas' + (u.notas ? '' : ' vacio') + '" title="' + escapar(u.notas || '') + '">' + (u.notas ? escapar(u.notas) : '—') + '</td>' +
            '<td>' + p.numValoraciones + '</td>' +
            '</tr>';
        }).join('') + '</tbody>';

        cont.innerHTML = '<table>' + thead + tbody + '</table>';

        cont.querySelectorAll('tbody tr').forEach(function(tr) {
          tr.addEventListener('click', function() {
            var nombre = tr.getAttribute('data-nombre');
            if (pacienteSeleccionado === nombre) {
              cerrarDetalle();
            } else {
              mostrarDetalle(nombre);
            }
          });
        });
      }

      // ---------- Panel de detalle (historial + gráfica) ----------
      function mostrarDetalle(nombre) {
        var p = PACIENTES.find(function(x) { return x.nombre === nombre; });
        if (!p) { cerrarDetalle(); return; }

        pacienteSeleccionado = nombre;
        document.getElementById('panelDetalle').classList.add('visible');
        document.getElementById('detalleNombre').textContent = p.nombre;
        document.getElementById('detalleTelefono').textContent = p.telefono || 'Sin teléfono';

        renderGrafica(p.historial);
        renderTablaHistorial(p.historial);

        // Refleja la selección en la tabla principal sin tener que re-renderizarla entera.
        document.querySelectorAll('#tablaWrap tbody tr').forEach(function(tr) {
          tr.classList.toggle('seleccionada', tr.getAttribute('data-nombre') === nombre);
        });
      }

      function cerrarDetalle() {
        pacienteSeleccionado = null;
        document.getElementById('panelDetalle').classList.remove('visible');
        document.querySelectorAll('#tablaWrap tbody tr').forEach(function(tr) { tr.classList.remove('seleccionada'); });
      }

      document.getElementById('btnCerrarDetalle').addEventListener('click', cerrarDetalle);

      document.getElementById('selectorMetrica').addEventListener('change', function() {
        metricaActual = this.value;
        if (pacienteSeleccionado) {
          var p = PACIENTES.find(function(x) { return x.nombre === pacienteSeleccionado; });
          if (p) renderGrafica(p.historial);
        }
      });

      // ---------- Gráfica de evolución (SVG, sin librerías externas) ----------
      function renderGrafica(historial) {
        var cont = document.getElementById('contenedorGrafica');

        // Proporción fija (no el ancho real del contenedor): en un monitor
        // panorámico, estirar la gráfica a todo el ancho disponible la deja
        // casi plana y difícil de leer. El CSS (max-width + height:auto) se
        // encarga de escalarla sin distorsión.
        var W = 620, H = 240, padL = 30, padR = 16, padT = 14, padB = 26;

        var puntos = [];
        historial.forEach(function(h, i) {
          var v = h[metricaActual];
          if (v !== null && v !== undefined) puntos.push({ i: i, v: v, fecha: h.fecha, tipo: h.tipo });
        });

        if (puntos.length === 0) {
          cont.innerHTML = '<p class="sin-datos-grafica">Sin datos suficientes para graficar esta métrica.</p>';
          return;
        }

        var n = historial.length;
        var escalaX = function(i) { return n <= 1 ? (padL + (W - padL - padR) / 2) : padL + (i / (n - 1)) * (W - padL - padR); };
        var escalaY = function(v) { return padT + (1 - v / 10) * (H - padT - padB); };

        var lineaPath = puntos.map(function(p, idx) {
          return (idx === 0 ? 'M' : 'L') + escalaX(p.i).toFixed(1) + ',' + escalaY(p.v).toFixed(1);
        }).join(' ');

        var circulos = puntos.map(function(p) {
          return '<circle cx="' + escalaX(p.i).toFixed(1) + '" cy="' + escalaY(p.v).toFixed(1) + '" r="4.5" class="punto-grafica ' + claseSeveridad(p.v, metricaActual) + '">' +
            '<title>' + formatearFechaCorta(p.fecha) + ' (' + escapar(p.tipo) + '): ' + p.v + '</title></circle>';
        }).join('');

        var guias = [0, 5, 10].map(function(v) {
          var y = escalaY(v).toFixed(1);
          return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" class="guia-grafica" />' +
            '<text x="2" y="' + (parseFloat(y) + 4) + '" class="etiqueta-grafica">' + v + '</text>';
        }).join('');

        var etiquetaInicio = '<text x="' + padL + '" y="' + (H - 4) + '" class="etiqueta-grafica">' + formatearFechaCorta(historial[0].fecha) + '</text>';
        var etiquetaFin = '<text x="' + (W - padR) + '" y="' + (H - 4) + '" class="etiqueta-grafica" text-anchor="end">' + formatearFechaCorta(historial[historial.length - 1].fecha) + '</text>';

        cont.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="grafica-evolucion">' +
          guias + '<path d="' + lineaPath + '" class="linea-grafica" fill="none" />' + circulos + etiquetaInicio + etiquetaFin + '</svg>';
      }

      // ---------- Tabla de historial completo ----------
      function renderTablaHistorial(historial) {
        var filas = historial.slice().reverse(); // más reciente arriba
        document.getElementById('cuerpoHistorial').innerHTML = filas.map(function(h) {
          return '<tr>' +
            '<td>' + formatearFechaCorta(h.fecha) + '</td>' +
            '<td>' + (h.tipo ? escapar(h.tipo) : '—') + '</td>' +
            '<td>' + renderPill(h.pegDolor, 'pegDolor') + '</td>' +
            '<td>' + renderPill(h.pegActividad, 'pegActividad') + '</td>' +
            '<td>' + renderPill(h.pegVida, 'pegVida') + '</td>' +
            '<td>' + renderPill(h.mediaColumna, 'mediaColumna') + '</td>' +
            '<td>' + renderPill(h.mediaMS, 'mediaMS') + '</td>' +
            '<td>' + renderPill(h.mediaMI, 'mediaMI') + '</td>' +
            '<td>' + renderPill(h.funcionGlobal, 'funcionGlobal') + '</td>' +
            '<td>' + renderPill(h.analgesicos, 'analgesicos') + '</td>' +
            '<td class="notas">' + (h.notas ? escapar(h.notas) : '—') + '</td>' +
            '<td class="acciones-historial">' +
              '<span class="material-symbols-outlined icono-accion" data-fila="' + h._fila + '" data-accion="editar" title="Editar valoración">edit</span>' +
              '<span class="material-symbols-outlined icono-accion icono-eliminar" data-fila="' + h._fila + '" data-accion="eliminar" title="Eliminar valoración">delete</span>' +
            '</td>' +
            '</tr>';
        }).join('');

        document.querySelectorAll('#cuerpoHistorial .icono-accion').forEach(function(icono) {
          icono.addEventListener('click', function() {
            var fila = parseInt(icono.getAttribute('data-fila'), 10);
            var registro = historial.find(function(h) { return h._fila === fila; });
            if (!registro) return;
            if (icono.getAttribute('data-accion') === 'editar') {
              abrirModalEditar(registro);
            } else {
              eliminarValoracion(registro);
            }
          });
        });
      }

      // ---------- Editar valoración ----------
      function valorInputONulo_(id) {
        var v = document.getElementById(id).value;
        return v === '' ? null : Number(v);
      }

      function abrirModalEditar(registro) {
        filaEnEdicion = registro._fila;
        document.getElementById('editFecha').value = registro.fecha || '';
        document.getElementById('editTipo').value = registro.tipo || 'Inicial';
        document.getElementById('editTelefono').value = registro.telefono || '';
        document.getElementById('editAnalgesicos').value = registro.analgesicos === null ? '' : registro.analgesicos;
        document.getElementById('editPegDolor').value = registro.pegDolor === null ? '' : registro.pegDolor;
        document.getElementById('editPegActividad').value = registro.pegActividad === null ? '' : registro.pegActividad;
        document.getElementById('editPegVida').value = registro.pegVida === null ? '' : registro.pegVida;
        document.getElementById('editFuncionGlobal').value = registro.funcionGlobal === null ? '' : registro.funcionGlobal;
        document.getElementById('editMediaColumna').value = registro.mediaColumna === null ? '' : registro.mediaColumna;
        document.getElementById('editMediaMS').value = registro.mediaMS === null ? '' : registro.mediaMS;
        document.getElementById('editMediaMI').value = registro.mediaMI === null ? '' : registro.mediaMI;
        document.getElementById('editNotas').value = registro.notas || '';
        document.getElementById('modalEditarOverlay').classList.add('visible');
      }

      function cerrarModalEditar() {
        filaEnEdicion = null;
        document.getElementById('modalEditarOverlay').classList.remove('visible');
      }

      document.getElementById('btnCancelarEdicion').addEventListener('click', cerrarModalEditar);

      document.getElementById('btnGuardarEdicion').addEventListener('click', function() {
        if (!filaEnEdicion) return;
        var fecha = document.getElementById('editFecha').value;
        if (!fecha) { mostrarAviso('La fecha es obligatoria.'); return; }

        var datos = {
          fila: filaEnEdicion,
          fecha: fecha,
          tipo: document.getElementById('editTipo').value,
          telefono: document.getElementById('editTelefono').value,
          analgesicos: valorInputONulo_('editAnalgesicos'),
          pegDolor: valorInputONulo_('editPegDolor'),
          pegActividad: valorInputONulo_('editPegActividad'),
          pegVida: valorInputONulo_('editPegVida'),
          funcionGlobal: valorInputONulo_('editFuncionGlobal'),
          mediaColumna: valorInputONulo_('editMediaColumna'),
          mediaMS: valorInputONulo_('editMediaMS'),
          mediaMI: valorInputONulo_('editMediaMI'),
          notas: document.getElementById('editNotas').value
        };

        var btn = this;
        var textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Guardando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.textContent = textoOriginal;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo guardar la valoración.'); return; }
            cerrarModalEditar();
            cargar();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.textContent = textoOriginal;
            mostrarAviso('Error al guardar: ' + err);
          })
          .actualizarValoracionWeb(datos);
      });

      // ---------- Eliminar valoración ----------
      async function eliminarValoracion(registro) {
        var confirmado = await mostrarConfirm('¿Eliminar esta valoración?');
        if (!confirmado) return;

        // Foto completa de la valoración ANTES de borrarla (con el nombre del
        // paciente, que el registro no trae por sí solo), para poder deshacer.
        var snapshot = Object.assign({ nombre: pacienteSeleccionado }, registro);

        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudo eliminar la valoración.'); return; }
            cargar();
            mostrarDeshacer(snapshot, 'Valoración eliminada.');
          })
          .withFailureHandler(function(err) { mostrarAviso('Error al eliminar: ' + err); })
          .eliminarValoracionWeb(registro._fila);
      }

      <?!= include('JS_Modal_Deshacer'); ?>

      function ejecutarDeshacer() {
        if (!ultimaEliminacion || procesandoDeshacer) return;
        procesandoDeshacer = true;
        var snapshot = ultimaEliminacion;

        google.script.run
          .withSuccessHandler(function(res) {
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; } // el botón sigue disponible para reintentar
            ocultarDeshacer();
            cargar();
          })
          .withFailureHandler(function(err) {
            procesandoDeshacer = false;
            mostrarAviso('Error al deshacer: ' + err); // el botón sigue disponible para reintentar
          })
          .restaurarValoracionWeb(snapshot);
      }

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);
      document.getElementById('btnDeshacer').addEventListener('click', ejecutarDeshacer);

      // ---------- Nueva Valoración (ventana emergente) ----------
      // Las Web Apps de Apps Script no se pueden embeber en un <iframe>
      // (Google lo bloquea), así que usamos una ventana real con window.open,
      // igual que hace Base de Datos para Editar/Cita/Valoración.
      var ventanaActiva = null;
      var sondeoCierre = null;

      document.getElementById('btnNuevaValoracion').addEventListener('click', function() {
        var ruta = 'valoracion' + (pacienteSeleccionado ? '&paciente=' + encodeURIComponent(pacienteSeleccionado) : '');
        var url = BASE_URL + '?page=' + ruta + '&embed=1';

        ventanaActiva = window.open(url, 'ventanaValoracion', 'width=650,height=800,resizable=yes,scrollbars=yes');

        if (!ventanaActiva) {
          mostrarAviso('El navegador ha bloqueado la ventana emergente. Permite las ventanas emergentes para esta página e inténtalo de nuevo.');
          return;
        }

        // El formulario de Valoración no avisa al cerrarse (no hace postMessage
        // ni usa localStorage), así que detectamos el cierre por sondeo y
        // refrescamos la tabla — puede que se haya guardado una valoración nueva.
        if (sondeoCierre) clearInterval(sondeoCierre);
        sondeoCierre = setInterval(function() {
          if (ventanaActiva && ventanaActiva.closed) {
            clearInterval(sondeoCierre);
            sondeoCierre = null;
            cargar();
          }
        }, 500);
      });

      document.getElementById('inputBusqueda').addEventListener('input', render);

      cargar();
    </script>
  </body>
