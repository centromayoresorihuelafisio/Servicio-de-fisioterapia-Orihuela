<html lang="es">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      <?!= include('CSS_Global'); ?>

      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--md-bg);
        color: var(--md-on-surface);
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }

      header.top {
        background: var(--md-surface);
        border-bottom: 1px solid var(--md-outline);
        padding: .75rem 1rem;
        flex-shrink: 0;
      }
      header.top h1 {
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-bottom: .6rem;
      }
      header.top .contador { font-size: .78rem; color: var(--md-on-surface-med); font-weight: 400; }

      .barra-herramientas {
        display: flex;
        gap: .4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: .6rem;
        padding-bottom: .6rem;
        border-bottom: 1px solid var(--md-outline);
      }
      .btn-toolbar {
        display: inline-flex;
        align-items: center;
        gap: .3rem;
        background: var(--md-surface);
        border: 1px solid var(--md-outline);
        color: var(--md-on-surface);
        border-radius: var(--radius-pill);
        padding: .35rem .8rem;
        font-size: .8rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        font-family: var(--font);
      }
      .btn-toolbar:hover { background: var(--md-surface-variant); }
      .btn-toolbar.primario { background: #c2e7ff; border-color: #c2e7ff; color: #004a77; }
      .btn-toolbar.primario:hover { background: #a8d9f9; border-color: #a8d9f9; }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      .btn-toolbar .material-symbols-outlined { font-size: 17px; }
      .btn-toolbar.icono-solo { padding: .35rem; }
      .btn-toolbar.destructivo:hover:not(:disabled) { background: var(--md-error-bg); border-color: var(--md-error); color: var(--md-error); }
      /* Botón "Deshacer": solo se muestra tras eliminar un usuario, hasta que
         se usa, se elimina otro encima, o se recarga/cambia de pestaña. */
      .btn-toolbar.deshacer { display: none; background: var(--md-warning-bg); border-color: var(--md-warning); color: #7a4f00; }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar.deshacer:hover { background: #fdecc0; }
      .toast-deshacer {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: #323232; color: #fff; padding: .65rem 1rem; border-radius: var(--radius-md);
        display: flex; align-items: center; gap: 1rem; font-size: .82rem;
        box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200;
        opacity: 0; pointer-events: none; transition: opacity 200ms ease;
      }
      .toast-deshacer.visible { opacity: 1; pointer-events: auto; }
      .toast-deshacer button {
        background: none; border: none; color: #8ab4f8; font-weight: 700; font-size: .82rem;
        cursor: pointer; font-family: var(--font); padding: 0; letter-spacing: .02em;
      }
      .toast-deshacer button:hover { text-decoration: underline; }

      .seleccion-info {
        font-size: .78rem;
        color: var(--md-on-surface-med);
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: .4rem;
      }
      .seleccion-info strong { color: var(--md-primary-dark); }
      .seleccion-info .btn-quitar {
        cursor: pointer;
        color: var(--md-on-surface-low);
        font-size: 16px;
        line-height: 1;
      }

      .controles { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
      .buscador {
        display: flex; align-items: center; gap: .4rem;
        background: var(--md-surface-variant); border-radius: var(--radius-pill);
        padding: .4rem .8rem; flex: 1; min-width: 200px;
      }
      .buscador input { border: none; outline: none; flex: 1; font-size: .85rem; font-family: var(--font); background: transparent; }
      .buscador .material-symbols-outlined { color: var(--md-on-surface-low); font-size: 18px; }

      .filtros { display: flex; gap: .35rem; flex-wrap: wrap; }
      .chip {
        border: 1px solid var(--md-outline); background: var(--md-surface); border-radius: var(--radius-pill);
        padding: .3rem .75rem; font-size: .75rem; font-weight: 500; cursor: pointer;
        transition: var(--transition); color: var(--md-on-surface-med); user-select: none; white-space: nowrap;
      }
      .chip.activo { background: var(--md-primary-container); border-color: var(--md-primary); color: var(--md-primary-dark); }

      .tabla-wrap { flex: 1; overflow: auto; }
      table { border-collapse: collapse; width: 100%; min-width: 900px; }
      thead th {
        position: sticky; top: 0; background: var(--md-surface-variant); color: var(--md-on-surface-med);
        font-size: .68rem; text-transform: uppercase; letter-spacing: .02em; font-weight: 600; text-align: left;
        padding: .5rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; z-index: 2;
      }
      thead th:nth-child(1), tbody td:nth-child(1) {
        position: sticky; left: 0; width: 64px; min-width: 64px; max-width: 64px;
        background: var(--md-surface-variant); z-index: 3; box-shadow: 1px 0 0 var(--md-outline);
      }
      tbody td:nth-child(1) { background: var(--md-surface); z-index: 1; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        position: sticky; left: 64px;
        background: var(--md-surface-variant); z-index: 3; box-shadow: 1px 0 0 var(--md-outline);
      }
      tbody td:nth-child(2) { background: var(--md-surface); z-index: 1; }
      tbody tr.fila-activo      { background: var(--md-success-bg); }
      tbody tr.fila-espera      { background: var(--md-warning-bg); }
      tbody tr.fila-contactara  { background: var(--md-error-bg); }
      tbody tr.fila-alta        { background: var(--md-purple-bg); }
      tbody tr.fila-no-responde { background: var(--md-surface-variant); }
      tbody tr.fila-activo td:nth-child(1), tbody tr.fila-activo td:nth-child(2)           { background: var(--md-success-bg); }
      tbody tr.fila-espera td:nth-child(1), tbody tr.fila-espera td:nth-child(2)           { background: var(--md-warning-bg); }
      tbody tr.fila-contactara td:nth-child(1), tbody tr.fila-contactara td:nth-child(2)   { background: var(--md-error-bg); }
      tbody tr.fila-alta td:nth-child(1), tbody tr.fila-alta td:nth-child(2)               { background: var(--md-purple-bg); }
      tbody tr.fila-no-responde td:nth-child(1), tbody tr.fila-no-responde td:nth-child(2) { background: var(--md-surface-variant); }
      tbody tr:hover { background: var(--md-primary-light); }

      tbody tr { cursor: pointer; }

      tbody td { padding: .45rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
      td.nombre { font-weight: 600; }
      td.vacio { color: var(--md-on-surface-low); font-style: italic; }

      .badge { font-size: .68rem; font-weight: 600; padding: .15rem .55rem; border-radius: var(--radius-pill); white-space: nowrap; background: var(--md-surface-variant); color: var(--md-on-surface-med); }
      .badge.activo      { background: var(--md-success-bg); color: var(--md-success); }
      .badge.espera      { background: var(--md-warning-bg); color: var(--md-warning); }
      .badge.contactara  { background: var(--md-error-bg); color: var(--md-error); }
      .badge.alta        { background: var(--md-purple-bg); color: var(--md-purple); }
      .badge.no-responde { background: var(--md-surface-variant); color: var(--md-on-surface-med); }

      td a.link-hc { color: var(--md-primary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: .2rem; }
      td a.link-hc:hover { text-decoration: underline; }

      .estado-vacio, .estado-carga { text-align: center; color: var(--md-on-surface-med); padding: 3rem 1rem; font-size: .9rem; }
      .estado-carga .material-symbols-outlined { font-size: 28px; animation: spin 1s linear infinite; display: block; margin: 0 auto .5rem; color: var(--md-primary); }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Modal propio (sustituye a alert()/confirm() nativos) ---------- */
      .modal-overlay {

    </style>

    <!-- Modal propio: sustituye a los alert()/confirm() nativos del navegador,
         que en la Web App muestran el dominio interno de Google (feo y confuso). -->
    <?!= include('Modal_Deshacer'); ?>

    <script>
      var BASE_URL = '<?= baseUrl ?>';
      var TODOS = [];
      var HEADERS = [];
      var filtroEstado = null;
      var COL_HISTORIA = null;
      var pacienteSeleccionado = null; // { _fila, Nombre, ... } o null

      // ---------- Carga de datos ----------
      function cargar() {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            HEADERS = res.headers || [];
            TODOS = res.pacientes || [];
            COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });
            construirFiltrosEstado();
            render();
          })
          .withFailureHandler(mostrarError)
          .obtenerBaseDatosCompletaWeb();
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio">⚠️ No se pudo cargar la base de datos.<br>' + (err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      // ---------- Filtros ----------
      function construirFiltrosEstado() {
        var cont = document.getElementById('filtrosEstado');
        var valores = {};
        TODOS.forEach(function(p) {
          var e = (p['Estado'] || '').toString().trim();
          if (e) valores[e] = true;
        });
        var lista = Object.keys(valores).sort();

        var html = '<div class="chip activo" data-estado="">Todos</div>';
        lista.forEach(function(estado) {
          html += '<div class="chip" data-estado="' + estado.replace(/"/g, '&quot;') + '">' + estado + '</div>';
        });
        cont.innerHTML = html;

        cont.querySelectorAll('.chip').forEach(function(chip) {
          chip.addEventListener('click', function() {
            cont.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('activo'); });
            chip.classList.add('activo');
            filtroEstado = chip.getAttribute('data-estado') || null;
            render();
          });
        });
      }

      function claseParaEstado(estado) {
        var e = normalizar(estado);
        if (e.indexOf('activo') !== -1) return 'activo';
        if (e.indexOf('espera') !== -1) return 'espera';
        if (e.indexOf('contactar') !== -1) return 'contactara';
        if (e.indexOf('alta') !== -1) return 'alta';
        if (e.indexOf('responde') !== -1) return 'no-responde';
        return '';
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }
      function escapar(txt) { return (txt + '').replace(/</g, '&lt;'); }

      function renderCelda(header, valor) {
        var vacio = valor === '' || valor === null || valor === undefined;
        if (header === 'Nombre') return '<td class="nombre">' + (vacio ? '—' : escapar(valor)) + '</td>';
        if (header === 'Estado') return '<td>' + (vacio ? '—' : '<span class="badge ' + claseParaEstado(valor) + '">' + escapar(valor) + '</span>') + '</td>';
        if (header === COL_HISTORIA) {
          if (vacio) return '<td class="vacio">Sin enlace</td>';
          return esUrl(valor)
            ? '<td><a class="link-hc" href="' + valor + '" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span class="material-symbols-outlined text-[15px]">description</span>Abrir</a></td>'
            : '<td>' + escapar(valor) + '</td>';
        }
        return '<td class="' + (vacio ? 'vacio' : '') + '">' + (vacio ? '—' : escapar(valor)) + '</td>';
      }

      // ---------- Render tabla ----------
      function render() {
        var termino = normalizar(document.getElementById('inputBusqueda').value);

        var filtrados = TODOS.filter(function(p) {
          if (filtroEstado && (p['Estado'] || '').toString().trim() !== filtroEstado) return false;
          if (!termino) return true;
          // Busca en TODAS las columnas de la ficha (Nombre, DNI, Teléfonos,
          // Fecha nacimiento, Edad, Gravedad, Patología 1/2, Tipo de Ingreso,
          // etc.), no solo en una lista fija — así cubre cualquier columna
          // que exista hoy o se añada más adelante, sin tocar este código.
          return HEADERS.some(function(h) { return normalizar(p[h]).indexOf(termino) !== -1; });
        });

        document.getElementById('contador').textContent = filtrados.length + ' de ' + TODOS.length;

        var cont = document.getElementById('tablaWrap');
        if (filtrados.length === 0) {
          cont.innerHTML = '<div class="estado-vacio">No se encontró ningún usuario con ese criterio.</div>';
          return;
        }

        var thead = '<thead><tr>' + HEADERS.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead>';

        var tbody = '<tbody>' + filtrados.map(function(p) {
          var celdas = HEADERS.map(function(h) { return renderCelda(h, p[h]); }).join('');
          var sel = pacienteSeleccionado && pacienteSeleccionado._fila === p._fila;
          var clsFila = claseParaEstado(p['Estado']) ? 'fila-' + claseParaEstado(p['Estado']) : '';
          var clases = clsFila + (sel ? ' seleccionada' : '');
          return '<tr data-fila="' + p._fila + '" class="' + clases + '">' + celdas + '</tr>';
        }).join('') + '</tbody>';

        cont.innerHTML = '<table>' + thead + tbody + '</table>';

        // Click en la fila = seleccionar (para las acciones que llegarán después)
        cont.querySelectorAll('tbody tr').forEach(function(tr) {
          tr.addEventListener('click', function() {
            var fila = parseInt(tr.getAttribute('data-fila'), 10);
            seleccionarFila(fila);
          });
        });
      }

      // ---------- Selección de fila ----------
      function seleccionarFila(fila) {
        if (pacienteSeleccionado && pacienteSeleccionado._fila === fila) {
          quitarSeleccion();
          return;
        }
        pacienteSeleccionado = TODOS.find(function(p) { return p._fila === fila; }) || null;
        actualizarUiSeleccion();
      }

      function quitarSeleccion() {
        pacienteSeleccionado = null;
        actualizarUiSeleccion();
      }

      var BOTONES_PACIENTE = ['btnEditar','btnEliminarUsuario','btnAlta','btnHistoria','btnActualizarHistoria','btnBuscarHuerfana','btnWhatsapp','btnCita','btnValoracion']
        .map(function(id) { return document.getElementById(id); });

      function actualizarUiSeleccion() {
        var info = document.getElementById('seleccionInfo');
        if (pacienteSeleccionado) {
          info.style.display = 'flex';
          document.getElementById('nombreSeleccionado').textContent = pacienteSeleccionado['Nombre'] || '';
        } else {
          info.style.display = 'none';
        }
        BOTONES_PACIENTE.forEach(function(btn) { btn.disabled = !pacienteSeleccionado; });
        document.querySelectorAll('tbody tr').forEach(function(tr) {
          var fila = parseInt(tr.getAttribute('data-fila'), 10);
          tr.classList.toggle('seleccionada', !!(pacienteSeleccionado && pacienteSeleccionado._fila === fila));
        });
      }

      document.getElementById('btnQuitarSeleccion').addEventListener('click', function(e) {
        e.stopPropagation();
        quitarSeleccion();
      });

      <?!= include('JS_Modal_Deshacer'); ?>


      // ---------- Ventana emergente (edición y alta de paciente) ----------
      // Las Web Apps de Apps Script no se pueden embeber en un <iframe>
      // (Google lo bloquea), así que usamos una ventana real con window.open.
      var ventanaActiva = null;
      var sondeoCierre = null;

      function abrirVentanaEmergente(rutaConParametros) {
        var embedParam = '&embed=1';
        var url = BASE_URL + '?page=' + rutaConParametros + embedParam;

        ventanaActiva = window.open(url, 'ventanaPaciente', 'width=650,height=800,resizable=yes,scrollbars=yes');

        if (!ventanaActiva) {
          mostrarAviso('El navegador ha bloqueado la ventana emergente. Permite las ventanas emergentes para esta página e inténtalo de nuevo.');
          return;
        }

        // Red de seguridad: si la ventana se cierra sin avisar por postMessage
        // (p. ej. el formulario de Nuevo Paciente, que aún no lo hace), al
        // detectar que se cerró refrescamos la tabla igualmente.
        if (sondeoCierre) clearInterval(sondeoCierre);
        sondeoCierre = setInterval(function() {
          if (ventanaActiva && ventanaActiva.closed) {
            clearInterval(sondeoCierre);
            sondeoCierre = null;
            cargar();
          }
        }, 500);
      }

      // El formulario avisa por postMessage al guardar o cerrar
      window.addEventListener('message', function(e) {
        if (e.data && (e.data.tipo === 'cerrarEdicionPaciente' || e.data.tipo === 'citaGuardada')) {
          if (sondeoCierre) { clearInterval(sondeoCierre); sondeoCierre = null; }
          if (e.data.guardado) cargar();
          
          // ¡LA MAGIA AQUÍ!: La ventana madre cierra la ventana hija
          if (ventanaActiva && !ventanaActiva.closed) {
            ventanaActiva.close();
          }
        }
      });

      // Segunda vía de aviso (localStorage)
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado') {
          if (sondeoCierre) { clearInterval(sondeoCierre); sondeoCierre = null; }
          cargar();
          
          // ¡LA MAGIA AQUÍ!: La ventana madre cierra la ventana hija
          if (ventanaActiva && !ventanaActiva.closed) {
            ventanaActiva.close();
          }
        }
      });

      // Cierre de ventanas emergentes: el formulario (popup) no siempre puede
      // cerrarse a sí mismo, así que pide a la ventana que la abrió (esta) que
      // lo haga. e.source es la ventana emergente; close() está permitido
      // aunque sea de otro origen.
      window.addEventListener('message', function(e) {
        if (e.data && e.data.tipo === 'cerrarPopupFormulario' && e.source) {
          try { e.source.close(); } catch (err) { /* bloqueado por el navegador */ }
        }
      });

      // ---------- Barra de herramientas ----------
      document.getElementById('btnNuevoPaciente').addEventListener('click', function() {
        abrirVentanaEmergente('nuevoPaciente');
      });

      document.getElementById('btnOrdenar').addEventListener('click', function() {
        var btn = document.getElementById('btnOrdenar');
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Ordenando…';
        google.script.run
          .withSuccessHandler(function() {
            btn.disabled = false;
            btn.innerHTML = textoOriginal;
            cargar();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = textoOriginal;
            mostrarAviso('Error al ordenar: ' + err);
          })
          .ordenarPacientes();
      });

      // ---------- Eliminar usuario ----------
      document.getElementById('btnEliminarUsuario').addEventListener('click', async function() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Eliminar a ' + pacienteSeleccionado['Nombre'] + '? Se borrará toda su ficha.');
        if (!confirmado) return;

        // Foto completa de la ficha ANTES de borrarla, para poder deshacer.
        var snapshot = Object.assign({}, pacienteSeleccionado);

        var btn = this;
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = !pacienteSeleccionado;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo eliminar el usuario.'); return; }
            quitarSeleccion();
            cargar();
            mostrarDeshacer(snapshot, 'Usuario eliminado.');
          })
          .withFailureHandler(function(err) {
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso('Error al eliminar: ' + err);
          })
          .eliminarPacienteWeb(pacienteSeleccionado._fila);
      });

      function ejecutarDeshacer() {
        if (!ultimaEliminacion || procesandoDeshacer) return;
        procesandoDeshacer = true;
        var snapshot = ultimaEliminacion;

        google.script.run
          .withSuccessHandler(function(res) {
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; } // el botón sigue disponible para reintentar
            ocultarDeshacer();
            cargar();
          })
          .withFailureHandler(function(err) {
            procesandoDeshacer = false;
            mostrarAviso('Error al deshacer: ' + err); // el botón sigue disponible para reintentar
          })
          .restaurarPacienteWeb(snapshot);
      }

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);
      document.getElementById('btnDeshacer').addEventListener('click', ejecutarDeshacer);

      // ---------- Dar de alta ----------
      document.getElementById('btnAlta').addEventListener('click', async function() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Dar de alta a ' + pacienteSeleccionado['Nombre'] + '?');
        if (!confirmado) return;

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Procesando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.innerHTML = textoOriginal;
            mostrarAviso(res.message);
            quitarSeleccion();
            cargar();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = textoOriginal;
            mostrarAviso('Error al dar de alta: ' + err);
          })
          .darDeAltaPacienteWeb(pacienteSeleccionado._fila);
      });

      // ---------- Generar Historia Clínica ----------
      document.getElementById('btnHistoria').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Generando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso(res.message);
            if (res.success) cargar();
          })
          .withFailureHandler(function(err) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso('Error al generar la historia clínica: ' + err);
          })
          .generarHistoriaClinicaWeb(pacienteSeleccionado._fila);
      });

      // ---------- Buscar Historia Clínica Huérfana ----------
      document.getElementById('btnBuscarHuerfana').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirVentanaEmergente('huerfanaHC&fila=' + pacienteSeleccionado._fila);
      });

      // ---------- Actualizar Historia Clínica Existente ----------
      document.getElementById('btnActualizarHistoria').addEventListener('click', async function() {
        if (!pacienteSeleccionado) return;

        var confirmado = await mostrarConfirm('¿Sobrescribir los datos personales en el documento de Historia Clínica de ' + pacienteSeleccionado['Nombre'] + ' con la información actual de la base de datos?');
        if (!confirmado) return;

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Actualizando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso(res.message);
          })
          .withFailureHandler(function(err) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso('Error al actualizar la historia clínica: ' + err);
          })
          .actualizarDatosHistoriaClinicaWeb(pacienteSeleccionado._fila);
      });

      // ---------- WhatsApp ----------
      document.getElementById('btnWhatsapp').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;

        // Abrimos la ventana en el propio clic (síncrono) para que el navegador
        // no la bloquee; la rellenamos en cuanto llega la URL calculada en el servidor.
        var ventana = window.open('', '_blank');

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              if (ventana) ventana.location.href = res.url;
            } else {
              if (ventana) ventana.close();
              mostrarAviso(res.message);
            }
          })
          .withFailureHandler(function(err) {
            if (ventana) ventana.close();
            mostrarAviso('Error al abrir WhatsApp: ' + err);
          })
          .generarUrlWhatsappWeb(pacienteSeleccionado._fila);
      });

      // ---------- Editar: reutiliza la ventana emergente existente ----------
      document.getElementById('btnEditar').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirVentanaEmergente('editarPaciente&fila=' + pacienteSeleccionado._fila);
      });

      // ---------- Cita y Valoración: reutilizan la ventana emergente existente ----------
      document.getElementById('btnCita').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirVentanaEmergente('citas&paciente=' + encodeURIComponent(pacienteSeleccionado['Nombre']));
      });

      document.getElementById('btnValoracion').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirVentanaEmergente('valoracion&paciente=' + encodeURIComponent(pacienteSeleccionado['Nombre']));
      });

      document.getElementById('inputBusqueda').addEventListener('input', render);

      cargar();
    </script>
  </body>
