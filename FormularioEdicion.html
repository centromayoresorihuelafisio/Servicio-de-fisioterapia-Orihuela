<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Display:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Material Design 3 / Google Workspace tokens ── */
      :root {
        --md-primary:          #1a73e8;   /* Google Blue */
        --md-primary-dark:     #1557b0;
        --md-primary-light:    #e8f0fe;
        --md-primary-container:#d2e3fc;
        --md-on-primary:       #ffffff;
        --md-success:          #137333;
        --md-success-bg:       #e6f4ea;
        --md-error:            #c5221f;
        --md-warning:          #f29900;
        --md-warning-bg:       #fef7e0;

        --md-bg:               #f8f9fa;   /* Google's neutral bg */
        --md-surface:          #ffffff;
        --md-surface-variant:  #f1f3f4;
        --md-outline:          #dadce0;
        --md-outline-focus:    #1a73e8;

        --md-on-surface:       #202124;   /* Google's near-black */
        --md-on-surface-med:   #5f6368;   /* Google's medium grey */
        --md-on-surface-low:   #80868b;   /* Google's light grey */

        --md-header-bg:        #ffffff;
        --md-header-border:    #e0e0e0;

        --radius-sm:    4px;
        --radius-md:    8px;
        --radius-lg:    12px;
        --radius-pill:  50px;

        /* MD3 elevation via box-shadow */
        --elev-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
        --elev-2: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
        --elev-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);

        --font:   'Google Sans', 'Segoe UI', Arial, sans-serif;
        --mono:   'Roboto Mono', monospace;
        --transition: 150ms cubic-bezier(.2,0,0,1);
      }

      body {
        font-family: var(--font);
        background: var(--md-bg);
        min-height: 100vh;
        padding: 0 0 5rem;
        color: var(--md-on-surface);
        -webkit-font-smoothing: antialiased;
        font-size: 14px;
      }

      /* ── Top App Bar (Google Workspace style) ── */
      .page-header {
        background: var(--md-header-bg);
        border-bottom: 1px solid var(--md-header-border);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0 24px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 1px 3px rgba(60,64,67,.08);
        animation: fadeDown .3s ease both;
        max-width: 100%;
        margin: 0;
      }
      .logo-mark {
        width: 36px; height: 36px;
        display: grid; place-items: center;
        flex-shrink: 0;
      }
      /* Google Sheets-style coloured icon */
      .logo-mark svg { color: var(--md-primary); }
      .page-header h1 {
        font-size: 18px;
        font-weight: 400;
        color: var(--md-on-surface);
        line-height: 1;
        white-space: nowrap;
      }
      .page-header p {
        font-size: 13px;
        color: var(--md-on-surface-low);
        margin-top: 2px;
      }
      .badge-date {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--md-on-surface-low);
        background: var(--md-surface-variant);
        padding: 4px 10px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
        letter-spacing: .01em;
      }

      /* ── Content wrapper ── */
      .content-wrap {
        max-width: 880px;
        margin: 24px auto 0;
        padding: 0 16px;
        animation: fadeUp .3s .05s ease both;
      }

      /* ── Card (Material "Surface" elevated) ── */
      .card {
        background: var(--md-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--elev-1);
        overflow: visible;
      }
      .card-section {
        padding: 20px 24px 24px;
        border-bottom: 1px solid var(--md-outline);
      }
      .card-section:last-child { border-bottom: none; }

      /* ── Section label — blue pastel pill with icon ── */
      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }
      .section-label-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #e8f0fe;          /* pastel blue desaturado */
        color: #1a5dbd;               /* azul más intenso */
        border-radius: 100px;
        padding: 5px 14px 5px 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: .04em;
        text-transform: uppercase;
        line-height: 1;
        user-select: none;
      }
      .section-label-pill svg {
        flex-shrink: 0;
        opacity: .85;
      }
      .section-label::after { display: none; }
      /* Hide old dot if still present */
      .section-label .dot { display: none; }

      /* ── Grid ── */
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .span-2  { grid-column: span 2; }

      @media (max-width: 600px) {
        .grid-2 { grid-template-columns: 1fr; }
        .span-2 { grid-column: span 1; }
        .card-section { padding: 16px; }
        .page-header { padding: 0 16px; }
        .page-header h1 { font-size: 16px; }
        .badge-date { display: none; }
        .content-wrap { margin-top: 16px; }
      }

      /* ══════════════════════════════════════
         MD3 Outlined Field — floating label
         ══════════════════════════════════════ */

      .field {
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .field-inner {
        position: relative;
        display: flex;
        align-items: center;
      }

      .field-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        color: var(--md-on-surface-low);
        transition: color var(--transition);
        z-index: 1;
      }

      /* ── Floating label — default: centred (acts as placeholder) ── */
      label.field-label {
        position: absolute;
        left: 44px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        font-weight: 400;
        color: var(--md-on-surface-low);
        pointer-events: none;
        background: var(--md-surface);
        padding: 0 5px;
        transition:
          top 180ms cubic-bezier(.2,0,0,1),
          font-size 180ms cubic-bezier(.2,0,0,1),
          color 180ms cubic-bezier(.2,0,0,1),
          transform 180ms cubic-bezier(.2,0,0,1);
        z-index: 1;
        line-height: 1;
        white-space: nowrap;
        letter-spacing: .005em;
      }

      /* ── Floated state — driven by focus OR .floated class (set via JS when value present) ── */
      label.field-label.floated,
      .field-inner:focus-within label.field-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med);
        letter-spacing: .03em;
      }

      /* Focus → blue label */
      .field-inner:focus-within label.field-label {
        color: var(--md-primary) !important;
      }
      /* Focus → blue icon */
      .field-inner:focus-within .field-icon {
        color: var(--md-primary);
      }

      /* readonly-badge pill */
      .readonly-badge {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: var(--md-on-surface-low);
        background: var(--md-surface-variant);
        padding: 1px 6px;
        border-radius: var(--radius-pill);
        margin-left: 4px;
        vertical-align: middle;
      }

      /* ── Input / date base ── */
      input[type="text"],
      input[type="date"],
      select {
        width: 100%;
        height: 52px;
        padding: 14px 14px 0 44px;
        border: 1.5px solid var(--md-outline);
        border-radius: var(--radius-lg);
        background: var(--md-surface);
        color: var(--md-on-surface);
        font-family: var(--font);
        font-size: 15px;
        transition: border-color var(--transition), background-color var(--transition);
        appearance: none;
        -webkit-appearance: none;
        outline: none;
      }
      input[type="text"]::placeholder,
      input[type="date"]::placeholder { opacity: 0; }

      /* Hide the native dd/mm/aaaa placeholder text when the date field is
         empty and not focused — it overlaps with the floating label */
      input[type="date"]:not(:focus):not(.has-value) {
        color: transparent;
      }
      /* Restore color on focus or when a value exists */
      input[type="date"]:focus,
      input[type="date"].has-value {
        color: var(--md-on-surface);
      }

      input[type="text"]:hover,
      input[type="date"]:hover,
      select:hover {
        border-color: var(--md-on-surface-med);
        background-color: rgba(26,115,232,.015);
      }
      input[type="text"]:focus,
      input[type="date"]:focus,
      select:focus {
        border-color: var(--md-primary);
        border-width: 2px;
        background-color: var(--md-surface);
        padding: 14px 13px 0 43px;
      }

      /* ── Disabled field — always floated label, neutral bg ── */
      input:disabled {
        background: var(--md-surface-variant);
        color: var(--md-on-surface-med);
        cursor: default;
        border-color: var(--md-outline);
        font-family: var(--mono);
        font-size: 13px;
        padding-top: 14px;
      }
      /* Disabled label: force floated via CSS (no JS needed) */
      .field-inner:has(input:disabled) label.field-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-low);
        letter-spacing: .03em;
        background: var(--md-surface-variant);
      }

      /* ── Select — always has a value, label always floated ── */
      select { padding-top: 14px; padding-bottom: 0; padding-right: 36px; cursor: pointer; }
      select ~ label.field-label {
        top: 0; font-size: 11px; font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med); letter-spacing: .03em;
      }
      select:focus ~ label.field-label { color: var(--md-primary) !important; }

      /* ══════════════════════════════════════
         Multiselect — floating label variant
         ══════════════════════════════════════ */
      .multiselect { position: relative; }

      .ms-toggle {
        width: 100%;
        min-height: 52px;
        padding: 14px 44px 0 44px;
        border: 1.5px solid var(--md-outline);
        border-radius: var(--radius-lg);
        background: var(--md-surface);
        cursor: pointer;
        display: flex;
        align-items: center;
        position: relative;
        font-family: var(--font);
        font-size: 15px;
        color: var(--md-on-surface);
        transition: border-color var(--transition), background-color var(--transition);
        user-select: none;
      }
      .ms-toggle:hover { border-color: var(--md-on-surface-med); background-color: rgba(26,115,232,.015); }
      .ms-toggle.open {
        border-color: var(--md-primary);
        border-width: 2px;
        padding: 14px 43px 0 43px;
        background-color: var(--md-surface);
      }

      /* Leading icon inside toggle */
      .ms-leading {
        position: absolute;
        left: 14px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center;
        color: var(--md-on-surface-low);
        pointer-events: none;
        transition: color var(--transition);
      }
      .ms-toggle.open .ms-leading { color: var(--md-primary); }

      /* Floating label inside the toggle */
      .ms-float-label {
        position: absolute;
        left: 44px; top: 50%;
        transform: translateY(-50%);
        font-size: 15px;
        font-weight: 400;
        color: var(--md-on-surface-low);
        background: var(--md-surface);
        padding: 0 5px;
        pointer-events: none;
        z-index: 1;
        line-height: 1;
        white-space: nowrap;
        transition:
          top 180ms cubic-bezier(.2,0,0,1),
          font-size 180ms cubic-bezier(.2,0,0,1),
          color 180ms cubic-bezier(.2,0,0,1),
          transform 180ms cubic-bezier(.2,0,0,1);
      }
      /* Floated when open or has value */
      .ms-toggle.open .ms-float-label,
      .ms-toggle.has-value .ms-float-label {
        top: 0;
        font-size: 11px;
        font-weight: 500;
        transform: translateY(-50%);
        color: var(--md-on-surface-med);
        letter-spacing: .03em;
      }
      .ms-toggle.open .ms-float-label { color: var(--md-primary); }

      /* The actual selected-value text */
      .ms-display {
        flex: 1;
        font-size: 15px;
        color: var(--md-on-surface);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }
      /* Hide display text when no selection (label acts as placeholder) */
      .ms-toggle:not(.has-value) .ms-display { opacity: 0; pointer-events: none; }

      /* Trailing chevron */
      .ms-arrow {
        position: absolute;
        right: 12px; top: 50%; transform: translateY(-50%);
        color: var(--md-on-surface-low);
        transition: transform 200ms ease, color var(--transition);
        flex-shrink: 0;
      }
      .ms-toggle.open .ms-arrow { transform: translateY(-50%) rotate(180deg); color: var(--md-primary); }

      /* Dropdown menu */
      .ms-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0; right: 0;
        z-index: 50;
        background: var(--md-surface);
        border-radius: var(--radius-md);
        box-shadow: var(--elev-3);
        max-height: 240px;
        overflow-y: auto;
        display: none;
        animation: popIn 220ms cubic-bezier(.34,1.56,.64,1) both;
      }
      .ms-menu.open { display: block; }
      @keyframes popIn {
        from { opacity: 0; transform: scaleY(.88) translateY(-6px); transform-origin: top; }
        to   { opacity: 1; transform: scaleY(1) translateY(0); }
      }

      .ms-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        cursor: pointer;
        font-size: 14px;
        color: var(--md-on-surface);
        transition: background var(--transition);
      }
      .ms-item:hover { background: var(--md-primary-light); }
      .ms-item:has(input:checked),
      .ms-item.ms-selected { background: var(--md-primary-container); font-weight: 500; }
      .ms-item input[type="checkbox"] {
        width: 16px; height: 16px; min-width: 16px;
        accent-color: var(--md-primary);
        cursor: pointer;
        flex-shrink: 0;
        padding: 0; border: none; background: none;
      }

      /* ── Action bar (bottom toolbar Google style) ── */
      .action-bar {
        max-width: 880px;
        margin: 20px auto 0;
        padding: 0 16px;
        display: flex;
        gap: 12px;
        animation: fadeUp .3s .1s ease both;
      }

      /* MD3 Buttons */
      .btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 24px;
        height: 40px;
        border: none;
        border-radius: var(--radius-pill);
        font-family: var(--font);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: .01em;
        transition: background var(--transition), box-shadow var(--transition);
        position: relative;
        overflow: hidden;
      }
      /* Ripple-like active state */
      .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: currentColor;
        opacity: 0;
        transition: opacity .15s;
      }
      .btn:active::after { opacity: .1; }

      /* MD3 Outlined button */
      .btn-ghost {
        background: transparent;
        color: var(--md-primary);
        border: 1px solid var(--md-outline);
      }
      .btn-ghost:hover {
        background: var(--md-primary-light);
        border-color: var(--md-primary);
      }

      /* MD3 Filled button */
      .btn-primary {
        background: var(--md-primary);
        color: var(--md-on-primary);
        box-shadow: var(--elev-1);
      }
      .btn-primary:hover {
        background: var(--md-primary-dark);
        box-shadow: var(--elev-2);
      }

      /* MD3 Filled tonal — confirm button, same blue palette as primary */
      .btn-success {
        background: var(--md-primary);
        color: var(--md-on-primary);
        box-shadow: var(--elev-1);
      }
      .btn-success:hover {
        background: var(--md-primary-dark);
        box-shadow: var(--elev-2);
      }
      .btn-success:disabled,
      .btn-primary:disabled {
        background: rgba(32,33,36,.12);
        color: rgba(32,33,36,.38);
        cursor: not-allowed;
        box-shadow: none;
      }

      /* ── Preview overlay (MD3 Dialog style) ── */
      #previewOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--md-bg);
        z-index: 200;
        overflow-y: auto;
        align-items: flex-start;
        justify-content: center;
        padding: 40px 16px 60px;
      }
      #previewOverlay.visible { display: flex; }
      body.overlay-open { overflow: hidden; }

      .preview-card {
        background: var(--md-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--elev-3);
        max-width: 600px;
        width: 100%;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: scaleIn .2s ease both;
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(.96); }
        to   { opacity: 1; transform: scale(1); }
      }

      .preview-body {
        flex: 1;
        overflow-y: auto;
        padding: 0 24px;
      }
      .preview-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--md-outline);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .preview-header .icon-wrap {
        width: 40px; height: 40px;
        background: var(--md-primary-light);
        border-radius: 50%;
        display: grid; place-items: center;
        color: var(--md-primary);
        flex-shrink: 0;
      }
      .preview-header h2 {
        font-size: 18px;
        font-weight: 400;
        color: var(--md-on-surface);
      }
      .preview-header p {
        font-size: 13px;
        color: var(--md-on-surface-med);
        margin-top: 2px;
      }
      .preview-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--md-outline);
        font-size: 14px;
      }
      .preview-row:last-child { border-bottom: none; }
      .preview-key {
        font-size: 12px;
        font-weight: 500;
        color: var(--md-on-surface-med);
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 140px;
      }
      .preview-val { color: var(--md-on-surface); text-align: right; font-size: 14px; }
      .preview-val.empty { color: var(--md-on-surface-low); font-style: italic; }
      .preview-actions {
        padding: 12px 24px 20px;
        border-top: 1px solid var(--md-outline);
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .preview-actions .btn { flex: none; }

      /* ── Changed row highlight (Google's yellow chip) ── */
      .preview-row.changed {
        background: #fef7e0;
        margin: 0 -24px;
        padding-left: 24px;
        padding-right: 24px;
      }
      .preview-row.changed .preview-val { color: #b05e00; font-weight: 500; }
      .changed-badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: #b05e00;
        background: #fce8b2;
        border-radius: var(--radius-pill);
        padding: 1px 6px;
        margin-left: 6px;
        vertical-align: middle;
      }

      /* ── Spinner ── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin-icon { animation: spin .7s linear infinite; }

      /* ── Animations ── */
      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <header class="page-header">
      <div class="logo-mark">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <div>
        <h1>Editar Datos del Paciente</h1>
        <p>Modifica los campos y revisa los cambios antes de guardar</p>

    </header>

    <div class="content-wrap">

    <!-- Form (real <form> tag so FormData works) -->
    <div class="card">
      <form id="editForm">

          // Section groupings — order matters

          // SVG icon paths per field
          function iconFor(h) {

            if (hl.indexOf("tel")    !== -1)  return 'M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z';
            if (hl.indexOf("patolog")!== -1)  return 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2';
            if (hl.indexOf("observ") !== -1)  return 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z';
            return 'M4 6h16M4 12h16M4 18h16';
          }

          // SVG icon path for each section
          function sectionIconFor(name) {
            var nl = name.toLowerCase();
            if (nl.indexOf("personal")  !== -1) return 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z';
            if (nl.indexOf("estado")    !== -1 || nl.indexOf("clasif") !== -1) return 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z';
            if (nl.indexOf("contacto")  !== -1) return 'M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z';
            if (nl.indexOf("diagn")     !== -1) return 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2';
            if (nl.indexOf("observ")    !== -1) return 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z';
            return 'M4 6h16M4 12h16M4 18h16';

          // Render one section worth of fields
          function renderSection(sectionName, fieldList) {
            var fieldsToRender = fieldList.filter(function(f){ return headerMap[f] !== undefined; });

            var sIcon = sectionIconFor(sectionName);
        ?>

                         onclick="toggleSingle('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">

                    </div>
                    <input type="hidden" name="<?= h ?>" id="val<?= idSuffix ?>" value="<?= val || opcionesGravedad[0] ?>">
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesGravedad.forEach(function(opt){ ?>
                        <div class="ms-item<?= val === opt ? ' ms-selected' : '' ?>"

                    </div>

                <? } else if (h.indexOf("Ingreso") !== -1) { ?>
                  <div class="multiselect" id="ms_<?= idSuffix ?>">
                    <div class="ms-toggle has-value" id="toggle<?= idSuffix ?>"
                         onclick="toggleSingle('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">

                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>"><?= val || opcionesIngreso[0] ?></span>
                      <svg class="ms-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                    </div>
                    <input type="hidden" name="<?= h ?>" id="val<?= idSuffix ?>" value="<?= val || opcionesIngreso[0] ?>">
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesIngreso.forEach(function(opt){ ?>
                        <div class="ms-item<?= val === opt ? ' ms-selected' : '' ?>"
                             onclick="selectSingle('<?= idSuffix ?>','<?= opt.replace(/'/g,"\\'") ?>')">
                          <?= opt ?>
                        </div>
                      <? }); ?>
                    </div>
                  </div>

                <? } else if (h.indexOf("Patología") !== -1) { ?>
                  <div class="multiselect">
                    <div class="ms-toggle <?= selVals.length > 0 ? 'has-value' : '' ?>"
                         id="toggle<?= idSuffix ?>"
                         onclick="toggleMs('menu<?= idSuffix ?>',this)">
                      <div class="ms-leading">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="<?= icon ?>"/></svg>
                      </div>
                      <span class="ms-float-label"><?= h ?></span>
                      <span class="ms-display" id="label<?= idSuffix ?>">— Selecciona —</span>
                      <svg class="ms-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                      </svg>
                    </div>
                    <div class="ms-menu" id="menu<?= idSuffix ?>">
                      <? opcionesPatologia.forEach(function(opt){ ?>
                        <label class="ms-item">
                          <input type="checkbox" name="<?= h ?>" value="<?= opt ?>"
                                 <?= selVals.indexOf(opt) !== -1 ? "checked" : "" ?>
                                 onchange="updateMsLabel('<?= idSuffix ?>','<?= h ?>')">
                          <?= opt ?>

                      <? }); ?>

                <? } else { ?>
                  <div class="field-inner">

                      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="<?= icon ?>"/></svg>

                           id="field_<?= idSuffix ?>"

                      <? if (isReadOnly) { ?><span class="readonly-badge">Solo lectura</span><? } ?>

            </svg>
            Volver a editar
          </button>
          <button type="button" class="btn btn-success" id="btnConfirmar" onclick="confirmarEnvio()">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            Confirmar y Guardar
          </button>

    <script>
      var rowIdx = <?= rowIdx ?>;

      // ── Floating label sync — drives .floated class on all text/date inputs ──
      function syncFloated(inp) {
        var label = inp.parentElement.querySelector('label.field-label');
        var hasVal = inp.value && inp.value.trim() !== '';
        if (label) {
          if (hasVal) label.classList.add('floated');
          else label.classList.remove('floated');
        }
        // For date inputs: toggle has-value to control native text visibility
        if (inp.type === 'date') {
          if (hasVal) inp.classList.add('has-value');
          else inp.classList.remove('has-value');
        }
      }

      // On load: float labels for inputs that already have a value (server-rendered)
      document.querySelectorAll('.field-inner input[type="text"], .field-inner input[type="date"]').forEach(function(inp) {
        syncFloated(inp);
        inp.addEventListener('input',  function() { syncFloated(inp); });
        inp.addEventListener('change', function() { syncFloated(inp); });
      });

      // ── Date badge ──
      document.getElementById('badgeDate').textContent =
        new Date().toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

      // ── Phone formatter ──
      function formatPhone(val) {
        var d = val.replace(/\D/g, '').slice(0, 9);
        var f = d.slice(0, 3);
        if (d.length > 3) f += ' ' + d.slice(3, 5);
        if (d.length > 5) f += ' ' + d.slice(5, 7);
        if (d.length > 7) f += ' ' + d.slice(7, 9);
        return f;
      }
      document.querySelectorAll('input[name="Teléfono 1"], input[name="Teléfono 2"]').forEach(function(inp) {
        inp.value = formatPhone(inp.value);
        inp.addEventListener('input', function() { inp.value = formatPhone(inp.value); });
      });

      // ── Init multiselect labels ──
      <? headers.forEach(function(h) {
           if (h.indexOf("Patología") !== -1) {
             var s = h.replace(/\s/g, '');
      ?>
      updateMsLabel('<?= s ?>', '<?= h ?>');
      <? } }); ?>

      // ── Multiselect helpers ──
      function toggleMs(menuId, toggleEl) {
        var menu   = document.getElementById(menuId);
        var isOpen = menu.classList.contains('open');
        // close all
        document.querySelectorAll('.ms-menu.open').forEach(function(m) {
          m.classList.remove('open');
          m.previousElementSibling.classList.remove('open');
        });
        if (!isOpen) {
          menu.classList.add('open');
          toggleEl.classList.add('open');
        }
      }

      // ── Single-select helpers (Estado, Gravedad, Tipo de Ingreso) ──
      function toggleSingle(menuId, toggleEl) {
        var menu   = document.getElementById(menuId);
        var isOpen = menu.classList.contains('open');
        document.querySelectorAll('.ms-menu.open').forEach(function(m) {
          m.classList.remove('open');
          m.previousElementSibling.classList.remove('open');
        });
        if (!isOpen) {
          menu.classList.add('open');
          toggleEl.classList.add('open');
        }
      }

      function selectSingle(suffix, value) {
        // Update hidden input
        var hiddenInput = document.getElementById('val' + suffix);
        if (hiddenInput) hiddenInput.value = value;
        // Update display label
        var label = document.getElementById('label' + suffix);
        if (label) label.textContent = value;
        // Mark selected item
        var menu = document.getElementById('menu' + suffix);
        if (menu) {
          menu.querySelectorAll('.ms-item').forEach(function(item) {
            item.classList.toggle('ms-selected', item.textContent.trim() === value.trim());
          });
          menu.classList.remove('open');
        }
        var toggle = document.getElementById('toggle' + suffix);
        if (toggle) { toggle.classList.remove('open'); toggle.classList.add('has-value'); }
      }

      function updateMsLabel(suffix, name) {
        var checked = document.querySelectorAll('input[name="' + name + '"]:checked');
        var label   = document.getElementById('label' + suffix);
        var toggle  = document.getElementById('toggle' + suffix);
        var values  = Array.from(checked).map(function(cb){ return cb.value; });
        label.textContent = values.length ? values.join(', ') : '— Selecciona —';
        toggle.classList.toggle('has-value', values.length > 0);
      }

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.multiselect')) {
          document.querySelectorAll('.ms-menu.open').forEach(function(m) {
            m.classList.remove('open');
            m.previousElementSibling.classList.remove('open');
          });
        }
      });

      // ── Capture original values on load ──
      var originalData = {};
      window.addEventListener('load', function() {
        originalData = recogerDatos();
      });

      // ── Collect form data ──
      function recogerDatos() {
        var form = document.getElementById('editForm');
        var data = {};
        var fd   = new FormData(form);

        var names = [];
        fd.forEach(function(val, key) { if (names.indexOf(key) === -1) names.push(key); });

        names.forEach(function(name) {
          var values = fd.getAll(name);
          data[name] = values.join(', ');
        });

        // Also capture disabled inputs (FormData skips them)
        form.querySelectorAll('input:disabled').forEach(function(el) {
          if (el.name) data[el.name] = el.value;
        });

        return data;
      }

      function displayVal(val) {
        if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
          return val.split('-').reverse().join('/');
        }
        return val;
      }

      // ── Preview ──
      function mostrarResumen() {
        var data = recogerDatos();
        var html = '';
        var changedCount = 0;

        for (var key in data) {
          if (key === 'Nº') continue;
          var val     = displayVal(data[key]);
          var origVal = displayVal(originalData[key] || '');
          var changed = val !== origVal;
          if (changed) changedCount++;

          html += '<div class="preview-row' + (changed ? ' changed' : '') + '">' +
                    '<span class="preview-key">' + key +
                      (changed ? '<span class="changed-badge">modificado</span>' : '') +
                    '</span>' +
                    '<span class="preview-val' + (!val ? ' empty' : '') + '">' + (val || '—') + '</span>' +
                  '</div>';
        }

        // Update header subtitle with count
        var subtitle = document.querySelector('.preview-header p');
        if (subtitle) {
          subtitle.textContent = changedCount > 0
            ? changedCount + ' campo' + (changedCount > 1 ? 's' : '') + ' modificado' + (changedCount > 1 ? 's' : '') + '. Revisa antes de guardar.'
            : 'No se detectaron cambios respecto a los valores originales.';
        }

        document.getElementById('resumenContent').innerHTML = html;
        document.getElementById('previewOverlay').classList.add('visible');
        document.body.classList.add('overlay-open');
      }

      function ocultarResumen() {
        document.getElementById('previewOverlay').classList.remove('visible');
        document.body.classList.remove('overlay-open');
      }

      // ── Save ──
      function confirmarEnvio() {
        var data = recogerDatos();
        var btn  = document.getElementById('btnConfirmar');
        btn.innerHTML = '<svg class="spin-icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Guardando…';
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function() { google.script.host.close(); })
          .withFailureHandler(function(err) {
            alert('Error al guardar: ' + err);
            btn.innerHTML = '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Confirmar y Guardar';
            btn.disabled = false;
          })
          .actualizarPaciente(data, rowIdx);
      }
    </script>
  </body>
