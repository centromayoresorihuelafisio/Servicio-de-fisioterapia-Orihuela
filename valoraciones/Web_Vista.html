<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valoraciones</title>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button, input, select, textarea { font-family: inherit; line-height: inherit; }

      <?!= include('ui/CSS_Global'); ?>

      html, body { height: 100%; }
      body { font-family: var(--font); background: var(--md-bg); color: var(--md-on-surface); display: flex; flex-direction: column; font-size: 13px; }

      /* ===== Tema claro / oscuro (mismos tokens y misma clave 'temaApp' que Base de Datos y Agenda) ===== */
      :root, :root[data-tema="claro"] { color-scheme: light; --md-texto-secundario: #45494f; --on-warn: #6b4300; --on-err: #9c2a1f; --on-purple: #5a2596; }
      :root[data-tema="oscuro"] { --md-texto-secundario: #c7cdd8; --on-warn: #f6d58a; --on-err: #f7c5c2; --on-purple: #dcc3fb; }
      @media (prefers-color-scheme: dark) { :root:not([data-tema]) { --md-texto-secundario: #c7cdd8; --on-warn: #f6d58a; --on-err: #f7c5c2; --on-purple: #dcc3fb;
        --md-primary:#8ab4f8;--md-primary-dark:#c2e7ff;--md-primary-light:#1f3a5a;--md-primary-container:#274a72;--md-on-primary:#0b2544;
        --md-success:#7fd39b;--md-success-bg:#173a24;--md-error:#f2b8b5;--md-error-bg:#3b1f1e;--md-warning:#f0c66a;--md-warning-bg:#3a3120;--md-purple:#c9a6f7;--md-purple-bg:#2f2440;
        --md-bg:#121418;--md-surface:#1b1e24;--md-surface-variant:#242830;--md-outline:#333944;--md-on-surface:#e6e8ee;--md-on-surface-med:#aab1c0;--md-on-surface-low:#7f8797;--tabs-bg:#1b2733;color-scheme:dark; } }
      :root[data-tema="oscuro"] { --md-primary:#8ab4f8;--md-primary-dark:#c2e7ff;--md-primary-light:#1f3a5a;--md-primary-container:#274a72;--md-on-primary:#0b2544;
        --md-success:#7fd39b;--md-success-bg:#173a24;--md-error:#f2b8b5;--md-error-bg:#3b1f1e;--md-warning:#f0c66a;--md-warning-bg:#3a3120;--md-purple:#c9a6f7;--md-purple-bg:#2f2440;
        --md-bg:#121418;--md-surface:#1b1e24;--md-surface-variant:#242830;--md-outline:#333944;--md-on-surface:#e6e8ee;--md-on-surface-med:#aab1c0;--md-on-surface-low:#7f8797;--tabs-bg:#1b2733;color-scheme:dark; }

      /* ===== Pestañas ===== */
      nav.tabs-cambio { display: flex; gap: .25rem; flex-shrink: 0; background: var(--md-bg); padding: .5rem .75rem 0; border-bottom: 1px solid var(--md-outline); }
      nav.tabs-cambio a.tab-cambio { display: inline-flex; align-items: center; gap: .4rem; background: transparent; color: var(--md-primary-dark); text-decoration: none; font-family: var(--font); font-weight: 600; font-size: .82rem; padding: .5rem 1rem; border-radius: 8px 8px 0 0; transition: var(--transition); }
      nav.tabs-cambio a.tab-cambio:hover { background: rgba(0,74,119,.05); }
      nav.tabs-cambio a.tab-cambio.activo { background: var(--md-primary-container); color: var(--md-primary-dark); cursor: default; }
      nav.tabs-cambio a.tab-cambio .material-symbols-outlined { font-size: 18px; }

      /* ===== Cabecera ===== */
      header.top { background: var(--md-surface); border-bottom: 1px solid var(--md-outline); padding: .75rem 1rem; flex-shrink: 0; box-shadow: 0 1px 4px rgba(32,33,36,.08); position: relative; z-index: 5; }
      header.top h1 { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: .5rem; margin-bottom: .6rem; }
      h1 .material-symbols-outlined { font-size: 22px; color: var(--md-primary); }
      header.top .contador { font-size: .78rem; color: var(--md-on-surface-med); font-weight: 400; }
      .barra-herramientas { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-bottom: .6rem; }
      .controles { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
      .separador-toolbar { width: 1px; align-self: stretch; background: var(--md-outline); margin: .2rem .3rem; }

      .btn-toolbar { display: inline-flex; align-items: center; gap: .3rem; background: var(--md-surface); border: 1px solid var(--md-outline); color: var(--md-on-surface); border-radius: var(--radius-pill); padding: .35rem .8rem; font-size: .8rem; font-weight: 500; cursor: pointer; transition: var(--transition); }
      .btn-toolbar:hover { background: var(--md-surface-variant); }
      .btn-toolbar.primario { background: var(--md-primary-container); border-color: transparent; color: var(--md-primary-dark); }
      .btn-toolbar.primario:hover { filter: brightness(.96); background: var(--md-primary-container); }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      .btn-toolbar .material-symbols-outlined { font-size: 17px; }
      .btn-nav { width: 38px; padding: 0; justify-content: center; }
      .btn-toolbar.deshacer { display: none; background: var(--md-warning-bg); border-color: var(--md-warning); color: var(--on-warn); }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar:focus-visible, .btn-fila:focus-visible, .chip-met:focus-visible, .ficha-acc:focus-visible, .ficha-sec:focus-visible, nav.tabs-cambio a:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

      .buscador { display: flex; align-items: center; gap: .4rem; background: var(--md-surface-variant); border-radius: var(--radius-pill); padding: .4rem .8rem; flex: 0 1 420px; min-width: 220px; min-height: 34px; }
      .buscador:focus-within { box-shadow: 0 0 0 2px var(--md-primary); }
      .buscador input { border: none; outline: none; flex: 1; font-size: .85rem; background: transparent; color: var(--md-on-surface); min-width: 0; }
      .buscador .material-symbols-outlined { color: var(--md-on-surface-low); font-size: 18px; }
      mark { background: #fff1a8; color: inherit; border-radius: 3px; padding: 0 1px; }
      :root[data-tema="oscuro"] mark { background: #5c4d0f; }
      @media (prefers-color-scheme: dark) { :root:not([data-tema]) mark { background: #5c4d0f; } }

      /* ===== Tabla principal (filas de dos líneas, acciones al hover) ===== */
      .tabla-wrap { flex: 1; overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #c4c9d0 transparent; }
      table { border-collapse: collapse; width: 100%; min-width: 1180px; }
      thead th { position: sticky; top: 0; background: var(--md-surface-variant); color: var(--md-on-surface-med); font-size: .68rem; text-transform: uppercase; letter-spacing: .02em; font-weight: 600; text-align: left; padding: .55rem .8rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; z-index: 2; }
      thead th.ordenable { cursor: pointer; user-select: none; }
      thead th.ordenable:hover { color: var(--md-primary); }
      thead th.ordenable .material-symbols-outlined { font-size: 15px; vertical-align: -3px; opacity: 0; transition: opacity 120ms; }
      thead th.ordenable:hover .material-symbols-outlined { opacity: .5; }
      thead th.orden-asc .material-symbols-outlined, thead th.orden-desc .material-symbols-outlined { opacity: 1 !important; color: var(--md-primary); }
      thead th.orden-desc .material-symbols-outlined { transform: rotate(180deg); }
      thead th.col-usuario, tbody td.col-usuario { position: sticky; left: 0; width: 300px; min-width: 300px; max-width: 300px; z-index: 3; box-shadow: 1px 0 0 var(--md-outline); }
      tbody tr { cursor: pointer; background: var(--md-surface); transition: background-color 120ms; }
      tbody tr:hover { background: var(--md-primary-light); }
      tbody tr.seleccionada { background: var(--md-primary-container); }
      tbody tr.seleccionada td.col-usuario { box-shadow: inset 3px 0 0 var(--md-primary), 1px 0 0 var(--md-outline); }
      tbody tr.fila-activa td.col-usuario { box-shadow: inset 3px 0 0 var(--md-on-surface-low), 1px 0 0 var(--md-outline); }
      tbody tr > td { background-color: inherit; padding: .55rem .8rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; vertical-align: middle; }
      td.notas { max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: var(--md-on-surface-med); }
      .vacio { color: var(--md-on-surface-low); font-style: italic; }

      .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; background: hsl(var(--h) 55% 88%); color: hsl(var(--h) 45% 28%); }
      :root[data-tema="oscuro"] .avatar { background: hsl(var(--h) 55% 26%); color: hsl(var(--h) 45% 82%); }
      @media (prefers-color-scheme: dark) { :root:not([data-tema]) .avatar { background: hsl(var(--h) 55% 26%); color: hsl(var(--h) 45% 82%); } }
      .avatar.grande { width: 52px; height: 52px; font-size: 1.1rem; }
      .celda-u { display: flex; align-items: center; gap: .7rem; min-width: 0; }
      .doble { display: flex; flex-direction: column; min-width: 0; }
      .u-nombre { font-weight: 600; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; }
      .u-sub, .c-sub { font-size: .78rem; font-weight: 500; color: var(--md-texto-secundario); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
      .f-fecha { font-weight: 600; font-size: .88rem; font-variant-numeric: tabular-nums; }

      /* Píldoras de severidad, chips de tipo y evolución */
      .badge { font-size: .76rem; font-weight: 600; padding: .15rem .6rem; border-radius: var(--radius-pill); white-space: nowrap; font-variant-numeric: tabular-nums; }
      .badge.sev-ok    { background: var(--md-success-bg); color: var(--md-success); }
      .badge.sev-medio { background: var(--md-warning-bg); color: var(--on-warn); }
      .badge.sev-alto  { background: var(--md-error-bg);   color: var(--on-err); }
      .badge.sev-vacio { background: var(--md-surface-variant); color: var(--md-on-surface-low); }
      .tipo-chip { font-size: .72rem; font-weight: 600; padding: .14rem .6rem; border-radius: 999px; background: var(--md-surface-variant); color: var(--md-on-surface-med); }
      .tipo-chip.inicial { background: var(--md-purple-bg); color: var(--on-purple); }
      .tipo-chip.seguimiento { background: var(--md-primary-light); color: var(--md-primary-dark); }
      .tipo-chip.final { background: var(--md-success-bg); color: var(--md-success); }
      .delta { display: inline-flex; align-items: center; gap: .05rem; font-size: .78rem; font-weight: 700; font-variant-numeric: tabular-nums; }
      .delta .material-symbols-outlined { font-size: 16px; }
      .delta.mejora { color: var(--md-success); } .delta.empeora { color: var(--md-error); } .delta.igual { color: var(--md-on-surface-low); }

      td.acciones-fila { text-align: right; width: 56px; }
      .btn-fila { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--md-on-surface-med); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 120ms, background 120ms; }
      tbody tr:hover .btn-fila, tbody tr.seleccionada .btn-fila, .hist:hover .btn-fila, .btn-fila:focus-visible { opacity: 1; }
      .btn-fila:hover { background: rgba(0,0,0,.07); color: var(--md-primary); }
      .btn-fila.peligro:hover { background: var(--md-error-bg); color: var(--md-error); }
      .btn-fila .material-symbols-outlined { font-size: 19px; }
      @media (hover: none) { .btn-fila { opacity: 1; } }

      .estado-vacio { display: flex; flex-direction: column; align-items: center; gap: .6rem; text-align: center; color: var(--md-on-surface-med); padding: 3rem 1rem; font-size: .9rem; }
      .estado-vacio .material-symbols-outlined.grande { font-size: 40px; color: var(--md-on-surface-low); }
      .skeleton-fila { display: flex; align-items: center; gap: .7rem; padding: .7rem 1.2rem; border-bottom: 1px solid var(--md-outline); }
      .sk { background: linear-gradient(90deg, var(--md-surface-variant) 25%, var(--md-outline) 50%, var(--md-surface-variant) 75%); background-size: 200% 100%; animation: sk-anim 1.3s infinite; border-radius: 8px; }
      @keyframes sk-anim { from { background-position: 200% 0; } to { background-position: -200% 0; } }

      /* ===== Ficha lateral: evolución + historial ===== */
      .ficha { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100%; z-index: 900; display: flex; flex-direction: column; background: var(--md-surface); border-left: 1px solid var(--md-outline); box-shadow: -6px 0 24px rgba(0,0,0,.08); transform: translateX(100%); visibility: hidden; transition: transform 160ms cubic-bezier(.2,0,0,1), visibility 0s 160ms; will-change: transform; }
      .ficha.abierta { transform: none; visibility: visible; transition-delay: 0s; }
      .ficha-cab { display: flex; align-items: center; gap: .9rem; padding: 1rem 1rem .6rem 1.2rem; }
      .ficha-tit { flex: 1; min-width: 0; }
      .ficha-nombre { font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      .ficha-sub { font-size: .78rem; color: var(--md-on-surface-med); margin-top: 2px; }
      .ficha-cerrar { border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; color: var(--md-on-surface-med); align-self: flex-start; }
      .ficha-cerrar:hover { background: var(--md-surface-variant); }
      .kpis { display: flex; gap: .6rem; padding: 0 1.2rem .8rem; }
      .kpi { flex: 1; background: var(--md-surface-variant); border-radius: 12px; padding: .6rem .8rem; }
      .kpi-etq { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--md-on-surface-low); font-weight: 600; margin-bottom: .35rem; }
      .kpi-val { display: flex; align-items: center; gap: .6rem; }
      .kpi-val .badge { font-size: .95rem; padding: .15rem .7rem; }
      .ficha-acciones { display: flex; gap: .4rem; padding: 0 1.2rem .9rem; border-bottom: 1px solid var(--md-outline); }
      .ficha-acc { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid var(--md-outline); background: var(--md-surface); border-radius: 999px; padding: .35rem .8rem; font-size: .78rem; font-weight: 500; cursor: pointer; color: var(--md-on-surface); }
      .ficha-acc.primario { background: var(--md-primary-container); border-color: transparent; color: var(--md-primary-dark); }
      .ficha-acc:hover { background: var(--md-surface-variant); }

      /* Formulario de Nueva valoración dentro de la ficha (valoraciones/Panel_Valoracion) */
      .ficha-form-cab { flex: none; display: flex; align-items: center; gap: .5rem; padding: .7rem .8rem; border-bottom: 1px solid var(--md-outline); }
      .ficha-form-cab button { border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; color: var(--md-on-surface-med); display: inline-flex; align-items: center; justify-content: center; }
      .ficha-form-cab button:hover { background: var(--md-surface-variant); }
      .ficha-form-cab button:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
      .ficha-form-tit { flex: 1; min-width: 0; font-size: .95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ficha-form-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ficha-form-cuerpo > * { flex: 1 1 auto; min-height: 0; }
      .ficha-acc .material-symbols-outlined { font-size: 17px; }
      .ficha-cuerpo { flex: 1; overflow: auto; padding: .4rem 1.2rem 1.2rem; }
      .f-sec { padding: .8rem 0; border-bottom: 1px solid var(--md-outline); }
      .f-sec:last-child { border-bottom: none; }
      .f-sec h3 { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--md-on-surface-low); font-weight: 600; margin-bottom: .55rem; }
      .chips-met { display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .6rem; }
      .chip-met { border: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface-med); border-radius: 999px; padding: .2rem .7rem; font-size: .74rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
      .chip-met:hover { background: var(--md-surface-variant); }
      .chip-met.activo { background: var(--md-primary-container); border-color: transparent; color: var(--md-primary-dark); }

      .grafica-evolucion { display: block; width: 100%; height: auto; }
      .linea-grafica { stroke: var(--md-primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .area-grafica { fill: var(--md-primary); fill-opacity: .1; }
      .guia-grafica { stroke: var(--md-outline); stroke-width: 1; stroke-dasharray: 2,3; }
      .etiqueta-grafica { font-size: 11px; fill: var(--md-on-surface-low); font-family: var(--font); }
      .valor-grafica { font-size: 11px; font-weight: 700; fill: var(--md-on-surface); font-family: var(--font); }
      .punto-grafica { stroke: var(--md-surface); stroke-width: 2; }
      .punto-grafica.sev-ok { fill: var(--md-success); } .punto-grafica.sev-medio { fill: var(--md-warning); } .punto-grafica.sev-alto { fill: var(--md-error); }
      .sin-datos-grafica { color: var(--md-on-surface-low); font-size: .82rem; font-style: italic; }

      .hist { border: 1px solid var(--md-outline); border-radius: 14px; padding: .65rem .8rem; margin-bottom: .55rem; }
      .hist:hover { background: var(--md-surface-variant); }
      .hist-cab { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
      .hist-cab .f-fecha { font-size: .86rem; }
      .hist-cab .espaciador { flex: 1; }
      .hist-cab .btn-fila { width: 28px; height: 28px; }
      .hist-vals { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45rem .5rem; }
      .mv { display: flex; flex-direction: column; gap: .15rem; align-items: flex-start; }
      .mv-etq { font-size: .62rem; text-transform: uppercase; letter-spacing: .04em; color: var(--md-on-surface-low); font-weight: 600; }
      .hist-notas { margin-top: .5rem; font-size: .8rem; color: var(--md-on-surface-med); overflow-wrap: anywhere; }

      @media (min-width: 900px) {
        body.con-ficha nav.tabs-cambio, body.con-ficha header.top, body.con-ficha .tabla-wrap { margin-right: 520px; }
        body.con-ficha table { min-width: 0; }
        body.con-ficha thead th.sec, body.con-ficha tbody td.sec { display: none; }
        body.con-ficha thead th.col-usuario, body.con-ficha tbody td.col-usuario { width: 260px; min-width: 260px; max-width: 260px; }
      }

      /* ===== Avisos, modales, progreso ===== */
      .toast-deshacer { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #323232; color: #fff; padding: .65rem 1rem; border-radius: 10px; display: flex; align-items: center; gap: 1rem; font-size: .82rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 200ms ease, visibility 0s 200ms; }
      .toast-deshacer.visible { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 200ms ease; }
      .toast-deshacer button { background: none; border: none; color: #8ab4f8; font-weight: 700; font-size: .82rem; cursor: pointer; padding: 0; letter-spacing: .02em; }
      .toast-deshacer button:hover { text-decoration: underline; }
      .toasts { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); display: flex; flex-direction: column; gap: .4rem; align-items: center; z-index: 1300; pointer-events: none; }
      .toast-aviso { background: #323232; color: #fff; padding: .6rem 1rem; border-radius: 10px; font-size: .82rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: min(92vw, 460px); animation: entra-toast .2s ease; transition: opacity .25s, transform .25s; }
      .toast-aviso.error { background: #8c1d18; }
      .toast-aviso.saliendo { opacity: 0; transform: translateY(6px); }
      @keyframes entra-toast { from { opacity: 0; transform: translateY(8px); } }
      .barra-progreso { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1400; opacity: 0; pointer-events: none; transition: opacity 150ms; background: linear-gradient(90deg, transparent, var(--md-primary), transparent); background-size: 40% 100%; background-repeat: no-repeat; }
      body.ocupado .barra-progreso { opacity: 1; animation: barrido 1s linear infinite; }
      @keyframes barrido { from { background-position: -40% 0; } to { background-position: 140% 0; } }

      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(32,33,36,.5); align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
      .modal-overlay.visible { display: flex; }
      .modal-box { background: var(--md-surface); border-radius: 14px; padding: 1.25rem 1.5rem; max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
      .modal-box.modal-box-ancho { max-width: 520px; max-height: 90vh; overflow: auto; }
      .modal-titulo { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
      .modal-mensaje { font-size: .88rem; color: var(--md-on-surface); white-space: pre-line; line-height: 1.45; margin-bottom: 1.15rem; }
      .modal-botones { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.1rem; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem .9rem; }
      .form-grid label { font-size: .76rem; color: var(--md-on-surface-med); font-weight: 500; display: flex; flex-direction: column; gap: .25rem; }
      .form-grid label.campo-ancho { grid-column: 1 / -1; }

    <script>
      var PACIENTES = [];
      var pacienteSeleccionado = null; // clave del paciente (p.clave: 'D:'+DNI o 'N:'+nombre si no tiene DNI) o null
      var metricaActual = 'funcionGlobal';
      var filaEnEdicion = null;
      var nombreEnEdicion = null, fechaEnEdicion = null, dniEnEdicion = null; // para que el servidor compruebe que la fila sigue siendo la misma
      var ordenCampo = null, ordenDir = 1; // 1 = asc, -1 = desc
      var ultimosFiltrados = [], filaActiva = null;
      var formularioActivo = false, controladorForm = null, formularioNombre = '';   // formulario de Nueva valoración abierto en la ficha

      // Columnas de la tabla principal. sec = se oculta con la ficha abierta para que la tabla quepa.
      var COLS = [
        { k: 'pegDolor', etq: 'PEG Dolor' }, { k: 'pegActividad', etq: 'PEG Actividad' }, { k: 'pegVida', etq: 'PEG Vida' },
        { k: 'mediaColumna', etq: 'Columna', sec: true }, { k: 'mediaMS', etq: 'M. Superior', sec: true }, { k: 'mediaMI', etq: 'M. Inferior', sec: true },
        { k: 'funcionGlobal', etq: 'Función Global' }, { k: 'analgesicos', etq: 'Analgésicos', sec: true }
      ];
      var METRICAS = [
        { k: 'pegDolor', etq: 'PEG Dolor' }, { k: 'pegActividad', etq: 'PEG Actividad' }, { k: 'pegVida', etq: 'PEG Vida' },
        { k: 'analgesicos', etq: 'Analgésicos' }, { k: 'funcionGlobal', etq: 'Función Global' },
        { k: 'mediaColumna', etq: 'Columna' }, { k: 'mediaMS', etq: 'Miembro Superior' }, { k: 'mediaMI', etq: 'Miembro Inferior' }
      ];
      // Máximo de cada escala para la gráfica (Analgésicos es 0-5; el resto 0-10).
      var ESCALA_MAX = { analgesicos: 5 };
      var ETQ_CORTA = { pegDolor: 'Dolor', pegActividad: 'Actividad', pegVida: 'Vida', analgesicos: 'Analgés.', mediaColumna: 'Columna', mediaMS: 'M. Sup.', mediaMI: 'M. Inf.', funcionGlobal: 'F. Global' };
      var ORDEN_MINI = ['pegDolor', 'pegActividad', 'pegVida', 'analgesicos', 'mediaColumna', 'mediaMS', 'mediaMI', 'funcionGlobal'];

      // ---------- Utilidades ----------
      function normalizar(txt) { return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }
      function esc(t) { return (t === null || t === undefined ? '' : String(t)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
      function resalta(txt, termino) {
        var s = esc(txt || '');
        if (!termino) return s;
        try { return s.replace(new RegExp('(' + termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); } catch (err) { return s; }
      }
      function formatearFechaCorta(fechaISO) {
        if (!fechaISO) return '—';
        var partes = fechaISO.split('-'); // yyyy-MM-dd
        return partes[2] + '/' + partes[1] + '/' + partes[0].slice(2);
      }
      function formatearTel(t) {
        var s = String(t || '').replace(/[^\d+]/g, ''), pref = '', num = s, m = s.match(/^(\+\d{1,3})(\d{9})$/);
        if (m) { pref = m[1] + ' '; num = m[2]; }
        return /^\d{9}$/.test(num) ? pref + num.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : String(t || '').trim();
      }
      function avatarHtml(nombre, extra) {
        var n = (nombre || '').toString().trim();
        if (!n) return '';
        var p = n.split(/\s+/), ini = (p[0].charAt(0) + (p.length > 1 ? p[1].charAt(0) : p[0].charAt(1))).toUpperCase(), hue = 0, low = n.toLowerCase();
        for (var i = 0; i < low.length; i++) hue = (hue * 31 + low.charCodeAt(i)) % 360;
        return '<span class="avatar' + (extra ? ' ' + extra : '') + '" style="--h:' + hue + '">' + esc(ini) + '</span>';
      }
      var pendientes = 0;
      function ocupado(d) { pendientes = Math.max(0, pendientes + d); document.body.classList.toggle('ocupado', pendientes > 0); }

      // ---------- Carga de datos ----------
      function cargar() {
        ocupado(1);
        google.script.run
          .withSuccessHandler(function(res) {
            ocupado(-1);
            if (res.error) { mostrarError(res.error); return; }
            PACIENTES = res.pacientes || [];
            render();
            // Si había un paciente con el ficha abierta, se refresca con los datos nuevos (o se cierra si ya no existe).
            renderFicha();
          })
          .withFailureHandler(function(err) { ocupado(-1); mostrarError(err); })
          .obtenerValoracionesWeb();
      }
      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio"><span class="material-symbols-outlined grande">error</span>No se pudieron cargar las valoraciones.<div>' + esc(err && err.message ? err.message : err) + '</div></div>';
      }

      // ---------- Píldoras de severidad ----------
      // La dirección del color depende del tipo de escala (ver valoraciones/Guardar_Vista.html):
      // - PEG Dolor/Actividad/Vida: 0-10, ALTO = MALO.
      // - Columna/M.Superior/M.Inferior/Función Global: 0-10, ALTO = BUENO.
      // - Analgésicos: 0-5, ALTO = MALO.
      function claseSeveridadDolor(v) { return v <= 3 ? 'sev-ok' : v <= 6 ? 'sev-medio' : 'sev-alto'; }
      function claseSeveridadFuncion(v) { return v <= 3 ? 'sev-alto' : v <= 7 ? 'sev-medio' : 'sev-ok'; }
      function claseSeveridadAnalgesicos(v) { return v <= 2 ? 'sev-ok' : v === 3 ? 'sev-medio' : 'sev-alto'; }
      var TIPO_METRICA = {
        pegDolor: 'dolor', pegActividad: 'dolor', pegVida: 'dolor',
        mediaColumna: 'funcion', mediaMS: 'funcion', mediaMI: 'funcion', funcionGlobal: 'funcion',
        analgesicos: 'analg'
      };
      function claseSeveridad(valor, campo) {
        var tipo = TIPO_METRICA[campo] || 'dolor';
        if (tipo === 'funcion') return claseSeveridadFuncion(valor);
        if (tipo === 'analg') return claseSeveridadAnalgesicos(valor);
        return claseSeveridadDolor(valor);
      }
      function renderPill(valor, campo) {
        if (valor === null || valor === undefined) return '<span class="badge sev-vacio">—</span>';
        return '<span class="badge ' + claseSeveridad(valor, campo) + '">' + valor + '</span>';
      }
      function chipTipo(tipo) {
        if (!tipo) return '<span class="vacio">—</span>';
        var c = normalizar(tipo);
        return '<span class="tipo-chip ' + (c === 'inicial' ? 'inicial' : c === 'seguimiento' ? 'seguimiento' : c === 'final' ? 'final' : '') + '">' + esc(tipo) + '</span>';
      }

      // ---------- Evolución respecto a la valoración anterior ----------
      // Compara las dos últimas valoraciones que tienen valor en esa métrica.
      // Mejora = sube en escalas de función, baja en dolor y analgésicos.
      function deltaHtml(historial, campo) {
        var v = [];
        for (var i = historial.length - 1; i >= 0 && v.length < 2; i--) {
          if (historial[i][campo] !== null && historial[i][campo] !== undefined) v.push(historial[i][campo]);
        }
        if (v.length < 2) return '<span class="vacio">—</span>';
        var d = Math.round((v[0] - v[1]) * 10) / 10;
        var mejora = TIPO_METRICA[campo] === 'funcion' ? d > 0 : d < 0;
        var cls = d === 0 ? 'igual' : (mejora ? 'mejora' : 'empeora');
        var ico = d === 0 ? 'remove' : (d > 0 ? 'arrow_upward' : 'arrow_downward');
        return '<span class="delta ' + cls + '" title="Respecto a la valoración anterior"><span class="material-symbols-outlined">' + ico + '</span>' + (d > 0 ? '+' : '') + d + '</span>';
      }

      // ---------- Tabla principal ----------
      function thCol(campo, texto, clase) {
        var dir = ordenCampo === campo ? (ordenDir === 1 ? 'orden-asc' : 'orden-desc') : '';
        return '<th class="ordenable ' + (clase || '') + ' ' + dir + '" data-orden="' + campo + '">' + texto + '<span class="material-symbols-outlined">arrow_upward</span></th>';
      }
      function claveOrden(p) {
        if (ordenCampo === 'nombre') return normalizar(p.nombre);
        if (ordenCampo === 'fecha') return p.ultima.fecha || '';
        var v = p.ultima[ordenCampo];
        return (v === null || v === undefined) ? -Infinity : v;
      }
      function ordenarFiltrados(lista) {
        if (!ordenCampo) return lista; // orden del servidor: última valoración más reciente primero
        return lista.slice().sort(function(a, b) {
          var x = claveOrden(a), y = claveOrden(b);
          return (x < y ? -1 : x > y ? 1 : 0) * ordenDir;
        });
      }

      function htmlFila(p, termino) {
        var u = p.ultima, sel = pacienteSeleccionado === p.clave;
        return '<tr data-nombre="' + esc(p.clave) + '" class="' + (sel ? 'seleccionada' : '') + '">' +
          '<td class="col-usuario"><div class="celda-u">' + avatarHtml(p.nombre) + '<div class="doble"><div class="u-nombre">' + resalta(p.nombre, termino) + '</div><div class="u-sub">' +
            (p.dni ? esc(p.dni) + ' · ' : '') + (p.telefono ? esc(formatearTel(p.telefono)) : 'Sin teléfono') + ' · ' + p.numValoraciones + (p.numValoraciones === 1 ? ' valoración' : ' valoraciones') + '</div></div></div></td>' +
          '<td><div class="doble"><div class="f-fecha">' + formatearFechaCorta(u.fecha) + '</div><div class="c-sub">' + chipTipo(u.tipo) + '</div></div></td>' +
          COLS.map(function(c) { return '<td' + (c.sec ? ' class="sec"' : '') + '>' + renderPill(u[c.k], c.k) + '</td>'; }).join('') +
          '<td>' + deltaHtml(p.historial, 'funcionGlobal') + '</td>' +
          '<td class="notas sec' + (u.notas ? '' : ' vacio') + '" title="' + esc(u.notas || '') + '">' + (u.notas ? esc(u.notas) : '—') + '</td>' +
          '</tr>';
      }

      function render() {
        var termino = document.getElementById('inputBusqueda').value.trim();
        var terminoNorm = normalizar(termino);
        var filtrados = PACIENTES.filter(function(p) { return !terminoNorm || normalizar(p.nombre).indexOf(terminoNorm) !== -1; });
        filtrados = ordenarFiltrados(filtrados);
        ultimosFiltrados = filtrados;
        document.getElementById('contador').textContent = filtrados.length + ' de ' + PACIENTES.length;

        var cont = document.getElementById('tablaWrap'), scroll = cont.scrollTop;
        if (PACIENTES.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">monitoring</span>Todavía no hay valoraciones registradas.</div>';
          return;
        }
        if (filtrados.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">search_off</span>No se encontró ningún usuario con ese criterio.</div>';
          return;
        }
        cont.innerHTML = '<table><thead><tr>' +
          thCol('nombre', 'Usuario', 'col-usuario') + thCol('fecha', 'Última valoración') +
          COLS.map(function(c) { return thCol(c.k, c.etq, c.sec ? 'sec' : ''); }).join('') +
          '<th title="Variación de Función Global respecto a la valoración anterior">Evolución</th><th class="sec">Notas</th></tr></thead><tbody>' +
          filtrados.map(function(p) { return htmlFila(p, termino); }).join('') + '</tbody></table>';
        cont.scrollTop = scroll;
        marcarFilaActiva();
      }

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var th = e.target.closest('th.ordenable');
        if (th) {
          // Ciclo: dirección inicial → inversa → sin orden (vuelve al orden del servidor).
          var campo = th.dataset.orden, inicial = campo === 'nombre' ? 1 : -1;
          if (ordenCampo !== campo) { ordenCampo = campo; ordenDir = inicial; }
          else if (ordenDir === inicial) ordenDir = -inicial;
          else { ordenCampo = null; ordenDir = 1; }
          render();
          return;
        }
        var tr = e.target.closest('tbody tr[data-nombre]');
        if (!tr) return;
        var nombre = tr.getAttribute('data-nombre');
        if (pacienteSeleccionado === nombre) cerrarDetalle(); else mostrarDetalle(nombre);
      });

      // ---------- Navegación con teclado ----------
      function marcarFilaActiva() {
        document.querySelectorAll('tbody tr').forEach(function(tr) { tr.classList.toggle('fila-activa', tr.getAttribute('data-nombre') === filaActiva); });
      }
      function moverFilaActiva(delta) {
        if (!ultimosFiltrados.length) return;
        var idx = -1;
        ultimosFiltrados.forEach(function(p, i) { if (p.clave === filaActiva) idx = i; });
        idx = Math.min(ultimosFiltrados.length - 1, Math.max(0, idx + delta));
        filaActiva = ultimosFiltrados[idx].clave;
        marcarFilaActiva();
        var el = document.querySelector('tbody tr.fila-activa');
        if (el) el.scrollIntoView({ block: 'nearest' });
      }
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (document.getElementById('modalEditarOverlay').classList.contains('visible')) { cerrarModalEditar(); return; }
          if (document.querySelector('.modal-overlay.visible')) return;
          // Con el formulario abierto, Esc lo cierra (pidiendo confirmación si hay cambios) y vuelve a la ficha
          if (formularioActivo) { volverDeFormulario(); return; }
          if (pacienteSeleccionado) cerrarDetalle();
          return;
        }
        var enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
        if (e.key === '/' && !enCampo) { e.preventDefault(); document.getElementById('inputBusqueda').focus(); return; }
        if (enCampo || document.querySelector('.modal-overlay.visible')) return;
        if (formularioActivo) return;   // el foco está en el formulario: las flechas y Enter no mueven la tabla
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moverFilaActiva(e.key === 'ArrowDown' ? 1 : -1); }
        else if (e.key === 'Enter' && filaActiva) { if (pacienteSeleccionado === filaActiva) cerrarDetalle(); else mostrarDetalle(filaActiva); }
      });

      // ---------- Ficha lateral (evolución + historial) ----------
      function pacienteActual() {
        return PACIENTES.find(function(x) { return x.clave === pacienteSeleccionado; }) || null;
      }
      // Antes de cualquier acción que destruiría el formulario abierto (otro paciente, cerrar la ficha…): si hay
      // cambios sin guardar pregunta; si se acepta, el formulario queda descartado.
      function hayCambiosSinGuardar() {
        return !!(formularioActivo && controladorForm && controladorForm.haCambiado && controladorForm.haCambiado());
      }
      async function descartarFormularioSiProcede() {
        if (!hayCambiosSinGuardar()) return true;
        if (!(await mostrarConfirm('Hay cambios sin guardar en el formulario. ¿Quieres descartarlos?'))) return false;
        formularioActivo = false; controladorForm = null;
        return true;
      }
      async function mostrarDetalle(nombre) {
        if (!(await descartarFormularioSiProcede())) return;
        if (formularioActivo) { formularioActivo = false; controladorForm = null; }
        if (!PACIENTES.some(function(x) { return x.clave === nombre; })) { cerrarDetalle(); return; }   // `nombre` aquí es la clave
        pacienteSeleccionado = nombre;
        filaActiva = nombre;
        renderFicha();
        document.querySelectorAll('#tablaWrap tbody tr').forEach(function(tr) { tr.classList.toggle('seleccionada', tr.getAttribute('data-nombre') === nombre); });
        marcarFilaActiva();
      }
      async function cerrarDetalle() {
        if (!(await descartarFormularioSiProcede())) return;
        formularioActivo = false; controladorForm = null;
        pacienteSeleccionado = null;
        renderFicha();
        document.querySelectorAll('#tablaWrap tbody tr').forEach(function(tr) { tr.classList.remove('seleccionada'); });
      }

      function renderFicha() {
        if (formularioActivo) return;   // el formulario ocupa la ficha: se queda como está hasta que se cierre
        var el = document.getElementById('ficha'), p = pacienteSeleccionado ? pacienteActual() : null;
        if (pacienteSeleccionado && !p) pacienteSeleccionado = null; // ya no tiene valoraciones (p.ej. se borró la última)
        document.body.classList.toggle('con-ficha', !!p);
        el.classList.toggle('abierta', !!p);
        el.setAttribute('aria-hidden', p ? 'false' : 'true');
        if (!p) return;
        var cuerpo = el.querySelector('.ficha-cuerpo'), scroll = cuerpo ? cuerpo.scrollTop : 0;
        el.innerHTML = htmlFicha(p);
        cuerpo = el.querySelector('.ficha-cuerpo');
        if (cuerpo) cuerpo.scrollTop = scroll;
        document.querySelectorAll('#tablaWrap tbody tr').forEach(function(tr) { tr.classList.toggle('seleccionada', tr.getAttribute('data-nombre') === p.clave); });
      }

      function htmlFicha(p) {
        var u = p.ultima, h = p.historial;
        var kpi = function(campo, etq) { return '<div class="kpi"><div class="kpi-etq">' + etq + '</div><div class="kpi-val">' + renderPill(u[campo], campo) + deltaHtml(h, campo) + '</div></div>'; };
        var chips = METRICAS.map(function(m) { return '<button type="button" class="chip-met' + (m.k === metricaActual ? ' activo' : '') + '" title="Ver la evolución de ' + m.etq.toLowerCase() + '" data-metrica="' + m.k + '">' + m.etq + '</button>'; }).join('');
        return '<div class="ficha-cab">' + avatarHtml(p.nombre, 'grande') + '<div class="ficha-tit"><div class="ficha-nombre">' + esc(p.nombre) + '</div><div class="ficha-sub">' +
            (p.dni ? esc(p.dni) + ' · ' : '') + (p.telefono ? esc(formatearTel(p.telefono)) : 'Sin teléfono') + ' · ' + p.numValoraciones + (p.numValoraciones === 1 ? ' valoración' : ' valoraciones') + '</div></div>' +
            '<button type="button" class="ficha-cerrar" data-ficha="cerrar" title="Cerrar (Esc)"><span class="material-symbols-outlined">close</span></button></div>' +
          '<div class="kpis">' + kpi('funcionGlobal', 'Función Global') + kpi('pegDolor', 'PEG Dolor') + '</div>' +
          '<div class="ficha-acciones"><button title="Nueva valoración de este usuario" type="button" class="ficha-acc primario" data-acc="nueva"><span class="material-symbols-outlined">assignment</span>Nueva valoración</button>' +
            (p.telefono ? '<button title="Copiar el teléfono" type="button" class="ficha-acc" data-acc="copiar-tel"><span class="material-symbols-outlined">content_copy</span>Copiar teléfono</button>' : '') + '</div>' +
          '<div class="ficha-cuerpo">' +
            '<section class="f-sec"><h3>Evolución</h3><div class="chips-met">' + chips + '</div>' + htmlGrafica(h) + '</section>' +
            '<section class="f-sec"><h3>Historial</h3>' + h.slice().reverse().map(htmlHistorial).join('') + '</section>' +
          '</div>';
      }

      function htmlHistorial(r) {
        return '<article class="hist"><div class="hist-cab"><span class="f-fecha">' + formatearFechaCorta(r.fecha) + '</span>' + chipTipo(r.tipo) + '<span class="espaciador"></span>' +
          '<button type="button" class="btn-fila" data-fila="' + r._fila + '" data-accion="editar" title="Editar valoración"><span class="material-symbols-outlined">edit</span></button>' +
          '<button type="button" class="btn-fila peligro" data-fila="' + r._fila + '" data-accion="eliminar" title="Eliminar valoración"><span class="material-symbols-outlined">delete</span></button></div>' +
          '<div class="hist-vals">' + ORDEN_MINI.map(function(k) { return '<div class="mv"><span class="mv-etq">' + ETQ_CORTA[k] + '</span>' + renderPill(r[k], k) + '</div>'; }).join('') + '</div>' +
          (r.notas ? '<div class="hist-notas">' + esc(r.notas) + '</div>' : '') + '</article>';
      }

      // ---------- Gráfica de evolución (SVG, sin librerías externas) ----------
      function htmlGrafica(historial) {
        // Proporción fija: el CSS (width:100% + height:auto) la escala sin distorsión.
        var W = 480, H = 210, padL = 26, padR = 18, padT = 22, padB = 26, n = historial.length;
        var puntos = [];
        historial.forEach(function(h, i) {
          var v = h[metricaActual];
          if (v !== null && v !== undefined) puntos.push({ i: i, v: v, fecha: h.fecha, tipo: h.tipo });
        });
        if (puntos.length === 0) return '<p class="sin-datos-grafica">Sin datos suficientes para graficar esta métrica.</p>';

        var x = function(i) { return n <= 1 ? (padL + (W - padL - padR) / 2) : padL + (i / (n - 1)) * (W - padL - padR); };
        var max = ESCALA_MAX[metricaActual] || 10;
        var y = function(v) { return padT + (1 - v / max) * (H - padT - padB); };
        var linea = puntos.map(function(p, k) { return (k === 0 ? 'M' : 'L') + x(p.i).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
        var area = puntos.length > 1 ? linea + ' L' + x(puntos[puntos.length - 1].i).toFixed(1) + ',' + y(0).toFixed(1) + ' L' + x(puntos[0].i).toFixed(1) + ',' + y(0).toFixed(1) + ' Z' : '';
        var guias = (max === 5 ? [0, 1, 2, 3, 4, 5] : [0, 5, 10]).map(function(v) {
          var yy = y(v).toFixed(1);
          return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '" class="guia-grafica" /><text x="2" y="' + (parseFloat(yy) + 4) + '" class="etiqueta-grafica">' + v + '</text>';
        }).join('');
        var circulos = puntos.map(function(p) {
          return '<circle cx="' + x(p.i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="5" class="punto-grafica ' + claseSeveridad(p.v, metricaActual) + '"><title>' +
            formatearFechaCorta(p.fecha) + ' (' + esc(p.tipo) + '): ' + p.v + '</title></circle>';
        }).join('');
        var valores = puntos.length <= 8 ? puntos.map(function(p) {
          return '<text x="' + x(p.i).toFixed(1) + '" y="' + (y(p.v) - 10).toFixed(1) + '" text-anchor="middle" class="valor-grafica">' + p.v + '</text>';
        }).join('') : '';
        var fechas = historial.map(function(h, i) {
          if (n > 6 && i !== 0 && i !== n - 1) return '';
          var ancla = n === 1 ? 'middle' : (i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle'));
          var xx = i === 0 && n > 1 ? padL : (i === n - 1 && n > 1 ? W - padR : x(i));
          return '<text x="' + xx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + ancla + '" class="etiqueta-grafica">' + formatearFechaCorta(h.fecha) + '</text>';
        }).join('');
        return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="grafica-evolucion">' + guias + (area ? '<path d="' + area + '" class="area-grafica" />' : '') +
          '<path d="' + linea + '" class="linea-grafica" fill="none" />' + circulos + valores + fechas + '</svg>';
      }

      document.getElementById('ficha').addEventListener('click', function(e) {
        var t = e.target, c;
        if (t.closest('[data-ficha="cerrar"]')) { cerrarDetalle(); return; }
        if ((c = t.closest('[data-metrica]'))) { metricaActual = c.dataset.metrica; renderFicha(); return; }
        if ((c = t.closest('[data-acc]'))) {
          if (c.dataset.acc === 'nueva') document.getElementById('btnNuevaValoracion').click();
          else if (c.dataset.acc === 'copiar-tel') { var p = pacienteActual(); if (p) copiarTexto(p.telefono, 'Teléfono'); }
          return;
        }
        if ((c = t.closest('[data-accion]'))) {
          var p2 = pacienteActual();
          if (!p2) return;
          var fila = parseInt(c.dataset.fila, 10);
          var registro = p2.historial.find(function(h) { return h._fila === fila; });
          if (!registro) return;
          if (c.dataset.accion === 'editar') abrirModalEditar(registro); else eliminarValoracion(registro);
        }
      });

      // ---------- Copiar al portapapeles ----------
      function copiarTexto(txt, etiqueta) {
        var ok = false;
        try {
          var ta = document.createElement('textarea');
          ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
          document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
        } catch (err) { ok = false; }
        if (!ok && navigator.clipboard) { navigator.clipboard.writeText(txt); ok = true; }
        mostrarAviso(ok ? (etiqueta || 'Texto') + ' copiado.' : 'No se pudo copiar.');
      }

      // ---------- Editar valoración ----------
      function valorInputONulo_(id) {
        var v = document.getElementById(id).value;
        return v === '' ? null : Number(v);
      }
      function abrirModalEditar(registro) {
        filaEnEdicion = registro._fila;
        var pEd = pacienteActual();
        nombreEnEdicion = registro.nombre || (pEd ? pEd.nombre : '');
        dniEnEdicion = pEd ? pEd.dni : '';
        fechaEnEdicion = registro.fecha || '';
        document.getElementById('editFecha').value = registro.fecha || '';
        document.getElementById('editTipo').value = registro.tipo || 'Inicial';
        document.getElementById('editTelefono').value = registro.telefono || '';
        document.getElementById('editAnalgesicos').value = registro.analgesicos === null ? '' : registro.analgesicos;
        document.getElementById('editPegDolor').value = registro.pegDolor === null ? '' : registro.pegDolor;
        document.getElementById('editPegActividad').value = registro.pegActividad === null ? '' : registro.pegActividad;
        document.getElementById('editPegVida').value = registro.pegVida === null ? '' : registro.pegVida;
        document.getElementById('editFuncionGlobal').value = registro.funcionGlobal === null ? '' : registro.funcionGlobal;
        document.getElementById('editMediaColumna').value = registro.mediaColumna === null ? '' : registro.mediaColumna;
        document.getElementById('editMediaMS').value = registro.mediaMS === null ? '' : registro.mediaMS;
        document.getElementById('editMediaMI').value = registro.mediaMI === null ? '' : registro.mediaMI;
        document.getElementById('editNotas').value = registro.notas || '';
        document.getElementById('modalEditarOverlay').classList.add('visible');
      }
      function cerrarModalEditar() {
        filaEnEdicion = null;
        nombreEnEdicion = null;
        dniEnEdicion = null;
        fechaEnEdicion = null;
        document.getElementById('modalEditarOverlay').classList.remove('visible');
      }
      document.getElementById('btnCancelarEdicion').addEventListener('click', cerrarModalEditar);

      document.getElementById('btnGuardarEdicion').addEventListener('click', function() {
        if (!filaEnEdicion) return;
        var fecha = document.getElementById('editFecha').value;
        if (!fecha) { mostrarAviso('La fecha es obligatoria.'); return; }

        var datos = {
          fila: filaEnEdicion,
          nombreEsperado: nombreEnEdicion,
          dniEsperado: dniEnEdicion,
          fechaOriginal: fechaEnEdicion,
          fecha: fecha,
          tipo: document.getElementById('editTipo').value,
          telefono: document.getElementById('editTelefono').value,
          analgesicos: valorInputONulo_('editAnalgesicos'),
          pegDolor: valorInputONulo_('editPegDolor'),
          pegActividad: valorInputONulo_('editPegActividad'),
          pegVida: valorInputONulo_('editPegVida'),
          funcionGlobal: valorInputONulo_('editFuncionGlobal'),
          mediaColumna: valorInputONulo_('editMediaColumna'),
          mediaMS: valorInputONulo_('editMediaMS'),
          mediaMI: valorInputONulo_('editMediaMI'),
          notas: document.getElementById('editNotas').value
        };

        var btn = this;
        var textoOriginal = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Guardando…';
        ocupado(1);

        google.script.run
          .withSuccessHandler(function(res) {
            ocupado(-1);
            btn.disabled = false;
            btn.textContent = textoOriginal;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo guardar la valoración.'); return; }
            cerrarModalEditar();
            mostrarAviso('Valoración actualizada.');
            cargar();
          })
          .withFailureHandler(function(err) {
            ocupado(-1);
            btn.disabled = false;
            btn.textContent = textoOriginal;
            mostrarAviso('Error al guardar: ' + err);
          })
          .actualizarValoracionWeb(datos);
      });

      // ---------- Eliminar valoración ----------
      async function eliminarValoracion(registro) {
        var confirmado = await mostrarConfirm('¿Eliminar esta valoración?');
        if (!confirmado) return;

        // Foto completa de la valoración ANTES de borrarla (con el nombre del
        // paciente, que el registro no trae por sí solo), para poder deshacer.
        var pEl = pacienteActual();
        var snapshot = Object.assign({ nombre: pEl ? pEl.nombre : '', dni: pEl ? pEl.dni : '' }, registro);   // registro.nombre (el de esa fila) prevalece
        ocupado(1);

        google.script.run
          .withSuccessHandler(function(res) {
            ocupado(-1);
            if (!res.success) { mostrarAviso(res.message || 'No se pudo eliminar la valoración.'); return; }
            cargar();
            mostrarDeshacer(snapshot, 'Valoración eliminada.');
          })
          .withFailureHandler(function(err) { ocupado(-1); mostrarAviso('Error al eliminar: ' + err); })
          .eliminarValoracionWeb(registro._fila, snapshot.nombre, registro.fecha || '', snapshot.dni);
      }

      <?!= include('ui/JS_Modal_Deshacer'); ?>

      function ejecutarDeshacer() {
        if (!ultimaEliminacion || procesandoDeshacer) return;
        procesandoDeshacer = true;
        var snapshot = ultimaEliminacion;
        ocupado(1);

        google.script.run
          .withSuccessHandler(function(res) {
            ocupado(-1);
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; } // el botón sigue disponible para reintentar
            ocultarDeshacer();
            cargar();
          })
          .withFailureHandler(function(err) {
            ocupado(-1);
            procesandoDeshacer = false;
            mostrarAviso('Error al deshacer: ' + err); // el botón sigue disponible para reintentar
          })
          .restaurarValoracionWeb(snapshot);
      }

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);
      document.getElementById('btnDeshacer').addEventListener('click', ejecutarDeshacer);

      // ---------- Avisos ligeros (toasts): sustituyen al modal salvo textos largos o multilínea ----------
      // Se define DESPUÉS del include para sustituir al mostrarAviso() de JS_Modal_Deshacer, igual que en Base de Datos y Agenda.
      var contenedorToasts = (function() { var d = document.createElement('div'); d.className = 'toasts'; document.body.appendChild(d); return d; })();
      function mostrarAviso(mensaje) {
        var m = (mensaje === null || mensaje === undefined) ? '' : String(mensaje);
        if (m.indexOf('\n') !== -1 || m.length > 160) return mostrarDialogo(m, false);
        var t = document.createElement('div'), error = /^error|no se pudo|no se pudieron|bloqueado/i.test(m);
        t.className = 'toast-aviso' + (error ? ' error' : '');
        t.setAttribute('role', 'status');
        t.textContent = m;
        contenedorToasts.appendChild(t);
        setTimeout(function() { t.classList.add('saliendo'); setTimeout(function() { t.remove(); }, 260); }, error ? 6000 : 3800);
        return Promise.resolve(true);
      }

      // ---------- Nueva Valoración (formulario en la ficha lateral) ----------
      // El formulario (valoraciones/Panel_Valoracion) se monta dentro de la ficha, con el paciente seleccionado si lo hay.
      async function abrirFormularioValoracion() {
        var clave = pacienteSeleccionado || '';
        if (formularioActivo && formularioNombre === clave) return;   // ya está abierto para este paciente
        if (!(await descartarFormularioSiProcede())) return;
        var p = clave ? pacienteActual() : null, nombre = p ? p.nombre : '', el = document.getElementById('ficha');
        formularioActivo = true; formularioNombre = clave; controladorForm = null;
        document.body.classList.add('con-ficha');
        el.classList.add('abierta');
        el.setAttribute('aria-hidden', 'false');
        el.innerHTML = '<div class="ficha-form-cab"><button type="button" data-form="volver" title="' + (nombre ? 'Volver a la ficha (Esc)' : 'Cerrar (Esc)') + '"><span class="material-symbols-outlined">' + (nombre ? 'arrow_back' : 'close') + '</span></button><div class="ficha-form-tit"></div></div><div class="ficha-form-cuerpo"></div>';
        el.querySelector('.ficha-form-tit').textContent = 'Nueva valoración' + (nombre ? ' · ' + nombre : '');
        controladorForm = PanelValoracion.abrir(el.querySelector('.ficha-form-cuerpo'), {
          paciente: nombre,
          dni: p && p.dni ? p.dni : '',
          telefono: p && p.telefono ? String(p.telefono) : '',
          onGuardado: function() {
            mostrarAviso('Valoración guardada');
            if (formularioActivo) { formularioActivo = false; controladorForm = null; renderFicha(); }
            cargar();
          },
          onCancelar: function() { volverDeFormulario(); }
        });
      }
      async function volverDeFormulario() {
        if (!formularioActivo) return;
        if (!(await descartarFormularioSiProcede())) return;
        formularioActivo = false; controladorForm = null;
        renderFicha();
      }
      document.getElementById('btnNuevaValoracion').addEventListener('click', abrirFormularioValoracion);
      document.getElementById('ficha').addEventListener('click', function(e) {
        if (e.target.closest('[data-form="volver"]')) volverDeFormulario();
      });

      // Si otra ventana actualiza un paciente (las páginas sueltas ?page=… avisan por localStorage al guardar) o
      // guarda una valoración desde el panel lateral (Agenda, Base de Datos…), la tabla se recarga.
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado' || e.key === 'valoracionesActualizadas') cargar();
      });

      // ---------- Búsqueda ----------
      var temporizadorBusqueda = null;
      document.getElementById('inputBusqueda').addEventListener('input', function() {
        clearTimeout(temporizadorBusqueda);
        temporizadorBusqueda = setTimeout(render, 150);
      });

      // ---------- Tema: automático / oscuro / claro (compartido con las otras pestañas) ----------
      var TEMAS = ['auto', 'oscuro', 'claro'], ICONOS_TEMA = { auto: 'contrast', oscuro: 'dark_mode', claro: 'light_mode' };
      function aplicarTema(t, guardar) {
        if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);
        var b = document.getElementById('btnTema');
        b.innerHTML = '<span class="material-symbols-outlined">' + ICONOS_TEMA[t] + '</span>';
        b.title = 'Tema: ' + t + ' (clic para cambiar)';
        b.dataset.tema = t;
        if (guardar) { try { localStorage.setItem('temaApp', t); } catch (err) { /* sin almacenamiento */ } }
      }
      document.getElementById('btnTema').addEventListener('click', function() {
        aplicarTema(TEMAS[(TEMAS.indexOf(this.dataset.tema || 'auto') + 1) % TEMAS.length], true);
      });
      (function() {
        var t = 'auto';
        try { t = localStorage.getItem('temaApp') || 'auto'; } catch (err) { /* sin almacenamiento */ }
        aplicarTema(TEMAS.indexOf(t) === -1 ? 'auto' : t, false);
      })();

      cargar();
    </script>
