<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button, input, select { font-family: inherit; line-height: inherit; }

      <?!= include('ui/CSS_Global'); ?>

      /* Paleta propia de la Agenda: tonos Material 3 desaturados. Los rellenos
         de fila/día/turno son tintes translúcidos (rgba) que se apilan sobre
         un fondo blanco opaco, así las columnas fijas no dejan ver lo que hay
         debajo al desplazarse. */
      :root {
        --ag-accent:          #0b57d0;   /* primario: enlaces, foco, casillas */
        --ag-accent-hover:    #0949b0;
        --ag-accent-dark:     #004a77;   /* texto sobre contenedor tonal */
        --ag-container:       #c2e7ff;   /* botón primario y pestaña activa */
        --ag-container-hover: #a8d9f9;
        --ag-accent-soft:     rgba(194,231,255,.55);

        --ag-page:          #f8fafd;
        --ag-surface:       #ffffff;
        --ag-line:          #e3e8ef;
        --ag-text:          #1f2430;
        --ag-text-med:      #586074;
        --ag-text-low:      #8a93a6;

        --ag-tinte-par:     rgba(0,74,119,.075);
        --ag-tinte-hover:   rgba(0,120,212,.12);
        --ag-tinte-sel:     rgba(0,120,212,.22);
        --ag-tinte-dia:     rgba(0,74,119,.09);
        --ag-tinte-hoy:     rgba(0,120,212,.20);
        --ag-tinte-manana:  rgba(0,74,119,.04);
        --ag-tinte-tarde:   rgba(200,140,0,.10);
        --ag-day-bg:        #e9eef3;

        --ag-ok-bar:    #4c9f6a;
        --ag-mal-bar:   #d9706a;
        --ag-aviso-bar: #e3ad45;

        --ag-error:         #b3261e;
        --ag-error-bg:      #fdecea;
        --ag-warning-bg:    #fff4d6;
        --ag-warning-border:#f0c14b;
        --ag-warning-text:  #6d5320;
        --ag-warning-hover: #fdecc0;
        --ag-toast-bg:      #323232;
        --ag-toast-action:  #8ab4f8;
        --ag-overlay:       rgba(32,33,36,.5);
        --ag-t:             150ms ease;
        --alto-thead:       36px;
      }

      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--ag-page);
        color: var(--ag-text);
        display: flex;
        flex-direction: column;
        font-size: 14px;
        line-height: 1.5;
      }

      .btn-toolbar:focus-visible, .btn-fila:focus-visible, .btn-asis:focus-visible, .seg:focus-visible, .chip-filtro:focus-visible, .menu-item:focus-visible,
      nav.tabs-cambio a.tab-cambio:focus-visible, td a.link-hc:focus-visible {
        outline: 2px solid var(--ag-accent); outline-offset: 2px;
      }
      .toast-deshacer button:focus-visible { outline: 2px solid var(--ag-toast-action); outline-offset: 2px; }
      .buscador:focus-within, .selector-semana:focus-within { box-shadow: 0 0 0 2px var(--ag-accent); }

      /* ---------- Cabecera ---------- */
      header.top {
        background: var(--ag-surface);
        border-bottom: 1px solid var(--ag-line);
        padding: .6rem 1rem;
        flex-shrink: 0;
      }
      .barra { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; min-height: 40px; }
      .espaciador { flex: 1; }
      .contador { font-size: .8rem; color: var(--ag-text-med); white-space: nowrap; }

      .barra-seleccion { display: none; background: var(--ag-accent-soft); border-radius: 12px; padding: .3rem .6rem; }
      header.top.con-seleccion .barra-principal { display: none; }
      header.top.con-seleccion .barra-seleccion { display: flex; }
      .contador-seleccion { font-size: .85rem; font-weight: 600; color: var(--ag-accent-dark); margin-right: .25rem; }
      .separador { width: 1px; height: 22px; background: rgba(0,0,0,.15); margin: 0 .25rem; }

      /* ---------- Botones ---------- */
      .btn-toolbar {
        display: inline-flex; align-items: center; gap: .35rem;
        background: var(--ag-surface); border: 1px solid #cfd6e4; color: var(--ag-text);
        border-radius: 999px; padding: .4rem .9rem; font-size: .82rem; font-weight: 500;
        cursor: pointer; transition: all var(--ag-t); font-family: var(--font);
      }
      .btn-toolbar:hover { background: #eef2f9; }
      .btn-toolbar.primario { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .btn-toolbar.primario:hover { background: var(--ag-container-hover); border-color: var(--ag-container-hover); }
      .btn-toolbar.peligro { color: var(--ag-error); }
      .btn-toolbar.peligro:hover { background: var(--ag-error-bg); border-color: var(--ag-error); }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      .btn-toolbar .material-symbols-outlined { font-size: 18px; }
      .btn-toolbar.btn-nav { padding: .4rem .55rem; }
      .btn-toolbar.activo { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .btn-toolbar.deshacer { display: none; background: var(--ag-warning-bg); border-color: var(--ag-warning-border); color: var(--ag-warning-text); }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar.deshacer:hover { background: var(--ag-warning-hover); }
      .spin-icon { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .grupo-nav { display: inline-flex; }
      .grupo-nav .btn-toolbar { border-radius: 0; margin-left: -1px; position: relative; }
      .grupo-nav .btn-toolbar:first-child { border-radius: 999px 0 0 999px; margin-left: 0; }
      .grupo-nav .btn-toolbar:last-child { border-radius: 0 999px 999px 0; }
      .grupo-nav .btn-toolbar:hover, .grupo-nav .btn-toolbar:focus-visible { z-index: 1; }

      .etiqueta-semana {
        font-size: .82rem; font-weight: 600; color: var(--ag-accent-dark); white-space: nowrap;
        text-transform: capitalize; background: var(--ag-accent-soft); border-radius: 999px; padding: .3rem .85rem;
      }
      .selector-semana {
        display: flex; align-items: center; gap: .3rem;
        background: #eef1f7; border-radius: 999px; padding: .3rem .75rem;
      }
      .selector-semana .material-symbols-outlined { color: var(--ag-text-low); font-size: 18px; }
      .selector-semana input { border: none; outline: none; background: transparent; font-family: var(--font); font-size: .82rem; color: var(--ag-text); }

      .buscador {
        display: flex; align-items: center; gap: .4rem;
        background: #eef1f7; border-radius: 999px; padding: .4rem .85rem; flex: 0 1 320px; min-width: 200px;
      }
      .buscador input { border: none; outline: none; flex: 1; min-width: 0; font-size: .85rem; font-family: var(--font); background: transparent; color: var(--ag-text); }
      .buscador input::placeholder { color: var(--ag-text-low); }
      .buscador .material-symbols-outlined { color: var(--ag-text-low); font-size: 18px; }

      /* ---------- Toast de deshacer ---------- */
      .toast-deshacer {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: var(--ag-toast-bg); color: #fff; padding: .65rem 1rem; border-radius: 10px;
        display: flex; align-items: center; gap: 1rem; font-size: .82rem;
        box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200;
        opacity: 0; pointer-events: none; transition: opacity 200ms ease;
      }
      .toast-deshacer.visible { opacity: 1; pointer-events: auto; }
      .toast-deshacer button {
        background: none; border: none; color: var(--ag-toast-action); font-weight: 700; font-size: .82rem;
        cursor: pointer; font-family: var(--font); padding: 0; letter-spacing: .02em;
      }
      .toast-deshacer button:hover { text-decoration: underline; }

      /* ---------- Tabla ---------- */
      .tabla-wrap { flex: 1; overflow: auto; background: var(--ag-surface); }
      table {
        border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1180px;
        table-layout: fixed; font-variant-numeric: tabular-nums;
      }
      thead th {
        position: sticky; top: 0; background: #eef2f7; color: var(--ag-text-med);
        font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; text-align: left;
        height: var(--alto-thead); padding: 0 .8rem; border-bottom: 2px solid var(--ag-line);
        white-space: nowrap; z-index: 2;
      }
      /* Columnas 1 (casilla + Hora) y 2 (Usuario) fijas a la izquierda */
      thead th:nth-child(1), tbody td:nth-child(1) {
        position: sticky; left: 0; width: 92px; min-width: 92px; max-width: 92px;
        background-color: #eef2f7; z-index: 3; box-shadow: 1px 0 0 var(--ag-line);
      }
      tbody td:nth-child(1) { background-color: var(--ag-surface); z-index: 1; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        position: sticky; left: 92px; width: 320px; min-width: 320px; max-width: 320px;
        background-color: #eef2f7; z-index: 3; box-shadow: 1px 0 0 var(--ag-line);
      }
      tbody td:nth-child(2) { background-color: var(--ag-surface); z-index: 1; font-weight: 600; }
      thead th:nth-child(3), tbody td:nth-child(3) { width: 116px; }
      thead th:nth-child(4), tbody td:nth-child(4) { width: 70px; }
      thead th:nth-child(5), tbody td:nth-child(5) { width: 136px; }
      thead th:nth-child(6), tbody td:nth-child(6) { width: 120px; }

      /* Relleno de fila = fondo blanco opaco + tinte translúcido (--fila-tinte,
         que se define por fila y por estado: alterna, hover, seleccionada). */
      tbody td {
        background-color: var(--ag-surface);
        background-image: linear-gradient(var(--fila-tinte, transparent), var(--fila-tinte, transparent));
        padding: .6rem .8rem; border-bottom: 1px solid var(--ag-line);
        white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
      }
      /* Columna de la papelera: sin relleno lateral ni recorte. Con el relleno
         normal el botón (26px) no cabía en la columna y aparecían los "…". */
      thead th:nth-child(8), tbody td:nth-child(8) {
        width: 116px; padding: 0 .5rem; text-align: right; white-space: nowrap; overflow: visible; text-overflow: clip;
      }
      td.hora { font-weight: 700; font-size: .92rem; }
      td.vacio { color: var(--ag-text-low); font-style: italic; }
      td a.link-hc { color: var(--ag-accent); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: .2rem; }
      td a.link-hc:hover { text-decoration: underline; }
      .ic-15 { font-size: 15px; }

      tbody tr.fila-par { --fila-tinte: var(--ag-tinte-par); }
      tbody tr.fila-cita { cursor: pointer; }
      tbody tr.fila-cita:not(.seleccionada):hover { --fila-tinte: var(--ag-tinte-hover); }
      tbody tr.seleccionada { --fila-tinte: var(--ag-tinte-sel); }

      /* Barra de color de asistencia en el borde izquierdo */
      tbody tr.asist-ok td:nth-child(1)    { box-shadow: inset 4px 0 0 var(--ag-ok-bar),    1px 0 0 var(--ag-line); }
      tbody tr.asist-mal td:nth-child(1)   { box-shadow: inset 4px 0 0 var(--ag-mal-bar),   1px 0 0 var(--ag-line); }
      tbody tr.asist-aviso td:nth-child(1) { box-shadow: inset 4px 0 0 var(--ag-aviso-bar), 1px 0 0 var(--ag-line); }

      /* Casilla de selección */
      .hora-celda { display: inline-flex; align-items: center; gap: .55rem; }
      .chk {
        width: 16px; height: 16px; flex-shrink: 0; position: relative;
        border: 1.5px solid var(--ag-text-low); border-radius: 4px;
        background: var(--ag-surface); transition: all var(--ag-t);
      }
      .chk.oculto { visibility: hidden; }
      tbody tr.fila-cita:hover .chk { border-color: var(--ag-accent); }
      tbody tr.seleccionada .chk { background: var(--ag-accent); border-color: var(--ag-accent); }
      tbody tr.seleccionada .chk::after {
        content: ''; position: absolute; left: 4px; top: 0; width: 4px; height: 8px;
        border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
      }

      /* Cabecera de día: banda tonal, fijada bajo el encabezado de columnas */
      tbody tr.fila-dia td {
        position: sticky !important; top: calc(var(--alto-thead) - 1px); left: 0; z-index: 2;
        width: auto !important; min-width: 0 !important; max-width: none !important;
        background-color: var(--ag-surface) !important;
        background-image: linear-gradient(var(--ag-tinte-dia), var(--ag-tinte-dia)) !important;
        color: var(--ag-text); font-weight: 700; font-size: .88rem; text-transform: capitalize;
        padding: .6rem .9rem; border-bottom: 1px solid var(--ag-line); white-space: normal; box-shadow: none !important;
      }
      tbody tr.fila-dia.hoy td {
        background-image: linear-gradient(var(--ag-tinte-hoy), var(--ag-tinte-hoy)) !important;
        color: var(--ag-accent-dark); box-shadow: inset 4px 0 0 var(--ag-accent) !important;
      }
      .dia-cab { display: flex; align-items: center; gap: .7rem; }
      .dia-hoy {
        background: rgba(255,255,255,.75); color: var(--ag-accent-dark); border-radius: 999px;
        padding: .05rem .65rem; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      }
      .dia-stats { margin-left: auto; font-size: .76rem; font-weight: 500; color: var(--ag-text-med); text-transform: none; }

      /* Etiqueta de turno */
      tbody tr.fila-turno td {
        position: static !important; width: auto !important; min-width: 0 !important; max-width: none !important;
        font-weight: 700; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
        padding: .3rem .9rem; border-bottom: 1px solid var(--ag-line); box-shadow: none !important;
      }
      tbody tr.fila-turno.manana td {
        background-image: linear-gradient(var(--ag-tinte-manana), var(--ag-tinte-manana)) !important; color: var(--ag-text-med);
      }
      tbody tr.fila-turno.tarde td {
        background-image: linear-gradient(var(--ag-tinte-tarde), var(--ag-tinte-tarde)) !important; color: var(--ag-warning-text);
      }

      /* Hueco libre */
      tbody tr.fila-hueco td { color: var(--ag-text-low); }
      td.hueco-libre { cursor: pointer; }
      .chip-asignar {
        display: inline-flex; align-items: center; gap: .1rem;
        border: 1px dashed var(--ag-accent); color: var(--ag-accent); border-radius: 999px;
        padding: .02rem .7rem .02rem .35rem; font-size: .74rem; font-weight: 600; font-style: normal;
        transition: all var(--ag-t);
      }
      .chip-asignar .material-symbols-outlined { font-size: 14px; }
      td.hueco-libre:hover .chip-asignar { background: var(--ag-accent); border-style: solid; color: #fff; }

      /* Chips de asistencia */
      .chip {
        display: inline-flex; align-items: center; gap: .35rem; max-width: 100%;
        padding: .15rem .7rem; border-radius: 999px;
        font-size: .76rem; font-weight: 600; font-style: normal; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
      .chip-ok { background: rgba(30,142,62,.15); color: #1b6a33; }
      .chip-mal { background: rgba(217,48,37,.13); color: #a52f29; }
      .chip-aviso { background: rgba(240,165,0,.20); color: #7a5200; }
      .chip-neutro { background: rgba(88,96,116,.14); color: #4a5265; }

      td.celda-notas { white-space: normal; max-width: none; }
      .notas-clamp {
        display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
        overflow: hidden; word-break: break-word; line-height: 1.35;
      }

      /* Edición en línea */
      td.editable { cursor: pointer; }
      td.editable:hover { --fila-tinte: var(--ag-tinte-hover); }
      td.editando, div.editando { padding: .25rem .4rem; overflow: visible; position: relative; }
      .estado-guardado {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        font-size: .8rem; font-weight: 700; pointer-events: none;
      }
      .estado-guardado.progreso { color: var(--ag-text-low); font-weight: 400; }
      .estado-guardado.ok { color: var(--ag-ok-bar); }
      .estado-guardado.fallo { color: var(--ag-mal-bar); }
      .input-celda {
        width: 100%; font-family: var(--font); font-size: .85rem; color: var(--ag-text);
        border: 1px solid var(--ag-accent); border-radius: 6px; padding: .25rem .4rem;
        background: var(--ag-surface); outline: none;
      }
      .estado-vacio { text-align: center; color: var(--ag-text-med); padding: 3rem 1rem; font-size: .9rem; }

      /* Esqueleto de carga */
      .esqueleto { background: var(--ag-surface); }
      .esq-dia { height: 36px; background: var(--ag-day-bg); }
      .esq-fila { display: flex; align-items: center; gap: 1.5rem; padding: .85rem 1rem; border-bottom: 1px solid var(--ag-line); }
      .esq-barra {
        display: block; height: 12px; border-radius: 6px;
        background: linear-gradient(90deg, #eef1f7 25%, #e0e5ee 50%, #eef1f7 75%);
        background-size: 200% 100%; animation: destello 1.3s linear infinite;
      }
      .esq-flex { flex: 1; }
      @keyframes destello { from { background-position: 200% 0; } to { background-position: -200% 0; } }

      /* ---------- Modal propio ---------- */
      .modal-overlay {
        display: none; position: fixed; inset: 0; background: var(--ag-overlay);
        align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
      }
      .modal-overlay.visible { display: flex; }
      .modal-box {
        background: var(--ag-surface); border-radius: 14px; padding: 1.25rem 1.5rem;
        max-width: 360px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.25);
      }
      .modal-mensaje { font-size: .88rem; color: var(--ag-text); white-space: pre-line; line-height: 1.45; margin-bottom: 1.15rem; }
      .modal-botones { display: flex; justify-content: flex-end; gap: .5rem; }

      /* Pestañas Agenda / Base de Datos / Valoraciones (enlaces con recarga,
         porque las Web Apps de Apps Script no se pueden embeber en iframe) */
      nav.tabs-cambio {
        display: flex; gap: .25rem; flex-shrink: 0;
        background: var(--ag-page); padding: .5rem .75rem 0;
        border-bottom: 1px solid var(--ag-line);
      }
      nav.tabs-cambio a.tab-cambio {
        display: inline-flex; align-items: center; gap: .35rem;
        background: transparent; color: var(--ag-accent-dark); text-decoration: none;
        font-family: var(--font); font-weight: 600; font-size: .82rem;
        padding: .5rem 1rem; border-radius: 8px 8px 0 0; transition: all var(--ag-t);
      }
      nav.tabs-cambio a.tab-cambio:hover { background: rgba(0,74,119,.05); }
      nav.tabs-cambio a.tab-cambio.activo { background: var(--ag-container); color: var(--ag-accent-dark); cursor: default; }
      nav.tabs-cambio a.tab-cambio .material-symbols-outlined { font-size: 18px; }

      /* ===== Barra secundaria: vista, filtros rápidos, densidad ===== */
      .barra-filtros { margin-top: .5rem; min-height: 32px; }
      .segmentado { display: inline-flex; background: #eef1f7; border-radius: 999px; padding: 2px; }
      .seg {
        border: none; background: transparent; padding: .25rem .9rem; border-radius: 999px;
        font-size: .8rem; font-weight: 600; color: var(--ag-text-med); cursor: pointer;
        font-family: var(--font); transition: all var(--ag-t);
      }
      .seg.activo { background: var(--ag-container); color: var(--ag-accent-dark); }
      .chip-filtro {
        display: inline-flex; align-items: center; gap: .35rem; border: 1px solid #cfd6e4;
        background: var(--ag-surface); color: var(--ag-text-med); border-radius: 999px;
        padding: .22rem .75rem; font-size: .78rem; font-weight: 600; cursor: pointer;
        font-family: var(--font); transition: all var(--ag-t);
      }
      .chip-filtro:hover { background: #eef2f9; }
      .chip-filtro.activo { background: var(--ag-container); border-color: var(--ag-container); color: var(--ag-accent-dark); }
      .chip-filtro .cnt { font-size: .7rem; background: rgba(0,74,119,.09); border-radius: 999px; padding: 0 .4rem; }

      /* ===== Menú desplegable (Copiar) ===== */
      .menu-wrap { position: relative; display: inline-block; }
      .menu {
        display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 250px;
        background: var(--ag-surface); border: 1px solid var(--ag-line); border-radius: 14px;
        padding: .35rem; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 1500;
      }
      .menu-wrap.abierto .menu { display: block; }
      .menu-item {
        display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; background: transparent;
        border: none; border-radius: 10px; padding: .5rem .7rem; font-size: .84rem; color: var(--ag-text);
        cursor: pointer; font-family: var(--font);
      }
      .menu-item:hover:not(:disabled) { background: var(--ag-accent-soft); }
      .menu-item:disabled { opacity: .45; cursor: not-allowed; }
      .menu-item small { display: block; color: var(--ag-text-med); font-size: .72rem; }

      /* ===== Banda de día: plegable + progreso ===== */
      tbody tr.fila-dia { cursor: pointer; }
      .dia-chevron { font-size: 20px; margin-left: -.3rem; opacity: .7; }
      .prog { width: 72px; height: 6px; border-radius: 999px; background: rgba(0,74,119,.12); overflow: hidden; flex-shrink: 0; }
      .prog > span { display: block; height: 100%; background: var(--ag-ok-bar); border-radius: 999px; }

      /* ===== Ahora / próxima / ya terminadas ===== */
      tbody tr.fila-ahora td {

    <script>
      // Hora ("HH:mm") a partir de la cual una cita es "de tarde".
      var HORA_CORTE_TARDE = '14:00';

      var filasSeleccionadas = new Set();

      // Columnas de Sheets que no se muestran (normalizadas: sin mayúsculas ni acentos).
      var COLUMNAS_OCULTAS = ['fecha', 'dia', 'id evento calendar', 'historia clinica'];

      var HEADERS = [];
      var HEADERS_VISIBLES = [];
      var CITAS = [];
      var COL_HISTORIA = null;
      var semanaActual = null; // lunes de la semana mostrada, "yyyy-MM-dd"
      var mostrarHuecos = false;
      var OPCIONES_ASISTENCIA = [];
      var NOMBRES_PACIENTES = [];
      var vista = 'semana';            // 'semana' (tabla) | 'hoy' (tarjetas del día de hoy)
      var filtrosActivos = new Set();  // 'sinAsistencia' | 'sinHC' | 'conNotas'
      var RECORDATORIOS = [];            // recordatorios genéricos (agenda/Recordatorios.gs)
      var plegadoManual = {};          // fechaISO -> true/false: días plegados o desplegados a mano
      var DURACION_CITA_MIN = 30;      // para marcar "Ahora" y atenuar las citas ya terminadas

      // Color del chip según el texto de Asistencia. Se evalúa EN ORDEN y gana
      // la primera coincidencia: primero las negativas ("No asistió", "Falta"),
      // después "pendiente" (gris), después avisos (ámbar) y por último las
      // positivas (verde). Lo que no encaje sale en gris neutro.
      var ESTILOS_ASISTENCIA = [
        { clase: 'mal',    patron: /^no\b|^sin asist|falt|ausen|plant|no (vino|asist|acud|se present)/ },
        { clase: 'neutro', patron: /pendient|por confirmar|sin confirmar|sin registrar/ },
        { clase: 'aviso',  patron: /cancel|anul|aplaz|recuper|justific|retras/ },
        { clase: 'ok',     patron: /asist|vino|presente|realiz|acudi|^si$|^ok$/ }
      ];

      function estiloAsistencia(valor) {
        var v = normalizar(valor);
        if (!v) return '';
        for (var i = 0; i < ESTILOS_ASISTENCIA.length; i++) {
          if (ESTILOS_ASISTENCIA[i].patron.test(v)) return ESTILOS_ASISTENCIA[i].clase;
        }
        return 'neutro';
      }

      function htmlEsqueleto() {
        var anchos = [44, 170, 90, 36, 80];
        var fila = '<div class="esq-fila">' +
          anchos.map(function(w) { return '<span class="esq-barra" style="width:' + w + 'px"></span>'; }).join('') +
          '<span class="esq-barra esq-flex"></span></div>';
        function filas(n) { var h = ''; for (var i = 0; i < n; i++) h += fila; return h; }
        return '<div class="esqueleto" aria-busy="true" aria-label="Cargando agenda">' +
          '<div class="esq-dia"></div><div class="esq-turno"></div>' + filas(5) +
          '<div class="esq-turno"></div>' + filas(4) +
          '<div class="esq-dia"></div><div class="esq-turno"></div>' + filas(4) + '</div>';
      }

      function cargarListaPacientes() {
        google.script.run
          .withSuccessHandler(function(res) {
            NOMBRES_PACIENTES = Object.keys(res.allPatientsData || {});
            document.getElementById('listaPacientes').innerHTML =
              NOMBRES_PACIENTES.map(function(n) { return '<option value="' + escapar(n) + '">'; }).join('');
          })
          .withFailureHandler(function() { /* no crítico */ })
          .obtenerListaPacientesWeb();
      }

      // ---------- Carga de datos ----------
      // `silencioso`: refrescos en segundo plano (sin esqueleto y SIN mover el
      // scroll). Una carga no silenciosa (primera carga, Hoy, flechas, selector
      // de fecha) deja la vista centrada en el día de hoy si está en la semana.
      function cargar(fechaISO, silencioso) {
        var irAHoy = !silencioso;
        if (!silencioso) {
          document.getElementById('tablaWrap').innerHTML = htmlEsqueleto();
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            HEADERS = res.headers || [];
            HEADERS_VISIBLES = HEADERS.filter(function(h) { return COLUMNAS_OCULTAS.indexOf(normalizar(h)) === -1; });
            CITAS = res.citas || [];
            OPCIONES_ASISTENCIA = res.opcionesAsistencia || [];
            COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });

            if (res.semana) {
              semanaActual = res.semana.lunes;
              document.getElementById('etiquetaSemana').textContent = res.semana.etiqueta;
              document.getElementById('inputSemana').value = res.semana.lunes;
            }
            render();
            if (irAHoy) scrollAHoy();
          })
          .withFailureHandler(mostrarError)
          .obtenerAgendaSemanaWeb(fechaISO || null);
      }

      // Coloca la cabecera del día de hoy justo bajo el encabezado de columnas,
      // para no tener que hacer scroll hacia abajo un viernes. Si hoy no está
      // en la semana mostrada, vuelve arriba.
      function scrollAHoy() {
        var wrap = document.getElementById('tablaWrap');
        var filaHoy = wrap.querySelector('tr.fila-dia.hoy');
        if (!filaHoy) { wrap.scrollTop = 0; return; }
        var thead = wrap.querySelector('thead');
        var alto = thead ? thead.offsetHeight : 0;
        var destino = filaHoy.getBoundingClientRect().top - wrap.getBoundingClientRect().top - alto + wrap.scrollTop;
        wrap.scrollTop = Math.max(0, destino);
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio">⚠️ No se pudo cargar la agenda.<br>' + escapar(err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }

      // Escapado completo (& < > " '). Sirve tanto para texto como para
      // valores de atributo: antes solo se escapaba "<", y una comilla doble
      // en una nota cortaba el value="..." del campo de edición.
      function escapar(txt) {
        return (txt === null || txt === undefined ? '' : txt + '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      var CAMPOS_EDITABLES = ['Notas', 'Sesión'];

      // ---------- Utilidades de fecha/hora y estado ----------
      function vacioTxt(v) { return v === '' || v === null || v === undefined; }
      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function ahoraHHmm() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

      function finCita(hora) {
        var m = /^(\d{1,2}):(\d{2})$/.exec(hora || '');
        if (!m) return '';
        var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + DURACION_CITA_MIN;
        return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
      }

      // '' | 'pasada' (ya terminó) | 'en-curso'. Solo tiene sentido para citas de hoy.
      function estadoTemporal(hora, ahora) {
        var fin = finCita(hora);
        if (!fin) return '';
        if (fin <= ahora) return 'pasada';
        if (hora <= ahora) return 'en-curso';
        return '';
      }

      function filaProxima(hoy, ahora) {
        return CITAS.find(function(c) { return c._fechaISO === hoy && !c._hueco && (c['Hora'] || '') > ahora; }) || null;
      }

      function sumarDiasISO(iso, n) {
        var p = iso.split('-').map(Number);
        return formatoISO(new Date(p[0], p[1] - 1, p[2] + n));
      }

      function semanaContieneHoy() {
        if (!semanaActual) return false;
        var h = hoyISO();
        return h >= semanaActual && h <= sumarDiasISO(semanaActual, 6);
      }

      // Días pasados de la semana actual: plegados por defecto (en semanas
      // pasadas o futuras se muestra todo). Lo que el usuario pliega o
      // despliega a mano manda sobre el valor por defecto.
      function diaPlegado(fechaISO) {
        if (Object.prototype.hasOwnProperty.call(plegadoManual, fechaISO)) return plegadoManual[fechaISO];
        return semanaContieneHoy() && fechaISO < hoyISO();
      }

      function hayBusqueda() {
        return normalizar(document.getElementById('inputBusqueda').value) !== '' || filtrosActivos.size > 0;
      }

      function calcularTotalesDia() {
        var tot = {};
        CITAS.forEach(function(c) {
          var t = tot[c._fechaISO] || (tot[c._fechaISO] = { citas: 0, libres: 0, registradas: 0 });
          if (c._hueco) t.libres++;
          else { t.citas++; if (!vacioTxt(c['Asistencia'])) t.registradas++; }
        });
        return tot;
      }

      // ---------- Filtros rápidos ----------
      function cumpleFiltro(c, filtro) {
        if (c._hueco) return false;
        if (filtro === 'sinAsistencia') return c._fechaISO <= hoyISO() && vacioTxt(c['Asistencia']);
        if (filtro === 'sinHC') return !!COL_HISTORIA && vacioTxt(c[COL_HISTORIA]);
        if (filtro === 'conNotas') return !vacioTxt(c['Notas']);
        return true;
      }

      function pasaFiltrosRapidos(c) {
        var ok = true;
        filtrosActivos.forEach(function(f) { if (!cumpleFiltro(c, f)) ok = false; });
        return ok;
      }


      // ---------- Asistencia con un clic ----------
      // Cada botón busca en las opciones reales de tu desplegable la que
      // corresponde a su color (verde/rojo/ámbar), igual que los chips.
      function opcionAsistencia(clase) {
        var ops = OPCIONES_ASISTENCIA.filter(function(op) { return estiloAsistencia(op) === clase; });
        if (clase === 'aviso') {
          var just = ops.filter(function(op) { return /justific/.test(normalizar(op)); });
          if (just.length) return just[0];
        }
        if (clase === 'neutro') {
          // Lo no reconocido también cae en 'neutro': aquí solo vale una opción "Pendiente".
          var pend = ops.filter(function(op) { return /pendient/.test(normalizar(op)); });
          return pend[0] || '';
        }
        return ops[0] || '';
      }

      var ASIS_RAPIDA = [
        { clase: 'ok',     icono: 'check_circle' },
        { clase: 'mal',    icono: 'cancel' },
        { clase: 'aviso',  icono: 'event_busy' },
        { clase: 'neutro', icono: 'hourglass_empty' }
      ];

      // Los botones se muestran SIEMPRE; el estado actual queda resaltado y pulsarlo de nuevo lo quita.
      // Un valor que no encaja con ningún botón (texto libre antiguo) sale como chip pulsable para poder quitarlo.
      function htmlAsistenciaBotones(valor, conTexto) {
        var hay = !vacioTxt(valor), v = hay ? String(valor) : '', clsV = hay ? estiloAsistencia(v) : '', alguno = false, html = '';
        ASIS_RAPIDA.forEach(function(a) {
          var op = opcionAsistencia(a.clase);
          if (!op) return;
          var act = hay && (v === op || (a.clase !== 'neutro' && clsV === a.clase) || (a.clase === 'neutro' && /pendient/.test(normalizar(v))));
          if (act) alguno = true;
          html += '<button type="button" class="btn-asis ' + a.clase + (act ? ' activo' : '') + (conTexto ? ' btn-asis-lg' : '') +
            '" data-asis="' + escapar(op) + '" aria-pressed="' + act + '" title="' + escapar(act ? v + ' — clic para quitar' : op) +
            '"><span class="material-symbols-outlined">' + a.icono + '</span>' + (conTexto ? escapar(op) : (act ? '<span class="asis-txt">' + escapar(v) + '</span>' : '')) + '</button>';
        });
        if (hay && !alguno) html = '<button type="button" class="chip chip-' + clsV + '" data-asis="" title="' + escapar(v + ' — clic para quitar') + '">' + escapar(v) + '</button>' + html;
        return '<span class="asis-rapida">' + html + '</span>';
      }

      function guardarAsistencia(fila, valor) {
        var cita = CITAS.find(function(c) { return c._fila == fila; });
        if (!cita) return;
        var previo = cita['Asistencia'];
        cita['Asistencia'] = valor;            // respuesta inmediata; se revierte si el servidor falla
        render();
        function revertir(msg) { cita['Asistencia'] = previo; render(); mostrarAviso(msg); }
        google.script.run
          .withSuccessHandler(function(res) { if (!res || !res.success) revertir((res && res.message) || 'No se pudo guardar el cambio.'); })
          .withFailureHandler(function(err) { revertir('Error al guardar: ' + err); })
          .actualizarCampoAgendaWeb(fila, 'Asistencia', valor);
      }

      function badgeSesion(v) {
        var t = (v + '').trim();
        if (!/^\d+$/.test(t)) return escapar(v);
        return '<span class="badge-sesion ' + (t === '1' ? 's1' : 'sn') + '" title="' + (t === '1' ? 'Primera sesión' : 'Sesión ' + t) + '">' + t + '</span>';
      }

      // Mismo icono de WhatsApp que usa la Base de Datos.
      var SVG_WHATSAPP = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 16 16" fill="currentColor">' +
        '<path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>';

      function htmlBotonesFila(fila, cita) {
        var btnHC = '';
        if (cita) {
          var url = COL_HISTORIA ? cita[COL_HISTORIA] : '';
          var tiene = esUrl(url);
          btnHC = '<button type="button" class="btn-fila ' + (tiene ? 'con-hc' : 'sin-hc') + '" data-accion="hc" data-fila="' + fila + '" title="' +
            (tiene ? 'Abrir Historia Clínica' : 'Sin Historia Clínica enlazada') + '"><span class="material-symbols-outlined">description</span></button>';
        }
        return btnHC +
          '<button type="button" class="btn-fila btn-whatsapp" data-accion="whatsapp" data-fila="' + fila + '" title="Abrir WhatsApp">' + SVG_WHATSAPP + '</button>' +
          '<button type="button" class="btn-fila" data-accion="cita" data-fila="' + fila + '" title="Dar cita"><span class="material-symbols-outlined">edit_calendar</span></button>' +
          '<button type="button" class="btn-fila" data-accion="valoracion" data-fila="' + fila + '" title="Valoración"><span class="material-symbols-outlined">assignment</span></button>' +
          '<button type="button" class="btn-fila" data-accion="alta" data-fila="' + fila + '" title="Dar de alta"><span class="material-symbols-outlined">how_to_reg</span></button>' +
          '<button type="button" class="btn-fila peligro" data-accion="borrar" data-fila="' + fila + '" title="Liberar este hueco (borra todos los datos de la cita)"><span class="material-symbols-outlined">delete</span></button>';
      }

      function htmlStatsDia(t, fechaISO) {
        var txt = t.citas === 0 ? 'Sin citas' : t.citas + (t.citas === 1 ? ' cita' : ' citas');
        if (t.libres > 0) txt += ' · ' + t.libres + (t.libres === 1 ? ' libre' : ' libres');
        if (t.citas > 0 && fechaISO <= hoyISO()) txt += ' · ' + t.registradas + ' de ' + t.citas + ' registradas';
        var total = t.citas + t.libres, barra = '';
        if (total > 0) {
          var sin = t.citas - t.registradas;
          barra = '<span class="ocup" title="' + t.registradas + ' registradas · ' + sin + ' sin registrar · ' + t.libres + ' libres">' +
            '<span class="o-reg" style="width:' + (100 * t.registradas / total) + '%"></span><span class="o-cita" style="width:' + (100 * sin / total) + '%"></span></span>';
        }
        return '<span class="dia-stats">' + txt + '</span>' + barra;
      }

      function htmlLineaAhora(ahora, numColumnas) {
        return '<tr class="fila-ahora"><td colspan="' + numColumnas + '"><div class="ahora-linea"><span>' + ahora + '</span></div></td></tr>';
      }

      function renderCelda(header, valor, fila, esHueco, tag) {
        var vacio = vacioTxt(valor);

        if (header === 'Hora') {
          var casilla = '<span class="chk' + (esHueco ? ' oculto' : '') + '"></span>';
          var punto = tag ? '<span class="pto-t ' + tag + '" title="' + (tag === 'ahora' ? 'En curso' : 'Próxima cita') + '"></span>' : '';
          var asa = '<span class="asa material-symbols-outlined"' + (esHueco ? ' style="visibility:hidden"' : ' title="Arrastra para mover la cita a otro hueco libre"') + '>' + (esHueco ? '' : 'drag_indicator') + '</span>';
          return '<td class="hora"><span class="hora-celda">' + asa + casilla + (vacio ? '—' : escapar(valor)) + punto + '</span></td>';
        }

        if (header === 'Usuario' && esHueco) {
          return '<td class="editable hueco-libre" data-campo="Usuario" data-fila="' + fila + '" data-valor=""><span class="chip-asignar"><span class="material-symbols-outlined">add</span>Asignar</span></td>';
        }

        if (esHueco && vacio) return '<td class="vacio"></td>';

        if (header === COL_HISTORIA) {
          if (vacio) return '<td class="vacio">Sin enlace</td>';
          return esUrl(valor)
            ? '<td><a class="link-hc" href="' + escapar(valor.trim()) + '" target="_blank" rel="noopener"><span class="material-symbols-outlined ic-15">description</span>Abrir</a></td>'
            : '<td>' + escapar(valor) + '</td>';
        }

        if (header === 'Asistencia' && !esHueco) {
          return '<td class="celda-asis" data-fila="' + fila + '">' + htmlAsistenciaBotones(valor, false) + '</td>';
        }

        if (!esHueco && CAMPOS_EDITABLES.indexOf(header) !== -1) {
          var valorAttr = vacio ? '' : escapar(valor);
          var contenido;
          if (vacio) contenido = '—';
          else if (header === 'Notas') contenido = '<div class="notas-clamp" title="' + valorAttr + '"><span class="material-symbols-outlined ic-nota">sticky_note_2</span>' + escapar(valor) + '</div>';
          else if (header === 'Sesión') contenido = badgeSesion(valor);
          else contenido = escapar(valor);

          var clases = 'editable' + (vacio ? ' vacio' : '') + (header === 'Notas' ? ' celda-notas' : '');
          return '<td class="' + clases + '" data-campo="' + escapar(header) + '" data-fila="' + fila + '" data-valor="' + valorAttr + '">' + contenido + '</td>';
        }

        var titulo = (header === 'Usuario' && !vacio) ? ' title="' + escapar(valor) + '"' : '';
        var interior = vacio ? '—' : escapar(valor);
        if (header === 'Usuario' && !vacio && !esHueco) interior = '<div class="celda-usuario">' + avatarHtml(valor) + '<span class="nombre-u">' + escapar(valor) + '</span></div>';
        return '<td class="' + (vacio ? 'vacio' : '') + '"' + titulo + '>' + interior + '</td>';
      }

      // ---------- Estado vacío con acción ----------
      function htmlVacio() {
        var titulo, texto, boton = '';
        if (hayBusqueda()) {
          titulo = 'Ninguna cita coincide';
          texto = 'Prueba con otro término o quita los filtros.';
          boton = '<button type="button" class="btn-toolbar" data-vacio="limpiar"><span class="material-symbols-outlined">filter_alt_off</span> Quitar filtros</button>';
        } else {
          titulo = vista === 'hoy' ? 'Hoy no hay citas asignadas' : 'Esta semana no tiene citas asignadas';
          texto = mostrarHuecos ? 'Todos los huecos están libres.' : 'Puedes mostrar los huecos libres para asignar usuarios.';
          if (!mostrarHuecos) boton = '<button type="button" class="btn-toolbar" data-vacio="huecos"><span class="material-symbols-outlined">event_available</span> Mostrar citas disponibles</button>';
        }
        return '<div class="estado-vacio"><span class="material-symbols-outlined estado-icono">event_busy</span>' +
          '<div class="estado-titulo">' + titulo + '</div><div class="estado-texto">' + texto + '</div>' + boton + '</div>';
      }

      // ---------- Render ----------
      function render() {
        var cont = document.getElementById('tablaWrap');
        var scrollPrevio = cont.scrollTop; // se conserva al repintar (ediciones, selección, refrescos)
        var termino = normalizar(document.getElementById('inputBusqueda').value);
        var hoy = hoyISO();

        var filtradas = CITAS.filter(function(c) {
          if (vista === 'hoy' && c._fechaISO !== hoy) return false;
          if (arrastre && c._hueco) return true;
          if (filtrosActivos.size > 0) {
            if (!pasaFiltrosRapidos(c)) return false;
          } else if (!mostrarHuecos && c._hueco) {
            return false;
          }
          if (!termino) return true;
          var campos = [c['Usuario'], c['Notas'], c['Sesión']];
          return campos.some(function(v) { return normalizar(v).indexOf(termino) !== -1; });
        });


        if ((filtradas.length === 0 && vista !== 'cuadricula') || (vista === 'cuadricula' && CITAS.length === 0)) {
          cont.innerHTML = htmlVacio();
          return;
        }

        cont.innerHTML = vista === 'hoy' ? htmlTarjetas(filtradas) : (vista === 'cuadricula' ? htmlCuadricula(filtradas) : htmlTabla(filtradas));
        ajustarHoy();
        cont.scrollTop = scrollPrevio;
        reaplicarArrastre();
        animarCambios();
      }

      function htmlTabla(filtradas) {
        var totalesDia = calcularTotalesDia();
        var hoy = hoyISO(), ahora = ahoraHHmm(), buscando = hayBusqueda();
        var proxima = filaProxima(hoy, ahora);

        var numColumnas = HEADERS_VISIBLES.length + 1;
        var thead = '<thead><tr>' + HEADERS_VISIBLES.map(function(h) { return '<th' + (h === 'Notas' ? ' class="th-notas"' : '') + '>' + escapar(h) + '</th>'; }).join('') + '<th></th></tr></thead>';

        var grupos = [];
        filtradas.forEach(function(c) {
          var ultimo = grupos[grupos.length - 1];
          if (!ultimo || ultimo.fechaISO !== c._fechaISO) {
            grupos.push({ fechaISO: c._fechaISO, dia: c['Día'], fecha: c['Fecha'], citas: [c] });
          } else {
            ultimo.citas.push(c);
          }
        });

        var contadorFila = 0;

        var tbody = '<tbody>' + grupos.map(function(g) {
          var etiquetaDia = (g.dia ? escapar(g.dia) + ' · ' : '') + escapar(g.fecha);
          var t = totalesDia[g.fechaISO] || { citas: 0, libres: 0, registradas: 0 };
          var esHoy = g.fechaISO === hoy;
          var plegado = !buscando && diaPlegado(g.fechaISO);

          var cabecera = '<tr class="fila-dia' + (esHoy ? ' hoy' : '') + (plegado ? ' plegado' : '') + '" data-dia="' + g.fechaISO + '"><td colspan="' + numColumnas + '">' +
            '<div class="dia-cab"><span class="material-symbols-outlined dia-chevron">' + (plegado ? 'chevron_right' : 'expand_more') + '</span>' +
            '<span>' + etiquetaDia + '</span>' +
            (esHoy ? '<span class="dia-hoy">Hoy</span>' : '') +
            htmlRecDia(g.fechaISO) + htmlStatsDia(t, g.fechaISO) + '</div></td></tr>';

          if (plegado) return cabecera;

          var turnoPrevio = null, lineaPuesta = false;

          var filasDia = g.citas.map(function(c) {
            var hora = c['Hora'] || '';
            var prefijo = '';

            // Línea de "ahora": justo antes de la primera fila posterior a la hora actual
            if (esHoy && !lineaPuesta && hora > ahora) { prefijo += htmlLineaAhora(ahora, numColumnas); lineaPuesta = true; }

            var tempo = (esHoy && !c._hueco) ? estadoTemporal(hora, ahora) : '';
            var tag = tempo === 'en-curso' ? 'ahora' : ((esHoy && proxima && proxima._fila === c._fila) ? 'proxima' : '');

            var celdas = HEADERS_VISIBLES.map(function(h) { return renderCelda(h, c[h], c._fila, c._hueco, tag); }).join('');
            var celdaAcciones = c._hueco ? '<td></td>' : '<td class="acciones-fila">' + htmlBotonesFila(c._fila, c) + '</td>';

            var esManana = hora < HORA_CORTE_TARDE;
            var turno = esManana ? 'manana' : 'tarde';
            if (turno !== turnoPrevio) {
              prefijo += '<tr class="fila-turno ' + turno + '"><td colspan="' + numColumnas + '">' + (esManana ? 'Turno de mañana' : 'Turno de tarde') + '</td></tr>';
            }
            turnoPrevio = turno;

            var clases = [];
            if (c._hueco) {

        el.querySelector('.ficha-form-tit').textContent = titulo;
        controladorPanel = montar(el.querySelector('.ficha-form-cuerpo'));
        actualizarBotonRec();
        return true;
      }

      // ---------- Valoración, Dar cita y WhatsApp (barra de selección y acciones por fila) ----------
      // Los paneles trabajan con el nombre del paciente, no con la fila ni con la semana mostrada, así que seguir
      // navegando por la agenda (o el refresco automático) no los afecta.
      function abrirValoracionCita(nombre) {
        nombre = (nombre || '').trim();
        if (!nombre) { mostrarAviso('Esa cita no tiene paciente asignado.'); return; }
        var cita = CITAS.find(function(c) { return c['Usuario'] === nombre && c['Teléfono']; });
        var clave = 'valoracion:' + nombre;
        return abrirPanelLateral(clave, 'Valoración · ' + nombre, false, function(cont) {
          return PanelValoracion.abrir(cont, {
            paciente: nombre,
            telefono: cita ? String(cita['Teléfono']) : '',
            onGuardado: function() { mostrarAviso('Valoración guardada'); if (panelClave === clave) cerrarPanel(true); },
            onCancelar: function() { if (panelClave === clave) cerrarPanel(); }
          });
        });
      }

      function abrirCitaPanel(nombre) {
        nombre = (nombre || '').trim();
        if (!nombre) { mostrarAviso('Esa cita no tiene paciente asignado.'); return; }
        var clave = 'cita:' + nombre;
        return abrirPanelLateral(clave, 'Dar cita · ' + nombre, true, function(cont) {
          return PanelCita.abrir(cont, {
            paciente: nombre,
            onGuardado: function(msj) {
              mostrarAviso(typeof msj === 'string' && msj ? msj : 'Cita registrada');
              if (panelClave === clave) cerrarPanel(true);
              cargar(semanaActual, true);
            },
            onCancelar: function() { if (panelClave === clave) cerrarPanel(); }
          });
        });
      }

      document.getElementById('ficha').addEventListener('click', function(e) {
        if (e.target.closest('[data-panel="cerrar"]')) cerrarPanel();
      });

      // Esc con el panel abierto lo cierra (con confirmación si hay cambios). Va en fase de captura para que no
      // llegue además al Esc general de la página (que quitaría la selección de citas). Se aparta si hay un diálogo
      // abierto, el menú Copiar desplegado, un arrastre en curso o la edición en línea / el buscador con el foco.
      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape' || !panelAbierto || arrastre) return;
        var modal = document.getElementById('modalOverlay');
        if (modal && modal.classList.contains('visible')) return;
        if (document.querySelector('.menu-wrap.abierto')) return;
        var activo = document.activeElement;
        if (activo && activo.closest && activo.closest('.editando, .buscador')) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (controladorPanel && controladorPanel.alEscape && controladorPanel.alEscape()) return;   // el formulario gestiona su propio Esc
        cerrarPanel();
      }, true);

      function abrirWhatsappFila(fila) {
        // La ventana se abre en el propio clic (síncrono) para que no la bloquee el navegador.
        var ventana = window.open('', '_blank');
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              if (ventana) ventana.location.href = res.url;
            } else {
              if (ventana) ventana.close();
              mostrarAviso(res.message);
            }
          })
          .withFailureHandler(function(err) {
            if (ventana) ventana.close();
            mostrarAviso('Error al abrir WhatsApp: ' + err);
          })
          .generarUrlWhatsappParaAgendaWeb(fila);
      }

      // Dar de alta al paciente de la cita (mismo proceso que el botón Alta de la Base de Datos).
      async function manejarAltaFila(fila) {
        var cita = CITAS.find(function(c) { return c._fila == fila; });
        var nombre = cita ? (cita['Usuario'] || '') : '';
        if (!nombre) { mostrarAviso('Esa fila no tiene paciente asignado.'); return; }
        var confirmado = await mostrarConfirm('¿Dar de alta a ' + nombre + '?');
        if (!confirmado) return;

        google.script.run
          .withSuccessHandler(function(res) { mostrarAviso(res.message); })
          .withFailureHandler(function(err) { mostrarAviso('Error al dar de alta: ' + err); })

      document.getElementById('btnValoracion').addEventListener('click', function() {

      // ---------- Copiar Siguiente Cita / ×2 ----------
      async function manejarCopiarSeleccionadas(doble, forzar) {
        var sel = citasSeleccionadas();
        if (sel.length === 0) return;
        var items = sel.map(function(c) { return { fila: c._fila, doble: doble }; });

        google.script.run
          .withSuccessHandler(async function(res) {
            if (res.ocupado && !forzar) {
              var confirmado = await mostrarConfirm(res.message);
              if (confirmado) manejarCopiarSeleccionadas(doble, true);
              return;
            }
            if (!res.success) { mostrarAviso(res.message || 'No se pudo copiar.'); return; }
            mostrarAviso(res.message);
            quitarSeleccion();
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .copiarVariasCitasWeb(items, !!forzar);
      }

      document.getElementById('btnCopiarCita').addEventListener('click', function() { manejarCopiarSeleccionadas(false, false); });
      document.getElementById('btnCopiarCita2').addEventListener('click', function() { manejarCopiarSeleccionadas(true, false); });

      // ---------- Copiar Semana (mié/jue doble, vie simple → semana siguiente) ----------
      function diaSemanaDeCita(c) {
        var partes = c._fechaISO.split('-').map(Number);
        return new Date(partes[0], partes[1] - 1, partes[2]).getDay();
      }

      async function manejarCopiarSemana(forzar) {
        var items = CITAS
          .filter(function(c) {
            if (c._hueco) return false;
            var dia = diaSemanaDeCita(c);
            return dia === 3 || dia === 4 || dia === 5;
          })
          .map(function(c) {
            var dia = diaSemanaDeCita(c);
            return { fila: c._fila, doble: (dia === 3 || dia === 4) };
          });

        if (items.length === 0) {
          mostrarAviso('No hay citas de miércoles, jueves o viernes en esta semana para copiar.');
          return;
        }

        google.script.run
          .withSuccessHandler(async function(res) {
            if (res.ocupado && !forzar) {
              var confirmado = await mostrarConfirm(res.message);
              if (confirmado) manejarCopiarSemana(true);
              return;
            }
            if (!res.success) { mostrarAviso(res.message || 'No se pudo copiar la semana.'); return; }
            mostrarAviso(res.message);
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .copiarVariasCitasWeb(items, !!forzar);
      }

      document.getElementById('btnCopiarSemana').addEventListener('click', function() { manejarCopiarSemana(false); });

      // ---------- Navegación de semana ----------
      function hoyISO() { return formatoISO(new Date()); }

      function formatoISO(d) {
        var m = (d.getMonth() + 1).toString().padStart(2, '0');
        var day = d.getDate().toString().padStart(2, '0');
        return d.getFullYear() + '-' + m + '-' + day;
      }

      function moverSemana(dias) {
        if (!semanaActual) return;
        var partes = semanaActual.split('-').map(Number);
        var d = new Date(partes[0], partes[1] - 1, partes[2]);
        d.setDate(d.getDate() + dias);
        fijarVista('semana');
        cargar(formatoISO(d));
      }

      document.getElementById('btnSemanaAnterior').addEventListener('click', function() { moverSemana(-7); });
      document.getElementById('btnSemanaSiguiente').addEventListener('click', function() { moverSemana(7); });

      // "Hoy": en la vista de tarjetas las refresca; en la tabla, si el día ya
      // está en la semana cargada solo se desplaza hasta él, y si no, carga la actual.
      document.getElementById('btnHoy').addEventListener('click', function() {
        if (vista === 'hoy') { cambiarVista('hoy'); return; }
        var hoy = hoyISO();
        if (CITAS.some(function(c) { return c._fechaISO === hoy; })) scrollAHoy();
        else cargar(hoy);
      });

      document.getElementById('inputSemana').addEventListener('change', function(e) {
        if (e.target.value) { fijarVista('semana'); cargar(e.target.value); }
      });

      document.getElementById('inputBusqueda').addEventListener('input', render);

      document.getElementById('btnHuecos').addEventListener('click', function() {
        mostrarHuecos = !mostrarHuecos;
        actualizarBotonHuecos();
        render();
      });

      function actualizarBotonHuecos() {
        var btn = document.getElementById('btnHuecos');
        btn.innerHTML = mostrarHuecos
          ? '<span class="material-symbols-outlined">event_busy</span> Ocultar huecos'
          : '<span class="material-symbols-outlined">event_available</span> Huecos libres';
        btn.classList.toggle('activo', mostrarHuecos);
      }

      // ---------- Vista Semana / Hoy ----------
      function fijarVista(v) {
        vista = v;
        document.getElementById('btnVistaSemana').classList.toggle('activo', v === 'semana');
        document.getElementById('btnVistaHoy').classList.toggle('activo', v === 'hoy');
        document.getElementById('btnVistaCal').classList.toggle('activo', v === 'cuadricula');
      }

      function cambiarVista(v) {
        fijarVista(v);
        if (v === 'hoy' && !CITAS.some(function(c) { return c._fechaISO === hoyISO(); })) {
          cargar(hoyISO()); // la semana cargada no contiene hoy
          return;
        }
        render();
        if (v === 'semana') scrollAHoy();
        else document.getElementById('tablaWrap').scrollTop = 0;
      }

      document.getElementById('btnVistaSemana').addEventListener('click', function() { cambiarVista('semana'); });
      document.getElementById('btnVistaHoy').addEventListener('click', function() { cambiarVista('hoy'); });
      document.getElementById('btnVistaCal').addEventListener('click', function() { cambiarVista('cuadricula'); });

      // ---------- Filtros rápidos ----------

      // ---------- Densidad de filas ----------
      function aplicarDensidad(compacto, guardar) {
        document.body.classList.toggle('compacto', compacto);
        document.getElementById('txtDensidad').textContent = compacto ? 'Compacto' : 'Espaciado';
        if (guardar) { try { localStorage.setItem('agendaDensidad', compacto ? 'compacto' : 'comodo'); } catch (err) { /* sin almacenamiento */ } }
      }
      document.getElementById('btnDensidad').addEventListener('click', function() {
        aplicarDensidad(!document.body.classList.contains('compacto'), true);
      });
      (function() {
        var guardada = null;
        try { guardada = localStorage.getItem('agendaDensidad'); } catch (err) { /* sin almacenamiento */ }
        aplicarDensidad(guardada === 'compacto', false);
      })();

      // ---------- Menú Copiar ----------
      document.getElementById('btnMenuCopiar').addEventListener('click', function(e) {
        e.stopPropagation();
        if (this.disabled) return;
        var abierto = document.getElementById('menuCopiarWrap').classList.toggle('abierto');
        this.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      });
      document.getElementById('btnMenuMas').addEventListener('click', function(e) {
        e.stopPropagation();
        var abierto = document.getElementById('menuMasWrap').classList.toggle('abierto');
        this.setAttribute('aria-expanded', abierto ? 'true' : 'false');
      });
      document.addEventListener('click', function(e) {
        document.querySelectorAll('.menu-wrap.abierto').forEach(function(w) {
          if (!w.contains(e.target) || e.target.closest('.menu-item')) w.classList.remove('abierto');
        });
