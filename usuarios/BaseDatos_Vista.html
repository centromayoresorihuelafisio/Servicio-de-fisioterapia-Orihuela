<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos</title>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,300..700,0..1&display=swap" rel="stylesheet">

    <style>
      /* Reset base (sustituye al preflight de Tailwind CDN, que ya no se carga) */
      *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
      html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;-webkit-tap-highlight-color:transparent}
      body{line-height:inherit}
      hr{height:0;color:inherit;border-top-width:1px}
      h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
      a{color:inherit;text-decoration:inherit}
      b,strong{font-weight:bolder}
      code,kbd,samp,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:1em}
      small{font-size:80%}
      table{text-indent:0;border-color:inherit;border-collapse:collapse}
      button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0}
      button,select{text-transform:none}
      button,[type='button'],[type='reset'],[type='submit']{-webkit-appearance:button;background-color:transparent;background-image:none}
      progress{vertical-align:baseline}
      ::-webkit-inner-spin-button,::-webkit-outer-spin-button{height:auto}
      [type='search']{-webkit-appearance:textfield;outline-offset:-2px}
      ::-webkit-search-decoration{-webkit-appearance:none}
      summary{display:list-item}
      blockquote,dl,dd,hr,figure,p,pre,fieldset{margin:0}
      fieldset,legend{padding:0}
      ol,ul,menu{list-style:none;margin:0;padding:0}
      textarea{resize:vertical}
      input::placeholder,textarea::placeholder{opacity:1;color:#9ca3af}
      button,[role="button"]{cursor:pointer}
      :disabled{cursor:default}
      img,svg,video,canvas,audio,iframe,embed,object{display:block;vertical-align:middle}
      img,video{max-width:100%;height:auto}
      [hidden]{display:none}
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      <?!= include('ui/CSS_Global'); ?>
      <?!= include('ui/CSS_Ficha'); ?>

      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--md-bg);
        color: var(--md-on-surface);
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }

      header.top {
        background: var(--md-surface);
        border-bottom: 1px solid var(--md-outline);
        padding: .75rem 1rem;
        flex-shrink: 0;
      }
      header.top h1 {
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-bottom: .6rem;
      }
      header.top .contador { font-size: .78rem; color: var(--md-on-surface-med); font-weight: 400; }
      h1 { display: flex; align-items: center; gap: .5rem; }
      h1 .material-symbols-outlined { font-size: 22px; color: var(--md-primary); }

      .barra-herramientas {
        display: flex;
        gap: .4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: .6rem;
        padding-bottom: .6rem;
        border-bottom: 1px solid var(--md-outline);
      }
      .btn-toolbar {
        display: inline-flex;
        align-items: center;
        gap: .3rem;
        background: var(--md-surface);
        border: 1px solid var(--md-outline);
        color: var(--md-on-surface);
        border-radius: var(--radius-pill);
        padding: .35rem .8rem;
        font-size: .8rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        font-family: var(--font);
      }
      .btn-toolbar:hover { background: var(--md-surface-variant); }
      .btn-toolbar.primario { background: #c2e7ff; border-color: #c2e7ff; color: #004a77; }
      .btn-toolbar.primario:hover { background: #a8d9f9; border-color: #a8d9f9; }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      .btn-toolbar .material-symbols-outlined { font-size: 17px; }
      .btn-toolbar.icono-solo { padding: .35rem; }
      .btn-toolbar.destructivo:hover:not(:disabled) { background: var(--md-error-bg); border-color: var(--md-error); color: var(--md-error); }
      /* Botón "Deshacer": solo se muestra tras eliminar un usuario, hasta que
         se usa, se elimina otro encima, o se recarga/cambia de pestaña. */
      .btn-toolbar.deshacer { display: none; background: var(--md-warning-bg); border-color: var(--md-warning); color: #7a4f00; }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar.deshacer:hover { background: #fdecc0; }
      .toast-deshacer {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: #323232; color: #fff; padding: .65rem 1rem; border-radius: var(--radius-md);
        display: flex; align-items: center; gap: 1rem; font-size: .82rem;
        box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200;
        opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 200ms ease, visibility 0s 200ms;
      }
      .toast-deshacer.visible { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 200ms ease; }
      .toast-deshacer button {
        background: none; border: none; color: #8ab4f8; font-weight: 700; font-size: .82rem;
        cursor: pointer; font-family: var(--font); padding: 0; letter-spacing: .02em;
      }
      .toast-deshacer button:hover { text-decoration: underline; }

      .seleccion-info {
        font-size: .78rem;
        color: var(--md-on-surface-med);
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: .4rem;
      }
      .seleccion-info strong { color: var(--md-primary-dark); }
      .seleccion-info .btn-quitar {
        cursor: pointer;
        color: var(--md-on-surface-low);
        font-size: 16px;
        line-height: 1;
      }

      .controles { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
      .buscador {
        display: flex; align-items: center; gap: .4rem;
        background: var(--md-surface-variant); border-radius: var(--radius-pill);
        padding: .4rem .8rem; flex: 1; min-width: 200px;
      }
      .buscador input { border: none; outline: none; flex: 1; font-size: .85rem; font-family: var(--font); background: transparent; }
      .buscador .material-symbols-outlined { color: var(--md-on-surface-low); font-size: 18px; }


      .tabla-wrap { flex: 1; overflow: auto; }
      table { border-collapse: collapse; width: 100%; min-width: 900px; }
      thead th {
        position: sticky; top: 0; background: var(--md-surface-variant); color: var(--md-on-surface-med);
        font-size: .68rem; text-transform: uppercase; letter-spacing: .02em; font-weight: 600; text-align: left;
        padding: .5rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; z-index: 2;
      }
      tbody tr { cursor: pointer; background: var(--md-surface); }
      tbody tr:hover { background: var(--md-primary-light); }
      tbody tr.seleccionada { background: var(--md-primary-container) !important; }

      tbody td { padding: .45rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
      td.nombre { font-weight: 600; }
      td.vacio { color: var(--md-on-surface-low); font-style: italic; }

      .badge { font-size: .68rem; font-weight: 600; padding: .15rem .55rem; border-radius: var(--radius-pill); white-space: nowrap; background: var(--md-surface-variant); color: var(--md-on-surface-med); }
      .badge.activo      { background: var(--md-success-bg); color: var(--md-success); }
      .badge.espera      { background: var(--md-warning-bg); color: #7a4f00; }
      .badge.contactara  { background: var(--md-error-bg); color: #9c2a1f; }
      .badge.alta        { background: var(--md-purple-bg); color: #5a2596; }
      .badge.no-responde { background: var(--md-surface-variant); color: var(--md-on-surface-med); }

      td a.link-hc { color: var(--md-primary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: .2rem; }
      td a.link-hc:hover { text-decoration: underline; }

      .estado-vacio, .estado-carga { text-align: center; color: var(--md-on-surface-med); padding: 3rem 1rem; font-size: .9rem; }
      .estado-carga .material-symbols-outlined { font-size: 28px; animation: spin 1s linear infinite; display: block; margin: 0 auto .5rem; color: var(--md-primary); }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Modal propio (sustituye a alert()/confirm() nativos) ---------- */
      .modal-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(32,33,36,.5);
        align-items: center; justify-content: center;
        z-index: 1000;
        padding: 1rem;
      }
      .modal-overlay.visible { display: flex; }
      .modal-box {
        background: var(--md-surface);
        border-radius: var(--radius-md);
        padding: 1.25rem 1.5rem;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0,0,0,.25);
      }
      .modal-mensaje {
        font-size: .88rem;
        color: var(--md-on-surface);
        white-space: pre-line;
        line-height: 1.45;
        margin-bottom: 1.15rem;
      }
      .modal-botones { display: flex; justify-content: flex-end; gap: .5rem; }

      /* Pestañas para alternar entre Agenda y Base de Datos. Son enlaces
         normales (navegación con recarga) porque las Web Apps de Apps
         Script no se pueden embeber en un iframe (Google lo bloquea). */
      nav.tabs-cambio {
        display: flex; gap: .25rem; flex-shrink: 0;
        background: var(--md-bg); padding: .5rem .75rem 0;
        border-bottom: 1px solid var(--md-outline);
      }
      nav.tabs-cambio a.tab-cambio {
        display: inline-flex; align-items: center; gap: .4rem;
        background: transparent; color: var(--md-primary-dark); text-decoration: none;
        font-family: var(--font); font-weight: 600; font-size: .82rem;
        padding: .5rem 1rem; border-radius: 8px 8px 0 0; transition: var(--transition);
      }
      nav.tabs-cambio a.tab-cambio:hover { background: rgba(0,74,119, .05); }
      nav.tabs-cambio a.tab-cambio.activo { background: var(--md-primary-container); color: var(--md-primary-dark); cursor: default; }
      /* ===== Rediseño: filas de dos líneas, ficha lateral, acciones al hover ===== */
      #btnEditar, #btnEliminarUsuario, #btnAlta, #btnHistoria, #btnWhatsapp, #btnCita, #btnValoracion, #seleccionInfo { display: none !important; }
      header.top { box-shadow: 0 1px 4px rgba(32,33,36,.08); position: relative; z-index: 5; }
      .barra-herramientas { border-bottom: none; padding-bottom: 0; }
      .tabla-wrap { scrollbar-width: thin; scrollbar-color: #c4c9d0 transparent; }
      table { min-width: 1100px; }
      tbody td { padding: .55rem .8rem; vertical-align: middle; }
      thead th { padding: .55rem .8rem; }
      tbody tr { transition: background-color 120ms; }
      tbody tr.seleccionada td.col-usuario { box-shadow: inset 3px 0 0 var(--md-primary); }

      .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700;
        background: hsl(var(--h) 55% 88%); color: hsl(var(--h) 45% 28%); }
      .avatar.grande { width: 52px; height: 52px; font-size: 1.1rem; }
      .celda-u { display: flex; align-items: center; gap: .7rem; min-width: 0; }
      .doble { display: flex; flex-direction: column; min-width: 0; }
      .u-nombre { font-weight: 600; font-size: .88rem; overflow: hidden; text-overflow: ellipsis; }
      .u-sub, .c-sub { font-size: .78rem; font-weight: 500; color: var(--md-texto-secundario); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
      .copiable { cursor: copy; }
      .copiable:hover { text-decoration: underline dotted; }
      .cl-pat { overflow: hidden; text-overflow: ellipsis; }
      .chip-g { font-size: .68rem; font-weight: 600; padding: .1rem .5rem; border-radius: 999px; background: var(--md-surface-variant); color: var(--md-on-surface-med); }
      .chip-g.leve { background: var(--md-success-bg); color: var(--md-success); }
      .chip-g.moderado { background: var(--md-warning-bg); color: #7a4f00; }
      .chip-g.urgente { background: var(--md-error-bg); color: var(--md-error); }
      .tipo-ing { font-size: .76rem; font-weight: 500; color: var(--md-texto-secundario); margin-left: .35rem; }
      button.badge { border: none; cursor: pointer; font-family: var(--font); display: inline-flex; align-items: center; gap: .1rem; }
      button.badge .material-symbols-outlined { font-size: 15px; margin-right: -.25rem; opacity: .55; }
      button.badge:hover { filter: brightness(.95); }

      td.acciones-fila { width: 208px; min-width: 208px; max-width: none; overflow: visible; text-align: right; padding-right: .6rem; position: sticky; right: 0; background: inherit; }
      .btn-fila { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--md-on-surface-med); cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 120ms, background 120ms; }
      tbody tr:hover .btn-fila, tbody tr.seleccionada .btn-fila, .btn-fila:focus-visible { opacity: 1; }
      .btn-fila:hover { background: rgba(0,0,0,.07); color: var(--md-primary); }
      .btn-fila .material-symbols-outlined { font-size: 19px; }
      .btn-fila.btn-whatsapp:hover { color: #25d366; }
      /* Acciones de fila: píldora flotante con iconos agrupados (mismo estilo que la Agenda) */
      td.acciones-fila .acc-pill { position: absolute; right: .6rem; top: 50%; transform: translate(6px, -50%); display: inline-flex; align-items: center; gap: 2px; padding: 3px;
        border-radius: 999px; background: var(--md-surface); border: 1px solid var(--md-outline); box-shadow: 0 2px 10px rgba(31,36,48,.14);
        opacity: 0; pointer-events: none; transition: opacity 120ms ease, transform 120ms ease; }
      tbody tr:hover td.acciones-fila .acc-pill, tbody tr.seleccionada td.acciones-fila .acc-pill, td.acciones-fila .acc-pill:focus-within { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
      @media (hover: none) { td.acciones-fila .acc-pill { opacity: 1; transform: translate(0, -50%); pointer-events: auto; } }
      .acc-pill .btn-fila { opacity: 1 !important; width: 30px; height: 30px; color: var(--md-on-surface-med); }
      .acc-pill .btn-fila:hover { background: var(--md-primary-light); color: var(--md-primary-dark); }
      .acc-pill .btn-fila.con-hc { color: var(--md-primary); }
      .acc-pill .btn-fila.sin-hc .material-symbols-outlined { opacity: .4; }
      .acc-pill .btn-fila.btn-whatsapp:hover { background: rgba(37,211,102,.14); color: #1fa855; }
      @media (max-width: 760px) {
        td.acciones-fila .acc-pill { position: static; transform: none; opacity: 1; pointer-events: auto; box-shadow: none; border: none; background: transparent; padding: 0; }
      }
      .girando { animation: girar 1s linear infinite; display: inline-block; }
      @keyframes girar { to { transform: rotate(360deg); } }
      .btn-fila.con-hc { color: var(--md-primary); }
      .btn-fila.sin-hc .material-symbols-outlined { opacity: .4; }
      @media (hover: none) { .btn-fila { opacity: 1; } }

      .menu-flot { position: fixed; z-index: 1100; display: none; min-width: 200px; background: var(--md-surface); border: 1px solid var(--md-outline); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: .3rem; }
      .menu-flot.visible { display: block; }
      .menu-item { display: flex; align-items: center; gap: .6rem; width: 100%; border: none; background: none; text-align: left; padding: .5rem .7rem; border-radius: 8px; cursor: pointer; font-family: var(--font); font-size: .82rem; color: var(--md-on-surface); }
      .menu-item:hover { background: var(--md-surface-variant); }
      .menu-item .material-symbols-outlined { font-size: 18px; color: var(--md-on-surface-med); }
      .menu-item .check { margin-left: auto; color: var(--md-primary); }
      .menu-item.peligro, .menu-item.peligro .material-symbols-outlined { color: var(--md-error); }
      .menu-sep { height: 1px; background: var(--md-outline); margin: .25rem .3rem; }
      .punto { width: 10px; height: 10px; border-radius: 50%; margin: 0 4px; background: var(--md-on-surface-low); flex-shrink: 0; }
      .punto.activo { background: var(--md-success); } .punto.espera { background: var(--md-warning); } .punto.contactara { background: var(--md-error); } .punto.alta { background: var(--md-purple); }

      .ficha { position: fixed; top: 0; right: 0; bottom: 0; width: var(--ficha-w, 400px); max-width: 100%; z-index: 900; display: flex; flex-direction: column; background: var(--md-surface);
        border-left: 1px solid var(--md-outline); box-shadow: -6px 0 24px rgba(0,0,0,.08); transform: translateX(100%); visibility: hidden; transition: transform 160ms cubic-bezier(.2,0,0,1), visibility 0s 160ms; will-change: transform; }
      .ficha.abierta { transform: none; visibility: visible; transition-delay: 0s; }
      /* Formularios que piden más sitio (Cita): el panel pasa de 400 a 520 px solo con pantalla ancha */
      @media (min-width: 1200px) { body.ficha-ancha { --ficha-w: 520px; } }
      /* Historia clínica: cajón muy ancho que se superpone a la tabla (no la desplaza) */
      body.ficha-hc { --ficha-w: min(1120px, 96vw); }
      body.ficha-hc .ficha { box-shadow: -10px 0 40px rgba(0,0,0,.18); }
      /* Cabecera y cuerpo de un formulario abierto dentro de la ficha (Valoración, Editar, Cita) */
      .ficha-form-cab { flex: none; display: flex; align-items: center; gap: .5rem; padding: .7rem .8rem; border-bottom: 1px solid var(--md-outline); }
      .ficha-form-cab button { border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; color: var(--md-on-surface-med); display: inline-flex; align-items: center; justify-content: center; }
      .ficha-form-cab button:hover { background: var(--md-surface-variant); }
      .ficha-form-tit { font-size: .95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ficha-form-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .ficha-form-cuerpo > * { flex: 1 1 auto; min-height: 0; }
      @media (min-width: 900px) {
        /* Sin animar el margen (forzaba reflujo de la tabla en cada fotograma): el panel se desliza con transform y el contenido se ajusta al instante. */
        body.con-ficha:not(.ficha-hc) nav.tabs-cambio, body.con-ficha:not(.ficha-hc) header.top, body.con-ficha:not(.ficha-hc) .tabla-wrap { margin-right: var(--ficha-w, 400px); }
        /* Con la ficha abierta se ocultan Prioridad, Inscripción y las acciones de fila (la ficha ya tiene sus botones) para que la tabla quepa sin scroll horizontal. */
        body.con-ficha:not(.ficha-hc) .tabla-wrap { overflow-x: hidden; }
        body.con-ficha:not(.ficha-hc) table { min-width: 0; }
        body.con-ficha:not(.ficha-hc) thead th:nth-child(n+6), body.con-ficha:not(.ficha-hc) tbody td:nth-child(n+6) { display: none; }
        body.con-ficha:not(.ficha-hc) thead th.col-usuario, body.con-ficha:not(.ficha-hc) tbody td.col-usuario { width: 250px; min-width: 250px; max-width: 250px; }
        body.con-ficha:not(.ficha-hc) td.col-clinico { max-width: 240px; }
      }

      .toasts { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); display: flex; flex-direction: column; gap: .4rem; align-items: center; z-index: 1300; pointer-events: none; }
      .toast-aviso { background: #323232; color: #fff; padding: .6rem 1rem; border-radius: 10px; font-size: .82rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: min(92vw, 460px); animation: entra-toast .2s ease; transition: opacity .25s, transform .25s; }
      .toast-aviso.error { background: #8c1d18; }
      .toast-aviso.saliendo { opacity: 0; transform: translateY(6px); }
      @keyframes entra-toast { from { opacity: 0; transform: translateY(8px); } }
      .barra-progreso { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1400; opacity: 0; pointer-events: none; transition: opacity 150ms;
        background: linear-gradient(90deg, transparent, var(--md-primary), transparent); background-size: 40% 100%; background-repeat: no-repeat; }
      body.ocupado .barra-progreso { opacity: 1; animation: barrido 1s linear infinite; }
      @keyframes barrido { from { background-position: -40% 0; } to { background-position: 140% 0; } }
      nav.tabs-cambio a.tab-cambio .material-symbols-outlined { font-size: 18px; }
      /* ===== Tema oscuro (tokens --md-*, igual que la Agenda con --ag-*) ===== */
      :root, :root[data-tema="claro"] { color-scheme: light; --md-texto-secundario: #45494f; }
      :root[data-tema="oscuro"] { --md-texto-secundario: #c7cdd8; }
      @media (prefers-color-scheme: dark) { :root:not([data-tema]) { --md-texto-secundario: #c7cdd8; } }
      @media (prefers-color-scheme: dark) { :root:not([data-tema]) { --md-primary:#8ab4f8;--md-primary-dark:#c2e7ff;--md-primary-light:#1f3a5a;--md-primary-container:#274a72;--md-on-primary:#0b2544;
        --md-success:#7fd39b;--md-success-bg:#173a24;--md-error:#f2b8b5;--md-error-bg:#3b1f1e;--md-warning:#f0c66a;--md-warning-bg:#3a3120;--md-purple:#c9a6f7;--md-purple-bg:#2f2440;
        --md-bg:#121418;--md-surface:#1b1e24;--md-surface-variant:#242830;--md-outline:#333944;--md-on-surface:#e6e8ee;--md-on-surface-med:#aab1c0;--md-on-surface-low:#7f8797;--tabs-bg:#1b2733;color-scheme:dark; } }

    <script>
      var TODOS = [];
      var HEADERS = [];
      var filtroEstado = null;
      var COL_HISTORIA = null;
      var pacienteSeleccionado = null; // { _fila, Nombre, ... } o null
      var filtroGravedad = null, filtroSinHC = false, filtroSinTel = false;
      var filtroTipo = null, filtroPatologia = null;
      var seleccionMultiple = new Set();
      var ordenCampo = null, ordenDir = 1; // 1 = asc, -1 = desc
      var ultimosFiltrados = [], filaActivaFila = null;

      // ---------- Carga de datos ----------
      function cargar(alReanclar) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            HEADERS = res.headers || [];
            TODOS = res.pacientes || [];
            COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });
            reanclarSeleccion();
            if (typeof alReanclar === 'function') alReanclar();
            construirMenusFiltro();
            render();
            renderFicha();
          })
          .withFailureHandler(mostrarError)
          .obtenerBaseDatosCompletaWeb();
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio"><span class="material-symbols-outlined" style="display:block;font-size:28px;margin-bottom:.4rem;color:var(--md-error)">error</span>No se pudo cargar la base de datos.<br>' + esc(err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      // ---------- Filtros (menús desplegables) ----------
      var FILTROS_DEF = [
        { id: 'estado', etq: 'Estado', icono: 'label' },
        { id: 'gravedad', etq: 'Gravedad', icono: 'priority_high' },
        { id: 'carencias', etq: 'Sin HC / TLF', icono: 'folder_off' },
        { id: 'tipo', etq: 'Derivación', icono: 'alt_route' },
        { id: 'patologia', etq: 'Patología', icono: 'medical_services' }
      ];

      // Patologías individuales: cada campo puede traer varias separadas por , ; / | · + o salto de línea.
      var SEP_PAT = /\s*(?:[,;\/|·+]|\r?\n)\s*/;
      function patologiasDe(p) {
        var out = [], vistos = {};
        ['Patología 1', 'Patología 2'].forEach(function(campo) {
          dato(p, campo).split(SEP_PAT).forEach(function(s) {
            s = s.replace(/[.\s]+$/, '').trim();
            var k = normalizar(s);
            if (!k || vistos[k]) return;
            vistos[k] = true; out.push(s);
          });
        });
        return out;
      }
      function sinHC(p) { return !esUrl(COL_HISTORIA ? p[COL_HISTORIA] : ''); }
      function sinTelefono(p) { return !(dato(p, 'Teléfono 1') || dato(p, 'Teléfono 2')); }

      // 'excluir' permite calcular los contadores de un menú ignorando su propio filtro (conteo por facetas).
      function pasaFiltros(p, terminoNorm, excluir) {
        if (excluir !== 'estado' && filtroEstado && (p['Estado'] || '').toString().trim() !== filtroEstado) return false;
        if (excluir !== 'gravedad' && filtroGravedad && claseGravedad(dato(p, 'Gravedad')) !== filtroGravedad) return false;
        if (excluir !== 'sinHC' && filtroSinHC && !sinHC(p)) return false;
        if (excluir !== 'sinTel' && filtroSinTel && !sinTelefono(p)) return false;
        if (excluir !== 'tipo' && filtroTipo && normalizar(textoEstado(dato(p, 'Tipo de Ingreso'))) !== normalizar(filtroTipo)) return false;
        if (excluir !== 'patologia' && filtroPatologia && patologiasDe(p).map(normalizar).indexOf(normalizar(filtroPatologia)) === -1) return false;
        if (!terminoNorm) return true;
        // Los teléfonos se guardan solo con dígitos ("612345678") pero se ven como "612 34 56 78": si lo escrito parece un número,
        // se compara por dígitos para que se pueda buscar tal como se ve en pantalla.
        var dTerm = terminoNorm.replace(/\D/g, '');
        if (dTerm.length >= 3 && /^[\d\s+.\-]+$/.test(terminoNorm) &&
            ['Teléfono 1', 'Teléfono 2'].some(function(h) { return Telefono.clave(dato(p, h)).indexOf(dTerm) !== -1; })) return true;
        return HEADERS.some(function(h) { return normalizar(p[h]).indexOf(terminoNorm) !== -1; });
      }

      function cuentasFiltros() {
        var term = normalizar(document.getElementById('inputBusqueda').value);
        var base = function(ex) { return TODOS.filter(function(p) { return pasaFiltros(p, term, ex); }); };
        var c = { estado: {}, gravedad: { leve: 0, moderado: 0, urgente: 0 }, tipo: {}, patologia: {}, tot: {} };
        var b = base('estado'); c.tot.estado = b.length;
        b.forEach(function(p) { var e = (p['Estado'] || '').toString().trim(); if (e) c.estado[e] = (c.estado[e] || 0) + 1; });
        b = base('gravedad'); c.tot.gravedad = b.length;
        b.forEach(function(p) { var g = claseGravedad(dato(p, 'Gravedad')); if (g) c.gravedad[g]++; });
        b = base('tipo'); c.tot.tipo = b.length;
        b.forEach(function(p) {
          var tx = textoEstado(dato(p, 'Tipo de Ingreso')), k = normalizar(tx);
          if (k) { c.tipo[k] = c.tipo[k] || { texto: tx, n: 0 }; c.tipo[k].n++; }
        });
        b = base('patologia'); c.tot.patologia = b.length;
        b.forEach(function(p) { patologiasDe(p).forEach(function(s) { var k = normalizar(s); c.patologia[k] = c.patologia[k] || { texto: s, n: 0 }; c.patologia[k].n++; }); });
        c.sinHC = base('sinHC').filter(sinHC).length;
        c.sinTel = base('sinTel').filter(sinTelefono).length;
        return c;
      }

      function itemsFiltro(id) {
        var c = cuentasFiltros(), it = [];
        var fin = function() { construirMenusFiltro(); render(); };
        if (id === 'estado') {
          if (filtroEstado && !c.estado[filtroEstado]) c.estado[filtroEstado] = 0;
          it.push({ punto: '', texto: 'Todos', n: c.tot.estado, marcado: !filtroEstado, fn: function() { filtroEstado = null; fin(); } });
          Object.keys(c.estado).sort().forEach(function(e) {
            it.push({ punto: claseParaEstado(e), texto: textoEstado(e), n: c.estado[e], marcado: filtroEstado === e, fn: function() { filtroEstado = e; fin(); } });
          });
        } else if (id === 'gravedad') {
          var col = { leve: 'activo', moderado: 'espera', urgente: 'contactara' };
          it.push({ punto: '', texto: 'Todas', n: c.tot.gravedad, marcado: !filtroGravedad, fn: function() { filtroGravedad = null; fin(); } });
          ['leve', 'moderado', 'urgente'].forEach(function(g) {
            it.push({ punto: col[g], texto: g.charAt(0).toUpperCase() + g.slice(1), n: c.gravedad[g], marcado: filtroGravedad === g, fn: function() { filtroGravedad = g; fin(); } });
          });
        } else if (id === 'carencias') {
          it.push({ icono: 'folder_off', texto: 'Sin Historia Clínica', n: c.sinHC, marcado: filtroSinHC, fn: function() { filtroSinHC = !filtroSinHC; fin(); abrirMenuFiltro('carencias'); } });
          it.push({ icono: 'phone_disabled', texto: 'Sin teléfono', n: c.sinTel, marcado: filtroSinTel, fn: function() { filtroSinTel = !filtroSinTel; fin(); abrirMenuFiltro('carencias'); } });
        } else {
          var esTipo = id === 'tipo', mapa = esTipo ? c.tipo : c.patologia, sel = esTipo ? filtroTipo : filtroPatologia, actual = normalizar(sel);
          if (actual && !mapa[actual]) mapa[actual] = { texto: sel, n: 0 };
          var poner = function(v) { if (esTipo) filtroTipo = v; else filtroPatologia = v; fin(); };
          it.push({ texto: 'Todas', n: c.tot[id], marcado: !actual, fn: function() { poner(null); } });
          Object.keys(mapa).sort(function(a, b) { return mapa[a].texto.localeCompare(mapa[b].texto, 'es'); }).forEach(function(k) {
            it.push({ texto: mapa[k].texto, n: mapa[k].n, marcado: actual === k, fn: function() { poner(mapa[k].texto); } });
          });
        }
        return it;
      }

      function abrirMenuFiltro(id) {
        var btn = document.querySelector('#filtrosMenus [data-filtro="' + id + '"]');
        if (btn) abrirMenu(itemsFiltro(id), btn, true);
      }

      function construirMenusFiltro() {
        var cont = document.getElementById('filtrosMenus');
        if (filtroEstado && !TODOS.some(function(p) { return (p['Estado'] || '').toString().trim() === filtroEstado; })) filtroEstado = null;
        if (filtroTipo && !TODOS.some(function(p) { return normalizar(textoEstado(dato(p, 'Tipo de Ingreso'))) === normalizar(filtroTipo); })) filtroTipo = null;
        if (filtroPatologia && !TODOS.some(function(p) { return patologiasDe(p).map(normalizar).indexOf(normalizar(filtroPatologia)) !== -1; })) filtroPatologia = null;
        var val = {
          estado: filtroEstado ? textoEstado(filtroEstado) : '',
          gravedad: filtroGravedad ? filtroGravedad.charAt(0).toUpperCase() + filtroGravedad.slice(1) : '',
          carencias: filtroSinHC && filtroSinTel ? 'HC + TLF' : filtroSinHC ? 'Sin HC' : filtroSinTel ? 'Sin TLF' : '',
          tipo: filtroTipo || '', patologia: filtroPatologia || ''
        };
        var hay = filtroEstado || filtroGravedad || filtroSinHC || filtroSinTel || filtroTipo || filtroPatologia;
        cont.innerHTML = FILTROS_DEF.map(function(f) {
          var v = val[f.id];

        }).join('') + (hay ? '<button type="button" class="filtro-limpiar" data-filtro="limpiar" title="Quitar filtros" aria-label="Quitar filtros"><span class="material-symbols-outlined">filter_alt_off</span></button>' : '');

      document.getElementById('filtrosMenus').addEventListener('click', function(e) {

      // ---------- Recordar filtros y orden durante la sesión ----------

        } catch (err) { /* sin almacenamiento */ }
      }
      function restaurarVista() {
        try {
          var v = JSON.parse(sessionStorage.getItem(CLAVE_VISTA) || 'null');
          if (!v) return;
          document.getElementById('inputBusqueda').value = v.q || '';
          filtroEstado = v.e || null; filtroGravedad = v.g || null; filtroSinHC = !!v.hc; filtroSinTel = !!v.tl;
          filtroTipo = v.t || null; filtroPatologia = v.p || null;
          if (v.oc) { ordenCampo = v.oc; ordenDir = v.od === -1 ? -1 : 1; }
        } catch (err) { /* sin almacenamiento */ }
      }

      function claseParaEstado(estado) {
        var e = normalizar(estado);
        if (e.indexOf('activo') !== -1) return 'activo';
        if (e.indexOf('espera') !== -1) return 'espera';
        if (e.indexOf('contactar') !== -1) return 'contactara';
        if (e.indexOf('alta') !== -1) return 'alta';
        if (e.indexOf('responde') !== -1) return 'no-responde';
        return '';
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }

      // ================= Tabla de dos líneas, ficha lateral y estado en línea =================
      var fichaAbierta = false, CACHE_HDR = {};
      var MAPA_ACC = { editar: 'btnEditar', whatsapp: 'btnWhatsapp', cita: 'btnCita', valoracion: 'btnValoracion', alta: 'btnAlta',
        crearhc: 'btnHistoria', eliminar: 'btnEliminarUsuario' };

      function esc(t) { return (t === null || t === undefined ? '' : String(t)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
      function hdr(nombre) {
        if (!(nombre in CACHE_HDR)) { var n = normalizar(nombre); CACHE_HDR[nombre] = HEADERS.find(function(h) { return normalizar(h) === n; }) || null; }
        return CACHE_HDR[nombre];
      }
      function dato(p, nombre) { var h = hdr(nombre); if (!h) return ''; var v = p[h]; return (v === null || v === undefined) ? '' : String(v).trim(); }
      function textoEstado(e) { var s = String(e || ''); return s.replace(/^[^\p{L}\p{N}]+/u, '').trim() || s; }
      function edadTxt(p) { var e = dato(p, 'Edad'); return /^\d+$/.test(e) ? e + ' años' : e; }
      function claseGravedad(v) { var n = normalizar(v); return n.indexOf('leve') !== -1 ? 'leve' : n.indexOf('moderad') !== -1 ? 'moderado' : n.indexOf('urgent') !== -1 ? 'urgente' : ''; }
      function chipGravedad(v) { return '<span class="chip-g ' + claseGravedad(v) + '">' + esc(textoEstado(v)) + '</span>'; }

      function formatearTel(t) { return Telefono.formato(t); }   // regla única: ui/JS_Telefono.html

      function avatarHtml(nombre, extra) {
        var n = (nombre || '').toString().trim();
        if (!n) return '';
        var p = n.split(/\s+/), ini = (p[0].charAt(0) + (p.length > 1 ? p[1].charAt(0) : p[0].charAt(1))).toUpperCase(), hue = 0, low = n.toLowerCase();
        for (var i = 0; i < low.length; i++) hue = (hue * 31 + low.charCodeAt(i)) % 360;
        return '<span class="avatar' + (extra ? ' ' + extra : '') + '" style="--h:' + hue + '">' + esc(ini) + '</span>';
      }

      // Columna A: puntuación de prioridad que escribe "Ordenar Usuarios" (ordenarPacientes,
      // en usuarios/BaseDatos.gs). Se localiza por posición (primera columna), no por nombre,
      // para no depender de cómo esté titulada esa columna en tu hoja.
      function colPrioridad() { return HEADERS.length ? HEADERS[0] : null; }
      function prioridadNum(p) {
        var h = colPrioridad();
        if (!h) return null;
        var n = parseFloat(p[h]);
        return isNaN(n) ? null : n;
      }
      function prioridadTxt(p) { var n = prioridadNum(p); return n === null ? '—' : n.toFixed(2); }

      function badgeEstado(p) {
        var e = dato(p, 'Estado');
        return '<button type="button" class="badge estado-btn ' + claseParaEstado(e) + '" data-estado-fila="' + p._fila + '" title="Cambiar estado">' +
          (e ? esc(textoEstado(e)) : 'Sin estado') + '<span class="material-symbols-outlined">expand_more</span></button>';
      }

      var SVG_WHATSAPP = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 16 16" fill="currentColor">' +
        '<path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>';

      function contenidoIcono(icono) { return icono === 'whatsapp' ? SVG_WHATSAPP : '<span class="material-symbols-outlined">' + icono + '</span>'; }

      function btnFila(acc, p, icono, titulo, extra) {
        return '<button type="button" class="btn-fila ' + (extra || '') + (icono === 'whatsapp' ? ' btn-whatsapp' : '') + '" data-acc="' + acc + '" data-fila="' + p._fila + '" title="' + esc(titulo) + '">' + contenidoIcono(icono) + '</button>';
      }

      function resalta(txt, termino) {
        var s = esc(txt || '');
        if (!termino) return s;
        try {
          var re = new RegExp('(' + termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
          return s.replace(re, '<mark>$1</mark>');
        } catch (err) { return s; }
      }

      function htmlFila(p, termino) {
        var t1 = dato(p, 'Teléfono 1'), t2 = dato(p, 'Teléfono 2'), grav = dato(p, 'Gravedad'), tipo = dato(p, 'Tipo de Ingreso');
        var pats = patologiasDe(p).join(' · ');
        var tieneHC = esUrl(COL_HISTORIA ? p[COL_HISTORIA] : '');
        var sel = pacienteSeleccionado && pacienteSeleccionado._fila === p._fila;
        var enLote = seleccionMultiple.has(p._fila);
        var tel = function(t, cls) { return t ? '<span class="' + cls + ' copiable" data-copiar="' + esc(Telefono.digitos(t) || t) + '" data-etiqueta="Teléfono" title="Copiar">' + resalta(formatearTel(t), termino) + '</span>' : ''; };
        return '<tr data-fila="' + p._fila + '" class="' + (sel ? 'seleccionada ' : '') + (enLote ? 'seleccion-multiple' : '') + '">' +
          '<td class="col-check"><input type="checkbox" class="chk-fila" data-fila="' + p._fila + '"' + (enLote ? ' checked' : '') + '></td>' +
          '<td class="col-usuario"><div class="celda-u">' + avatarHtml(p['Nombre']) + '<div class="doble"><div class="u-nombre">' + resalta(p['Nombre'], termino) + '</div><div class="u-sub">' +
            (resalta([dato(p, 'DNI'), edadTxt(p)].filter(Boolean).join(' · '), termino) || '—') + '</div></div></div></td>' +
          '<td data-label="Contacto" class="col-contacto"><div class="doble">' + (tel(t1, '') || '<span class="vacio">—</span>') + (t2 ? '<div class="c-sub">' + tel(t2, '') + '</div>' : '') + '</div></td>' +
          '<td data-label="Clínico" class="col-clinico"><div class="doble"><div class="cl-pat" title="' + esc(pats) + '">' + (pats ? resalta(pats, termino) : '<span class="vacio">—</span>') + '</div><div class="c-sub">' +
            (grav ? chipGravedad(grav) : '') + (tipo ? '<span class="tipo-ing">' + esc(textoEstado(tipo)) + '</span>' : '') + '</div></div></td>' +
          '<td data-label="Estado" class="col-estado">' + badgeEstado(p) + '</td>' +
          '<td data-label="Prioridad" class="celda-prioridad">' + esc(prioridadTxt(p)) + '</td>' +
          '<td data-label="Inscripción">' + (dato(p, 'Fecha inscripción') ? esc(dato(p, 'Fecha inscripción')) : '<span class="vacio">—</span>') + '</td>' +
          '<td class="acciones-fila"><span class="acc-pill">' +
            btnFila('hc', p, 'description', tieneHC ? 'Abrir Historia Clínica' : 'Sin Historia Clínica · clic para crearla', tieneHC ? 'con-hc' : 'sin-hc') +
            btnFila('whatsapp', p, 'whatsapp', 'Abrir WhatsApp') + btnFila('cita', p, 'event', 'Nueva cita') + btnFila('editar', p, 'edit', 'Editar') + btnFila('mas', p, 'more_vert', 'Más acciones') +
          '</span></td></tr>';
      }

      function render() {
        var termino = document.getElementById('inputBusqueda').value.trim();
        var terminoNorm = normalizar(termino);
        guardarVista();
        var filtrados = TODOS.filter(function(p) { return pasaFiltros(p, terminoNorm); });
        filtrados = ordenarFiltrados(filtrados);
        ultimosFiltrados = filtrados;
        document.getElementById('contador').textContent = filtrados.length + ' de ' + TODOS.length;
        var cont = document.getElementById('tablaWrap'), scroll = cont.scrollTop;

        if (TODOS.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">group_off</span>' +
            'Todavía no hay usuarios registrados.<button title="Añadir un usuario nuevo" type="button" class="btn-toolbar primario" id="btnVacioNuevo"><span class="material-symbols-outlined">person_add</span> Añadir usuario</button></div>';
          document.getElementById('btnVacioNuevo').addEventListener('click', function() { document.getElementById('btnNuevoPaciente').click(); });
          return;
        }
        if (filtrados.length === 0) {
          cont.innerHTML = '<div class="estado-vacio"><span class="material-symbols-outlined grande">search_off</span>' +
            'No se encontró ningún usuario con ese criterio.<button title="Quitar filtros y búsqueda" type="button" class="btn-toolbar" id="btnVacioLimpiar">Quitar filtros</button></div>';
          document.getElementById('btnVacioLimpiar').addEventListener('click', function() {
            document.getElementById('inputBusqueda').value = '';
            filtroEstado = null; filtroGravedad = null; filtroSinHC = false; filtroSinTel = false; filtroTipo = null; filtroPatologia = null;
            construirMenusFiltro(); render();
          });

        }
        cont.innerHTML = '<table><thead><tr>' +
          '<th class="col-check"><input type="checkbox" class="chk-todo" title="Seleccionar todos los visibles"' + (todosVisiblesSeleccionados(filtrados) ? ' checked' : '') + '></th>' +
          thCol('nombre', 'Usuario', 'col-usuario') + '<th>Contacto</th><th>Clínico</th>' + thCol('estado', 'Estado') + thCol('prioridad', 'Prioridad') + thCol('inscripcion', 'Inscripción') + '<th class="col-acciones"></th></tr></thead><tbody>' +
          filtrados.map(function(p) { return htmlFila(p, termino); }).join('') + '</tbody></table>';
        cont.scrollTop = scroll;
        marcarFilaActiva();
      }

      function thCol(campo, texto, clase) {
        var dir = ordenCampo === campo ? (ordenDir === 1 ? 'orden-asc' : 'orden-desc') : '';
        return '<th class="ordenable ' + (clase || '') + ' ' + dir + '" data-orden="' + campo + '">' + texto + '<span class="material-symbols-outlined">arrow_upward</span></th>';
      }

      function parseFechaEs(s) {
        var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || '');
        return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : -Infinity;
      }

      function ordenarFiltrados(lista) {
        if (!ordenCampo) return lista;
        var estados = estadosDisponibles();
        var claves = { nombre: function(p) { return normalizar(p['Nombre']); },
          estado: function(p) { var i = estados.indexOf(dato(p, 'Estado')); return i === -1 ? 999 : i; },
          prioridad: function(p) { var n = prioridadNum(p); return n === null ? -Infinity : n; },
          inscripcion: function(p) { return parseFechaEs(dato(p, 'Fecha inscripción')); } };
        var clave = claves[ordenCampo];
        return lista.slice().sort(function(a, b) {
          var x = clave(a), y = clave(b);
          return (x < y ? -1 : x > y ? 1 : 0) * ordenDir;
        });
      }

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var th = e.target.closest('th.ordenable');
        if (!th) return;
        // Ciclo: dirección inicial → inversa → sin orden (vuelve al orden de la hoja). Prioridad empieza por mayor puntuación.
        var campo = th.dataset.orden, inicial = campo === 'prioridad' ? -1 : 1;
        if (ordenCampo !== campo) { ordenCampo = campo; ordenDir = inicial; }
        else if (ordenDir === inicial) ordenDir = -inicial;
        else { ordenCampo = null; ordenDir = 1; }
        render();
      });

      function refrescarVista() { construirMenusFiltro(); render(); renderFicha(); }

      // Tras recargar (p. ej. después de ordenar) las filas cambian de número: se vuelve a localizar la selección por nombre y DNI.
      function reanclarSeleccion() {
        CACHE_HDR = {};
        if (!pacienteSeleccionado) return;
        var n = pacienteSeleccionado['Nombre'], d = pacienteSeleccionado['DNI'] || '';
        pacienteSeleccionado = TODOS.find(function(p) { return p['Nombre'] === n && (p['DNI'] || '') === d; }) || null;
        if (!pacienteSeleccionado) fichaAbierta = false;
      }

      // ---------- Selección múltiple (checkboxes + acciones en lote) ----------
      function todosVisiblesSeleccionados(lista) { return lista.length > 0 && lista.every(function(p) { return seleccionMultiple.has(p._fila); }); }

      function htmlFicha(p) {
        var tieneHC = esUrl(COL_HISTORIA ? p[COL_HISTORIA] : '');
        fichaTieneVal = ValoracionesCache.tiene(p['ID paciente']);   // para repintar si cambia al terminar la precarga
        var esFichaWeb = tieneHC && /[?&]page=hc&id=/.test(p[COL_HISTORIA]);   // la HC ya vive en la ficha web: no hay Doc que actualizar
        var pie = esFichaWeb ? [] : tieneHC ? [{ id: 'fichahc', icono: 'article', texto: 'Ficha HC', titulo: 'Abrir la ficha de historia clínica en la app (versión de prueba)' }]
                          : [{ id: 'crearhc', icono: 'note_add', texto: 'Crear HC', titulo: 'Crear la historia clínica' }];
        pie = pie.concat([{ id: 'alta', icono: 'how_to_reg', texto: 'Alta', titulo: 'Dar de alta al usuario' }, { id: 'eliminar', icono: 'delete', texto: 'Eliminar', titulo: 'Eliminar al usuario', peligro: true }]);
        return FichaUsuario.html(p, HEADERS, {
          nombre: p['Nombre'],
          acciones: ['whatsapp', { id: 'hc', texto: tieneHC ? 'Historia' : 'Crear HC', titulo: tieneHC ? 'Abrir la historia clínica' : 'Crear la historia clínica' }, 'editar', 'cita', ValoracionesCache.accion(p['ID paciente'])],   // «Valoración» (formulario) o «Valoraciones» (su panel)
          extraCabecera: prioridadNum(p) !== null ? '<span class="fu-extra" title="Puntuación de \'Ordenar Usuarios\'">Prioridad ' + esc(prioridadTxt(p)) + '</span>' : '',
          excluir: [COL_HISTORIA, colPrioridad()],
          pie: pie
        });
      }

      ValoracionesCache.alCambiar(function() {
        var p = pacienteSeleccionado;
        if (!p || !fichaAbierta || formularioActivo) return;
        if (ValoracionesCache.tiene(p['ID paciente']) !== fichaTieneVal) renderFicha();
      });

      function renderFicha() {
        var el = document.getElementById('ficha'), p = pacienteSeleccionado, abierta = fichaAbierta && !!p;
        // Nuevo usuario: el panel está abierto sin ningún paciente seleccionado; se mantiene hasta que se elija otra fila
        // (entonces cae en la regla de más abajo y se descarta, como los demás formularios).
        if (formularioActivo && formularioFila === FILA_NUEVO && !abierta) {
          document.body.classList.add('con-ficha');
          el.classList.add('abierta');
          el.setAttribute('aria-hidden', 'false');
          return;
        }
        document.body.classList.toggle('con-ficha', abierta);
        el.classList.toggle('abierta', abierta);
        el.setAttribute('aria-hidden', abierta ? 'false' : 'true');
        if (formularioActivo && (!abierta || p._fila !== formularioFila)) { cerrarControlador(); formularioActivo = false; controladorForm = null; }
        if (formularioActivo) return; // no pisar el formulario abierto en el panel
        document.body.classList.remove('ficha-ancha', 'ficha-hc');   // la ficha y el resto de formularios usan el ancho normal
        if (abierta) FichaUsuario.pintar(el, htmlFicha(p));
      }

      document.getElementById('ficha').addEventListener('click', function(e) {
        if (e.target.closest('[data-ficha-volver]')) { volverDeFormulario(); return; }
        FichaUsuario.alClic(e, {
          cerrar: cerrarFicha,
          estado: function(btn) { if (pacienteSeleccionado) menuEstado(pacienteSeleccionado._fila, btn); },
          accion: function(a) { if (pacienteSeleccionado) accionPaciente(a, pacienteSeleccionado._fila); }
        });
      });

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        var t = e.target, c;
        if ((c = t.closest('[data-copiar]'))) { e.stopPropagation(); copiarTexto(c.dataset.copiar, c.dataset.etiqueta); return; }
        if ((c = t.closest('.estado-btn'))) { e.stopPropagation(); menuEstado(Number(c.dataset.estadoFila), c); return; }
        if ((c = t.closest('.btn-fila'))) {
          e.stopPropagation();
          var f = Number(c.dataset.fila);
          if (c.dataset.acc === 'mas') menuMas(f, c); else accionPaciente(c.dataset.acc, f);
          return;
        }
        var tr = t.closest('tbody tr[data-fila]');
        if (tr) alternarFicha(Number(tr.dataset.fila));
      });

      function quitarSeleccion() {
        fichaAbierta = false;
        pacienteSeleccionado = null;
        actualizarUiSeleccion();
      }

      var BOTONES_PACIENTE = ['btnEditar','btnEliminarUsuario','btnAlta','btnHistoria','btnWhatsapp','btnCita','btnValoracion']
        .map(function(id) { return document.getElementById(id); });

      function actualizarUiSeleccion() {
        var info = document.getElementById('seleccionInfo');
        if (pacienteSeleccionado) {
          info.style.display = 'flex';
          document.getElementById('nombreSeleccionado').textContent = pacienteSeleccionado['Nombre'] || '';
        } else {
          info.style.display = 'none';
        }
        BOTONES_PACIENTE.forEach(function(btn) { btn.disabled = !pacienteSeleccionado; });
        document.querySelectorAll('tbody tr').forEach(function(tr) {
          var fila = parseInt(tr.getAttribute('data-fila'), 10);
          tr.classList.toggle('seleccionada', !!(pacienteSeleccionado && pacienteSeleccionado._fila === fila));
        });
        renderFicha();
      }

      document.getElementById('btnQuitarSeleccion').addEventListener('click', async function(e) {
        e.stopPropagation();
        if (!(await descartarFormularioSiProcede())) return;
        quitarSeleccion();
      });

      <?!= include('ui/JS_Modal_Deshacer'); ?>


      // ---------- Avisos ligeros (toasts): sustituyen al modal salvo textos largos o multilínea ----------
      var contenedorToasts = (function() { var d = document.createElement('div'); d.className = 'toasts'; document.body.appendChild(d); return d; })();
      function mostrarAviso(mensaje) {
        var m = (mensaje === null || mensaje === undefined) ? '' : String(mensaje);
        if (m.indexOf('\n') !== -1 || m.length > 160) return mostrarDialogo(m, false);
        var t = document.createElement('div'), error = /^error|no se pudo|no se pudieron|bloqueado/i.test(m);
        t.className = 'toast-aviso' + (error ? ' error' : '');
        t.setAttribute('role', 'status');
        var tono = error ? 'error' : tonoAviso_(m);
        if (tono) t.appendChild(iconoAviso_(tono));
        t.appendChild(document.createTextNode(m));
        contenedorToasts.appendChild(t);
        setTimeout(function() { t.classList.add('saliendo'); setTimeout(function() { t.remove(); }, 260); }, error ? 6000 : 3800);
        return Promise.resolve(true);
      }

      // Barra de progreso superior mientras algún botón (oculto o no) muestra "procesando"
      new MutationObserver(function() {
        var ocupado = Array.prototype.some.call(document.querySelectorAll('.barra-herramientas button'), function(b) { return b.innerHTML.indexOf('progress_activity') !== -1; });
        document.body.classList.toggle('ocupado', ocupado);
      }).observe(document.querySelector('.barra-herramientas'), { childList: true, subtree: true });

      // Esc: cierra primero el menú y después la ficha
      document.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        if (document.querySelector('dialog[open]')) return;
        if (menuItems) { var ancla = menuAncla; cerrarMenu(); if (ancla && document.contains(ancla) && ancla.focus) ancla.focus(); return; }
        if (formularioActivo) {
          if (document.querySelector('.modal-overlay.visible')) return;
          // primero lo que el formulario tenga abierto (desplegables, lista de pacientes, horas elegidas…)
          if (controladorForm && controladorForm.alEscape && controladorForm.alEscape()) return;
          volverDeFormulario();
          return;
        }
        if (document.querySelector('.modal-overlay.visible')) return;
        if (fichaAbierta) cerrarFicha();
        else limpiarBusqueda();   // nada más que cerrar: Esc vacía la búsqueda
      });

      // Si otra pestaña actualiza un paciente (las páginas sueltas ?page=… avisan por localStorage al guardar),
      // la tabla se recarga. Los formularios de esta página ya no usan ventanas emergentes.
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado') cargar();
      });

      // ---------- Barra de herramientas ----------
      // Nuevo usuario: formulario en el panel lateral (usuarios/Panel_Nuevo), como Valoración o Editar.
      document.getElementById('btnNuevoPaciente').addEventListener('click', abrirPanelNuevo);

      document.getElementById('btnOrdenar').addEventListener('click', function() {
        var btn = document.getElementById('btnOrdenar');
        var icono = btn.querySelector('.material-symbols-outlined');
        btn.disabled = true;
        icono.textContent = 'progress_activity';
        icono.classList.add('girando');
        google.script.run
          .withSuccessHandler(function() {
            btn.disabled = false;
            icono.textContent = 'sort';
            icono.classList.remove('girando');
            cargar();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            icono.textContent = 'sort';
            icono.classList.remove('girando');
            mostrarAviso('Error al ordenar: ' + err);
          })
          .ordenarPacientes();
      });

      // ---------- Eliminar usuario ----------
      document.getElementById('btnEliminarUsuario').addEventListener('click', async function() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Eliminar a ' + pacienteSeleccionado['Nombre'] + '? Se borrará toda su ficha.');
        if (!confirmado) return;

        // Foto completa de la ficha ANTES de borrarla, para poder deshacer.
        var snapshot = Object.assign({}, pacienteSeleccionado);

        var btn = this;
        btn.disabled = true;

        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = !pacienteSeleccionado;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo eliminar el usuario.'); return; }
            quitarSeleccion();
            cargar();
            mostrarDeshacer(snapshot, 'Usuario eliminado.');
          })
          .withFailureHandler(function(err) {
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso('Error al eliminar: ' + err);
          })
          .eliminarPacienteWeb(idPaciente(snapshot));
      });

      function ejecutarDeshacer() {
        if (!ultimaEliminacion || procesandoDeshacer) return;
        procesandoDeshacer = true;
        var snapshot = ultimaEliminacion;
        if (Array.isArray(snapshot)) { restaurarEnCadena(snapshot, 0); return; } // eliminación en lote

        google.script.run
          .withSuccessHandler(function(res) {
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; } // el botón sigue disponible para reintentar
            ocultarDeshacer();
            cargar();
          })
          .withFailureHandler(function(err) {
            procesandoDeshacer = false;
            mostrarAviso('Error al deshacer: ' + err); // el botón sigue disponible para reintentar
          })
          .restaurarPacienteWeb(snapshot);
      }

      // Restaura una lista de fichas de una en una (en orden de fila); si una falla, conserva las pendientes para reintentar.
      function restaurarEnCadena(lista, i) {
        if (i >= lista.length) {
          procesandoDeshacer = false;
          ocultarDeshacer();
          cargar();
          mostrarAviso(lista.length + (lista.length === 1 ? ' usuario restaurado.' : ' usuarios restaurados.'));
          return;
        }
        function fallo(msg) { procesandoDeshacer = false; ultimaEliminacion = lista.slice(i); cargar(); mostrarAviso(msg); }
        google.script.run
          .withSuccessHandler(function(res) {
            if (!res || !res.success) { fallo((res && res.message) || 'No se pudieron restaurar todos los usuarios.'); return; }
            restaurarEnCadena(lista, i + 1);
          })
          .withFailureHandler(function(err) { fallo('Error al deshacer: ' + err); })
          .restaurarPacienteWeb(lista[i]);
      }

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);
      document.getElementById('btnDeshacer').addEventListener('click', ejecutarDeshacer);

      // ---------- Dar de alta ----------
      document.getElementById('btnAlta').addEventListener('click', async function() {
        if (!pacienteSeleccionado) return;
        var confirmado = await mostrarConfirm('¿Dar de alta a ' + pacienteSeleccionado['Nombre'] + '?');
        if (!confirmado) return;

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Procesando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.innerHTML = textoOriginal;
            mostrarAviso(res.message);
            if (window.HCCache) HCCache.cambioDeUsuario();   // el alta cambia el episodio de la HC
            quitarSeleccion();
            cargar();
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerHTML = textoOriginal;
            mostrarAviso('Error al dar de alta: ' + err);
          })
          .darDeAltaPacienteWeb(idPaciente(pacienteSeleccionado));
      });

      // ---------- Generar Historia Clínica ----------
      document.getElementById('btnHistoria').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;

        var btn = this;
        var textoOriginal = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined">progress_activity</span> Generando…';

        google.script.run
          .withSuccessHandler(function(res) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso(res.message);
            if (res.success) cargar();
          })
          .withFailureHandler(function(err) {
            btn.innerHTML = textoOriginal;
            btn.disabled = !pacienteSeleccionado;
            mostrarAviso('Error al generar la historia clínica: ' + err);
          })
          .generarHistoriaClinicaWeb(idPaciente(pacienteSeleccionado));
      });

      // ---------- WhatsApp ----------
      // Un solo usuario: ventana con el mensaje predefinido para revisarlo y elegir WhatsApp Web o la app de escritorio.
      document.getElementById('btnWhatsapp').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        WhatsappDialogo.abrir('datosWhatsappMaestraWeb', [idPaciente(pacienteSeleccionado)], pacienteSeleccionado['Nombre']);
      });
      // Al pasar el ratón por el botón de WhatsApp de una fila se piden ya los datos: al hacer clic el diálogo sale con el mensaje listo.
      document.addEventListener('pointerover', function(e) {
        var btn = e.target.closest ? e.target.closest('.btn-whatsapp') : null;
        var idWa = btn && btn.dataset.fila ? idDeFila(Number(btn.dataset.fila)) : '';
        if (idWa) WhatsappDialogo.precargar('datosWhatsappMaestraWeb', [idWa]);
      });

      // ---------- Editar, Cita y Valoración: formularios en el panel lateral ----------
      document.getElementById('btnEditar').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirFormularioPanel('editar');
      });

      document.getElementById('btnCita').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirFormularioPanel('cita');
      });

      document.getElementById('btnValoracion').addEventListener('click', function() {
        if (!pacienteSeleccionado) return;
        abrirFormularioPanel('valoracion');
      });

      var temporizadorBusqueda = null;
      document.getElementById('inputBusqueda').addEventListener('input', function() {
        clearTimeout(temporizadorBusqueda);
        temporizadorBusqueda = setTimeout(render, 150);
      });

      // Esc vacía la búsqueda (render la repinta y guarda la vista). Devuelve true si había texto.
      function limpiarBusqueda() {
        var inp = document.getElementById('inputBusqueda');
        clearTimeout(temporizadorBusqueda);
        if (!inp.value) return false;
        inp.value = '';
        render();
        return true;
      }
      // Con el cursor en la búsqueda: Esc la vacía y suelta el foco, sin cerrar la ficha que haya detrás.
      document.getElementById('inputBusqueda').addEventListener('keydown', function(e) {
        if (e.key !== 'Escape') return;
        e.stopPropagation();
        limpiarBusqueda();
        this.blur();
      });

      var TEMAS = ['auto', 'oscuro', 'claro'], ICONOS_TEMA = { auto: 'contrast', oscuro: 'dark_mode', claro: 'light_mode' };
      function aplicarTema(t, guardar) {
        if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);
        var b = document.getElementById('btnTema');
        b.innerHTML = '<span class="material-symbols-outlined">' + ICONOS_TEMA[t] + '</span>';
        b.title = 'Tema: ' + t + ' (clic para cambiar)';
        b.dataset.tema = t;
        if (guardar) { try { localStorage.setItem('temaApp', t); } catch (err) { /* sin almacenamiento */ } }
      }
      document.getElementById('btnTema').addEventListener('click', function() {
        aplicarTema(TEMAS[(TEMAS.indexOf(this.dataset.tema || 'auto') + 1) % TEMAS.length], true);
      });
      (function() {
        var t = 'auto';
        try { t = localStorage.getItem('temaApp') || 'auto'; } catch (err) { /* sin almacenamiento */ }
        aplicarTema(TEMAS.indexOf(t) === -1 ? 'auto' : t, false);
      })();

      restaurarVista();
      cargar();
    </script>
  </body>
