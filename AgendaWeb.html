<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      <?!= include('CSS_Global'); ?>

      html, body { height: 100%; }
      body {
        font-family: var(--font);
        background: var(--md-bg);
        color: var(--md-on-surface);
        display: flex;
        flex-direction: column;
        font-size: 13px;
      }

      header.top {
        background: var(--md-surface);
        border-bottom: 1px solid var(--md-outline);
        padding: .75rem 1rem;
        flex-shrink: 0;
      }
      header.top h1 {
        font-size: 1.05rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-bottom: .6rem;
      }
      header.top .contador { font-size: .78rem; color: var(--md-on-surface-med); font-weight: 400; }

      .barra-herramientas {
        display: flex;
        gap: .4rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: .6rem;
        padding-bottom: .6rem;
        border-bottom: 1px solid var(--md-outline);
      }
      .btn-toolbar {
        display: inline-flex;
        align-items: center;
        gap: .3rem;
        background: var(--md-surface);
        border: 1px solid var(--md-outline);
        color: var(--md-on-surface);
        border-radius: var(--radius-pill);
        padding: .35rem .8rem;
        font-size: .8rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        font-family: var(--font);
      }
      .btn-toolbar:hover { background: var(--md-surface-variant); }
      .btn-toolbar.primario { background: #c2e7ff; border-color: #c2e7ff; color: #004a77; }
      .btn-toolbar.primario:hover { background: #a8d9f9; border-color: #a8d9f9; }
      .btn-toolbar:disabled { opacity: .45; cursor: not-allowed; }
      /* Botón "Deshacer": solo se muestra tras una eliminación, hasta que se
         usa, se hace otra eliminación encima, o se cambia de semana/pestaña
         (al ser una página independiente, el estado no sobrevive a eso). */
      .btn-toolbar.deshacer { display: none; background: var(--md-warning-bg); border-color: var(--md-warning); color: #7a4f00; }
      .btn-toolbar.deshacer.visible { display: inline-flex; }
      .btn-toolbar.deshacer:hover { background: #fdecc0; }
      .toast-deshacer {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: #323232; color: #fff; padding: .65rem 1rem; border-radius: var(--radius-md);
        display: flex; align-items: center; gap: 1rem; font-size: .82rem;
        box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 1200;
        opacity: 0; pointer-events: none; transition: opacity 200ms ease;
      }
      .toast-deshacer.visible { opacity: 1; pointer-events: auto; }
      .toast-deshacer button {
        background: none; border: none; color: #8ab4f8; font-weight: 700; font-size: .82rem;
        cursor: pointer; font-family: var(--font); padding: 0; letter-spacing: .02em;
      }
      .toast-deshacer button:hover { text-decoration: underline; }
      .btn-toolbar.activo { background: var(--md-primary-light); border-color: var(--md-primary); color: var(--md-primary-dark); }
      .btn-toolbar .material-symbols-outlined { font-size: 17px; }
      .btn-toolbar.btn-nav { padding: .35rem .55rem; }

      .etiqueta-semana {
        font-size: .8rem;
        font-weight: 600;
        color: var(--md-primary-dark);
        white-space: nowrap;
        text-transform: capitalize;
        background: var(--md-primary-light);
        border-radius: var(--radius-pill);
        padding: .3rem .8rem;
      }

      .etiqueta-ayuda { font-size: .78rem; color: var(--md-on-surface-low); white-space: nowrap; padding: 0 .2rem; }

      .selector-semana {
        display: flex; align-items: center; gap: .3rem;
        background: var(--md-surface-variant); border-radius: var(--radius-pill);
        padding: .3rem .7rem; margin-left: auto;
      }
      .selector-semana .material-symbols-outlined { color: var(--md-on-surface-low); font-size: 18px; }
      .selector-semana input {
        border: none; outline: none; background: transparent; font-family: var(--font); font-size: .8rem; color: var(--md-on-surface);
      }

      .controles { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
      .buscador {
        display: flex; align-items: center; gap: .4rem;
        background: var(--md-surface-variant); border-radius: var(--radius-pill);
        padding: .4rem .8rem; flex: 1; min-width: 200px;
      }
      .buscador input { border: none; outline: none; flex: 1; font-size: .85rem; font-family: var(--font); background: transparent; }
      .buscador .material-symbols-outlined { color: var(--md-on-surface-low); font-size: 18px; }

      .tabla-wrap { flex: 1; overflow: auto; }
      table { border-collapse: collapse; width: 100%; min-width: 900px; table-layout: fixed; }
      thead th {
        position: sticky; top: 0; background: var(--md-surface-variant); color: var(--md-on-surface-med);
        font-size: .68rem; text-transform: uppercase; letter-spacing: .02em; font-weight: 600; text-align: left;
        padding: .4rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; z-index: 2;
      }
      thead th:nth-child(1), tbody td:nth-child(1) {
        position: sticky; left: 0; width: 60px; min-width: 60px; max-width: 60px;
        background: var(--md-surface-variant); z-index: 3; box-shadow: 1px 0 0 var(--md-outline);
      }
      tbody td:nth-child(1) { background: var(--md-surface); z-index: 1; }
      thead th:nth-child(2), tbody td:nth-child(2) {
        position: sticky; left: 60px; width: 210px; min-width: 210px; max-width: 210px;
        background: var(--md-surface-variant); z-index: 3; box-shadow: 1px 0 0 var(--md-outline);
      }
      tbody td:nth-child(2) { background: var(--md-surface); z-index: 1; }
      /* Teléfono, Sesión, Asistencia, Historia clínica: anchos ajustados a su
         contenido real. Notas se deja sin ancho fijo para que se quede con
         todo el espacio sobrante (table-layout: fixed reparte así lo que no
         está explícitamente asignado). */
      thead th:nth-child(3), tbody td:nth-child(3) { width: 112px; }
      thead th:nth-child(4), tbody td:nth-child(4) { width: 64px; }
      thead th:nth-child(5), tbody td:nth-child(5) { width: 110px; }
      thead th:nth-child(6), tbody td:nth-child(6) { width: 110px; }
      thead th:nth-child(8), tbody td:nth-child(8) { width: 44px; text-align: center; }

      /* Filas estrechas con alternancia de color, como en la hoja de Sheets.
         Se aplica por clase (no nth-child) porque las filas de cabecera de
         día intercaladas en la tabla romperían la paridad par/impar. */
      tbody tr.fila-par { background: #fbfbfc; }
      tbody tr.fila-par td:nth-child(1), tbody tr.fila-par td:nth-child(2) { background: #fbfbfc; }

      /* Fila-etiqueta de cambio de turno (mañana -> tarde): mismo lenguaje
         visual que la cabecera de día, para que el corte se vea de un
         vistazo en vez de un simple borde sutil. */
      tbody tr.fila-turno td {
        position: static !important; width: auto !important; min-width: 0 !important; max-width: none !important;
        background: var(--md-warning-bg) !important; color: var(--md-warning);
        font-weight: 700; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
        padding: .3rem .6rem; border-top: 1px solid var(--md-outline); border-bottom: 1px solid var(--md-outline);
      }

      /* Hueco libre (hora real sin paciente asignado): más discreto que una
         cita real, para que a simple vista destaquen las citas confirmadas. */
      tbody tr.fila-hueco td { color: var(--md-on-surface-low); }
      tbody tr.fila-hueco td.hueco-libre { font-style: italic; }

      /* Selección de cita (mismo patrón que la Base de Datos) */
      tbody tr.seleccionada td { background: var(--md-primary-container) !important; }

      /* Cabecera de grupo por día: sustituye a repetir Fecha/Día en cada fila */
      tbody tr.fila-dia td {
        position: static !important; width: auto !important; min-width: 0 !important; max-width: none !important;
        background: var(--md-primary-light) !important; color: var(--md-primary-dark);
        font-weight: 600; font-size: .78rem; text-transform: capitalize;
        padding: .4rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: normal;
      }

      tbody td { padding: .32rem .6rem; border-bottom: 1px solid var(--md-outline); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
      td.hora { font-weight: 600; }
      td.vacio { color: var(--md-on-surface-low); font-style: italic; }

      td a.link-hc { color: var(--md-primary); text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; gap: .2rem; }
      td a.link-hc:hover { text-decoration: underline; }

      /* Edición en línea */
      td.editable { cursor: pointer; }
      td.editable:hover { background: var(--md-primary-light) !important; }
      td.editando { padding: .18rem .3rem; overflow: visible; position: relative; }
      /* Indicador de autoguardado: aparece a la derecha del campo mientras
         se está editando, sin necesidad de salir de la celda para saber si
         se ha guardado. */
      .estado-guardado {
        position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
        font-size: .8rem; font-weight: 700; pointer-events: none;
      }
      .estado-guardado.progreso { color: var(--md-on-surface-low); font-weight: 400; }
      .estado-guardado.ok { color: var(--md-success); }
      .estado-guardado.fallo { color: var(--md-error); }
      .input-celda {
        width: 100%; font-family: var(--font); font-size: .8rem; color: var(--md-on-surface);
        border: 1px solid var(--md-primary); border-radius: var(--radius-sm); padding: .2rem .35rem;
        background: var(--md-surface); outline: none;
      }
      .btn-borrar-fila {
        display: inline-flex; align-items: center; justify-content: center;
        width: 24px; height: 24px; border-radius: 50%; border: none; background: transparent;
        color: var(--md-on-surface-low); cursor: pointer; transition: var(--transition);
      }
      .btn-borrar-fila:hover { background: var(--md-error-bg); color: var(--md-error); }
      .btn-borrar-fila .material-symbols-outlined { font-size: 17px; }

      .estado-vacio, .estado-carga { text-align: center; color: var(--md-on-surface-med); padding: 3rem 1rem; font-size: .9rem; }
      .estado-carga .material-symbols-outlined { font-size: 28px; animation: spin 1s linear infinite; display: block; margin: 0 auto .5rem; color: var(--md-primary); }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Modal propio (sustituye a alert()/confirm() nativos) ---------- */
      .modal-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(32,33,36,.5);
        align-items: center; justify-content: center;
        z-index: 1000;
        padding: 1rem;
      }
      .modal-overlay.visible { display: flex; }
      .modal-box {
        background: var(--md-surface);
        border-radius: var(--radius-md);
        padding: 1.25rem 1.5rem;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0,0,0,.25);
      }
      .modal-mensaje {
        font-size: .88rem;
        color: var(--md-on-surface);
        white-space: pre-line;
        line-height: 1.45;
        margin-bottom: 1.15rem;
      }
      .modal-botones { display: flex; justify-content: flex-end; gap: .5rem; }

      /* Pestañas para alternar entre Agenda y Base de Datos. Son enlaces
         normales (navegación con recarga) porque las Web Apps de Apps
         Script no se pueden embeber en un iframe (Google lo bloquea) — ver
         el mismo comentario en BaseDatosWeb.html, donde por eso se usa
         window.open() en vez de un iframe para el formulario de edición. */
      nav.tabs-cambio {
        display: flex; gap: .25rem; flex-shrink: 0;
        background: #f8fafd; padding: .5rem .75rem 0;
        border-bottom: 1px solid var(--md-outline);
      }
      nav.tabs-cambio a.tab-cambio {
        display: inline-flex; align-items: center; gap: .35rem;
        background: transparent; color: #004a77; text-decoration: none;
        font-family: var(--font); font-weight: 600; font-size: .82rem;
        padding: .5rem 1rem; border-radius: 8px 8px 0 0; transition: var(--transition);
      }
      nav.tabs-cambio a.tab-cambio:hover { background: rgba(0,74,119, .05); }
      nav.tabs-cambio a.tab-cambio.activo { background: #c2e7ff; color: #004a77; cursor: default; }
    </style>
  </head>

    <!-- Modal propio: sustituye a los alert()/confirm() nativos del navegador,
         que en la Web App muestran el dominio interno de Google (feo y confuso). -->
    <?!= include('Modal_Deshacer'); ?>

    <script>
      // Hora a partir de la cual una cita se considera "de tarde" para la
      // línea divisoria entre turnos. Formato "HH:mm" (comparación de texto,
      // válida porque el servidor siempre manda la hora con dos dígitos).
      // Cambia este valor si tu corte de turno no es a las 14:00.
      var HORA_CORTE_TARDE = '14:00';

      var BASE_URL = '<?= baseUrl ?>';
      var filasSeleccionadas = new Set(); // números de fila (Agenda) seleccionados

      // Columnas que la hoja de Sheets tiene pero no queremos mostrar en esta
      // vista (comparación normalizada: sin mayúsculas ni acentos).
      var COLUMNAS_OCULTAS = ['fecha', 'dia', 'id evento calendar'];

      var HEADERS = [];        // todas las columnas que manda el servidor
      var HEADERS_VISIBLES = []; // HEADERS sin Fecha/Día/ID Evento Calendar
      var CITAS = [];
      var COL_HISTORIA = null;
      var semanaActual = null; // lunes de la semana mostrada, "yyyy-MM-dd"
      var mostrarHuecos = false; // huecos horarios sin paciente asignado
      var OPCIONES_ASISTENCIA = []; // opciones del desplegable, leídas de Sheets
      var NOMBRES_PACIENTES = [];   // para el autocompletado al asignar un hueco

      function cargarListaPacientes() {
        google.script.run
          .withSuccessHandler(function(res) {
            NOMBRES_PACIENTES = Object.keys(res.allPatientsData || {});
            document.getElementById('listaPacientes').innerHTML =
              NOMBRES_PACIENTES.map(function(n) { return '<option value="' + escapar(n) + '">'; }).join('');
          })
          .withFailureHandler(function() { /* no crítico: el autocompletado simplemente no sugerirá nombres */ })
          .obtenerListaPacientesWeb();
      }

      // ---------- Carga de datos ----------
      // `silencioso`: true para refrescos en segundo plano (sondeo periódico
      // cada 30s) que no deben hacer parpadear toda la tabla — se piden los
      // datos y la tabla se sustituye solo cuando llegan, igual que hace
      // BaseDatosWeb. false/omitido: navegación explícita del usuario (Hoy,
      // flechas, selector de fecha), donde sí tiene sentido el aviso de
      // carga porque el contenido va a cambiar por completo.
      function cargar(fechaISO, silencioso) {
        if (!silencioso) {
          document.getElementById('tablaWrap').innerHTML =
            '<div class="estado-carga"><span class="material-symbols-outlined">progress_activity</span>Cargando agenda…</div>';
        }

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) { mostrarError(res.error); return; }
            HEADERS = res.headers || [];
            HEADERS_VISIBLES = HEADERS.filter(function(h) { return COLUMNAS_OCULTAS.indexOf(normalizar(h)) === -1; });
            CITAS = res.citas || [];
            OPCIONES_ASISTENCIA = res.opcionesAsistencia || [];
            COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });

            if (res.semana) {
              semanaActual = res.semana.lunes;
              document.getElementById('etiquetaSemana').textContent = res.semana.etiqueta;
              document.getElementById('inputSemana').value = res.semana.lunes;
            }
            render();
          })
          .withFailureHandler(mostrarError)
          .obtenerAgendaSemanaWeb(fechaISO || null);
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio">⚠️ No se pudo cargar la agenda.<br>' + (err && err.message ? err.message : err) + '</div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }
      function escapar(txt) { return (txt + '').replace(/</g, '&lt;'); }

      // Campos editables sueltos (Asistencia/Notas/Sesión) solo en citas
      // reales — en un hueco libre no tiene sentido editar esto, la única
      // acción posible ahí es escribir el nombre del paciente.
      var CAMPOS_EDITABLES = ['Asistencia', 'Notas', 'Sesión'];

      function renderCelda(header, valor, fila, esHueco) {
        var vacio = valor === '' || valor === null || valor === undefined;

        if (header === 'Hora') return '<td class="hora">' + (vacio ? '—' : escapar(valor)) + '</td>';

        if (header === 'Usuario' && esHueco) {
          return '<td class="editable hueco-libre" data-campo="Usuario" data-fila="' + fila + '" data-valor="">Disponible</td>';
        }

        if (header === COL_HISTORIA) {
          if (vacio) return '<td class="vacio">Sin enlace</td>';
          return esUrl(valor)
            ? '<td><a class="link-hc" href="' + valor + '" target="_blank" rel="noopener"><span class="material-symbols-outlined text-[15px]">description</span>Abrir</a></td>'
            : '<td>' + escapar(valor) + '</td>';
        }

        if (!esHueco && CAMPOS_EDITABLES.indexOf(header) !== -1) {
          var valorAttr = vacio ? '' : (valor + '').replace(/"/g, '&quot;');
          return '<td class="editable' + (vacio ? ' vacio' : '') + '" data-campo="' + header + '" data-fila="' + fila + '" data-valor="' + valorAttr + '">' + (vacio ? '—' : escapar(valor)) + '</td>';
        }

        return '<td class="' + (vacio ? 'vacio' : '') + '">' + (vacio ? '—' : escapar(valor)) + '</td>';
      }

      // ---------- Render tabla ----------
      function render() {
        var termino = normalizar(document.getElementById('inputBusqueda').value);

        var filtradas = CITAS.filter(function(c) {
          if (!mostrarHuecos && c._hueco) return false;
          if (!termino) return true;
          var campos = [c['Usuario'], c['Notas'], c['Sesión']];
          return campos.some(function(v) { return normalizar(v).indexOf(termino) !== -1; });
        });

        var numCitas = filtradas.filter(function(c) { return !c._hueco; }).length;
        document.getElementById('contador').textContent = numCitas + (numCitas === 1 ? ' cita' : ' citas');

        var cont = document.getElementById('tablaWrap');
        if (filtradas.length === 0) {
          cont.innerHTML = '<div class="estado-vacio">No hay ninguna cita que coincida en esta semana.</div>';
          return;
        }

        var numColumnas = HEADERS_VISIBLES.length + 1; // +1 por la columna de Acciones
        var thead = '<thead><tr>' + HEADERS_VISIBLES.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '<th></th></tr></thead>';

        // Agrupamos las citas (ya vienen ordenadas cronológicamente del
        // servidor) por día, para mostrar la Fecha y el Día una sola vez por
        // grupo en vez de repetirlos en cada fila.
        var grupos = [];
        filtradas.forEach(function(c) {
          var ultimo = grupos[grupos.length - 1];
          if (!ultimo || ultimo.fechaISO !== c._fechaISO) {
            grupos.push({ fechaISO: c._fechaISO, dia: c['Día'], fecha: c['Fecha'], citas: [c] });
          } else {
            ultimo.citas.push(c);
          }
        });

        var contadorFila = 0;

        var tbody = '<tbody>' + grupos.map(function(g) {
          var etiquetaDia = (g.dia ? escapar(g.dia) + ' · ' : '') + escapar(g.fecha);
          var cabecera = '<tr class="fila-dia"><td colspan="' + numColumnas + '">' + etiquetaDia + '</td></tr>';

          var mananaAnterior = null;

          var filasDia = g.citas.map(function(c) {
            var celdas = HEADERS_VISIBLES.map(function(h) { return renderCelda(h, c[h], c._fila, c._hueco); }).join('');
            var celdaAcciones = c._hueco
              ? '<td></td>'
              : '<td><button type="button" class="btn-borrar-fila" data-fila="' + c._fila + '" title="Liberar este hueco (borra todos los datos de la cita)"><span class="material-symbols-outlined">delete</span></button></td>';

            var esManana = (c['Hora'] || '') < HORA_CORTE_TARDE;
            var divisor = (mananaAnterior === true && esManana === false);
            mananaAnterior = esManana;

            // Cambio de turno: fila-etiqueta bien visible en vez de un
            // simple borde, para que el corte mañana/tarde se note de un
            // vistazo (igual que ya se hace con la cabecera de cada día).
            var filaEtiquetaTurno = divisor
              ? '<tr class="fila-turno"><td colspan="' + numColumnas + '">Turno de tarde</td></tr>'
              : '';

            var clases = [];
            if (c._hueco) clases.push('fila-hueco');
            if (contadorFila % 2 === 1) clases.push('fila-par');
            if (filasSeleccionadas.has(c._fila)) clases.push('seleccionada');
            contadorFila++;

            return filaEtiquetaTurno + '<tr class="' + clases.join(' ') + '" data-fila="' + c._fila + '">' + celdas + celdaAcciones + '</tr>';
          }).join('');

          return cabecera + filasDia;
        }).join('') + '</tbody>';

        cont.innerHTML = '<table>' + thead + tbody + '</table>';
      }

      // ---------- Edición en línea ----------
      function activarEdicion(td) {
        var campo = td.dataset.campo;
        var fila = td.dataset.fila;
        var valorActual = td.dataset.valor || '';

        td.classList.add('editando');

        if (campo === 'Asistencia') {
          var opciones = '<option value="">—</option>' + OPCIONES_ASISTENCIA.map(function(op) {
            return '<option value="' + escapar(op) + '"' + (op === valorActual ? ' selected' : '') + '>' + escapar(op) + '</option>';
          }).join('');
          td.innerHTML = '<select class="input-celda">' + opciones + '</select>';
          var select = td.querySelector('select');
          select.focus();
          select.addEventListener('change', function() { guardarCampo(fila, campo, select.value); });
          select.addEventListener('blur', function() {
            setTimeout(function() { if (td.classList.contains('editando')) render(); }, 150);
          });
          return;
        }

        if (campo === 'Usuario') {
          td.innerHTML = '<input class="input-celda" list="listaPacientes" type="text" placeholder="Nombre del usuario…">';
          var inputNombre = td.querySelector('input');
          inputNombre.focus();
          inputNombre.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') inputNombre.blur();
            if (ev.key === 'Escape') render();
          });
          inputNombre.addEventListener('blur', function() {
            var nombre = inputNombre.value.trim();
            if (!nombre) { render(); return; }
            asignarPaciente(fila, nombre);
          });
          return;
        }

        // Notas y Sesión: texto libre. Autoguardado tras una breve pausa al
        // escribir (no hace falta salir del campo ni pulsar Enter), con un
        // pequeño indicador de estado a la derecha. Enter guarda al momento
        // y sale del campo; Escape cancela el guardado pendiente y descarta
        // los cambios sin confirmar (los ya autoguardados no se deshacen,
        // igual que en Sheets o Docs).
        td.innerHTML = '<input class="input-celda" type="text" value="' + escapar(valorActual) + '">';
        var input = td.querySelector('input');
        input.focus();
        input.select();

        var autoguardadoPendiente = null;

        input.addEventListener('input', function() {
          if (autoguardadoPendiente) clearTimeout(autoguardadoPendiente);
          autoguardadoPendiente = setTimeout(function() {
            autoguardadoPendiente = null;
            guardarCampoSilencioso(fila, campo, input.value, td);
          }, 700);
        });

        input.addEventListener('keydown', function(ev) {
          if (ev.key === 'Enter') {
            if (autoguardadoPendiente) { clearTimeout(autoguardadoPendiente); autoguardadoPendiente = null; }
            input.blur();
          }
          if (ev.key === 'Escape') {
            if (autoguardadoPendiente) { clearTimeout(autoguardadoPendiente); autoguardadoPendiente = null; }
            render();
          }
        });
        input.addEventListener('blur', function() {
          if (autoguardadoPendiente) { clearTimeout(autoguardadoPendiente); autoguardadoPendiente = null; }
          guardarCampo(fila, campo, input.value);
        });
      }

      // Indicador visual (…/✓/⚠) dentro de la celda que se está editando,
      // para que el autoguardado se note sin tener que salir del campo.
      function mostrarEstadoGuardado(td, estado) {
        if (!td || !td.classList.contains('editando')) return; // ya se cerró la edición, no la tocamos
        var marca = td.querySelector('.estado-guardado');
        if (!marca) {
          marca = document.createElement('span');
          marca.className = 'estado-guardado';
          td.appendChild(marca);
        }
        if (estado === 'progreso') {
          marca.className = 'estado-guardado progreso';
          marca.textContent = '…';
          marca.title = 'Guardando…';
        } else if (estado === 'ok') {
          marca.className = 'estado-guardado ok';
          marca.textContent = '✓';
          marca.title = 'Guardado';
          setTimeout(function() { if (marca) marca.textContent = ''; }, 1200);
        } else {
          marca.className = 'estado-guardado fallo';
          marca.textContent = '⚠';
          marca.title = 'No se pudo guardar';
        }
      }

      // Guardado en segundo plano mientras se sigue editando: NO repinta la
      // tabla entera (eso haría perder el foco y el cursor a media escritura),
      // solo actualiza los datos en memoria y el indicador visual de la celda.
      function guardarCampoSilencioso(fila, campo, valor, td) {
        mostrarEstadoGuardado(td, 'progreso');
        google.script.run
          .withSuccessHandler(function(res) {
            var cita = CITAS.find(function(c) { return c._fila == fila; });
            if (cita) cita[campo] = valor;
            mostrarEstadoGuardado(td, res.success ? 'ok' : 'fallo');
          })
          .withFailureHandler(function() { mostrarEstadoGuardado(td, 'fallo'); })
          .actualizarCampoAgendaWeb(fila, campo, valor);
      }

      function guardarCampo(fila, campo, valor) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudo guardar el cambio.'); render(); return; }
            // Parche local: actualizamos solo esta cita en memoria y volvemos
            // a pintar la tabla sin volver a pedirle al servidor toda la
            // semana (eso es lo que hacía lento cada edición).
            var cita = CITAS.find(function(c) { return c._fila == fila; });
            if (cita) cita[campo] = valor;
            render();
          })
          .withFailureHandler(function(err) {
            mostrarAviso('Error al guardar: ' + err);
            render();
          })
          .actualizarCampoAgendaWeb(fila, campo, valor);
      }

      function asignarPaciente(fila, nombre) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudo asignar el usuario.'); render(); return; }
            var cita = CITAS.find(function(c) { return c._fila == fila; });
            if (cita) {
              cita['Usuario'] = res.usuario;
              cita['Teléfono'] = res.telefono;
              if (COL_HISTORIA) cita[COL_HISTORIA] = res.historiaClinica;
              cita._hueco = false;
            }
            render();
          })
          .withFailureHandler(function(err) {
            mostrarAviso('Error al asignar el usuario: ' + err);
            render();
          })
          .asignarPacienteHuecoWeb(fila, nombre);
      }

      async function manejarBorrarFila(fila) {
        var confirmado = await mostrarConfirm('¿Eliminar cita? Se borrarán los datos de la cita');
        if (!confirmado) return;

        // Foto de los datos actuales, ANTES de liberarlos, para poder deshacer.
        var citaOriginal = CITAS.find(function(c) { return c._fila == fila; });
        var snapshot = citaOriginal ? [{ fila: fila, valores: Object.assign({}, citaOriginal) }] : null;

        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudo liberar el hueco.'); render(); return; }
            var cita = CITAS.find(function(c) { return c._fila == fila; });
            if (cita) {
              cita['Usuario'] = '';
              cita['Teléfono'] = '';
              cita['Sesión'] = '';
              cita['Asistencia'] = '';
              cita['ID Evento Calendar'] = '';
              if (COL_HISTORIA) cita[COL_HISTORIA] = '';
              cita['Notas'] = '';
              cita._hueco = true;
            }
            render();
            actualizarBotonesSeleccion();
            if (snapshot) mostrarDeshacer(snapshot, 'Cita eliminada.');
          })
          .withFailureHandler(function(err) {
            mostrarAviso('Error: ' + err);
            render();
          })
          .eliminarDatosFilaAgendaWeb(fila);
      }

      // ---------- Eliminar varias citas a la vez (selección múltiple) ----------
      async function manejarEliminarSeleccionadas() {
        var sel = citasSeleccionadas();
        if (sel.length === 0) return;

        var mensaje = '¿Eliminar cita? Se borrarán los datos de la cita';
        var confirmado = await mostrarConfirm(mensaje);
        if (!confirmado) return;

        // Foto de cada cita seleccionada, ANTES de liberarlas, para deshacer.
        var snapshot = sel.map(function(c) { return { fila: c._fila, valores: Object.assign({}, c) }; });
        var filas = sel.map(function(c) { return c._fila; });

        google.script.run
          .withSuccessHandler(function(res) {
            if (!res.success) { mostrarAviso(res.message || 'No se pudieron eliminar las citas.'); return; }
            mostrarAviso(res.message);
            quitarSeleccion();
            cargar(semanaActual, true);
            mostrarDeshacer(snapshot, snapshot.length === 1 ? 'Cita eliminada.' : snapshot.length + ' citas eliminadas.');
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .eliminarVariasCitasWeb(filas);
      }

      document.getElementById('btnEliminarCitas').addEventListener('click', manejarEliminarSeleccionadas);

      function ejecutarDeshacer() {
        if (!ultimaEliminacion || procesandoDeshacer) return;
        procesandoDeshacer = true;
        var snapshot = ultimaEliminacion;

        google.script.run
          .withSuccessHandler(function(res) {
            procesandoDeshacer = false;
            if (!res.success) { mostrarAviso(res.message || 'No se pudo deshacer.'); return; } // el botón sigue disponible para reintentar
            ocultarDeshacer();
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) {

      document.getElementById('toastDeshacerBtn').addEventListener('click', ejecutarDeshacer);

      // ---------- Selección múltiple de citas (mismo patrón que la Base de
      // Datos, pero el clic AÑADE o QUITA de la selección en vez de

      var BOTONES_UNA_SOLA = ['btnValoracion', 'btnWhatsapp'].map(function(id) { return document.getElementById(id); });
      var BOTONES_UNA_O_MAS = ['btnCopiarCita', 'btnCopiarCita2', 'btnEliminarCitas'].map(function(id) { return document.getElementById(id); });

      function citasSeleccionadas() {
        return CITAS.filter(function(c) { return filasSeleccionadas.has(c._fila) && !c._hueco; });
      }

      function alternarSeleccionFila(cita) {
        if (filasSeleccionadas.has(cita._fila)) filasSeleccionadas.delete(cita._fila);
        else filasSeleccionadas.add(cita._fila);
        render();
        actualizarBotonesSeleccion();

      function quitarSeleccion() {
        filasSeleccionadas.clear();
        render();
        actualizarBotonesSeleccion();
      }

      function actualizarBotonesSeleccion() {
        var n = citasSeleccionadas().length;
        BOTONES_UNA_SOLA.forEach(function(btn) { btn.disabled = (n !== 1); });
        BOTONES_UNA_O_MAS.forEach(function(btn) { btn.disabled = (n === 0); });

        var contador = document.getElementById('contadorSeleccion');
        contador.textContent = n > 0 ? (n + (n === 1 ? ' cita seleccionada' : ' citas seleccionadas')) : '';
        document.getElementById('btnQuitarSeleccion').style.display = n > 0 ? 'inline-flex' : 'none';
      }

      document.getElementById('btnQuitarSeleccion').addEventListener('click', quitarSeleccion);

      document.getElementById('tablaWrap').addEventListener('click', function(e) {
        if (e.target.closest('td.editando')) return; // no seleccionar mientras se edita una celda

        var tdEditable = e.target.closest('td.editable');
        if (tdEditable && !tdEditable.classList.contains('editando')) {
          activarEdicion(tdEditable);
          return;
        }
        var btnBorrar = e.target.closest('.btn-borrar-fila');
        if (btnBorrar) {
          manejarBorrarFila(btnBorrar.dataset.fila);
          return;
        }
        var tr = e.target.closest('tr[data-fila]');
        if (tr) {
          var cita = CITAS.find(function(c) { return c._fila == tr.dataset.fila; });
          if (cita) alternarSeleccionFila(cita);
        }
      });

      // ---------- Preparar Jornada (abre las Historias Clínicas del turno de hoy) ----------
      function mostrarLanzadorHCs(urls, turno) {
        var overlay = document.getElementById('modalOverlay');
        var btnCancelar = document.getElementById('modalBtnCancelar');
        var btnAceptar = document.getElementById('modalBtnAceptar');

        document.getElementById('modalMensaje').textContent =
          'Se van a abrir ' + urls.length + (urls.length === 1 ? ' pestaña' : ' pestañas') +
          ' de Historia Clínica del turno de ' + turno + '. Si el navegador bloquea las ventanas emergentes, permite los popups de este sitio y vuelve a intentarlo.';
        btnCancelar.style.display = 'inline-flex';
        btnAceptar.textContent = 'Abrir Historias Clínicas';
        overlay.classList.add('visible');

        function limpiar() {
          overlay.classList.remove('visible');
          btnAceptar.textContent = 'Aceptar';
          btnAceptar.removeEventListener('click', onAbrir);
          btnCancelar.removeEventListener('click', onCancelar);
        }
        // Abrimos las ventanas DENTRO del propio clic de este botón (no tras
        // un await) para que cuenten como gesto directo del usuario y el
        // navegador no las bloquee.
        function onAbrir() { urls.forEach(function(url) { window.open(url, '_blank'); }); limpiar(); }

        btnCancelar.addEventListener('click', onCancelar);
      }

      // ---------- Copiar Siguiente Cita / ×2 (una o varias citas a la vez) ----------
      async function manejarCopiarSeleccionadas(doble, forzar) {
        var sel = citasSeleccionadas();
        if (sel.length === 0) return;
        var items = sel.map(function(c) { return { fila: c._fila, doble: doble }; });

        google.script.run
          .withSuccessHandler(async function(res) {

      document.getElementById('btnCopiarCita').addEventListener('click', function() { manejarCopiarSeleccionadas(false, false); });
      document.getElementById('btnCopiarCita2').addEventListener('click', function() { manejarCopiarSeleccionadas(true, false); });

      // ---------- Copiar Semana: miércoles y jueves (doble sesión) + viernes
      // (simple) de la semana que se está viendo → puebla toda la semana
      // siguiente sin tener que seleccionar nada a mano. No usa la selección
      // en absoluto; recorre CITAS directamente. ----------
      function diaSemanaDeCita(c) {
        var partes = c._fechaISO.split('-').map(Number);
        return new Date(partes[0], partes[1] - 1, partes[2]).getDay(); // 0=Dom … 6=Sáb
      }

      async function manejarCopiarSemana(forzar) {
        var items = CITAS
          .filter(function(c) {
            if (c._hueco) return false;
            var dia = diaSemanaDeCita(c);
            return dia === 3 || dia === 4 || dia === 5; // miércoles, jueves, viernes
          })
          .map(function(c) {
            var dia = diaSemanaDeCita(c);
            return { fila: c._fila, doble: (dia === 3 || dia === 4) };
          });

        if (items.length === 0) {
          mostrarAviso('No hay citas de miércoles, jueves o viernes en esta semana para copiar.');
          return;
        }

        google.script.run
          .withSuccessHandler(async function(res) {
            if (res.ocupado && !forzar) {
              var confirmado = await mostrarConfirm(res.message);
              if (confirmado) manejarCopiarSemana(true);
              return;
            }
            if (!res.success) { mostrarAviso(res.message || 'No se pudo copiar la semana.'); return; }
            mostrarAviso(res.message);
            cargar(semanaActual, true);
          })
          .withFailureHandler(function(err) { mostrarAviso('Error: ' + err); })
          .copiarVariasCitasWeb(items, !!forzar);
      }

      document.getElementById('btnCopiarSemana').addEventListener('click', function() { manejarCopiarSemana(false); });

      // ---------- Navegación de semana ----------
      function hoyISO() { return formatoISO(new Date()); }

      function formatoISO(d) {
        var m = (d.getMonth() + 1).toString().padStart(2, '0');
        var day = d.getDate().toString().padStart(2, '0');
        return d.getFullYear() + '-' + m + '-' + day;
      }

      document.getElementById('btnSemanaAnterior').addEventListener('click', function() {
        var partes = semanaActual.split('-').map(Number);
        var d = new Date(partes[0], partes[1] - 1, partes[2]);
        d.setDate(d.getDate() - 7);
        cargar(formatoISO(d));
      });

      document.getElementById('btnSemanaSiguiente').addEventListener('click', function() {
        var partes = semanaActual.split('-').map(Number);
        var d = new Date(partes[0], partes[1] - 1, partes[2]);
        d.setDate(d.getDate() + 7);
        cargar(formatoISO(d));
      });

      document.getElementById('btnHoy').addEventListener('click', function() {
        cargar(hoyISO());
      });

      document.getElementById('inputSemana').addEventListener('change', function(e) {
        if (e.target.value) cargar(e.target.value);
      });

      document.getElementById('inputBusqueda').addEventListener('input', render);

      document.getElementById('btnHuecos').addEventListener('click', function() {
        mostrarHuecos = !mostrarHuecos;
        actualizarBotonHuecos();
        render();
      });

      function actualizarBotonHuecos() {
        var btn = document.getElementById('btnHuecos');
        btn.innerHTML = mostrarHuecos
          ? '<span class="material-symbols-outlined">event_busy</span> Ocultar citas disponibles'
          : '<span class="material-symbols-outlined">event_available</span> Mostrar citas disponibles';
        btn.classList.toggle('activo', mostrarHuecos);
      }

      // Auto-refresh: en vez de repedir la semana completa cada X segundos,
      // sondeamos un dato muy barato (obtenerVersionAgendaWeb, Agenda Web.gs:
      // no lee la hoja de Agenda, solo consulta CacheService) y solo si ese
      // número cambió pedimos los datos completos con cargar(semanaActual,
      // true) — refresco silencioso, no repinta "Cargando agenda…", la tabla
      // se sustituye sola al llegar el dato nuevo. invalidarCacheAgenda_ se
      // llama tanto desde aquí (ediciones en la propia Agenda Web) como desde
      // guardarCitasMultiples (Cita.gs, formulario de Citas), así que este
      // sondeo detecta cambios hechos desde cualquiera de los dos sitios.
      // Se salta el ciclo si hay una celda en edición en ese momento, para no
      // perder lo que se está escribiendo.
      var ultimaVersionAgenda = null; // null = aún no se ha establecido la base de comparación

      function comprobarVersionAgenda() {
        if (!semanaActual) return;
        if (document.querySelector('td.editando')) return;

        google.script.run
          .withSuccessHandler(function(res) {
            if (!res || res.error) return; // fallo puntual: no rompe nada, se reintenta en el próximo ciclo
            if (ultimaVersionAgenda === null) { ultimaVersionAgenda = res.version; return; } // primera lectura: solo fija la base, no fuerza recarga
            if (res.version !== ultimaVersionAgenda) {
              ultimaVersionAgenda = res.version;
              cargar(semanaActual, true);
            }
          })
          .withFailureHandler(function() { /* no crítico: se reintenta en el próximo ciclo */ })
          .obtenerVersionAgendaWeb();
      }

      var AUTO_REFRESH_MS = 4000; // consulta barata, puede ir más rápido que los 30s de antes sin sobrecargar
      setInterval(comprobarVersionAgenda, AUTO_REFRESH_MS);

      // Aviso opcional desde otra pestaña: el formulario de Citas (y el de
      // edición de paciente) escriben en localStorage al guardar. En teoría
      // el evento 'storage' llegaría aquí al instante sin esperar al sondeo
      // de arriba, pero cada pestaña de una Web App de Apps Script carga en
      // un sandbox con origen distinto y aleatorio, así que este canal no es
      // fiable entre pestañas — cuando sí llega, adelanta el refresco;
      // cuando no, el sondeo de comprobarVersionAgenda() (cada 4s) lo cubre
      // igualmente. También es un refresco silencioso.
      window.addEventListener('storage', function(e) {
        if (e.key === 'pacienteActualizado' && semanaActual) {
          if (document.querySelector('td.editando')) return;
          cargar(semanaActual, true);
        }
      });

      cargar();
      cargarListaPacientes();
    </script>
  </body>
</html>
