/* ============================================================================
   ui/CSS_Ficha.html - Estilos de la FICHA DE USUARIO (panel lateral).
   Se incluye dentro de un bloque <style> con include('ui/CSS_Ficha') (igual que
   ui/CSS_Global) en usuarios/BaseDatos_Vista y agenda/Web_Vista.
   El marcado y la logica estan en ui/JS_Ficha. Solo usa las variables de
   ui/CSS_Global (color, letra, esquinas, sombras, tiempos), asi que se ve igual
   en las dos paginas. El foco con teclado lo da la regla global.
   ============================================================================ */

.fu { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--md-surface); color: var(--md-on-surface); font-family: var(--font); }

/* ---------- Cabecera: avatar, nombre, edad + estado, cerrar ---------- */
.fu-cab { flex: none; display: flex; align-items: center; gap: .9rem; padding: 1.1rem .8rem 1rem 1.25rem; }
.fu .fu-cab .avatar { width: 52px; height: 52px; font-size: var(--fs-title); }
.fu-tit { flex: 1; min-width: 0; }
.fu-nombre { font-size: var(--fs-title); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.fu-meta { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; font-size: var(--fs-sm); color: var(--md-on-surface-med); }
.fu-extra { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.fu-cerrar { align-self: flex-start; flex: none; border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; color: var(--md-on-surface-med); display: inline-flex; align-items: center; justify-content: center; transition: background-color var(--dur-1) var(--ease); }
.fu-cerrar:hover { background: var(--md-surface-variant); }
.fu-aviso { padding: 1rem 1.25rem; color: var(--md-on-surface-med); font-size: var(--fs-md); }

/* ---------- Chips (estado y gravedad) ---------- */
.fu-chip { display: inline-flex; align-items: center; border: none; font-family: var(--font); font-size: var(--fs-xs); font-weight: 600; line-height: 1.4; padding: .15rem .6rem; border-radius: var(--md-shape-full); white-space: nowrap; background: var(--md-surface-variant); color: var(--md-on-surface-med); }
.fu-chip.activo, .fu-chip.leve { background: var(--md-success-bg); color: var(--md-success); }
.fu-chip.espera, .fu-chip.moderado { background: var(--md-warning-bg); color: var(--md-warning-text); }
.fu-chip.contactara { background: var(--md-error-bg); color: var(--md-error); }
.fu-chip.grave { background: var(--md-error-bg); color: var(--md-error); }
.fu-chip.alta { background: var(--md-purple-bg); color: var(--md-purple); }
/* El chip de estado es un boton: punto de color + flecha. Pasar el raton = capa del color del texto al 8 % */
button.fu-chip { cursor: pointer; font-size: var(--fs-xs); padding: .28rem .45rem .28rem .7rem; }
button.fu-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: .4rem; flex-shrink: 0; }
button.fu-chip .material-symbols-outlined { font-size: 16px; margin-left: .1rem; opacity: .7; }
button.fu-chip:hover { background-image: linear-gradient(color-mix(in srgb, currentColor 8%, transparent), color-mix(in srgb, currentColor 8%, transparent)); }

/* ---------- Acciones rapidas ---------- */
.fu-acciones { flex: none; display: flex; gap: .4rem; padding: 0 1rem .9rem; border-bottom: 1px solid var(--md-outline); }
.fu-acc { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: .2rem; padding: .55rem .2rem; border: none; border-radius: var(--md-shape-md); background: var(--md-primary-light); color: var(--md-primary-dark);
  font-family: var(--font); font-size: var(--fs-2xs); font-weight: 600; cursor: pointer; transition: background-color var(--dur-1) var(--ease); }
.fu-acc:hover { background: var(--md-primary-container); }
.fu-acc .material-symbols-outlined { font-size: 20px; }
.fu-acc svg { width: 20px; height: 20px; }

/* ---------- Cuerpo y secciones (pildora azul con icono y linea) ---------- */
.fu-cuerpo { flex: 1 1 auto; min-height: 0; overflow: auto; }
.fu-sec { padding: 1.05rem 1.25rem 1.15rem; border-bottom: 1px solid var(--md-outline); }
.fu-sec:last-child { border-bottom: none; }
.fu-label { display: flex; align-items: center; gap: .6rem; margin-bottom: .7rem; }
.fu-pill { display: inline-flex; align-items: center; gap: .375rem; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--md-primary-dark); background: var(--md-primary-light); padding: .35rem .75rem; border-radius: var(--md-shape-full); }
.fu-pill .material-symbols-outlined { font-size: 15px; color: var(--md-primary); }
.fu-linea { flex: 1; height: 1px; background: var(--md-outline); }

/* ---------- Campos ---------- */
.fu-campo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .3rem 0; font-size: var(--fs-md); }
.fu-etq { color: var(--md-on-surface-med); font-size: var(--fs-sm); flex-shrink: 0; }
.fu-val { text-align: right; font-weight: 500; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.fu-campo.largo { display: block; }
.fu-campo.largo .fu-val { display: block; text-align: left; font-weight: 400; }
.fu-vacio { color: var(--md-on-surface-low); font-size: var(--fs-sm); }

/* Telefono: icono + numero copiable (+ "secundario" en pequeno) */
.fu-tel { display: flex; align-items: center; gap: .55rem; padding: .25rem 0; }
.fu-tel > .material-symbols-outlined { font-size: 18px; color: var(--md-primary); flex-shrink: 0; }
.fu-nota { font-size: var(--fs-2xs); font-weight: 500; color: var(--md-on-surface-low); }
.fu-copia { border: none; background: none; cursor: copy; font: inherit; font-weight: 600; color: var(--md-on-surface); display: inline-flex; align-items: center; gap: .3rem; padding: .15rem .4rem; margin: 0 -.4rem; border-radius: var(--md-shape-sm); font-variant-numeric: tabular-nums; transition: background-color var(--dur-1) var(--ease); }
.fu-tel .fu-copia { font-size: var(--fs-field); }
.fu-copia .material-symbols-outlined { font-size: 14px; opacity: 0; color: var(--md-on-surface-low); transition: opacity var(--dur-1) var(--ease); }
.fu-copia:hover { background: var(--md-primary-light); }
.fu-copia:hover .material-symbols-outlined, .fu-copia:focus-visible .material-symbols-outlined { opacity: 1; }

/* ---------- Edición directa (teléfonos y observaciones: ui/JS_Ficha, opción editable) ---------- */
/* El lápiz se ve al pasar el ratón por el campo o al llegar con el teclado; «Añadir …» se ve siempre. */
.fu-lapiz { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: none; background: none; border-radius: var(--md-shape-full); color: var(--md-on-surface-low); cursor: pointer; opacity: 0; transition: opacity var(--dur-1) var(--ease), background-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease); }
.fu-lapiz .material-symbols-outlined { font-size: 16px; }
.fu-editable:hover .fu-lapiz, .fu-lapiz:focus-visible { opacity: 1; }
.fu-lapiz:hover { background: var(--md-primary-light); color: var(--md-primary); }
.fu-editable .fu-campo.largo { display: flex; align-items: flex-start; gap: .5rem; }
.fu-editable .fu-campo.largo .fu-val { flex: 1; }
.fu-anadir { display: inline-flex; align-items: center; gap: .35rem; border: none; background: none; padding: .3rem .5rem; margin: .1rem -.5rem; border-radius: var(--md-shape-sm); font-family: var(--font); font-size: var(--fs-sm); font-weight: 500; color: var(--md-primary); cursor: pointer; transition: background-color var(--dur-1) var(--ease); }
.fu-anadir .material-symbols-outlined { font-size: 18px; }
.fu-anadir:hover { background: var(--md-primary-light); }
.fu-edicion { padding: .45rem 0 .35rem; }
.fu-edicion-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: .5rem; }

/* ---------- Otros datos: plegado y al final ---------- */
.fu-otros > summary { list-style: none; display: flex; align-items: center; gap: .6rem; padding: 1.05rem 1.25rem; cursor: pointer; }
.fu-otros > summary::-webkit-details-marker { display: none; }
.fu-otros > summary:focus-visible { outline-offset: -2px; }   /* el anillo va por dentro: la seccion ocupa todo el ancho */
.fu-chev { font-size: 20px; color: var(--md-on-surface-low); transition: transform var(--dur-2) var(--ease); }
.fu-otros[open] .fu-chev { transform: rotate(180deg); }
.fu-otros > .fu-campos { padding: 0 1.25rem 1.15rem; }

/* ---------- Pie con acciones propias de la pagina (opcional) ---------- */
/* Los botones del pie son .md-btn (--outline y --danger) de ui/CSS_Global; aquí solo su colocación */
.fu-pie { flex: none; display: flex; flex-wrap: wrap; gap: 8px; padding: .7rem 1rem; border-top: 1px solid var(--md-outline); }
.fu-boton.peligro { margin-left: auto; }

/* ---------- Menu flotante de estado (lo usa la Agenda; Usuarios tiene el suyo) ---------- */
.fu-menu { position: fixed; z-index: var(--z-popover); min-width: 190px; background: var(--md-surface); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); box-shadow: var(--md-elev-2); padding: .3rem; }
.fu-menu-item { display: flex; align-items: center; gap: .6rem; width: 100%; border: none; background: none; text-align: left; padding: .5rem .7rem; border-radius: var(--md-shape-sm); cursor: pointer; font-family: var(--font); font-size: var(--fs-sm); color: var(--md-on-surface); transition: background-color var(--dur-1) var(--ease); }
.fu-menu-item:hover, .fu-menu-item:focus-visible { background: var(--md-surface-variant); }
.fu-menu-item:focus-visible { outline-offset: -2px; }
.fu-menu-item .material-symbols-outlined { margin-left: auto; font-size: 18px; color: var(--md-primary); }
.fu-punto { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--md-on-surface-low); }
.fu-punto.activo { background: var(--md-success); }
.fu-punto.espera { background: var(--md-warning); }
.fu-punto.contactara { background: var(--md-error); }
.fu-punto.alta { background: var(--md-purple); }
