<!--
  JS_Cierre_Formulario.html
  Cierre unificado de formularios. Se incluye desde un scriptlet de tipo include('JS_Cierre_Formulario') con "!"
  (fuera de cualquier <script>), en páginas servidas con createTemplateFromFile().

  Cada página puede definir antes:
    window.CONTEXTO_FORM = 'dialogo' | 'popup' | 'pestana'   (por defecto 'dialogo')
    window.BASE_URL_FORM = URL de despliegue de la Web App   (solo para 'pestana')

  Contextos:
    dialogo → modal de Sheets (showModalDialog)              → google.script.host.close()
    popup   → ventana emergente (window.open) de la Web App  → avisa a la ventana madre, que la cierra
    pestana → Web App como página independiente             → vuelve a la Base de Datos
-->
<script>
  var CIERRE_DEMORA_MS = 1200;

  // Ventana que abrió esta. Dentro del <iframe> de Apps Script window.opener es
  // null: el opener real cuelga de la ventana de nivel superior (window.top),
  // y esa propiedad sí se puede leer entre orígenes distintos.
  function _ventanaPadre() {
    var o = null;
    try { o = window.top.opener; } catch (e) { /* inaccesible */ }
    if (!o) { try { o = window.opener; } catch (e) { /* inaccesible */ } }
    return o;
  }

  // Avisa a la ventana madre (Base de Datos, Agenda, Valoraciones).
  // Vía 1: postMessage. Vía 2: localStorage (evento 'storage').
  function notificarGuardado(tipo, guardado) {
    var ok = (guardado === undefined) ? true : !!guardado;
    try {
      var padre = _ventanaPadre();
      if (padre) padre.postMessage({ tipo: tipo || 'cerrarEdicionPaciente', guardado: ok }, '*');
    } catch (e) { /* opener ya no accesible */ }
    try {
      localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: ok, ts: Date.now() }));
    } catch (e) { /* localStorage no disponible (modo incógnito estricto, etc.) */ }
  }

  // opciones: { guardado: bool, demora: ms }
  function finalizarFormulario(opciones) {
    opciones = opciones || {};
    var guardado = !!opciones.guardado;
    var demora = (opciones.demora !== undefined) ? opciones.demora : CIERRE_DEMORA_MS;
    var contexto = window.CONTEXTO_FORM || 'dialogo';

    // En el diálogo de Sheets no hay ventana a la que avisar.
    if (contexto !== 'dialogo') notificarGuardado('cerrarEdicionPaciente', guardado);

    setTimeout(function () {
      if (contexto === 'popup') {
        try { window.top.close(); } catch (e) { /* bloqueado */ }
        try { window.close(); } catch (e) { /* bloqueado */ }
        // Segunda vía: pedir a la ventana que abrió esta que la cierre.
        try {
          var padre = _ventanaPadre();
          if (padre) padre.postMessage({ tipo: 'cerrarPopupFormulario' }, '*');
        } catch (e) { /* opener ya no accesible */ }

        // Red de seguridad: si nadie ha cerrado la ventana, avisamos de que el
        // guardado terminó y dejamos el dato en la consola (F12).
        setTimeout(function () {
          if (!guardado) return;
          var hayPadre = false;
          try { hayPadre = !!_ventanaPadre(); } catch (e) {}
          console.warn('[cierre] La ventana no se cerró. Ventana madre accesible:', hayPadre, '· historial:', history.length);
          _avisoCerrarManual();
        }, 600);
      } else if (contexto === 'pestana') {
        window.top.location.href = (window.BASE_URL_FORM || '') + '?page=baseDatos';
      } else {
        google.script.host.close();
      }
    }, demora);
  }

  function _avisoCerrarManual() {
    var d = document.createElement('div');
    d.textContent = '✓ Guardado. Ya puedes cerrar esta ventana.';
    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(168,230,184,.75);color:#1e4d2b;padding:12px 20px;border-radius:12px;font:500 14px sans-serif;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.15)';
    document.body.appendChild(d);
  }
</script>
