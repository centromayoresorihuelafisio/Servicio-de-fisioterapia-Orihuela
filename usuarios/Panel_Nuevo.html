<!--
  usuarios/Panel_Nuevo.html
  Formulario de Nuevo usuario como módulo del panel lateral de la Base de Datos Web (igual que Panel_Valoracion / Panel_Editar).
  Se incluye desde usuarios/BaseDatos_Vista con include('usuarios/Panel_Nuevo') en un scriptlet de impresion.
  API: PanelNuevo.abrir(contenedor, { onGuardado, onCancelar, onAbrirEditar, obtenerUsuarios })
  Devuelve { haCambiado(), alEscape(), cerrar() }:
    · haCambiado() → true si hay datos sin guardar (la Base de Datos pregunta antes de descartar).
    · alEscape()   → cierra primero una confirmación o un desplegable abierto; devuelve true si lo ha gestionado.
  Comportamiento:
    · El título y el botón de volver los pone el panel de la página (ficha-form-cab); aquí solo va el formulario.
    · Cancelar delega en onCancelar(): la página pregunta por los cambios sin guardar con su propio confirm.
    · Avisos de usuario ya existente (mismo DNI, teléfono o nombre parecido): en línea bajo cada campo mientras se rellena y, al guardar,
      en una capa DENTRO del panel. La comprobación es LOCAL, contra la lista que da opts.obtenerUsuarios() (en BaseDatos es TODOS, ya
      cargada en la página): sin llamadas al servidor. Nunca bloquea: se puede editar el existente, guardar igualmente o seguir editando.
    · Editar el existente → onAbrirEditar(fila): la página abre su formulario de edición (devuelve false si no encuentra esa fila).
    · Al guardar muestra el mensaje y, tras un instante, llama a onGuardado(mensaje) (la página recarga la tabla).
  Funciones de servidor (usuarios/Anadir_Usuario.gs): guardarPaciente y generarHistoriaClinicaRegistroUsuario.
  CSS acotado a .nu y basado en los tokens de la página (--md-*, respeta el tema oscuro). A 400 px todo va en una columna.
  Requiere ui/JS_Formato_Nombre en la página (sanitizeName, sanitizeDni, formatoNombreFinal, formatoDni, validarDni).
-->
<style>

/* ── Aviso en línea bajo un campo: ya existe un usuario con ese dato (una sola línea, para no ocupar alto) ── */
.nu .nu-aviso { display: none; align-items: center; gap: .4rem; margin: 4px 0 0 14px; padding: .15rem .3rem .15rem .5rem; min-height: 28px; border-radius: 8px; border-left: 3px solid var(--md-warning); background: var(--md-warning-bg); color: var(--md-on-surface); font-size: .75rem; line-height: 1.3; }

<script>
window.PanelNuevo = {
  abrir: function (host, opts) {
    opts = opts || {};
    var PATOLOGIAS = ["MS","MI","Dolor Crónico","Cervicalgia","Dorsalgia","Lumbalgia","Omalgia","Coxalgia","Gonalgia","Tendinopatía","Fascitis Plantar","Traumatismo","Caída","Fractura","Luxación","Esguince","Prótesis Hombro","Prótesis Rodilla","Estabilidad","Debilidad Muscular","Limitación Funcional","Alteración Marcha","Hernia Discal","Radiculopatía MS","Radiculopatía MI","Estenosis Medular","Parkinson","Esclerosis","Ictus","Linfedema","Cardiopatía","Enfermedad Respiratoria","Cáncer","Otro"];
    var SEVERITY_MAP = [
      { label: GRAVEDAD_PACIENTE.LEVE, cls: 'leve', min: 0, max: 3 },
      { label: GRAVEDAD_PACIENTE.MODERADO, cls: 'moderado', min: 4, max: 6 },
      { label: GRAVEDAD_PACIENTE.URGENTE, cls: 'urgente', min: 7, max: 9 }
    ];
    var ESTADOS = ESTADOS_PACIENTE.LISTA_NUEVO.slice(), ESTADO_DEF = ESTADOS_PACIENTE.DEFECTO_NUEVO;
    var INGRESOS = TIPOS_INGRESO.LISTA.slice(), INGRESO_DEF = TIPOS_INGRESO.DEFECTO;

    function hoyLocal() {
      var d = new Date(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + dd;
    }
    function campo(id, icono, etiqueta, opciones) {
      opciones = opciones || {};
      return '<div class="md-field' + (opciones.textarea ? ' is-textarea' : '') + (opciones.span ? ' span-2' : '') + '">' +
        '<div class="md-field-inner">' +
          '<div class="leading-icon"><span class="ms">' + icono + '</span></div>' +

    // Misma regla que buscarPosiblesDuplicadosWeb e Informe_Duplicados (usuarios/*.gs): si cambia allí, hay que cambiarla aquí.
    //  · DNI: igual. · Teléfono: igual a alguno de los dos de la ficha (sin espacios ni prefijo 34, mínimo 9 dígitos).

      a.appendChild(ico); a.appendChild(txt);
      if (res.total > 1) {
        var mas = document.createElement('span'); mas.className = 'nu-aviso-mas'; mas.textContent = '+' + (res.total - 1);
        mas.title = 'Hay ' + (res.total - 1) + ' coincidencia(s) más. Pasa el ratón por el texto para verlas todas.'; a.appendChild(mas);
      }
      var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'nu-aviso-btn'; btn.textContent = 'Editar'; btn.title = 'Abrir su ficha para editarla';
      btn.addEventListener('click', function () { irAEditar(c.fila); });
      a.appendChild(btn); a.classList.add('visible');
    }
    function revisarCampo(input, tipo) {
      pintarAviso(input, tipo, tipo === 'dni' ? coincidencias('', input.value, [])
        : tipo === 'telefono' ? coincidencias('', '', [input.value]) : coincidencias(input.value, '', []));
    }
    var temporizadores = {};
    function revisarDiferido(input, tipo) {   // mientras se escribe: pequeña espera para no recalcular en cada tecla
      clearTimeout(temporizadores[input.id]);
      temporizadores[input.id] = setTimeout(function () { revisarCampo(input, tipo); }, 300);
    }
    iDni.addEventListener('input', function () { revisarDiferido(iDni, 'dni'); });
    iTel1.addEventListener('input', function () { revisarDiferido(iTel1, 'telefono'); });
    iTel2.addEventListener('input', function () { revisarDiferido(iTel2, 'telefono'); });
    // El nombre se revisa al salir del campo: mientras se escribe daría coincidencias a medias.
    iNombre.addEventListener('input', function () { clearTimeout(temporizadores[iNombre.id]); pintarAviso(iNombre, 'nombre', { total: 0, candidatos: [] }); });
    iNombre.addEventListener('blur', function () { revisarCampo(iNombre, 'nombre'); });

    /* ── Cierre ── */
    // El panel no se cierra solo: avisa a la página (onCancelar), que pregunta por los cambios sin guardar
    // y vuelve a la tabla. Esc lo gestiona la página a través de alEscape().
    var cerrado = false;
    function cerrar() {
      if (cerrado) return;
      cerrado = true;
      if (dlg.parentNode) dlg.parentNode.removeChild(dlg);
    }
    function alEscape() {
      if (confResolver) { cerrarConfirmacion(false); return true; }   // confirmación abierta: Esc = no / seguir editando
      if (dupResolver) { cerrarDuplicado({ accion: 'volver' }); return true; }   // aviso de posible duplicado abierto: Esc = seguir editando
      return cerrarMenus();                                           // desplegable abierto: se cierra primero
    }
    btnCancelar.addEventListener('click', function () { if (!guardando && opts.onCancelar) opts.onCancelar(); });

    /* ── Guardar ── */
    function mostrarMsg(texto, tipo) { msg.textContent = texto; msg.className = 'nu-msg ' + tipo; }
    function ocultarMsg() { msg.className = 'nu-msg'; msg.textContent = ''; }
    function ponerBotonGuardando(si) {
      btnGuardar.disabled = si; btnCancelar.disabled = si;
      btnGuardar.innerHTML = si ? '<span class="ms spinner">refresh</span>Guardando…' : '<span class="ms">save</span>Guardar usuario';
    }
    function recogerDatos() {
      var fd = new FormData(form), datos = {};
      fd.forEach(function (v, k) {
        if (datos[k] !== undefined) datos[k] = Array.isArray(datos[k]) ? datos[k].concat([v]) : [datos[k], v];
        else datos[k] = v;
      });
      [1, 2, 3, 4, 5].forEach(function (n) { delete datos['gravedad_q' + n]; });
      datos.Gravedad = chip.textContent.trim();
      datos.anadirContacto = q('#nu-contacto').checked;
      return datos;
    }
    async function enviar() {
      if (guardando || confResolver || dupResolver) return;
      ocultarMsg();
      var errores = false;
      if (!iNombre.value.trim()) { setError(iNombre, 'El nombre es obligatorio.'); errores = true; }
      if (!iFi.value) { setError(iFi, 'La fecha de inscripción es obligatoria.'); errores = true; }
      var msgDni = mensajeLetraDni();
      if (msgDni) { setError(iDni, msgDni); errores = true; }
      if (errores) { var primero = q('.md-field.has-error input'); if (primero) primero.focus(); return; }
      if (!gravedadCompleta()) {
        qa('.grav-card').forEach(function (c) { if (!c.querySelector('input:checked')) c.classList.add('has-error'); });
        mostrarMsg('Por favor, completa todas las preguntas de evaluación de gravedad.', 'error');
        sevRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      // Valores finales con la regla única (sin espacios sobrantes) antes de enviar
      iNombre.value = formatoNombreFinal(iNombre.value);
      iDni.value = formatoDni(iDni.value).trim();
      var datos = recogerDatos(), dni = iDni.value.trim();
      // Último freno antes de crear el alta: si coincide con usuarios ya existentes (DNI, teléfono o nombre parecido) se avisa.
      // No bloquea: deja elegir entre editar el que ya existe, guardar igualmente como nuevo o seguir editando el formulario.
      var cands = coincidencias(iNombre.value, dni, [iTel1.value, iTel2.value]);
      if (cands.total) {
        var eleccion = await elegirDuplicado(cands);
        if (eleccion.accion === 'volver') return;
        if (eleccion.accion === 'editar') { irAEditar(eleccion.fila); return; }
      }
      guardar(datos);
    }
    function guardar(datos) {
      guardando = true; ponerBotonGuardando(true);
      google.script.run
        .withSuccessHandler(function (res) {
          guardando = false;
          if (res && res.success) {
            guardado = true;
            mostrarMsg(res.message || 'Usuario guardado correctamente.', 'success');
            btnGuardar.disabled = true; btnCancelar.disabled = true;
            btnGuardar.innerHTML = '<span class="ms">check_circle</span>Guardado';
            var avisarGuardado = function (retraso) {
              setTimeout(function () { if (!cerrado && opts.onGuardado) opts.onGuardado(res.message || 'Usuario guardado'); }, retraso);
            };
            if (q('#nu-hc').checked) {
              // La página recarga la lista al recibir onGuardado: hay que esperar a que la historia clínica esté creada
              // y enlazada en la Maestra, o la lista se recarga sin el enlace y el usuario aparece sin historia.
              guardando = true;
              mostrarMsg((res.message || 'Usuario guardado correctamente.') + ' Creando la historia clínica…', 'success');
              google.script.run
                .withSuccessHandler(function (r) {
                  guardando = false;
                  if (r && r.success) console.log('Historia clínica creada:', r.url);
                  else {
                    console.error('No se pudo crear la historia clínica:', r && r.message);
                    mostrarMsg('Usuario guardado, pero no se pudo crear la historia clínica: ' + ((r && r.message) || 'error desconocido') + ' Puedes crearla desde su ficha.', 'error');
                  }
                  avisarGuardado(r && r.success ? 300 : 3500);
                })
                .withFailureHandler(function (err) {
                  guardando = false;
                  console.error('No se pudo crear la historia clínica:', err);
                  mostrarMsg('Usuario guardado, pero no se pudo crear la historia clínica: ' + (err && err.message ? err.message : err) + ' Puedes crearla desde su ficha.', 'error');
                  avisarGuardado(3500);
                })
                .generarHistoriaClinicaRegistroUsuario(Object.assign({}, datos, { idPaciente: res.idPaciente }));
            } else {
              avisarGuardado(900);
            }
          } else {
            ponerBotonGuardando(false);
            mostrarMsg((res && res.message) || 'No se pudo guardar el usuario.', 'error');
          }
        })
        .withFailureHandler(function (err) {
          guardando = false; ponerBotonGuardando(false);
          mostrarMsg('Error al guardar el paciente: ' + (err && err.message ? err.message : err), 'error');
        })
        .guardarPaciente(datos);
    }
    btnGuardar.addEventListener('click', enviar);

    iNombre.focus();
    return { cerrar: cerrar, haCambiado: haCambiado, alEscape: alEscape };
  }
};
</script>
