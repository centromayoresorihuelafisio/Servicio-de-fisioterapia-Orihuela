<!--
  ui/JS_Valoraciones_Cache.html - PRECARGA de las valoraciones de TODOS los usuarios, compartida por la Base de Datos
  (usuarios/BaseDatos_Vista) y la Agenda (agenda/Web_Vista). Es lo mismo que ya hace la pestaña Valoraciones: una sola
  lectura de la hoja (obtenerValoracionesWeb, valoraciones/Web.gs) y todo lo demás sale de memoria.

  Se incluye con include('ui/JS_Valoraciones_Cache') con "!" (fuera de cualquier bloque de script), ANTES de ui/JS_Ficha.
  Empieza a cargar sola unos segundos después de abrirse la página, para no competir con la carga de la propia página.

  Para qué sirve:
    · El botón de la ficha es "inteligente": "Valoración" si el usuario no tiene ninguna (abre el formulario) y
      "Valoraciones" si ya tiene (abre su panel), como Crear HC / Historia.      -> accion(nombre, dni)
    · El panel de valoraciones (valoraciones/Panel_Valoraciones) se abre al instante con lo que ya está en memoria.
                                                                              -> opcionesPanel(nombre, dni)

  API:
    ValoracionesCache.tiene(nombre, dni)            true / false, o null si aún no se han cargado
    ValoracionesCache.historialDe(nombre, dni)      valoraciones del usuario (de la más antigua a la más reciente), o null si aún no hay datos
    ValoracionesCache.accion(nombre, dni)           acción { id, texto, icono, titulo } para la lista "acciones" de FichaUsuario.html
    ValoracionesCache.opcionesPanel(nombre, dni)    { historial, obsoleto, alHistorial } para añadir a las opciones de PanelValoraciones.abrir
    ValoracionesCache.actualizarUsuario(n, d, h)    sustituye las valoraciones de ese usuario (lo llama el panel tras cualquier cambio)
    ValoracionesCache.alCambiar(fn)                 fn() se llama cada vez que cambian los datos (para repintar la ficha abierta)
    ValoracionesCache.recargar()                    vuelve a leer todo en segundo plano

  Qué valoraciones son de un usuario (igual que en el servidor, obtenerValoracionesUsuarioWeb): si el usuario y la fila
  tienen DNI, deben coincidir; si a alguno le falta, se compara el nombre (sin tildes, mayúsculas ni espacios de más).
-->
<script>
var ValoracionesCache = (function() {
  var RETRASO_PRECARGA = 3000;   // ms tras cargar la página antes de pedir las valoraciones
  var FRESCO_MS = 60000;         // pasado este tiempo, al abrir el panel se refresca además en segundo plano
  var filas = null;              // null = aún sin cargar; si no, todas las valoraciones (cada una con nombre y dni de SU fila)
  var tCarga = 0, cargando = false, repetir = false, version = 0, escuchas = [];

  function norm(x) { return String(x === null || x === undefined ? '' : x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase(); }
  function normDni(x) { return String(x === null || x === undefined ? '' : x).trim().toUpperCase(); }
  function coincide(r, nombreN, dniN) {
    var dniFila = normDni(r.dni);
    return (dniN && dniFila) ? dniN === dniFila : norm(r.nombre) === nombreN;
  }
  function porFecha(a, b) { return a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a._fila - b._fila); }
  function avisar() { escuchas.slice().forEach(function(f) { try { f(); } catch (e) { /* un oyente roto no debe frenar a los demás */ } }); }

  // Lee todas las valoraciones. Si algo cambia mientras viaja la respuesta (p. ej. el panel guarda un cambio), se descarta y se vuelve a pedir.
  function cargar() {
    if (cargando) { repetir = true; return; }
    if (typeof google === 'undefined' || !google.script || !google.script.run) return;
    cargando = true; repetir = false;
    var v = version;
    google.script.run
      .withSuccessHandler(function(res) {
        cargando = false;
        if (!res || res.error || !res.pacientes) return;           // sin datos: el botón queda como "Valoración" y el panel pide lo suyo
        if (v !== version || repetir) { cargar(); return; }
        var todas = [];
        res.pacientes.forEach(function(p) {
          (p.historial || []).forEach(function(r) {
            if (!r.nombre) r.nombre = p.nombre || '';
            if (!r.dni && p.dni) r.dni = p.dni;
            todas.push(r);
          });
        });
        filas = todas; tCarga = Date.now();
        avisar();
      })
      .withFailureHandler(function() { cargando = false; })
      .obtenerValoracionesWeb();
  }

  function historialDe(nombre, dni) {
    if (filas === null) return null;
    var n = norm(nombre), d = normDni(dni);
    if (!n && !d) return [];
    return filas.filter(function(r) { return coincide(r, n, d); }).sort(porFecha);
  }
  function tiene(nombre, dni) {
    if (filas === null) return null;
    var n = norm(nombre), d = normDni(dni);
    if (!n && !d) return false;
    return filas.some(function(r) { return coincide(r, n, d); });
  }

  // Botón de la ficha: cambia según exista o no alguna valoración del usuario (como Crear HC / Historia).
  function accion(nombre, dni) {
    if (tiene(nombre, dni) === true) {
      return { id: 'valoracion', texto: 'Valoraciones', icono: 'monitoring', titulo: 'Ver las valoraciones del usuario: evolución e historial' };
    }
    return { id: 'valoracion', texto: 'Valoración', icono: 'assignment', titulo: 'Nueva valoración del usuario' };
  }

  // Lo que el panel necesita para abrirse sin esperar al servidor. Sin datos aún, el panel los pide él mismo.
  function opcionesPanel(nombre, dni) {
    var h = historialDe(nombre, dni);
    if (h === null && !cargando) cargar();
    return {
      historial: h === null ? undefined : h,
      obsoleto: h !== null && (Date.now() - tCarga > FRESCO_MS),
      alHistorial: function(nuevo) { actualizarUsuario(nombre, dni, nuevo); }
    };
  }

  function actualizarUsuario(nombre, dni, historial) {
    if (filas === null) return;                                    // aún no hay caché: se llenará entera cuando cargue
    var n = norm(nombre), d = normDni(dni);
    filas = filas.filter(function(r) { return !coincide(r, n, d); }).concat(historial || []);
    version++; tCarga = Date.now();
    avisar();
  }

  function alCambiar(fn) { if (typeof fn === 'function') escuchas.push(fn); }

  // Otra ventana ha guardado valoraciones (o ha cambiado a un usuario): se vuelve a leer todo.
  window.addEventListener('storage', function(e) {
    if (e.key === 'valoracionesActualizadas' || e.key === 'pacienteActualizado') cargar();
  });

  // Precarga: unos segundos después de abrirse la página.
  function programar() { setTimeout(cargar, RETRASO_PRECARGA); }
  if (document.readyState === 'complete') programar(); else window.addEventListener('load', programar);

  return { tiene: tiene, historialDe: historialDe, accion: accion, opcionesPanel: opcionesPanel, actualizarUsuario: actualizarUsuario, alCambiar: alCambiar, recargar: cargar };
})();
</script>
