<!--
  ui/JS_Cierre_Formulario.html
  Cierre unificado de formularios. Se incluye desde un scriptlet de tipo include('ui/JS_Cierre_Formulario') con "!"
  (fuera de cualquier <script>), en páginas servidas con createTemplateFromFile().

  Cada página puede definir antes:
    window.CONTEXTO_FORM = 'popup' | 'pestana'   (por defecto 'pestana')
    window.BASE_URL_FORM = URL de despliegue de la Web App   (para volver a Usuarios en 'pestana')
-->
<script>
  var CIERRE_DEMORA_MS = 1500; // Lo subimos a 1.5 segundos por defecto para que se lea bien el mensaje

  // Avisa a Usuarios para que se refresque.
  function notificarGuardado(tipo, guardado) {
    var ok = (guardado === undefined) ? true : !!guardado;
    try {
      // Usamos window.top.opener porque en Apps Script estamos dentro de un iframe
      var openerWindow = window.top.opener || window.opener;
      if (openerWindow) openerWindow.postMessage({ tipo: tipo || 'cerrarEdicionPaciente', guardado: ok }, '*');
    } catch (e) { /* opener ya no accesible */ }
    
    try {
      localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: ok, ts: Date.now() }));
    } catch (e) { /* localStorage no disponible */ }
  }

  function finalizarFormulario(opciones) {
    opciones = opciones || {};
    var guardado = !!opciones.guardado;
    var demora = (opciones.demora !== undefined) ? opciones.demora : CIERRE_DEMORA_MS;
    var contexto = window.CONTEXTO_FORM || 'pestana';

    // EL TRUCO: Metemos el aviso al padre DENTRO del temporizador.
    // Así el formulario tiene tiempo de enseñar el "✓ Guardado" antes de que el padre lo cierre.
    setTimeout(function () {
      
      // Avisamos a la pestaña principal
      notificarGuardado('cerrarEdicionPaciente', guardado);

      if (contexto === 'popup') {
        // Intento de cierre por si el navegador lo permite
        window.top.close();
        
        // La red de seguridad por si falla el cierre automático desde la pestaña principal
        setTimeout(function () { if (guardado) _avisoCerrarManual(); }, 300);
        
      } else {
        window.top.location.href = (window.BASE_URL_FORM || '') + '?page=baseDatos';
      }
      
    }, demora);
  }

  function _avisoCerrarManual() {
    var d = document.createElement('div');
    d.textContent = '✓ Guardado. Ya puedes cerrar esta ventana.';
    d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b5e20;color:#fff;padding:12px 20px;border-radius:12px;font:500 14px sans-serif;z-index:99999;box-shadow:0 4px 12px rgba(0,0,0,.25)';
    document.body.appendChild(d);
  }
</script>
