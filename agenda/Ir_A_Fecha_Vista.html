<!-- Código HTML/JavaScript para el Selector de Fecha -->
<style>
  body {
    font-family: Arial, sans-serif;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    background-color: #f7f7f7;
  }
  .input-group {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 250px;
  }
  label {
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
  }
  input[type="date"] {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }
  button {
    padding: 10px 15px;
    background-color: #4285F4; /* Color de Google Blue */
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.3s;
    width: 100%;
    max-width: 250px;
  }
  button:hover {
    background-color: #357ae8;
  }
</style>

<div class="input-group">
  <label for="date-input">Seleccione la fecha:</label>
  <!-- El valor inicial se establece con la plantilla HTML de Apps Script -->
  <input type="date" id="date-input" value="<?= initialDate ?>">
</div>

<button onclick="buscarFecha()">
  Ir a la Fecha
</button>

<script>
  // Función llamada cuando el usuario hace clic en el botón
  function buscarFecha() {
    const dateInput = document.getElementById('date-input');
    const selectedDate = dateInput.value;
    
    // Llamamos a la función del lado del servidor (Apps Script) con la fecha seleccionada.
    // google.script.run es la API de comunicación asíncrona entre HTML y Apps Script.
    google.script.run
        .withSuccessHandler(google.script.host.close) // Cierra el diálogo al tener éxito
        .fechaSeleccionada(selectedDate);
  }
</script>
