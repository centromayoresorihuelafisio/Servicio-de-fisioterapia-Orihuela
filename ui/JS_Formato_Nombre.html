
<!--
  ui/JS_Formato_Nombre.html
  REGLA ÚNICA de formato para nombres de usuario y DNI en todos los formularios y pantallas.
    · Nombre: MAYÚSCULAS, sin tildes (la Ñ se conserva), solo letras y espacios, sin espacios dobles.
    · DNI:    MAYÚSCULAS.
  La misma regla se aplica en el servidor: normalizarNombreUsuario() y normalizarDniUsuario()
  en core/Utils.gs (si cambias una, cambia la otra).

  Se incluye desde un scriptlet de tipo include('ui/JS_Formato_Nombre') con "!" (fuera de cualquier
  bloque de script), ANTES del script principal de la página. Uso:
    enlazarFormatoNombre(inputElemento);   enlazarFormatoDni(inputElemento);
  Para valores ya escritos: formatoNombreFinal(texto) (quita además los espacios de los extremos).
  NOMBRE OFICIAL (alta y «Editar»; CONTEXTO.md, sección 22): la misma regla más «M» o «Mª» delante = MARIA:
    enlazarFormatoNombreOficial(input);   formatoNombreOficialFinal(texto).
  Usa nombresMariaDelante_ de core/Nombres_Oficiales.gs, que la página recibe con incluirNombres_() (sin copia); en el
  servidor es normalizarNombreOficial_. Sin incluirNombres_() en la página se queda en la regla común. El «Nombre
  habitual», el nombre de una cita y la ficha usan solo la regla común (formatoNombreEscribiendo / formatoNombreFinal).
  Para ENSEÑAR el nombre habitual («Mari Carmen») sin cambiar lo guardado: formatoNombreVisible(texto).
  Letra del DNI/NIE: validarDni(texto) → { aplica, valido, letra }. Solo se valida lo que tiene forma de DNI (8 cifras + letra) o de
  NIE (X/Y/Z + 7 cifras + letra): lo que no tiene esa forma no se toca (aplica = false).
-->
<script>
  function formatoNombreEscribiendo(v) {
    return (v || '').toString().normalize('NFC').toUpperCase()
      .replace(/Ñ/g, '\u0001')                              // aparta la Ñ para que NFD no la reduzca a N
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')      // quita tildes
      .replace(/\u0001/g, 'Ñ')
      .replace(/[^A-ZÑ ]/g, '')                              // solo letras y espacios
      .replace(/^ +/, '')                                    // sin espacios al principio
      .replace(/ {2,}/g, ' ');                               // sin espacios dobles
  }
  function formatoNombreFinal(v) { return formatoNombreEscribiendo(v).trim(); }
  // Solo para MOSTRAR (la hoja sigue en mayúsculas): primera letra de cada palabra en mayúscula y el resto en minúscula;
  // DE, DEL, LA, LAS, LOS e Y en minúscula salvo al principio («MARIA DEL CARMEN» → «Maria del Carmen»).
  function formatoNombreVisible(v) {
    return String(v || '').trim().toLowerCase().replace(/\s+/g, ' ').split(' ').map(function(p, i) {
      if (i > 0 && /^(de|del|la|las|los|y)$/.test(p)) return p;
      return p.charAt(0).toUpperCase() + p.slice(1);
    }).join(' ');
  }
  function formatoMariaDelante_(v) { return typeof nombresMariaDelante_ === 'function' ? nombresMariaDelante_(v) : v; }
  function formatoNombreOficialEscribiendo(v) { return formatoMariaDelante_(formatoNombreEscribiendo(v)); }
  function formatoNombreOficialFinal(v) { return formatoMariaDelante_(formatoNombreFinal(v)); }
  function formatoDni(v) { return (v || '').toString().toUpperCase(); }
  // Letra de control del DNI/NIE (resto de dividir el número entre 23). `letra` es la que correspondería al número escrito.
  var LETRAS_DNI_ = 'TRWAGMYFPDXBNJZSQVHLCKE';
  function validarDni(v) {
    var s = (v || '').toString().toUpperCase().replace(/[\s-]/g, '');
    var m = /^([XYZ]?)(\d{7,8})([A-Z])$/.exec(s);
    if (!m || m[2].length !== (m[1] ? 7 : 8)) return { aplica: false };
    var numero = parseInt(({ X: '0', Y: '1', Z: '2' }[m[1]] || '') + m[2], 10);
    var letra = LETRAS_DNI_.charAt(numero % 23);
    return { aplica: true, valido: letra === m[3], letra: letra };
  }
  function sinTildes(v) { return (v || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

  // Aplica `fn` al valor del input conservando la posición del cursor (si no cambia nada, no lo toca).
  function aplicarFormatoInput_(input, fn) {
    var v = input.value, n = fn(v);
    if (v === n) return;
    var pos = input.selectionStart, enfocado = (document.activeElement === input);
    input.value = n;
    if (enfocado && pos !== null) {
      var p = fn(v.slice(0, pos)).length;
      try { input.setSelectionRange(p, p); } catch (e) { /* tipos de input sin selección */ }
    }
  }
  function sanitizeName(input) { aplicarFormatoInput_(input, formatoNombreEscribiendo); }
  function sanitizeDni(input)  { aplicarFormatoInput_(input, formatoDni); }

  function enlazarFormatoNombre(input) {
    if (input) input.addEventListener('input', function (e) { if (!e.isComposing) sanitizeName(input); });
  }
  function enlazarFormatoNombreOficial(input) {
    if (input) input.addEventListener('input', function (e) { if (!e.isComposing) aplicarFormatoInput_(input, formatoNombreOficialEscribiendo); });
  }
  function enlazarFormatoDni(input) {
    if (input) input.addEventListener('input', function (e) { if (!e.isComposing) sanitizeDni(input); });
  }
</script>
