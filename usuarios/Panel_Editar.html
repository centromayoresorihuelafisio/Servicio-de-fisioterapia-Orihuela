<!--
  usuarios/Panel_Editar.html
  Formulario de edición de usuario como módulo del panel lateral de Usuarios.
  Se incluye desde usuarios/BaseDatos_Vista con <?!= include_('usuarios/Panel_Editar'); ?>
  API: PanelEditar.abrir(contenedor, { idPaciente, onGuardado, onCancelar })
  Devuelve { haCambiado(), alEscape() }:
    · haCambiado() → true si hay cambios sin guardar (Usuarios pregunta antes de descartar).
    · alEscape()   → cierra primero un desplegable abierto; devuelve true si lo ha gestionado.
  El formulario se construye en el navegador con los datos de obtenerDatosEdicionPaciente(), el CSS va acotado
  a .pe y usa los tokens de la página (--md-*, así que respeta el tema oscuro), y la revisión de cambios es una
  capa dentro del propio panel.
  Guarda con actualizarPaciente(data, idPaciente) (usuarios/Editar_Usuario.gs).
  Identidad: el servidor localiza al usuario por su ID paciente (no por número de fila ni nombre), así que aunque la hoja
  se reordene mientras el panel está abierto se edita siempre a la misma persona; si ya no existe, no se guarda nada.
  Requiere ui/JS_Formato_Nombre en la página (enlazarFormatoNombre / enlazarFormatoDni / validarDni).
-->
<style>
.pe {
  position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0;
  font-family: var(--font); font-size: var(--fs-md); color: var(--md-on-surface); background: var(--md-surface);
}
.pe .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; line-height: 1; display: inline-block; }
.pe .ic16 { font-size: 16px; } .pe .ic18 { font-size: 18px; } .pe .ic20 { font-size: 20px; } .pe .ic22 { font-size: 22px; }

.pe .pe-scroll { flex: 1; min-height: 0; overflow: auto; }
.pe .pe-estado { padding: 2rem 1.25rem; text-align: center; color: var(--md-on-surface-med); font-size: var(--fs-md); }
.pe .pe-estado .md-girador { vertical-align: middle; margin-right: 8px; }
.pe .pe-estado.error { color: var(--md-error); }
.pe .pe-dni-msg { display: none; font-size: var(--fs-xs); color: var(--md-error); padding: 4px 0 0 14px; }
.pe .pe-dni-msg.visible { display: block; }

/* ── Secciones ── */
.pe .card-section { padding: 1.1rem 1.25rem 1.3rem; border-bottom: 1px solid var(--md-outline); }
.pe .card-section:last-child { border-bottom: none; }
.pe .section-label { display: flex; align-items: center; gap: .75rem; margin-bottom: 1.1rem; }
.pe .section-pill {
  display: inline-flex; align-items: center; gap: .375rem; padding: .375rem .875rem; border-radius: var(--md-shape-full);
  background: var(--md-primary-light); color: var(--md-primary-dark);
  font-weight: 600; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em;
}
.pe .section-divider { flex: 1; height: 1px; background: var(--md-outline); }
/* a 400 px todo va en una columna */
.pe .grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }

/* ── Campo de texto: .md-campo de CSS_Global; aqui solo lo propio del panel ── */
.pe .field { display: flex; flex-direction: column; position: relative; }
.pe .readonly-badge {
  font-size: var(--fs-2xs); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--md-on-surface-low);
  background: var(--md-surface-variant); padding: 1px 6px; border-radius: var(--md-shape-full); margin-left: 4px; vertical-align: middle;
}

/* ── Desplegables (único y múltiple): mismo aspecto que .md-campo ── */
.pe .multiselect { position: relative; }
.pe .ms-toggle {
  width: 100%; min-height: 52px; box-sizing: border-box; padding: 14px 44px 0 44px; border: 1.5px solid var(--md-outline-strong); border-radius: var(--md-shape-md);
  background: transparent; cursor: pointer; display: flex; align-items: center; position: relative;
  font-family: var(--font); font-size: var(--fs-field); color: var(--md-on-surface);
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease); user-select: none;
}
.pe .ms-toggle:hover:not(.open) { border-color: var(--md-on-surface); }
.pe .ms-toggle.open { border-color: var(--md-primary); box-shadow: inset 0 0 0 .5px var(--md-primary); }
.pe .ms-leading {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center;
  color: var(--md-on-surface-med); pointer-events: none;
}
.pe .ms-float-label {
  position: absolute; left: 44px; top: 50%; transform: translateY(-50%); font-size: var(--fs-field); font-weight: 400;
  color: var(--md-on-surface-med); background: var(--md-surface); padding: 0 4px; margin-left: -4px; pointer-events: none; z-index: var(--z-base);
  line-height: 1.2; white-space: nowrap;
  transition: top var(--dur-3) var(--ease), font-size var(--dur-3) var(--ease), color var(--dur-2) var(--ease);
}
.pe .ms-toggle.open .ms-float-label, .pe .ms-toggle.has-value .ms-float-label { top: 0; font-size: var(--fs-xs); }
.pe .ms-toggle.open .ms-float-label { color: var(--md-primary); }
.pe .ms-display { flex: 1; font-size: var(--fs-field); color: var(--md-on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.pe .ms-toggle:not(.has-value) .ms-display { opacity: 0; pointer-events: none; }
.pe .ms-arrow {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--md-on-surface-med);
  transition: transform var(--dur-2) var(--ease); flex-shrink: 0;
}
.pe .ms-toggle.open .ms-arrow { transform: translateY(-50%) rotate(180deg); color: var(--md-primary); }
.pe .ms-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: var(--z-sticky); background: var(--md-surface);
  border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); box-shadow: var(--md-elev-3);
  max-height: 240px; overflow-y: auto; overflow-x: hidden; display: none;
}
.pe .ms-menu.open { display: block; animation: md-entra var(--dur-2) var(--ease) both; }
.pe .ms-item { display: flex; align-items: center; gap: 12px; padding: 11px 16px; cursor: pointer; font-size: var(--fs-md); color: var(--md-on-surface); transition: background var(--dur-1) var(--ease); }
.pe .ms-item:hover { background: var(--md-primary-light); }
.pe .ms-item:has(input:checked), .pe .ms-item.ms-selected { background: var(--md-primary-container); font-weight: 500; }
.pe .ms-search-wrap { position: sticky; top: 0; z-index: var(--z-base); display: flex; align-items: center; gap: .5rem; padding: .6rem .85rem .5rem; border-bottom: 1px solid var(--md-outline); background: var(--md-surface); color: var(--md-on-surface-med); }
.pe .ms-search-input { flex: 1; border: none; background: transparent; font-family: var(--font); font-size: var(--fs-md); color: var(--md-on-surface); outline: none; padding: .125rem 0; }
.pe .ms-nombre { flex: 1; min-width: 0; }
.pe .ms-cod { flex: none; font-size: var(--fs-xs); color: var(--md-on-surface-med); font-variant-numeric: tabular-nums; }
.pe .ms-grupo { padding: .45rem 1rem; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary-dark); background: var(--md-primary-light); }
.pe .ms-vacio { display: none; padding: .8rem 1rem; font-size: var(--fs-sm); color: var(--md-on-surface-med); }
.pe .ms-item-hidden { display: none !important; }
.pe .ms-item input[type="checkbox"] { width: 16px; height: 16px; min-width: 16px; accent-color: var(--md-primary); cursor: pointer; flex-shrink: 0; padding: 0; border: none; background: none; }

/* ── Pie fijo (los botones son .md-btn de CSS_Global) ── */
.pe .panel-pie { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: .5rem; padding: .7rem 1rem; border-top: 1px solid var(--md-outline); background: var(--md-surface); }

/* ── Revisión de cambios: capa dentro del propio panel ── */
.pe .pe-rev { position: absolute; inset: 0; z-index: var(--z-sticky); background: var(--md-surface); display: none; flex-direction: column; }
.pe .pe-rev.visible { display: flex; }
.pe .pe-rev-cab { flex: none; padding: 1rem 1.25rem .85rem; border-bottom: 1px solid var(--md-outline); display: flex; align-items: center; gap: 12px; }
.pe .pe-rev-cab .icon-wrap { width: 40px; height: 40px; background: var(--md-primary-light); border-radius: 50%; display: grid; place-items: center; color: var(--md-primary); flex-shrink: 0; }
.pe .pe-rev-cab h2 { font-size: var(--fs-lg); font-weight: 500; color: var(--md-on-surface); }
.pe .pe-rev-cab p { font-size: var(--fs-xs); color: var(--md-on-surface-med); margin-top: 2px; }
.pe .pe-rev-cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1.25rem; }
.pe .preview-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--md-outline); font-size: var(--fs-md); }
.pe .preview-row:last-child { border-bottom: none; }
.pe .preview-key { font-size: var(--fs-xs); font-weight: 500; color: var(--md-on-surface-med); flex-shrink: 0; max-width: 45%; }
.pe .preview-val { color: var(--md-on-surface); text-align: right; overflow-wrap: anywhere; }
.pe .preview-val.empty { color: var(--md-on-surface-low); font-style: italic; }
.pe .preview-row.changed { background: var(--md-warning-bg); margin: 0 -1.25rem; padding-left: 1.25rem; padding-right: 1.25rem; }
.pe .preview-row.changed .preview-val { color: var(--md-on-surface); font-weight: 600; }
.pe .changed-badge {
  display: inline-flex; align-items: center; font-size: var(--fs-2xs); font-weight: 500; letter-spacing: .04em; text-transform: uppercase;
  color: var(--md-warning-text); background: color-mix(in srgb, var(--md-warning) 28%, transparent); border-radius: var(--md-shape-full); padding: 1px 6px; margin-left: 6px; vertical-align: middle;
}
.pe .pe-rev-msg { flex: none; display: none; padding: .7rem 1.25rem; font-size: var(--fs-sm); font-weight: 500; background: var(--md-error-bg); color: var(--md-error); }
.pe .pe-rev-msg.visible { display: block; }
</style>

<template id="tplPanelEditar"><div class="pe">
  <div class="pe-scroll">
    <form class="pe-form" novalidate>
      <div class="pe-estado"><span class="md-girador"></span>Cargando datos…</div>
    </form>
  </div>
  <div class="panel-pie">
    <button title="Cerrar sin guardar" type="button" class="md-btn md-btn--text pe-cancelar">Cancelar</button>
    <button title="Revisar los cambios antes de guardar" type="button" class="md-btn md-btn--tonal pe-revisar" disabled>
      <span class="material-symbols-outlined">visibility</span>Revisar cambios
    </button>
  </div>

  <div class="pe-rev" aria-hidden="true">
    <div class="pe-rev-cab">
      <div class="icon-wrap"><span class="material-symbols-outlined ic22">rule_folder</span></div>
      <div>
        <h2>Confirmar cambios</h2>
        <p class="pe-rev-sub">Revisa los datos antes de guardar.</p>
      </div>
    </div>
    <div class="pe-rev-cuerpo"></div>
    <div class="pe-rev-msg" role="alert"></div>
    <div class="panel-pie">
      <button title="Volver al formulario" type="button" class="md-btn md-btn--text pe-volver">
        <span class="material-symbols-outlined">arrow_back</span>Volver a editar
      </button>
      <button title="Guardar los cambios" type="button" class="md-btn md-btn--tonal pe-confirmar">
        <span class="material-symbols-outlined">check_circle</span>Confirmar y guardar
      </button>
    </div>
  </div>
</div></template>

<script>
window.PanelEditar = {
  abrir: function (host, opts) {
    opts = opts || {};
    host.innerHTML = '';
    host.appendChild(document.getElementById('tplPanelEditar').content.cloneNode(true));
    var pe = host.querySelector('.pe');
    function q(sel) { return pe.querySelector(sel); }

    var form = q('.pe-form'), btnRevisar = q('.pe-revisar'), btnCancelar = q('.pe-cancelar');
    var capa = q('.pe-rev'), capaCuerpo = q('.pe-rev-cuerpo'), capaSub = q('.pe-rev-sub'), capaMsg = q('.pe-rev-msg');
    var btnVolver = q('.pe-volver'), btnConfirmar = q('.pe-confirmar');

    var OPCIONES_ESTADO    = ESTADOS_PACIENTE.LISTA_EDICION.slice();
    var OPCIONES_GRAVEDAD  = GRAVEDAD_PACIENTE.LISTA.slice();
    var OPCIONES_INGRESO   = TIPOS_INGRESO.LISTA.slice();
    // Una celda que aún llevara emoji ("🟢 Leve") se reconoce como su opción sin emoji ("Leve").
    function sinEmojiTxt(t) { var s = String(t || '').trim(); return s.replace(/^[^\p{L}\p{N}]+/u, '').trim() || s; }
    function opcionDe(val, opciones) {
      var n = sinEmojiTxt(val).toLowerCase();
      if (n === 'urgente' && opciones === OPCIONES_GRAVEDAD) return GRAVEDAD_PACIENTE.GRAVE;   // nombre antiguo de Grave
      for (var i = 0; i < opciones.length; i++) if (sinEmojiTxt(opciones[i]).toLowerCase() === n) return opciones[i];
      return val;
    }
    var SECCIONES = [
      { name: "Datos Personales",       fields: ["Nombre","DNI","Fecha nacimiento","Fecha inscripción"] },
      { name: "Estado y Clasificación", fields: ["Estado","Gravedad","Tipo de Ingreso"] },
      { name: "Contacto",               fields: ["Teléfono 1","Teléfono 2"] },
      { name: "Diagnóstico",            fields: ["Patología 1","Patología 2"] },
      { name: "Observaciones",          fields: ["Observaciones"] }
    ];

    var cargado = false, guardando = false, bloqueado = false, originalData = {};

    function norm(x) { return String(x || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function iconFor(h) {
      var hl = h.toLowerCase();
      if (hl.indexOf("nombre") !== -1)   return 'person';
      if (hl.indexOf("fecha") !== -1)    return 'calendar_today';
      if (hl.indexOf("tel") !== -1)      return 'call';
      if (hl.indexOf("patolog") !== -1)  return 'monitor_heart';
      if (hl.indexOf("observ") !== -1)   return 'edit_note';
      if (hl.indexOf("gravedad") !== -1) return 'emergency';
      if (hl.indexOf("estado") !== -1)   return 'fact_check';
      if (hl.indexOf("ingreso") !== -1)  return 'login';
      return 'horizontal_rule';
    }
    function sectionIconFor(name) {
      var nl = name.toLowerCase();
      if (nl.indexOf("personal") !== -1) return 'account_circle';
      if (nl.indexOf("estado") !== -1 || nl.indexOf("clasif") !== -1) return 'analytics';
      if (nl.indexOf("contacto") !== -1) return 'contact_page';
      if (nl.indexOf("diagn") !== -1)    return 'medical_information';
      if (nl.indexOf("observ") !== -1)   return 'note_alt';
      return 'folder_open';
    }

    /* ── Construcción del formulario (equivale a los scriptlets del original) ── */
    function desplegableUnico(h, idSuffix, icon, val, opciones) {
      var actual = val || opciones[0];
      return '<div class="multiselect">' +
        '<div class="ms-toggle has-value" id="pe-toggle' + idSuffix + '" data-suffix="' + esc(idSuffix) + '" data-tipo="unico">' +
          '<div class="ms-leading"><span class="material-symbols-outlined ic18">' + icon + '</span></div>' +
          '<span class="ms-float-label">' + esc(h) + '</span>' +
          '<span class="ms-display" id="pe-label' + idSuffix + '">' + esc(actual) + '</span>' +
          '<span class="material-symbols-outlined ic20 ms-arrow">expand_more</span>' +
        '</div>' +
        '<input type="hidden" name="' + esc(h) + '" id="pe-val' + idSuffix + '" value="' + esc(actual) + '">' +
        '<div class="ms-menu" id="pe-menu' + idSuffix + '">' +
          opciones.map(function (opt) {
            return '<div class="ms-item' + (val === opt ? ' ms-selected' : '') + '" data-suffix="' + esc(idSuffix) + '" data-val="' + esc(opt) + '">' + esc(opt) + '</div>';
          }).join('') +
        '</div></div>';
    }
    function desplegableMultiple(h, idSuffix, icon, selVals) {
      return '<div class="multiselect">' +
        '<div class="ms-toggle' + (selVals.length > 0 && selVals[0] !== '' ? ' has-value' : '') + '" id="pe-toggle' + idSuffix + '" data-suffix="' + esc(idSuffix) + '" data-tipo="multiple" data-name="' + esc(h) + '">' +
          '<div class="ms-leading"><span class="material-symbols-outlined ic18">' + icon + '</span></div>' +
          '<span class="ms-float-label">' + esc(h) + '</span>' +
          '<span class="ms-display" id="pe-label' + idSuffix + '">— Selecciona —</span>' +
          '<span class="material-symbols-outlined ic20 ms-arrow">expand_more</span>' +
        '</div>' +
        '<div class="ms-menu" id="pe-menu' + idSuffix + '">' +
          '<div class="ms-search-wrap"><span class="material-symbols-outlined ic18">search</span><input class="ms-search-input" type="text" placeholder="Buscar patología…" aria-label="Buscar patología" autocomplete="off"></div>' +
          // Valores antiguos que ya no están en la lista oficial: se muestran marcados para no perderlos al guardar (se revisan en la herramienta de la sección 15).
          opcionesPatologia(h, selVals) +
          '<div class="ms-vacio">Sin resultados</div>' +
        '</div></div>';
    }
    // Opciones agrupadas por zona, con el código CIE-10 al lado; el valor guardado es solo el nombre.
    function opcionesPatologia(h, selVals) {
      function opcion(nombre, codigo, grupo) {
        return '<label class="ms-item" data-grupo="' + esc(grupo) + '"><input type="checkbox" name="' + esc(h) + '" value="' + esc(nombre) + '"' + (selVals.indexOf(nombre) !== -1 ? ' checked' : '') + '>' +
          '<span class="ms-nombre">' + esc(nombre) + '</span>' + (codigo ? '<span class="ms-cod">' + esc(codigo) + '</span>' : '') + '</label>';
      }
      var antiguos = selVals.filter(function (v) { return v !== '' && !PATOLOGIAS_LISTA.some(function (p) { return p.nombre === v; }); });
      var html = antiguos.length ? '<div class="ms-grupo">Valor antiguo (sin código)</div>' + antiguos.map(function (v) { return opcion(v, '', 'Valor antiguo'); }).join('') : '';
      var grupoActual = null;
      PATOLOGIAS_LISTA.forEach(function (p) {
        if (p.grupo !== grupoActual) { grupoActual = p.grupo; html += '<div class="ms-grupo">' + esc(grupoActual) + '</div>'; }
        html += opcion(p.nombre, p.codigo, p.grupo);
      });
      return html;
    }
    // Buscador del desplegable: por nombre, código y zona; la cabecera de zona solo se ve si le queda alguna opción.
    function filtrarPatologias(menu, texto) {
      var t = texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim(), visibles = 0, cab = null, hay = false;
      function cerrarGrupo() { if (cab) cab.classList.toggle('ms-item-hidden', t.length > 0 && !hay); }
      Array.prototype.forEach.call(menu.children, function (it) {
        if (it.classList.contains('ms-grupo')) { cerrarGrupo(); cab = it; hay = false; return; }
        if (!it.classList.contains('ms-item')) return;
        var oculto = t.length > 0 && (it.textContent + ' ' + it.dataset.grupo).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(t) === -1;
        it.classList.toggle('ms-item-hidden', oculto); if (!oculto) { visibles++; hay = true; }
      });
      cerrarGrupo();
      var v = menu.querySelector('.ms-vacio'); if (v) v.style.display = visibles ? 'none' : 'block';
    }
    function campoTexto(h, idSuffix, icon, val, isDate, isReadOnly) {
      return '<div class="md-campo md-campo--icono' + (isReadOnly ? ' md-campo--dato' : '') + '">' +
        '<span class="material-symbols-outlined md-campo__icono">' + icon + '</span>' +
        '<input class="md-campo__control" type="' + (isDate ? 'date' : 'text') + '" id="pe-field_' + idSuffix + '" name="' + esc(h) + '" value="' + esc(val) + '" placeholder=" "' + (isReadOnly ? ' disabled' : '') + '>' +
        '<label class="md-campo__etiqueta" for="pe-field_' + idSuffix + '">' + esc(Telefono.etiqueta(h)) + (isReadOnly ? '<span class="readonly-badge">Solo lectura</span>' : '') + '</label>' +
      '</div>';
    }
    function construirFormulario(headers, rowData) {
      var headerMap = {};
      headers.forEach(function (h, i) { headerMap[h] = i; });
      var asignados = {};
      SECCIONES.forEach(function (s) { s.fields.forEach(function (f) { asignados[f] = true; }); });
      var otros = headers.filter(function (h) { return !asignados[h]; });

      function seccion(nombre, lista) {
        var campos = lista.filter(function (f) { return headerMap[f] !== undefined; });
        if (!campos.length) return '';
        var html = '<div class="card-section">' +
          '<div class="section-label"><span class="section-pill"><span class="material-symbols-outlined ic16">' + sectionIconFor(nombre) + '</span>' + esc(nombre) + '</span><div class="section-divider"></div></div>' +
          '<div class="grid-2">';
        campos.forEach(function (h) {
          var i = headerMap[h];
          var val = rowData[i] || "";
          var hl = h.toLowerCase();
          var isReadOnly = (i === 0 || h === "ID paciente" || hl.indexOf("historia") !== -1);   // "ID paciente" = COLUMNAS.MAESTRA.ID_PACIENTE (core/Config.gs)
          var isDate = (hl.indexOf("fecha") !== -1 || hl.indexOf("visita") !== -1 || hl.indexOf("nacimiento") !== -1);
          var idSuffix = h.replace(/\s/g, "");
          var icon = iconFor(h);
          html += '<div><div class="field">';
          if (h === "Estado")                     html += desplegableUnico(h, idSuffix, icon, opcionDe(val, OPCIONES_ESTADO), OPCIONES_ESTADO);
          else if (h === "Gravedad")              html += desplegableUnico(h, idSuffix, icon, opcionDe(val, OPCIONES_GRAVEDAD), OPCIONES_GRAVEDAD);
          else if (h.indexOf("Ingreso") !== -1)   html += desplegableUnico(h, idSuffix, icon, opcionDe(val, OPCIONES_INGRESO), OPCIONES_INGRESO);
          else if (h.indexOf("Patología") !== -1) html += desplegableMultiple(h, idSuffix, icon, val.toString().split(",").map(function (s) { return s.trim(); }));
          else                                    html += campoTexto(h, idSuffix, icon, val, isDate, isReadOnly);
          html += '</div></div>';
        });
        return html + '</div></div>';
      }
      var out = '';
      SECCIONES.forEach(function (s) { out += seccion(s.name, s.fields); });
      if (otros.length) out += seccion("Otros datos", otros);
      form.innerHTML = out;
    }

    /* ── Comportamiento de los campos ── */
    function formatPhone(val) { return Telefono.enVivo(val); }   // regla única: ui/JS_Telefono.html (al escribir)
    function byName(name) {
      return Array.prototype.filter.call(form.querySelectorAll('input'), function (el) { return el.name === name; });
    }
    function updateMsLabel(suffix, name) {
      var values = byName(name).filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; });
      var label = pe.querySelector('#pe-label' + suffix), toggle = pe.querySelector('#pe-toggle' + suffix);
      label.textContent = values.length ? values.join(', ') : '— Selecciona —';
      toggle.classList.toggle('has-value', values.length > 0);
    }
    function cerrarMenus() {
      var hubo = false;
      pe.querySelectorAll('.ms-menu.open').forEach(function (m) {
        hubo = true;
        m.classList.remove('open');
        var tg = m.parentElement.querySelector('.ms-toggle');
        if (tg) tg.classList.remove('open');
        var s = m.querySelector('.ms-search-input');
        if (s && s.value) { s.value = ''; filtrarPatologias(m, ''); }
      });
      return hubo;
    }
    function alternarMenu(toggle) {
      var menu = pe.querySelector('#pe-menu' + toggle.dataset.suffix);
      var abierto = menu.classList.contains('open');
      cerrarMenus();
      if (!abierto) {
        menu.classList.add('open');
        toggle.classList.add('open');
        // el menú puede abrirse junto al borde inferior: lo traemos a la vista
        menu.scrollIntoView({ block: 'nearest' });
        var s = menu.querySelector('.ms-search-input'); if (s) setTimeout(function () { s.focus(); }, 30);
      }
    }
    function elegirUnico(item) {
      var s = item.dataset.suffix, value = item.dataset.val;
      var oculto = pe.querySelector('#pe-val' + s); if (oculto) oculto.value = value;
      var label = pe.querySelector('#pe-label' + s); if (label) label.textContent = value;
      var menu = pe.querySelector('#pe-menu' + s);
      menu.querySelectorAll('.ms-item').forEach(function (it) { it.classList.toggle('ms-selected', it === item); });
      menu.classList.remove('open');
      var toggle = pe.querySelector('#pe-toggle' + s);
      toggle.classList.remove('open'); toggle.classList.add('has-value');
    }

    function enlazarCampos(headers) {
      form.querySelectorAll('.md-campo input[type="text"], .md-campo input[type="date"]').forEach(function (inp) {
      });
      ['Teléfono 1', 'Teléfono 2'].forEach(function (n) {
        byName(n).forEach(function (inp) {
          inp.value = Telefono.formato(inp.value);   // lo ya guardado se muestra tal cual (un valor raro no se recorta al abrir)
          inp.addEventListener('input', function () { inp.value = formatPhone(inp.value); });
        });
      });
      // Nombre y DNI: misma regla que en el alta (ui/JS_Formato_Nombre). Solo se aplica al escribir:
      // los datos ya guardados no se tocan hasta que alguien edite ese campo.
      enlazarFormatoNombre(byName('Nombre')[0]);
      enlazarFormatoDni(byName('DNI')[0]);
      // Letra del DNI/NIE: ver revisarLetraDni(). Se comprueba al escribir y al salir del campo.
      var inpDni = byName('DNI')[0];
      if (inpDni) ['input', 'blur'].forEach(function (ev) { inpDni.addEventListener(ev, revisarLetraDni); });
      headers.forEach(function (h) {
        if (h.indexOf("Patología") !== -1) updateMsLabel(h.replace(/\s/g, ''), h);
      });
    }

    pe.addEventListener('click', function (e) {
      var tg = e.target.closest('.ms-toggle');
      if (tg) { alternarMenu(tg); return; }
      var it = e.target.closest('.ms-item[data-val]');
      if (it) { elegirUnico(it); return; }
      if (!e.target.closest('.multiselect')) cerrarMenus();
    });
    pe.addEventListener('input', function (e) {
      if (e.target.classList.contains('ms-search-input')) filtrarPatologias(e.target.closest('.ms-menu'), e.target.value);
    });
    pe.addEventListener('change', function (e) {
      var cb = e.target;
      if (cb.type === 'checkbox' && cb.closest('.ms-menu')) {
        var tg = cb.closest('.multiselect').querySelector('.ms-toggle');
        updateMsLabel(tg.dataset.suffix, tg.dataset.name);
      }
    });

    /* ── Datos, cambios y revisión ── */
    function recogerDatos() {
      var data = {}, fd = new FormData(form), names = [];
      fd.forEach(function (val, key) { if (names.indexOf(key) === -1) names.push(key); });
      names.forEach(function (name) { data[name] = fd.getAll(name).join(', '); });
      form.querySelectorAll('input:disabled').forEach(function (el) { if (el.name) data[el.name] = el.value; });
      return data;
    }
    function displayVal(val) {
      if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) return val.split('-').reverse().join('/');
      return val;
    }
    function contarCambios(data) {
      var n = 0;
      for (var key in data) {
        if (key === 'Nº') continue;
        if (displayVal(data[key]) !== displayVal(originalData[key] || '')) n++;
      }
      return n;
    }
    // Letra de control del DNI/NIE (ui/JS_Formato_Nombre → validarDni). Solo se exige si el DNI se ha CAMBIADO en esta edición: un
    // DNI antiguo mal guardado no debe impedir modificar otros datos de la ficha. Devuelve false si hay que corregirlo.
    function revisarLetraDni() {
      if (typeof validarDni !== 'function') return true;   // ui/JS_Formato_Nombre sin actualizar: no se valida, pero la edición sigue funcionando
      var inp = byName('DNI')[0]; if (!inp) return true;
      var campoEl = inp.closest('.field'), msg = campoEl && campoEl.querySelector('.pe-dni-msg');
      var cambiado = inp.value.trim().toUpperCase() !== String(originalData['DNI'] || '').trim().toUpperCase();
      var v = validarDni(inp.value), mal = cambiado && v.aplica && !v.valido;
      if (campoEl && !msg) { msg = document.createElement('div'); msg.className = 'pe-dni-msg'; msg.setAttribute('role', 'alert'); campoEl.appendChild(msg); }
      if (msg) { msg.textContent = mal ? 'La letra no coincide con el número (debería ser ' + v.letra + '). Revísalo.' : ''; msg.classList.toggle('visible', mal); }
      return !mal;
    }
    function mostrarResumen() {
      if (!revisarLetraDni()) {   // DNI cambiado con la letra mal: no se abre la revisión hasta corregirlo
        var campoDni = byName('DNI')[0];
        if (campoDni) { campoDni.focus(); campoDni.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        return;
      }
      var data = recogerDatos(), html = '', changedCount = 0;
      for (var key in data) {
        if (key === 'Nº') continue;
        var val = displayVal(data[key]), origVal = displayVal(originalData[key] || '');
        var changed = val !== origVal;
        if (changed) changedCount++;
        html += '<div class="preview-row' + (changed ? ' changed' : '') + '">' +
                  '<span class="preview-key">' + esc(Telefono.etiqueta(key)) + (changed ? '<span class="changed-badge">modificado</span>' : '') + '</span>' +
                  '<span class="preview-val' + (!val ? ' empty' : '') + '">' + (val ? esc(val) : '—') + '</span>' +
                '</div>';
      }
      capaSub.textContent = changedCount > 0
        ? changedCount + ' campo' + (changedCount > 1 ? 's' : '') + ' modificado' + (changedCount > 1 ? 's' : '') + '. Revisa antes de guardar.'
        : 'No se detectaron cambios respecto a los valores originales.';
      capaCuerpo.innerHTML = html;
      capaCuerpo.scrollTop = 0;
      capaMsg.classList.remove('visible');
      capa.classList.add('visible');
      capa.setAttribute('aria-hidden', 'false');
      btnConfirmar.focus();
    }
    function ocultarResumen() {
      capa.classList.remove('visible');
      capa.setAttribute('aria-hidden', 'true');
    }
    var ETIQUETA_CONFIRMAR = '<span class="material-symbols-outlined">check_circle</span>Confirmar y guardar';
    function mostrarErrorRevision(texto) {
      capaMsg.textContent = texto;
      capaMsg.classList.add('visible');
    }
    // Guardar: el servidor localiza al usuario por su ID paciente, así que no hace falta releer ni comparar nombres.
    function confirmarEnvio() {
      if (guardando || bloqueado) return;
      guardando = true;
      capaMsg.classList.remove('visible');
      btnVolver.disabled = true;   // btnConfirmar queda protegido por 'guardando' y por aria-busy (sin pasar a gris)
      enviarCambios();
    }

    // Fase 2: guardar.
    function enviarCambios() {
      var data = recogerDatos();
      btnConfirmar.setAttribute('aria-busy', 'true'); btnConfirmar.textContent = 'Guardando…';
      llamar('actualizarPaciente', [data, opts.idPaciente])
        .then(function () {
          guardando = false;
          originalData = recogerDatos();   // ya guardado: cerrar no debe pedir confirmación
          btnConfirmar.removeAttribute('aria-busy'); btnConfirmar.innerHTML = '<span class="material-symbols-outlined">check_circle</span>Guardado';
          setTimeout(function () { if (opts.onGuardado) opts.onGuardado(); }, 600);
        }, function (err) {
          guardando = false;
          mostrarErrorRevision('Error al guardar: ' + (err && err.message ? err.message : err));
          btnConfirmar.removeAttribute('aria-busy'); btnVolver.disabled = false; btnConfirmar.innerHTML = ETIQUETA_CONFIRMAR;
        });
    }

    btnCancelar.addEventListener('click', function () { if (opts.onCancelar) opts.onCancelar(); });
    btnRevisar.addEventListener('click', mostrarResumen);
    btnVolver.addEventListener('click', ocultarResumen);
    btnConfirmar.addEventListener('click', confirmarEnvio);

    /* ── Carga de la fila ── */
    function mostrarEstado(texto, esError) {
      form.innerHTML = '<div class="pe-estado' + (esError ? ' error' : '') + '">' + esc(texto) + '</div>';
    }
    llamar('obtenerDatosEdicionPaciente', [opts.idPaciente])
      .then(function (d) {
        construirFormulario(d.headers, d.rowData);
        enlazarCampos(d.headers);
        originalData = recogerDatos();
        cargado = true;
        btnRevisar.disabled = false;
      }, function (err) {
        mostrarEstado('No se pudo cargar el usuario: ' + (err && err.message ? err.message : err), true);
      });

    return {
      haCambiado: function () { return cargado && !guardando && contarCambios(recogerDatos()) > 0; },
      alEscape: function () {
        if (capa.classList.contains('visible')) { if (!guardando) ocultarResumen(); return true; }
        return cerrarMenus();
      }
    };
  }
};
</script>
