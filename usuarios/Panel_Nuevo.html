<!--
  usuarios/Panel_Nuevo.html
  Formulario de Nuevo usuario como módulo del panel lateral de Usuarios (igual que Panel_Valoracion / Panel_Editar).
  Se incluye desde usuarios/BaseDatos_Vista con include('usuarios/Panel_Nuevo') en un scriptlet de impresion.
  API: PanelNuevo.abrir(contenedor, { onGuardado, onCancelar, onAbrirEditar, obtenerUsuarios })
  Devuelve { haCambiado(), alEscape(), cerrar() }:
    · haCambiado() → true si hay datos sin guardar (Usuarios pregunta antes de descartar).
    · alEscape()   → cierra primero una confirmación o un desplegable abierto; devuelve true si lo ha gestionado.
  Comportamiento:
    · El título y el botón de volver los pone el panel de la página (ficha-form-cab); aquí solo va el formulario.
    · Cancelar delega en onCancelar(): la página pregunta por los cambios sin guardar con su propio confirm.
    · Avisos de usuario ya existente (mismo DNI, teléfono o nombre parecido): en línea bajo cada campo mientras se rellena y, al guardar,
      en una capa DENTRO del panel. La comprobación es LOCAL, contra la lista que da opts.obtenerUsuarios() (en BaseDatos es TODOS, ya
      cargada en la página): sin llamadas al servidor. Nunca bloquea: se puede editar el existente, guardar igualmente o seguir editando.
    · Editar el existente → onAbrirEditar(fila): la página abre su formulario de edición (devuelve false si no encuentra esa fila).
    · Al guardar muestra el mensaje y, tras un instante, llama a onGuardado(mensaje) (la página recarga la tabla).
  Funciones de servidor (usuarios/Anadir_Usuario.gs): guardarPaciente y generarHistoriaClinicaRegistroUsuario.
  CSS acotado a .nu y basado en los tokens de la página (--md-*, respeta el tema oscuro). A 400 px todo va en una columna.
  Requiere ui/JS_Formato_Nombre en la página (sanitizeName, sanitizeDni, formatoNombreFinal, formatoDni, validarDni).
-->
<style>
.nu {
  position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0;
  background: var(--md-surface); color: var(--md-on-surface);
  font-family: var(--font); font-size: var(--fs-md);
}


/* ── Cabecera / cuerpo / pie ── */
.nu .nu-cuerpo { flex: 1; min-height: 0; overflow: auto; }
.nu .card-section { padding: 1.1rem 1.25rem 1.3rem; border-bottom: 1px solid var(--md-outline); }
.nu .card-section:last-child { border-bottom: none; }
.nu .section-label { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.1rem; }
.nu .section-pill { display: inline-flex; align-items: center; gap: .375rem; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary-dark); background: var(--md-primary-light); padding: .35rem .875rem .35rem .75rem; border-radius: var(--md-shape-full); }
.nu .section-pill .ms { font-size: 15px; color: var(--md-primary); }
.nu .section-divider { flex: 1; height: 1px; background: var(--md-outline); }
.nu .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1.1rem 1rem; align-items: start; }
.nu .span-2 { grid-column: 1 / -1; }
.nu .nu-msg { flex: none; display: none; padding: .7rem 1.25rem; font-size: var(--fs-sm); font-weight: 500; }
.nu .nu-msg.success { display: block; background: var(--md-success-bg); color: var(--md-success); }
.nu .nu-msg.error { display: block; background: var(--md-error-bg); color: var(--md-error); }
.nu .nu-pie { flex: none; display: flex; align-items: center; justify-content: flex-end; gap: .75rem; padding: .75rem 1.1rem; border-top: 1px solid var(--md-outline); background: var(--md-surface); }
.nu .nu-pie .hint { display: none; }
.nu .nu-pie .botones { display: flex; gap: .5rem; margin-left: auto; }

/* ── Campos de texto: .md-campo de CSS_Global; aqui solo lo propio del panel ── */
.nu .md-campo__etiqueta { max-width: calc(100% - 52px); overflow: hidden; text-overflow: ellipsis; }
.nu .md-campo__etiqueta .req { color: var(--md-primary); margin-left: 2px; }
.nu .md-campo__ayuda { display: none; margin-top: 4px; }
.nu .md-campo--error .md-campo__ayuda { display: block; }

/* ── Desplegables: mismo aspecto que .md-campo ── */
.nu .multiselect { position: relative; }
.nu .ms-toggle {
  width: 100%; min-height: 52px; box-sizing: border-box; padding: 0 44px; border: 1.5px solid var(--md-outline-strong); border-radius: var(--md-shape-md); background: transparent; cursor: pointer;
  display: flex; align-items: center; position: relative; font-size: var(--fs-field); color: var(--md-on-surface); user-select: none; outline: none;
  transition: border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}
.nu .ms-toggle:hover:not(.open) { border-color: var(--md-on-surface); }
.nu .ms-toggle.open, .nu .ms-toggle:focus-visible { border-color: var(--md-primary); box-shadow: inset 0 0 0 .5px var(--md-primary); }
.nu .ms-leading { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; }
.nu .ms-trailing { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; }
.nu .ms-trailing .ms { transition: transform var(--dur-2) var(--ease); }
.nu .ms-toggle.open .ms-trailing .ms { transform: rotate(180deg); color: var(--md-primary); }
.nu .ms-toggle.open .ms-leading .ms { color: var(--md-primary); }
.nu .ms-label {
  position: absolute; left: 44px; top: 50%; transform: translateY(-50%); font-size: var(--fs-field); color: var(--md-on-surface-med); background: var(--md-surface); padding: 0 4px; margin-left: -4px; z-index: var(--z-base); white-space: nowrap; pointer-events: none;
  transition: top var(--dur-3) var(--ease), font-size var(--dur-3) var(--ease), color var(--dur-2) var(--ease);
}
.nu .ms-toggle.open .ms-label, .nu .ms-toggle.has-value .ms-label, .nu .ms-toggle:focus-visible .ms-label { top: 0; font-size: var(--fs-xs); }
.nu .ms-toggle.open .ms-label { color: var(--md-primary); }
.nu .ms-display { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nu .ms-toggle:not(.has-value) .ms-display { opacity: 0; }
.nu .ms-menu { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: var(--z-sticky); background: var(--md-surface); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); box-shadow: var(--md-elev-3); display: none; overflow: hidden; }
.nu .ms-menu.open { display: block; animation: md-entra var(--dur-2) var(--ease) both; }
.nu .ms-search-wrap { display: flex; align-items: center; gap: .5rem; padding: .6rem .85rem .5rem; border-bottom: 1px solid var(--md-outline); }
.nu .ms-search-input { flex: 1; border: none; background: transparent; font-family: var(--font); font-size: var(--fs-md); color: var(--md-on-surface); outline: none; padding: .125rem 0; }
.nu .ms-items-wrap { max-height: 200px; overflow-y: auto; }
.nu .ms-item { display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem; cursor: pointer; font-size: var(--fs-md); color: var(--md-on-surface); }
.nu .ms-item:hover { background: var(--md-primary-light); }
.nu .ms-item:has(input:checked), .nu .ms-item.selected { background: var(--md-primary-container); font-weight: 500; }
.nu .ms-item input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--md-primary); cursor: pointer; flex-shrink: 0; margin: 0; }
.nu .ms-nombre { flex: 1; min-width: 0; }
.nu .ms-cod { flex: none; font-size: var(--fs-xs); color: var(--md-on-surface-med); font-variant-numeric: tabular-nums; }
.nu .ms-grupo { position: sticky; top: 0; z-index: var(--z-base); padding: .45rem 1rem; font-size: var(--fs-2xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--md-primary-dark); background: var(--md-primary-light); }
.nu .ms-item-hidden { display: none !important; }
.nu .ms-vacio { padding: .8rem 1rem; font-size: var(--fs-sm); color: var(--md-on-surface-med); display: none; }

/* ── Evaluación de gravedad ── */
.nu .gravedad-grid { display: grid; grid-template-columns: 1fr; gap: .75rem; }
.nu .grav-card { background: var(--md-bg); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); padding: .85rem 1rem; transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease); }
.nu .grav-card:has(input:checked) { border-color: var(--md-primary); background: var(--md-surface); }
.nu .grav-card.has-error { border-color: var(--md-error); }
.nu .grav-question { font-size: var(--fs-sm); font-weight: 500; margin-bottom: .65rem; line-height: 1.35; }
.nu .radio-row { display: flex; gap: .5rem; }
.nu .radio-pill {
  position: relative; flex: 1; display: flex; align-items: center; justify-content: center; gap: .35rem; padding: .45rem .6rem; min-height: 36px; border-radius: var(--md-shape-full); border: 1.5px solid var(--md-outline-strong);
  cursor: pointer; font-size: var(--fs-sm); font-weight: 500; color: var(--md-on-surface-med); background: var(--md-surface); user-select: none; overflow: hidden;
  transition: background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.nu .radio-pill input { position: absolute; opacity: 0; pointer-events: none; }
.nu .radio-pill:has(input:focus-visible) { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.nu .radio-pill .ms { font-size: 14px; }
.nu .radio-pill:hover { background: var(--md-surface-variant); }
.nu .radio-pill.yes:has(input:checked) { background: var(--md-success-bg); border-color: transparent; color: var(--md-success); }
.nu .radio-pill.yes:has(input:checked) .ms { color: var(--md-success); }
.nu .radio-pill.no:has(input:checked) { background: var(--md-error-bg); border-color: transparent; color: var(--md-error); }
.nu .radio-pill.no:has(input:checked) .ms { color: var(--md-error); }
.nu .severity-row { display: flex; align-items: center; gap: 1rem; padding: .9rem 1.1rem; margin-top: 1rem; background: var(--md-bg); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); transition: border-color var(--dur-2) var(--ease); }
.nu .severity-row.filled { border-color: var(--md-primary); background: var(--md-surface); }
.nu .sev-label { font-size: var(--fs-sm); font-weight: 500; color: var(--md-on-surface-med); white-space: nowrap; }
.nu .sev-chip { display: inline-flex; align-items: center; font-size: var(--fs-md); font-weight: 500; color: var(--md-on-surface-med); background: var(--md-surface-variant); padding: .35rem 1rem; border-radius: var(--md-shape-full); }
.nu .sev-chip.leve { background: var(--md-success-bg); color: var(--md-success); }
.nu .sev-chip.moderado { background: var(--md-warning-bg); color: var(--md-warning-text); }
.nu .sev-chip.grave { background: var(--md-error-bg); color: var(--md-error); }

/* ── Interruptores ── */
.nu .toggle-field { position: relative; display: flex; align-items: center; gap: .9rem; padding: .85rem 1rem; background: var(--md-bg); border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); cursor: pointer; user-select: none; transition: border-color var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease); }
.nu .toggle-field input { position: absolute; opacity: 0; pointer-events: none; }
.nu .toggle-field:has(input:focus-visible) { outline: 2px solid var(--md-primary); outline-offset: 2px; }
.nu .toggle-field:has(input:checked) { border-color: var(--md-primary); background: var(--md-surface); }
.nu .toggle-icon { width: 38px; height: 38px; background: var(--md-primary-light); border-radius: var(--md-shape-sm); display: grid; place-items: center; flex-shrink: 0; }
.nu .toggle-icon .ms { color: var(--md-primary); }
.nu .toggle-text { flex: 1; min-width: 0; }
.nu .toggle-text strong { display: block; font-size: var(--fs-md); font-weight: 500; }
.nu .toggle-text span { display: block; font-size: var(--fs-xs); color: var(--md-on-surface-med); margin-top: 1px; }
.nu .toggle-track { position: relative; width: 44px; height: 26px; background: var(--md-surface-variant); border: 2px solid var(--md-outline-strong); border-radius: var(--md-shape-full); flex-shrink: 0; transition: background-color var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease); }
.nu .toggle-thumb { position: absolute; top: 50%; left: 3px; transform: translateY(-50%); width: 14px; height: 14px; background: var(--md-outline-strong); border-radius: 50%; transition: left var(--dur-2) var(--ease), width var(--dur-2) var(--ease), height var(--dur-2) var(--ease), background-color var(--dur-2) var(--ease); }
.nu .toggle-field:has(input:checked) .toggle-track { background: var(--md-primary); border-color: var(--md-primary); }
.nu .toggle-field:has(input:checked) .toggle-thumb { background: var(--md-on-primary); width: 18px; height: 18px; left: 19px; }

/* ── Confirmacion y aviso de posible duplicado: el dialogo comun (.modal-overlay / .modal-box de CSS_Global) ── */
.nu .nu-conf .modal-mensaje { margin-bottom: 1.25rem; }
.nu .nu-dup-caja { max-width: 420px; max-height: 100%; display: flex; flex-direction: column; }
.nu .nu-dup-tit { font-weight: 600; font-size: var(--fs-title); }
.nu .nu-dup-sub { margin: .35rem 0 0; color: var(--md-on-surface-med); font-size: var(--fs-md); line-height: 1.45; }
.nu .nu-dup-lista { margin-top: .9rem; display: flex; flex-direction: column; gap: .5rem; overflow-y: auto; min-height: 0; }
.nu .nu-dup-item { display: flex; align-items: center; gap: .75rem; padding: .6rem .7rem; border: 1px solid var(--md-outline); border-radius: var(--md-shape-md); }
.nu .nu-dup-datos { flex: 1; min-width: 0; }
.nu .nu-dup-nombre { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nu .nu-dup-meta { margin-top: .15rem; font-size: var(--fs-xs); color: var(--md-on-surface-med); }
.nu .nu-dup-motivos { margin-top: .3rem; display: flex; flex-wrap: wrap; gap: .3rem; }
.nu .nu-dup-motivos span { font-size: var(--fs-2xs); font-weight: 600; padding: .1rem .5rem; border-radius: var(--md-shape-full); background: var(--md-primary-light); color: var(--md-primary-dark); }
.nu .nu-dup-mas { font-size: var(--fs-sm); color: var(--md-on-surface-med); padding: .1rem .2rem; }
.nu .nu-dup-pie { margin-top: 1.1rem; flex-wrap: wrap; }

/* ── Aviso en línea bajo un campo: ya existe un usuario con ese dato (una sola línea, para no ocupar alto) ── */
.nu .nu-aviso { display: none; align-items: center; gap: .4rem; margin: 4px 0 0 14px; padding: .15rem .3rem .15rem .5rem; min-height: 28px; border-radius: var(--md-shape-sm); border-left: 3px solid var(--md-warning); background: var(--md-warning-bg); color: var(--md-on-surface); font-size: var(--fs-xs); line-height: 1.3; }
.nu .nu-aviso.visible { display: flex; }
.nu .nu-aviso > .ms { font-size: 16px; color: var(--md-warning-text); flex: none; }
.nu .nu-aviso-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nu .nu-aviso-nom { font-weight: 600; }
.nu .nu-aviso-mas { flex: none; color: var(--md-on-surface-med); font-weight: 600; }
.nu .nu-aviso-btn { flex: none; border: 0; background: transparent; color: var(--md-primary); font: inherit; font-weight: 600; cursor: pointer; padding: .15rem .4rem; border-radius: var(--md-shape-xs); }
.nu .nu-aviso-btn:hover { background: var(--md-primary-light); }

</style>

<script>
window.PanelNuevo = {
  abrir: function (host, opts) {
    opts = opts || {};
    var SEVERITY_MAP = [
      { label: GRAVEDAD_PACIENTE.LEVE, cls: 'leve', min: 0, max: 3 },
      { label: GRAVEDAD_PACIENTE.MODERADO, cls: 'moderado', min: 4, max: 6 },
      { label: GRAVEDAD_PACIENTE.GRAVE, cls: 'grave', min: 7, max: 9 }
    ];
    var ESTADOS = ESTADOS_PACIENTE.LISTA_NUEVO.slice(), ESTADO_DEF = ESTADOS_PACIENTE.DEFECTO_NUEVO;
    var INGRESOS = TIPOS_INGRESO.LISTA.slice(), INGRESO_DEF = TIPOS_INGRESO.DEFECTO;

    function hoyLocal() {
      var d = new Date(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + m + '-' + dd;
    }
    function campo(id, icono, etiqueta, opciones) {
      opciones = opciones || {};
      return '<div class="md-campo md-campo--icono' + (opciones.span ? ' span-2' : '') + '">' +
        '<span class="ms md-campo__icono">' + icono + '</span>' +
        (opciones.textarea
          ? '<textarea class="md-campo__control" id="nu-' + id + '" name="' + opciones.name + '" rows="3" placeholder=" "></textarea>'
          : '<input class="md-campo__control" type="' + (opciones.type || 'text') + '" id="nu-' + id + '" name="' + opciones.name + '" placeholder=" "' + (opciones.inputmode ? ' inputmode="' + opciones.inputmode + '"' : '') + ' autocomplete="off">') +
        '<label class="md-campo__etiqueta" for="nu-' + id + '">' + etiqueta + (opciones.req ? '<span class="req">*</span>' : '') + '</label>' +
        '<p class="md-campo__ayuda"></p></div>';
    }
    function desplegable(id, icono, etiqueta, valorIni, conBuscador) {
      return '<div class="multiselect" id="nu-ms-' + id + '">' +
        '<div class="ms-toggle' + (valorIni ? ' has-value' : '') + '" tabindex="0" role="button" aria-haspopup="listbox" aria-expanded="false" aria-label="' + etiqueta + '">' +
          '<div class="ms-leading"><span class="ms">' + icono + '</span></div>' +
          '<span class="ms-label">' + etiqueta + '</span>' +
          '<span class="ms-display">' + (valorIni || '— Selecciona —') + '</span>' +
          '<div class="ms-trailing"><span class="ms">expand_more</span></div>' +
        '</div>' +
        '<div class="ms-menu" role="listbox">' +
          (conBuscador ? '<div class="ms-search-wrap"><span class="ms ms-sm">search</span><input class="ms-search-input" type="text" placeholder="Buscar patología…" aria-label="Buscar patología" autocomplete="off"></div>' : '') +
          '<div class="ms-items-wrap"></div>' +
          (conBuscador ? '<div class="ms-vacio">Sin resultados</div>' : '') +
        '</div></div>';
    }
    function pregunta(n, texto, valorSi) {
      return '<div class="grav-card"><p class="grav-question">' + texto + '</p><div class="radio-row">' +
        '<label class="radio-pill yes"><input type="radio" name="gravedad_q' + n + '" value="' + valorSi + '"><span class="ms">check</span> Sí</label>' +
        '<label class="radio-pill no"><input type="radio" name="gravedad_q' + n + '" value="0"><span class="ms">close</span> No</label>' +
      '</div></div>';
    }
    function interruptor(id, icono, titulo, sub, marcado) {
      return '<label class="toggle-field"><input type="checkbox" id="nu-' + id + '"' + (marcado ? ' checked' : '') + '>' +
        '<div class="toggle-icon"><span class="ms ms-fill">' + icono + '</span></div>' +
        '<div class="toggle-text"><strong>' + titulo + '</strong><span>' + sub + '</span></div>' +
        '<div class="toggle-track"><div class="toggle-thumb"></div></div></label>';
    }
    function seccion(icono, titulo, contenido) {
      return '<div class="card-section"><div class="section-label"><span class="section-pill"><span class="ms ms-sm">' + icono + '</span>' + titulo + '</span><div class="section-divider"></div></div>' + contenido + '</div>';
    }

    var dlg = document.createElement('div');
    dlg.className = 'nu';
    dlg.innerHTML =
      '<div class="nu-cuerpo"><form class="nu-form" novalidate onsubmit="return false">' +
        seccion('badge', 'Datos personales', '<div class="grid-2">' +
          campo('nombre', 'person', 'Nombre completo', { name: 'Nombre', req: true }) +
          campo('dni', 'id_card', 'Identificación (DNI / SIP)', { name: 'DNI' }) +
          campo('fi', 'event', 'Fecha de inscripción', { name: 'Fecha inscripción', type: 'date', req: true }) +
          campo('fn', 'cake', 'Fecha de nacimiento', { name: 'Fecha nacimiento', type: 'date' }) +
        '</div>') +
        seccion('contacts', 'Contacto y estado', '<div class="grid-2">' +
          campo('tel1', 'call', 'Teléfono principal', { name: 'Teléfono 1', type: 'tel', inputmode: 'tel' }) +
          campo('tel2', 'smartphone', 'Teléfono secundario', { name: 'Teléfono 2', type: 'tel', inputmode: 'tel' }) +
          '<div><input type="hidden" name="Estado" class="nu-estado" value="' + ESTADO_DEF + '">' + desplegable('estado', 'radio_button_checked', 'Estado', ESTADO_DEF, false) + '</div>' +
          '<div><input type="hidden" name="Tipo de Ingreso" class="nu-ingreso" value="' + INGRESO_DEF + '">' + desplegable('ingreso', 'login', 'Tipo de ingreso', INGRESO_DEF, false) + '</div>' +
        '</div>') +
        seccion('medical_information', 'Diagnóstico', '<div class="grid-2">' +
          desplegable('pat1', 'assignment', 'Patología 1', '', true) + desplegable('pat2', 'assignment', 'Patología 2', '', true) +
        '</div>') +
        seccion('monitor_heart', 'Evaluación de gravedad',
          '<div class="gravedad-grid">' +
            pregunta(1, 'Riesgo de pérdida de AVD', 3) + pregunta(2, 'Dolor alto limita actividades', 2) + pregunta(3, 'Patología aguda', 2) +
            pregunta(4, 'Hospitalización / cirugía reciente', 1) + pregunta(5, 'Posibilidad de cronificación', 1) +
          '</div><div class="severity-row"><span class="sev-label">Gravedad asignada:</span><span class="sev-chip">Completa la evaluación</span></div>') +
        seccion('edit_note', 'Observaciones',
          campo('obs', 'notes', 'Notas adicionales', { name: 'Observaciones', textarea: true }) +
          '<div class="grid-2" style="margin-top:1.1rem">' +
            interruptor('hc', 'description', 'Historia Clínica', 'Crear documento de HC', false) +

      if (errores) { var primero = q('.md-campo--error input'); if (primero) primero.focus(); return; }
      if (!gravedadCompleta()) {
        qa('.grav-card').forEach(function (c) { if (!c.querySelector('input:checked')) c.classList.add('has-error'); });
        mostrarMsg('Por favor, completa todas las preguntas de evaluación de gravedad.', 'error');
        sevRow.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      // Valores finales con la regla única (sin espacios sobrantes) antes de enviar
      iNombre.value = formatoNombreFinal(iNombre.value);
      iDni.value = formatoDni(iDni.value).trim();
      var datos = recogerDatos(), dni = iDni.value.trim();
      // Último freno antes de crear el alta: si coincide con usuarios ya existentes (DNI, teléfono o nombre parecido) se avisa.
      // No bloquea: deja elegir entre editar el que ya existe, guardar igualmente como nuevo o seguir editando el formulario.
      var cands = coincidencias(iNombre.value, dni, [iTel1.value, iTel2.value]);
      if (cands.total) {
        var eleccion = await elegirDuplicado(cands);
        if (eleccion.accion === 'volver') return;
        if (eleccion.accion === 'editar') { irAEditar(eleccion.fila); return; }
      }
      guardar(datos);
    }
    function guardar(datos) {
      guardando = true; ponerBotonGuardando(true);
      llamar('guardarPaciente', [datos])
        .then(function (res) {
          guardando = false;
          if (res && res.success) {
            guardado = true;
            mostrarMsg(res.message || 'Usuario guardado correctamente.', 'success');
            btnGuardar.removeAttribute('aria-busy'); btnGuardar.disabled = true; btnCancelar.disabled = true;
            btnGuardar.innerHTML = '<span class="ms">check_circle</span>Guardado';
            var avisarGuardado = function (retraso) {
              setTimeout(function () { if (!cerrado && opts.onGuardado) opts.onGuardado(res.message || 'Usuario guardado'); }, retraso);
            };
            if (q('#nu-hc').checked) {
              // La página recarga la lista al recibir onGuardado: hay que esperar a que la historia clínica esté creada
              // y enlazada en la Maestra, o la lista se recarga sin el enlace y el usuario aparece sin historia.
              guardando = true;
              mostrarMsg((res.message || 'Usuario guardado correctamente.') + ' Creando la historia clínica…', 'success');
              llamar('generarHistoriaClinicaRegistroUsuario', [Object.assign({}, datos, { idPaciente: res.idPaciente })])
                .then(function (r) {
                  guardando = false;
                  if (r && r.success) console.log('Historia clínica creada:', r.url);
                  else {
                    console.error('No se pudo crear la historia clínica:', r && r.message);
                    mostrarMsg('Usuario guardado, pero no se pudo crear la historia clínica: ' + ((r && r.message) || 'error desconocido') + ' Puedes crearla desde su ficha.', 'error');
                  }
                  avisarGuardado(r && r.success ? 300 : 3500);
                }, function (err) {
                  guardando = false;
                  console.error('No se pudo crear la historia clínica:', err);
                  mostrarMsg('Usuario guardado, pero no se pudo crear la historia clínica: ' + (err && err.message ? err.message : err) + ' Puedes crearla desde su ficha.', 'error');
                  avisarGuardado(3500);
                });
            } else {
              avisarGuardado(900);
            }
          } else {
            ponerBotonGuardando(false);
            mostrarMsg((res && res.message) || 'No se pudo guardar el usuario.', 'error');
          }
        }, function (err) {
          guardando = false; ponerBotonGuardando(false);
          mostrarMsg('Error al guardar el usuario: ' + (err && err.message ? err.message : err), 'error');
        });
    }
    btnGuardar.addEventListener('click', enviar);

    iNombre.focus();
    return { cerrar: cerrar, haCambiado: haCambiado, alEscape: alEscape };
  }
};
</script>
