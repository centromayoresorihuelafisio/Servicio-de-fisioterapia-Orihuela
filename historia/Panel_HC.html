<!--
  historia/Panel_HC.html
  Historia clínica web como módulo del panel lateral (Usuarios y Agenda) y como página completa (historia/HC_Vista.html).
  Se incluye con incluirPanel('historia/Panel_HC', 'PanelHC') (carga bajo demanda, ver ui/JS_Paneles_Diferidos).
  API: PanelHC.abrir(contenedor, { id, idPaciente, modo, urlPagina, volverUrl, alCargar, alCambiar, acciones })
  Funciones de la app dentro de la historia (solo en el panel lateral): Valoración, Dar cita, Editar y WhatsApp. Reutilizan
  PanelValoraciones / PanelCita / PanelEditar (se montan en una hoja que se superpone a la historia) y WhatsappDialogo; cada
  botón aparece solo si la página anfitriona incluye ese módulo. La página anfitriona se entera de los cambios con alCambiar(tipo).
  Devuelve { haCambiado(), alEscape(), cerrar() }:
    · haCambiado() → true solo si hay texto que NO se pudo guardar (el resto se autoguarda).
    · alEscape()   → true si estaba en modo "ampliar" y lo cierra; si no, false (el anfitrión cierra el panel).
    · cerrar()     → vuelca al servidor lo que esté pendiente de guardar.
  Servidor: historia/HC_Web.gs (obtenerHCWeb, guardarTextoHCWeb, guardarEpisodiosHCWeb).
  Si la página incluye ui/JS_HC_Cache (Usuarios y Agenda), la ficha se pinta al instante desde la caché de HC activas
  y, si la entrada tiene más de un minuto, se refresca detrás (revalidar). Sin la caché (HC_Vista) carga del servidor como siempre. Usa los tokens --md-* de la página
  anfitriona (incluido el tema oscuro) y container queries (@container hc) para adaptarse al ancho del panel. Todo el CSS va bajo .hc.
  Este archivo se GENERA a partir del diseño aprobado: si se retoca, hacerlo directamente aquí.
-->
<style>
.hc *{box-sizing:border-box}
.hc{margin:0}
.hc{font:14px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--md-bg);color:var(--md-on-surface);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.hc svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hc /* ---------- barra superior ---------- */
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 24px;background:color-mix(in srgb,var(--md-bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--md-outline) 70%,transparent)}
.hc .top .crumb{color:var(--md-on-surface-med);font-size:13px}
.hc .top .crumb b{color:var(--md-on-surface);font-weight:600}
.hc .sp{flex:1}
.hc .guardado{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--md-on-surface-med);padding:0 8px}
.hc .guardado i{width:8px;height:8px;border-radius:50%;background:var(--md-success);transition:background .2s}
.hc .guardado.ocupado i{background:var(--md-warning);animation:hc-pulso 1s infinite}
@keyframes hc-pulso{50%{opacity:.35}}
.hc /* ---------- botones (ripple) ---------- */
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--md-outline);background:transparent;color:var(--md-primary);font:inherit;font-weight:600;cursor:pointer;transition:background .2s var(--ease),box-shadow .2s var(--ease)}
.hc .btn:hover{background:color-mix(in srgb,var(--md-primary) 8%,transparent)}
.hc .btn.fill{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary)}
.hc .btn.fill:hover{background:color-mix(in srgb,var(--md-primary) 88%,#000);box-shadow:var(--e1)}
.hc .btn.tonal{background:var(--md-primary-container);border-color:transparent;color:var(--md-primary-dark)}
.hc .btn.icon{width:38px;padding:0;justify-content:center;border-color:transparent;color:var(--md-on-surface-med)}
.hc .btn.icon:hover{color:var(--md-primary)}
.hc .ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.16;animation:hc-rip .55s var(--ease) forwards;pointer-events:none}
@keyframes hc-rip{to{transform:scale(2.6);opacity:0}}
.hc /* ---------- layout ---------- */
  .pagina{max-width:1240px;margin:0 auto;padding:22px 24px 70px}
.hc .cabecera{display:flex;align-items:center;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.hc .avatar{width:64px;height:64px;border-radius:50%;background:var(--md-primary-container);color:var(--md-primary-dark);display:grid;place-items:center;font-size:23px;font-weight:700;letter-spacing:.02em}
.hc .cabecera h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:.005em}
.hc .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.hc .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--md-surface-variant);color:var(--md-on-surface-med)}
.hc .chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hc .chip.ok{background:var(--md-success-bg);color:var(--md-success)}
.hc .chip.warn{background:var(--md-warning-bg);color:var(--md-warning)}
.hc .chip.info{background:var(--md-primary-light);color:var(--md-primary)}
.hc .chip.alta{background:var(--md-purple-bg);color:var(--md-purple)}
.hc .rejilla{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.hc .lateral{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
@container hc (max-width:980px){.hc .rejilla{grid-template-columns:1fr}
.hc .lateral{position:static}}
.hc .card{background:var(--md-surface);border:1px solid color-mix(in srgb,var(--md-outline) 75%,transparent);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--e1)}
.hc .sec{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:999px;background:var(--md-primary-light);color:var(--md-primary);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hc /* ---------- datos ---------- */
  .campos{margin:8px 0 0;display:grid;gap:0}
.hc .campo{display:grid;grid-template-columns:26px 1fr;align-items:center;gap:9px;padding:5px 0;border-top:1px solid color-mix(in srgb,var(--md-outline) 55%,transparent)}
.hc .campo:first-child{border-top:0}
.hc .campo dt{margin:0;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--md-primary-light);color:var(--md-primary)}
.hc .campo dt svg.i{width:15px;height:15px}
.hc .campo dd{margin:0;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.hc .campo dd.nulo{color:var(--md-on-surface-low);font-weight:400}
.hc .acc{margin-left:auto;display:flex;gap:2px}
.hc .mini{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--md-on-surface-low);display:grid;place-items:center;cursor:pointer;position:relative;overflow:hidden}
.hc .mini:hover{background:var(--md-primary-light);color:var(--md-primary)}
.hc .mini.wa:hover{background:var(--md-success-bg);color:var(--md-success)}
.hc /* ---------- episodios ---------- */
  .cab-sec{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hc .episodios{margin:14px 0 6px;position:relative;display:grid;gap:12px}
.hc .ep{position:relative;padding-left:26px}
.hc .ep::before{content:"";position:absolute;left:6px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--md-surface);border:2px solid var(--md-outline)}
.hc .ep.curso::before{border-color:var(--md-success);background:var(--md-success)}
.hc .ep::after{content:"";position:absolute;left:11px;top:22px;bottom:-14px;width:2px;background:var(--md-outline);opacity:.7}
.hc .ep:last-child::after{display:none}
.hc .ep .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hc .ep .t strong{font-weight:600}
.hc .ep .fechas{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:6px}
.hc .fecha{height:34px;border:1px solid var(--md-outline);border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:13px;padding:0 8px;width:100%;min-width:0}
.hc .fecha:focus{outline:2px solid var(--md-primary);outline-offset:-1px;border-color:transparent}
.hc .flecha{color:var(--md-on-surface-low)}
.hc .dur{font-size:12px;color:var(--md-on-surface-low)}
.hc .ep-del{margin-left:auto;height:26px;padding:0 8px;border:0;border-radius:999px;background:transparent;color:var(--md-on-surface-low);font:inherit;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.hc .ep-del:hover{background:var(--md-surface-variant);color:var(--md-error)}
.hc .ep-del.seguro{background:var(--md-error);color:#fff}
.hc .ep-del svg.i{width:15px;height:15px}
.hc{position:relative}
.hc .hc-acciones{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hc .hc-acciones .btn{height:36px;padding:0 14px;font-size:13px}
.hc .hc-hoja{position:absolute;inset:0;z-index:30;display:flex;justify-content:flex-end}
.hc .hc-hoja-vel{position:absolute;inset:0;background:rgba(32,33,36,.38)}
.hc .hc-hoja-caja{position:relative;width:min(560px,100%);height:100%;display:flex;flex-direction:column;background:var(--md-surface);box-shadow:-10px 0 40px rgba(0,0,0,.18);animation:hc-hoja-entra .18s var(--ease)}
@keyframes hc-hoja-entra{from{transform:translateX(28px);opacity:0}}
.hc .hc-hoja-cab{flex:none;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-bottom:1px solid color-mix(in srgb,var(--md-outline) 70%,transparent)}
.hc .hc-hoja-cab strong{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc .hc-hoja-cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.hc .hc-hoja-cuerpo>*{flex:1 1 auto;min-height:0}
.hc /* ---------- indicadores ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.hc .tile{background:var(--md-surface);border:1px solid color-mix(in srgb,var(--md-outline) 75%,transparent);border-radius:16px;padding:10px 12px 9px;box-shadow:var(--e1);display:flex;flex-direction:column;gap:5px;min-width:0}
.hc .th{display:flex;align-items:center;gap:9px}
.hc .th .k{font-size:12.5px;font-weight:600;color:var(--md-on-surface-med);flex:1;min-width:0}
.hc .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--md-primary-light);color:var(--md-primary)}
.hc .ic.sm{width:28px;height:28px;border-radius:9px}
.hc .ic.sm svg.i{width:16px;height:16px}
.hc .ic.err{background:var(--md-error-bg);color:var(--md-error)}
.hc .ic.ok{background:var(--md-success-bg);color:var(--md-success)}
.hc .ic.pur{background:var(--md-purple-bg);color:var(--md-purple)}
.hc .tile .v{font-size:22px;line-height:1.1;font-weight:700;letter-spacing:.005em}
.hc .tile .v.txt{font-size:17px}
.hc .tile .v small{font-size:12.5px;font-weight:500;color:var(--md-on-surface-med);margin-left:4px}
.hc .bar{height:6px;border-radius:99px;background:var(--md-surface-variant);overflow:hidden}
.hc .bar i{display:block;height:100%;border-radius:99px;background:var(--md-primary);transition:width .5s var(--ease)}
.hc .tr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--md-on-surface-low)}
.hc .chip.mal{background:var(--md-error-bg);color:var(--md-error)}
.hc .chip.sm{height:22px;font-size:12px;padding:0 9px}
.hc .spark{width:52px;height:24px;overflow:visible;flex:none}
.hc .spark polyline{fill:none;stroke:var(--md-primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hc .spark circle{fill:var(--md-primary)}
.hc .vacio-tile{color:var(--md-on-surface-low);font-size:13px}
.hc .asist-card{margin-bottom:20px}
.hc .ac-cab{display:flex;align-items:center;gap:11px}
.hc .ac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 12px}
.hc .ac-n{border-radius:14px;padding:10px 14px;background:var(--bgc);color:var(--fgc)}
.hc .ac-n b{display:block;font-size:28px;line-height:1.1;font-weight:700}
.hc .ac-n span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-top:2px}
.hc .ac-n span::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.hc .ac-n.ok{--bgc:var(--md-success-bg);--fgc:var(--md-success)}
.hc .ac-n.mal{--bgc:var(--md-error-bg);--fgc:var(--md-error)}
.hc .ac-n.av{--bgc:var(--md-warning-bg);--fgc:var(--md-warning)}
.hc .stack{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--md-surface-variant)}
.hc .stack i{display:block;height:100%}
.hc .stack .s-ok{background:var(--md-success)}
.hc .stack .s-mal{background:var(--md-error)}
.hc .stack .s-av{background:#e8b95a}
.hc .ac-pie{margin-top:8px;font-size:12px;color:var(--md-on-surface-low);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@container hc (max-width:520px){.hc .ac-grid{grid-template-columns:1fr}}
.hc .demo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--md-on-surface-low)}
.hc .demo select{font:inherit;font-size:12px;border:1px solid var(--md-outline);border-radius:8px;background:var(--md-surface);color:inherit;padding:4px 6px}
.hc /* cabeceras de tarjeta con icono tonal */
  .ht{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.hc .ht h2{margin:0;font-size:15px;font-weight:700}
.hc .ht span{font-size:12px;color:var(--md-on-surface-low)}
.hc /* ---------- notas clínicas ---------- */
  main{min-width:0}
.hc .notas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.hc .notas.foco{grid-template-columns:1fr}
.hc .notas.foco .nota:not(.activa){display:none}
@container hc (max-width:760px){.hc .notas{grid-template-columns:1fr}}
.hc .nota{display:flex;flex-direction:column;padding:0;overflow:clip}
.hc .nota-cab{display:flex;align-items:center;gap:11px;padding:14px 14px 8px 16px}
.hc .nota-cab .sp{flex:1}
.hc .nota textarea{display:block;width:100%;min-height:280px;border:0;resize:none;background:transparent;color:inherit;font:inherit;font-size:14.5px;line-height:1.7;padding:6px 18px 18px;overflow:hidden}
.hc .nota textarea:focus{outline:0}
.hc .nota:focus-within{border-color:var(--md-primary);box-shadow:0 0 0 1px var(--md-primary),var(--e1)}
.hc .impr{display:none}
.hc /* ---------- cabecera de impresión (solo papel) ---------- */
  .solo-papel{display:none}

.hc .top,.hc .btn,.hc .mini,.hc .acc,.hc .cab-sec .btn,.hc .guardado,.hc .nota-cab .btn,.hc .ep-del,.hc .hc-acciones,.hc .hc-hoja{display:none!important}

.hc .solo-papel b{color:#1d3f52;font-size:13pt}
.hc .solo-papel span{font-size:9pt;color:#555}

.hc .tiles{grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.hc .tile .v{font-size:14pt!important}

.hc .tile .v{font-size:16pt}
.hc .spark{display:none}
.hc .card,.hc .tile{box-shadow:none;border-radius:6px;break-inside:avoid;background:#fff}
.hc .notas{grid-template-columns:minmax(0,1fr)}
.hc .nota{overflow:visible}
.hc .nota textarea{display:none}
.hc .impr{display:block;white-space:pre-wrap;word-break:break-word;line-height:1.55;padding:2px 14px 14px}
.hc .fecha::-webkit-calendar-picker-indicator{display:none}
.hc .fecha{font-size:10pt}
.hc .campo{grid-template-columns:22mm 1fr}
.hc .campo dd{flex-wrap:wrap}
.hc .ep .fechas{grid-template-columns:1fr}
.hc .flecha{display:none}
.hc .fecha{padding:0;height:20px;width:100%}
.hc .fecha{border:0;padding:0;width:auto;background:none}
.hc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.hc .aviso-err{display:none;margin:0 0 16px;padding:10px 14px;border-radius:14px;background:var(--md-error-bg);color:var(--md-error);font-size:13px}
.hc .estado-carga{display:grid;place-items:center;min-height:50vh;color:var(--md-on-surface-low);text-align:center;gap:6px}
.hc .esq{background:linear-gradient(90deg,var(--md-surface-variant),var(--hc-s1),var(--md-surface-variant));background-size:200% 100%;animation:hc-esq 1.2s linear infinite;border-radius:12px}
@keyframes hc-esq{to{background-position:-200% 0}}
.hc .nota textarea:disabled{opacity:.7}

.hc .avatar.ok{--aro:var(--md-success)}
.hc .avatar.alta{--aro:var(--md-purple)}
.hc .avatar.warn{--aro:var(--md-warning)}
.hc .cabecera{gap:22px}
.hc .nota-cab{position:sticky;top:0;z-index:5;background:var(--md-surface);border-bottom:1px solid transparent;padding-bottom:10px}

.hc .asist-filas{display:grid;gap:5px;margin:2px 0 1px}
.hc .asist-fila{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--md-on-surface-med)}

/* animación de los botones de funciones: elevación al pasar el ratón, pulsación y aparición escalonada */
.hc .btn[data-acc],.hc .mini[data-acc]{transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .18s,color .18s}
.hc .btn[data-acc]:hover{transform:scale(1.08)}
.hc .mini[data-acc]:hover{transform:scale(1.12)}
.hc .btn[data-acc]:active,.hc .mini[data-acc]:active{transform:scale(.92);transition-duration:.06s}
.hc .hc-acciones .btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(32,33,36,.16)}
.hc .hc-acciones .btn:active{transform:translateY(0) scale(.96);box-shadow:none}
@keyframes hc-sube{from{opacity:0;transform:translateY(8px)}}
.hc .hc-acciones .btn{animation:hc-sube .34s var(--ease) backwards}
.hc .hc-acciones .btn:nth-child(1){animation-delay:.05s}
.hc .hc-acciones .btn:nth-child(2){animation-delay:.12s}

<script>
window.PanelHC = {
  _activo: null,
  /**
   * PanelHC.abrir(contenedor, { id, idPaciente, modo, urlPagina, volverUrl, alCargar })

    host.innerHTML = '';

    var $ = function (id) { return root.querySelector('#hc-' + id); };
  var D = null;                 // datos de la ficha
  var episodios = [], valoraciones = [], asistencia = null;
  var ANALG = ['Ninguno','Ocasional (< 1 vez/semana)','Semanal (1–2 veces/semana)','Habitual (casi todos los días)','Diario (1 vez al día)','Varios al día'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function analgCorto(v) { return v < 0 ? '—' : ANALG[v].split('(')[0].trim(); }
  function analgDetalle(v) { var m = v >= 0 && ANALG[v].match(/\((.*)\)/); return m ? m[1] : ''; }
  function parseISO(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmt(d) { return d ? ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear() : ''; }
  function fmtISO(s) { return fmt(parseISO(s)); }
  function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  function n1(x) { return (Math.round(x * 10) / 10).toLocaleString('es-ES'); }

  /* ---------- estado de guardado ---------- */
  var pendientes = 0, tmrG, errorGuardado = false;
  function guardando(on) {
    pendientes += on ? 1 : -1; if (pendientes < 0) pendientes = 0;
    var g = $('guardado'); if (!g) return;
    if (pendientes > 0) g.classList.remove('error');
    g.classList.toggle('ocupado', pendientes > 0); $('guardadoTxt').textContent = pendientes > 0 ? 'Guardando…' : 'Guardado';
  }
  function error(msg) { var e = $('avisoErr'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }
  function falloGuardado(msg) { errorGuardado = true; $('guardado').classList.remove('ocupado'); $('guardado').classList.add('error'); $('guardado').title = 'Clic para reintentar'; $('guardadoTxt').textContent = 'Sin guardar'; error(msg || 'No se pudo guardar. Tus cambios siguen en pantalla; copia el texto antes de recargar.'); }

  /* ---------- carga ---------- */

  function fallo(msg) {
    $('estadoCarga').innerHTML = '<div><p><b>No se pudo cargar la historia</b></p><p>' + esc(msg || '') + '</p></div>';
  }

  function pintar(r) {
    if (!r || !r.success) { fallo(r && r.message); return; }
    D = r; episodios = (r.episodios || []).map(function (e) { return { ingreso: e.ingreso, alta: e.alta, nota: e.nota }; }); baseEpi = firmaEpi(episodios); valoraciones = r.valoraciones || []; asistencia = r.asistencia;

    $('nombre').textContent = r.usuario.nombre;
    $('avatar').textContent = r.usuario.nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
    var av = '';
    $('contenido').insertAdjacentHTML('afterbegin', av);
    pintarMeta(); pintarCampos(); pintarEpisodios(); pintarTiles(); pintarNotas(); pintarAcciones();
    if (opts.alCargar) { try { opts.alCargar(r); } catch (e) { /* no crítico */ } }
  }

  function pintarUsuario() {   // cabecera y datos personales (tras editar al usuario)

    pintarMeta(); pintarCampos(); pintarAcciones();
  }
  function pintarMeta() {
    var est = D.usuario.estado, t = est.replace(/^[^\p{L}]+/u, '');
    var cls = /alta/i.test(t) ? 'alta' : /activ/i.test(t) ? 'ok' : '';
    $('avatar').className = 'avatar ' + (cls || '');
    $('meta').innerHTML = t ? '<span class="chip dot ' + cls + '">' + esc(t) + '</span>' : '';
  }
  var ICD = {
    dni: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6.5 16c.6-1.4 1.6-2 2.5-2s1.9.6 2.5 2M14 10h4M14 14h3"/>',
    nac: '<path d="M4 20h16M6 20v-6h12v6M12 14V9M12 9c-1 0-1.5-.8-1.5-1.5 0-1 1.5-2.5 1.5-2.5s1.5 1.5 1.5 2.5C13.5 8.2 13 9 12 9z"/>',
    tel: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
    ins: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M12 13v4M10 15h4"/>'
  };
  function campo(ic, titulo, v, extra) {
    if (!v) return '';
    return '<div class="campo" title="' + titulo + '"><dt><svg class="i" viewBox="0 0 24 24">' + ICD[ic] + '</svg></dt><dd>' + esc(v) + (extra || '') + '</dd></div>';
  }
  // Icono oficial de WhatsApp (el mismo de la Agenda y Usuarios).
  var SVG_WA = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 16 16" fill="currentColor">' +
        '<path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>';
  function acciones(tel, principal) {
    var d = Telefono.digitos(tel); if (!d) return '';   // regla única: ui/JS_Telefono.html (la página anfitriona debe incluirlo)
    var wa = Telefono.wa(tel);
    var llamar = '<a class="mini" href="tel:' + d + '" aria-label="Llamar"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg></a>';
    var chat = '';
    if (principal) {   // WhatsApp solo en el teléfono principal: es el que usa el diálogo con plantilla de la app
      chat = (!PAGINA && opts.acciones !== false && window.WhatsappDialogo && D.usuario.idPaciente)
        ? '<button type="button" class="mini wa" data-acc="whatsapp" aria-label="WhatsApp con plantilla de mensaje" title="WhatsApp (plantilla de mensaje)">' + SVG_WA + '</button>'

  function pintarCampos() {

    var h = campo('dni', 'DNI', u.dni) + campo('nac', 'Fecha de nacimiento', u.nacimiento, edad) +
      campo('tel', 'Teléfono', Telefono.formato(u.telefono), acciones(u.telefono, true)) + campo('tel', 'Teléfono 2', Telefono.formato(u.telefono2), acciones(u.telefono2, false)) +

  }

  /* ---------- episodios ---------- */
  var tmrEpi, tmrAviso, epiContando = false, epiArmado = false, epiEnVuelo = false, epiRepetir = false;
  var baseEpi = '';   // firma de los episodios tal como están guardados en la hoja (según esta ficha); el servidor la compara antes de escribir
  function firmaEpi(l) { return l.map(function (e) { return [e.ingreso || '', e.alta || '', e.nota || ''].join('|'); }).sort().join('\n'); }   // igual que hcFirmaEpisodios_ (historia/HC_Web.gs)
  function copiaEpi(l) { return (l || []).map(function (e) { return { ingreso: e.ingreso, alta: e.alta, nota: e.nota }; }); }
  // Aviso que se quita solo (los fallos de guardado, en cambio, se quedan hasta que se resuelven).
  function avisoTemporal(msg) { error(msg); clearTimeout(tmrAviso); tmrAviso = setTimeout(function () { var e = $('avisoErr'); if (e && e.textContent === msg) error(''); }, 6000); }
  // Un solo "Guardando…" por tanda de cambios, y un solo envío a la vez (si llega otro cambio mientras viaja uno, se envía justo después).
  function guardarEpisodios() {
    clearTimeout(tmrEpi); editado = true;
    if (!epiContando) { epiContando = true; guardando(true); }
    epiArmado = true; tmrEpi = setTimeout(enviarEpisodios, 500);
  }
  function terminarEpi() {
    epiEnVuelo = false;
    if (epiRepetir) { epiRepetir = false; enviarEpisodios(); return; }
    if (epiArmado) return;                       // hay otro cambio esperando su turno: se sigue contando
    epiContando = false; guardando(false);
  }
  function enviarEpisodios() {
    epiArmado = false;
    if (epiEnVuelo) { epiRepetir = true; return; }

    var lista = copiaEpi(episodios), firma = firmaEpi(lista);
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.success) { baseEpi = firma; error(''); sincronizarCache(); terminarEpi(); return; }
      if (r && r.conflicto) {                     // otra ventana cambió los episodios: se muestran los actuales y no se pisa nada
        clearTimeout(tmrEpi); epiArmado = false; epiRepetir = false;
        episodios = copiaEpi(r.episodios); D.episodios = copiaEpi(r.episodios); baseEpi = firmaEpi(episodios);
        pintarEpisodios(); pintarTiles(); sincronizarCache(); terminarEpi();
        avisoTemporal('Los episodios se habían cambiado desde otra ventana. Se han cargado los datos actuales; repite el cambio si hace falta.');
        return;
      }
      terminarEpi(); falloGuardado(r && r.message); if (window.HCCache) HCCache.invalidar(D.id);
    }).withFailureHandler(function (e) {
      terminarEpi(); falloGuardado(e && e.message); if (window.HCCache) HCCache.invalidar(D.id);
    }).guardarEpisodiosHCWeb(D.id, lista, baseEpi);
  }
  function pintarEpisodios() {
    var c = $('episodios'); c.innerHTML = '';

    subHost = document.createElement('div');                              // un contenedor nuevo cada vez: si se cierra mientras el panel carga, no se monta

  }
  // Cierra la hoja. Si el formulario tiene cambios sin guardar pregunta antes (salvo forzar === true). Devuelve una promesa con true si se cerró.

      sub = null; subTipo = ''; subCambio = false;

  });
