<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Citas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f0f2f5;
      --surface:      #ffffff;
      --surface-2:    #f7f9fb;
      --border:       #dce2ea;
      --border-focus: #475569;
      --text-1:       #0f1923;
      --text-2:       #4a5568;
      --text-3:       #94a3b8;
      --accent:       #475569;
      --accent-light: #f1f5f9;
      --accent-dark:  #334155;
      --success:      #059669;
      --success-light:#ecfdf5;
      --error:        #dc2626;
      --error-light:  #fef2f2;
      --morning:      #eef2f6;
      --morning-text: #475569;
      --afternoon:    #AFBBCA;
      --afternoon-text:#64748b;
      --selected-bg:  #334155;
      --selected-text:#ffffff;
      --radius:       8px;
      --radius-lg:    14px;
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      --shadow-focus: 0 0 0 3px rgba(71,85,105,.15);
      --font:         'DM Sans', sans-serif;
      --mono:         'DM Mono', monospace;
      --transition:   180ms ease;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      padding: 2.5rem 1.25rem 4rem;
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── Page header ── */
    .page-header {
      max-width: 900px;
      margin: 0 auto 1.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: fadeDown .5s ease both;
    }
    .logo-mark {
      width: 48px; height: 48px;
      background: #334155;
      border-radius: 12px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .logo-mark svg { color: #fff; }
    .page-header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -.02em;
      color: var(--text-1);
      line-height: 1.2;
    }
    .page-header p {
      font-size: .8125rem;
      color: var(--text-3);
      margin-top: .15rem;
    }
    .badge-date {
      margin-left: auto;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--text-3);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: .35rem .7rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      max-width: 900px;
      margin: 0 auto;
      overflow: visible;
      animation: fadeUp .5s .1s ease both;
    }

    .card-section {
      padding: 1.75rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .card-section:last-child { border-bottom: none; }

    .section-label {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 1.25rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-label .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── Grid ── */
    .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.125rem; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 1.125rem; }

    /* ── Fields ── */
    .field { display: flex; flex-direction: column; gap: .35rem; }

    label.field-label {
      font-size: .78rem;
      font-weight: 500;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: .375rem;
      letter-spacing: -.005em;
    }
    label.field-label svg { color: var(--text-3); flex-shrink: 0; }

    input[type="text"],
    textarea {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-2);
      color: var(--text-1);
      font-family: var(--font);
      font-size: .875rem;
      font-weight: 400;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      outline: none;
    }
    input[type="text"]:hover,
    textarea:hover { border-color: #b6c2d4; }
    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-focus);
      background: var(--surface);
    }
    input[type="text"]:disabled {
      background: var(--surface-2);
      color: var(--text-3);
      cursor: not-allowed;
      border-color: var(--border);
    }
    input::placeholder, textarea::placeholder { color: var(--text-3); font-size: .85rem; }
    textarea { resize: vertical; min-height: 60px; line-height: 1.55; }

    /* ── Autocomplete ── */
    .autocomplete-wrapper { position: relative; }
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      z-index: 50;
      background: var(--surface);
      border: 1.5px solid var(--border-focus);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      max-height: 200px;
      overflow-y: auto;
      animation: popIn .15s ease both;
    }
    .autocomplete-list:empty { display: none; }
    .autocomplete-list div {
      padding: .5rem .85rem;
      cursor: pointer;
      font-size: .84rem;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition), color var(--transition);
    }
    .autocomplete-list div:last-child { border-bottom: none; }
    .autocomplete-list div:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* ── Feedback ── */
    #feedback {
      display: none;
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: .84rem;
      font-weight: 500;
      margin-bottom: 1rem;
      animation: fadeUp .3s ease both;
    }
    #feedback.success { background: var(--success-light); color: var(--success); border: 1.5px solid #6ee7b7; }
    #feedback.error   { background: var(--error-light);   color: var(--error);   border: 1.5px solid #fca5a5; }

    /* ── Submit ── */
    .submit-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.25rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .72rem 1.75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      letter-spacing: -.01em;
      white-space: nowrap;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-dark);
      box-shadow: 0 4px 12px rgba(71,85,105,.3);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
    .btn-primary:disabled { background: var(--border); color: var(--text-3); cursor: not-allowed; transform: none; box-shadow: none; }

    .submit-hint {
      font-size: .75rem;
      color: var(--text-3);
      line-height: 1.4;
    }

    /* ── Loader ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }

    /* ── Calendar section ── */
    .week-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .nav-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text-2);
      cursor: pointer;
      font-size: 1rem;
      display: grid; place-items: center;
      transition: border-color var(--transition), background var(--transition), color var(--transition), transform var(--transition);
      font-family: var(--mono);
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { color: var(--text-3); cursor: not-allowed; background: var(--surface-2); }

    #currentWeekLabel {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-1);
      letter-spacing: -.02em;
      text-align: center;
      flex: 1;
    }

    /* ── Calendar grid ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: .75rem;
    }

    .day-column {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem .625rem;
      display: flex;
      flex-direction: column;
      gap: .375rem;
    }

    .day-label {
      text-align: center;
      margin-bottom: .5rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border);
    }
    .day-label .day-name {
      font-size: .78rem;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .day-label .day-date {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--text-3);
      margin-top: .1rem;
    }

    .hour-button {
      width: 100%;
      padding: .45rem .25rem;
      border: 1.5px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 500;
      text-align: center;
      transition: all var(--transition);
      line-height: 1;
    }

    .turno-manana {
      background: var(--morning);
      color: var(--morning-text);
      border-color: #d1d9e0;
    }
    .turno-tarde {
      background: var(--afternoon);
      color: var(--afternoon-text);
      border-color: #d1d9e0;
    }

    .hour-button:hover:not(.selected) {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
      filter: brightness(.95);
    }
    .hour-button.selected {
      background: var(--selected-bg) !important;
      color: var(--selected-text) !important;
      border-color: var(--accent-dark) !important;
      box-shadow: 0 3px 8px rgba(51,65,85,.35);
      transform: scale(1.03);
    }

    .slot-empty {
      font-size: .75rem;
      color: var(--text-3);
      text-align: center;
      padding: .5rem 0;
      font-style: italic;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      body { padding: 0 0 3rem; }
      .card { border-radius: 0; box-shadow: none; border-left: none; border-right: none; }
      .page-header { padding: 1.25rem 1rem .5rem; }
      .card-section { padding: 1.25rem 1rem; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
      .grid-3 > .field:first-child { grid-column: span 2; }
      .calendar-grid { grid-template-columns: repeat(3, 1fr); }
      .badge-date { display: none; }
    }
    @media (max-width: 450px) {
      .calendar-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Page header -->
  <header class="page-header">
    <div class="logo-mark">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <div>
      <h1>Agenda de Citas</h1>
      <p>Selecciona un paciente y un hueco disponible para la cita</p>
    </div>
    <div class="badge-date" id="badgeDate"></div>
  </header>

  <div class="card">

    <!-- Sección: Paciente -->
    <div class="card-section">
      <div class="section-label"><span class="dot"></span>Datos del Paciente</div>

      <div id="feedback"></div>

      <div class="grid-3">
        <div class="field">
          <label class="field-label" for="nombreUsuarioInput">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            Paciente
          </label>
          <div class="autocomplete-wrapper">
            <input type="text" id="nombreUsuarioInput" placeholder="Buscar paciente…" disabled autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-list"></div>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="telefonoUsuario">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
            Teléfono
          </label>
          <input type="text" id="telefonoUsuario" placeholder="—">
        </div>

        <div class="field">
          <label class="field-label" for="numSesion">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
            Sesión
          </label>
          <input type="text" id="numSesion" placeholder="Ej: 5 o N/A">
        </div>
      </div>

      <div class="field" style="margin-top:1rem;">
        <label class="field-label" for="notas">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
          Notas
        </label>
        <textarea id="notas" rows="2" placeholder="Información relevante para la cita…"></textarea>
      </div>

      <div class="submit-row">
        <button class="btn-primary" id="btnGuardar" onclick="enviarCita()" disabled>
          <svg id="btnIcon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          <span id="btnText">Registrar Citas Seleccionadas</span>
          <div id="loader" class="spinner"></div>
        </button>
        <p class="submit-hint">Pulsa <kbd style="font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);padding:.1rem .35rem;border-radius:4px;font-size:.7rem;">Esc</kbd> para limpiar la selección.</p>
      </div>
    </div>

    <!-- Sección: Agenda -->
    <div class="card-section">
      <div class="section-label"><span class="dot"></span>Agenda Semanal</div>

      <div class="week-nav">
        <button class="nav-btn" onclick="changeWeek(-1)" id="prevWeekBtn" disabled title="Semana anterior">‹</button>
        <div id="currentWeekLabel">Cargando agenda…</div>
        <button class="nav-btn" onclick="changeWeek(1)"  id="nextWeekBtn" disabled title="Semana siguiente">›</button>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>

      <!-- Leyenda -->
      <div style="display:flex;gap:1.25rem;margin-top:1.25rem;flex-wrap:wrap;">
        <span style="display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--text-3);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--morning);border:1px solid #d1d9e0;display:inline-block;"></span>Turno mañana
        </span>
        <span style="display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--text-3);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--afternoon);border:1px solid #d1d9e0;display:inline-block;"></span>Turno tarde
        </span>
        <span style="display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--text-3);">
          <span style="width:10px;height:10px;border-radius:3px;background:var(--selected-bg);display:inline-block;"></span>Seleccionado
        </span>
      </div>
    </div>

  </div><!-- /card -->

  <script>
    // ── DOM refs ──
    const calendarGrid       = document.getElementById('calendarGrid');
    const currentWeekLabel   = document.getElementById('currentWeekLabel');
    const btnGuardar         = document.getElementById('btnGuardar');
    const btnText            = document.getElementById('btnText');
    const btnIcon            = document.getElementById('btnIcon');
    const loader             = document.getElementById('loader');
    const feedback           = document.getElementById('feedback');
    const numSesionInput     = document.getElementById('numSesion');
    const notasTextarea      = document.getElementById('notas');
    const nombreUsuarioInput = document.getElementById('nombreUsuarioInput');
    const autocompleteList   = document.getElementById('autocomplete-list');
    const telefonoUsuarioInput = document.getElementById('telefonoUsuario');

    // ── State ──
    let semanasData      = [];
    let currentWeekIndex = 0;
    let selectedHuecos   = [];
    let currentUserName  = '';
    let currentUserPhone = '';
    let allPatientsList  = [];
    let allPatientsData  = {};

    const EXCLUDED_TIMES = ["08:00","08:30","13:30","16:00","19:30"];
    const DIA_ORDEN = { Lunes:1, Martes:2, 'Miércoles':3, Jueves:4, Viernes:5 };

    // ── Date badge ──
    document.getElementById('badgeDate').textContent =
      new Date().toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

    // ── Feedback ──
    function mostrarFeedback(message, isSuccess) {
      feedback.style.display = 'block';
      feedback.innerHTML = message;
      feedback.className = isSuccess ? 'success' : 'error';
      if (isSuccess) setTimeout(() => { feedback.style.display = 'none'; }, 5000);
    }

    // ── Loading state ──
    function toggleLoading(isLoading) {
      btnGuardar.disabled = isLoading;
      btnText.style.display   = isLoading ? 'none' : 'inline';
      btnIcon.style.display   = isLoading ? 'none' : 'inline';
      loader.style.display    = isLoading ? 'block' : 'none';
    }

    // ── Calendar helpers ──
    function sortDaysByDate(dias) {
      return Object.keys(dias).sort((a, b) => {
        const [da, ma, ya] = a.split('/');
        const [db, mb, yb] = b.split('/');
        return new Date(ya, ma-1, da) - new Date(yb, mb-1, db);
      });
    }

    function filterAndSortDays(diasData) {
      const sorted = sortDaysByDate(diasData);
      const map = {};
      sorted.forEach(key => {
        const d = diasData[key];
        const name = d.label.split(' ')[0].trim();
        if (DIA_ORDEN[name] && !map[name]) {
          d.huecos = d.huecos.filter(h => !EXCLUDED_TIMES.includes(h.hora));
          map[name] = d;
        }
      });
      return Object.values(map).sort((a,b) => DIA_ORDEN[a.label.split(' ')[0]] - DIA_ORDEN[b.label.split(' ')[0]]);
    }

    function getTurnoClass(hora) {
      const [h, m] = hora.split(':').map(Number);
      const t = h * 60 + m;
      if (t >= 480 && t <= 840) return 'turno-manana';
      if (t >= 850) return 'turno-tarde';
      return '';
    }

    // ── Render ──
    function renderWeek() {
      if (!semanasData.length) {
        calendarGrid.innerHTML = '<p style="color:var(--text-3);text-align:center;grid-column:1/-1;padding:1rem;">No hay semanas para mostrar.</p>';
        currentWeekLabel.textContent = 'Sin datos';
        return;
      }
      currentWeekIndex = Math.max(0, Math.min(currentWeekIndex, semanasData.length - 1));
      const week = semanasData[currentWeekIndex];
      if (week.error) { currentWeekLabel.textContent = 'Error'; calendarGrid.innerHTML = `<p style="color:var(--error)">${week.error}</p>`; return; }

      currentWeekLabel.textContent = week.label;
      calendarGrid.innerHTML = '';

      filterAndSortDays(week.dias).forEach(dayData => {
        const col = document.createElement('div');
        col.className = 'day-column';

        const [dayName, fullDate] = dayData.label.split(' ');
        const parts = fullDate.split('/');
        const shortDate = `${parts[0]}/${parts[1]}/${parts[2].slice(-2)}`;

        const lbl = document.createElement('div');
        lbl.className = 'day-label';
        lbl.innerHTML = `<div class="day-name">${dayName}</div><div class="day-date">${shortDate}</div>`;
        col.appendChild(lbl);

        if (!dayData.huecos.length) {
          const empty = document.createElement('p');
          empty.className = 'slot-empty';
          empty.textContent = 'Completo';
          col.appendChild(empty);
        } else {
          dayData.huecos.forEach(hueco => {
            const btn = document.createElement('button');
            btn.className = 'hour-button ' + getTurnoClass(hueco.hora);
            btn.textContent = hueco.hora;
            btn.setAttribute('data-value', hueco.value);
            btn.onclick = selectHueco;
            if (selectedHuecos.includes(hueco.value)) btn.classList.add('selected');
            col.appendChild(btn);
          });
        }
        calendarGrid.appendChild(col);
      });

      document.getElementById('prevWeekBtn').disabled = currentWeekIndex === 0;
      document.getElementById('nextWeekBtn').disabled = currentWeekIndex === semanasData.length - 1;
      updateSaveButtonState();
    }

    function changeWeek(delta) {
      const n = currentWeekIndex + delta;
      if (n >= 0 && n < semanasData.length) { currentWeekIndex = n; renderWeek(); }
    }

    function selectHueco(e) {
      e.target.classList.toggle('selected');
      selectedHuecos = Array.from(document.querySelectorAll('.hour-button.selected')).map(b => b.getAttribute('data-value'));
      updateSaveButtonState();
    }

    function deselectHueco() {
      if (!selectedHuecos.length) return;
      document.querySelectorAll('.hour-button.selected').forEach(b => b.classList.remove('selected'));
      selectedHuecos = [];
      updateSaveButtonState();
      mostrarFeedback('Selección cancelada.', false);
    }

    function updateSaveButtonState() {
      const valid = !!currentUserName && currentUserName !== 'NOT_FOUND' && currentUserName !== 'HEADER_ROW';
      btnGuardar.disabled = !selectedHuecos.length || !valid;
      const c = selectedHuecos.length;
      btnText.textContent = c > 1 ? `Registrar ${c} Citas` : c === 1 ? 'Registrar 1 Cita' : 'Registrar Citas Seleccionadas';
    }

    // ── Autocomplete ──
    function renderPatientSelect(names, defaultName) {
      allPatientsList = names;
      nombreUsuarioInput.disabled = false;
      if (defaultName && defaultName !== 'NOT_FOUND' && defaultName !== 'HEADER_ROW') {
        nombreUsuarioInput.value = defaultName;
        currentUserName = defaultName;
      }
      updateSaveButtonState();
    }

    nombreUsuarioInput.addEventListener('input', function () {
      const val = this.value.toLowerCase();
      autocompleteList.innerHTML = '';
      currentUserName = '';
      if (!val) return;
      allPatientsList.filter(n => n.toLowerCase().includes(val)).forEach(name => {
        const item = document.createElement('div');
        item.textContent = name;
        item.addEventListener('click', () => {
          nombreUsuarioInput.value = name;
          currentUserName = name;
          currentUserPhone = allPatientsData[name] || '';
          telefonoUsuarioInput.value = currentUserPhone;
          numSesionInput.value = '';
          notasTextarea.value = '';
          mostrarFeedback(`Paciente seleccionado: <strong>${name}</strong>`, true);
          autocompleteList.innerHTML = '';
          updateSaveButtonState();
        });
        autocompleteList.appendChild(item);
      });
    });

    document.addEventListener('click', e => {
      if (e.target !== nombreUsuarioInput) autocompleteList.innerHTML = '';
    });

    // ── Load ──
    function loadPatientData() {
      nombreUsuarioInput.value = '';
      nombreUsuarioInput.disabled = true;

      if (typeof google === 'undefined') return; // preview guard

      google.script.run
        .withSuccessHandler(data => {
          const name  = data.name  || 'NOT_FOUND';
          const phone = data.phone || '';
          allPatientsData = data.allPatientsData || {};
          renderPatientSelect(Object.keys(allPatientsData), name);
          if (name && name !== 'HEADER_ROW' && name !== 'NOT_FOUND') {
            currentUserName  = name;
            currentUserPhone = phone;
            telefonoUsuarioInput.value = phone;
            mostrarFeedback(`Cita para: <strong>${name}</strong>`, true);
          } else {
            currentUserName = '';
            const msg = name === 'HEADER_ROW' ? '🛑 ERROR: Fila de encabezado seleccionada.' : 'Elige un paciente de la lista.';
            mostrarFeedback(msg, false);
          }
          updateSaveButtonState();
        })
        .withFailureHandler(err => {
          nombreUsuarioInput.disabled = false;
          mostrarFeedback('Error al cargar pacientes: ' + err, false);
        })
        .obtenerNombreDeFilaActiva();
    }

    function loadInitialData() {
      loadPatientData();
      currentWeekLabel.textContent = 'Cargando agenda…';
      if (typeof google === 'undefined') return;

      toggleLoading(true);
      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          semanasData = res.semanas;
          if (semanasData && semanasData.length) { currentWeekIndex = res.index; renderWeek(); }
        })
        .withFailureHandler(err => {
          toggleLoading(false);
          mostrarFeedback('Error: ' + err, false);
        })
        .obtenerSemanasYHuecos();
    }

    function enviarCita() {
      if (!currentUserName) { mostrarFeedback('🛑 Selecciona un paciente válido.', false); return; }
      toggleLoading(true);
      if (typeof google === 'undefined') { toggleLoading(false); return; }

      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          mostrarFeedback(res.success ? `✅ ${res.message}` : `⚠️ ${res.message}`, res.success);
          if (res.success) { numSesionInput.value=''; notasTextarea.value=''; selectedHuecos=[]; }
          loadInitialData();
        })
        .withFailureHandler(err => {
          toggleLoading(false);
          mostrarFeedback('Error: ' + err, false);
        })
        .guardarCitasMultiples({
          nombreUsuario:  currentUserName,
          telefonoUsuario: telefonoUsuarioInput.value.trim(),
          huecosJson:     selectedHuecos,
          numSesion:      numSesionInput.value.trim(),
          notas:          notasTextarea.value.trim()
        });
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') deselectHueco(); });
    loadInitialData();
  </script>
</body>
</html>
