<!--
  ui/JS_Secciones.html - PUNTO DE ENLACE entre las secciones de una página y las piezas comunes (fase 2 de la sección 20 de
  CONTEXTO.md: Usuarios y Agenda en una sola página, principal/Principal_Vista). En las demás páginas hay una sola sección.

  Se incluye con include_('ui/JS_Secciones') con "!" (fuera de cualquier bloque de script), ANTES del script principal de
  la página. Lo usan Usuarios (usuarios/BaseDatos_Vista), la Agenda (agenda/Web_Vista), Valoraciones (valoraciones/Web_Vista),
  Estadísticas (dashboard/Web_Vista) y Configuración (configuracion/Web_Vista).

  Secciones:
    Secciones.registrar(nombre, opciones)   da de alta una sección. La primera que se registra queda activa.
      opciones: { mostrarAviso(texto), activar(), desactivar() } (todas opcionales)
    Secciones.activa()                      nombre de la sección activa (o null si no hay ninguna).
    Secciones.cambiar(nombre)               pasa a otra sección: desactivar() de la que sale, la esconde (guarda su scroll y sus
                                            clases de <body>), enseña la otra tal como estaba y llama a su activar().
    Secciones.iniciar({ inicial, paginas, titulos })   solo en la página con varias secciones, antes de sus bloques: pestañas
                                            que cambian de sección sin recargar y atrás/adelante entre secciones.
    Secciones.cuerpo(nombre).classList      add/remove/toggle/contains de las clases de <body> de esa sección (con-ficha,
                                            compacto…): la sección las usa en vez de document.body.classList.
  Cada sección vive en <div class="bloque-seccion" data-seccion="nombre"> (ui/CSS_Global: sin caja propia, display: contents) y <body> lleva la
  clase sec-<nombre> de la activa, a la que van anidados sus estilos.
  Los atajos de teclado y Esc de cada sección empiezan con «si Secciones.activa() no es la mía, nada».

  mostrarAviso(texto)   global: lo usan las piezas comunes (ui/JS_Ficha, valoraciones/Panel_Valoraciones, Configuración).
                        Va al mostrarAviso de la sección activa; sin sección (o si no tiene), al diálogo de ui/JS_Modal_Deshacer.
  SVG_WHATSAPP          icono de WhatsApp (botones de Usuarios y la Agenda, y la ficha de ui/JS_Ficha).
  avatarHtml(nombre, extra)   avatar con iniciales y color fijo por nombre (lo pinta ui/CSS_Global .avatar). `extra` = clase
                        de más (p. ej. 'grande'). Lo usan Usuarios, la Agenda, Valoraciones y ui/JS_Ficha.
  Tema                  tema automático / oscuro / claro, compartido por todas las pestañas (clave 'temaApp' de localStorage).
    Tema.conectar(boton)        el botón de la cabecera cambia de tema al pulsarlo; aplica el tema guardado.
    aplicarTema(t, guardar)     pone el tema t ('auto', 'oscuro' o 'claro') y pinta el icono en todos los botones conectados.
-->
<script>
var Secciones = (function() {
  var registro = {}, actual = null, clases = {}, scrolls = {}, conf = null;

  function registrar(nombre, opciones) {
    registro[nombre] = opciones || {};
    if (!actual) actual = nombre;
  }
  function activa() { return actual; }

  /** Clases de <body> de cada sección: solo están puestas mientras su sección es la activa. */
  function misClases(n) { return clases[n] || (clases[n] = {}); }
  function cuerpo(nombre) {
    var mias = misClases(nombre);
    function poner(c, si) {
      if (si) mias[c] = true; else delete mias[c];
      if (actual === nombre) document.body.classList.toggle(c, si);
    }
    return { classList: {
      add: function() { for (var i = 0; i < arguments.length; i++) poner(arguments[i], true); },
      remove: function() { for (var i = 0; i < arguments.length; i++) poner(arguments[i], false); },
      toggle: function(c, forzar) { var si = forzar === undefined ? !mias[c] : !!forzar; poner(c, si); return si; },
      contains: function(c) { return !!mias[c]; }
    } };
  }

  function contenedor(n) { return document.querySelector('.bloque-seccion[data-seccion="' + n + '"]'); }
  function guardarScroll(n) {
    var c = contenedor(n), lista = [];
    if (c) c.querySelectorAll('*').forEach(function(el) { if (el.scrollTop || el.scrollLeft) lista.push([el, el.scrollTop, el.scrollLeft]); });
    scrolls[n] = lista;
  }
  function reponerScroll(n) { (scrolls[n] || []).forEach(function(x) { x[0].scrollTop = x[1]; x[0].scrollLeft = x[2]; }); }

  // ----- Pestañas e historial (solo en la página con varias secciones: Secciones.iniciar) -----
  function seccionDe(pagina) {
    for (var n in conf.paginas) if (conf.paginas[n] === pagina) return n;
    return null;
  }
  function pestana(n) { return document.querySelector('nav.tabs-cambio a[data-pagina="' + conf.paginas[n] + '"]'); }
  function marcarPestanas() {
    Object.keys(conf.paginas).forEach(function(n) { var a = pestana(n); if (a) a.classList.toggle('activo', n === actual); });
    if (conf.titulos && conf.titulos[actual]) document.title = conf.titulos[actual];
  }
  function apuntarHistorial(n) {
    if (window.PWA) {   // app instalable: la dirección de cada sección es su archivo (usuarios.html, agenda.html)
      var a = pestana(n);
      try { history.pushState({ seccion: n }, '', a ? a.getAttribute('href') : location.href); } catch (err) { /* sin historial */ }
    } else if (window.google && google.script && google.script.history) {   // web: la dirección de arriba cambia a ?page=…
      google.script.history.push({ seccion: n }, { page: conf.paginas[n] });
    }
  }

  function cambiar(nombre, sinHistorial) {
    if (!registro[nombre] || nombre === actual) return;
    var sale = actual, oSale = registro[sale];
    if (oSale && typeof oSale.desactivar === 'function') oSale.desactivar();
    guardarScroll(sale);
    Object.keys(misClases(sale)).forEach(function(c) { document.body.classList.remove(c); });
    document.body.classList.remove('sec-' + sale);
    var cs = contenedor(sale);
    if (cs) cs.hidden = true;
    actual = nombre;
    document.body.classList.add('sec-' + nombre);
    Object.keys(misClases(nombre)).forEach(function(c) { document.body.classList.add(c); });
    var ce = contenedor(nombre);
    if (ce) ce.hidden = false;
    reponerScroll(nombre);
    if (conf) { marcarPestanas(); if (!sinHistorial) apuntarHistorial(nombre); }
    if (typeof registro[nombre].activar === 'function') registro[nombre].activar();
  }

  /**
   * Página con varias secciones (principal/Principal_Vista): se llama ANTES de los bloques de las secciones.
   *   opciones: { inicial: 'usuarios', paginas: { usuarios: 'baseDatos', agenda: 'agenda' }, titulos: { usuarios: 'Usuarios', … } }
   * Las pestañas de esas páginas cambian de sección sin recargar (con Ctrl o la rueda se siguen abriendo aparte), y atrás y
   * adelante del navegador vuelven a la sección anterior.
   */
  function iniciar(opciones) {
    conf = opciones;
    actual = opciones.inicial;
    document.addEventListener('click', function(e) {
      var a = e.target.closest ? e.target.closest('nav.tabs-cambio a[data-pagina]') : null;
      if (!a || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      var n = seccionDe(a.dataset.pagina);
      if (!n || !registro[n]) return;
      e.preventDefault();
      cambiar(n);
    });
    if (window.PWA) {
      try { history.replaceState({ seccion: actual }, ''); } catch (err) { /* sin historial */ }
      window.addEventListener('popstate', function(e) { if (e.state && e.state.seccion) cambiar(e.state.seccion, true); });
    } else if (window.google && google.script && google.script.history) {
      google.script.history.setChangeHandler(function(e) {
        var n = (e.state && e.state.seccion) || seccionDe((e.location && e.location.parameter && e.location.parameter.page) || conf.paginas[Object.keys(conf.paginas)[0]]);
        if (n) cambiar(n, true);
      });
    }
  }

  /** Opciones de la sección activa (uso interno de este archivo). */
  function opcionesActiva() { return actual ? registro[actual] : null; }

  return { registrar: registrar, activa: activa, cambiar: cambiar, iniciar: iniciar, cuerpo: cuerpo, opcionesActiva_: opcionesActiva };
})();

function mostrarAviso(mensaje) {
  var s = Secciones.opcionesActiva_();
  if (s && typeof s.mostrarAviso === 'function') return s.mostrarAviso(mensaje);
  return mostrarDialogo(mensaje, false);
}

var SVG_WHATSAPP = '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 16 16" fill="currentColor">' +
  '<path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>';

function avatarHtml(nombre, extra) {
  var n = (nombre || '').toString().trim();
  if (!n) return '';
  var p = n.split(/\s+/), ini = (p[0].charAt(0) + (p.length > 1 ? p[1].charAt(0) : p[0].charAt(1))).toUpperCase(), hue = 0, low = n.toLowerCase();
  for (var i = 0; i < low.length; i++) hue = (hue * 31 + low.charCodeAt(i)) % 360;
  var seguro = ini.replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  return '<span class="avatar' + (extra ? ' ' + extra : '') + '" style="--h:' + hue + '">' + seguro + '</span>';
}

var Tema = (function() {
  var TEMAS = ['auto', 'oscuro', 'claro'], ICONOS = { auto: 'contrast', oscuro: 'dark_mode', claro: 'light_mode' };
  var botones = [], actual = 'auto';

  function pintar(b) {
    b.textContent = '';
    var ic = document.createElement('span');
    ic.className = 'material-symbols-outlined';
    ic.textContent = ICONOS[actual];
    b.appendChild(ic);
    b.title = 'Tema: ' + actual + ' (clic para cambiar)';
    b.dataset.tema = actual;
  }
  function aplicar(t, guardar) {
    if (TEMAS.indexOf(t) === -1) t = 'auto';
    actual = t;
    if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);
    botones.forEach(pintar);
    if (guardar) { try { localStorage.setItem('temaApp', t); } catch (err) { /* sin almacenamiento */ } }
  }
  function guardado() {
    var t = 'auto';
    try { t = localStorage.getItem('temaApp') || 'auto'; } catch (err) { /* sin almacenamiento */ }
    return TEMAS.indexOf(t) === -1 ? 'auto' : t;
  }
  function conectar(boton) {
    if (!boton || botones.indexOf(boton) !== -1) return;
    botones.push(boton);
    boton.addEventListener('click', function() { aplicar(TEMAS[(TEMAS.indexOf(actual) + 1) % TEMAS.length], true); });
    aplicar(guardado(), false);
  }
  return { aplicar: aplicar, conectar: conectar };
})();
function aplicarTema(t, guardar) { Tema.aplicar(t, guardar); }
</script>
