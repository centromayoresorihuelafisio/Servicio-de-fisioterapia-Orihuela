      // agenda/JS_Agenda_Base.html - Agenda: carga de datos, filtros, asistencia, dibujo de la tabla y tarjetas de Hoy.
      // Se incluye dentro del unico <script> de agenda/Web_Vista, en este orden: JS_Agenda_Base, ui/JS_Modal_Deshacer, JS_Agenda_Edicion, JS_Agenda_Vistas, JS_Agenda_Resumen.
      // Sin scriptlets: include() no los evalua (la direccion de la app llega en URL_BASE_WEB, definida en la pagina).
      // Hora ("HH:mm") a partir de la cual una cita es "de tarde".
      var HORA_CORTE_TARDE = '14:00';

      var filasSeleccionadas = new Set();

      // Columnas de Sheets que no se muestran (normalizadas: sin mayúsculas ni acentos).
      var COLUMNAS_OCULTAS = ['fecha', 'dia', 'id evento calendar', 'historia clinica', 'telefono'];

      var HEADERS = [];
      var HEADERS_VISIBLES = [];
      var CITAS = [];
      var COL_HISTORIA = null;
      var semanaActual = null; // lunes de la semana mostrada, "yyyy-MM-dd"
      var mostrarHuecos = false;
      var OPCIONES_ASISTENCIA = [];
      var UMBRAL_ABSENTISMO = 3;       // lo manda el servidor (ABSENTISMO_UMBRAL, core/Config.gs)
      var vista = 'semana';            // 'semana' (tabla) | 'hoy' (tarjetas del día de hoy)
      var filtrosActivos = new Set();  // 'sinAsistencia' | 'sinHC' | 'conNotas'
      var filtroDiaSinAsis = null;     // fecha ISO si el filtro «sin asistencia» se limita a un solo día (chip del resumen del día)
      var RECORDATORIOS = [];            // recordatorios genéricos (agenda/Recordatorios.gs)
      var plegadoManual = {};          // fechaISO -> true/false: días plegados o desplegados a mano
      var DURACION_CITA_MIN = 30;      // para marcar "Ahora" y atenuar las citas ya terminadas

      // Color del chip según el texto de Asistencia. Se evalúa EN ORDEN y gana
      // la primera coincidencia: primero las negativas ("No asistió", "Falta"),
      // después "pendiente" (gris), después avisos (ámbar) y por último las
      // positivas (verde). Lo que no encaje sale en gris neutro.
      var ESTILOS_ASISTENCIA = [
        { clase: 'mal',    patron: /^no\b|^sin asist|falt|ausen|plant|no (vino|asist|acud|se present)/ },
        { clase: 'neutro', patron: /pendient|por confirmar|sin confirmar|sin registrar/ },
        { clase: 'aviso',  patron: /cancel|anul|aplaz|recuper|justific|retras/ },
        { clase: 'ok',     patron: /asist|vino|presente|realiz|acudi|^si$|^ok$/ }
      ];

      function estiloAsistencia(valor) {
        var v = normalizar(valor);
        if (!v) return '';
        for (var i = 0; i < ESTILOS_ASISTENCIA.length; i++) {
          if (ESTILOS_ASISTENCIA[i].patron.test(v)) return ESTILOS_ASISTENCIA[i].clase;
        }
        return 'neutro';
      }

      function htmlEsqueleto() {
        var nombres = [150, 190, 130, 170, 160];
        function barra(w, r) { return '<span class="md-esqueleto esq-barra" style="width:' + w + 'px' + (r ? ';border-radius:' + r : '') + '"></span>'; }
        function dia() { return '<div class="esq-dia2"><span class="md-esqueleto esq-barra esq-circ"></span><span class="esq-col">' + barra(80) + barra(54) + '</span><span class="esq-flex"></span>' + barra(190) + '</div>'; }
        function filas(n, o) {
          var h = '';
          for (var i = 0; i < n; i++) h += '<div class="esq-fila2">' + barra(46) + '<span class="md-esqueleto esq-barra esq-circ sm"></span>' + barra(nombres[(i + o) % nombres.length]) +
            '<span class="esq-flex"></span>' + barra(76, '999px') + barra(98, '999px') + '</div>';
          return h;
        }
        return '<div class="esqueleto" aria-busy="true" aria-label="Cargando agenda">' + dia() + '<div class="esq-turno"></div>' + filas(5, 0) +
          dia() + '<div class="esq-turno"></div>' + filas(4, 2) + '</div>';
      }

      // ---------- Carga de datos ----------
      // `silencioso`: refrescos en segundo plano (sin esqueleto y SIN mover el
      // scroll); se lanzan cuando algo ha cambiado (sondeo, escrituras, otras
      // ventanas), así que también vacían la memoria de las otras semanas.
      // Una carga no silenciosa (primera carga, Hoy, flechas, selector de
      // fecha) deja la vista centrada en el día de hoy si está en la semana.
      //
      // Memoria de semanas: la semana anterior y la siguiente se piden en
      // segundo plano en cuanto se ve una, y las ya vistas se recuerdan. Al
      // cambiar de semana se pinta al instante lo recordado y se pide otra vez
      // por detrás para ponerlo al día. La semana a la vista y sus vecinas se
      // guardan también para la próxima vez que se abra la Agenda en esta
      // pestaña del navegador (MemoriaPestanas, clave "semanasAgenda",
      // ui/JS_Carga_Compartida): al volver se pintan al momento, como al
      // cambiar de semana, y se ponen al día por detrás.
      var MEMORIA_SEMANAS = {};        // lunes "yyyy-MM-dd" -> respuesta del servidor
      var MEMORIA_SEMANAS_MAX = 8;     // semanas recordadas como mucho (se olvidan las más lejanas)
      var generacionMemoria = 0;       // sube al vaciar la memoria: una precarga lanzada antes ya no se guarda
      var turnoNavegacion = 0;         // sube con cada carga no silenciosa: una respuesta de una navegación superada no se pinta
      var navegacionPendiente = false; // hay una semana nueva pedida que aún no ha llegado
      var precargasEnCurso = {};
      (function() {
        var copia = MemoriaPestanas.leer('semanasAgenda');
        if (copia && copia.datos && typeof copia.datos === 'object') MEMORIA_SEMANAS = copia.datos;
      })();
      // Se guardan la semana de hoy (la que se abre primero), la que está a la vista y sus dos vecinas.
      function recordarSemanas() {
        MemoriaPestanas.guardarLuego('semanasAgenda', function() {
          if (!semanaActual) return null;
          var d = {};
          [lunesSemanaISO(hoyISO()), sumarDiasISO(semanaActual, -7), semanaActual, sumarDiasISO(semanaActual, 7)].forEach(function(k) { if (MEMORIA_SEMANAS[k]) d[k] = MEMORIA_SEMANAS[k]; });
          return { d: d, t: Date.now() };
        });
      }

      // Lunes de la semana de una fecha (el domingo cuenta en la semana que termina), igual que agendaSemanaDe_ en el servidor.
      function lunesSemanaISO(iso) {
        var p = iso.split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]), dow = d.getDay();
        return sumarDiasISO(iso, dow === 0 ? -6 : 1 - dow);
      }

      function cargar(fechaISO, silencioso) {
        var clave = lunesSemanaISO(fechaISO || hoyISO());
        if (silencioso) {
          vaciarMemoriaSemanas(clave);
          pedirSemana(clave, 'recargar');
          return;
        }
        var turno = ++turnoNavegacion;
        var guardada = MEMORIA_SEMANAS[clave];
        if (guardada) {
          navegacionPendiente = false;
          aplicarSemana(guardada);
          scrollAHoy();
          precargarVecinas();
          pedirSemana(clave, 'revalidar', turno);
          return;
        }
        navegacionPendiente = true;
        document.getElementById('tablaWrap').innerHTML = htmlEsqueleto();
        pedirSemana(clave, 'navegar', turno);
      }

      // modo: 'navegar' (semana nueva sin recordar), 'revalidar' (semana recordada ya pintada), 'recargar' (la semana a la vista
      // ha cambiado) o 'precargar' (vecina, solo se guarda). Navegar y revalidar alargan la sesión; la recarga y la precarga no:
      // las lanzan también el sondeo y los avisos de otras ventanas (17.3, punto 8).
      function pedirSemana(clave, modo, turno) {
        var gen = generacionMemoria;
        var alargaSesion = modo === 'navegar' || modo === 'revalidar';
        function alaVista() {
          if (modo === 'navegar') return turno === turnoNavegacion;
          if (modo === 'revalidar') return turno === turnoNavegacion && !document.querySelector('.editando');
          if (modo === 'recargar') return !navegacionPendiente && clave === semanaActual;
          return false;
        }
        function fallo(err) {
          if (modo === 'navegar' || modo === 'revalidar') OrdenCarga.principalLista();   // aun sin semana, las precargas no esperan más
          if (modo === 'precargar') { delete precargasEnCurso[clave]; return; }
          if (alaVista()) mostrarError(err);
        }
        (alargaSesion ? llamar('obtenerAgendaSemanaWeb', [clave]) : llamar('refrescarAgendaSemanaWeb', [clave]))
          .then(function(res) {
            if (modo === 'precargar') delete precargasEnCurso[clave];
            if (res.error) { fallo(res.error); return; }
            res.citas = res.citas || [];
            if (res.semana && gen === generacionMemoria) guardarSemana(res);
            if (modo === 'revalidar') OrdenCarga.principalLista();   // al abrir con la semana guardada, lo principal es ponerla al día
            if (!alaVista()) return;
            if (modo === 'navegar') navegacionPendiente = false;
            aplicarSemana(res);
            if (modo === 'navegar') scrollAHoy();
            precargarVecinas();
            if (modo === 'navegar') OrdenCarga.principalLista();   // la semana está pintada: ahora fichas, HC, valoraciones y formularios
          }, fallo);
      }

      function aplicarSemana(res) {
        HEADERS = res.headers || [];
        HEADERS_VISIBLES = HEADERS.filter(function(h) { return COLUMNAS_OCULTAS.indexOf(normalizar(h)) === -1; });
        CITAS = res.citas;   // el mismo objeto que la memoria: lo que se edita en línea queda también recordado
        OPCIONES_ASISTENCIA = res.opcionesAsistencia || [];
        if (res.umbralAbsentismo) UMBRAL_ABSENTISMO = res.umbralAbsentismo;
        COL_HISTORIA = HEADERS.find(function(h) { return h.toLowerCase().indexOf('historia') !== -1; });

        if (res.semana) {
          semanaActual = res.semana.lunes;
          document.getElementById('etiquetaSemana').textContent = res.semana.etiqueta;
          document.getElementById('inputSemana').value = res.semana.lunes;
        }
        render();
      }

      function guardarSemana(res) {
        MEMORIA_SEMANAS[res.semana.lunes] = res;
        recordarSemanas();
        var claves = Object.keys(MEMORIA_SEMANAS);
        if (claves.length <= MEMORIA_SEMANAS_MAX || !semanaActual) return;
        var ref = new Date(semanaActual).getTime();
        claves.sort(function(a, b) { return Math.abs(new Date(b).getTime() - ref) - Math.abs(new Date(a).getTime() - ref); });
        delete MEMORIA_SEMANAS[claves[0]];   // la más lejana de la que se ve
      }

      // Algo ha cambiado: se olvidan todas las semanas menos la que se va a recargar (sus vecinas se vuelven a pedir al llegar).
      function vaciarMemoriaSemanas(salvo) {
        generacionMemoria++;
        precargasEnCurso = {};
        Object.keys(MEMORIA_SEMANAS).forEach(function(k) { if (k !== salvo) delete MEMORIA_SEMANAS[k]; });
      }

      function precargarVecinas() {
        if (!semanaActual) return;
        [sumarDiasISO(semanaActual, -7), sumarDiasISO(semanaActual, 7)].forEach(function(k) {
          if (MEMORIA_SEMANAS[k] || precargasEnCurso[k]) return;
          precargasEnCurso[k] = true;
          pedirSemana(k, 'precargar');
        });
      }

      // Coloca la cabecera del día de hoy justo bajo el encabezado de columnas,
      // para no tener que hacer scroll hacia abajo un viernes. Si hoy no está
      // en la semana mostrada, vuelve arriba.
      function scrollAHoy() {
        var wrap = document.getElementById('tablaWrap');
        var filaHoy = wrap.querySelector('tr.fila-dia.hoy');
        if (!filaHoy) { wrap.scrollTop = 0; return; }
        var thead = wrap.querySelector('thead');
        var alto = thead ? thead.offsetHeight : 0;
        var destino = filaHoy.getBoundingClientRect().top - wrap.getBoundingClientRect().top - alto + wrap.scrollTop;
        wrap.scrollTop = Math.max(0, destino);
      }

      function mostrarError(err) {
        document.getElementById('tablaWrap').innerHTML =
          '<div class="estado-vacio"><span class="estado-icono-wrap error"><span class="material-symbols-outlined estado-icono">cloud_off</span></span>' +
          '<div class="estado-titulo">No se pudo cargar la agenda</div><div class="estado-texto">' + escapar(err && err.message ? err.message : err) + '</div>' +
          '<button title="Volver a cargar la agenda" type="button" class="md-btn md-btn--outline" data-vacio="reintentar"><span class="material-symbols-outlined">refresh</span>Reintentar</button></div>';
      }

      function normalizar(txt) {
        return (txt || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      }

      function esUrl(valor) { return typeof valor === 'string' && /^https?:\/\//i.test(valor.trim()); }

      // Escapado completo (& < > " '). Sirve tanto para texto como para
      // valores de atributo: antes solo se escapaba "<", y una comilla doble
      // en una nota cortaba el value="..." del campo de edición.
      function escapar(txt) {
        return (txt === null || txt === undefined ? '' : txt + '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      var CAMPOS_EDITABLES = ['Notas', 'Sesión'];

      // ---------- Utilidades de fecha/hora y estado ----------
      function vacioTxt(v) { return v === '' || v === null || v === undefined; }
      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function ahoraHHmm() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

      function finCita(hora) {
        var m = /^(\d{1,2}):(\d{2})$/.exec(hora || '');
        if (!m) return '';
        var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + DURACION_CITA_MIN;
        return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
      }

      // '' | 'pasada' (ya terminó) | 'en-curso'. Solo tiene sentido para citas de hoy.
      function estadoTemporal(hora, ahora) {
        var fin = finCita(hora);
        if (!fin) return '';
        if (fin <= ahora) return 'pasada';
        if (hora <= ahora) return 'en-curso';
        return '';
      }

      function filaProxima(hoy, ahora) {
        return CITAS.find(function(c) { return c._fechaISO === hoy && !c._hueco && (c['Hora'] || '') > ahora; }) || null;
      }

      function sumarDiasISO(iso, n) {
        var p = iso.split('-').map(Number);
        return formatoISO(new Date(p[0], p[1] - 1, p[2] + n));
      }

      function semanaContieneHoy() {
        if (!semanaActual) return false;
        var h = hoyISO();
        return h >= semanaActual && h <= sumarDiasISO(semanaActual, 6);
      }

      // Días pasados de la semana actual: plegados por defecto (en semanas
      // pasadas o futuras se muestra todo). Lo que el usuario pliega o
      // despliega a mano manda sobre el valor por defecto.
      var imprimiendo = false;   // al imprimir se despliegan todos los días
      function diaPlegado(fechaISO) {
        if (imprimiendo) return false;
        if (Object.prototype.hasOwnProperty.call(plegadoManual, fechaISO)) return plegadoManual[fechaISO];
        return semanaContieneHoy() && fechaISO < hoyISO();
      }

      function hayBusqueda() {
        return normalizar(document.getElementById('inputBusqueda').value) !== '' || filtrosActivos.size > 0;
      }

      function calcularTotalesDia() {
        var tot = {};
        CITAS.forEach(function(c) {
          var t = tot[c._fechaISO] || (tot[c._fechaISO] = { citas: 0, libres: 0, registradas: 0 });
          if (c._hueco) t.libres++;
          else { t.citas++; if (!vacioTxt(c['Asistencia'])) t.registradas++; }
        });
        return tot;
      }

      // ---------- Filtros rápidos ----------
      function cumpleFiltro(c, filtro) {
        if (c._hueco) return false;
        if (filtro === 'sinAsistencia') return c._fechaISO <= hoyISO() && vacioTxt(c['Asistencia']);
        if (filtro === 'sinHC') return !!COL_HISTORIA && vacioTxt(c[COL_HISTORIA]);
        if (filtro === 'conNotas') return !vacioTxt(c['Notas']);
        return true;
      }

      function pasaFiltrosRapidos(c) {
        if (filtroDiaSinAsis && c._fechaISO !== filtroDiaSinAsis) return false;
        var ok = true;
        filtrosActivos.forEach(function(f) { if (!cumpleFiltro(c, f)) ok = false; });
        return ok;
      }


      // ---------- Asistencia con un clic ----------
      // Cada botón busca en las opciones reales de tu desplegable la que
      // corresponde a su color (verde/rojo/ámbar), igual que los chips.
      function opcionAsistencia(clase) {
        var ops = OPCIONES_ASISTENCIA.filter(function(op) { return estiloAsistencia(op) === clase; });
        if (clase === 'aviso') {
          var just = ops.filter(function(op) { return /justific/.test(normalizar(op)); });
          if (just.length) return just[0];
        }
        if (clase === 'neutro') {
          // Lo no reconocido también cae en 'neutro': aquí solo vale una opción "Pendiente".
          var pend = ops.filter(function(op) { return /pendient/.test(normalizar(op)); });
          return pend[0] || '';
        }
        return ops[0] || '';
      }

      var ASIS_RAPIDA = [
        { clase: 'ok',     icono: 'check_circle' },
        { clase: 'mal',    icono: 'cancel' },
        { clase: 'aviso',  icono: 'event_busy' },
        { clase: 'neutro', icono: 'hourglass_empty' }
      ];

      // Los botones se muestran SIEMPRE; el estado actual queda resaltado y pulsarlo de nuevo lo quita.
      // Un valor que no encaja con ningún botón (texto libre antiguo) sale como chip pulsable para poder quitarlo.
      function htmlAsistenciaBotones(valor, conTexto) {
        var hay = !vacioTxt(valor), v = hay ? String(valor) : '', clsV = hay ? estiloAsistencia(v) : '', alguno = false, html = '';
        ASIS_RAPIDA.forEach(function(a) {
          var op = opcionAsistencia(a.clase);
          if (!op) return;
          var act = hay && (v === op || (a.clase !== 'neutro' && clsV === a.clase) || (a.clase === 'neutro' && /pendient/.test(normalizar(v))));
          if (act) alguno = true;
          html += '<button type="button" class="btn-asis ' + a.clase + (act ? ' activo' : '') + (conTexto ? ' btn-asis-lg' : '') +
            '" data-asis="' + escapar(op) + '" aria-pressed="' + act + '" title="' + escapar(act ? sinEmoji(v) + ' — clic para quitar' : sinEmoji(op)) +
            '"><span class="material-symbols-outlined">' + a.icono + '</span>' + (conTexto ? escapar(sinEmoji(op)) : (act ? '<span class="asis-txt">' + escapar(sinEmoji(v)) + '</span>' : '')) + '</button>';
        });
        if (hay && !alguno) html = '<button type="button" class="chip chip-' + clsV + '" data-asis="" title="' + escapar(sinEmoji(v) + ' — clic para quitar') + '">' + escapar(sinEmoji(v)) + '</button>' + html;
        return '<span class="asis-rapida">' + html + '</span>';
      }

      function guardarAsistencia(fila, valor) {
        var cita = CITAS.find(function(c) { return c._fila == fila; });
        if (!cita) return;
        var previo = cita['Asistencia'];
        cita['Asistencia'] = valor;            // respuesta inmediata; se revierte si el servidor falla
        render();
        function revertir(msg) { cita['Asistencia'] = previo; render(); mostrarAviso(msg); }
        llamar('actualizarCampoAgendaWeb', [fila, 'Asistencia', valor])
          .then(function(res) {
            if (!res || !res.success) { revertir((res && res.message) || 'No se pudo guardar el cambio.'); return; }
            // Tabla nueva: "quitar" = Pendiente y Pendiente se muestra vacío, igual que al recargar la semana.
            var cambio = false;
            if (res.asistencia !== undefined && res.asistencia !== cita['Asistencia']) { cita['Asistencia'] = res.asistencia; cambio = true; }
            // Faltas del usuario tras el cambio: pone o quita el aviso de absentismo en todas sus citas de la semana.
            if (res.idPaciente && res.faltas !== undefined) CITAS.forEach(function(c) {
              if (c._idPaciente === res.idPaciente && (c._faltas || 0) !== res.faltas) { c._faltas = res.faltas; cambio = true; }
            });
            if (cambio) render();
          }, function(err) { revertir('Error al guardar: ' + err); });
      }

      function badgeSesion(v, etiqueta) {
        var t = (v + '').trim();
        if (!/^\d+$/.test(t)) return escapar(v);
        return '<span class="badge-sesion ' + (t === '1' ? 's1' : 'sn') + (etiqueta ? ' etq' : '') + '" title="' + (t === '1' ? 'Primera sesión' : 'Sesión ' + t) + '">' + (etiqueta ? 'Sesión ' : '') + t + '</span>';
      }

      // Aviso de absentismo: etiqueta roja junto al nombre con ABSENTISMO_UMBRAL o más faltas «No asistido» desde el último ingreso.
      function badgeFaltas(c) {
        var n = c && c._faltas;
        if (!n || n < UMBRAL_ABSENTISMO) return '';
        return '<span class="badge-faltas" title="Aviso de absentismo: ' + n + ' faltas sin justificar desde el último ingreso">' +
          '<span class="material-symbols-outlined">event_busy</span>' + n + '<span class="bf-txt"> faltas</span></span>';
      }

      // Sesión con − / +. Solo si es un número (vacío o texto libre se quedan como estaban). Mínimo 1.
      function htmlSesion(valor, fila) {
        var t = (valor + '').trim();
        if (!/^\d+$/.test(t)) return badgeSesion(valor, true);
        var n = parseInt(t, 10);
        return '<span class="ses-ctl" data-fila="' + fila + '"><span class="ses-vista">' + badgeSesion(valor, true) + '</span>' +
          '<span class="ses-paso"><button type="button" class="btn-ses" data-ses="-1"' + (n <= 1 ? ' disabled' : '') + ' title="Restar una sesión"><span class="material-symbols-outlined">remove</span></button>' +
          '<span class="ses-num">' + n + '</span>' +
          '<button type="button" class="btn-ses" data-ses="1" title="Sumar una sesión"><span class="material-symbols-outlined">add</span></button></span></span>';
      }

      // El número cambia al instante en pantalla; se guarda UNA sola vez cuando se deja de pulsar (0,5 s), aunque se hayan dado varios clics.
      // Si el servidor falla, vuelve al valor con el que se empezó.
      var sesionesPendientes = {};   // fila → { timer, previo, valor }
      function cambiarSesion(fila, delta) {
        var cita = CITAS.find(function(c) { return c._fila == fila; });
        if (!cita) return;
        var actual = parseInt(String(cita['Sesión']).trim(), 10);
        if (isNaN(actual)) return;
        var nuevo = Math.max(1, actual + delta);
        if (nuevo === actual) return;
        var p = sesionesPendientes[fila];
        if (!p) p = sesionesPendientes[fila] = { previo: cita['Sesión'] };   // valor con el que empezó la tanda de clics
        p.valor = nuevo;
        cita['Sesión'] = nuevo;
        render();
        clearTimeout(p.timer);
