    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      button, input, select { font-family: inherit; line-height: inherit; }

  <body>
    <?!= incluirAcceso_('agenda'); ?>

    <header class="top" id="cabecera">

      <!-- Barra principal (cabecera comun, ui/CSS_Global .cabecera-fila): titulo · buscador · semana y vista · espacio · herramientas · tema · menu -->
      <div class="barra barra-principal cabecera-fila">
        <h1 class="cabecera-titulo"><span class="material-symbols-outlined">calendar_month</span> Agenda</h1>
        <div class="buscador">
          <span class="material-symbols-outlined">search</span>
          <input type="text" id="inputBusqueda" placeholder="Buscar…  ( / )" title="Buscar por usuario, sesión o notas">
        </div>
        <div class="grupo-nav">
          <button class="btn-toolbar btn-nav" id="btnSemanaAnterior" title="Semana anterior (←)">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <button class="btn-toolbar" id="btnHoy" title="Ir a hoy (T)">
            <span class="material-symbols-outlined">today</span> Hoy
          </button>
          <button class="btn-toolbar btn-nav" id="btnSemanaSiguiente" title="Semana siguiente (→)">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
        <span class="etiqueta-semana" id="etiquetaSemana"></span>
        <div class="selector-semana">
          <span class="material-symbols-outlined">calendar_month</span>
          <input type="date" id="inputSemana" title="Ir a la semana que contiene esta fecha">
        </div>
        <div class="segmentado" role="group" aria-label="Vista">
          <button type="button" class="seg activo" id="btnVistaSemana" title="Tabla de la semana">Semana</button>
          <button type="button" class="seg" id="btnVistaHoy" title="Tarjetas con las citas de hoy">Hoy</button>
          <button type="button" class="seg" id="btnVistaCal" title="Cuadrícula semanal tipo calendario">Cuadrícula</button>
        </div>
        <span class="cabecera-espacio"></span>
        <button class="btn-toolbar deshacer" id="btnDeshacer" title="Deshacer la última eliminación">
          <span class="material-symbols-outlined">undo</span> Deshacer
        </button>
        <button type="button" class="btn-toolbar btn-nav" id="btnHuecos" title="Mostrar huecos libres" aria-label="Huecos libres">
          <span class="material-symbols-outlined">event_available</span>
        </button>
        <button type="button" class="btn-toolbar btn-nav" id="btnDensidad" title="Densidad de filas" aria-label="Densidad de filas">
          <span class="material-symbols-outlined">density_medium</span>
        </button>
        <button type="button" class="btn-toolbar btn-nav" id="btnResumen" title="Ocultar panel de resumen" aria-label="Panel de resumen">
          <span class="material-symbols-outlined">view_sidebar</span>
        </button>
        <button class="btn-toolbar btn-nav btn-rec" id="btnRecordatorios" title="Recordatorios (R)" aria-label="Recordatorios">
          <span class="material-symbols-outlined">checklist</span><span class="badge-rec" id="badgeRec"></span>
        </button>
        <button type="button" class="btn-toolbar btn-nav" id="btnAtajos" title="Ver los atajos de teclado" aria-label="Atajos de teclado"><span class="material-symbols-outlined">keyboard</span></button>
        <button type="button" class="btn-toolbar btn-nav" id="btnTema" title="Cambiar tema"></button>
        <div class="menu-wrap" id="menuMasWrap">
          <button class="btn-toolbar btn-nav" id="btnMenuMas" aria-haspopup="true" aria-expanded="false" title="Más opciones">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
          <div class="menu menu-der" role="menu">
            <button class="menu-item" id="btnCopiarSemana" role="menuitem" title="Copia miércoles y jueves (doble sesión) y viernes (simple) a la semana siguiente, sin necesidad de seleccionar nada">
              <span class="material-symbols-outlined">event_repeat</span>
              <span>Copiar semana<small>Mié/jue ×2 y vie → semana siguiente</small></span>
            </button>
            <button class="menu-item" id="btnDisponibilidad" role="menuitem" title="Abre o cierra huecos de la agenda: horario del servicio, vacaciones, imprevistos">
              <span class="material-symbols-outlined">event_busy</span>
              <span>Disponibilidad<small>Abrir o cerrar huecos de la agenda</small></span>
            </button>
            <button title="Imprimir la jornada o la semana" class="menu-item" id="btnImprimir" role="menuitem"><span class="material-symbols-outlined">print</span><span>Imprimir<small>Jornada o semana, con todos los días</small></span></button>
          </div>
        </div>
      </div>

      <!-- Barra contextual: sustituye a la principal con citas seleccionadas -->
      <div class="barra barra-seleccion" id="barraSeleccion">
        <button class="btn-toolbar plano btn-nav" id="btnQuitarSeleccion" title="Quitar selección">
          <span class="material-symbols-outlined">close</span>
        </button>
        <span class="contador-seleccion" id="contadorSeleccion"></span>

        <span class="separador"></span>

        <button title="Nueva valoración del usuario seleccionado" class="btn-toolbar plano" id="btnValoracion" disabled>
          <span class="material-symbols-outlined">assignment</span> Valoración
        </button>
        <button title="Abrir WhatsApp con el usuario seleccionado (si hay varios, uno a uno)" class="btn-toolbar plano" id="btnWhatsapp" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
          </svg> WhatsApp
        </button>

        <span class="separador"></span>

        <div class="menu-wrap" id="menuCopiarWrap">
          <button title="Copiar las citas seleccionadas" class="btn-toolbar plano" id="btnMenuCopiar" disabled aria-haspopup="true" aria-expanded="false">
            <span class="material-symbols-outlined">content_copy</span> Copiar
            <span class="material-symbols-outlined">arrow_drop_down</span>
          </button>
          <div class="menu" role="menu">
            <button class="menu-item" id="btnCopiarCita" disabled role="menuitem" title="Copia la(s) cita(s) seleccionada(s) al siguiente día alterno (L/M→+2, M/J→+5, V→+7)">
              <span class="material-symbols-outlined">content_copy</span>
              <span>Siguiente cita<small>Al siguiente día alterno</small></span>
            </button>
            <button class="menu-item" id="btnCopiarCita2" disabled role="menuitem" title="Copia la(s) cita(s) seleccionada(s) a las dos siguientes fechas alternas (usuarios de doble sesión semanal)">
              <span class="material-symbols-outlined">library_add</span>
              <span>Siguientes 2 citas<small>Doble sesión semanal</small></span>
            </button>
          </div>
        </div>

        <span class="espaciador"></span>

        <button class="btn-toolbar peligro" id="btnEliminarCitas" disabled title="Libera la(s) cita(s) seleccionada(s) (borra usuario, teléfono, sesión, asistencia, notas e historia clínica)">
          <span class="material-symbols-outlined">delete</span> Eliminar
        </button>
      </div>

          </header>
    <div class="solo-impresion" id="cabImpresion"></div>

    <div class="cuerpo" id="cuerpo">
      <div class="tabla-wrap" id="tablaWrap"></div>
      <aside class="resumen" id="resumen" aria-label="Resumen de la jornada"></aside>
    </div>
    <aside class="ficha" id="ficha" aria-hidden="true"></aside>

      <span id="toastMoverTexto"></span>
      <button title="Deshacer el último movimiento" type="button" id="toastMoverBtn">DESHACER</button>
