      // agenda/JS_Agenda_Resumen.html - Agenda: recordatorios, ficha de usuario, estado del usuario, panel de resumen y arranque de la pagina.
      // Se incluye dentro del unico <script> de principal/Principal_Vista, tras ui/JS_Modal_Deshacer y dentro del bloque de la sección
      // ((function() { … })(), fase 2 de la sección 20 de CONTEXTO.md), en este orden: JS_Agenda_Base, JS_Agenda_Edicion, JS_Agenda_Vistas, JS_Agenda_Resumen.
      // Sin scriptlets: include() no los evalua (la direccion de la app llega en URL_BASE_WEB, definida en la pagina).
      // ---------- Recordatorios (agenda/Recordatorios.gs + agenda/Panel_Recordatorios) ----------
      var REC_ICONOS = { 'Llamar': ['call', 'llamar'], 'Reunión': ['groups', 'reunion'], 'Evento': ['event', 'evento'], 'Nota': ['sticky_note_2', 'nota'], 'Festivo': ['flag', 'festivo'] };

      function recPendientesDia(iso) {
        return RECORDATORIOS.filter(function(r) { return !r.hecho && r.fecha === iso && r.tipo !== 'Festivo'; })
          .sort(function(a, b) { return a.hora < b.hora ? -1 : (a.hora > b.hora ? 1 : 0); });
      }
      // Festivos: marcan el día (no son tareas): nunca cuentan como pendientes ni atrasados.
      function festivosDia(iso) { return RECORDATORIOS.filter(function(r) { return r.tipo === 'Festivo' && r.fecha === iso; }); }
      function nombreFestivo(r) {
        var t = String(r.texto || '');
        return t.replace(/^\s*\[\s*festivo\s*\]\s*[:\-–]?\s*/i, '').trim() || t;
      }
      function htmlFestivoDia(iso) {
        return festivosDia(iso).map(function(r) {
          return '<button type="button" class="rc-festivo" data-rec-id="' + escapar(r.id) + '" title="' + escapar('Festivo — ' + nombreFestivo(r)) + '"><span class="material-symbols-outlined">flag</span>' + escapar(nombreFestivo(r)) + '</button>';
        }).join('');
      }
      function recInfo(tipo) { return REC_ICONOS[tipo] || REC_ICONOS.Nota; }
      // Marcas de un día para los calendarios: festivo (número en rojo) y puntos de color por evento o reunión.
      function marcasDia(iso) {
        var fest = festivosDia(iso), tipos = [], textos = fest.map(function(r) { return 'Festivo: ' + nombreFestivo(r); });
        RECORDATORIOS.forEach(function(r) {
          if (r.fecha !== iso || (r.tipo !== 'Evento' && r.tipo !== 'Reunión')) return;
          var k = recInfo(r.tipo)[1];
          if (tipos.indexOf(k) === -1) tipos.push(k);
          textos.push(r.tipo + (r.hora ? ' ' + r.hora : '') + ': ' + r.texto);
        });
        return { festivo: fest.length > 0, tipos: tipos, texto: textos.join(' · ') };
      }
      function recTitulo(r) { return r.tipo + (r.hora ? ' · ' + r.hora : '') + ' — ' + r.texto; }

      // Etiquetas de color en la banda del día (tabla y vista Hoy) + botón "+" para añadir uno a ese día.
      function htmlRecDia(iso) {
        var lista = recPendientesDia(iso), MAX = 4;
        var chips = lista.slice(0, MAX).map(function(r) {
          var t = recInfo(r.tipo);
          return '<button type="button" class="rc-chip rc-t-' + t[1] + '" data-rec-id="' + escapar(r.id) + '" title="' + escapar(recTitulo(r)) + '">' +
            '<span class="material-symbols-outlined">' + t[0] + '</span><span class="rc-chip-txt">' + (r.hora ? escapar(r.hora) + ' ' : '') + escapar(r.texto) + '</span></button>';
        }).join('');
        if (lista.length > MAX) chips += '<button type="button" class="rc-chip rc-t-nota" data-rec-nuevo="' + iso + '" title="Ver todos los recordatorios">+' + (lista.length - MAX) + '</button>';
        return (chips ? '<span class="rc-chips">' + chips + '</span>' : '') +
          '<button type="button" class="btn-fila rc-add" data-rec-nuevo="' + iso + '" title="Añadir recordatorio a este día"><span class="material-symbols-outlined">add_alert</span></button>';
      }

      // Cuadrícula: un punto de color por recordatorio en la cabecera del día.
      function htmlRecPuntos(iso) {
        var puntos = recPendientesDia(iso).slice(0, 5).map(function(r) {
          return '<button type="button" class="rc-punto rc-t-' + recInfo(r.tipo)[1] + '" data-rec-id="' + escapar(r.id) + '" title="' + escapar(recTitulo(r)) + '"></button>';
        }).join('');
        return '<span class="rc-puntos">' + puntos + '<button type="button" class="btn-fila rc-add" data-rec-nuevo="' + iso + '" title="Añadir recordatorio a este día"><span class="material-symbols-outlined">add_alert</span></button></span>';
      }

      // Insignia del botón: pendientes de hoy y atrasados (rojo si hay atrasados).
      function actualizarBotonRec() {
        var h = hoyISO();
        var urgentes = RECORDATORIOS.filter(function(r) { return !r.hecho && r.tipo !== 'Festivo' && r.fecha && r.fecha <= h; });
        var badge = document.getElementById('badgeRec');
        badge.textContent = urgentes.length || '';
        badge.classList.toggle('atrasado', urgentes.some(function(r) { return r.fecha < h; }));
        document.getElementById('btnRecordatorios').classList.toggle('activo', panelAbierto && panelClave === 'recordatorios');
      }

      function refrescarRecordatorios() {
        actualizarBotonRec();
        renderResumen();
        if (!document.querySelector('.editando') && !arrastre && CITAS.length) render();
      }

      function cargarRecordatorios() {
        llamar('obtenerRecordatoriosWeb')
          .then(function(res) {
            if (!res || !res.success) return;
            RECORDATORIOS = res.recordatorios || [];
            if (panelAbierto && panelClave === 'recordatorios' && controladorPanel && controladorPanel.actualizar) controladorPanel.actualizar(RECORDATORIOS);
            refrescarRecordatorios();
          }, function() { /* no crítico */ });
      }

      // Sin argumentos alterna el panel; { fecha } abre el formulario para ese día; { editarId } edita uno.
      async function abrirRecordatorios(o) {
        o = o || {};
        if (panelAbierto && panelClave === 'recordatorios' && controladorPanel) {
          if (o.editarId === undefined && o.fecha === undefined) { cerrarPanel(); return; }
          if (panelHaCambiado() && !(await mostrarConfirm('Hay cambios sin guardar en el formulario. ¿Quieres descartarlos?'))) return;
          if (o.editarId) controladorPanel.editar(o.editarId); else controladorPanel.nuevo(o.fecha);
          return;
        }
        return abrirPanelLateral('recordatorios', 'Recordatorios', false, function(cont) {
          return PanelRecordatorios.abrir(cont, {
            lista: RECORDATORIOS,
            hoy: hoyISO,
            nuevoFecha: o.fecha,
            editarId: o.editarId,
            confirmar: mostrarConfirm,
            onActualizado: function(l) { RECORDATORIOS = l; refrescarRecordatorios(); },
            onCancelar: function() { cerrarPanel(); }
          });
        });
      }
      document.getElementById('btnRecordatorios').addEventListener('click', function() { abrirRecordatorios(); });

      // ---------- Ficha de usuario (panel lateral) ----------
      // Cabecera, secciones y etiquetas: ui/JS_Ficha (FichaUsuario), el mismo componente que la ficha de Usuarios.
      // Aquí solo está lo propio de la Agenda: cargar las fichas en memoria, qué acciones se ofrecen y qué hacen.

      // Fichas en memoria: se cargan TODAS de una vez en segundo plano (cargarFichas) y el panel se abre desde
      // aquí, sin llamar al servidor. Se refrescan solas (ver más abajo), así que no hace falta caché por nombre.
      // Se guardan también para la próxima vez que se abra la Agenda en esta pestaña del navegador (MemoriaPestanas,
      // clave "fichasAgenda", ui/JS_Carga_Compartida): se usan al momento y cargarFichas las pone al día por detrás.
      var FICHAS = { t: 0, headers: [], porNombre: null, usuarios: null, cargando: false };
      var fichaAbierta = null;   // { clave, nombre, caja, html } de la ficha que está en el panel lateral

      // Misma normalización que normalizarNombreFicha_ (agenda/Ficha_Usuario.gs): mayúsculas, sin tildes, espacios simples.
      function claveFicha(n) {
        return String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
      }
      function fichaDeMemoria(nombre) {
        var p = FICHAS.porNombre && FICHAS.porNombre[claveFicha(nombre)];
        return p ? { success: true, headers: FICHAS.headers, paciente: p } : null;
      }
      function htmlFichaUsuario(res, nombre) {
        var hs = res.headers || [];
        return FichaUsuario.html(res.paciente, hs, {
          nombre: nombre,
          // «Valoración» (formulario) si el usuario no tiene ninguna; «Valoraciones» (su panel) si ya tiene
          acciones: ['whatsapp', 'hc', 'cita', ValoracionesCache.accion(res.paciente['ID paciente'])],
          // "Otros datos" no repite la columna de prioridad (la primera) ni la Historia clínica, igual que Usuarios
          excluir: [hs[0]].concat(hs.filter(function(h) { return String(h).toLowerCase().indexOf('historia') !== -1; })),
          editable: true   // lápiz en teléfonos y observaciones
        });
      }
      // Al terminar la precarga de valoraciones (o cambiar), el botón de la ficha abierta puede pasar de «Valoración» a «Valoraciones».
      ValoracionesCache.alCambiar(function() { repintarFichaAbierta(); });
      function repintarFichaAbierta() {
        if (!fichaAbierta || !panelAbierto || panelClave !== fichaAbierta.clave) return;
        var res = fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var html = htmlFichaUsuario(res, fichaAbierta.nombre);
        if (html === fichaAbierta.html) return;            // sin cambios: no se toca el DOM
        fichaAbierta.html = html;
        FichaUsuario.pintar(fichaAbierta.caja, html);
      }
      // Carga (o recarga) todas las fichas. Si falla, se conserva lo que ya hubiera en memoria.
      // Sin lista de columnas: la ficha muestra también "Otros datos", así que se piden todas.
      function cargarFichas() {
        if (FICHAS.cargando) return;
        FICHAS.cargando = true;
        llamar('obtenerFichasUsuariosWeb')
          .then(function(res) {
            FICHAS.cargando = false;
            if (!res || !res.success) return;
            FICHAS.headers = res.headers || [];
            FICHAS.porNombre = res.fichas || {};
            FICHAS.usuarios = res.usuarios || null;
            FICHAS.t = Date.now();
            recordarFichas();
            // La lista del selector de huecos sale de las mismas fichas (no se lee la Maestra otra vez) e incluye a los homónimos.
            if (res.usuarios) { var primera = !USUARIOS_HUECO; USUARIOS_HUECO = SelectorUsuario.preparar(res.usuarios); if (primera) SelectorUsuario.refrescar(); }
            repintarFichaAbierta();                         // si la ficha abierta cambió en la hoja, se actualiza al momento
          }, function() {
            FICHAS.cargando = false;   // no crítico: se reintenta en el próximo ciclo
          });
      }
      function recordarFichas() {
        MemoriaPestanas.guardarLuego('fichasAgenda', function() {
          return FICHAS.porNombre ? { d: { headers: FICHAS.headers, fichas: FICHAS.porNombre, usuarios: FICHAS.usuarios }, t: FICHAS.t } : null;
        });
      }
      // Si otra pantalla cambió un usuario después de guardarlas, no se usan: se espera a cargarFichas, como siempre.
      (function() {
        var copia = MemoriaPestanas.leer('fichasAgenda');
        if (!copia || copia.despues('pacienteActualizado') || !copia.datos || !copia.datos.fichas) return;
        FICHAS.headers = copia.datos.headers || [];
        FICHAS.porNombre = copia.datos.fichas;
        FICHAS.usuarios = copia.datos.usuarios || null;
        FICHAS.t = copia.t;
        if (FICHAS.usuarios) USUARIOS_HUECO = SelectorUsuario.preparar(FICHAS.usuarios);
      })();

      // ---------- Estado del usuario desde la ficha (chip pulsable, como en Usuarios) ----------
      function menuEstadoFicha(ancla) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var hEst = FichaUsuario.cabecera(res.headers, 'Estado') || 'Estado';
        var actual = FichaUsuario.norm(res.paciente[hEst]);
        var existentes = Object.keys(FICHAS.porNombre).map(function(k) { return FICHAS.porNombre[k][hEst]; });
        FichaUsuario.menuEstado(ancla, FichaUsuario.estadosDisponibles(existentes).map(function(e) {
          return { punto: FichaUsuario.claseEstado(e), texto: FichaUsuario.textoEstado(e), marcado: FichaUsuario.norm(e) === actual, fn: function() { cambiarEstadoFicha(e); } };
        }));
      }
      function cambiarEstadoFicha(valor) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var p = res.paciente, hEst = FichaUsuario.cabecera(res.headers, 'Estado') || 'Estado', antes = p[hEst];
        if (FichaUsuario.norm(antes) === FichaUsuario.norm(valor)) return;
        if (FichaUsuario.claseEstado(valor) === 'alta') { altaDesdeFicha(fichaAbierta.nombre); return; }   // el alta tiene su propio flujo (fechas e HC)
        if (!p['ID paciente']) { mostrarAviso('No se pudo cambiar el estado: vuelve a abrir la ficha e inténtalo de nuevo.'); cargarFichas(); return; }
        p[hEst] = valor;
        repintarFichaAbierta();
        function revertir(msg) { p[hEst] = antes; repintarFichaAbierta(); mostrarAviso(msg); }
        llamar('cambiarEstadoPacienteWeb', [p['ID paciente'], valor])
          .then(function(r) {
            if (!r || !r.success) { revertir((r && r.message) || 'No se pudo cambiar el estado.'); cargarFichas(); return; }
            mostrarAviso('Estado cambiado a ' + FichaUsuario.textoEstado(valor) + '.');
            recordarFichas();
            // Avisa a las otras ventanas (Usuarios, Valoraciones), igual que los formularios al guardar.
            try { localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: true, ts: Date.now() })); } catch (err) { /* sin almacenamiento: no es crítico */ }
            if (window.HCCache) HCCache.cambioDeUsuario();   // un usuario nuevo en Activo entra en la precarga de HC
            if (r.ordenado) cargarFichas();   // el servidor reordenó la Maestra: las fichas en memoria (y el orden de sus listas) se refrescan
          }, function(err) { revertir('Error al cambiar el estado: ' + err); });
      }
      // ---------- Gravedad del usuario desde la ficha (chip pulsable, como el estado) ----------
      function menuGravedadFicha(ancla) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var hGrav = FichaUsuario.cabecera(res.headers, 'Gravedad') || 'Gravedad';
        FichaUsuario.menuEstado(ancla, FichaUsuario.gravedadesMenu(res.paciente[hGrav], cambiarGravedadFicha));
      }
      function cambiarGravedadFicha(valor) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var p = res.paciente, hGrav = FichaUsuario.cabecera(res.headers, 'Gravedad') || 'Gravedad', antes = p[hGrav];
        if (FichaUsuario.claseGravedad(antes) === FichaUsuario.claseGravedad(valor)) return;
        if (!p['ID paciente']) { mostrarAviso('No se pudo cambiar la gravedad: vuelve a abrir la ficha e inténtalo de nuevo.'); cargarFichas(); return; }
        p[hGrav] = valor;
        repintarFichaAbierta();
        function revertir(msg) { p[hGrav] = antes; repintarFichaAbierta(); mostrarAviso(msg); }
        llamar('cambiarGravedadPacienteWeb', [p['ID paciente'], valor])
          .then(function(r) {
            if (!r || !r.success) { revertir((r && r.message) || 'No se pudo cambiar la gravedad.'); cargarFichas(); return; }
            mostrarAviso('Gravedad cambiada a ' + valor + '.');
            recordarFichas();
            try { localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: true, ts: Date.now() })); } catch (err) { /* sin almacenamiento: no es crítico */ }
            if (window.HCCache) HCCache.cambioDeUsuario();
            if (r.ordenado) cargarFichas();
          }, function(err) { revertir('Error al cambiar la gravedad: ' + err); });
      }
      // ---------- Teléfonos y observaciones desde la ficha (lápiz: edición directa de ui/JS_Ficha, como en Usuarios) ----------
      function guardarCampoFicha(col, valor) {
        var res = fichaAbierta && fichaDeMemoria(fichaAbierta.nombre);
        if (!res) return;
        var p = res.paciente, h = FichaUsuario.cabecera(res.headers, col) || col, antes = p[h], abierta = fichaAbierta;
        if (!p['ID paciente']) { mostrarAviso('No se pudo guardar: vuelve a abrir la ficha e inténtalo de nuevo.'); cargarFichas(); return; }
        p[h] = valor;
        repintarFichaAbierta();
        function revertir(msg) {
          p[h] = antes; repintarFichaAbierta(); mostrarAviso(msg);
          if (fichaAbierta === abierta && panelAbierto && panelClave === abierta.clave) FichaUsuario.editar(abierta.caja, col, valor, guardarCampoFicha);
        }
        llamar('cambiarDatoFichaPacienteWeb', [p['ID paciente'], col, valor])
          .then(function(r) {
            if (!r || !r.success) { revertir((r && r.message) || 'No se pudo guardar.'); return; }
            if (r.valor !== undefined && r.valor !== p[h]) { p[h] = r.valor; repintarFichaAbierta(); }
            mostrarAviso(Telefono.etiqueta(col) + (valor ? ' guardado.' : ' borrado.'));
            recordarFichas();
            try { localStorage.setItem('pacienteActualizado', JSON.stringify({ guardado: true, ts: Date.now() })); } catch (err) { /* sin almacenamiento: no es crítico */ }
            if (window.HCCache) HCCache.cambioDeUsuario();
            // La tabla de la semana enseña el teléfono 1: se recarga en silencio, como tras editar al usuario desde la historia.
            if (col === 'Teléfono 1' && semanaActual && !document.querySelector('.editando')) cargar(semanaActual, true);
          }, function(err) { revertir('Error al guardar: ' + err); });
      }
      // Alta desde la ficha: usa la cita del usuario en la semana mostrada (mismo proceso que el botón Alta de la fila).
      function altaDesdeFicha(nombre) {
        var cita = CITAS.find(function(x) { return !x._hueco && x['Usuario'] === nombre; });
        if (!cita) { mostrarAviso('Este usuario ya no tiene citas en la semana mostrada: da el alta desde Usuarios.'); return; }
        manejarAltaFila(cita._fila);
      }

      function abrirFichaUsuario(fila) {
        var cita = citaPorFila(fila), nombre = cita ? String(cita['Usuario'] || '').trim() : '';
        if (!nombre) return;
        var clave = 'usuario:' + nombre;
        return abrirPanelLateral(clave, 'Ficha de usuario', false, function(cont) {
          var caja = cont;
          fichaAbierta = { clave: clave, nombre: nombre, caja: caja, html: '' };
          function pintar(res) { fichaAbierta.idPaciente = String((res.paciente && res.paciente['ID paciente']) || ''); fichaAbierta.html = htmlFichaUsuario(res, nombre); FichaUsuario.pintar(caja, fichaAbierta.html); }
          function error(msg) { fichaAbierta.html = ''; FichaUsuario.pintar(caja, FichaUsuario.mensaje(nombre, msg)); }

          var enMemoria = fichaDeMemoria(nombre);
          if (enMemoria) {
            pintar(enMemoria);                                       // instantáneo: sin servidor
            if (Date.now() - FICHAS.t > 60000) cargarFichas();       // y se refresca en segundo plano si ya son "viejas"
          } else {
            // Respaldo: fichas aún sin cargar, o usuario dado de alta después de la última carga.
            FichaUsuario.pintar(caja, FichaUsuario.mensaje(nombre, 'Cargando…'));
            llamar('obtenerFichaUsuarioWeb', [nombre])
              .then(function(res) {
                if (panelClave !== clave) return;
                if (!res || !res.success) { error((res && res.message) || 'No se pudo cargar la ficha.'); return; }
                if (FICHAS.porNombre) {                                  // se guarda para la próxima vez
                  if (!FICHAS.headers.length) FICHAS.headers = res.headers;
                  FICHAS.porNombre[claveFicha(nombre)] = res.paciente;
                  recordarFichas();
                }
                pintar(res);
              }, function(err) { if (panelClave === clave) error('Error al cargar la ficha: ' + err); });
          }

          cont.addEventListener('click', function(e) {
            FichaUsuario.alClic(e, {
              cerrar: function() { cerrarPanel(); },
              estado: menuEstadoFicha,
              gravedad: menuGravedadFicha,
              guardarCampo: guardarCampoFicha,
              accion: function(a) {
                var citaAct = CITAS.find(function(x) { return !x._hueco && x['Usuario'] === nombre; });
                if (a === 'cita') abrirCitaPanel(nombre, fichaAbierta ? fichaAbierta.idPaciente : '');
                else if (a === 'valoracion') abrirValoracionCita(fichaAbierta ? fichaAbierta.idPaciente : '', nombre);
                else if (!citaAct) mostrarAviso('Este usuario ya no tiene citas en la semana mostrada.');
                else if (a === 'whatsapp') abrirWhatsappFila(citaAct._fila);
                else if (a === 'hc') abrirHCFila(citaAct._fila);
              }
            });
          });
          // Un teléfono u observaciones a medio escribir cuentan como cambios sin guardar (la Agenda pregunta antes de cerrar).
          return { haCambiado: function() { return FichaUsuario.hayEdicion(caja); } };
        }, { sinCabecera: true });
      }

      // Ediciones hechas directamente en la hoja (no avisan por localStorage): se recogen al volver a la pestaña
      // si las fichas tienen más de 1 minuto, y cada 5 minutos mientras la agenda está a la vista.
      // Escondida tras Usuarios (página de Usuarios y Agenda) tampoco: se recogen al volver (activar, JS_Agenda_Vistas).
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden && Secciones.activa() === 'agenda' && FICHAS.porNombre && Date.now() - FICHAS.t > 60000) cargarFichas();
      });
      setInterval(function() { if (!document.hidden && Secciones.activa() === 'agenda') cargarFichas(); }, 5 * 60 * 1000);

      // ---------- Panel de resumen (columna derecha) ----------
      var resumenVisible = true, resumenMes = null, resumenSemana = null;
      try { resumenVisible = localStorage.getItem('agendaResumen') !== '0'; } catch (err) { /* sin almacenamiento */ }

      function aplicarResumen() {
        cuerpoSeccion.classList.toggle('con-resumen', !!resumenVisible && vista !== 'cuadricula');
        var b = document.getElementById('btnResumen');
        b.classList.toggle('activo', !!resumenVisible);
        b.title = resumenVisible ? 'Ocultar panel de resumen' : 'Mostrar panel de resumen';
      }
      document.getElementById('btnResumen').addEventListener('click', function() {
        resumenVisible = !resumenVisible;
        try { localStorage.setItem('agendaResumen', resumenVisible ? '1' : '0'); } catch (err) { /* sin almacenamiento */ }
        aplicarResumen();
        renderResumen();
      });

      function diaMesCorto(iso) { return iso.slice(8) + '/' + iso.slice(5, 7); }

      function htmlMiniCal() {
        var base = resumenMes || hoyISO().slice(0, 8) + '01';
        var p = base.split('-').map(Number), y = p[0], m = p[1] - 1;
        var offset = (new Date(y, m, 1).getDay() + 6) % 7;
        var hoy = hoyISO(), ini = semanaActual || '', fin = semanaActual ? sumarDiasISO(semanaActual, 6) : '';
        var html = '<section class="rs-card"><div class="rs-mes"><button type="button" class="rs-nav" data-rs-mes="-1" title="Mes anterior"><span class="material-symbols-outlined">chevron_left</span></button>' +
          '<b>' + MESES_ES[m] + ' ' + y + '</b><button type="button" class="rs-nav" data-rs-mes="1" title="Mes siguiente"><span class="material-symbols-outlined">chevron_right</span></button></div><div class="rs-cal">';
        ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach(function(d) { html += '<span class="rs-dow">' + d + '</span>'; });
        for (var i = 0; i < 42; i++) {
          var dt = new Date(y, m, 1 - offset + i), iso = formatoISO(dt);
          var mk = marcasDia(iso), cls = 'rs-d' + (dt.getMonth() !== m ? ' fuera' : '') + (iso === hoy ? ' hoy' : '') + (mk.festivo ? ' festivo' : '');
          if (ini && iso >= ini && iso <= fin) cls += ' sem' + (iso === ini ? ' sem-ini' : '') + (iso === fin ? ' sem-fin' : '');
          html += '<button type="button" class="' + cls + '" title="' + escapar('Ir al día ' + dt.getDate() + (mk.texto ? ' — ' + mk.texto : '')) + '" data-rs-dia="' + iso + '"><span>' + dt.getDate() + '</span>' +
            (mk.tipos.length ? '<i class="rs-pts">' + mk.tipos.map(function(t) { return '<b class="rs-pt rs-pt-' + t + '"></b>'; }).join('') + '</i>' : '') + '</button>';
        }
        return html + '</div></section>';
      }

      function htmlResumenHoy(hoy, ahora) {
        var delDia = CITAS.filter(function(c) { return c._fechaISO === hoy && !c._hueco; });
        if (!delDia.length) return '';
        var enCurso = delDia.filter(function(c) { return estadoTemporal(c['Hora'] || '', ahora) === 'en-curso'; })[0];
        var prox = filaProxima(hoy, ahora);
        function fila(etq, c) {
          return '<div class="rs-ahora" data-ficha-fila="' + c._fila + '" title="Ver ficha"><span class="rs-etq">' + etq + '</span><span class="rs-h">' + escapar(c['Hora']) + '</span>' +
            '<span class="rs-n">' + avatarHtml(c['Usuario']) + '<span class="nombre-u">' + escapar(c['Usuario']) + '</span></span></div>';
        }
        var cuerpo = (enCurso ? fila('Ahora', enCurso) : '') + (prox ? fila('Próxima', prox) : '');
        return '<section class="rs-card"><h3 class="rs-tit">Hoy</h3>' + (cuerpo || '<div class="rs-vacio">Jornada terminada.</div>') + '</section>';
      }

      function htmlSinRegistrar(hoy, ahora) {
        var pend = CITAS.filter(function(c) {
          if (c._hueco || !vacioTxt(c['Asistencia'])) return false;
          return c._fechaISO < hoy || (c._fechaISO === hoy && estadoTemporal(c['Hora'] || '', ahora) === 'pasada');
        });
        if (!pend.length) return '';
        var filas = pend.slice(0, 6).map(function(c) {
          var dt = c._fechaISO.split('-');
          var dia = DIAS_ES[new Date(+dt[0], +dt[1] - 1, +dt[2]).getDay()].slice(0, 3);
          return '<div class="rs-pend" data-fila="' + c._fila + '"><button type="button" class="rs-pn" data-ficha-fila="' + c._fila + '" title="Ver ficha">' +
            '<span class="rs-pd">' + dia + ' ' + escapar(c['Hora']) + '</span>' + escapar(c['Usuario']) + '</button>' + htmlAsistenciaBotones('', false) + '</div>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Sin registrar <span>' + pend.length + '</span></h3>' + filas +
          (pend.length > 6 ? '<div class="rs-vacio">y ' + (pend.length - 6) + ' más…</div>' : '') + '</section>';
      }

      function htmlResumenRec(hoy) {
        var lista = RECORDATORIOS.filter(function(r) { return !r.hecho && r.tipo !== 'Festivo' && r.fecha && r.fecha <= hoy; })
          .sort(function(a, b) { var x = a.fecha + (a.hora || ''), y = b.fecha + (b.hora || ''); return x < y ? -1 : (x > y ? 1 : 0); });
        var filas = lista.slice(0, 5).map(function(r) {
          var t = recInfo(r.tipo), atras = r.fecha < hoy;
          return '<button type="button" class="rs-rec rc-t-' + t[1] + (atras ? ' atrasado' : '') + '" data-rec-id="' + escapar(r.id) + '" title="' + escapar(recTitulo(r)) + '">' +
            '<span class="material-symbols-outlined">' + t[0] + '</span><span class="rs-rec-txt">' + escapar(r.texto) + '</span>' +
            '<span class="rs-rec-f">' + (atras ? diaMesCorto(r.fecha) : (r.hora ? escapar(r.hora) : 'Hoy')) + '</span></button>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Recordatorios <button type="button" class="rs-mas" data-rs-rec-nuevo title="Añadir recordatorio"><span class="material-symbols-outlined">add</span></button></h3>' +
          (filas || '<div class="rs-vacio">Nada pendiente para hoy.</div>') +
          (lista.length > 5 ? '<button type="button" class="rs-link" title="Ver todos los recordatorios pendientes" data-rs-rec-todos>Ver los ' + lista.length + ' pendientes</button>' : '') + '</section>';
      }

      function htmlFestivosResumen(hoy) {
        var fest = RECORDATORIOS.filter(function(r) { return r.tipo === 'Festivo' && r.fecha && r.fecha >= hoy; })
          .sort(function(a, b) { return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0); }).slice(0, 4);
        if (!fest.length) return '';
        var filas = fest.map(function(r) {
          return '<button type="button" class="rs-rec rc-t-festivo" data-rec-id="' + escapar(r.id) + '" title="' + escapar(nombreFestivo(r)) + '"><span class="material-symbols-outlined">flag</span>' +
            '<span class="rs-rec-txt">' + escapar(nombreFestivo(r)) + '</span><span class="rs-rec-f">' + (r.fecha === hoy ? 'Hoy' : diaMesCorto(r.fecha)) + '</span></button>';
        }).join('');
        return '<section class="rs-card"><h3 class="rs-tit">Festivos</h3>' + filas + '</section>';
      }

      function htmlResumenSemana() {
        var citas = 0, libres = 0, reg = 0;
        CITAS.forEach(function(c) { if (c._hueco) libres++; else { citas++; if (!vacioTxt(c['Asistencia'])) reg++; } });
        if (!citas && !libres) return '';
        return '<section class="rs-card"><h3 class="rs-tit">Esta semana</h3><div class="rs-cifras"><div><b>' + citas + '</b><span>Citas</span></div>' +
          '<div><b>' + libres + '</b><span>Libres</span></div><div><b>' + (citas ? Math.round(reg * 100 / citas) : 0) + '%</b><span>Registradas</span></div></div></section>';
      }

      function renderResumen() {
        var el = document.getElementById('resumen');
        if (!el || !resumenVisible) return;
        if (resumenSemana !== semanaActual) {
          resumenSemana = semanaActual;
          if (semanaActual) resumenMes = sumarDiasISO(semanaActual, 2).slice(0, 8) + '01';
        }
        var hoy = hoyISO(), ahora = ahoraHHmm();
        el.innerHTML = htmlMiniCal() + htmlResumenHoy(hoy, ahora) + htmlSinRegistrar(hoy, ahora) + htmlResumenRec(hoy) + htmlFestivosResumen(hoy) + htmlResumenSemana();
      }

      document.getElementById('resumen').addEventListener('click', function(e) {
        var t = e.target, c;
        if ((c = t.closest('[data-asis]'))) {
          var cont = c.closest('[data-fila]');
          if (cont) guardarAsistencia(cont.dataset.fila, c.dataset.asis);
          return;
        }
        if ((c = t.closest('[data-ficha-fila]'))) { abrirFichaUsuario(c.dataset.fichaFila); return; }
        if ((c = t.closest('[data-rs-mes]'))) {
          var p = (resumenMes || hoyISO().slice(0, 8) + '01').split('-').map(Number);
          resumenMes = formatoISO(new Date(p[0], p[1] - 1 + Number(c.dataset.rsMes), 1));
          renderResumen();
          return;
        }
        if ((c = t.closest('[data-rs-dia]'))) {
          var iso = c.dataset.rsDia, wrap = document.getElementById('agTablaWrap');
          var enSemana = semanaActual && iso >= semanaActual && iso <= sumarDiasISO(semanaActual, 6);
          if (enSemana) {
            fijarVista('semana'); render();
            var banda = wrap.querySelector('tr.fila-dia[data-dia="' + iso + '"]');
            if (banda) { plegadoManual[iso] = false; render(); banda = wrap.querySelector('tr.fila-dia[data-dia="' + iso + '"]'); wrap.scrollTop = Math.max(0, banda.getBoundingClientRect().top - wrap.getBoundingClientRect().top + wrap.scrollTop); }
          } else { fijarVista('semana'); cargar(iso); }
          return;
        }
        if ((c = t.closest('[data-rec-id]'))) { abrirRecordatorios({ editarId: c.dataset.recId }); return; }
        if (t.closest('[data-rs-rec-nuevo]')) { abrirRecordatorios({ fecha: hoyISO() }); return; }
        if (t.closest('[data-rs-rec-todos]')) { abrirRecordatorios(); return; }
      });
      setInterval(function() { if (Secciones.activa() === 'agenda') renderResumen(); }, 60000);   // «Ahora / Próxima» avanza con el reloj (escondida, al volver)

      document.getElementById('btnImprimir').addEventListener('click', function() { window.print(); });
      window.addEventListener('beforeprint', function() {
        if (Secciones.activa() !== 'agenda') return;   // se imprime Usuarios: la Agenda no se toca
        imprimiendo = true;
        var etq = vista === 'hoy' ? 'Hoy' : document.getElementById('etiquetaSemana').textContent;
        document.getElementById('cabImpresion').innerHTML = '<b>Agenda · ' + escapar(etq) + '</b><span>Impreso el ' + new Date().toLocaleDateString('es-ES') + '</span>';
        render();
      });
      window.addEventListener('afterprint', function() { if (!imprimiendo) return; imprimiendo = false; render(); });
      // Píldora flotante fuera de la cabecera, pero dentro de la sección (se esconde con ella en la página de Usuarios y Agenda).
      (document.querySelector('.bloque-seccion[data-seccion="agenda"]') || document.body).appendChild(document.getElementById('barraSeleccion'));
      actualizarBotonHuecos();
      aplicarResumen();
      // En la página de Usuarios y Agenda, si se abre en Usuarios, la semana se pide después de la tabla de Usuarios.
      if (Secciones.activa() === 'agenda') cargar(); else OrdenCarga.despues(function() { cargar(); }, 300);
      // Primero la semana (cargar); al llegar, los recordatorios y las fichas (en segundo plano: cuando lleguen, abrir una
      // ficha ya no necesita al servidor). OrdenCarga y el tope de espera: ui/JS_Carga_Compartida.
      OrdenCarga.despues(function() { cargarRecordatorios(); cargarFichas(); }, 0);
